ealthy-daily-routine","note":"健康作息这张卡的题面和 P3"},"ri":{"short":"Reading IELTS","name":"Reading IELTS《IELTS Speaking Part 2 & 3 From September to December 2026》","date":"2026-10","url":"https://www.readingielts.com/ielts-speaking-part-2-from-september-to-december-2026/","note":"节省时间这张卡的题面和 P3"}},"hot":{"range":"9 月 26 日 – 10 月 2 日","source":"week","p1":["feeling-bored","computers","work-study","collecting","lost-found","politeness","paper","opportunities","street-market","friends"],"p2":["save-time","gift","know-more","lost-public","healthy-habits","least-movie","exciting-book","interview","older-admire","course"]},"core":[{"id":"work-study","en":"Work or studies","zh":"工作或学习","see":["a-p1-study"]},{"id":"hometown","en":"Hometown","zh":"家乡","see":["a-p1-hometown"]},{"id":"home","en":"Home & Accommodation","zh":"住所","see":["a-p1-home"]}],"p1":[{"id":"computers","en":"Computers and tablets","zh":"电脑和平板","tags":["mainland"],"src":["xdf","chelsea","joe","ez"],"qs":[["Would you like to use a computer or tablet?","你想用电脑或平板吗？"],["In what conditions would you use a computer or tablet?","在什么情况下你会用电脑或平板？"],["When was the first time you used a computer or tablet?","你第一次用电脑或平板是什么时候？"],["What would your life be like without computers or tablets?","没有电脑或平板，你的生活会怎样？"],["In what conditions would it be difficult for you to use a computer or tablet?","在什么情况下，你会觉得用电脑或平板很困难？"]],"tip":"从用途（学习、工作、娱乐）切入，再讲第一次用的经历。","see":["a-p1-websites"]},{"id":"street-market","en":"Street markets","zh":"街头市场","tags":["mainland"],"src":["xdf","chelsea","ez"],"qs":[["Are there many street markets in China?","中国有很多街头市场吗？"],["When was the last time you went to a street market?","你上一次去街头市场是什么时候？"],["Do you prefer to go shopping in the shopping mall or on the street market?","你更喜欢在商场还是街头市场买东西？"],["What do people usually buy on the street market?","人们通常在街头市场买什么？"]],"tip":"选一个你熟悉的市场，说卖什么、价格怎么样、你为什么喜欢或不喜欢。","see":["a-p1-shopping"]},{"id":"shoes","en":"Shoes","zh":"鞋子","tags":["mainland"],"src":["xdf","chelsea","joe","ez"],"qs":[["Which do you prefer, fashionable shoes or comfortable shoes?","你更喜欢时尚的鞋还是舒适的鞋？"],["How much money do you usually spend on shoes?","你一般在鞋子上花多少钱？"],["Have you ever bought shoes online?","你在网上买过鞋吗？"],["Do you like buying shoes? How often?","你喜欢买鞋吗？多久买一次？"],["What is your favourite type of shoes?","你最喜欢哪种鞋？"]],"tip":"先表明立场（舒适或时尚），再给一个原因和一个例子。和原作者的 Clothing 素材相近。","see":["a-p1-clothing"]},{"id":"paper","en":"Paper","zh":"纸张","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["Do you carry paper and pens with you when you go out?","你出门会带纸和笔吗？"],["Do people still keep handwritten letters today?","现在人们还会保存手写信吗？"],["Do you still write physical letters?","你还会写纸质信吗？"],["What did you like to do with paper as a child?","小时候你喜欢用纸做什么？"],["Have you made any crafts with paper?","你用纸做过手工吗？"]],"tip":"从怀旧角度切入，比如小时候折纸、给长辈写信的具体细节。和 Emails 话题的手写信素材能共用。"},{"id":"tiredness","en":"Tiredness","zh":"疲劳","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["What do you do when you feel tired?","你觉得累的时候会做什么？"],["When would you feel tired?","什么时候你会觉得累？"],["Do you often feel tired?","你经常觉得累吗？"],["When you feel tired, do you still go out with your friends?","累的时候你还会和朋友出去吗？"]],"tip":"先说原因（学习、工作、睡眠不足），再说缓解方式（睡觉、运动、听音乐）。"},{"id":"rubbish","en":"Rubbish and recycling","zh":"垃圾与回收","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["Did you recycle when you were a kid?","小时候你做过回收吗？"],["Is waste sorting common in your country?","你的国家垃圾分类普遍吗？"],["How do you recycle things like paper and plastic?","你怎么回收纸和塑料这类东西？"],["What do you do when you see rubbish on the street?","你看到街上有垃圾会怎么做？"]],"tip":"讲自己家或学校的分类做法，再加一个观点（政府和个人都要参与）。原作者 P2-9 的“山上垃圾”细节可以拿来用。","see":["a-p2-09"]},{"id":"collecting","en":"Collecting things","zh":"收集东西","tags":["mainland"],"src":["xdf","chelsea","joe","week"],"qs":[["Do you collect things?","你收集东西吗？"],["Where do you usually keep things you need?","你通常把需要的东西放在哪里？"],["Would you keep old things for a long time? Why?","你会长期保留旧东西吗？为什么？"],["Are there any things you have kept from your childhood?","有没有你从小保留下来的东西？"]],"tip":"说收集什么、为什么开始、对它有什么感情。小众但真实的爱好更好讲。"},{"id":"lost-found","en":"Lost and found","zh":"失物招领","tags":["mainland"],"src":["xdf","chelsea","joe","week"],"qs":[["Have you ever lost your keys?","你丢过钥匙吗？"],["Will you post on social media if you lose your item?","如果丢了东西，你会在社交媒体上发帖吗？"],["Have you ever lost things?","你丢过东西吗？"],["Do you report to the police when finding something lost by others? Why?","捡到别人丢的东西，你会报警吗？为什么？"],["What will you do if you find something lost by others?","如果你捡到别人丢的东西，你会怎么做？"]],"tip":"讲一次丢东西或捡东西的经历，按“时间 - 地点 - 结果”组织。和 Part 2“公共场所丢东西”共用一个故事。","link":["lost-public"]},{"id":"plants","en":"Flowers / Plants","zh":"花和植物","tags":["mainland"],"src":["xdf","ez"],"qs":[["Do you keep plants at home?","你家里养植物吗？"],["What plant did you grow when you were young?","你小时候种过什么植物？"],["Do you know anything about growing plants?","你懂种植物吗？"],["Do people in your country send plants as gifts?","在你的国家，人们会送植物当礼物吗？"]],"tip":"具体说一种植物（绿萝、多肉），讲你怎么照顾它。","note":"新东方列为大陆新题，只给了中文“你喜欢花吗？你家养植物吗？”。英文题目取自 EzIELTS 往季的 Plants 话题，本季具体问法待核对。"},{"id":"travelling","en":"Travelling","zh":"旅行","tags":[],"src":["jsl","chelsea","joe","ez"],"qs":[["Do you prefer to sit by the window when travelling?","旅行时你更喜欢坐在窗边吗？"],["Did you have a long journey with your family as a child?","小时候你和家人有过长途旅行吗？"],["What do you usually do during a long journey?","长途旅行时你通常做什么？"],["Do you prefer travelling alone or with other people?","你更喜欢一个人旅行还是和别人一起？"],["What is the longest journey you have ever taken?","你去过最远的一次旅行是哪次？"]],"tip":"说交通方式（火车、飞机、自驾），再讲一次具体的旅行。阳朔攀岩的故事可以直接用。","see":["a-p2-01"]},{"id":"politeness","en":"Politeness","zh":"礼貌","tags":[],"src":["jsl","chelsea","joe","ieltsa","week"],"qs":[["What did you do to show your politeness as a child?","小时候你是怎么表现礼貌的？"],["On what occasions should we be polite?","我们在什么场合应该有礼貌？"],["Do you think being polite is very important?","你认为礼貌很重要吗？"],["How did you learn to be polite as a child?","你小时候是怎么学会礼貌的？"]],"tip":"从“小时候”和“现在”两个角度讲，各举一个具体例子（比如见到长辈主动问好）。"},{"id":"fruit-veg","en":"Fruit and vegetables","zh":"水果和蔬菜","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Do people in your country like planting vegetables?","你的国家的人喜欢种菜吗？"],["Were there any kind of fruits and vegetables you disliked as a child?","小时候有没有你不喜欢吃的水果或蔬菜？"],["What kind of fruits and vegetables do you dislike?","你不喜欢哪些水果和蔬菜？"],["Where do you usually buy fruit and vegetables?","你通常在哪里买水果和蔬菜？"],["How often do you eat fruit and vegetables?","你多久吃一次水果和蔬菜？"],["Do you like eating vegetables?","你喜欢吃蔬菜吗？"],["Did you like eating vegetables when you were a child?","你小时候喜欢吃蔬菜吗？"],["Do people often grow vegetables by themselves?","人们经常自己种菜吗？"]],"tip":"说具体的品种、购买地点和吃的频率，细节越具体越自然。"},{"id":"advertisement","en":"Advertisement","zh":"广告","tags":[],"src":["chelsea","joe","ez"],"qs":[["Do you often see advertisements when you are on your phone or computer?","你用手机或电脑时经常看到广告吗？"],["What kind of advertising do you like?","你喜欢哪种广告？"],["Do you like advertisements?","你喜欢广告吗？"],["Do you see a lot of advertising on trains or other transport?","你在火车或其他交通工具上会看到很多广告吗？"],["Is there an advertisement that made an impression on you when you were a child?","小时候有没有一则给你留下深刻印象的广告？"]],"tip":"选一种广告（短视频广告、地铁广告），说你的态度和原因。P3 必备里的“消费与广告”语料可以直接用。","see":["a-p3-base"]},{"id":"name","en":"Name","zh":"名字","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Do you often forget people's names?","你经常忘记别人的名字吗？"],["How do you feel when people can't remember your name?","别人记不住你的名字时，你有什么感受？"],["How do you remember people's names?","你是怎么记住别人名字的？"],["Is it easy for you to remember people's names?","你容易记住别人的名字吗？"]],"tip":"说你记名字的方法（联想、重复、写下来），再讲一次记不住名字的尴尬经历。"},{"id":"secondary-school","en":"Secondary school","zh":"中学","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Is there anything you miss about your secondary school?","你有没有怀念中学的什么？"],["What was your favourite subject at secondary school?","你中学时最喜欢的科目是什么？"],["Were there any subjects that you found difficult at secondary school?","中学时有没有你觉得很难的科目？"],["Do you remember your first day at secondary school?","你还记得中学的第一天吗？"]],"tip":"选一个科目或一位老师，讲具体回忆，多用过去时。原作者 teacher 话题的素材能接上。","see":["a-p1-teacher"]},{"id":"feeling-bored","en":"Feeling bored","zh":"无聊","tags":["later"],"src":["week","joe","ez","sf"],"qs":[["Do you often feel bored?","你经常觉得无聊吗？"],["When would you feel bored?","你什么时候会觉得无聊？"],["What do you do when you feel bored?","无聊的时候你会做什么？"],["What sort of things do you find most boring now?","现在你觉得什么事最无聊？"],["What do you do to stop yourself feeling bored?","你怎么让自己不无聊？"],["Did you ever find school boring when you were a child?","小时候你觉得上学无聊吗？"],["Do you think childhood is boring or adulthood is boring?","你觉得童年更无聊还是成年更无聊？"]],"tip":"举一个具体的无聊场景（排队、堵车、等人），再说你怎么打发时间。原作者 P2-7 堵车时听播客、给爷爷奶奶打电话的细节正好能用。","see":["a-p2-07"]},{"id":"opportunities","en":"Opportunities","zh":"机会","tags":["later"],"src":["week","joe","ez","ieltsa"],"qs":[["Is it important to seize opportunities when they come?","机会来了就要抓住，这重要吗？"],["Would you like to have more opportunities in the future? Why?","你希望将来有更多机会吗？为什么？"],["What would you do if you had more opportunities?","如果有更多机会，你会做什么？"],["How can you get more opportunities?","怎样才能获得更多机会？"],["Do you have many opportunities in life?","你生活中机会多吗？"],["Did you get many opportunities to try new activities when you were younger?","你小时候有很多尝试新活动的机会吗？"]],"tip":"用一次抓住机会的经历回答，比如实习、做志愿者（原作者 P2-8 的自动驾驶实习）。Ieltsa 的问法偏“小时候尝试新事物的机会”，兴趣班也能讲。","see":["a-p2-08"]},{"id":"friends","en":"Friends","zh":"朋友","tags":["later"],"src":["week","ez","sf"],"qs":[["Do you have a friend you have known for a long time?","你有认识很久的朋友吗？"],["What do you usually do with your friends?","你通常和朋友做什么？"],["Do you prefer to spend time with one friend or a group?","你更喜欢和一个朋友还是一群朋友待在一起？"],["How important are friends to you?","朋友对你有多重要？"],["Would you invite friends to your home?","你会邀请朋友来家里吗？"]],"tip":"固定一个老朋友（认识多久、怎么认识），后面几题都围绕他答，不用每题重新想人。"},{"id":"punctuality","en":"Punctuality","zh":"守时","tags":["later"],"src":["ez","sf"],"qs":[["Are you a punctual person?","你是守时的人吗？"],["Do you think it is important to be on time?","你觉得准时重要吗？"],["How do you feel when others are late?","别人迟到时你有什么感受？"],["How do you remind yourself to be on time?","你怎么提醒自己准时？"],["Why are some people consistently late?","为什么有些人总是迟到？"]],"tip":"说一个守时的习惯（提前 10 分钟出门、手机设闹钟），再讲一次别人迟到的小事。"},{"id":"emails","en":"Emails","zh":"邮件","tags":["later"],"src":["ez","sf"],"qs":[["Do you often send emails?","你经常发邮件吗？"],["Do you think sending emails will be more or less popular in the future?","你觉得以后发邮件会更普遍还是更少？"],["Did you receive any handwritten letters when you were a child?","小时候你收到过手写信吗？"],["Which do you prefer, writing a letter or sending a message?","你更喜欢写信还是发消息？"]],"tip":"学生发邮件多用于联系老师、投简历。手写信的部分和 Paper 话题共用素材。","link":["paper"]}],"p1Overseas":[{"en":"Day off","zh":"休息日"},{"en":"Dreams","zh":"梦境"},{"en":"Keys","zh":"钥匙"}],"categories":{"person":"人物","place":"地点","thing":"物品","event":"事件"},"p2":[{"id":"know-more","cat":"person","zh":"一见且想继续了解的人","alias":"想要了解更多的人","tags":["mainland"],"en":"Describe a person you only met once recently and want to know more about","say":["Who he/she is","When you met him/her","Why you want to know more about him/her","And explain how you feel about him/her"],"src":["xdf","chelsea","ez","sf","week"],"note":"补充包原来把新东方的“想要了解更多的人”和 Chelsea 的“一见且想继续了解的人”分成两题，其实是同一张卡，这里合并。","tip":"旅行或活动里只见过一次的人，比如在阳朔民宿遇到的攀岩者。重点讲“为什么想多了解”：他做的事你也想做。","p3":["What should we not talk about when we meet a person for the first time?","What can we do to leave a good impression on people we meet for the first time?","What qualities make true friends?","Is it important to have the same hobbies and interests when making friends?","On what occasions do people like to make friends?","How do people make friends in your country?"],"see":["s-p2-know-more"]},{"id":"taught-skill","cat":"person","zh":"教会你新技能的人","tags":["mainland"],"en":"Describe a person who taught you a new skill","say":["Who this person was","What the skill was","How you learned it","And explain how you felt about this person"],"src":["xdf","chelsea","joe"],"tip":"攀岩教练或攀岩搭档教你户外攀岩（原作者 P2-1、P2-2 的阳朔故事）。按“一开始很难 → 他怎么教 → 学会后的感受”讲。","see":["a-p2-01","a-p2-02"],"seeNote":"借《P2-1 / P2-2》里攀岩教练带练、从零学攀岩的经历与动词短语，不是借“推荐旅行地”的段落结构。","p3":["Why is self-discipline important when learning a new skill?","What are the differences between learning from a teacher and learning by oneself?","How do adults learn a new skill?","How can parents and teachers teach children new skills?","Where can children learn new skills?","Why should children learn new skills?"]},{"id":"success-business","cat":"person","zh":"有成功事业的人","alias":"在成功公司工作的人","tags":["mainland"],"en":"Describe a person you know who has a successful business","say":["Who this person is","How you got to know him/her","Why and how he/she started the business","What business he/she does","And explain why you think the business is successful"],"src":["xdf","joe","ieltsa"],"note":"新东方只给了中文题名“在成功公司工作的人”，没有英文题卡。Joe Speaking、Ieltsa 本季收录的相近题是这张，先按它准备。","tip":"家里做生意的亲戚、实习公司的老板都可以。讲清做什么生意、怎么起步、为什么成功（服务好、坚持、抓住机会）。","p3":["Why do some people start their own business?","Should governments provide financial support to start-ups?","Do most people prefer shopping at big stores or small stores?","What makes a business successful?","What makes a business fail?","Is it easy to set up a new business in your country?"],"see":["s-p2-business"]},{"id":"photos","cat":"person","zh":"爱拍照的人","tags":["mainland"],"en":"Describe a person you know who really likes taking photos","say":["Who the person is","When and how you got to know him/her","Where he/she takes photos","And explain how you feel about him/her"],"src":["xdf","chelsea","joe","ieltsa"],"tip":"可以把原作者 P2-2 里一起爬山看日出的攀岩搭档改成爱拍照的人：每天拍日出、拍攀岩。","see":["a-p2-02"],"p3":["Why are some people keen on taking photos?","What kind of photos do people often take?","When do people like taking photos?","Do you think it is okay to take photos everywhere?","Why do tourists like taking photos while they are travelling?","Some people do not mind others walking into their shots when they are taking photos. What do you think?"]},{"id":"difficult-success","cat":"person","zh":"做了一件困难的事并成功的人","tags":[],"en":"Describe a person you know who did something difficult and was successful","say":["Who this person is","What difficult thing this person did","Why this person was successful","And explain how you feel about this person"],"src":["jsl","chelsea","joe"],"tip":"基普乔格两小时内跑完马拉松（原作者 P2-5），或表哥坚持学中医（P2-4）。讲清难在哪、怎么做到。注意 P3 全在问公司和创业。","see":["a-p2-05","a-p2-04"],"p3":["In which sectors are companies more likely to succeed in your country?","Is it easy to start up a company?","Other than making money, what is more important for a company?","Does money equal success?","How can companies help protect the environment?","Is it difficult to do business in today's world?"]},{"id":"older-admire","cat":"person","zh":"尊敬的比你年长的人","tags":[],"en":"Describe someone who is older than you that you admire","say":["Who this person is","How you knew this person","What kinds of things you like to do together","And explain how you feel about this person"],"src":["jsl","chelsea","joe","ieltsa","week"],"tip":"爸爸：爱跑步，带你看破 2 马拉松直播（原作者 P2-5）。也可以是爷爷奶奶、老师。","see":["a-p2-05"],"p3":["What do old people usually do in their daily life?","Why is there a generation gap between the young and the old?","Has old people's life quality improved when compared to the past?","What can young and old people learn from each other?","What sports are popular among older people?","What kinds of things do the elderly remember for a long time?"]},{"id":"happy","cat":"person","zh":"快乐的人","tags":[],"en":"Describe a happy person you know","say":["Who this person is","What he/she is like","How he/she shows happiness","And explain why you think he/she is a happy person"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"一个总是笑的朋友或长辈。用两件小事说明他怎么表现快乐，结尾说他为什么快乐（知足、爱好多）。","p3":["When do you think people are happiest?","How can the arts spread positive emotions in society?","Do you think teachers are able to spot the unhappy children?","Should teachers know what children are doing all the time?","What would make a student happy at school?","Do you think doing a job that you like is more important than other things?"],"see":["s-p2-know-more"]},{"id":"organized","cat":"person","zh":"很有条理的人","tags":[],"en":"Describe a person you know who is very organized","say":["Who this person is","What this person usually does to stay organized","In what situations you have noticed this quality","And explain why you think being organized is important to him/her"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"学霸同学或表哥：每天列计划、东西放得整齐、考试前按计划复习。可以和“有健康作息的人”共用一个人。","link":["healthy-habits"],"p3":["Why is it important for people to be organized?","Do you think it is important for managers to be well organized?","Should parents teach their children to be organized?","Do you think children should learn to be organized from a young age?","What can people do to become more organized?","Are organized people more likely to be successful at work or in their studies?"],"see":["s-p2-business"]},{"id":"popular","cat":"person","zh":"受欢迎的人","tags":[],"en":"Describe a popular person","say":["Who this person is","What kind of person he or she is","When you see him/her normally","And explain why you think this person is popular"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a person you know who is popular with many people。","tip":"班上人缘好的同学或一位老师。P3 会问好老师的品质，准备一两个观点。","p3":["Why do people want to be popular?","Is it easier to become popular nowadays?","What are the qualities of being a good teacher?","Do you think good teachers are always popular among students?","Is it important for a teacher to be popular?","Why are some students popular in school?"],"see":["s-p2-know-more"]},{"id":"sportsperson","cat":"person","zh":"钦佩的运动员","tags":[],"en":"Describe a successful sportsperson you admire","say":["Who he/she is","What you know about him/her","What he/she is like in real life","What achievement he/she has made","And explain why you admire him/her"],"src":["chelsea","joe","ez","ieltsa"],"note":"Ieltsa 还收录了相近的“在比赛中表现很好的运动员”（a sportsperson you know about who did very well at an event）。","tip":"基普乔格（原作者 P2-5 有现成素材），讲成就和他自律的一面。","see":["a-p2-05"],"p3":["What qualities should an athlete have?","Is talent important in sports?","Is it easy to identify children's talents?","Why are there so few top athletes?","What is the most popular sport in your country?","Should students have physical education and do sports at school?"]},{"id":"history","cat":"person","zh":"学习并喜欢历史的人","tags":[],"en":"Describe a person who learns history and loves history","say":["Who this person is","How he/she learns history","Why he/she loves history","And explain how you feel about him/her"],"src":["chelsea","joe","ieltsa","sf"],"tip":"爱看纪录片、逛博物馆的朋友或家人。讲他怎么学（看书、去博物馆、看纪录片）。","p3":["Besides big historical events, what else is important when learning history?","Do you think people should learn ancient history before learning modern history?","Is it important to learn how people in the past lived their lives?","How do children learn history before they attend school?","At what age do you think people should begin to learn history?","Do you think children should begin learning history from an early age?","Do you like learning history?"],"see":["s-p2-know-more"]},{"id":"fitness-helped","cat":"person","zh":"你帮他改善健康的人","tags":[],"en":"Describe a person whose health and fitness you have helped to improve","say":["Who this person was","Why you helped him/her","How you helped him/her","And explain whether it was easy or difficult"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法是“一个为改善健康做了些事的人”（a person you know who did something to improve his/her health and fitness），方向和这里相反，两种都准备一下。","tip":"带朋友或爸爸一起跑步、控制饮食，难点是坚持。可以借原作者跑西安马拉松的经历（P1 其他）。","see":["a-p1-other"],"seeNote":"借《P1 Hobbies》的运动类词汇，人物和情节要自己写。","p3":["What effect does stress have on health?","Which group pays more attention to health, young people or old people?"]},{"id":"handmade","cat":"person","zh":"擅长做手工的人","tags":[],"en":"Describe a person who is good at making things by hand","say":["Who this person is","What he/she makes","What materials or technologies he/she uses","And explain why you think this person is good at making things by hand"],"src":["chelsea","joe","ieltsa","sf"],"tip":"会做木工、折纸、做饭的长辈或同学。讲他做什么、用什么材料。P1 Paper 的折纸素材可以接上。","link":["paper"],"p3":["Why do some children enjoy making things by hand?","Do children these days still like doing arts and crafts?","Do you think art classes are important for children?","Is it good to have creative people in a team?","Does art, like music or theater, have an impact on society?","What impact can artistic buildings have on society?"],"see":["s-p2-business"]},{"id":"local-famous","cat":"person","zh":"本地名人","tags":[],"en":"Describe a famous person in your local area","say":["Who this person is","What he/she has done","Why he/she is popular","And explain how you feel about this person"],"src":["jsl","chelsea","ez","sf"],"tip":"当地有名的店主、运动员或作家都行。P3 只报了两道，都在问“受欢迎的学生”，可以和“受欢迎的人”一起准备。","link":["popular"],"p3":["Why are some students popular?","Is it always good to be a popular student at school?"],"see":["s-p2-business"]},{"id":"healthy-habits","cat":"person","zh":"有健康习惯和作息的人","tags":["later"],"en":"Describe a person you know who has healthy habits and a healthy daily routine","say":["Who this person is","How you got to know each other","What he/she does to keep this lifestyle","And explain how you feel about him/her"],"src":["week","roop"],"note":"9/26–10/2 考情周报的高频话题，题卡来自 English with Roop（10 月 8 日）。","tip":"早睡早起、每天运动的朋友，可以用原作者 P2-2 里每天 5:30 起床爬山的攀岩搭档。讲他每天怎么做，再说对你的影响。","see":["a-p2-02"],"p3":["Does the government play an important role in promoting a healthy lifestyle in a community?","Do you think it is important to live in a community where people have healthy lifestyles?","How can people relieve stress in daily life?","What effect does stress have on health?","What makes people stressed?","Which group pays more attention to health, young people or old people?"]},{"id":"free-time-place","cat":"place","zh":"有空时想去的地方","alias":"想去旅行的地方","tags":["mainland"],"en":"Describe a place you would like to visit in your free time","say":["Where it is","What you will do there","How long you will stay there","And explain why you would like to visit it"],"src":["xdf","ez"],"note":"新东方只给了中文题名“想去旅行的地方”，最接近的英文题卡是 EzIELTS 收录的这张。原作者 P2-3 就是这道题。","tip":"原作者 P2-3 有现成答案（阳朔）。","see":["a-p2-03"],"p3":["Why do you think some people choose not to travel abroad?","Do you think a gap period in life is important?"]},{"id":"boring-place","cat":"place","zh":"无聊的地方","tags":["mainland"],"en":"Describe a boring place","say":["Where it is","Who you went there with","What you did there","And explain why you think it is a boring place"],"src":["xdf","joe","ieltsa","sf"],"tip":"原作者 P2-7：去秦岭路上堵车两小时，到了山脚到处是垃圾。","see":["a-p2-07"],"p3":["Why do most children think education is boring?","Why aren't young people willing to listen to the experiences of older people?","What can people do when they feel bored?","Why are some teachers' classes boring? Are there any solutions?","Why do some young people feel bored when talking with old people?","Do most people think news about celebrities is boring?"]},{"id":"short-trip","cat":"place","zh":"经常去但不喜欢的短途旅行","alias":"不喜欢但经常去的地方","tags":["mainland"],"en":"Describe a short trip you often take but do not like","say":["Where you go","When you go there","Why you go there","And explain why you do not like the trip"],"src":["xdf","chelsea","joe","ieltsa"],"note":"新东方的“不喜欢但经常去的地方”应是这张卡的中文说法，合并为一题。","tip":"每天或每周的通勤：挤地铁、堵车（可以借原作者 P2-7 的堵车细节）。说清楚为什么不得不去。","see":["a-p2-07"],"p3":["Which is better for knowing more about a country, travelling or reading books about it?","How much time do you think people should spend on a trip abroad?","Who prefers travelling abroad, the young or the old?","Do people in your country like travelling abroad?","What are the benefits of travelling abroad?","What problems does it cause for transportation when everyone commutes at the same time?"]},{"id":"noisy","cat":"place","zh":"嘈杂的地方","tags":[],"en":"Describe a noisy place you have been to","say":["Where it is","When you went there","What you did there","And explain why you feel it's a noisy place"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"节假日的景区、施工的街道，或原作者 P2-12 里广州写字楼外的繁忙街道。可以和“拥挤的地方”共用。","see":["a-p2-12"],"seeNote":"借《P2-12》里“楼内压抑、待不住”的负面描述写嘈杂不适；若嫌牵强，可改用《P2-7》交通拥堵那篇的噪音细节。","link":["crowded"],"p3":["What kinds of noises are there in our life?","Which area is exposed to noise more, the city or the countryside?","How would people usually respond to noises in your country?","How can people consider others' feelings when chatting in public?","Do you think it is good for children to make noise?","Should children not be allowed to make noise under any circumstances?"]},{"id":"crowded","cat":"place","zh":"拥挤的地方","tags":[],"en":"Describe a crowded place you went to","say":["Where it was","When you went there","Who you went there with","What you did there","And explain how you felt about the experience"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a time when you went to a crowded place。","tip":"国庆去景区、春运火车站。可以和“嘈杂的地方”共用一个故事。","link":["noisy"],"p3":["Why do people go to crowded places?","Do you think there are some people who enjoy crowded places?","Which cities are overcrowded in your country?","Do you think it is a good trend to have more big cities?","Will there be more or less green space in cities in the future?","Will people use bikes more or less in cities in the future?"],"see":["s-p2-food-party"]},{"id":"natural-city","cat":"place","zh":"城市里喜欢去的自然之地","tags":[],"en":"Describe a natural place in your city that you enjoy visiting","say":["Where it is","What it is like","How often you go there","Who you often go there with","And explain why you enjoy visiting there"],"src":["jsl","chelsea","joe","sf"],"note":"相近问法：Ieltsa 的 a place where you enjoy spending time in nature。","tip":"城市公园、江边步道。原作者 P1 park 话题的素材可以用。","see":["a-p1-park"],"seeNote":"借《P1 Park》里公园、绿地的描述，用于“城市里的自然之地”。","p3":["Do you think there should be many natural places in cities?","Do you think staying in a natural place would help change people's mood?","What kind of people do you think enjoy being in nature?","Do you think people should spend more time in nature?","What can the government do to encourage people to spend more time in nature?","Which is more important, protecting the environment or developing the economy?"]},{"id":"near-nature","cat":"place","zh":"去过的靠近自然的地方","tags":[],"en":"Describe somewhere near a natural place that you have been to","say":["Where this place is","Who you went there with","Why you went there","And explain how you feel about the place"],"src":["chelsea","ez"],"tip":"秦岭或阳朔（原作者 P2-7、P2-1）。","see":["a-p2-01","a-p2-07"],"p3":["Are there any natural attractions that are great to visit?","Do you think it is necessary to include natural spaces in a city?","Do you think people who live in natural places are more likely to protect it?"]},{"id":"city-again","cat":"place","zh":"想再去一次的城市","tags":[],"en":"Describe a city that you have been to and would like to visit again","say":["When you visited it","What you did there","What it was like","And explain why you would like to visit it again"],"src":["chelsea","ez","sf"],"tip":"桂林、阳朔（原作者 P2-1）。","see":["a-p2-01"],"p3":["What's the difference between the city and the countryside?","Do you think people in the countryside are friendlier than people in the city?","Some people say large cities are suitable for old people. What do you think?","Do you think it is possible that all of the population move to cities?","Are there any changes in your city?","What should the government do to improve citizens' safety?"]},{"id":"building","cat":"place","zh":"喜欢去的建筑","tags":[],"en":"Describe a building you enjoy visiting (e.g. a library, a shopping mall, etc.)","say":["Where it is","How you knew it","What it looks like","And explain why you enjoy visiting it"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a public building you enjoy spending time in (e.g. a library, a sports centre)。","tip":"图书馆最好讲：外观、安静、书多、能专心。原作者 P2-12 是“不喜欢的高楼”，可以反着对比。","see":["a-p2-12"],"p3":["Do you think old buildings are valuable?","Do you think all old buildings should be demolished?","Why do people visit historic buildings?","Is it important to protect historic buildings? Why?","Why is it hard to protect historic buildings?","Should modern buildings replace traditional buildings?","Is it better to live in an apartment than in a house?","Why do some people prefer to live in the countryside?"]},{"id":"tech-own","cat":"thing","zh":"想拥有的科技产品（不能是手机）","tags":["mainland"],"en":"Describe a piece of technology (not a phone) that you would like to own","say":["What it is","How much it costs approximately","What you would use it for","And explain why you would like to own it"],"src":["xdf","ez"],"note":"新东方列为大陆新题，EzIELTS 把它归为往季保留题，本季报告还少。题卡取自 EzIELTS。","tip":"运动手表、平板、扫地机器人。说价格、用途、为什么想要。","p3":["How is technology today different from technology in the past?","What technology do young people tend to prefer?","Has technology changed the way people communicate?","What negative effects can technology have on relationships?","What are the differences between making friends online and in person?"],"see":["s-p2-saved-tech"]},{"id":"app","cat":"thing","zh":"常用的 App 或程序","tags":["mainland"],"en":"Describe a program or app on your computer or phone","say":["What it is","When and how you use it","Where you found it","And explain how you feel about it"],"src":["xdf","ez"],"note":"新东方列为大陆新题，EzIELTS 把它归为往季保留题。题卡取自 EzIELTS。","tip":"地图、记账、运动类 App。和 P1 Computers、原作者 websites 素材互通。","see":["a-p1-websites"],"seeNote":"借《P1 Websites》里“常用网站、功能”的词汇，换成 App 或程序。","link":["computers"],"p3":["What apps are most popular in your country?","How do older and younger people differ in the way they use apps?","Why do some people avoid using apps?","Should parents limit how much time children spend on apps?","Do you think young people are becoming too dependent on technology?"]},{"id":"special-food","cat":"thing","zh":"特别场合吃的食物","tags":["mainland"],"en":"Describe a food that people eat on special occasions/events","say":["What it is","What the special event/occasion is","How it is cooked/made","And explain why people eat it on that special occasion/event"],"src":["xdf","joe","ieltsa","sf"],"tip":"春节饺子、中秋月饼、生日蛋糕。讲怎么做，再说为什么那天吃。","p3":["Why are there special foods on special occasions or events?","What are the differences between everyday food and festival food?","What is special about the way this food is made?","What kinds of food are popular in your country?","Do people in your country like eating foreign food?","Do people today prefer eating at home or in a restaurant?","Are there any differences between the food people eat today and the food people ate in the past?","How have people's eating habits changed compared to the past?"],"see":["s-p2-food-party"]},{"id":"least-movie","cat":"thing","zh":"最不喜欢的电影","tags":[],"en":"Describe your least favourite movie","say":["When you watched it","Where you watched it","What it was about","And explain why it's your least favourite movie"],"src":["chelsea","joe","ieltsa","week"],"note":"考情周报里叫“不喜欢的电影”。Ieltsa 的问法：a time when you watched a film/movie that you didn't like。","tip":"一部口碑差或看不懂的电影。剧情一两句带过，重点讲不喜欢的原因（节奏拖、演技差）。原作者 P2-10 是喜欢的电影，可以拿来对比。","see":["a-p2-10"],"p3":["What kinds of movies are the most popular in your country?","What are the differences between watching movies at home and in a cinema?","Can movies help people better understand the cultural background of a country?","Are movies more likely to help people become more creative than books?"]},{"id":"gift","cat":"thing","zh":"想送朋友的礼物","tags":[],"en":"Describe a gift you would like to buy for your friend","say":["How you knew your friend","How long you have known him/her","How you would choose a gift for him/her","And explain why you would choose that gift for him/her"],"src":["chelsea","ez","sf","week"],"tip":"给攀岩搭档买一双攀岩鞋这类具体的东西。重点讲怎么挑、为什么是它。","p3":["When do people normally send gifts to others?","What do people usually consider when buying gifts?","Is it hard to choose a gift?","Will people feel happy when receiving an expensive gift?","Which do people give on traditional festivals, red envelopes or other kinds of gifts?","Are there any unlucky things that people should not buy as gifts in your country?"],"see":["s-p2-gift-book"]},{"id":"exciting-book","cat":"thing","zh":"读起来开心的书","tags":["later"],"en":"Describe an exciting book that you enjoyed reading","say":["What kind of book it was","Why you decided to read it","What the book was about","And explain why you found it exciting"],"src":["week","joe","ieltsa"],"note":"考情周报里叫“读起来开心的书”，对应 Joe Speaking、Ieltsa 收录的这张卡（Ieltsa 标为本季新题）。","tip":"一本小说或运动员传记。讲类型、为什么读、讲了什么、精彩在哪。P3 会问书和改编电影，可以和“最不喜欢的电影”一起准备。","link":["least-movie"],"p3":["What kinds of books do people in your country enjoy reading?","What kinds of books do young and older people enjoy?","Do boys and girls tend to enjoy different kinds of books?","Do you think it is important to read a book before watching its film adaptation?","Why are films based on books sometimes disappointing?","Can films based on novels encourage people to read more?"],"see":["s-p2-gift-book"]},{"id":"decision-happy","cat":"event","zh":"对结果满意的重要决定","tags":["mainland"],"en":"Describe a time you made an important decision and were happy with the result","say":["What the decision was","Why you made the decision","How easy it was for you to make the decision","And explain why you were happy with the result"],"src":["xdf","chelsea","joe","ieltsa"],"tip":"决定去阳朔做志愿者攀岩（原作者 P2-1），或决定读研（P2-8）。满意的原因要具体。","see":["a-p2-01","a-p2-08"],"seeNote":"借《P2-8》里“实习后决定读研、换方向”的经过，套到“让你开心的决定”上。","p3":["What little decisions do people make every day?","Do you think it is a good idea to make a small decision every day?","How can we tell the difference between an important and an easy decision?","Which is better, to make a decision quickly or slowly?","Do you think most people's decisions are made in their 20s?","What if people in a group have different opinions on a decision?"]},{"id":"changed-decision","cat":"event","zh":"改变重要决定的经历","tags":["mainland"],"en":"Describe a time when you changed an important decision of yours","say":["When you changed the decision","What the original decision was","Why you changed it","And explain how you felt about the experience"],"src":["xdf","chelsea","ez","sf"],"tip":"原作者 P2-8：实习之后从自动驾驶改为机器人方向。","see":["a-p2-08"],"p3":["When do most children begin to make their own decisions?","Do children like to change their opinions?","Why do people change opinions?","Who do young people turn to for advice?","Do people like giving an opinion about politics?"]},{"id":"saved-money","cat":"event","zh":"省钱买想要的东西","tags":["mainland"],"en":"Describe a time when you saved money to buy something special","say":["What the special thing was","Why you wanted to buy it","How you saved money for it","And explain how you felt after buying it"],"src":["xdf","chelsea","joe","ieltsa","sf"],"tip":"攒钱买攀岩装备、耳机或一次旅行。讲怎么省（少点外卖、做兼职）。","p3":["What kind of things do people usually save money for?","Is it easier to spend money or save money?","Should parents teach their children to spend money freely or to save money?","Should schools teach children how to manage money from a young age?","Do you think it is easier to teach teenagers how to manage money when they are around 16 or 17 years old?","Should people spend time on charity, or just money?"],"see":["s-p2-saved-tech"]},{"id":"got-up-early","cat":"event","zh":"早起的经历","tags":["mainland"],"en":"Describe a time when you got up early","say":["When it was","What you did","Why you got up early","And how you felt about it"],"src":["xdf","joe","ieltsa"],"tip":"原作者 P2-2 有现成答案：5:30 起床爬电视塔山看日出。","see":["a-p2-02"],"p3":["Why do people get up early?","Do you know anyone who likes to get up early?","What kind of people like getting up early?","Why do some people like to stay up late?","What kinds of occasions need people to arrive early?","Is it good to arrive early in any situation?"]},{"id":"interview","cat":"event","zh":"看过的名人采访","tags":[],"en":"Describe a time you watched a famous person being interviewed","say":["Who the famous person was","What the interview was about","When and where you watched the interview","And explain how you felt about the interview"],"src":["chelsea","joe","ieltsa","sf","week"],"note":"Scorefactory 记的问法是 a time when you interviewed a famous person（你采访名人），准备时留意。","tip":"运动员赛后采访，比如基普乔格破 2 之后的采访（原作者 P2-5）。P3 大多在问求职面试。","see":["a-p2-05"],"p3":["What kinds of people are usually interviewed?","What kinds of things do famous people often say in an interview?","Why do some people dislike being interviewed?","Why do we need to attend interviews when applying for jobs?","What should people do to prepare for a job interview?","What should people wear to a job interview?","Why do some people think interviews are a waste of time?","What can we do to get a job interview?"]},{"id":"not-interested","cat":"event","zh":"听不感兴趣的话但继续听","tags":[],"en":"Describe a time when someone talked about something you were not interested in but you kept listening","say":["Who the person was","What he/she talked about","Why you kept listening","And explain how you felt about the experience"],"src":["chelsea","joe","ieltsa","sf"],"tip":"爸爸讲跑步，你当时完全不感兴趣但还是听了，后来也爱上跑步。原作者 P2-5 里正好有这句：my father loved running, but I was not interested in it at all。","see":["a-p2-05"],"p3":["How can we tell if a listener is listening carefully?","What would happen if the listener didn't listen carefully?","What kind of topics do young people like to talk about today?"]},{"id":"good-service","cat":"event","zh":"在商店得到好的服务","tags":[],"en":"Describe a time when you received good service in a shop/store","say":["Where the shop is","When you went to the shop","What service you received from the staff","And explain how you felt about the service"],"src":["chelsea","joe","ez","ieltsa","sf"],"tip":"在运动用品店买鞋，店员耐心帮你试、给建议。P1 Shoes 的素材能接上。","link":["shoes"],"p3":["Why are shopping malls so popular in your country?","What are the advantages and disadvantages of shopping in small shops?","Why do some people not like shopping in small shops?","What are the differences between online shopping and in-store shopping?","What are the advantages and disadvantages of shopping online?","Can consumption drive economic growth?"],"see":["s-p2-saved-tech"]},{"id":"evening-friends","cat":"event","zh":"和朋友度过的愉快夜晚","tags":[],"en":"Describe an enjoyable evening you had with your friends","say":["When and where it was","What you did","Who you spent the evening with","And explain why it was enjoyable"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"在阳朔和其他志愿者一起吃米粉、聊天（原作者 P2-1）。","see":["a-p2-01"],"p3":["Why do people need friends?","What are the differences between young people's leisure time activities and those of old people?","Do older people prefer spending time with family or with friends?","Is it important to communicate with your family?","What can we do to bring family members closer together?","How do people get along in a big family?"]},{"id":"waste-time","cat":"event","zh":"觉得浪费时间的日常活动","tags":[],"en":"Describe an activity you do regularly that you think is a waste of time","say":["What it is","When you usually do it","Why you do it","And explain why you think it is a waste of time"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"睡前刷短视频。P3 必备里“长时间刷社交媒体”的语料可以直接用。","see":["a-p3-base"],"seeNote":"借《P3 万能框架》的五类问法，把“熬夜刷短视频”填进去。","p3":["Will you continue doing something when you are aware that it's a waste of time?","Is it good to have a daily routine?","How do you balance life and work?","What kinds of things make people feel pressured?","Do you think stress is important in people's lives?","Why do some people refuse to abide by rules?"]},{"id":"party","cat":"event","zh":"印象深刻的聚会","tags":[],"en":"Describe a party for a special event that impressed you a lot","say":["When and where it was held","What the party was held for","How many people attended it","And explain why it impressed you a lot"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"毕业聚会或生日聚会。在哪办、多少人、为什么印象深。","p3":["What special events are celebrated in your country?","What festivals are the most important for people in your country?","When do people like to hold a party?","Do most people prefer to hold a party in a public place or a private place?","Do most people prefer to hold a party in a restaurant or in a pub?","Do you think people nowadays prefer attending big parties or small gatherings with close friends? Why?","Are there any differences between how young people and older people celebrate events with parties?","Do you think it's a waste of money for governments to celebrate national events?"],"see":["s-p2-food-party"]},{"id":"child-skill","cat":"event","zh":"小时候学到的新技能","tags":[],"en":"Describe a new skill you learned when you were a child","say":["What the skill was","Who taught you this skill","How you learned it","And explain how you felt about learning the skill"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"小学踢足球进了校队（原作者 P1 其他），或学骑自行车、游泳。","see":["a-p1-other"],"seeNote":"借《P1 Hobbies》里“小时候学技能”的童年表达，主体换成 Part 2 的叙述。","link":["taught-skill"],"p3":["What skills should children learn before they go to school?","Can a child learn skills from another child?","Do you think it is easier for children to learn new skills than for adults?","What are the differences between the way adults learn and the way children learn?","What are the differences between learning in a group and learning by yourself?","Is it important for everyone to have a specialized skill?"]},{"id":"course","cat":"event","zh":"印象深刻的课程","tags":[],"en":"Describe a course that impressed you a lot","say":["What the course was about","Where you took the course","What you did during the course","And explain why it impressed you a lot"],"src":["chelsea","ez","sf","week"],"tip":"大学专业课里的实验课（原作者 P1 study：测控专业、动手实验）。注意 P3 偏“记忆”话题。","see":["a-p1-study"],"seeNote":"借《P1 Study》里专业课、实操课的说法，扩展成“一门印象深刻的课程”。","p3":["What can we learn from history?","What do people need to remember in their daily lives?","Can technology help people remember things better? How?","Which can help people remember things better, words or photos?","Do people like things of memorial significance?","Why do some people have a better memory than others?"]},{"id":"lost-public","cat":"event","zh":"在公共场所丢东西","tags":["later"],"en":"Describe an occasion when you lost something in public","say":["What you lost","When and where you lost it","What you did to find it","And explain how you felt about it"],"src":["sf","ez","week"],"note":"Scorefactory 9 月 12 日补充的新卡，9/26–10/2 考情周报 Top10。","tip":"在地铁或景区丢了耳机、钥匙，怎么找回。和 P1 Lost and found 共用一个故事。","link":["lost-found"],"p3":["What kinds of things do people usually lose?","What kinds of people may lose things often?","What will people do when losing things?","What do people often feel after losing things?","Is it effective to offer rewards to find lost things?","What can we do to reduce the possibility of losing things?"],"see":["s-p2-lost-public"]},{"id":"save-time","cat":"event","zh":"帮你节省时间的方法或改变","tags":["later"],"en":"Describe a way or change that helps you save a lot of time","say":["What it is","How you implement it","How difficult it is","And explain how you feel about the way/change"],"src":["sf","ri","week"],"note":"Scorefactory 9 月 12 日补充的新卡，9/26–10/2 考情周报高频第一。","tip":"骑电动车代替步行去攀岩点（原作者 P2-1 里提到过），或用日程 App 规划一天。讲清怎么做、难不难。","see":["a-p2-01"],"seeNote":"借《P2-1》里“骑电动车去攀岩、出门很方便”的细节当省时间的例子，不用整篇。","p3":["What can people do to save time?","Does technology help people save time? How and why?","Is it necessary for children to learn time management?","What can schools do to help students learn time management?","Do you think parents should be responsible for teaching children to save time?","Do people who can manage time well become successful more easily?"]},{"id":"helped-solve","cat":"event","zh":"帮别人解决问题","tags":["later"],"en":"Describe a time you helped someone solve a problem","say":["When it was","Who you helped","What problem you solved","And explain how you felt about this experience"],"src":["joe","ez","ieltsa"],"note":"Ieltsa 标为本季新题（a time when you helped someone with a problem）。","tip":"帮爸妈或同学解决电脑、手机问题。原作者 P3 科技问题的素材可以借。","see":["a-p3-tech"],"seeNote":"借《P3 科技问题》里“设备出故障怎么排查”的说法，换成帮人解决问题的场景。","p3":["When do people usually ask others for help?","What kinds of skills are needed when people want to help others?","Should people solve their own problems before helping others?","Is it important for parents to teach their children to help others?","Is it enough for children to learn about helping others only from their parents?"]}],"p2Overseas":[{"zh":"让你失望的电影","en":"Describe a film that disappointed you"},{"zh":"生活离不开的东西（不能是手机或电脑）","en":"Describe something you cannot live without, other than a phone or computer"},{"zh":"家里放松的地方","en":"Describe a place at home where you relax"}],"chuanti":[{"title":"教你东西的人、学技能","cards":["taught-skill","child-skill","course","older-admire"],"story":"攀岩教练教你户外攀岩，或小学的足球教练。原作者素材：P2-1、P2-2 阳朔攀岩，P1 其他（小学校队）。","focus":{"taught-skill":"重点讲你原来的困难、他的教法和你的变化。","child-skill":"重点讲童年学这项技能的过程、谁带你入门，以及当时的心情。","course":"重点讲这门课上了什么内容、哪一堂课最难忘，以及你学到了什么。","older-admire":"重点讲这位长辈的经历和品质、哪件事让你尊敬他，以及你们平时的相处。"}},{"title":"爱好多、很自律的人","cards":["photos","history","handmade","organized","healthy-habits"],"story":"同一个朋友：平时有自己的爱好，作息和做事也很有条理。按具体题卡挑一个侧面展开。","focus":{"photos":"重点讲他拍什么、怎么拍，以及一次给你或风景拍照的具体经历。","history":"重点讲他通过什么方式学历史、最熟悉哪段历史，以及给你讲历史故事的细节。","handmade":"重点讲他亲手做过什么物件、用了什么材料和步骤，以及为什么做得好。","organized":"重点讲他平时怎么规划时间和整理物品、在什么场景下看得出有条理，以及这对他的帮助。","healthy-habits":"重点讲他的日常作息和运动饮食习惯、如何长期坚持，以及对你的带动。"}},{"title":"只见过一次的人、朋友","cards":["know-more","evening-friends","gift"],"story":"在阳朔民宿认识的志愿者朋友：一起吃米粉聊天的晚上、想送他的礼物、想多了解他。","focus":{"know-more":"重点讲你们在哪儿偶遇、聊了什么让你印象深刻，以及为什么想进一步了解他。","evening-friends":"重点讲那天晚上的环境、你们一起做了什么事，以及为什么氛围特别愉快。","gift":"重点讲这件礼物是什么、为什么适合这个朋友，以及你打算怎么选、怎么送。"}},{"title":"成功的人、榜样","cards":["difficult-success","sportsperson","older-admire","success-business","fitness-helped"],"story":"基普乔格破 2（原作者 P2-5），或身边坚持跑步、创业的长辈和朋友。","focus":{"difficult-success":"重点讲这件事难在哪里、他中间怎么克服阻碍，以及最终做成的过程。","sportsperson":"重点讲这位运动员的比赛成绩、日常训练态度，以及他哪一点最打动你。","older-admire":"重点讲他的阅历和处事方式、你们一起做过的事，以及你为什么敬佩他。","success-business":"重点讲他经营什么生意、为什么及如何创业起步，以及生意成功的原因。","fitness-helped":"重点讲他原本有什么健康或体能困扰、你怎么陪他制定计划，以及改善前后的变化。"}},{"title":"名人、受欢迎的人","cards":["popular","local-famous","interview"],"story":"一位本地有名、人缘好的人，或者你看过的一场深度人物访谈。","focus":{"popular":"重点讲他的性格特点、平时怎么对待身边的人，以及为什么大家都喜欢他。","local-famous":"重点讲他在当地因为什么事出名、为社区做过什么，以及大家对他的评价。","interview":"重点讲采访的嘉宾是谁、访谈中聊到了什么核心话题，以及哪句话让你感触最深。"}},{"title":"去过或想去的地方","cards":["free-time-place","city-again","near-nature","natural-city"],"story":"桂林、阳朔（原作者 P2-1、P2-3），或城市里的湿地公园、山径。","focus":{"free-time-place":"重点讲这个地方有什么特色、你为什么一直想去，以及有空去了打算做什么。","city-again":"重点讲你上次去这座城市的经历、那里最吸引你的地方，以及为什么还想二刷。","near-nature":"重点讲那里的自然风貌、你在那儿看到的景色和活动，以及亲近自然的感受。","natural-city":"重点讲这个城市绿地的位置和环境、你平时多久去一次，以及它怎么帮你放松。"}},{"title":"无聊、吵、挤、不喜欢的地方","cards":["boring-place","short-trip","noisy","crowded"],"story":"去秦岭路上堵车、山脚到处是垃圾（原作者 P2-7），或高峰期挤地铁、逛夜市。","focus":{"boring-place":"重点讲你为什么去那儿、现场有多单调乏味，以及你当时怎么熬过那段时间。","short-trip":"重点讲这趟短途出行的路线和目的、路上哪里折腾，以及为什么经常去却不喜欢。","noisy":"重点讲现场有哪些嘈杂的声音、为什么那么吵，以及噪音对你的影响。","crowded":"重点讲当时为什么聚集了那么多人、拥挤的场面，以及你在里面的切身感受。"}},{"title":"决定和改变","cards":["decision-happy","changed-decision","got-up-early","save-time"],"story":"实习后决定读研、换方向（原作者 P2-8）；为了攀岩或备考开始早起、精简日程（P2-2）。","focus":{"decision-happy":"重点讲当时面临的选择、做决定的过程有多纠结，以及结果为什么让你满意。","changed-decision":"重点讲原来的决定是什么、后来发现了什么新情况促使你改主意，以及改完后的结果。","got-up-early":"重点讲那天为什么要早起、早晨起床和出门的过程，以及早起带来的收获。","save-time":"重点讲你以前在哪件事上耗时多、现在用什么方法提高效率，以及省下时间能做什么。"}},{"title":"花钱、买东西","cards":["saved-money","gift","good-service","tech-own"],"story":"攒钱买一件运动装备或电子产品：怎么省钱、店员怎么帮忙挑选、买来有什么用。","focus":{"saved-money":"重点讲你想买什么、为了攒够钱平时怎么节制开销，以及买到手那一刻的成就感。","gift":"重点讲朋友的喜好、你为什么挑这件物品当礼物，以及想象他收到时的反应。","good-service":"重点讲店员具体帮你解决了什么问题、态度多耐心，以及这次服务为什么超出预期。","tech-own":"重点讲这件科技产品的功能、能帮你解决日常什么痛点，以及为什么现在还没买。"}},{"title":"活动、聚会、吃的","cards":["party","special-food","evening-friends","waste-time"],"story":"家庭或朋友聚会：热闹场面、特色菜肴；聚会后熬夜刷短视频算“浪费时间的活动”。","focus":{"party":"重点讲聚会是为了庆祝什么、现场有哪些环节和布置，以及为什么让你印象深刻。","special-food":"重点讲这道食物在什么特定节日或场合吃、做法和味道，以及背后的寓意。","evening-friends":"重点讲和哪几位朋友在一起、当晚聊了什么做了什么，以及为什么觉得放松开心。","waste-time":"重点讲你通常在什么时间做这件事、为什么明知没意义还停不下来，以及事后的懊悔。"}},{"title":"书、电影、App","cards":["exciting-book","least-movie","app","tech-own"],"story":"一本人物传记或科普书、一部让人失望的电影；平时常用的学习/运动 App 与硬件。","focus":{"exciting-book":"重点讲这本书的主要内容、哪一段情节或观点最吸引你，以及读完的启发。","least-movie":"重点讲当初为什么去看这部电影、剧情或制作哪里拉胯，以及看完为什么失望。","app":"重点讲这个软件的核心功能、你每天在什么场景下用它，以及它带来的便利。","tech-own":"重点讲这个设备比手机强在哪里、能用在什么学习或生活场景，以及你期待它的原因。"}},{"title":"意外和帮忙","cards":["lost-public","helped-solve","not-interested"],"story":"在公共场所丢东西后找回的经历；帮朋友或长辈解决实际问题、耐心听长辈唠叨。","focus":{"lost-public":"重点讲在什么地方怎么把东西弄丢的、发现后怎么寻找，以及最后的结局和教训。","helped-solve":"重点讲对方遇到了什么棘手问题、你分几步帮他搞定，以及帮完之后的感受。","not-interested":"重点讲对方聊的话题为什么让你犯困、你出于什么礼貌或原因一直听完，以及当时的心理活动。"}}]},"recent":{"updated":"2026-10-13","range":"2026 年 9 月 1 日 – 10 月 11 日","sources":{"iwp":{"short":"IELTS Writing Practice","name":"IELTS Writing Practice《IELTS Writing questions reported in September / October 2026》","date":"2026-10-05","url":"https://ieltswritingpractice.app/recent-ielts-writing-questions/2026-09/","note":"考生考后回忆，按周分组，标注了近期重复出现和往年旧题；10 月的题见同站 2026-10 页面"},"week":{"short":"考情周报","name":"国际教育联盟《雅思考情周报 9月26日–10月2日》","date":"2026-10-08","url":"https://www.jingsailian.com/liuxue/1654387.html"},"mentor":{"short":"爱雅思导师","name":"爱雅思导师《雅思机经》","date":"2026-09-18","url":"https://aiieltsmentor.com/jijing","note":"大陆场次回忆"},"langujet":{"short":"Langujet","name":"Langujet（r/IELTS 考生回忆）","date":"2026-09","url":"https://langujet.com/ielts-writing-questions/writing-task-2-newspapers-and-young-people/"}},"task2Types":{"opinion":"Agree or disagree","discussion":"Discuss both views","advantages":"Advantages & Disadvantages","posneg":"Positive or negative","problem":"Reasons / Problems & Solutions","twopart":"Two-part questions"},"task1Types":{"line":"折线图","bar":"柱状图","pie":"饼图","table":"表格","mixed":"混合图","map":"地图","process":"流程图","unknown":"图形未注明"},"task2":[{"week":"10/5–10/11","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some people think it is more important to spend public money on promoting a healthy lifestyle in order to prevent illness than to spend it on the treatment for people who are already ill. To what extent do you agree or disagree?","zh":"有人认为把公共资金用来推广健康生活方式、预防疾病，比用来治疗已经生病的人更重要。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：重点比较“预防（推广健康生活方式）”与“治疗（治已病之人）”哪项更值得公共资金优先投入，或说明两者不可偏废。","points":["支持预防优先：源头减少慢性病（如肥胖、糖尿病），长期看能大幅节省国家医疗开支（preventive healthcare reduces long-term medical costs）。","支持治疗同样关键：重病、急症和遗传病无法靠生活方式完全预防，医院设备和救命药必须有充足公共预算保障基本生命权。"],"vocab":"preventive healthcare（预防性医疗） · chronic diseases（慢性病） · medical resources（医疗资源） · life-saving treatment（救命治疗）"},"id":"c7a901124c"},{"week":"10/5–10/11","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some people think that people should be given the right to use freshwater as they like. Others believe governments should strictly control the use of freshwater. Discuss both views and give your own opinion.","zh":"有人认为人们应该可以随意使用淡水，也有人认为政府应该严格控制淡水的使用。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：一边是“公民自由使用淡水”，另一边是“政府严格管控淡水”，需分别说明两边逻辑并给出自己立场（如保障基本生活用水+阶梯水价限制浪费）。","points":["甲方（自由使用）：清洁水源是基本人权（basic human right），日常饮用和卫生需求不应受到严苛限制。","乙方（政府严管）：淡水是有限资源（finite resource），人口增长与工农业排污加剧水危机，若无价格或配额管控会导致严重浪费。"],"vocab":"freshwater scarcity（淡水短缺） · basic necessity（基本生活必需品） · water conservation（节水） · tiered pricing（阶梯定价）"},"id":"b2ae8c2486"},{"week":"10/5–10/11","type":"twopart","parts":"影响 + 积极还是消极","src":"iwp","flags":["recycled"],"q":"Competitiveness is a positive quality for people in most societies. How does competitiveness affect individuals? Is it a positive or negative trend?","zh":"在大多数社会里，竞争意识被看作一种积极品质。竞争对个人有什么影响？这是积极还是消极的趋势？","ideas":{"focus":"双问题（影响 + 积极还是消极）：第一段答“竞争对个人的正负面影响”，第二段明确表态“整体是积极还是消极趋势”。","points":["第一问（对个人的影响）：适度竞争激发潜能、提升学习与工作效率；但恶性竞争会导致慢性焦虑、职业倦怠（burnout）和人际疏离。","第二问（积极或消极）：若能维持公平规则与良性竞争（healthy competition），整体是积极的；若演变为零和内卷则弊大于利。"],"vocab":"sense of competition（竞争意识） · drive self-improvement（推动自我提升） · mental burnout（精神倦怠） · healthy competition（良性竞争）"},"id":"8351452db8"},{"week":"10/5–10/11","type":"discussion","src":"iwp","flags":["recycled"],"q":"In many parts of the world, people do research on their family history. Some people believe that finding out about previous generations is a useful thing to do. However, others believe that it is better to focus on present and future generations. Discuss both views and give your opinion.","zh":"在世界很多地方，人们会研究自己的家族史。有人认为了解前几代人很有用，也有人认为更应该关注现在和未来的几代人。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：讨论“研究家族史的价值”与“专注当下和后代的理由”，最后给出个人看法。","points":["甲方（研究家族史有用）：了解祖先经历能增强文化认同感与家庭归属感（sense of identity and belonging），从长辈奋斗中汲取经验。","乙方（专注当下与未来）：现代社会变化快，住房、教育、就业等现实问题更紧迫，过度沉湎过去无助于改善后代生活水平。"],"vocab":"family genealogy / heritage（家族历史/传承） · sense of belonging（归属感） · practical challenges（现实挑战） · future generations（后代）"},"id":"a15d6f5691"},{"week":"10/5–10/11","type":"problem","parts":"原因 + 解决办法","src":"iwp","flags":["recycled"],"q":"Many offenders commit more crimes after serving the first punishment. Why is this happening, and what measures can be taken to tackle this problem?","zh":"很多罪犯在第一次受罚后又再次犯罪。为什么会这样？可以采取什么措施解决这个问题？","ideas":{"focus":"原因 + 解决：第一段分析“刑满释放人员再次犯罪（reoffend）”的原因，第二段提出针对性的预防措施。","points":["原因：① 出狱后缺乏职业技能且遭受社会歧视，找不到合法工作；② 监狱只惩罚未改造，甚至在狱中交叉感染犯罪习气。","解决：① 在服刑期间提供职业培训（vocational training）与心理辅导；② 提供出狱后的就业安置与社区帮扶，帮助其重新融入社会。"],"vocab":"reoffend / commit crimes again（再次犯罪） · vocational training（职业培训） · social stigma（社会偏见/烙印） · reintegrate into society（重新融入社会）"},"id":"0ba08ba488"},{"week":"9/28–10/4","type":"twopart","parts":"原因 + 积极还是消极","src":"iwp","q":"These days more fathers stay at home and take care of their children while mothers go out to work. What could be the reasons for this? Is it a positive or negative development?","zh":"如今越来越多父亲在家照顾孩子，母亲外出工作。原因可能是什么？这是积极还是消极的发展？","ideas":{"focus":"双问题（原因 + 积极还是消极）：第一段分析“全职爸爸/母亲工作”的原因，第二段判断这一趋势是否积极。","points":["第一问（原因）：女性受教育程度与收入提高；远程办公兴起且社会对性别分工的观念更加开放平等。","第二问（积极发展）：打破刻板性别角色（gender stereotypes），家庭可根据双方收入和性格灵活分工，且父亲深度参与育儿有利于孩子成长。"],"vocab":"gender equality（性别平等） · traditional gender roles（传统性别角色） · breadwinner（养家糊口的人） · child-rearing（育儿）"},"id":"ca1c5e9d77"},{"week":"9/28–10/4","type":"twopart","parts":"原因 + 利是否大于弊","src":"iwp","flags":["recycled"],"q":"In the past, people used to travel to see the differences from their home country. However, the scenery in places around the world seems similar nowadays. What are the causes of these similarities? Do you think that the advantages of these similarities outweigh the disadvantages?","zh":"过去人们旅行是为了看和本国不同的东西，但如今世界各地的景色越来越相似。原因是什么？你认为这种相似利大于弊吗？","ideas":{"focus":"双问题（原因 + 利是否大于弊）：第一段写“全球各地景观趋同”的原因，第二段比较其利弊并明确哪边更大。","points":["第一问（原因）：经济全球化、跨国连锁品牌（咖啡馆、商场）扩张以及现代摩天大楼建筑风格标准化。","第二问（弊大于利）：虽然标准化设施给游客带来便利，但抹杀了当地特色建筑与传统民俗（erosion of local cultural identity），降低了旅行探索的意义。"],"vocab":"globalisation（全球化） · multinational chains（跨国连锁店） · cultural homogenization（文化同质化） · local identity（地方特色）"},"id":"53697309b9"},{"week":"9/28–10/4","type":"twopart","parts":"有多重要 + 积极还是消极","src":"iwp","flags":["repeat","recycled"],"q":"Ambition is a positive quality for people to have in society today. How important is it for people who want to succeed in life? Is it a positive or negative characteristic?","zh":"进取心被认为是当今社会中的一种积极品质。它对想要成功的人有多重要？它是积极还是消极的特质？","ideas":{"focus":"双问题（有多重要 + 积极还是消极）：第一段评估“进取心对成功有多重要”，第二段回答“它是积极还是消极特质”。","points":["第一问（有多重要）：非常重要，进取心让人设定长期目标并在遇到挫折时保持韧性（persistence），但成功还需配合脚踏实地的执行与团队合作。","第二问（积极还是消极）：整体是积极特质，能推动个人成长与社会创新；只要不演变为不择手段的功利心即可。"],"vocab":"pursue long-term goals（追求长远目标） · perseverance（毅力） · career advancement（职业晋升） · overly ambitious（急功近利）"},"id":"b6c5af0b60"},{"week":"9/28–10/4","type":"twopart","parts":"原因 + 影响","src":"iwp","flags":["recycled"],"q":"Today, people in many countries have to spend more and more time away from their families. Why is this happening? What effects does this have on the people themselves and on their families?","zh":"如今很多国家的人不得不花越来越多的时间离开家人。为什么会这样？这对他们本人和家人有什么影响？","ideas":{"focus":"双问题（原因 + 影响）：第一段写“人们离家时间越来越长”的原因，第二段必须同时写对“本人”和“家人”两方面的影响。","points":["第一问（原因）：大城市通勤时间长、加班文化盛行，以及人们为了更高收入跨城或跨国工作。","第二问（双重影响）：对本人而言，长期奔波导致疲惫与孤独感；对家人而言，夫妻缺乏沟通、孩子缺少父母陪伴，削弱家庭纽带（weaken family bonds）。"],"vocab":"long commuting hours（漫长的通勤时间） · work-life balance（工作生活平衡） · emotional distance（情感疏离） · family bonds（家庭纽带）"},"id":"5bc3db009d"},{"week":"9/28–10/4","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some people think that language should be taught in small classes, while other people think the number of students in a language class does not matter. Discuss both views and give your opinion.","zh":"有人认为语言应该小班教学，也有人认为语言课的人数无关紧要。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：对比“语言课应该小班教学”与“班级人数无关紧要”，给出个人观点（如口语互动需小班，基础输入可大班/线上）。","points":["甲方（小班教学好）：语言学习重在开口练习与纠错，小班能让老师照顾到每个学生的发音和表达（personalized feedback）。","乙方（人数不重要）：语法、词汇、听力训练主要靠学生课后自律和多媒体资源，即便在大班，只要方法得当也能学好。"],"vocab":"class size（班级规模） · personalized feedback（个性化反馈） · teacher-student interaction（师生互动） · self-discipline（自律）"},"id":"894aee6dd3"},{"week":"9/28–10/4","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"One long-distance flight consumes fuel which a car uses in several years' time, but they cause the same amount of pollution. So some people think that we should discourage non-essential flights, such as tourist travel, rather than limit the use of cars. To what extent do you agree or disagree?","zh":"一次长途飞行消耗的燃料相当于一辆车开好几年，造成的污染也相当。所以有人认为应该减少旅游这类非必要的飞行，而不是限制开车。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：题干主张“应限制旅游等非必要飞行，而不是限制私家车”，需回应两者的对比与可行性。","points":["部分反对/全面看：单次长途航班碳排放确实高，但全球每天有数亿辆私家车通勤，汽车总排放量同样庞大，只管飞机不管汽车治标不治本。","可行性与经济影响：一刀切限制旅游航班会重创旅游业与跨国交流；更合理的做法是两边同步推进（推广公共交通+研发可持续航空燃料）。"],"vocab":"carbon emissions（碳排放） · non-essential flights（非必要航班） · public transport（公共交通） · tourism industry（旅游业）"},"id":"39e84d0b6d"},{"week":"9/26–10/2","type":"discussion","src":"week","note":"考生回忆，措辞按常见题干整理","q":"Because of modern technology, it is no longer necessary for people to learn handwriting skills, but others believe that handwriting is still an important skill. Discuss both views and give your own opinion.","zh":"有人认为由于现代科技，人们不再需要学习书写技能；另一些人认为书写仍是一项重要技能。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：讨论“科技时代无需再练手写”与“手写依然重要”，并给出个人立场。","points":["甲方（无需手写）：打字和语音输入速度更快、易于检索修改，职场与学术沟通几乎完全数字化。","乙方（手写仍重要）：儿童练字有助于大脑发育、手眼协调和汉字/拼写记忆；手写笔记和书信也更具专注度与情感温度。"],"vocab":"typing on keyboards（键盘打字） · cognitive development（认知发展） · memory retention（记忆留存） · digital literacy（数字素养）"},"id":"68c8c9edec"},{"week":"9/21–9/27","type":"opinion","src":"iwp","flags":["recycled"],"q":"Nowadays, children spend a lot of time watching TV and playing computer games. Some people believe this has negative effects on children's mental abilities. To what extent do you agree or disagree?","zh":"如今孩子花很多时间看电视、玩电脑游戏，有人认为这对孩子的智力发展有负面影响。你在多大程度上同意？","ideas":{"focus":"同意与否：回应“看电视和玩电脑游戏对儿童智力发展有负面影响”，可赞同过度沉迷的害处，或分情况讨论。","points":["负面影响：长时间被动看屏幕会缩短注意力时长（shorten attention span），挤占阅读和现实探索的时间，削弱深度思考能力。","辩证补充：并非所有节目和游戏都有害，纪录片和策略益智类游戏在一定程度上能锻炼反应力、空间思维和外语词汇。"],"vocab":"screen time（屏幕时间） · attention span（注意力时长） · cognitive skills（认知能力） · educational programmes（教育节目）"},"id":"c01dd771f3"},{"week":"9/21–9/27","type":"opinion","src":"iwp","q":"Some people suggest that the government should spend money putting more works of art, like paintings and statues, into towns and cities to make them attractive places. To what extent do you agree or disagree?","zh":"有人建议政府花钱在城镇里放更多艺术品，比如绘画和雕塑，让城市更有吸引力。你在多大程度上同意？","ideas":{"focus":"建议/政策类同意与否：评估“政府花钱在城市放置绘画、雕塑等公共艺术品是否合理”，重点谈公共预算的优先级。","points":["支持角度：公共雕塑与地标能美化城市环境、提升市民审美体验，还能吸引游客带动地方经济。","反对/限定角度：政府预算有限，医疗、教育、公共交通和保障房等民生基础设施（basic infrastructure）应排在公共艺术品之前。"],"vocab":"public art installations（公共艺术装置） · aesthetic value（审美价值） · government budget（政府预算） · public infrastructure（公共基础设施）"},"id":"ea6ee16c04"},{"week":"9/21–9/27","type":"opinion","src":"iwp","q":"People who decide on a career path early in their lives and keep to it are more likely to have a satisfying working life than those who change jobs frequently. To what extent do you agree or disagree?","zh":"早早确定职业方向并坚持下去的人，比经常换工作的人更可能拥有满意的职业生活。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：比较“早早确定职业并一直坚持”与“频繁换工作”哪种更可能带来满意的职业生活。","points":["坚持同一职业的优势：长期深耕能积累深厚经验、人脉与高薪晋升机会，带来稳定的成就感。","换工作的合理性：年轻人在尝试不同岗位后才能真正找到兴趣所在；且现代行业迭代快，适度转行能避免困在夕阳行业或枯燥岗位中。"],"vocab":"career stability（职业稳定） · job satisfaction（工作满意度） · accumulate expertise（积累专业经验） · career switch（转行）"},"id":"6df1e0be27"},{"week":"9/21–9/27","type":"opinion","src":"iwp","flags":["recycled"],"q":"Some people say it is more important to plant trees in the open spaces in towns and cities than to build more housing. To what extent do you agree or disagree?","zh":"有人说在城市的空地上种树比建更多住房更重要。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：比较城市空地“用来种树造绿地”与“用来建更多住房”哪个更重要。","points":["支持种树（城市绿地）：吸收空气污染、缓解城市热岛效应，为居民提供散步减压的公共空间，提升整体宜居度。","支持建住房：许多大城市面临严峻的住房短缺与高房价（housing shortage），解决居民“有房住”是更紧迫的基本生存需求；可通过高层住宅配社区绿地兼顾。"],"vocab":"urban green spaces（城市绿地） · housing shortage（住房短缺） · affordable housing（保障性住房） · living environment（居住环境）"},"id":"60ce0fc059"},{"week":"9/21–9/27","type":"advantages","src":"iwp","flags":["recycled"],"q":"More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks?","zh":"越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？","ideas":{"focus":"利弊比较（outweigh）：同时讨论出国留学的好处与坏处，并明确论证哪一边更大（详见原作者 2-4 留学范文）。","points":["好处（Advantages）：接触优质教育与前沿科研资源；培养独立生活能力与跨文化视野（broaden horizons）。","坏处（Disadvantages）：高昂学费与生活费加重家庭经济负担；初到异国容易面临语言障碍、孤独感与文化冲击（culture shock）。"],"vocab":"pursue higher education abroad（出国深造） · cross-cultural communication（跨文化交流） · culture shock（文化冲击） · tuition fees（学费）"},"id":"c6b96a98eb"},{"week":"9/21–9/27","type":"opinion","src":"iwp","flags":["recycled"],"q":"Countries should try to produce all the food for the population and import as little food as possible. To what extent do you agree or disagree?","zh":"国家应该尽量自己生产全部粮食，尽可能少进口。你在多大程度上同意？","ideas":{"focus":"建议/政策类同意与否：注意题干中的极端词“produce all the food / import as little as possible”，分析完全粮食自给是否现实。","points":["自给自足的合理面：保障主粮安全（food security），减少对国际供应链波动或贸易摩擦的依赖。","为什么不能完全拒绝进口：受气候、耕地面积和水资源限制（如沙漠或高寒国家），强行生产所有食物成本极高；适度进口能丰富饮食种类、发挥比较优势。"],"vocab":"food security（粮食安全） · self-sufficiency（自给自足） · arable land（耕地） · international trade（国际贸易）"},"id":"b922ca236d"},{"week":"9 月","type":"posneg","src":"langujet","note":"题干讲年轻人，问的是对社会的影响，两头都要答到","q":"Newspapers have a huge influence on young people's lives. Is it a positive or negative effect on society?","zh":"报纸对年轻人的生活影响很大。这对社会是积极还是消极的影响？","ideas":{"focus":"积极还是消极：注意题干先说“报纸对年轻人影响大”，最后问的是“对社会（on society）是积极还是消极”，不能只写年轻人。","points":["积极影响：深度新闻报道帮助年轻人了解公共事务与社会问题，培养有社会责任感和批判性思维的年轻公民，从而推动社会进步。","消极影响：部分媒体为博眼球渲染耸人听闻的负面新闻（sensational news）或偏见，可能误导年轻人价值观、加剧社会对立。"],"vocab":"current affairs（时事） · critical thinking（批判性思维） · sensational journalism（博眼球的新闻报道） · social awareness（社会意识）"},"id":"97d4e111bc"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"The shopping habits of people depend more on their age group than on any other factors. To what extent do you agree or disagree?","zh":"人们的购物习惯更多取决于年龄段，而不是其他因素。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：题干说购物习惯“更多取决于年龄段，而非其他任何因素（than on any other factors）”，注意回应其他因素（收入、性别、广告）。","points":["年龄确实有影响：青少年偏爱潮流数码与联名商品，中年人重家庭日用，老年人更关注保健与实用性。","其他因素同样甚至更关键：收入水平（income level）直接决定购买力上限；同一个年龄段内，高收入与低收入人群的消费习惯天差地别。"],"vocab":"purchasing power（购买力） · disposable income（可支配收入） · consumer behaviour（消费行为） · peer influence（同辈影响）"},"id":"3c82a25bf5"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some employers are giving increased importance to employing people with good social skills in addition to good qualifications. Do you agree or disagree that social skills are as important as good qualifications for success in a job?","zh":"一些雇主除了看学历，也越来越看重社交能力。你是否同意，对工作成功来说社交能力和学历同样重要？","ideas":{"focus":"比较类同意与否：回应“社交能力（social skills）对工作成功是否和好学历（good qualifications）一样重要”。","points":["为什么社交能力同样重要：现代职场高度依赖跨部门协作、客户沟通与团队管理，情商与沟通力决定能否把想法落地。","为什么好学历依然是基石：在医疗、工程、法律等专业壁垒高的行业，扎实的专业资质与技术能力是不可替代的硬门槛，两者相辅相成。"],"vocab":"interpersonal skills（人际交往能力） · academic qualifications（学历资质） · teamwork and collaboration（团队协作） · technical expertise（专业技术）"},"id":"8da6de0423"},{"week":"9/14–9/20","type":"opinion","src":"mentor","flags":["repeat"],"note":"9 月 16 日大陆场考生回忆","q":"Art classes, such as painting and drawing, are as important to a child's development as other subjects, so they should be compulsory in high schools. To what extent do you agree or disagree?","zh":"绘画等艺术课对孩子成长和其他科目一样重要，所以高中应该把它设为必修。你在多大程度上同意？","ideas":{"focus":"因果+建议类同意与否：题干包含两层——“艺术课和其他科目一样重要”以及“因此高中应设为必修”，两层都要回应。","points":["艺术课的价值：培养审美、创造力（creativity）并帮助高中生缓解繁重的课业压力。","为什么高中不宜一刀切必修：高中阶段升学压力大、精力有限，强制所有学生修读绘画可能反而变成负担；设为选修课（elective course）更合理。"],"vocab":"aesthetic appreciation（审美能力） · compulsory subject（必修课） · elective course（选修课） · academic pressure（学业压力）"},"id":"89e0754b4f"},{"week":"9/14–9/20","type":"problem","parts":"问题 + 解决办法","src":"iwp","flags":["recycled"],"q":"Natural resources such as oil, forests and freshwater are being consumed at an alarming rate all around the world. What problems does this cause? How can we solve these problems?","zh":"石油、森林、淡水等自然资源在全世界被以惊人的速度消耗。这会造成什么问题？怎么解决？","ideas":{"focus":"问题 + 解决：第一段写“自然资源加速消耗”带来的具体问题，第二段写政府与个人的解决措施。","points":["造成的问题：① 森林砍伐与化石燃料燃烧加剧温室效应和极端天气；② 淡水与能源枯竭威胁未来工农业生产与人类生存。","解决办法：① 政府加大对太阳能、风能等可再生能源（renewable energy）的补贴与研发；② 推行资源回收法规并引导公众绿色出行、节约水电。"],"vocab":"depletion of natural resources（自然资源枯竭） · renewable energy（可再生能源） · sustainable development（可持续发展） · eco-friendly lifestyle（环保生活方式）"},"id":"7ab700f5aa"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["recycled"],"q":"Prison is the common way most countries try to solve the problem of crime. However, a more practical solution is to provide the public with a better education. To what extent do you agree or disagree?","zh":"大多数国家用监狱解决犯罪问题，但更实际的办法是给公众更好的教育。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：比较“关进监狱（prison）”与“提供更好的教育（better education）”哪个是解决犯罪更实际的办法。","points":["教育的作用（治本）：普及教育与法治意识能帮青少年获得谋生技能、远离贫困犯罪，从根源降低犯罪率。","监狱的作用（治标且必要）：对暴力犯罪和惯犯，仅靠教育无法威慑，必须通过监禁隔离危险分子、维护公共安全；两者结合最有效。"],"vocab":"deter crime（威慑犯罪） · law-abiding citizens（守法公民） · violent offenders（暴力罪犯） · public safety（公共安全）"},"id":"002f61b3b5"},{"week":"9/14–9/20","type":"discussion","src":"iwp","q":"Some people argue that job satisfaction is more important than job security, while others believe that they cannot always expect job satisfaction and a permanent job is more important. Discuss both these views and give your own opinion.","zh":"有人认为工作满意度比工作稳定更重要，也有人认为不能总指望满意，一份稳定的工作更重要。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：讨论“工作满意度更重要”还是“工作稳定（铁饭碗）更重要”，并给出个人看法。","points":["甲方（工作满意度优先）：做热爱的事更有内驱力与创造力，长期从事讨厌的工作会导致心理压抑与效率低下。","乙方（工作稳定优先）：大多数人面临房贷、养家和医疗开支，稳定的收入（steady income）是生活安全感的前提，很难奢求每份工作都充满乐趣。"],"vocab":"job satisfaction（工作满意度） · job security（工作稳定性） · financial obligations（经济负担/责任） · sense of fulfilment（成就感）"},"id":"dc039768b4"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"People living in the 21st century have a better quality of life than people who lived in previous centuries. To what extent do you agree or disagree?","zh":"生活在 21 世纪的人比以前几个世纪的人生活质量更高。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：比较“21 世纪的人”与“过去几个世纪的人”生活质量（quality of life）是否更高。","points":["同意（物质与健康大幅提升）：现代医学延长了人均寿命，互联网、交通与家电极大改善了居住舒适度与教育机会。","让步（现代生活的新困扰）：虽然快节奏工作、高房价与环境污染带来精神压力，但相比过去的饥荒、瘟疫与贫困，现代生活质量整体依然显著更高。"],"vocab":"standard of living（生活水平） · life expectancy（人均寿命） · medical advances（医疗进步） · mental stress（精神压力）"},"id":"20ebbd1327"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some people say that schools are no longer necessary because children can get so much information through the Internet, and they can study just as well at home. To what extent do you agree or disagree?","zh":"有人说学校已经没有必要了，因为孩子可以从网上获取大量信息，在家也能学得一样好。你在多大程度上同意？","ideas":{"focus":"同意与否：题干有绝对化表述“schools are no longer necessary（学校不再必要）”，建议反驳这一极端结论。","points":["承认网课便利：互联网确实提供了海量学习资料，方便学生按自己的节奏查漏补缺。","为什么学校不可替代：① 实体学校提供同龄人社交、团队合作与体育活动，培养健全人格；② 缺乏老师当面监督与结构化课程，未成年人在家很难长期自律。"],"vocab":"online learning resources（线上学习资源） · face-to-face interaction（面对面互动） · socialisation（社会化/社交能力培养） · structured environment（有组织的教学环境）"},"id":"209540d396"},{"week":"9/7–9/13","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some people say that the purpose of education is to prepare individuals to be useful to society. Others say its purpose is to prepare individuals to achieve personal ambitions. Discuss both these views and give your own opinion.","zh":"有人说教育的目的是让人对社会有用，也有人说是帮助个人实现抱负。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：讨论教育的目的是“服务社会”还是“实现个人抱负”，结尾说明两者其实相辅相成。","points":["甲方（培养对社会有用的人）：公立教育由纳税人资助，理应培养医生、工程师、教师等合格劳动者，维持社会运转与经济发展。","乙方（助力个人抱负）：每个人天赋与兴趣不同，教育若忽视个人追求就会扼杀创造力；当个人实现职业理想时，往往也在为社会创造价值。"],"vocab":"contribute to society（为社会做贡献） · personal aspirations（个人抱负） · individual potential（个人潜能） · skilled workforce（有技能的劳动力）"},"id":"a574e81a82"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Parents should encourage children to spend less time studying and more time doing physical activities. To what extent do you agree or disagree?","zh":"家长应该鼓励孩子少花时间学习，多做体育活动。你在多大程度上同意？","ideas":{"focus":"建议类同意与否：评估“家长是否应鼓励孩子少花时间学习、多做体育活动”，可根据当下学生现状表态。","points":["支持增加体育运动：如今许多孩子课业负担过重、久坐不动，导致近视和肥胖；运动能强身健体、释放压力，反而能提高学习时的专注力。","注意平衡度：鼓励运动不代表荒废学业，合理的时间管理（time management）能让文化课学习与每天一小时锻炼兼得。"],"vocab":"sedentary lifestyle（久坐不动的生活方式） · physical fitness（体能/身体健康） · academic performance（学业表现） · strike a balance（取得平衡）"},"id":"ff6b5923ec"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Many people today feel that most urgent problems can only be solved by international cooperation. To what extent do you agree or disagree?","zh":"很多人认为，当今大多数紧迫问题只能通过国际合作来解决。你在多大程度上同意？","ideas":{"focus":"同意与否：注意题干限定词“most urgent problems can ONLY be solved by international cooperation（大多数紧迫问题只能靠国际合作解决）”。","points":["跨国紧迫问题确实必须靠国际合作：气候变化、跨国传染病、跨国犯罪和难民危机跨越国界，任何单一国家都无法独立解决。","部分国内紧迫问题需靠本国政策：如本国住房短缺、教育不公、养老保障和城市交通拥堵，主要依靠各国政府自身的财政与立法改革。"],"vocab":"global challenges（全球性挑战） · climate change（气候变化） · domestic issues（国内问题） · joint efforts（共同努力）"},"id":"01fde4b498"},{"week":"9/7–9/13","type":"advantages","src":"iwp","q":"In some countries, it is possible for people to have a variety of food that has been transported from all over the world. Do the advantages outweigh the disadvantages?","zh":"在一些国家，人们可以吃到从世界各地运来的各种食物。这样利大于弊吗？","ideas":{"focus":"利弊比较（outweigh）：讨论“食用世界各地长途运输来的进口食物”利是否大于弊（可参考原作者 C19-T4 全球食物话题）。","points":["好处（Advantages）：打破季节与地域限制，丰富市民餐桌营养，同时促进农业出口国经济增长。","坏处（Disadvantages）：长途冷链航空运输消耗大量燃料、增加碳排放（food miles）；且进口廉价农产品可能冲击本地农民生计。"],"vocab":"imported food（进口食品） · food miles（食物运输里程） · out-of-season fruit（反季节水果） · local farmers（本地农民）"},"id":"d63cf877c1"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Housing is a basic necessity for everyone. Therefore, the government should provide free housing for people who cannot afford to pay for it. To what extent do you agree or disagree?","zh":"住房是每个人的基本需求，所以政府应该给买不起房的人提供免费住房。你在多大程度上同意？","ideas":{"focus":"建议/政策类同意与否：评估“政府是否应当为买不起房的人提供免费住房（free housing）”。","points":["合理初衷与局限：保障弱势群体有栖身之所（basic shelter）体现社会公平；但完全免费提供住房会给政府财政带来巨大压力，还可能削弱部分人的工作动力。","更可行的替代方案：对极度贫困或残障人士提供免费安置，对普通低收入群体提供低租金公租房（subsidized housing）或购房补贴更为务实。"],"vocab":"affordable / subsidized housing（保障房/公租房） · low-income families（低收入家庭） · tax burden（税收负担） · social welfare（社会福利）"},"id":"f77fb3e0f6"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"It is a natural process for animal species to become extinct (e.g. dinosaurs, dodos). There is no reason why people should try to prevent this from happening. To what extent do you agree or disagree?","zh":"物种灭绝（比如恐龙、渡渡鸟）是自然过程，人类没有理由去阻止。你在多大程度上同意？","ideas":{"focus":"同意与否：题干用恐龙自然灭绝推导出“人类没理由阻止物种灭绝”，核心反驳点是区分“自然演化灭绝”与“人类活动导致的加速灭绝”。","points":["指出逻辑漏洞：恐龙灭绝是自然灾难，而当今绝大多数濒危物种是因为人类滥砍滥伐、偷猎和工业污染而加速灭绝，人类对此负有直接责任。","保护物种的现实意义：生物多样性（biodiversity）维持着生态链平衡、农业授粉与医药研发，一旦生态链断裂，最终受威胁的是人类自身。"],"vocab":"animal extinction（动物灭绝） · human activities（人类活动） · biodiversity（生物多样性） · ecological balance（生态平衡）"},"id":"9c4d60b883"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Video records are a better way to learn about the way other people in the world live than written documents. To what extent do you agree or disagree?","zh":"要了解世界上其他人怎样生活，视频记录比文字资料更好。你在多大程度上同意？","ideas":{"focus":"比较类同意与否：比较“视频记录（video records）”与“文字资料（written documents）”哪种更能让人了解他国人民的生活方式。","points":["视频记录的优势：直观呈现画面、声音、表情和日常细节，更具沉浸感且跨越文字阅读门槛。","文字资料的不可替代性：文字能深入剖析行为背后的文化背景、历史脉络与心理动机，避免视频剪辑带来的表面化或片面印象；两者结合最佳。"],"vocab":"visual representation（视觉呈现） · immersive experience（沉浸式体验） · in-depth analysis（深入分析） · cultural context（文化背景）"},"id":"a2a43879f8"},{"week":"9/7–9/13","type":"posneg","src":"iwp","flags":["repeat","recycled"],"q":"Today more people put personal and private information online (address, phone number and credit card number) to do everyday activities such as banking and shopping. Is this a positive or negative development?","zh":"如今更多人为了网上银行、购物等日常事务，在网上填写地址、电话、信用卡号等个人信息。这是积极还是消极的发展？","ideas":{"focus":"积极还是消极：评估“人们为了网购、网银等日常事务在网上填写个人隐私信息”是积极还是消极趋势。","points":["积极面（极大便利）：足不出户即可完成转账、挂号、购物与送货上门，大幅节省排队时间、提高社会运转效率。","消极面（隐私与诈骗风险）：数据库黑客攻击或商家倒卖信息会导致个人隐私泄露（data breach）、垃圾推销甚至电信诈骗；需靠加密技术与立法监管防范。"],"vocab":"online transactions（线上交易） · privacy leakage / data breach（隐私/数据泄露） · identity theft（身份盗用） · cybersecurity regulations（网络安全法规）"},"id":"38255b83c1"},{"week":"9/1–9/6","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some people believe that spending money on developing technology for space exploration is not justifiable and that there are more beneficial ways to spend this money. To what extent do you agree or disagree?","zh":"有人认为花钱发展太空探索技术不合理，这笔钱有更好的用处。你在多大程度上同意？","ideas":{"focus":"建议/政策类同意与否：评估“花钱发展太空探索技术是否合理，还是应该花在更有益的地方”。","points":["质疑太空支出的理由：地球上仍有贫困、疾病和环境污染急需资金解决，太空项目耗资巨大且短期内普通人看不见直接回报。","支持太空探索的理由：卫星通信、气象预报、GPS 导航和许多医疗新材料都源于航天技术转化；长期看还关乎人类资源拓展与科学进步。"],"vocab":"space exploration（太空探索） · technological spin-offs（技术衍生应用） · satellite communication（卫星通信） · pressing earthly problems（紧迫的地球民生问题）"},"id":"c995330a32"},{"week":"9/1–9/6","type":"twopart","parts":"原因 + 积极还是消极","src":"iwp","flags":["recycled"],"q":"Fewer and fewer people today write by hand using a pen or pencil. What are the reasons for this? Is this a positive or a negative development?","zh":"如今用笔手写的人越来越少。原因是什么？这是积极还是消极的发展？","ideas":{"focus":"双问题（原因 + 积极还是消极）：第一段写“用笔手写的人越来越少”的原因，第二段判断这一现象是积极还是消极。","points":["第一问（原因）：智能手机、电脑和云文档普及，打字与语音输入在工作和学习中效率远高于手写。","第二问（积极或消极）：在效率与环保无纸化上是积极进步；但导致提笔忘字（character amnesia）和书写美感退化，因此可评判为“喜忧参半或利大于弊”。"],"vocab":"digital devices（电子设备） · paperless office（无纸化办公） · handwriting skills（书写技能） · efficiency and convenience（高效与便利）"},"id":"f6983bebbb"},{"week":"9/1–9/6","type":"problem","parts":"原因 + 解决办法","src":"iwp","q":"In recent years, modern lifestyles and increasingly busy schedules have had a significant impact on people's eating habits, leading to serious health problems. What are the causes of this trend and what solutions can be implemented to address it?","zh":"近年来，现代生活方式和越来越忙的日程极大影响了人们的饮食习惯，导致严重的健康问题。原因是什么？可以采取什么解决办法？","ideas":{"focus":"原因 + 解决：第一段写“现代快节奏生活如何改变饮食习惯并引发健康问题”，第二段给可执行的解决办法。","points":["原因：工作加班多、通勤长，人们没时间买菜做饭，大量依赖高油高糖高盐的快餐与外卖（fast food and takeaway）。","解决：① 政府强制食品包装标注醒目的热量与营养标签，并对高糖饮料征税；② 企业与学校提供健康食堂餐食，个人利用周末提前备餐。"],"vocab":"processed food（加工食品） · obesity and diabetes（肥胖与糖尿病） · nutritional labels（营养标签） · balanced diet（均衡饮食）"},"id":"dd6cb51d37"},{"week":"9/1–9/6","type":"opinion","src":"iwp","note":"回忆不完整，缺少提问句，多半是 To what extent do you agree or disagree?","q":"Once children start school, teachers have more influence on their intellectual and social development than parents.","zh":"孩子上学以后，老师对他们智力和社交发展的影响比父母更大。","ideas":{"focus":"比较类同意与否：注意题干限定范围“Once children start school（孩子上学后）”以及两个维度“intellectual and social development（智力与社交发展）”。","points":["老师和学校的影响：上学后孩子大部分白天时间在学校度过，老师受过专业训练，在系统化知识传授（智力）与班级同伴交往规则（社交）上确实影响更大。","父母的持续作用：父母依然是孩子情绪安全感、道德价值观与家庭教养的核心榜样，不能因为上学就完全忽视家庭教育。"],"vocab":"intellectual development（智力发展） · peer interaction（同伴交往） · professional pedagogy（专业教学法） · role models（榜样）"},"id":"0e9c146055"},{"week":"9/1–9/6","type":"opinion","src":"iwp","q":"The media should include more good stories which report good news. To what extent do you agree or disagree?","zh":"媒体应该多报道好消息。你在多大程度上同意？","ideas":{"focus":"建议类同意与否：评估“媒体是否应该多报道好消息（good news）”。","points":["支持多报好消息：长期铺天盖地的灾难、犯罪与冲突报道会让公众产生焦虑与无力感（compassion fatigue）；正面报道能传递希望、激励善行。","不能掩盖真实问题：新闻的核心职责是客观反映现实与舆论监督，负面报道能曝光社会弊病、提醒公众防范风险，关键在于真实与比例平衡。"],"vocab":"positive news coverage（正面新闻报道） · public anxiety（公众焦虑） · media watchdog（媒体监督） · objective reporting（客观报道）"},"id":"2d26e340c3"},{"week":"9/1–9/6","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some believe that it is good for a country's culture to import films and TV programmes, while others think a country should have its own films and TV programmes. Discuss both views and give your own opinion.","zh":"有人认为进口影视节目对一个国家的文化有好处，也有人认为国家应该有自己的影视节目。讨论双方观点并给出你的看法。","ideas":{"focus":"双边讨论：讨论“进口外国影视节目对本国文化有益”与“应当发展本国影视节目”，结尾可主张“引进优质外片的同时扶持本土创作”。","points":["甲方（进口影视有益）：让观众了解多元文化与不同视角，同时倒逼本土影视行业学习先进的拍摄技术与叙事手法。","乙方（发展本土影视）：过度依赖好莱坞等外国大片可能造成文化冲击，本土影视能记录本国历史、方言与价值观，守护文化自信。"],"vocab":"imported films（进口电影） · cultural diversity（文化多样性） · domestic film industry（本土影视产业） · cultural heritage（文化遗产）"},"id":"cb24957640"},{"week":"9/1–9/6","type":"advantages","src":"mentor","note":"9 月 4 日大陆场考生回忆，只记得话题，没有原题措辞","q":"（原题措辞未找到）Driverless vehicles: advantages and disadvantages.","zh":"无人驾驶交通工具的利弊。","ideas":{"focus":"利弊类：全面分析“无人驾驶汽车（driverless vehicles）”的优势与风险。","points":["好处（Advantages）：减少因疲劳驾驶、酒驾或分心造成的人为车祸；方便老年人与残障人士独立出行，并提升道路通行效率。","坏处（Disadvantages）：极端天气或复杂路况下算法可能失灵，事故法律责任难界定；且会导致大量出租车与货车司机失业。"],"vocab":"autonomous / driverless vehicles（无人驾驶汽车） · human error（人为失误） · road safety（道路安全） · legal liability（法律责任）"},"id":"6a11fe3036"}],"task1":[{"week":"10/5–10/11","type":"bar","src":"iwp","flags":["recycled"],"q":"The chart below gives information about how children aged 11 to 16 in the UK travel to school over a year.","chart":"school-journeys","img":"/images/recent-questions/f438fb574c5d.png","id":"71040883ec","chartHtml":"\u003cdiv class=\"chart-scroll\">\u003csvg class=\"chart-svg\" viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"Journeys to school by children aged 11–16 in the UK\">\u003ctext class=\"ch-title\" x=\"320\" y=\"20\" text-anchor=\"middle\">Journeys to school by children aged 11–16 in the UK\u003c/text>\u003cline class=\"ch-grid\" x1=\"58.4\" x2=\"624\" y1=\"271\" y2=\"271\"/>\u003ctext class=\"ch-tick\" x=\"50.4\" y=\"275\" text-anchor=\"end\">0%\u003c/text>\u003cline class=\"ch-grid\" x1=\"58.4\" x2=\"624\" y1=\"247.5\" y2=\"247.5\"/>\u003ctext class=\"ch-tick\" x=\"50.4\" y=\"251.5\" text-anchor=\"end\">10%\u003c/text>\u003cline class=\"ch-grid\" x1=\"58.4\" x2=\"624\" y1=\"224\" y2=\"224\"/>\u003ctext class=\"ch-tick\" x=\"50.4\" y=\"228\" text-anchor=\"end\">20%\u003c/text>\u003cline class=\"ch-grid\" x1=\"58.4\" x2=\"624\" y1=\"200.5\" y2=\"200.5\"/>\u003ctext class=\"ch-tick\" x=\"50.4\" y=\"204.5\
