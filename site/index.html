","ez"],"qs":[["Which do you prefer, fashionable shoes or comfortable shoes?","你更喜欢时尚的鞋还是舒适的鞋？"],["How much money do you usually spend on shoes?","你一般在鞋子上花多少钱？"],["Have you ever bought shoes online?","你在网上买过鞋吗？"],["Do you like buying shoes? How often?","你喜欢买鞋吗？多久买一次？"],["What is your favourite type of shoes?","你最喜欢哪种鞋？"]],"tip":"先表明立场（舒适或时尚），再给一个原因和一个例子。和原作者的 Clothing 素材相近。","see":["a-p1-clothing"]},{"id":"paper","en":"Paper","zh":"纸张","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["Do you carry paper and pens with you when you go out?","你出门会带纸和笔吗？"],["Do people still keep handwritten letters today?","现在人们还会保存手写信吗？"],["Do you still write physical letters?","你还会写纸质信吗？"],["What did you like to do with paper as a child?","小时候你喜欢用纸做什么？"],["Have you made any crafts with paper?","你用纸做过手工吗？"]],"tip":"从怀旧角度切入，比如小时候折纸、给长辈写信的具体细节。和 Emails 话题的手写信素材能共用。"},{"id":"tiredness","en":"Tiredness","zh":"疲劳","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["What do you do when you feel tired?","你觉得累的时候会做什么？"],["When would you feel tired?","什么时候你会觉得累？"],["Do you often feel tired?","你经常觉得累吗？"],["When you feel tired, do you still go out with your friends?","累的时候你还会和朋友出去吗？"]],"tip":"先说原因（学习、工作、睡眠不足），再说缓解方式（睡觉、运动、听音乐）。"},{"id":"rubbish","en":"Rubbish and recycling","zh":"垃圾与回收","tags":["mainland"],"src":["xdf","chelsea","joe","ieltsa"],"qs":[["Did you recycle when you were a kid?","小时候你做过回收吗？"],["Is waste sorting common in your country?","你的国家垃圾分类普遍吗？"],["How do you recycle things like paper and plastic?","你怎么回收纸和塑料这类东西？"],["What do you do when you see rubbish on the street?","你看到街上有垃圾会怎么做？"]],"tip":"讲自己家或学校的分类做法，再加一个观点（政府和个人都要参与）。原作者 P2-9 的“山上垃圾”细节可以拿来用。","see":["a-p2-09"]},{"id":"collecting","en":"Collecting things","zh":"收集东西","tags":["mainland"],"src":["xdf","chelsea","joe","week"],"qs":[["Do you collect things?","你收集东西吗？"],["Where do you usually keep things you need?","你通常把需要的东西放在哪里？"],["Would you keep old things for a long time? Why?","你会长期保留旧东西吗？为什么？"],["Are there any things you have kept from your childhood?","有没有你从小保留下来的东西？"]],"tip":"说收集什么、为什么开始、对它有什么感情。小众但真实的爱好更好讲。"},{"id":"lost-found","en":"Lost and found","zh":"失物招领","tags":["mainland"],"src":["xdf","chelsea","joe","week"],"qs":[["Have you ever lost your keys?","你丢过钥匙吗？"],["Will you post on social media if you lose your item?","如果丢了东西，你会在社交媒体上发帖吗？"],["Have you ever lost things?","你丢过东西吗？"],["Do you report to the police when finding something lost by others? Why?","捡到别人丢的东西，你会报警吗？为什么？"],["What will you do if you find something lost by others?","如果你捡到别人丢的东西，你会怎么做？"]],"tip":"讲一次丢东西或捡东西的经历，按“时间 - 地点 - 结果”组织。和 Part 2“公共场所丢东西”共用一个故事。","link":["lost-public"]},{"id":"plants","en":"Flowers / Plants","zh":"花和植物","tags":["mainland"],"src":["xdf","ez"],"qs":[["Do you keep plants at home?","你家里养植物吗？"],["What plant did you grow when you were young?","你小时候种过什么植物？"],["Do you know anything about growing plants?","你懂种植物吗？"],["Do people in your country send plants as gifts?","在你的国家，人们会送植物当礼物吗？"]],"tip":"具体说一种植物（绿萝、多肉），讲你怎么照顾它。","note":"新东方列为大陆新题，只给了中文“你喜欢花吗？你家养植物吗？”。英文题目取自 EzIELTS 往季的 Plants 话题，本季具体问法待核对。"},{"id":"travelling","en":"Travelling","zh":"旅行","tags":[],"src":["jsl","chelsea","joe","ez"],"qs":[["Do you prefer to sit by the window when travelling?","旅行时你更喜欢坐在窗边吗？"],["Did you have a long journey with your family as a child?","小时候你和家人有过长途旅行吗？"],["What do you usually do during a long journey?","长途旅行时你通常做什么？"],["Do you prefer travelling alone or with other people?","你更喜欢一个人旅行还是和别人一起？"],["What is the longest journey you have ever taken?","你去过最远的一次旅行是哪次？"]],"tip":"说交通方式（火车、飞机、自驾），再讲一次具体的旅行。阳朔攀岩的故事可以直接用。","see":["a-p2-01"]},{"id":"politeness","en":"Politeness","zh":"礼貌","tags":[],"src":["jsl","chelsea","joe","ieltsa","week"],"qs":[["What did you do to show your politeness as a child?","小时候你是怎么表现礼貌的？"],["On what occasions should we be polite?","我们在什么场合应该有礼貌？"],["Do you think being polite is very important?","你认为礼貌很重要吗？"],["How did you learn to be polite as a child?","你小时候是怎么学会礼貌的？"]],"tip":"从“小时候”和“现在”两个角度讲，各举一个具体例子（比如见到长辈主动问好）。"},{"id":"fruit-veg","en":"Fruit and vegetables","zh":"水果和蔬菜","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Do people in your country like planting vegetables?","你的国家的人喜欢种菜吗？"],["Were there any kind of fruits and vegetables you disliked as a child?","小时候有没有你不喜欢吃的水果或蔬菜？"],["What kind of fruits and vegetables do you dislike?","你不喜欢哪些水果和蔬菜？"],["Where do you usually buy fruit and vegetables?","你通常在哪里买水果和蔬菜？"],["How often do you eat fruit and vegetables?","你多久吃一次水果和蔬菜？"],["Do you like eating vegetables?","你喜欢吃蔬菜吗？"],["Did you like eating vegetables when you were a child?","你小时候喜欢吃蔬菜吗？"],["Do people often grow vegetables by themselves?","人们经常自己种菜吗？"]],"tip":"说具体的品种、购买地点和吃的频率，细节越具体越自然。"},{"id":"advertisement","en":"Advertisement","zh":"广告","tags":[],"src":["chelsea","joe","ez"],"qs":[["Do you often see advertisements when you are on your phone or computer?","你用手机或电脑时经常看到广告吗？"],["What kind of advertising do you like?","你喜欢哪种广告？"],["Do you like advertisements?","你喜欢广告吗？"],["Do you see a lot of advertising on trains or other transport?","你在火车或其他交通工具上会看到很多广告吗？"],["Is there an advertisement that made an impression on you when you were a child?","小时候有没有一则给你留下深刻印象的广告？"]],"tip":"选一种广告（短视频广告、地铁广告），说你的态度和原因。P3 必备里的“消费与广告”语料可以直接用。","see":["a-p3-base"]},{"id":"name","en":"Name","zh":"名字","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Do you often forget people's names?","你经常忘记别人的名字吗？"],["How do you feel when people can't remember your name?","别人记不住你的名字时，你有什么感受？"],["How do you remember people's names?","你是怎么记住别人名字的？"],["Is it easy for you to remember people's names?","你容易记住别人的名字吗？"]],"tip":"说你记名字的方法（联想、重复、写下来），再讲一次记不住名字的尴尬经历。"},{"id":"secondary-school","en":"Secondary school","zh":"中学","tags":[],"src":["jsl","chelsea","joe","ieltsa"],"qs":[["Is there anything you miss about your secondary school?","你有没有怀念中学的什么？"],["What was your favourite subject at secondary school?","你中学时最喜欢的科目是什么？"],["Were there any subjects that you found difficult at secondary school?","中学时有没有你觉得很难的科目？"],["Do you remember your first day at secondary school?","你还记得中学的第一天吗？"]],"tip":"选一个科目或一位老师，讲具体回忆，多用过去时。原作者 teacher 话题的素材能接上。","see":["a-p1-teacher"]},{"id":"feeling-bored","en":"Feeling bored","zh":"无聊","tags":["later"],"src":["week","joe","ez","sf"],"qs":[["Do you often feel bored?","你经常觉得无聊吗？"],["When would you feel bored?","你什么时候会觉得无聊？"],["What do you do when you feel bored?","无聊的时候你会做什么？"],["What sort of things do you find most boring now?","现在你觉得什么事最无聊？"],["What do you do to stop yourself feeling bored?","你怎么让自己不无聊？"],["Did you ever find school boring when you were a child?","小时候你觉得上学无聊吗？"],["Do you think childhood is boring or adulthood is boring?","你觉得童年更无聊还是成年更无聊？"]],"tip":"举一个具体的无聊场景（排队、堵车、等人），再说你怎么打发时间。原作者 P2-7 堵车时听播客、给爷爷奶奶打电话的细节正好能用。","see":["a-p2-07"]},{"id":"opportunities","en":"Opportunities","zh":"机会","tags":["later"],"src":["week","joe","ez","ieltsa"],"qs":[["Is it important to seize opportunities when they come?","机会来了就要抓住，这重要吗？"],["Would you like to have more opportunities in the future? Why?","你希望将来有更多机会吗？为什么？"],["What would you do if you had more opportunities?","如果有更多机会，你会做什么？"],["How can you get more opportunities?","怎样才能获得更多机会？"],["Do you have many opportunities in life?","你生活中机会多吗？"],["Did you get many opportunities to try new activities when you were younger?","你小时候有很多尝试新活动的机会吗？"]],"tip":"用一次抓住机会的经历回答，比如实习、做志愿者（原作者 P2-8 的自动驾驶实习）。Ieltsa 的问法偏“小时候尝试新事物的机会”，兴趣班也能讲。","see":["a-p2-08"]},{"id":"friends","en":"Friends","zh":"朋友","tags":["later"],"src":["week","ez","sf"],"qs":[["Do you have a friend you have known for a long time?","你有认识很久的朋友吗？"],["What do you usually do with your friends?","你通常和朋友做什么？"],["Do you prefer to spend time with one friend or a group?","你更喜欢和一个朋友还是一群朋友待在一起？"],["How important are friends to you?","朋友对你有多重要？"],["Would you invite friends to your home?","你会邀请朋友来家里吗？"]],"tip":"固定一个老朋友（认识多久、怎么认识），后面几题都围绕他答，不用每题重新想人。"},{"id":"punctuality","en":"Punctuality","zh":"守时","tags":["later"],"src":["ez","sf"],"qs":[["Are you a punctual person?","你是守时的人吗？"],["Do you think it is important to be on time?","你觉得准时重要吗？"],["How do you feel when others are late?","别人迟到时你有什么感受？"],["How do you remind yourself to be on time?","你怎么提醒自己准时？"],["Why are some people consistently late?","为什么有些人总是迟到？"]],"tip":"说一个守时的习惯（提前 10 分钟出门、手机设闹钟），再讲一次别人迟到的小事。"},{"id":"emails","en":"Emails","zh":"邮件","tags":["later"],"src":["ez","sf"],"qs":[["Do you often send emails?","你经常发邮件吗？"],["Do you think sending emails will be more or less popular in the future?","你觉得以后发邮件会更普遍还是更少？"],["Did you receive any handwritten letters when you were a child?","小时候你收到过手写信吗？"],["Which do you prefer, writing a letter or sending a message?","你更喜欢写信还是发消息？"]],"tip":"学生发邮件多用于联系老师、投简历。手写信的部分和 Paper 话题共用素材。","link":["paper"]}],"p1Overseas":[{"en":"Day off","zh":"休息日"},{"en":"Dreams","zh":"梦境"},{"en":"Keys","zh":"钥匙"}],"categories":{"person":"人物","place":"地点","thing":"物品","event":"事件"},"p2":[{"id":"know-more","cat":"person","zh":"一见且想继续了解的人","alias":"想要了解更多的人","tags":["mainland"],"en":"Describe a person you only met once recently and want to know more about","say":["Who he/she is","When you met him/her","Why you want to know more about him/her","And explain how you feel about him/her"],"src":["xdf","chelsea","ez","sf","week"],"note":"补充包原来把新东方的“想要了解更多的人”和 Chelsea 的“一见且想继续了解的人”分成两题，其实是同一张卡，这里合并。","tip":"旅行或活动里只见过一次的人，比如在阳朔民宿遇到的攀岩者。重点讲“为什么想多了解”：他做的事你也想做。","p3":["What should we not talk about when we meet a person for the first time?","What can we do to leave a good impression on people we meet for the first time?","What qualities make true friends?","Is it important to have the same hobbies and interests when making friends?","On what occasions do people like to make friends?","How do people make friends in your country?"]},{"id":"taught-skill","cat":"person","zh":"教会你新技能的人","tags":["mainland"],"en":"Describe a person who taught you a new skill","say":["Who this person was","What the skill was","How you learned it","And explain how you felt about this person"],"src":["xdf","chelsea","joe"],"tip":"攀岩教练或攀岩搭档教你户外攀岩（原作者 P2-1、P2-2 的阳朔故事）。按“一开始很难 → 他怎么教 → 学会后的感受”讲。","see":["a-p2-01","a-p2-02"],"p3":["Why is self-discipline important when learning a new skill?","What are the differences between learning from a teacher and learning by oneself?","How do adults learn a new skill?","How can parents and teachers teach children new skills?","Where can children learn new skills?","Why should children learn new skills?"]},{"id":"success-business","cat":"person","zh":"有成功事业的人","alias":"在成功公司工作的人","tags":["mainland"],"en":"Describe a person you know who has a successful business","say":["Who this person is","How you got to know him/her","Why and how he/she started the business","What business he/she does","And explain why you think the business is successful"],"src":["xdf","joe","ieltsa"],"note":"新东方只给了中文题名“在成功公司工作的人”，没有英文题卡。Joe Speaking、Ieltsa 本季收录的相近题是这张，先按它准备。","tip":"家里做生意的亲戚、实习公司的老板都可以。讲清做什么生意、怎么起步、为什么成功（服务好、坚持、抓住机会）。","p3":["Why do some people start their own business?","Should governments provide financial support to start-ups?","Do most people prefer shopping at big stores or small stores?","What makes a business successful?","What makes a business fail?","Is it easy to set up a new business in your country?"]},{"id":"photos","cat":"person","zh":"爱拍照的人","tags":["mainland"],"en":"Describe a person you know who really likes taking photos","say":["Who the person is","When and how you got to know him/her","Where he/she takes photos","And explain how you feel about him/her"],"src":["xdf","chelsea","joe","ieltsa"],"tip":"可以把原作者 P2-2 里一起爬山看日出的攀岩搭档改成爱拍照的人：每天拍日出、拍攀岩。","see":["a-p2-02"],"p3":["Why are some people keen on taking photos?","What kind of photos do people often take?","When do people like taking photos?","Do you think it is okay to take photos everywhere?","Why do tourists like taking photos while they are travelling?","Some people do not mind others walking into their shots when they are taking photos. What do you think?"]},{"id":"difficult-success","cat":"person","zh":"做了一件困难的事并成功的人","tags":[],"en":"Describe a person you know who did something difficult and was successful","say":["Who this person is","What difficult thing this person did","Why this person was successful","And explain how you feel about this person"],"src":["jsl","chelsea","joe"],"tip":"基普乔格两小时内跑完马拉松（原作者 P2-5），或表哥坚持学中医（P2-4）。讲清难在哪、怎么做到。注意 P3 全在问公司和创业。","see":["a-p2-05","a-p2-04"],"p3":["In which sectors are companies more likely to succeed in your country?","Is it easy to start up a company?","Other than making money, what is more important for a company?","Does money equal success?","How can companies help protect the environment?","Is it difficult to do business in today's world?"]},{"id":"older-admire","cat":"person","zh":"尊敬的比你年长的人","tags":[],"en":"Describe someone who is older than you that you admire","say":["Who this person is","How you knew this person","What kinds of things you like to do together","And explain how you feel about this person"],"src":["jsl","chelsea","joe","ieltsa","week"],"tip":"爸爸：爱跑步，带你看破 2 马拉松直播（原作者 P2-5）。也可以是爷爷奶奶、老师。","see":["a-p2-05"],"p3":["What do old people usually do in their daily life?","Why is there a generation gap between the young and the old?","Has old people's life quality improved when compared to the past?","What can young and old people learn from each other?","What sports are popular among older people?","What kinds of things do the elderly remember for a long time?"]},{"id":"happy","cat":"person","zh":"快乐的人","tags":[],"en":"Describe a happy person you know","say":["Who this person is","What he/she is like","How he/she shows happiness","And explain why you think he/she is a happy person"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"一个总是笑的朋友或长辈。用两件小事说明他怎么表现快乐，结尾说他为什么快乐（知足、爱好多）。","p3":["When do you think people are happiest?","How can the arts spread positive emotions in society?","Do you think teachers are able to spot the unhappy children?","Should teachers know what children are doing all the time?","What would make a student happy at school?","Do you think doing a job that you like is more important than other things?"]},{"id":"organized","cat":"person","zh":"很有条理的人","tags":[],"en":"Describe a person you know who is very organized","say":["Who this person is","What this person usually does to stay organized","In what situations you have noticed this quality","And explain why you think being organized is important to him/her"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"学霸同学或表哥：每天列计划、东西放得整齐、考试前按计划复习。可以和“有健康作息的人”共用一个人。","link":["healthy-habits"],"p3":["Why is it important for people to be organized?","Do you think it is important for managers to be well organized?","Should parents teach their children to be organized?","Do you think children should learn to be organized from a young age?","What can people do to become more organized?","Are organized people more likely to be successful at work or in their studies?"]},{"id":"popular","cat":"person","zh":"受欢迎的人","tags":[],"en":"Describe a popular person","say":["Who this person is","What kind of person he or she is","When you see him/her normally","And explain why you think this person is popular"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a person you know who is popular with many people。","tip":"班上人缘好的同学或一位老师。P3 会问好老师的品质，准备一两个观点。","p3":["Why do people want to be popular?","Is it easier to become popular nowadays?","What are the qualities of being a good teacher?","Do you think good teachers are always popular among students?","Is it important for a teacher to be popular?","Why are some students popular in school?"]},{"id":"sportsperson","cat":"person","zh":"钦佩的运动员","tags":[],"en":"Describe a successful sportsperson you admire","say":["Who he/she is","What you know about him/her","What he/she is like in real life","What achievement he/she has made","And explain why you admire him/her"],"src":["chelsea","joe","ez","ieltsa"],"note":"Ieltsa 还收录了相近的“在比赛中表现很好的运动员”（a sportsperson you know about who did very well at an event）。","tip":"基普乔格（原作者 P2-5 有现成素材），讲成就和他自律的一面。","see":["a-p2-05"],"p3":["What qualities should an athlete have?","Is talent important in sports?","Is it easy to identify children's talents?","Why are there so few top athletes?","What is the most popular sport in your country?","Should students have physical education and do sports at school?"]},{"id":"history","cat":"person","zh":"学习并喜欢历史的人","tags":[],"en":"Describe a person who learns history and loves history","say":["Who this person is","How he/she learns history","Why he/she loves history","And explain how you feel about him/her"],"src":["chelsea","joe","ieltsa","sf"],"tip":"爱看纪录片、逛博物馆的朋友或家人。讲他怎么学（看书、去博物馆、看纪录片）。","p3":["Besides big historical events, what else is important when learning history?","Do you think people should learn ancient history before learning modern history?","Is it important to learn how people in the past lived their lives?","How do children learn history before they attend school?","At what age do you think people should begin to learn history?","Do you think children should begin learning history from an early age?","Do you like learning history?"]},{"id":"fitness-helped","cat":"person","zh":"你帮他改善健康的人","tags":[],"en":"Describe a person whose health and fitness you have helped to improve","say":["Who this person was","Why you helped him/her","How you helped him/her","And explain whether it was easy or difficult"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法是“一个为改善健康做了些事的人”（a person you know who did something to improve his/her health and fitness），方向和这里相反，两种都准备一下。","tip":"带朋友或爸爸一起跑步、控制饮食，难点是坚持。可以借原作者跑西安马拉松的经历（P1 其他）。","see":["a-p1-other"],"p3":["What effect does stress have on health?","Which group pays more attention to health, young people or old people?"]},{"id":"handmade","cat":"person","zh":"擅长做手工的人","tags":[],"en":"Describe a person who is good at making things by hand","say":["Who this person is","What he/she makes","What materials or technologies he/she uses","And explain why you think this person is good at making things by hand"],"src":["chelsea","joe","ieltsa","sf"],"tip":"会做木工、折纸、做饭的长辈或同学。讲他做什么、用什么材料。P1 Paper 的折纸素材可以接上。","link":["paper"],"p3":["Why do some children enjoy making things by hand?","Do children these days still like doing arts and crafts?","Do you think art classes are important for children?","Is it good to have creative people in a team?","Does art, like music or theater, have an impact on society?","What impact can artistic buildings have on society?"]},{"id":"local-famous","cat":"person","zh":"本地名人","tags":[],"en":"Describe a famous person in your local area","say":["Who this person is","What he/she has done","Why he/she is popular","And explain how you feel about this person"],"src":["jsl","chelsea","ez","sf"],"tip":"当地有名的店主、运动员或作家都行。P3 只报了两道，都在问“受欢迎的学生”，可以和“受欢迎的人”一起准备。","link":["popular"],"p3":["Why are some students popular?","Is it always good to be a popular student at school?"]},{"id":"healthy-habits","cat":"person","zh":"有健康习惯和作息的人","tags":["later"],"en":"Describe a person you know who has healthy habits and a healthy daily routine","say":["Who this person is","How you got to know each other","What he/she does to keep this lifestyle","And explain how you feel about him/her"],"src":["week","roop"],"note":"9/26–10/2 考情周报的高频话题，题卡来自 English with Roop（10 月 8 日）。","tip":"早睡早起、每天运动的朋友，可以用原作者 P2-2 里每天 5:30 起床爬山的攀岩搭档。讲他每天怎么做，再说对你的影响。","see":["a-p2-02"],"p3":["Does the government play an important role in promoting a healthy lifestyle in a community?","Do you think it is important to live in a community where people have healthy lifestyles?","How can people relieve stress in daily life?","What effect does stress have on health?","What makes people stressed?","Which group pays more attention to health, young people or old people?"]},{"id":"free-time-place","cat":"place","zh":"有空时想去的地方","alias":"想去旅行的地方","tags":["mainland"],"en":"Describe a place you would like to visit in your free time","say":["Where it is","What you will do there","How long you will stay there","And explain why you would like to visit it"],"src":["xdf","ez"],"note":"新东方只给了中文题名“想去旅行的地方”，最接近的英文题卡是 EzIELTS 收录的这张。原作者 P2-3 就是这道题。","tip":"原作者 P2-3 有现成答案（阳朔）。","see":["a-p2-03"],"p3":["Why do you think some people choose not to travel abroad?","Do you think a gap period in life is important?"]},{"id":"boring-place","cat":"place","zh":"无聊的地方","tags":["mainland"],"en":"Describe a boring place","say":["Where it is","Who you went there with","What you did there","And explain why you think it is a boring place"],"src":["xdf","joe","ieltsa","sf"],"tip":"原作者 P2-7：去秦岭路上堵车两小时，到了山脚到处是垃圾。","see":["a-p2-07"],"p3":["Why do most children think education is boring?","Why aren't young people willing to listen to the experiences of older people?","What can people do when they feel bored?","Why are some teachers' classes boring? Are there any solutions?","Why do some young people feel bored when talking with old people?","Do most people think news about celebrities is boring?"]},{"id":"short-trip","cat":"place","zh":"经常去但不喜欢的短途旅行","alias":"不喜欢但经常去的地方","tags":["mainland"],"en":"Describe a short trip you often take but do not like","say":["Where you go","When you go there","Why you go there","And explain why you do not like the trip"],"src":["xdf","chelsea","joe","ieltsa"],"note":"新东方的“不喜欢但经常去的地方”应是这张卡的中文说法，合并为一题。","tip":"每天或每周的通勤：挤地铁、堵车（可以借原作者 P2-7 的堵车细节）。说清楚为什么不得不去。","see":["a-p2-07"],"p3":["Which is better for knowing more about a country, travelling or reading books about it?","How much time do you think people should spend on a trip abroad?","Who prefers travelling abroad, the young or the old?","Do people in your country like travelling abroad?","What are the benefits of travelling abroad?","What problems does it cause for transportation when everyone commutes at the same time?"]},{"id":"noisy","cat":"place","zh":"嘈杂的地方","tags":[],"en":"Describe a noisy place you have been to","say":["Where it is","When you went there","What you did there","And explain why you feel it's a noisy place"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"节假日的景区、施工的街道，或原作者 P2-12 里广州写字楼外的繁忙街道。可以和“拥挤的地方”共用。","see":["a-p2-12"],"link":["crowded"],"p3":["What kinds of noises are there in our life?","Which area is exposed to noise more, the city or the countryside?","How would people usually respond to noises in your country?","How can people consider others' feelings when chatting in public?","Do you think it is good for children to make noise?","Should children not be allowed to make noise under any circumstances?"]},{"id":"crowded","cat":"place","zh":"拥挤的地方","tags":[],"en":"Describe a crowded place you went to","say":["Where it was","When you went there","Who you went there with","What you did there","And explain how you felt about the experience"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a time when you went to a crowded place。","tip":"国庆去景区、春运火车站。可以和“嘈杂的地方”共用一个故事。","link":["noisy"],"p3":["Why do people go to crowded places?","Do you think there are some people who enjoy crowded places?","Which cities are overcrowded in your country?","Do you think it is a good trend to have more big cities?","Will there be more or less green space in cities in the future?","Will people use bikes more or less in cities in the future?"]},{"id":"natural-city","cat":"place","zh":"城市里喜欢去的自然之地","tags":[],"en":"Describe a natural place in your city that you enjoy visiting","say":["Where it is","What it is like","How often you go there","Who you often go there with","And explain why you enjoy visiting there"],"src":["jsl","chelsea","joe","sf"],"note":"相近问法：Ieltsa 的 a place where you enjoy spending time in nature。","tip":"城市公园、江边步道。原作者 P1 park 话题的素材可以用。","see":["a-p1-park"],"p3":["Do you think there should be many natural places in cities?","Do you think staying in a natural place would help change people's mood?","What kind of people do you think enjoy being in nature?","Do you think people should spend more time in nature?","What can the government do to encourage people to spend more time in nature?","Which is more important, protecting the environment or developing the economy?"]},{"id":"near-nature","cat":"place","zh":"去过的靠近自然的地方","tags":[],"en":"Describe somewhere near a natural place that you have been to","say":["Where this place is","Who you went there with","Why you went there","And explain how you feel about the place"],"src":["chelsea","ez"],"tip":"秦岭或阳朔（原作者 P2-7、P2-1）。","see":["a-p2-01","a-p2-07"],"p3":["Are there any natural attractions that are great to visit?","Do you think it is necessary to include natural spaces in a city?","Do you think people who live in natural places are more likely to protect it?"]},{"id":"city-again","cat":"place","zh":"想再去一次的城市","tags":[],"en":"Describe a city that you have been to and would like to visit again","say":["When you visited it","What you did there","What it was like","And explain why you would like to visit it again"],"src":["chelsea","ez","sf"],"tip":"桂林、阳朔（原作者 P2-1）。","see":["a-p2-01"],"p3":["What's the difference between the city and the countryside?","Do you think people in the countryside are friendlier than people in the city?","Some people say large cities are suitable for old people. What do you think?","Do you think it is possible that all of the population move to cities?","Are there any changes in your city?","What should the government do to improve citizens' safety?"]},{"id":"building","cat":"place","zh":"喜欢去的建筑","tags":[],"en":"Describe a building you enjoy visiting (e.g. a library, a shopping mall, etc.)","say":["Where it is","How you knew it","What it looks like","And explain why you enjoy visiting it"],"src":["chelsea","joe","ieltsa"],"note":"Ieltsa 的问法：a public building you enjoy spending time in (e.g. a library, a sports centre)。","tip":"图书馆最好讲：外观、安静、书多、能专心。原作者 P2-12 是“不喜欢的高楼”，可以反着对比。","see":["a-p2-12"],"p3":["Do you think old buildings are valuable?","Do you think all old buildings should be demolished?","Why do people visit historic buildings?","Is it important to protect historic buildings? Why?","Why is it hard to protect historic buildings?","Should modern buildings replace traditional buildings?","Is it better to live in an apartment than in a house?","Why do some people prefer to live in the countryside?"]},{"id":"tech-own","cat":"thing","zh":"想拥有的科技产品（不能是手机）","tags":["mainland"],"en":"Describe a piece of technology (not a phone) that you would like to own","say":["What it is","How much it costs approximately","What you would use it for","And explain why you would like to own it"],"src":["xdf","ez"],"note":"新东方列为大陆新题，EzIELTS 把它归为往季保留题，本季报告还少。题卡取自 EzIELTS。","tip":"运动手表、平板、扫地机器人。说价格、用途、为什么想要。","p3":["How is technology today different from technology in the past?","What technology do young people tend to prefer?","Has technology changed the way people communicate?","What negative effects can technology have on relationships?","What are the differences between making friends online and in person?"]},{"id":"app","cat":"thing","zh":"常用的 App 或程序","tags":["mainland"],"en":"Describe a program or app on your computer or phone","say":["What it is","When and how you use it","Where you found it","And explain how you feel about it"],"src":["xdf","ez"],"note":"新东方列为大陆新题，EzIELTS 把它归为往季保留题。题卡取自 EzIELTS。","tip":"地图、记账、运动类 App。和 P1 Computers、原作者 websites 素材互通。","see":["a-p1-websites"],"link":["computers"],"p3":["What apps are most popular in your country?","How do older and younger people differ in the way they use apps?","Why do some people avoid using apps?","Should parents limit how much time children spend on apps?","Do you think young people are becoming too dependent on technology?"]},{"id":"special-food","cat":"thing","zh":"特别场合吃的食物","tags":["mainland"],"en":"Describe a food that people eat on special occasions/events","say":["What it is","What the special event/occasion is","How it is cooked/made","And explain why people eat it on that special occasion/event"],"src":["xdf","joe","ieltsa","sf"],"tip":"春节饺子、中秋月饼、生日蛋糕。讲怎么做，再说为什么那天吃。","p3":["Why are there special foods on special occasions or events?","What are the differences between everyday food and festival food?","What is special about the way this food is made?","What kinds of food are popular in your country?","Do people in your country like eating foreign food?","Do people today prefer eating at home or in a restaurant?","Are there any differences between the food people eat today and the food people ate in the past?","How have people's eating habits changed compared to the past?"]},{"id":"least-movie","cat":"thing","zh":"最不喜欢的电影","tags":[],"en":"Describe your least favourite movie","say":["When you watched it","Where you watched it","What it was about","And explain why it's your least favourite movie"],"src":["chelsea","joe","ieltsa","week"],"note":"考情周报里叫“不喜欢的电影”。Ieltsa 的问法：a time when you watched a film/movie that you didn't like。","tip":"一部口碑差或看不懂的电影。剧情一两句带过，重点讲不喜欢的原因（节奏拖、演技差）。原作者 P2-10 是喜欢的电影，可以拿来对比。","see":["a-p2-10"],"p3":["What kinds of movies are the most popular in your country?","What are the differences between watching movies at home and in a cinema?","Can movies help people better understand the cultural background of a country?","Are movies more likely to help people become more creative than books?"]},{"id":"gift","cat":"thing","zh":"想送朋友的礼物","tags":[],"en":"Describe a gift you would like to buy for your friend","say":["How you knew your friend","How long you have known him/her","How you would choose a gift for him/her","And explain why you would choose that gift for him/her"],"src":["chelsea","ez","sf","week"],"tip":"给攀岩搭档买一双攀岩鞋这类具体的东西。重点讲怎么挑、为什么是它。","p3":["When do people normally send gifts to others?","What do people usually consider when buying gifts?","Is it hard to choose a gift?","Will people feel happy when receiving an expensive gift?","Which do people give on traditional festivals, red envelopes or other kinds of gifts?","Are there any unlucky things that people should not buy as gifts in your country?"]},{"id":"exciting-book","cat":"thing","zh":"读起来开心的书","tags":["later"],"en":"Describe an exciting book that you enjoyed reading","say":["What kind of book it was","Why you decided to read it","What the book was about","And explain why you found it exciting"],"src":["week","joe","ieltsa"],"note":"考情周报里叫“读起来开心的书”，对应 Joe Speaking、Ieltsa 收录的这张卡（Ieltsa 标为本季新题）。","tip":"一本小说或运动员传记。讲类型、为什么读、讲了什么、精彩在哪。P3 会问书和改编电影，可以和“最不喜欢的电影”一起准备。","link":["least-movie"],"p3":["What kinds of books do people in your country enjoy reading?","What kinds of books do young and older people enjoy?","Do boys and girls tend to enjoy different kinds of books?","Do you think it is important to read a book before watching its film adaptation?","Why are films based on books sometimes disappointing?","Can films based on novels encourage people to read more?"]},{"id":"decision-happy","cat":"event","zh":"对结果满意的重要决定","tags":["mainland"],"en":"Describe a time you made an important decision and were happy with the result","say":["What the decision was","Why you made the decision","How easy it was for you to make the decision","And explain why you were happy with the result"],"src":["xdf","chelsea","joe","ieltsa"],"tip":"决定去阳朔做志愿者攀岩（原作者 P2-1），或决定读研（P2-8）。满意的原因要具体。","see":["a-p2-01","a-p2-08"],"p3":["What little decisions do people make every day?","Do you think it is a good idea to make a small decision every day?","How can we tell the difference between an important and an easy decision?","Which is better, to make a decision quickly or slowly?","Do you think most people's decisions are made in their 20s?","What if people in a group have different opinions on a decision?"]},{"id":"changed-decision","cat":"event","zh":"改变重要决定的经历","tags":["mainland"],"en":"Describe a time when you changed an important decision of yours","say":["When you changed the decision","What the original decision was","Why you changed it","And explain how you felt about the experience"],"src":["xdf","chelsea","ez","sf"],"tip":"原作者 P2-8：实习之后从自动驾驶改为机器人方向。","see":["a-p2-08"],"p3":["When do most children begin to make their own decisions?","Do children like to change their opinions?","Why do people change opinions?","Who do young people turn to for advice?","Do people like giving an opinion about politics?"]},{"id":"saved-money","cat":"event","zh":"省钱买想要的东西","tags":["mainland"],"en":"Describe a time when you saved money to buy something special","say":["What the special thing was","Why you wanted to buy it","How you saved money for it","And explain how you felt after buying it"],"src":["xdf","chelsea","joe","ieltsa","sf"],"tip":"攒钱买攀岩装备、耳机或一次旅行。讲怎么省（少点外卖、做兼职）。","p3":["What kind of things do people usually save money for?","Is it easier to spend money or save money?","Should parents teach their children to spend money freely or to save money?","Should schools teach children how to manage money from a young age?","Do you think it is easier to teach teenagers how to manage money when they are around 16 or 17 years old?","Should people spend time on charity, or just money?"]},{"id":"got-up-early","cat":"event","zh":"早起的经历","tags":["mainland"],"en":"Describe a time when you got up early","say":["When it was","What you did","Why you got up early","And how you felt about it"],"src":["xdf","joe","ieltsa"],"tip":"原作者 P2-2 有现成答案：5:30 起床爬电视塔山看日出。","see":["a-p2-02"],"p3":["Why do people get up early?","Do you know anyone who likes to get up early?","What kind of people like getting up early?","Why do some people like to stay up late?","What kinds of occasions need people to arrive early?","Is it good to arrive early in any situation?"]},{"id":"interview","cat":"event","zh":"看过的名人采访","tags":[],"en":"Describe a time you watched a famous person being interviewed","say":["Who the famous person was","What the interview was about","When and where you watched the interview","And explain how you felt about the interview"],"src":["chelsea","joe","ieltsa","sf","week"],"note":"Scorefactory 记的问法是 a time when you interviewed a famous person（你采访名人），准备时留意。","tip":"运动员赛后采访，比如基普乔格破 2 之后的采访（原作者 P2-5）。P3 大多在问求职面试。","see":["a-p2-05"],"p3":["What kinds of people are usually interviewed?","What kinds of things do famous people often say in an interview?","Why do some people dislike being interviewed?","Why do we need to attend interviews when applying for jobs?","What should people do to prepare for a job interview?","What should people wear to a job interview?","Why do some people think interviews are a waste of time?","What can we do to get a job interview?"]},{"id":"not-interested","cat":"event","zh":"听不感兴趣的话但继续听","tags":[],"en":"Describe a time when someone talked about something you were not interested in but you kept listening","say":["Who the person was","What he/she talked about","Why you kept listening","And explain how you felt about the experience"],"src":["chelsea","joe","ieltsa","sf"],"tip":"爸爸讲跑步，你当时完全不感兴趣但还是听了，后来也爱上跑步。原作者 P2-5 里正好有这句：my father loved running, but I was not interested in it at all。","see":["a-p2-05"],"p3":["How can we tell if a listener is listening carefully?","What would happen if the listener didn't listen carefully?","What kind of topics do young people like to talk about today?"]},{"id":"good-service","cat":"event","zh":"在商店得到好的服务","tags":[],"en":"Describe a time when you received good service in a shop/store","say":["Where the shop is","When you went to the shop","What service you received from the staff","And explain how you felt about the service"],"src":["chelsea","joe","ez","ieltsa","sf"],"tip":"在运动用品店买鞋，店员耐心帮你试、给建议。P1 Shoes 的素材能接上。","link":["shoes"],"p3":["Why are shopping malls so popular in your country?","What are the advantages and disadvantages of shopping in small shops?","Why do some people not like shopping in small shops?","What are the differences between online shopping and in-store shopping?","What are the advantages and disadvantages of shopping online?","Can consumption drive economic growth?"]},{"id":"evening-friends","cat":"event","zh":"和朋友度过的愉快夜晚","tags":[],"en":"Describe an enjoyable evening you had with your friends","say":["When and where it was","What you did","Who you spent the evening with","And explain why it was enjoyable"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"在阳朔和其他志愿者一起吃米粉、聊天（原作者 P2-1）。","see":["a-p2-01"],"p3":["Why do people need friends?","What are the differences between young people's leisure time activities and those of old people?","Do older people prefer spending time with family or with friends?","Is it important to communicate with your family?","What can we do to bring family members closer together?","How do people get along in a big family?"]},{"id":"waste-time","cat":"event","zh":"觉得浪费时间的日常活动","tags":[],"en":"Describe an activity you do regularly that you think is a waste of time","say":["What it is","When you usually do it","Why you do it","And explain why you think it is a waste of time"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"睡前刷短视频。P3 必备里“长时间刷社交媒体”的语料可以直接用。","see":["a-p3-base"],"p3":["Will you continue doing something when you are aware that it's a waste of time?","Is it good to have a daily routine?","How do you balance life and work?","What kinds of things make people feel pressured?","Do you think stress is important in people's lives?","Why do some people refuse to abide by rules?"]},{"id":"party","cat":"event","zh":"印象深刻的聚会","tags":[],"en":"Describe a party for a special event that impressed you a lot","say":["When and where it was held","What the party was held for","How many people attended it","And explain why it impressed you a lot"],"src":["jsl","chelsea","joe","ieltsa"],"tip":"毕业聚会或生日聚会。在哪办、多少人、为什么印象深。","p3":["What special events are celebrated in your country?","What festivals are the most important for people in your country?","When do people like to hold a party?","Do most people prefer to hold a party in a public place or a private place?","Do most people prefer to hold a party in a restaurant or in a pub?","Do you think people nowadays prefer attending big parties or small gatherings with close friends? Why?","Are there any differences between how young people and older people celebrate events with parties?","Do you think it's a waste of money for governments to celebrate national events?"]},{"id":"child-skill","cat":"event","zh":"小时候学到的新技能","tags":[],"en":"Describe a new skill you learned when you were a child","say":["What the skill was","Who taught you this skill","How you learned it","And explain how you felt about learning the skill"],"src":["jsl","chelsea","joe","ieltsa","sf"],"tip":"小学踢足球进了校队（原作者 P1 其他），或学骑自行车、游泳。","see":["a-p1-other"],"link":["taught-skill"],"p3":["What skills should children learn before they go to school?","Can a child learn skills from another child?","Do you think it is easier for children to learn new skills than for adults?","What are the differences between the way adults learn and the way children learn?","What are the differences between learning in a group and learning by yourself?","Is it important for everyone to have a specialized skill?"]},{"id":"course","cat":"event","zh":"印象深刻的课程","tags":[],"en":"Describe a course that impressed you a lot","say":["What the course was about","Where you took the course","What you did during the course","And explain why it impressed you a lot"],"src":["chelsea","ez","sf","week"],"tip":"大学专业课里的实验课（原作者 P1 study：测控专业、动手实验）。注意 P3 偏“记忆”话题。","see":["a-p1-study"],"p3":["What can we learn from history?","What do people need to remember in their daily lives?","Can technology help people remember things better? How?","Which can help people remember things better, words or photos?","Do people like things of memorial significance?","Why do some people have a better memory than others?"]},{"id":"lost-public","cat":"event","zh":"在公共场所丢东西","tags":["later"],"en":"Describe an occasion when you lost something in public","say":["What you lost","When and where you lost it","What you did to find it","And explain how you felt about it"],"src":["sf","ez","week"],"note":"Scorefactory 9 月 12 日补充的新卡，9/26–10/2 考情周报 Top10。","tip":"在地铁或景区丢了耳机、钥匙，怎么找回。和 P1 Lost and found 共用一个故事。","link":["lost-found"],"p3":["What kinds of things do people usually lose?","What kinds of people may lose things often?","What will people do when losing things?","What do people often feel after losing things?","Is it effective to offer rewards to find lost things?","What can we do to reduce the possibility of losing things?"]},{"id":"save-time","cat":"event","zh":"帮你节省时间的方法或改变","tags":["later"],"en":"Describe a way or change that helps you save a lot of time","say":["What it is","How you implement it","How difficult it is","And explain how you feel about the way/change"],"src":["sf","ri","week"],"note":"Scorefactory 9 月 12 日补充的新卡，9/26–10/2 考情周报高频第一。","tip":"骑电动车代替步行去攀岩点（原作者 P2-1 里提到过），或用日程 App 规划一天。讲清怎么做、难不难。","see":["a-p2-01"],"p3":["What can people do to save time?","Does technology help people save time? How and why?","Is it necessary for children to learn time management?","What can schools do to help students learn time management?","Do you think parents should be responsible for teaching children to save time?","Do people who can manage time well become successful more easily?"]},{"id":"helped-solve","cat":"event","zh":"帮别人解决问题","tags":["later"],"en":"Describe a time you helped someone solve a problem","say":["When it was","Who you helped","What problem you solved","And explain how you felt about this experience"],"src":["joe","ez","ieltsa"],"note":"Ieltsa 标为本季新题（a time when you helped someone with a problem）。","tip":"帮爸妈或同学解决电脑、手机问题。原作者 P3 科技问题的素材可以借。","see":["a-p3-tech"],"p3":["When do people usually ask others for help?","What kinds of skills are needed when people want to help others?","Should people solve their own problems before helping others?","Is it important for parents to teach their children to help others?","Is it enough for children to learn about helping others only from their parents?"]}],"p2Overseas":[{"zh":"让你失望的电影","en":"Describe a film that disappointed you"},{"zh":"生活离不开的东西（不能是手机或电脑）","en":"Describe something you cannot live without, other than a phone or computer"},{"zh":"家里放松的地方","en":"Describe a place at home where you relax"}],"chuanti":[{"title":"教你东西的人、学技能","cards":["taught-skill","child-skill","course","older-admire"],"story":"攀岩教练教你户外攀岩，或小学的足球教练。原作者素材：P2-1、P2-2 阳朔攀岩，P1 其他（小学校队）。"},{"title":"爱好多、很自律的人","cards":["photos","history","handmade","organized","healthy-habits"],"story":"同一个朋友：爱拍照、作息规律、东西收拾得整齐。换题时只改他“最突出的那个习惯”。"},{"title":"只见过一次的人、朋友","cards":["know-more","evening-friends","gift"],"story":"在阳朔民宿认识的志愿者朋友：一起吃米粉的晚上、想送他的礼物、想多了解他。"},{"title":"成功的人、榜样","cards":["difficult-success","sportsperson","older-admire","success-business","fitness-helped"],"story":"基普乔格破 2（原作者 P2-5），或爸爸坚持跑步。"},{"title":"名人、受欢迎的人","cards":["popular","local-famous","interview"],"story":"一位本地有名、人缘好的人，你看过他的采访。"},{"title":"去过或想去的地方","cards":["free-time-place","city-again","near-nature","natural-city"],"story":"桂林、阳朔（原作者 P2-1、P2-3）。城市自然之地可以换成家附近的公园。"},{"title":"无聊、吵、挤、不喜欢的地方","cards":["boring-place","short-trip","noisy","crowded"],"story":"去秦岭路上堵车、山脚到处是垃圾（原作者 P2-7），或每天挤地铁的通勤。"},{"title":"决定和改变","cards":["decision-happy","changed-decision","got-up-early","save-time"],"story":"实习后决定读研、换方向（原作者 P2-8）；为了攀岩开始早起（P2-2）。"},{"title":"花钱、买东西","cards":["saved-money","gift","good-service","tech-own"],"story":"攒钱买一件运动装备：怎么省钱、店员服务、买来做什么。"},{"title":"活动、聚会、吃的","cards":["party","special-food","evening-friends","waste-time"],"story":"春节家庭聚会：吃饺子、人多热闹；饭后刷手机算“浪费时间”。"},{"title":"书、电影、App","cards":["exciting-book","least-movie","app","tech-own"],"story":"一本运动员传记和它改编的电影；记录跑步的 App、想买的运动手表。"},{"title":"意外和帮忙","cards":["lost-public","helped-solve","not-interested"],"story":"在地铁丢了耳机，路人帮你找回；之后你也帮别人解决手机问题。"}]},"recent":{"updated":"2026-10-13","range":"2026 年 9 月 1 日 – 10 月 4 日","sources":{"iwp":{"short":"IELTS Writing Practice","name":"IELTS Writing Practice《IELTS Writing questions reported in September / October 2026》","date":"2026-10-05","url":"https://ieltswritingpractice.app/recent-ielts-writing-questions/2026-09/","note":"考生考后回忆，按周分组，标注了近期重复出现和往年旧题；10 月的题见同站 2026-10 页面"},"week":{"short":"考情周报","name":"国际教育联盟《雅思考情周报 9月26日–10月2日》","date":"2026-10-08","url":"https://www.jingsailian.com/liuxue/1654387.html"},"mentor":{"short":"爱雅思导师","name":"爱雅思导师《雅思机经》","date":"2026-09-18","url":"https://aiieltsmentor.com/jijing","note":"大陆场次回忆"},"langujet":{"short":"Langujet","name":"Langujet（r/IELTS 考生回忆）","date":"2026-09","url":"https://langujet.com/ielts-writing-questions/writing-task-2-newspapers-and-young-people/"}},"task2Types":{"opinion":"Agree or disagree","discussion":"Discuss both views","advantages":"Advantages & Disadvantages","posneg":"Positive or negative","problem":"Reasons / Problems & Solutions","twopart":"Two-part questions"},"task1Types":{"line":"折线图","bar":"柱状图","pie":"饼图","table":"表格","mixed":"混合图","map":"地图","process":"流程图","unknown":"图形未注明"},"task2":[{"week":"10/1–10/4","type":"twopart","parts":"原因 + 积极还是消极","src":"iwp","q":"These days more fathers stay at home and take care of their children while mothers go out to work. What could be the reasons for this? Is it a positive or negative development?","zh":"如今越来越多父亲在家照顾孩子，母亲外出工作。原因可能是什么？这是积极还是消极的发展？"},{"week":"10/1–10/4","type":"twopart","parts":"原因 + 利是否大于弊","src":"iwp","flags":["recycled"],"q":"In the past, people used to travel to see the differences from their home country. However, the scenery in places around the world seems similar nowadays. What are the causes of these similarities? Do you think that the advantages of these similarities outweigh the disadvantages?","zh":"过去人们旅行是为了看和本国不同的东西，但如今世界各地的景色越来越相似。原因是什么？你认为这种相似利大于弊吗？"},{"week":"9/28–10/4","type":"twopart","parts":"有多重要 + 积极还是消极","src":"iwp","flags":["repeat","recycled"],"q":"Ambition is a positive quality for people to have in society today. How important is it for people who want to succeed in life? Is it a positive or negative characteristic?","zh":"进取心被认为是当今社会中的一种积极品质。它对想要成功的人有多重要？它是积极还是消极的特质？"},{"week":"10/1–10/4","type":"twopart","parts":"原因 + 影响","src":"iwp","flags":["recycled"],"q":"Today, people in many countries have to spend more and more time away from their families. Why is this happening? What effects does this have on the people themselves and on their families?","zh":"如今很多国家的人不得不花越来越多的时间离开家人。为什么会这样？这对他们本人和家人有什么影响？"},{"week":"9/26–10/2","type":"discussion","src":"week","note":"考生回忆，措辞按常见题干整理","q":"Because of modern technology, it is no longer necessary for people to learn handwriting skills, but others believe that handwriting is still an important skill. Discuss both views and give your own opinion.","zh":"有人认为由于现代科技，人们不再需要学习书写技能；另一些人认为书写仍是一项重要技能。讨论双方观点并给出你的看法。"},{"week":"9/28–9/30","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some people think that language should be taught in small classes, while other people think the number of students in a language class does not matter. Discuss both views and give your opinion.","zh":"有人认为语言应该小班教学，也有人认为语言课的人数无关紧要。讨论双方观点并给出你的看法。"},{"week":"9/28–9/30","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"One long-distance flight consumes fuel which a car uses in several years' time, but they cause the same amount of pollution. So some people think that we should discourage non-essential flights, such as tourist travel, rather than limit the use of cars. To what extent do you agree or disagree?","zh":"一次长途飞行消耗的燃料相当于一辆车开好几年，造成的污染也相当。所以有人认为应该减少旅游这类非必要的飞行，而不是限制开车。你在多大程度上同意？"},{"week":"9/21–9/27","type":"opinion","src":"iwp","q":"Some people suggest that the government should spend money putting more works of art, like paintings and statues, into towns and cities to make them attractive places. To what extent do you agree or disagree?","zh":"有人建议政府花钱在城镇里放更多艺术品，比如绘画和雕塑，让城市更有吸引力。你在多大程度上同意？"},{"week":"9/21–9/27","type":"opinion","src":"iwp","q":"People who decide on a career path early in their lives and keep to it are more likely to have a satisfying working life than those who change jobs frequently. To what extent do you agree or disagree?","zh":"早早确定职业方向并坚持下去的人，比经常换工作的人更可能拥有满意的职业生活。你在多大程度上同意？"},{"week":"9/21–9/27","type":"opinion","src":"iwp","flags":["recycled"],"q":"Some people say it is more important to plant trees in the open spaces in towns and cities than to build more housing. To what extent do you agree or disagree?","zh":"有人说在城市的空地上种树比建更多住房更重要。你在多大程度上同意？"},{"week":"9/21–9/27","type":"advantages","src":"iwp","flags":["recycled"],"q":"More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks?","zh":"越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？"},{"week":"9/21–9/27","type":"opinion","src":"iwp","flags":["recycled"],"q":"Countries should try to produce all the food for the population and import as little food as possible. To what extent do you agree or disagree?","zh":"国家应该尽量自己生产全部粮食，尽可能少进口。你在多大程度上同意？"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"The shopping habits of people depend more on their age group than on any other factors. To what extent do you agree or disagree?","zh":"人们的购物习惯更多取决于年龄段，而不是其他因素。你在多大程度上同意？"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some employers are giving increased importance to employing people with good social skills in addition to good qualifications. Do you agree or disagree that social skills are as important as good qualifications for success in a job?","zh":"一些雇主除了看学历，也越来越看重社交能力。你是否同意，对工作成功来说社交能力和学历同样重要？"},{"week":"9/14–9/20","type":"opinion","src":"mentor","flags":["repeat"],"note":"9 月 16 日大陆场考生回忆","q":"Art classes, such as painting and drawing, are as important to a child's development as other subjects, so they should be compulsory in high schools. To what extent do you agree or disagree?","zh":"绘画等艺术课对孩子成长和其他科目一样重要，所以高中应该把它设为必修。你在多大程度上同意？"},{"week":"9/14–9/20","type":"problem","parts":"问题 + 解决办法","src":"iwp","flags":["recycled"],"q":"Natural resources such as oil, forests and freshwater are being consumed at an alarming rate all around the world. What problems does this cause? How can we solve these problems?","zh":"石油、森林、淡水等自然资源在全世界被以惊人的速度消耗。这会造成什么问题？怎么解决？"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["recycled"],"q":"Prison is the common way most countries try to solve the problem of crime. However, a more practical solution is to provide the public with a better education. To what extent do you agree or disagree?","zh":"大多数国家用监狱解决犯罪问题，但更实际的办法是给公众更好的教育。你在多大程度上同意？"},{"week":"9/14–9/20","type":"discussion","src":"iwp","q":"Some people argue that job satisfaction is more important than job security, while others believe that they cannot always expect job satisfaction and a permanent job is more important. Discuss both these views and give your own opinion.","zh":"有人认为工作满意度比工作稳定更重要，也有人认为不能总指望满意，一份稳定的工作更重要。讨论双方观点并给出你的看法。"},{"week":"9/14–9/20","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"People living in the 21st century have a better quality of life than people who lived in previous centuries. To what extent do you agree or disagree?","zh":"生活在 21 世纪的人比以前几个世纪的人生活质量更高。你在多大程度上同意？"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some people say that schools are no longer necessary because children can get so much information through the Internet, and they can study just as well at home. To what extent do you agree or disagree?","zh":"有人说学校已经没有必要了，因为孩子可以从网上获取大量信息，在家也能学得一样好。你在多大程度上同意？"},{"week":"9/7–9/13","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some people say that the purpose of education is to prepare individuals to be useful to society. Others say its purpose is to prepare individuals to achieve personal ambitions. Discuss both these views and give your own opinion.","zh":"有人说教育的目的是让人对社会有用，也有人说是帮助个人实现抱负。讨论双方观点并给出你的看法。"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Parents should encourage children to spend less time studying and more time doing physical activities. To what extent do you agree or disagree?","zh":"家长应该鼓励孩子少花时间学习，多做体育活动。你在多大程度上同意？"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Many people today feel that most urgent problems can only be solved by international cooperation. To what extent do you agree or disagree?","zh":"很多人认为，当今大多数紧迫问题只能通过国际合作来解决。你在多大程度上同意？"},{"week":"9/7–9/13","type":"advantages","src":"iwp","q":"In some countries, it is possible for people to have a variety of food that has been transported from all over the world. Do the advantages outweigh the disadvantages?","zh":"在一些国家，人们可以吃到从世界各地运来的各种食物。这样利大于弊吗？"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Housing is a basic necessity for everyone. Therefore, the government should provide free housing for people who cannot afford to pay for it. To what extent do you agree or disagree?","zh":"住房是每个人的基本需求，所以政府应该给买不起房的人提供免费住房。你在多大程度上同意？"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"It is a natural process for animal species to become extinct (e.g. dinosaurs, dodos). There is no reason why people should try to prevent this from happening. To what extent do you agree or disagree?","zh":"物种灭绝（比如恐龙、渡渡鸟）是自然过程，人类没有理由去阻止。你在多大程度上同意？"},{"week":"9/7–9/13","type":"opinion","src":"iwp","flags":["recycled"],"q":"Video records are a better way to learn about the way other people in the world live than written documents. To what extent do you agree or disagree?","zh":"要了解世界上其他人怎样生活，视频记录比文字资料更好。你在多大程度上同意？"},{"week":"9/7–9/13","type":"posneg","src":"iwp","flags":["repeat","recycled"],"q":"Today more people put personal and private information online (address, phone number and credit card number) to do everyday activities such as banking and shopping. Is this a positive or negative development?","zh":"如今更多人为了网上银行、购物等日常事务，在网上填写地址、电话、信用卡号等个人信息。这是积极还是消极的发展？"},{"week":"9 月","type":"posneg","src":"langujet","note":"题干讲年轻人，问的是对社会的影响，两头都要答到","q":"Newspapers have a huge influence on young people's lives. Is it a positive or negative effect on society?","zh":"报纸对年轻人的生活影响很大。这对社会是积极还是消极的影响？"},{"week":"9/1–9/6","type":"opinion","src":"iwp","flags":["repeat","recycled"],"q":"Some people believe that spending money on developing technology for space exploration is not justifiable and that there are more beneficial ways to spend this money. To what extent do you agree or disagree?","zh":"有人认为花钱发展太空探索技术不合理，这笔钱有更好的用处。你在多大程度上同意？"},{"week":"9/1–9/6","type":"twopart","parts":"原因 + 积极还是消极","src":"iwp","flags":["recycled"],"q":"Fewer and fewer people today write by hand using a pen or pencil. What are the reasons for this? Is this a positive or a negative development?","zh":"如今用笔手写的人越来越少。原因是什么？这是积极还是消极的发展？"},{"week":"9/1–9/6","type":"problem","parts":"原因 + 解决办法","src":"iwp","q":"In recent years, modern lifestyles and increasingly busy schedules have had a significant impact on people's eating habits, leading to serious health problems. What are the causes of this trend and what solutions can be implemented to address it?","zh":"近年来，现代生活方式和越来越忙的日程极大影响了人们的饮食习惯，导致严重的健康问题。原因是什么？可以采取什么解决办法？"},{"week":"9/1–9/6","type":"opinion","src":"iwp","note":"回忆不完整，缺少提问句，多半是 To what extent do you agree or disagree?","q":"Once children start school, teachers have more influence on their intellectual and social development than parents.","zh":"孩子上学以后，老师对他们智力和社交发展的影响比父母更大。"},{"week":"9/1–9/6","type":"opinion","src":"iwp","q":"The media should include more good stories which report good news. To what extent do you agree or disagree?","zh":"媒体应该多报道好消息。你在多大程度上同意？"},{"week":"9/1–9/6","type":"discussion","src":"iwp","flags":["recycled"],"q":"Some believe that it is good for a country's culture to import films and TV programmes, while others think a country should have its own films and TV programmes. Discuss both views and give your own opinion.","zh":"有人认为进口影视节目对一个国家的文化有好处，也有人认为国家应该有自己的影视节目。讨论双方观点并给出你的看法。"},{"week":"9/1–9/6","type":"advantages","src":"mentor","note":"9 月 4 日大陆场考生回忆，只记得话题，没有原题措辞","q":"（原题措辞未找到）Driverless vehicles: advantages and disadvantages.","zh":"无人驾驶交通工具的利弊。"}],"task1":[{"week":"10/1–10/4","type":"table","src":"iwp","flags":["recycled"],"q":"The table below shows the production of milk annually in four countries in 1990, 2000 and 2010."},{"week":"10/1–10/4","type":"unknown","src":"iwp","q":"The chart below gives information about car ownership in the UK from 1975 to 2005."},{"week":"10/1–10/4","type":"line","src":"iwp","note":"回忆写的是 graph，按年份变化，通常是折线图","q":"The graph shows the number of people taking part in four kinds of sports in a particular region between 1985 and 2005."},{"week":"10/1–10/4","type":"mixed","src":"iwp","note":"charts 复数，天气题常见是气温折线 + 降雨柱状","q":"The charts below give information about the weather for Glasgow, a city in Scotland."},{"week":"9/28–9/30","type":"bar","src":"iwp","flags":["repeat"],"note":"9 个国家、两个年份的对比，多为柱状图","q":"The graph below shows the percentage of people unemployed in the total labour force across 9 countries in 1994 and 2004."},{"week":"9/28–9/30","type":"unknown","src":"iwp","q":"The graph below gives information about international tourist arrivals in five countries."},{"week":"9/28–9/30","type":"line","src":"iwp","flags":["recycled"],"q":"The graph below shows the percentage of people visiting a museum at least once a year between 1980 and 2010."},{"week":"9/21–9/27","type":"line","src":"iwp","flags":["recycled"],"q":"The graph below shows the changes in food consumption by Chinese people between 1985 and 2010."},{"week":"9/21–9/27","type":"unknown","src":"iwp","flags":["recycled"],"q":"The charts show how satisfied students were with several types of facilities at a university in the UK in the year 2007."},{"week":"9/21–9/27","type":" le","recent":"table","pages":["s-t1-table"],"how":"行和列的数字，挑最高、最低和有对比的。"},{"id":"t1-mixed","task":1,"name":"混合图","en":"Mixed charts","recent":"mixed","pages":["s-t1-mixed"],"how":"两种图放在一起，一张图一段。"},{"id":"t1-map","task":1,"name":"地图","en":"Map","recent":"map","pages":["s-t1-map","a-w-map"],"how":"同一个地方两三个时间的样子，写什么变成了什么。"},{"id":"t1-process","task":1,"name":"流程图","en":"Process","recent":"process","pages":["s-t1-process","a-w-process"],"how":"带箭头的步骤图，一般现在时被动。"},{"id":"t2-opinion","task":2,"name":"同意与否","en":"Agree or disagree","recent":"opinion","pages":["a-w-agree"],"how":"To what extent do you agree or disagree?"},{"id":"t2-discussion","task":2,"name":"双边讨论","en":"Discuss both views","recent":"discussion","pages":["a-w-discuss"],"how":"Discuss both views and give your own opinion."},{"id":"t2-advantages","task":2,"name":"利弊","en":"Advantages & Disadvantages","recent":"advantages","pages":["s-t2-adv"],"how":"Do the advantages outweigh the disadvantages?"},{"id":"t2-posneg","task":2,"name":"积极还是消极","en":"Positive or negative","recent":"posneg","pages":["a-w-posneg"],"how":"Is this a positive or negative development?"},{"id":"t2-problem","task":2,"name":"原因 / 问题 + 解决","en":"Reasons & Solutions","recent":"problem","pages":["s-t2-reasons"],"how":"What are the causes? What solutions can be taken?"},{"id":"t2-twopart","task":2,"name":"双问题","en":"Two-part questions","recent":"twopart","pages":["s-t2-twopart"],"how":"两个不同的问句，一问一段。"}],"pages":[{"id":"a-p1-study","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/0.1-必考（study）.md","title":"必考 · Study","html":"\u003col>\n\u003cli>What subjects are you studying?\u003c/li>\n\u003cli>Do you like your subject?\u003c/li>\n\u003cli>Why did you choose to study that subject?\u003c/li>\n\u003cli>Do you think that your subject is popular in your country?\u003c/li>\n\u003cli>Do you have any plans for your studies in the next five years?\u003c/li>\n\u003cli>What are the benefits of being your age?\u003c/li>\n\u003cli>Do you want to change your major?\u003c/li>\n\u003cli>Do you prefer to study in the mornings or in the afternoons?\u003c/li>\n\u003cli>Are you looking forward to working?\u003c/li>\n\u003cli>What technology do you use when you study?\u003c/li>\n\u003cli>What would you like to do in the future?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. What subjects are you studying?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve just finished my undergraduate studies\u003c/td>\n\u003ctd>我刚结束本科阶段的学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Measurement, Control Technology and Instrument\u003c/td>\n\u003ctd>测控技术与仪器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronics, mechanical engineering and computer science\u003c/td>\n\u003ctd>电子、机械工程与计算机科学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. Do you like your subject?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hands-on experiments\u003c/td>\n\u003ctd>实验室里的实操实验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses are challenging\u003c/td>\n\u003ctd>专业课有难度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical engineering knowledge\u003c/td>\n\u003ctd>实用的工程知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which makes me feel rewarding\u003c/td>\n\u003ctd>让我收获满满\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. Why did you choose to study that subject?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve always been fascinated by\u003c/td>\n\u003ctd>我一直对…… 十分着迷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from an early age\u003c/td>\n\u003ctd>从小\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>employment prospects\u003c/td>\n\u003ctd>就业前景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up my mind to\u003c/td>\n\u003ctd>下定决心……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4. Do you think that your subject is popular in your country?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>subjects associated with engineering\u003c/td>\n\u003ctd>与工程有关的学科\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>becoming more and more popular these days\u003c/td>\n\u003ctd>如今变得越来越热门\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>china&#39; s technology is growing rapidly\u003c/td>\n\u003ctd>中国的科技发展迅猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a huge demand for engineers\u003c/td>\n\u003ctd>对工程师有巨大需求\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5. Do you have any plans for your studies in the next five years?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>finish my master’s degree\u003c/td>\n\u003ctd>完成硕士学业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At the same time\u003c/td>\n\u003ctd>与此同时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take some high-quality internships\u003c/td>\n\u003ctd>参与高质量实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve my practical skills\u003c/td>\n\u003ctd>提升实操能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After graduation\u003c/td>\n\u003ctd>毕业后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>work as an engineer\u003c/td>\n\u003ctd>当一名工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autonomous driving\u003c/td>\n\u003ctd>自动驾驶\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>6. What are the benefits of being your age?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>young enough and full of energy\u003c/td>\n\u003ctd>年轻且精力充沛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I have plenty of time to\u003c/td>\n\u003ctd>我有充足的时间去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try new things and learn different skills\u003c/td>\n\u003ctd>尝试新鲜事物、学习各类技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>much pressure from family\u003c/td>\n\u003ctd>家庭负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>focus on improving myself\u003c/td>\n\u003ctd>专注于提升自我\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>7. Do you want to change your major?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>employment prospects\u003c/td>\n\u003ctd>就业前景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I have no reason to change it\u003c/td>\n\u003ctd>我没有理由去改变专业\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>8. Do you prefer to study in the mornings or in the afternoons?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s hard to say which I like more\u003c/td>\n\u003ctd>很难说我更喜欢哪个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memorize some knowledge and vocabulary\u003c/td>\n\u003ctd>记忆一些知识和单词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>feel more energetic\u003c/td>\n\u003ctd>精力更充沛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>solve some difficult problems\u003c/td>\n\u003ctd>解决一些难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I usually feel tired at that time\u003c/td>\n\u003ctd>那会儿我通常已经很累了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go jogging or hit the gym\u003c/td>\n\u003ctd>慢跑或者健身\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>9. Are you looking forward to working?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>really look forward to\u003c/td>\n\u003ctd>十分期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>what real work was like\u003c/td>\n\u003ctd>真实的职场是什么样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>earlier this year\u003c/td>\n\u003ctd>今年年初\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>did an internship\u003c/td>\n\u003ctd>实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autonomous driving company\u003c/td>\n\u003ctd>自动驾驶公司\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endless work to do\u003c/td>\n\u003ctd>做不完的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a student\u003c/td>\n\u003ctd>当学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pretty nice\u003c/td>\n\u003ctd>挺好的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at least\u003c/td>\n\u003ctd>至少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have time to do my own things\u003c/td>\n\u003ctd>有时间做自己的事\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>10. What technology do you use when you study?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I basically can’t live without it.\u003c/td>\n\u003ctd>我几乎无法离开它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For those hands-on experiments\u003c/td>\n\u003ctd>做那些实操实验时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I need it to process data\u003c/td>\n\u003ctd>我需要用电脑处理数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can really help me a lot\u003c/td>\n\u003ctd>真的能帮我很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I’m developing software\u003c/td>\n\u003ctd>在我开发软件的时候\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>11. What would you like to do in the future?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>embodied robots\u003c/td>\n\u003ctd>具身智能机器人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autonomous driving\u003c/td>\n\u003ctd>自动驾驶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>use my professional knowledge to solve real-world problems\u003c/td>\n\u003ctd>用我的专业知识解决现实问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>More specifically\u003c/td>\n\u003ctd>具体来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>optimize self-driving algorithms\u003c/td>\n\u003ctd>优化自动驾驶算法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agile but safe\u003c/td>\n\u003ctd>灵活且安全\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What subjects are you studying?\u003c/h2>\n\u003cp>Well, right now \u003cmark>I’ve just finished my undergraduate studies\u003c/mark>. My major was \u003cmark>Measurement, Control Technology and Instrument\u003c/mark>. It combines \u003cmark>electronics, mechanical engineering and computer science.\u003c/mark> Starting this September, I’ll pursue my master’s degree in Beijing.\u003c/p>\n\u003cp>我刚结束本科阶段的学习，专业是测控技术与仪器。这门专业融合了电子、机械工程和计算机相关知识。今年九月，我会去北京攻读硕士学位。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you like your subject?\u003c/h2>\n\u003cp>Definitely yes. I really enjoy my studies, especially those \u003cmark>hands-on experiments in the lab\u003c/mark>. Although some \u003cmark>professional courses are challenging\u003c/mark>, I can learn lots of \u003cmark>practical engineering knowledge\u003c/mark>. It always \u003cmark>makes me feel really rewarding.\u003c/mark>\u003c/p>\n\u003cp>当然喜欢。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。\u003c/p>\n\u003ch2 id=\"h3\">3. Why did you choose to study that subject?\u003c/h2>\n\u003cp>Well, \u003cmark>I’ve always been fascinated by\u003c/mark> electronic devices \u003cmark>from an early age\u003c/mark>. Besides, the \u003cmark>employment prospects\u003c/mark> for this major are really promising in China. So I \u003cmark>made up my mind to\u003c/mark> learn it \u003cmark>when I applied for university.\u003c/mark>\u003c/p>\n\u003cp>我从小就对各类机械和电子设备十分着迷。除此之外，这个专业在国内就业前景十分可观，所以高考填报志愿时我就下定决心选择它。\u003c/p>\n\u003ch2 id=\"h4\">4. Do you think that your subject is popular in your country?\u003c/h2>\n\u003cp>Yeah, I’d say it’s \u003cmark>becoming more and more popular these days\u003c/mark>. You know, China’s technology is \u003cmark>growing rapidly\u003c/mark>, so there’s \u003cmark>a huge demand for\u003c/mark> \u003cmark>engineers\u003c/mark>.\u003c/p>\n\u003cp>我认为现在这个专业越来越热门。国内高新产业、制造业发展迅速，市场急需工程类人才，\u003c/p>\n\u003ch2 id=\"h5\">5. Do you have any plans for your studies in the next five years?\u003c/h2>\n\u003cp>Well, first I’ll \u003cmark>finish my master’s degree\u003c/mark> in the next three years. \u003cmark>At the same time\u003c/mark>, I want to \u003cmark>take some high-quality internships\u003c/mark> to \u003cmark>improve my practical skills\u003c/mark>. \u003cmark>After graduation\u003c/mark>, I plan to work as an engineer in the \u003cmark>autonomous driving\u003c/mark> or robotics.\u003c/p>\n\u003cp>首先，未来三年我会完成硕士学业。与此同时，我打算参与几段高质量实习，以此提升自己的实操能力。毕业后，我计划从事自动驾驶或机器人相关的工程师工作。\u003c/p>\n\u003ch2 id=\"h6\">6. What are the benefits of being your age?\u003c/h2>\n\u003cp>I think the biggest advantage is that I’m \u003cmark>young enough and full of energy\u003c/mark>. \u003cmark>I have plenty of time to\u003c/mark> \u003cmark>try new things and learn different skills.\u003c/mark> Also, I don’t have \u003cmark>much pressure from family\u003c/mark>, so I can fully \u003cmark>focus on improving myself.\u003c/mark>\u003c/p>\n\u003cp>我觉得处在现在这个年纪最大的好处就是年轻、精力充沛。我有充足时间尝试新鲜事物、学习各类技能，而且没有太多家庭负担，可以全身心提升自己。\u003c/p>\n\u003ch2 id=\"h7\">7. Do you want to change your major?\u003c/h2>\n\u003cp>No, not at all. I’m really interested in engineering, Besides, the \u003cmark>employment prospects\u003c/mark> for this major are really promising in China. so I have no plans to change it.\u003c/p>\n\u003cp>完全不想换专业。我本身对工科很感兴趣，就业前景很好，所以没有换专业的想法。\u003c/p>\n\u003ch2 id=\"h8\">8. Do you prefer to study in the mornings or in the afternoons?\u003c/h2>\n\u003cp>Well, \u003cmark>it’s hard to say which I like more\u003c/mark>. I usually just memorize some \u003cmark>key knowledge and vocabulary\u003c/mark> in the morning. In the afternoon, I \u003cmark>feel more energetic and stay focused\u003c/mark>, so I always \u003cmark>deal with difficult preoblems\u003c/mark>. But I never study at night. \u003cmark>I usually feel tired by then\u003c/mark>, so I always \u003cmark>go jogging or hit the gym.\u003c/mark>\u003c/p>\n\u003cp>很难说我更喜欢哪个时段。早上我一般只背诵一些重点知识和单词。下午我精力更充沛、注意力更集中，处理难题的效率更高。但我晚上绝对不学习，那会儿我通常已经很累了，就会去运动。\u003c/p>\n\u003ch2 id=\"h9\">9. Are you looking forward to working?\u003c/h2>\n\u003cp>Yeah, I used to \u003cmark>really look forward to\u003c/mark> working. Last year, I wanted to see \u003cmark>what real work was like\u003c/mark>,\u003cbr>But \u003cmark>earlier this year\u003c/mark>, I \u003cmark>did an internship\u003c/mark> at an \u003cmark>autonomous driving company\u003c/mark>. I was really tired. I worked from 10 a.m. to 10 p.m. with \u003cmark>endless work to do\u003c/mark>. Since then, I’ve felt \u003cmark>being a student\u003c/mark> is \u003cmark>pretty nice\u003c/mark>, because \u003cmark>at least\u003c/mark> I \u003cmark>have time to do my own things.\u003c/mark>\u003c/p>\n\u003cp>是啊，我以前特别期待工作。去年我还想看看真实的职场是什么样，把自己学到的工程知识用到实际工作里。\u003cbr>但今年年初，我在一家自动驾驶公司实习。工作特别累，从早上 10 点忙到晚上 10 点，有做不完的事。从那之后我就觉得当学生挺好的，起码还有时间做自己的事。\u003c/p>\n\u003ch2 id=\"h10\">10. What technology do you use when you study?\u003c/h2>\n\u003cp>Well, I use my laptop almost every day. \u003cmark>I basically can’t live without it.\u003c/mark> \u003cmark>For those hands-on experiments\u003c/mark>, I need it to process data.\u003cbr>Apart from this, I also watch some videos to study on Bilibili and YouTube.\u003cbr>And AI tools like Claude Code and Codex \u003cmark>can really help me a lot\u003c/mark> \u003cmark>when I’m developing software.\u003c/mark>\u003c/p>\n\u003cp>我几乎每天都会使用笔记本电脑。做那些实操实验时，我需要用它来处理所有的实验数据。除此之外，我还会在哔哩哔哩和 YouTube 上看视频学习。另外，像 Claude Code 和 Codex 这类人工智能工具，在我开发软件的时候能给我很大帮助。\u003c/p>\n\u003ch2 id=\"h11\">11. What would you like to do in the future?\u003c/h2>\n\u003cp>Well, I’d like to work as an engineer in \u003cmark>embodied AI robots\u003c/mark> and \u003cmark>autonomous driving\u003c/mark>. I hope I can \u003cmark>use my professional knowledge to solve real-world problems\u003c/mark>. \u003cmark>In particular\u003c/mark>, I want to \u003cmark>optimize self-driving algorithms\u003c/mark> to make them \u003cmark>agile but safe.\u003c/mark>\u003c/p>\n\u003cp>我希望未来能投身具身智能机器人和自动驾驶领域，用自己的专业知识解决现实问题。具体来说，我想优化自动驾驶算法，让它既灵活又安全。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>答案第一句话\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>are you a student or do you work？\u003c/td>\n\u003ctd>Well, right now \u003cmark>I’ve just finished my undergraduate studies\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What subjects are you studying?\u003c/td>\n\u003ctd>My major was \u003cmark>Measurement, Control Technology and Instrument\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Do you like your subject?\u003c/td>\n\u003ctd>Definitely yes. I really enjoy my studies,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Why did you choose to study that subject?\u003c/td>\n\u003ctd>Well, I’ve always been fascinated by electronic devices from an early age.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Do you think that your subject is popular in your country?\u003c/td>\n\u003ctd>Yeah, I’d say it’s becoming more and more popular these days.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Do you have any plans for your studies in the next five years?\u003c/td>\n\u003ctd>Well, first I’ll finish my master’s degree in the next three years.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What are the benefits of being your age?\u003c/td>\n\u003ctd>I think the biggest advantage is that I’m young enough and full of energy.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Do you want to change your major?\u003c/td>\n\u003ctd>No, not at all.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Do you prefer to study in the mornings or in the afternoons?\u003c/td>\n\u003ctd>Well, it’s hard to say which I like more.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Are you looking forward to working?\u003c/td>\n\u003ctd>Yeah, I used to really look forward to working.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What technology do you use when you study?\u003c/td>\n\u003ctd>Well, I use my laptop almost every day.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What would you like to do in the future?\u003c/td>\n\u003ctd>Well, I’d like to work as an engineer in an autonomous driving company\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>i should spend my most creative years in mathmatics, and if it didn&#39;t work out, then i would reevaluate my choice after five years\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>///\u003cstrong>9. How much time do you spend on your studies each week?\u003c/strong>\u003c/th>\n\u003cth>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>when exams are coming up\u003c/td>\n\u003ctd>考试临近时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there’s a project deadline\u003c/td>\n\u003ctd>有项目截止日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep studying all day from morning to night\u003c/td>\n\u003ctd>从早到晚不停地学习\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>///\u003cstrong>12. What changes would you like to see in your school?\u003c/strong>\u003c/th>\n\u003cth>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>I’d like to see\u003c/td>\n\u003ctd>我希望看到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>student apartments\u003c/td>\n\u003ctd>学生公寓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can be upgraded\u003c/td>\n\u003ctd>能够被升级改造\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>many facilities there are pretty old\u003c/td>\n\u003ctd>那里很多设施都相当老旧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there were more internship programs\u003c/td>\n\u003ctd>有更多的实习项目\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gain more practical work experience\u003c/td>\n\u003ctd>积累更多实际工作经验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>before graduation\u003c/td>\n\u003ctd>毕业前\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>///\u003cstrong>13. Do you sometimes feel that you have to study too hard?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sometimes I do feel that way\u003c/td>\n\u003ctd>我有时候确实会有这种感觉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I get really stressed\u003c/td>\n\u003ctd>我感到压力很大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It lets me soak in some fresh air\u003c/td>\n\u003ctd>这能让我呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>helps me recharge my batteries\u003c/td>\n\u003ctd>帮我恢复精力、给自己充电\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>///\u003cstrong>14. What do you like to do just after you finish class every day?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go jogging or hit the gym\u003c/td>\n\u003ctd>慢跑或者健身\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for about an hour\u003c/td>\n\u003ctd>大约一小时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s a good way to relax after studying\u003c/td>\n\u003ctd>这是学习后放松的好方式\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>///\u003cstrong>15. When you started your course, did you find it hard?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I first got into university\u003c/td>\n\u003ctd>我刚上大学的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses\u003c/td>\n\u003ctd>专业课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hands-on experiments\u003c/td>\n\u003ctd>实操实验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I gradually got used to it\u003c/td>\n\u003ctd>我慢慢适应了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u
