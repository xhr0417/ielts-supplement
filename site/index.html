d?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>concentrate on study\u003c/td>\n\u003ctd>集中注意力学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tidying up my entire desk\u003c/td>\n\u003ctd>清理完我整张桌面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>messy stuff around\u003c/td>\n\u003ctd>周围的杂乱的物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>distract me\u003c/td>\n\u003ctd>使我分心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>form a daily habit of…\u003c/td>\n\u003ctd>养成…… 的日常习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>before bed\u003c/td>\n\u003ctd>睡前\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>both at home and at school\u003c/td>\n\u003ctd>不管在家还是在校\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me feel calm and organised\u003c/td>\n\u003ctd>让我内心平静、做事有条理\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not at all\u003c/td>\n\u003ctd>完全不是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>it was totally the opposite\u003c/mark>\u003c/td>\n\u003ctd>完全相反\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>When I was a kid\u003c/td>\n\u003ctd>我小时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make a huge mess\u003c/td>\n\u003ctd>弄得一团糟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>around the house\u003c/td>\n\u003ctd>在家里各处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>told me off\u003c/td>\n\u003ctd>骂我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tidy my desk and bed by myself\u003c/td>\n\u003ctd>独自收拾桌子和床\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>step by step\u003c/td>\n\u003ctd>渐渐地，一步步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>build up a good habit of…\u003c/td>\n\u003ctd>养成…… 的好习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep my space neat\u003c/td>\n\u003ctd>保持自己的空间整洁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>really thankful to\u003c/td>\n\u003ctd>十分感激某人\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>1.  Do you like to keep things tidy?\u003c/strong>\u003cbr>Definitely yes. I can only concentrate on study after tidying up my entire desk. Messy stuff around will easily distract me.\u003cbr>Besides, I’ve formed a daily habit of tidying my room twice a day, once in the morning and once before bed, both at home and at school. It makes me feel calm and organised.\u003c/p>\n\u003cp>当然喜欢。我学习的时候必须先把整张书桌收拾干净，才能集中注意力。杂乱的东西很容易让我分心。\u003cbr>除此之外，不管在家还是在校，我都养成了每天打扫两次房间的习惯，早上一次、睡前一次。整洁的环境能让我内心平静、做事有条理。\u003c/p>\n\u003col start=\"2\">\n\u003cli>\u003cp>\u003cstrong>Did you use to keep your room tidy as a child?\u003c/strong>\u003c/p>\n\u003cp> Not at all, it was totally the opposite. When I was a kid, I always made a huge mess around the house, so my mum often told me off. Later, she asked me to tidy my desk and bed by myself. Step by step, I built up a good habit of keeping my space neat, and I’m really thankful to her.\u003c/p>\n\u003cp> 完全不是，情况恰恰相反。我小时候总把家里弄得乱糟糟，所以妈妈经常批评我。后来，她让我自己收拾书桌和床铺。久而久之，我养成了保持居住环境整洁的好习惯，我十分感激她。\u003c/p>\n\u003c/li>\n\u003c/ol>\n","toc":[],"text":"Do you like to keep things tidy? Did you use to keep your room tidy as a child? 英文短语 中文释义 concentrate on study 集中注意力学习 tidying up my entire desk 清理完我整张桌面 messy stuff around 周围的杂乱的物品 distract me 使我分心 form a daily habit of… 养成…… 的日常习惯 before bed 睡前 both at home and at school 不管在家还是在校 make me feel calm and organised 让我内心平静、做事有条理 not at all 完全不是 it was totally the opposite 完全相反 When I was a kid 我小时候 make a huge mess 弄得一团糟 around the house 在家里各处 told me off 骂我 tidy my desk and bed by myself 独自收拾桌子和床 step by step 渐渐地，一步步 build up a good habit of… 养成…… 的好习惯 keep my space neat 保持自己的空间整洁 really thankful to 十分感激某人 1. Do you like to keep things tidy? Definitely yes. I can only concentrate on study after tidying up my entire desk. Messy stuff around will easily distract me. Besides, I’ve formed a daily habit of tidying my room twice a day, once in the morning and once before bed, both at home and at school. It makes me feel calm and organised. 当然喜欢。我学习的时候必须先把整张书桌收拾干净，才能集中注意力。杂乱的东西很容易让我分心。 除此之外，不管在家还是在校，我都养成了每天打扫两次房间的习惯，早上一次、睡前一次。整洁的环境能让我内心平静、做事有条理。 Did you use to keep your room tidy as a child? Not at all, it was totally the opposite. When I was a kid, I always made a huge mess around the house, so my mum often told me off. Later, she asked me to tidy my desk and bed by myself. Step by step, I built up a good habit of keeping my space neat, and I’m really thankful to her. 完全不是，情况恰恰相反。我小时候总把家里弄得乱糟糟，所以妈妈经常批评我。后来，她让我自己收拾书桌和床铺。久而久之，我养成了保持居住环境整洁的好习惯，我十分感激她。"},{"id":"a-p1-music","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/8-music.md","title":"Music","html":"\u003cul>\n\u003cli>Do you prefer sad or happy music?\u003c/li>\n\u003cli>Does happy music make you feel more excited?\u003c/li>\n\u003cli>Have you taken any music classes?\u003c/li>\n\u003cli>Do you listen to music while doing other things?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>To be honest\u003c/td>\n\u003ctd>说实话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hardly ever\u003c/td>\n\u003ctd>几乎从不，很少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in my daily life\u003c/td>\n\u003ctd>在日常生活中，平日里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go running\u003c/td>\n\u003ctd>去跑步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>energetic and powerful songs\u003c/td>\n\u003ctd>激昂、充满力量的歌曲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer me up\u003c/td>\n\u003ctd>使我振作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep going\u003c/td>\n\u003ctd>坚持下去，不放弃\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>feel tired\u003c/td>\n\u003ctd>感到疲惫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give up halfway\u003c/td>\n\u003ctd>半途而废\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take any music lessons\u003c/td>\n\u003ctd>上音乐课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not ... at all\u003c/td>\n\u003ctd>完全不、一点都没有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>know nothing about sth\u003c/td>\n\u003ctd>对…… 一窍不通\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whenever I sing\u003c/td>\n\u003ctd>每当我唱歌的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sound really bad\u003c/td>\n\u003ctd>听起来很难听\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>Do you prefer sad or happy music?\u003c/strong>\u003c/p>\n\u003cp> To be honest,I hardly ever listen to music in my daily life. But when I go running, I really enjoy energetic and powerful songs. This kind of music can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. \u003c/p>\n\u003cp> 说实话，我平日里几乎不怎么听音乐。但跑步的时候，我格外喜欢激昂、充满力量感的歌曲。这种音乐能鼓舞我、让我坚持下去，特别是当我感到疲惫、想要半途而废的时候。\u003c/p>\n\u003c/li>\n\u003cli>\u003cul>\n\u003cli>Have you taken any music classes?\u003c/li>\n\u003c/ul>\n\u003cp> No, I haven’t taken any music lessons at all. actually, I know nothing about music, Whenever I sing, I sound really bad.\u003c/p>\n\u003cp> 没有，我一节音乐课都没上过。事实上，我对音乐一窍不通，每次唱歌，我的嗓音都很难听。\u003c/p>\n\u003c/li>\n\u003c/ol>\n","toc":[],"text":"Do you prefer sad or happy music? Does happy music make you feel more excited? Have you taken any music classes? Do you listen to music while doing other things? 英文短语 中文释义 To be honest 说实话 hardly ever 几乎从不，很少 in my daily life 在日常生活中，平日里 go running 去跑步 energetic and powerful songs 激昂、充满力量的歌曲 cheer me up 使我振作 keep going 坚持下去，不放弃 feel tired 感到疲惫 give up halfway 半途而废 take any music lessons 上音乐课 not ... at all 完全不、一点都没有 know nothing about sth 对…… 一窍不通 whenever I sing 每当我唱歌的时候 sound really bad 听起来很难听 Do you prefer sad or happy music? To be honest,I hardly ever listen to music in my daily life. But when I go running, I really enjoy energetic and powerful songs. This kind of music can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 说实话，我平日里几乎不怎么听音乐。但跑步的时候，我格外喜欢激昂、充满力量感的歌曲。这种音乐能鼓舞我、让我坚持下去，特别是当我感到疲惫、想要半途而废的时候。 Have you taken any music classes? No, I haven’t taken any music lessons at all. actually, I know nothing about music, Whenever I sing, I sound really bad. 没有，我一节音乐课都没上过。事实上，我对音乐一窍不通，每次唱歌，我的嗓音都很难听。"},{"id":"a-p1-teacher","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/9-teacher.md","title":"Teacher","html":"\u003cul>\n\u003cli>Do you have a favorite teacher?\u003c/li>\n\u003cli>In what way has your favourite teacher helped you?\u003c/li>\n\u003cli>Are you still in touch with your primary school teachers?\u003c/li>\n\u003cli>Do you have a teacher from your past that you still remember?\u003c/li>\n\u003cli>Do you want to be a teacher in the future?\u003c/li>\n\u003cli>Do you like your primary school teachers more than your high school teachers?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>humorous and witty\u003c/td>\n\u003ctd>幽默风趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used smart ways to do\u003c/td>\n\u003ctd>用巧妙的方式做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>explain difficult knowledge clearly\u003c/td>\n\u003ctd>把难懂的知识讲清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look forward to his lessons\u003c/td>\n\u003ctd>期待他的课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave a deep impression on me\u003c/td>\n\u003ctd>给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>become interested in physics\u003c/td>\n\u003ctd>对物理产生兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve my grades a lot\u003c/td>\n\u003ctd>大幅提升我的成绩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>failed exams or felt stressed\u003c/td>\n\u003ctd>考试失利或者感到压力很大\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lose touch with sb\u003c/td>\n\u003ctd>和某人失去联系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We don’t have each other’s contact information\u003c/td>\n\u003ctd>我们没有对方的联系方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>as they were really kind to me\u003c/td>\n\u003ctd>因为他们对我十分友善\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the one I remember the most.\u003c/td>\n\u003ctd>我记忆最深刻的那个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>humorous and witty\u003c/td>\n\u003ctd>幽默风趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make boring lessons fun\u003c/td>\n\u003ctd>把枯燥的课堂变得有意思\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave a deep impression on sb\u003c/td>\n\u003ctd>给某人留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recall some details of his classes now\u003c/td>\n\u003ctd>我现在仍然能回忆起他课堂的一些的细节\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a challenging job\u003c/td>\n\u003ctd>一份有挑战的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>require a lot of patience and energy\u003c/td>\n\u003ctd>需要大量的耐心和精力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>engineering work\u003c/td>\n\u003ctd>工程工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which is closer to my major and career plan\u003c/td>\n\u003ctd>与我的专业、职业规划更贴合\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s hard to say which I like more\u003c/td>\n\u003ctd>很难说我更喜欢哪个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>took good care of us in daily life\u003c/td>\n\u003ctd>把我们照顾得很好在日常生活中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>useful learning skills\u003c/td>\n\u003ctd>有用的学习方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>prepare for university\u003c/td>\n\u003ctd>为大学做准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I respect both of them\u003c/td>\n\u003ctd>我都很尊敬他们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for different reasons.\u003c/td>\n\u003ctd>处于不同的原因\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1.Do you have a favorite teacher?\u003c/h3>\n\u003cp>Absolutely. My favourite teacher was my high school physics teacher. He was really humorous and witty. He always used smart ways to explain the most difficult knowledge clearly. So I actually looked forward to his lessons, and he really left a deep impression on me.\u003c/p>\n\u003cp>当然。我最喜欢的老师是我高中物理老师。他十分风趣幽默，总能用巧妙的方式把最难的知识点讲明白。所以我那时候特别期待上他的课，他给我留下了非常深刻的印象。\u003c/p>\n\u003ch3 id=\"h2\">2. In what way has your favourite teacher helped you?\u003c/h3>\n\u003cp>Well, he helped me in many ways. Most importantly, he used smart ways to explain difficult knowledge clearly, which made me become interested in physics and improved my grades a lot. Besides, he always encouraged me when I failed exams or felt stressed, I&#39;m really thankful to him.\u003c/p>\n\u003cp>嗯，他在很多方面都帮到了我。最重要的是，他能用巧妙的方式把难懂的知识讲明白，这让我对物理产生了兴趣，成绩也提升了很多。除此之外，当我考试失利或者感到压力大的时候，他总会鼓励我，我很感谢他\u003c/p>\n\u003ch3 id=\"h3\">3. Are you still in touch with your primary school teachers?\u003c/h3>\n\u003cp>Actually, not really. I’ve lost touch with most of my primary school teachers since I graduated. because We don’t have each other’s contact information\u003cbr>. But I still remember some of them clearly, as they were really kind to me.\u003c/p>\n\u003cp>其实没有了。小学毕业之后，我就和大部分小学老师失去了联系。我们现在没有彼此的联系方式，\u003cbr>但我依然清楚地记得其中一些老师，他们当时对我特别好。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h4\">4. Do you have a teacher from your past that you still remember?\u003c/h3>\n\u003cp>Yes, definitely. My high school physics teacher is the one I remember the most. He was humorous and witty, and he always made boring lessons fun. He left such a deep impression on me that I can still recall some details of his classes now.\u003c/p>\n\u003cp>当然有。我印象最深的就是我的高中物理老师。他幽默风趣，总能把枯燥的课堂变得有意思。他给我留下了特别深刻的印象，到现在我都还能想起他课堂上的一些细节。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h5\">5. Do you want to be a teacher in the future?\u003c/h3>\n\u003cp>To be honest, I don’t really want to be a teacher. I think teaching is a challenging job that requires a lot of patience and energy. I’m more interested in engineering work, which is also closer to my university major and my career plan.\u003c/p>\n\u003cp>说实话，我不太想当老师。我觉得教师是一份很有挑战的工作，需要投入大量的耐心和精力。我对工程类工作更感兴趣，这也和我的大学专业以及职业规划更贴合。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h6\">6. Do you like your primary school teachers more than your high school teachers?\u003c/h3>\n\u003cp>Hmm, it’s hard to say which I like more. My primary school teachers were very warm and took good care of us in daily life. But my high school teachers taught me more useful learning skills and helped me prepare for university. I respect both of them for different reasons.\u003c/p>\n\u003cp>嗯，很难说我更喜欢哪一类。小学老师很亲切，在生活上把我们照顾得很好。但高中老师教给了我更多实用的学习方法，也帮我为大学做好了准备。出于不同的原因，这两类老师我都很尊敬。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1.Do you have a favorite teacher?"},{"level":3,"id":"h2","text":"2. In what way has your favourite teacher helped you?"},{"level":3,"id":"h3","text":"3. Are you still in touch with your primary school teachers?"},{"level":3,"id":"h4","text":"4. Do you have a teacher from your past that you still remember?"},{"level":3,"id":"h5","text":"5. Do you want to be a teacher in the future?"},{"level":3,"id":"h6","text":"6. Do you like your primary school teachers more than your high school teachers?"}],"text":"Do you have a favorite teacher? In what way has your favourite teacher helped you? Are you still in touch with your primary school teachers? Do you have a teacher from your past that you still remember? Do you want to be a teacher in the future? Do you like your primary school teachers more than your high school teachers? 英文短语 中文释义 humorous and witty 幽默风趣 used smart ways to do 用巧妙的方式做某事 explain difficult knowledge clearly 把难懂的知识讲清楚 look forward to his lessons 期待他的课 leave a deep impression on me 给我留下深刻印象 become interested in physics 对物理产生兴趣 improve my grades a lot 大幅提升我的成绩 failed exams or felt stressed 考试失利或者感到压力很大 lose touch with sb 和某人失去联系 We don’t have each other’s contact information 我们没有对方的联系方式 as they were really kind to me 因为他们对我十分友善 the one I remember the most. 我记忆最深刻的那个 humorous and witty 幽默风趣 make boring lessons fun 把枯燥的课堂变得有意思 leave a deep impression on sb 给某人留下深刻印象 recall some details of his classes now 我现在仍然能回忆起他课堂的一些的细节 a challenging job 一份有挑战的工作 require a lot of patience and energy 需要大量的耐心和精力 engineering work 工程工作 which is closer to my major and career plan 与我的专业、职业规划更贴合 it’s hard to say which I like more 很难说我更喜欢哪个 took good care of us in daily life 把我们照顾得很好在日常生活中 useful learning skills 有用的学习方法 prepare for university 为大学做准备 I respect both of them 我都很尊敬他们 for different reasons. 处于不同的原因 1.Do you have a favorite teacher? Absolutely. My favourite teacher was my high school physics teacher. He was really humorous and witty. He always used smart ways to explain the most difficult knowledge clearly. So I actually looked forward to his lessons, and he really left a deep impression on me. 当然。我最喜欢的老师是我高中物理老师。他十分风趣幽默，总能用巧妙的方式把最难的知识点讲明白。所以我那时候特别期待上他的课，他给我留下了非常深刻的印象。 2. In what way has your favourite teacher helped you? Well, he helped me in many ways. Most importantly, he used smart ways to explain difficult knowledge clearly, which made me become interested in physics and improved my grades a lot. Besides, he always encouraged me when I failed exams or felt stressed, I'm really thankful to him. 嗯，他在很多方面都帮到了我。最重要的是，他能用巧妙的方式把难懂的知识讲明白，这让我对物理产生了兴趣，成绩也提升了很多。除此之外，当我考试失利或者感到压力大的时候，他总会鼓励我，我很感谢他 3. Are you still in touch with your primary school teachers? Actually, not really. I’ve lost touch with most of my primary school teachers since I graduated. because We don’t have each other’s contact information . But I still remember some of them clearly, as they were really kind to me. 其实没有了。小学毕业之后，我就和大部分小学老师失去了联系。我们现在没有彼此的联系方式， 但我依然清楚地记得其中一些老师，他们当时对我特别好。 4. Do you have a teacher from your past that you still remember? Yes, definitely. My high school physics teacher is the one I remember the most. He was humorous and witty, and he always made boring lessons fun. He left such a deep impression on me that I can still recall some details of his classes now. 当然有。我印象最深的就是我的高中物理老师。他幽默风趣，总能把枯燥的课堂变得有意思。他给我留下了特别深刻的印象，到现在我都还能想起他课堂上的一些细节。 5. Do you want to be a teacher in the future? To be honest, I don’t really want to be a teacher. I think teaching is a challenging job that requires a lot of patience and energy. I’m more interested in engineering work, which is also closer to my university major and my career plan. 说实话，我不太想当老师。我觉得教师是一份很有挑战的工作，需要投入大量的耐心和精力。我对工程类工作更感兴趣，这也和我的大学专业以及职业规划更贴合。 6. Do you like your primary school teachers more than your high school teachers? Hmm, it’s hard to say which I like more. My primary school teachers were very warm and took good care of us in daily life. But my high school teachers taught me more useful learning skills and helped me prepare for university. I respect both of them for different reasons. 嗯，很难说我更喜欢哪一类。小学老师很亲切，在生活上把我们照顾得很好。但高中老师教给了我更多实用的学习方法，也帮我为大学做好了准备。出于不同的原因，这两类老师我都很尊敬。"},{"id":"a-p1-social","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/10-Social Media.md","title":"Social Media","html":"\u003cul>\n\u003cli>When did you start using social media?\u003c/li>\n\u003cli>Do you think you spend too much time on social media?\u003c/li>\n\u003cli>Do your friends use social media?\u003c/li>\n\u003cli>What do people often do on social media?\u003c/li>\n\u003cli>Have you ever posted anything on social media?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>pretty early\u003c/td>\n\u003ctd>很早\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I was super curious\u003c/td>\n\u003ctd>我很好奇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep up with them\u003c/td>\n\u003ctd>跟上他们的节奏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>signed up\u003c/td>\n\u003ctd>注册\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the moment I got my first smartphone\u003c/td>\n\u003ctd>在我拿到第一部智能手机的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>become a staple in my daily routine\u003c/td>\n\u003ctd>成了我日常生活里必不可少的一部分\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scroll through short videos\u003c/td>\n\u003ctd>刷短视频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>distract me from study\u003c/td>\n\u003ctd>分散我的学习注意力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can’t help doing sth\u003c/td>\n\u003ctd>忍不住做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>set time limits\u003c/td>\n\u003ctd>设置时长限制\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep in touch\u003c/td>\n\u003ctd>保持联系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>group chats\u003c/td>\n\u003ctd>群聊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily life\u003c/td>\n\u003ctd>日常生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>like and comment on posts\u003c/td>\n\u003ctd>给动态点赞评论\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>chat with friends and family\u003c/td>\n\u003ctd>和亲友聊天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for fun\u003c/td>\n\u003ctd>当作消遣、为了好玩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily moments\u003c/td>\n\u003ctd>日常动态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>online learning\u003c/td>\n\u003ctd>线上学习\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not very frequently\u003c/td>\n\u003ctd>不太频繁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>generally speaking\u003c/td>\n\u003ctd>总的来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>prefer to do sth rather than do sth\u003c/td>\n\u003ctd>比起做某事更愿意做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>browse other people’s posts\u003c/td>\n\u003ctd>浏览别人的动态\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. When did you start using social media?\u003c/h3>\n\u003cp>Honestly, I started using social media pretty early, around primary school, when my friends were talking about WeChat and QQ. I was super curious and wanted to keep up with them, so I signed up the moment I got my first smartphone. Since then, social media has become a staple in my daily routine.\u003c/p>\n\u003cp>说实话，我接触社交媒体挺早的，大概在上小学那会儿，当时身边所有人都在聊微信和 QQ。我特别好奇，也想跟上朋友们的节奏，所以我拿到第一部智能手机就注册了账号。从那以后，社交媒体就成了我日常生活里必不可少的一部分。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you think you spend too much time on social media?\u003c/h3>\n\u003cp>Well, sort of. I usually spend about one to two hours a day scrolling through short videos and checking messages. Sometimes it distracts me from my study when I can’t help picking up my phone. But I’m trying to set time limits to control it these days.\u003c/p>\n\u003cp>嗯，有点吧。我每天大概花一到两个小时刷短视频、查看消息。有时候忍不住拿起手机，就会耽误学习。不过最近我在试着设置时长限制来管控一下。\u003c/p>\n\u003ch3 id=\"h3\">3. Do your friends use social media?\u003c/h3>\n\u003cp>Yes, almost all of my friends use social media every day. We mainly use WeChat to keep in touch and share funny things in group chats. They also post their daily life or trip photos on Moments, and we often like and comment on each other’s posts.\u003c/p>\n\u003cp>是的，几乎我所有朋友每天都用社交媒体。我们主要用微信保持联系，在群聊里分享有意思的事。他们也会在朋友圈发日常生活或者旅行的照片，我们经常互相点赞评论。\u003c/p>\n\u003ch3 id=\"h4\">4. What do people often do on social media?\u003c/h3>\n\u003cp>Well, people do different things. Most use it to chat with friends and family. Many also scroll through short videos or read news for fun. Besides, some people share their daily moments, and others even use it for work or online learning.\u003c/p>\n\u003cp>嗯，人们做的事各不相同。大多数人用它和亲友聊天，很多人也会刷短视频或者看新闻消遣。除此之外，有些人会分享日常动态，还有人甚至用它办公或者线上学习。\u003c/p>\n\u003ch3 id=\"h5\">5. Have you ever posted anything on social media?\u003c/h3>\n\u003cp>Yes, I have, but not very frequently. I sometimes share photos of my trips, delicious food or small daily moments on WeChat Moments. Generally speaking, I prefer to browse other people’s posts rather than post a lot myself.\u003c/p>\n\u003cp>发过，但不是很频繁。我偶尔会在朋友圈分享旅行、美食的照片，或是生活里的小日常。总的来说，比起发很多动态，我更喜欢浏览别人的内容。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. When did you start using social media?"},{"level":3,"id":"h2","text":"2. Do you think you spend too much time on social media?"},{"level":3,"id":"h3","text":"3. Do your friends use social media?"},{"level":3,"id":"h4","text":"4. What do people often do on social media?"},{"level":3,"id":"h5","text":"5. Have you ever posted anything on social media?"}],"text":"When did you start using social media? Do you think you spend too much time on social media? Do your friends use social media? What do people often do on social media? Have you ever posted anything on social media? 英文短语 中文释义 pretty early 很早 I was super curious 我很好奇 keep up with them 跟上他们的节奏 signed up 注册 the moment I got my first smartphone 在我拿到第一部智能手机的时候 become a staple in my daily routine 成了我日常生活里必不可少的一部分 scroll through short videos 刷短视频 distract me from study 分散我的学习注意力 can’t help doing sth 忍不住做某事 set time limits 设置时长限制 keep in touch 保持联系 group chats 群聊 daily life 日常生活 like and comment on posts 给动态点赞评论 chat with friends and family 和亲友聊天 for fun 当作消遣、为了好玩 daily moments 日常动态 online learning 线上学习 not very frequently 不太频繁 generally speaking 总的来说 prefer to do sth rather than do sth 比起做某事更愿意做某事 browse other people’s posts 浏览别人的动态 1. When did you start using social media? Honestly, I started using social media pretty early, around primary school, when my friends were talking about WeChat and QQ. I was super curious and wanted to keep up with them, so I signed up the moment I got my first smartphone. Since then, social media has become a staple in my daily routine. 说实话，我接触社交媒体挺早的，大概在上小学那会儿，当时身边所有人都在聊微信和 QQ。我特别好奇，也想跟上朋友们的节奏，所以我拿到第一部智能手机就注册了账号。从那以后，社交媒体就成了我日常生活里必不可少的一部分。 2. Do you think you spend too much time on social media? Well, sort of. I usually spend about one to two hours a day scrolling through short videos and checking messages. Sometimes it distracts me from my study when I can’t help picking up my phone. But I’m trying to set time limits to control it these days. 嗯，有点吧。我每天大概花一到两个小时刷短视频、查看消息。有时候忍不住拿起手机，就会耽误学习。不过最近我在试着设置时长限制来管控一下。 3. Do your friends use social media? Yes, almost all of my friends use social media every day. We mainly use WeChat to keep in touch and share funny things in group chats. They also post their daily life or trip photos on Moments, and we often like and comment on each other’s posts. 是的，几乎我所有朋友每天都用社交媒体。我们主要用微信保持联系，在群聊里分享有意思的事。他们也会在朋友圈发日常生活或者旅行的照片，我们经常互相点赞评论。 4. What do people often do on social media? Well, people do different things. Most use it to chat with friends and family. Many also scroll through short videos or read news for fun. Besides, some people share their daily moments, and others even use it for work or online learning. 嗯，人们做的事各不相同。大多数人用它和亲友聊天，很多人也会刷短视频或者看新闻消遣。除此之外，有些人会分享日常动态，还有人甚至用它办公或者线上学习。 5. Have you ever posted anything on social media? Yes, I have, but not very frequently. I sometimes share photos of my trips, delicious food or small daily moments on WeChat Moments. Generally speaking, I prefer to browse other people’s posts rather than post a lot myself. 发过，但不是很频繁。我偶尔会在朋友圈分享旅行、美食的照片，或是生活里的小日常。总的来说，比起发很多动态，我更喜欢浏览别人的内容。"},{"id":"a-p1-clothing","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/11-Clothing.md","title":"Clothing","html":"\u003cul>\n\u003cli>\u003cp>What kind of clothes do you like to wear?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you prefer to wear comfortable and casual clothes or smart clothes?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you like wearing T-shirts?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you spend a lot of time choosing clothes?\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>keep it simple and stay comfortable\u003c/td>\n\u003ctd>保持简约舒适风格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>throw on\u003c/td>\n\u003ctd>随手穿上、随便套上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>loose T-shirt\u003c/td>\n\u003ctd>宽松 T 恤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>overthink my outfit\u003c/td>\n\u003ctd>纠结我的穿搭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>But if there’s a special occasion\u003c/td>\n\u003ctd>但如果在特殊场合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ll try to step up my game\u003c/td>\n\u003ctd>我将会精心打扮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look more professional\u003c/td>\n\u003ctd>看起来更专业\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>comfortable and casual clothes\u003c/td>\n\u003ctd>舒适休闲的衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend most of my time at school\u003c/td>\n\u003ctd>我大部分时间都在学校\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outdoor activities\u003c/td>\n\u003ctd>户外活动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me feel relaxed and free to move around\u003c/td>\n\u003ctd>让我更轻松、活动更自在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>smart clothes\u003c/td>\n\u003ctd>正式服装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for important occasions like interviews\u003c/td>\n\u003ctd>为了重要场合，例如面试\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>super practical\u003c/td>\n\u003ctd>非常实用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>easy to match with other clothes\u003c/td>\n\u003ctd>容易搭配其他衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plain T-shirts\u003c/td>\n\u003ctd>基础款 T 恤、素色 T 恤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pair them with jeans and sports shorts\u003c/td>\n\u003ctd>把他们和牛仔裤、运动短裤搭配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>They are also perfect for\u003c/td>\n\u003ctd>他们在.....下也很棒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hot summer day\u003c/td>\n\u003ctd>夏天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I wear them almost every day\u003c/td>\n\u003ctd>我几乎每天都穿它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when the weather is warm\u003c/td>\n\u003ctd>天气热的时候\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I almost never spend much time doing sth\u003c/td>\n\u003ctd>我几乎不会花太多时间做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>simple basic items\u003c/td>\n\u003ctd>简单的基础款单品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go well with each other\u003c/td>\n\u003ctd>互相适配、百搭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>grab whatever is nearby\u003c/td>\n\u003ctd>顺手拿身边的衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It usually takes me less than five minutes to do\u003c/td>\n\u003ctd>做某事通常花不了我五分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get dressed\u003c/td>\n\u003ctd>穿好衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>don‘t care too much about\u003c/td>\n\u003ctd>不会在意太多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look fancy\u003c/td>\n\u003ctd>看起来精致讲究\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What kind of clothes do you like to wear?\u003c/h2>\n\u003cp>Honestly, I prefer keeping it simple and staying comfortable. Most days, I just throw on a pair of jeans and a loose T-shirt, because I don’t want to overthink my outfit in the morning. But if there’s an important occasion, I’ll try to step up my game to look more professional\u003c/p>\n\u003cp>说实话，我偏爱简约舒适的穿搭。平日里我随便套一条牛仔裤和宽松短袖就出门，我不想早上花太多心思纠结穿搭。但如果遇上特殊场合，我会精心打扮一下，让我看起来更专业。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you prefer to wear comfortable and casual clothes or smart clothes?\u003c/h3>\n\u003cp>Well, I definitely prefer comfortable and casual clothes in daily life. I spend most of my time at school or doing outdoor activities, so casual clothes make me feel relaxed and free to move around. I only wear smart clothes for important occasions like interviews .\u003c/p>\n\u003cp>嗯，日常生活里我肯定更喜欢舒适休闲的衣服。我大部分时间都在学校或者做户外活动，休闲装让我觉得放松，活动起来也自在。我只有在面试这类重要场合，才会穿正式的衣服。\u003c/p>\n\u003ch3 id=\"h3\">3. Do you like wearing T-shirts?\u003c/h3>\n\u003cp>Yes, I really like them. \u003cmark>T-shirts are super practical and easy to match with other clothes\u003c/mark>. I have quite a few plain T-shirts in different colours, and I can pair them with jeans and sports shorts . \u003cmark>They are also perfect for hot summer days, so I wear them almost every day when the weather is warm.\u003c/mark>\u003c/p>\n\u003cp>是的，我特别喜欢穿 T 恤。T 恤特别实用，和其他衣服也很好搭。我有不少不同颜色的基础款 T 恤，配牛仔裤、运动短裤都可以。夏天热的时候穿 T 恤也很舒服，所以天气暖和的时候我几乎天天都穿。\u003c/p>\n\u003ch3 id=\"h4\">4. Do you spend a lot of time choosing clothes?\u003c/h3>\n\u003cp>No, not really. I almost never spend much time picking out outfits in the morning. Most of my clothes are simple basic items that go well with each other, so I can just grab whatever is nearby\u003cmark>. It usually takes me less than five minutes to get dressed, because I don’t care too much about looking fancy.\u003c/mark>\u003c/p>\n\u003cp>不，完全不会。我早上几乎从不花时间挑衣服。我大部分衣服都是简单的基础款，互相都能搭配，所以我随手拿上身边的衣服就行。通常穿衣服花不了我五分钟，因为我不太在意穿得多精致。\u003c/p>\n\u003chr>\n","toc":[{"level":2,"id":"h1","text":"1. What kind of clothes do you like to wear?"},{"level":3,"id":"h2","text":"2. Do you prefer to wear comfortable and casual clothes or smart clothes?"},{"level":3,"id":"h3","text":"3. Do you like wearing T-shirts?"},{"level":3,"id":"h4","text":"4. Do you spend a lot of time choosing clothes?"}],"text":"What kind of clothes do you like to wear? Do you prefer to wear comfortable and casual clothes or smart clothes? Do you like wearing T-shirts? Do you spend a lot of time choosing clothes? 英文短语 中文释义 keep it simple and stay comfortable 保持简约舒适风格 throw on 随手穿上、随便套上 loose T-shirt 宽松 T 恤 overthink my outfit 纠结我的穿搭 But if there’s a special occasion 但如果在特殊场合 I’ll try to step up my game 我将会精心打扮 look more professional 看起来更专业 comfortable and casual clothes 舒适休闲的衣服 spend most of my time at school 我大部分时间都在学校 outdoor activities 户外活动 make me feel relaxed and free to move around 让我更轻松、活动更自在 smart clothes 正式服装 for important occasions like interviews 为了重要场合，例如面试 super practical 非常实用 easy to match with other clothes 容易搭配其他衣服 plain T-shirts 基础款 T 恤、素色 T 恤 pair them with jeans and sports shorts 把他们和牛仔裤、运动短裤搭配 They are also perfect for 他们在.....下也很棒 hot summer day 夏天 I wear them almost every day 我几乎每天都穿它 when the weather is warm 天气热的时候 I almost never spend much time doing sth 我几乎不会花太多时间做某事 simple basic items 简单的基础款单品 go well with each other 互相适配、百搭 grab whatever is nearby 顺手拿身边的衣服 It usually takes me less than five minutes to do 做某事通常花不了我五分钟 get dressed 穿好衣服 don‘t care too much about 不会在意太多 look fancy 看起来精致讲究 1. What kind of clothes do you like to wear? Honestly, I prefer keeping it simple and staying comfortable. Most days, I just throw on a pair of jeans and a loose T-shirt, because I don’t want to overthink my outfit in the morning. But if there’s an important occasion, I’ll try to step up my game to look more professional 说实话，我偏爱简约舒适的穿搭。平日里我随便套一条牛仔裤和宽松短袖就出门，我不想早上花太多心思纠结穿搭。但如果遇上特殊场合，我会精心打扮一下，让我看起来更专业。 2. Do you prefer to wear comfortable and casual clothes or smart clothes? Well, I definitely prefer comfortable and casual clothes in daily life. I spend most of my time at school or doing outdoor activities, so casual clothes make me feel relaxed and free to move around. I only wear smart clothes for important occasions like interviews . 嗯，日常生活里我肯定更喜欢舒适休闲的衣服。我大部分时间都在学校或者做户外活动，休闲装让我觉得放松，活动起来也自在。我只有在面试这类重要场合，才会穿正式的衣服。 3. Do you like wearing T-shirts? Yes, I really like them. T-shirts are super practical and easy to match with other clothes. I have quite a few plain T-shirts in different colours, and I can pair them with jeans and sports shorts . They are also perfect for hot summer days, so I wear them almost every day when the weather is warm. 是的，我特别喜欢穿 T 恤。T 恤特别实用，和其他衣服也很好搭。我有不少不同颜色的基础款 T 恤，配牛仔裤、运动短裤都可以。夏天热的时候穿 T 恤也很舒服，所以天气暖和的时候我几乎天天都穿。 4. Do you spend a lot of time choosing clothes? No, not really. I almost never spend much time picking out outfits in the morning. Most of my clothes are simple basic items that go well with each other, so I can just grab whatever is nearby. It usually takes me less than five minutes to get dressed, because I don’t care too much about looking fancy. 不，完全不会。我早上几乎从不花时间挑衣服。我大部分衣服都是简单的基础款，互相都能搭配，所以我随手拿上身边的衣服就行。通常穿衣服花不了我五分钟，因为我不太在意穿得多精致。"},{"id":"a-p1-space","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/12-Outer space and stars.md","title":"Outer space and stars","html":"\u003cul>\n\u003cli>Have you ever learnt about outer space and stars?\u003c/li>\n\u003cli>Do you like science fiction movies? Why?\u003c/li>\n\u003cli>Do you want to know more about outer space?\u003c/li>\n\u003cli>Do you want to go into outer space in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>when I was in my primary school\u003c/td>\n\u003ctd>当我在小学时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>they were not going to be on the examination\u003c/td>\n\u003ctd>他们将不会在考试中出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>only study for the exam\u003c/td>\n\u003ctd>只是为了考试而学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I don&#39;t need to take exams anymore\u003c/td>\n\u003ctd>我不用再考试了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have a strong interest in\u003c/td>\n\u003ctd>对… 产生兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>time travel\u003c/td>\n\u003ctd>时间旅行\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>they show amazing things that do not exist in real life\u003c/td>\n\u003ctd>影片展示现实生活中不存在的奇妙事物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>time travel\u003c/td>\n\u003ctd>时空穿梭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>alien planets\u003c/td>\n\u003ctd>外星行星\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me more curious about space travel\u003c/td>\n\u003ctd>勾起了我对太空旅行的好奇心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s also a good way to relax after studying\u003c/td>\n\u003ctd>也是很好的放松方式在学习之后\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>full of mysteries\u003c/td>\n\u003ctd>充满神秘感\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>satisfy my curiosity.\u003c/td>\n\u003ctd>满足我的好奇心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>find out more about\u003c/td>\n\u003ctd>更多地探索\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It has always been my life goal\u003c/td>\n\u003ctd>一直是我的人生目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>seeing the earth from space\u003c/td>\n\u003ctd>从太空看地球\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>would be really fantastic\u003c/mark>\u003c/td>\n\u003ctd>一定是无比震撼的体验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like people do in science movies.\u003c/td>\n\u003ctd>就像人在电影里做的那样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Maybe I will give it a try\u003c/td>\n\u003ctd>或许我将会去试一试。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when it becomes cheaper in the future.\u003c/td>\n\u003ctd>或许等到未来价格降低\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Have you ever learnt about outer space and stars?\u003c/h2>\n\u003cp>yeah,I did, I learned some \u003cmark>when I was in my primary school.\u003c/mark> But unfortunately, I have forgotten most of them.  because \u003cmark>they were not going to be on the examination\u003c/mark> you know most of Chinese students \u003cmark>only study for the exam.\u003c/mark> But now, I don&#39;t need to take exams anymore, I start to \u003cmark>have a strong interest in\u003c/mark> planets and outer space because recently I&#39;ve watched a movie about time traveling which makes me want to learn more about astronomy \u003c/p>\n\u003cp>是的，我学过。我小学的时候接触过一些相关知识。但可惜的是，大部分内容我都记不清了。因为这些知识点不会出现在考试里，你也清楚，大多数中国学生学习只是为了应付考试。不过现在我不用再参加考试了，我对行星和外太空产生了浓厚的兴趣。前段时间我看了一部有关时空穿越的电影，这让我想要深入了解更多天文学知识。\u003c/p>\n\u003ch1>2. Do you like science fiction movies? Why?\u003c/h1>\n\u003cp>Yes, I&#39;m really interested in science fiction movies, because \u003cmark>they show amazing things that do not exist in real life\u003c/mark>, like time travel and alien planets. And they \u003cmark>make me more curious about\u003c/mark> space travel.  Also, it’s a good way to relax after studying,\u003c/p>\n\u003cp>我非常喜欢科幻电影。看科幻片特别有意思，影片里会出现现实生活中不存在的奇妙事物，比如时空穿梭、外星行星。它们还勾起了我对太空旅行的好奇心。除此之外，看完书之后看科幻电影也是很好的放松方式，\u003c/p>\n\u003ch1>3. Do you want to know more about outer space?\u003c/h1>\n\u003cp>Definitely. I think outer space is \u003cmark>full of mysteries\u003c/mark>, and learning about it is really interesting.  I always watch some videos about planets online to \u003cmark>satisfy my curiosity.\u003c/mark> I’d love to \u003cmark>find out more about\u003c/mark> the universe later on.\u003c/p>\n\u003cp>当然想。我觉得外太空充满未解之谜，了解相关知识十分有趣。最近我偶尔会在网上看行星相关短视频，满足自己的好奇心。我以后也想更多地探索宇宙的奥秘。\u003c/p>\n\u003ch1>4. Do you want to go into outer space in the future?\u003c/h1>\n\u003cp>It has always been my life goal. Seeing the Earth from space \u003cmark>would be really fantastic\u003c/mark>. I even want to visit Mars \u003cmark>just like people do in science movies.\u003c/mark>\u003cbr>But space travel is far too expensive for ordinary people right now. Maybe I will give it a try when it becomes cheaper in the future.\u003c/p>\n\u003cp>这一直是我的人生目标。从太空俯瞰地球一定是无比震撼的体验，我甚至想像电影里那样去火星看看。但目前太空旅行对普通人来说实在太贵了。或许等到未来价格降低，我会去试一试。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Have you ever learnt about outer space and stars?"}],"text":"Have you ever learnt about outer space and stars? Do you like science fiction movies? Why? Do you want to know more about outer space? Do you want to go into outer space in the future? 英文短语 中文释义 when I was in my primary school 当我在小学时候 they were not going to be on the examination 他们将不会在考试中出现 only study for the exam 只是为了考试而学习 I don't need to take exams anymore 我不用再考试了 have a strong interest in 对… 产生兴趣 time travel 时间旅行 they show amazing things that do not exist in real life 影片展示现实生活中不存在的奇妙事物 time travel 时空穿梭 alien planets 外星行星 make me more curious about space travel 勾起了我对太空旅行的好奇心 it’s also a good way to relax after studying 也是很好的放松方式在学习之后 full of mysteries 充满神秘感 satisfy my curiosity. 满足我的好奇心 find out more about 更多地探索 It has always been my life goal 一直是我的人生目标 seeing the earth from space 从太空看地球 would be really fantastic 一定是无比震撼的体验 just like people do in science movies. 就像人在电影里做的那样 Maybe I will give it a try 或许我将会去试一试。 when it becomes cheaper in the future. 或许等到未来价格降低 1. Have you ever learnt about outer space and stars? yeah,I did, I learned some when I was in my primary school. But unfortunately, I have forgotten most of them. because they were not going to be on the examination you know most of Chinese students only study for the exam. But now, I don't need to take exams anymore, I start to have a strong interest in planets and outer space because recently I've watched a movie about time traveling which makes me want to learn more about astronomy 是的，我学过。我小学的时候接触过一些相关知识。但可惜的是，大部分内容我都记不清了。因为这些知识点不会出现在考试里，你也清楚，大多数中国学生学习只是为了应付考试。不过现在我不用再参加考试了，我对行星和外太空产生了浓厚的兴趣。前段时间我看了一部有关时空穿越的电影，这让我想要深入了解更多天文学知识。 2. Do you like science fiction movies? Why? Yes, I'm really interested in science fiction movies, because they show amazing things that do not exist in real life, like time travel and alien planets. And they make me more curious about space travel. Also, it’s a good way to relax after studying, 我非常喜欢科幻电影。看科幻片特别有意思，影片里会出现现实生活中不存在的奇妙事物，比如时空穿梭、外星行星。它们还勾起了我对太空旅行的好奇心。除此之外，看完书之后看科幻电影也是很好的放松方式， 3. Do you want to know more about outer space? Definitely. I think outer space is full of mysteries, and learning about it is really interesting. I always watch some videos about planets online to satisfy my curiosity. I’d love to find out more about the universe later on. 当然想。我觉得外太空充满未解之谜，了解相关知识十分有趣。最近我偶尔会在网上看行星相关短视频，满足自己的好奇心。我以后也想更多地探索宇宙的奥秘。 4. Do you want to go into outer space in the future? It has always been my life goal. Seeing the Earth from space would be really fantastic. I even want to visit Mars just like people do in science movies. But space travel is far too expensive for ordinary people right now. Maybe I will give it a try when it becomes cheaper in the future. 这一直是我的人生目标。从太空俯瞰地球一定是无比震撼的体验，我甚至想像电影里那样去火星看看。但目前太空旅行对普通人来说实在太贵了。或许等到未来价格降低，我会去试一试。"},{"id":"a-p1-singing","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/13-singing.md","title":"Singing","html":"\u003cul>\n\u003cli>Do you like singing? Why?\u003c/li>\n\u003cli>Have you ever learnt how to sing?\u003c/li>\n\u003cli>Who do you want to sing for?\u003c/li>\n\u003cli>Do you think singing can bring happiness to people?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>I’m really bad at it\u003c/td>\n\u003ctd>我唱得特别差\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go out of tune\u003c/td>\n\u003ctd>跑调\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nobody taught me at home\u003c/td>\n\u003ctd>家里也没人教过我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve never tried to get better at it.\u003c/td>\n\u003ctd>也从来没想过做的更好\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve never really thought about it.\u003c/td>\n\u003ctd>我没有仔细想过这个问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just for fun at parties\u003c/td>\n\u003ctd>只是为了在聚会上图个乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’d feel too nervous and embarrassed\u003c/td>\n\u003ctd>我会特别紧张、难为情。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is an easy way for people to feel happy\u003c/td>\n\u003ctd>是一个获得快乐的简单方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>let out stress\u003c/td>\n\u003ctd>释放压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>forget about daily worries\u003c/td>\n\u003ctd>忘掉日常的烦心事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get along better.\u003c/td>\n\u003ctd>增进彼此感情\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>1. Do you like singing? Why?\u003c/h4>\n\u003cp>Not really. To be honest, I don’t like singing very much. I’m really bad at it and I often go out of tune. actually, I know nothing about music, Whenever I sing, I sound really bad.\u003c/p>\n\u003cp>算不上喜欢。说实话，我并不怎么爱唱歌。我唱得特别差，还总跑调。其实我对音乐一窍不通，每次开口唱都难听极了。\u003c/p>\n\u003chr>\n\u003ch4>2. Have you ever learnt how to sing?\u003c/h4>\n\u003cp>No, I’ve never learned to sing properly. I never took any singing lessons, and nobody taught me at home. I just sing casually with friends, and I’ve never tried to get better at it.\u003c/p>\n\u003cp>没有，我从来没正经学过唱歌。我没上过任何歌唱课，家里也没人教过我。我只在和朋友相处时随便唱唱，也从来没想过要提升唱功。\u003c/p>\n\u003chr>\n\u003ch4>3. Who do you want to sing for?\u003c/h4>\n\u003cp>Hmm, \u003cmark>I’ve never really thought about it\u003c/mark>. I guess I’d sing for my close friends and family, \u003cmark>just for fun at parties.\u003c/mark> I would never sing in front of a lot of people, because \u003cmark>I’d feel too nervous and embarrassed.\u003c/mark>\u003c/p>\n\u003cp>嗯，我还真没仔细想过这个问题。我觉得我会唱给好朋友和家人听，就是在聚会上图个乐。我绝不会在很多人面前唱歌，因为我会特别紧张、难为情。\u003c/p>\n\u003chr>\n\u003ch4>4. Do you think singing can bring happiness to people?\u003c/h4>\n\u003cp>Yes, I definitely think so. Singing \u003cmark>is an easy way for people to feel happy\u003c/mark>. It can help them \u003cmark>let out stress\u003c/mark> and \u003cmark>forget about daily worries\u003c/mark>. What’s more, singing with friends is a great way to \u003cmark>have fun\u003c/mark> and \u003cmark>get along better.\u003c/mark>\u003c/p>\n\u003cp>当然了，我完全这么觉得。唱歌是人们获得快乐的简单方式。它能帮人们释放压力，忘掉日常的烦心事。而且和朋友一起唱歌既能玩得开心，还能增进彼此的感情。\u003c/p>\n","toc":[],"text":"Do you like singing? Why? Have you ever learnt how to sing? Who do you want to sing for? Do you think singing can bring happiness to people? 英文短语 中文释义 I’m really bad at it 我唱得特别差 go out of tune 跑调 nobody taught me at home 家里也没人教过我 I’ve never tried to get better at it. 也从来没想过做的更好 I’ve never really thought about it. 我没有仔细想过这个问题 just for fun at parties 只是为了在聚会上图个乐 I’d feel too nervous and embarrassed 我会特别紧张、难为情。 is an easy way for people to feel happy 是一个获得快乐的简单方式 let out stress 释放压力 forget about daily worries 忘掉日常的烦心事 get along better. 增进彼此感情 1. Do you like singing? Why? Not really. To be honest, I don’t like singing very much. I’m really bad at it and I often go out of tune. actually, I know nothing about music, Whenever I sing, I sound really bad. 算不上喜欢。说实话，我并不怎么爱唱歌。我唱得特别差，还总跑调。其实我对音乐一窍不通，每次开口唱都难听极了。 2. Have you ever learnt how to sing? No, I’ve never learned to sing properly. I never took any singing lessons, and nobody taught me at home. I just sing casually with friends, and I’ve never tried to get better at it. 没有，我从来没正经学过唱歌。我没上过任何歌唱课，家里也没人教过我。我只在和朋友相处时随便唱唱，也从来没想过要提升唱功。 3. Who do you want to sing for? Hmm, I’ve never really thought about it. I guess I’d sing for my close friends and family, just for fun at parties. I would never sing in front of a lot of people, because I’d feel too nervous and embarrassed. 嗯，我还真没仔细想过这个问题。我觉得我会唱给好朋友和家人听，就是在聚会上图个乐。我绝不会在很多人面前唱歌，因为我会特别紧张、难为情。 4. Do you think singing can bring happiness to people? Yes, I definitely think so. Singing is an easy way for people to feel happy. It can help them let out stress and forget about daily worries. What’s more, singing with friends is a great way to have fun and get along better. 当然了，我完全这么觉得。唱歌是人们获得快乐的简单方式。它能帮人们释放压力，忘掉日常的烦心事。而且和朋友一起唱歌既能玩得开心，还能增进彼此的感情。"},{"id":"a-p1-sports","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/14-Sports programs.md","title":"Sports programs","html":"\u003cul>\n\u003cli>Do you prefer to watch sports games alone or with a group of friends?\u003c/li>\n\u003cli>Have you ever watched a sports game in a stadium?\u003c/li>\n\u003cli>Do you like watching sports programs on TV?\u003c/li>\n\u003cli>Do you like to watch live sports games?\u003c/li>\n\u003cli>Who do you like to watch sports games with?\u003c/li>\n\u003cli>What kinds of games do you expect to watch in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It’s much more fun to\u003c/td>\n\u003ctd>有意思多了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer for teams together\u003c/td>\n\u003ctd>大家一起为球队加油\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is way better than\u003c/td>\n\u003ctd>比 .... 好太多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>watching alone at home.\u003c/td>\n\u003ctd>一个人在家看\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chinese Super League match\u003c/td>\n\u003ctd>中超联赛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>during my high school summer vacation\u003c/td>\n\u003ctd>初中暑假\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live atmosphere\u003c/td>\n\u003ctd>现场气氛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>totally different from\u003c/td>\n\u003ctd>与 ... 完全不同\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Formula 1 racing\u003c/td>\n\u003ctd>F1赛车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>These events really appeal to me\u003c/mark>\u003c/td>\n\u003ctd>这些比赛真的很吸引我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it&#39;s also a good way to relax after studying.\u003c/td>\n\u003ctd>也是学习后放松的好方式\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>full of suspense\u003c/td>\n\u003ctd>充满悬念\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>since you never know the result in advance\u003c/td>\n\u003ctd>因为你提前不知道结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>It’s way more thrilling\u003c/mark>\u003c/td>\n\u003ctd>比 ... 刺激多了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>watching replays later.\u003c/td>\n\u003ctd>之后看重播\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a big football fan\u003c/td>\n\u003ctd>铁杆足球迷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>talk about matches and players\u003c/td>\n\u003ctd>聊比赛和球员\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve got into rock climbing recently\u003c/td>\n\u003ctd>我最近开始喜欢上攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pick up new skills\u003c/td>\n\u003ctd>学到新技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional competitions\u003c/td>\n\u003ctd>专业赛事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>1. Do you prefer to watch sports games alone or with a group of friends?\u003c/h4>\n\u003cp>I definitely prefer watching with my friends. It’s \u003cmark>much more fun to\u003c/mark> \u003cmark>cheer for teams together\u003c/mark>. The atmosphere \u003cmark>is way better than\u003c/mark> watching alone at home.\u003c/p>\n\u003cp>我肯定更喜欢和朋友一起看。大家一起为球队加油有意思多了，氛围比一个人在家看好太多。\u003c/p>\n\u003chr>\n\u003ch4>2. Have you ever watched a sports game in a stadium?\u003c/h4>\n\u003cp>Yes, I went to a \u003cmark>Chinese Super League match\u003c/mark> in Shanghai with my dad during my \u003cmark>high school summer vacation\u003c/mark>. The \u003cmark>live atmosphere\u003c/mark> was fantastic , \u003cmark>totally different from\u003c/mark> watching on TV.\u003c/p>\n\u003cp>看过。初中暑假我和爸爸去上海看了一场中超比赛。现场氛围特别激动人心，和看电视的感觉完全不一样。\u003c/p>\n\u003chr>\n\u003ch4>3. Do you like watching sports programs on TV?\u003c/h4>\n\u003cp>Yes, I really enjoy them. I often watch \u003cmark>Formula 1 racing\u003c/mark>, the \u003cmark>Tour de France\u003c/mark> and the \u003cmark>FIFA World Cup\u003c/mark> in my free time. \u003cmark>These events really appeal to me\u003c/mark> and it&#39;s also a good way to relax after studying.\u003c/p>\n\u003cp>是的，我很喜欢。我空闲时经常看 F1、环法自行车赛和世界杯。这些比赛真的很吸引我，也是学习后放松的好方式。\u003c/p>\n\u003chr>\n\u003ch4>4. Do you like to watch live sports games?\u003c/h4>\n\u003cp>Yes, I love live games, especially the FIFA World Cup. Live matches are \u003cmark>full of suspense\u003c/mark> since \u003cmark>you never know the result in advance\u003c/mark>. \u003cmark>It’s way more thrilling\u003c/mark> than \u003cmark>watching replays later.\u003c/mark>\u003c/p>\n\u003cp>喜欢，我特别爱看直播，尤其是世界杯。直播充满悬念，因为你提前不知道结果，比之后看重播刺激多了。\u003c/p>\n\u003chr>\n\u003ch4>5. Who do you like to watch sports games with?\u003c/h4>\n\u003cp>I like watching with my dad most, because he’s also \u003cmark>a big football fan\u003c/mark>. He supports AC Milan, a famous italian football club. and I like Real Madrid from spanish. We always \u003cmark>talk about matches and players\u003c/mark> together.\u003c/p>\n\u003cp>我最喜欢和爸爸一起看，因为他也是铁杆球迷。他支持 AC 米兰，我喜欢皇家马德里。我们总在一起聊比赛和球员。\u003c/p>\n\u003chr>\n\u003ch4>6. What kinds of games do you expect to watch in the future?\u003c/h4>\n\u003cp>I really want to watch \u003cmark>professional rock climbing competitions\u003c/mark>. I’ve \u003cmark>got into\u003c/mark> climbing recently, and I think watching \u003cmark>professional competitions\u003c/mark> can help me \u003cmark>pick up\u003c/mark> new skills.\u003c/p>\n\u003cp>我很想以后看专业的攀岩比赛。我最近迷上了攀岩，我觉得看专业选手比赛能帮我学到新技巧。\u003c/p>\n","toc":[],"text":"Do you prefer to watch sports games alone or with a group of friends? Have you ever watched a sports game in a stadium? Do you like watching sports programs on TV? Do you like to watch live sports games? Who do you like to watch sports games with? What kinds of games do you expect to watch in the future? 英文短语 中文释义 It’s much more fun to 有意思多了 cheer for teams together 大家一起为球队加油 is way better than 比 .... 好太多 watching alone at home. 一个人在家看 Chinese Super League match 中超联赛 during my high school summer vacation 初中暑假 live atmosphere 现场气氛 totally different from 与 ... 完全不同 Formula 1 racing F1赛车 These events really appeal to me 这些比赛真的很吸引我 it's also a good way to relax after studying. 也是学习后放松的好方式 full of suspense 充满悬念 since you never know the result in advance 因为你提前不知道结果 It’s way more thrilling 比 ... 刺激多了。 watching replays later. 之后看重播 a big football fan 铁杆足球迷 talk about matches and players 聊比赛和球员 I’ve got into rock climbing recently 我最近开始喜欢上攀岩 pick up new skills 学到新技能 professional competitions 专业赛事 1. Do you prefer to watch sports games alone or with a group of friends? I definitely prefer watching with my friends. It’s much more fun to cheer for teams together. The atmosphere is way better than watching alone at home. 我肯定更喜欢和朋友一起看。大家一起为球队加油有意思多了，氛围比一个人在家看好太多。 2. Have you ever watched a sports game in a stadium? Yes, I went to a Chinese Super League match in Shanghai with my dad during my high school summer vacation. The live atmosphere was fantastic , totally different from watching on TV. 看过。初中暑假我和爸爸去上海看了一场中超比赛。现场氛围特别激动人心，和看电视的感觉完全不一样。 3. Do you like watching sports programs on TV? Yes, I really enjoy them. I often watch Formula 1 racing, the Tour de France and the FIFA World Cup in my free time. These events really appeal to me and it's also a good way to relax after studying. 是的，我很喜欢。我空闲时经常看 F1、环法自行车赛和世界杯。这些比赛真的很吸引我，也是学习后放松的好方式。 4. Do you like to watch live sports games? Yes, I love live games, especially the FIFA World Cup. Live matches are full of suspense since you never know the result in advance. It’s way more thrilling than watching replays later. 喜欢，我特别爱看直播，尤其是世界杯。直播充满悬念，因为你提前不知道结果，比之后看重播刺激多了。 5. Who do you like to watch sports games with? I like watching with my dad most, because he’s also a big football fan. He supports AC Milan, a famous italian football club. and I like Real Madrid from spanish. We always talk about matches and players together. 我最喜欢和爸爸一起看，因为他也是铁杆球迷。他支持 AC 米兰，我喜欢皇家马德里。我们总在一起聊比赛和球员。 6. What kinds of games do you expect to watch in the future? I really want to watch professional rock climbing competitions. I’ve got into climbing recently, and I think watching professional competitions can help me pick up new skills. 我很想以后看专业的攀岩比赛。我最近迷上了攀岩，我觉得看专业选手比赛能帮我学到新技巧。"},{"id":"a-p1-science","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/15-Science.md","title":"Science","html":"\u003cul>\n\u003cli>Do you like science?\u003c/li>\n\u003cli>When did you start to learn about science?\u003c/li>\n\u003cli>Which science subject is interesting to you?\u003c/li>\n\u003cli>What kinds of interesting things have you done with science?\u003c/li>\n\u003cli>Do you like watching science TV programs?\u003c/li>\n\u003cli>Do Chinese people often visit science museums?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>I’ve always been fascinated by\u003c/mark>\u003c/td>\n\u003ctd>我一直对…… 深深着迷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from an early age\u003c/td>\n\u003ctd>从小\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>a quote from\u003c/mark>\u003c/td>\n\u003ctd>名言\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scientists study the world as it is\u003c/td>\n\u003ctd>科学家研究现存的世界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>engineers create the world that has never been\u003c/td>\n\u003ctd>工程师创造从未有过的世界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>This idea really inspires me.\u003c/mark>\u003cbr>\u003c/td>\n\u003ctd>这个观点一直激励着我\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>natural phenomena\u003c/td>\n\u003ctd>自然现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me more curious about\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>how the world works.\u003c/td>\n\u003ctd>世界运行规律\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>appeals to me the most\u003c/td>\n\u003ctd>最吸引我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fundamental rules behind motion\u003c/td>\n\u003ctd>运动背后的基础原理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which connects closely with engineering.\u003c/td>\n\u003ctd>和工程领域紧密相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>()\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mechanical structures\u003c/td>\n\u003ctd>机械结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>how different devices operate\u003c/td>\n\u003ctd>各类设备的运作方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the physical principles supporting their functions.\u003c/td>\n\u003ctd>支撑它们运转的物理原理。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m really interested in science documentaries\u003c/td>\n\u003ctd>我很喜欢科学纪录片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used smart ways to do\u003c/td>\n\u003ctd>用巧妙的方式做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>explain difficult knowledge clearly\u003c/td>\n\u003ctd>把难懂的知识讲清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constantly satisfy my curiosity about\u003c/td>\n\u003ctd>不断满足我对于 ...... 的好奇\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>families with kids\u003c/td>\n\u003ctd>带小孩的家庭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>school trips\u003c/td>\n\u003ctd>学校研学、校外参观\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used to love visiting them\u003c/td>\n\u003ctd>过去很喜欢参观他们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m not really interested anymore.\u003c/td>\n\u003ctd>现在已经没什么兴趣了。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you like science?\u003c/h2>\n\u003cp>Yes, \u003cmark>I’ve always been fascinated by\u003c/mark> science and engineering \u003cmark>from an early age\u003c/mark>. I still remember \u003cmark>a quote from\u003c/mark> Doctor von Kármán: \u003cmark>Scientists study the world as it is\u003c/mark>; \u003cmark>engineers create the world that has never been\u003c/mark>. \u003cmark>This idea really inspires me.\u003c/mark>\u003c/p>\n\u003cp>喜欢，我从小就对科学与工程很感兴趣。我记得冯・卡门有一句话：科学家研究现存的世界，工程师创造从未有过的世界。这个观点一直激励着我。\u003c/p>\n\u003ch2 id=\"h2\">2. When did you start to learn about science?\u003c/h2>\n\u003cp>I first \u003cmark>got to know\u003c/mark> basic scientific knowledge in primary school science classes. Those \u003cmark>hands-on experiments\u003c/mark> and \u003cmark>natural phenomena\u003c/mark> made me more curious about how the world works.\u003c/p>\n\u003cp>我小学科学课第一次接触基础科学知识。那些简单实验与自然现象，激发了我对世界运行规律的好奇心。\u003c/p>\n\u003ch2 id=\"h3\">3. Which science subject is interesting to you?\u003c/h2>\n\u003cp>It&#39;s no doubt that Physics \u003cmark>appeals to me the most\u003c/mark>, especially mechanics. It explains the \u003cmark>fundamental rules\u003c/mark> behind motion, which \u003cmark>connects closely\u003c/mark> with engineering.\u003c/p>\n\u003cp>物理最吸引我，尤其是力学。它阐释运动背后的基础原理，和工程领域紧密相关。\u003c/p>\n\u003ch2 id=\"h4\">4. What kinds of interesting things have you done with science?\u003c/h2>\n\u003cp>I often watch science videos about \u003cmark>mechanical structures\u003c/mark>. Besides, I enjoy analysing \u003cmark>how different devices operate\u003c/mark> and try to understand \u003cmark>the physical principles supporting their functions.\u003c/mark>\u003c/p>\n\u003cp>我经常观看机械结构相关科普视频。除此之外，我喜欢分析各类设备的运作方式，弄懂支撑它们运转的物理原理。\u003c/p>\n\u003ch2 id=\"h5\">5. Do you like watching science TV programs?\u003c/h2>\n\u003cp>Sure, I’m \u003cmark>keen on\u003c/mark> science documentaries. They \u003cmark>use smart ways to do explain difficult knowledge clearly\u003c/mark> and \u003cmark>constantly satisfy my curiosity about\u003c/mark> technology and nature.\u003c/p>\n\u003cp>当然，我很喜欢科学纪录片。它把复杂理论通俗地展现出来，不断满足我对于科技和自然的好奇心。\u003c/p>\n\u003ch2 id=\"h6\">6. Do Chinese people often visit science museums?\u003c/h2>\n\u003cp>Science museums are very popular, especially for \u003cmark>families with kids\u003c/mark> and \u003cmark>student school trips\u003c/mark>. I \u003cmark>used to love visiting them\u003c/mark> when I was a kid, but these days \u003cmark>I’m not really interested anymore.\u003c/mark>\u003c/p>\n\u003cp>科技馆人气相当高，很多带小孩的家庭和学生研学团都会去。我小时候特别喜欢去，但现在已经没什么兴趣了。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you like science?"},{"level":2,"id":"h2","text":"2. When did you start to learn about science?"},{"level":2,"id":"h3","text":"3. Which science subject is interesting to you?"},{"level":2,"id":"h4","text":"4. What kinds of interesting things have you done with science?"},{"level":2,"id":"h5","text":"5. Do you like watching science TV programs?"},{"level":2,"id":"h6","text":"6. Do Chinese people often visit science museums?"}],"text":"Do you like science? When did you start to learn about science? Which science subject is interesting to you? What kinds of interesting things have you done with science? Do you like watching science TV programs? Do Chinese people often visit science museums? 英文短语 中文释义 I’ve always been fascinated by 我一直对…… 深深着迷 from an early age 从小 a quote from 名言 Scientists study the world as it is 科学家研究现存的世界 engineers create the world that has never been 工程师创造从未有过的世界 This idea really inspires me. 这个观点一直激励着我 natural phenomena 自然现象 made me more curious about how the world works. 世界运行规律 appeals to me the most 最吸引我 fundamental rules behind motion 运动背后的基础原理 which connects closely with engineering. 和工程领域紧密相关。 () mechanical structures 机械结构 how different devices operate 各类设备的运作方式 the physical principles supporting their functions. 支撑它们运转的物理原理。 I’m really interested in science documentaries 我很喜欢科学纪录片 used smart ways to do 用巧妙的方式做某事 explain difficult knowledge clearly 把难懂的知识讲清楚 constantly satisfy my curiosity about 不断满足我对于 ...... 的好奇 families with kids 带小孩的家庭 school trips 学校研学、校外参观 used to love visiting them 过去很喜欢参观他们 I’m not really interested anymore. 现在已经没什么兴趣了。 1. Do you like science? Yes, I’ve always been fascinated by science and engineering from an early age. I still remember a quote from Doctor von Kármán: Scientists study the world as it is; engineers create the world that has never been. This idea really inspires me. 喜欢，我从小就对科学与工程很感兴趣。我记得冯・卡门有一句话：科学家研究现存的世界，工程师创造从未有过的世界。这个观点一直激励着我。 2. When did you start to learn about science? I first got to know basic scientific knowledge in primary school science classes. Those hands-on experiments and natural phenomena made me more curious about how the world works. 我小学科学课第一次接触基础科学知识。那些简单实验与自然现象，激发了我对世界运行规律的好奇心。 3. Which science subject is interesting to you? It's no doubt that Physics appeals to me the most, especially mechanics. It explains the fundamental rules behind motion, which connects closely with engineering. 物理最吸引我，尤其是力学。它阐释运动背后的基础原理，和工程领域紧密相关。 4. What kinds of interesting things have you done with science? I often watch science videos about mechanical structures. Besides, I enjoy analysing how different devices operate and try to understand the physical principles supporting their functions. 我经常观看机械结构相关科普视频。除此之外，我喜欢分析各类设备的运作方式，弄懂支撑它们运转的物理原理。 5. Do you like watching science TV programs? Sure, I’m keen on science documentaries. They use smart ways to do explain difficult knowledge clearly and constantly satisfy my curiosity about technology and nature. 当然，我很喜欢科学纪录片。它把复杂理论通俗地展现出来，不断满足我对于科技和自然的好奇心。 6. Do Chinese people often visit science museums? Science museums are very popular, especially for families with kids and student school trips. I used to love visiting them when I was a kid, but these days I’m not really interested anymore. 科技馆人气相当高，很多带小孩的家庭和学生研学团都会去。我小时候特别喜欢去，但现在已经没什么兴趣了。"},{"id":"a-p1-headphones","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/16-headphones.md","title":"Headphones","html":"\u003cul>\n\u003cli>Do you use headphones?\u003c/li>\n\u003cli>What type of headphones do you use?\u003c/li>\n\u003cli>When would you use headphones?\u003c/li>\n\u003cli>In what conditions would you not use headphones?\u003c/li>\n\u003cli>Is wearing headphones comfortable？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>nearlly all the time\u003c/td>\n\u003ctd>时时刻刻，一直\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I basically can’t live without them\u003c/td>\n\u003ctd>几乎离不开它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Its main function for me\u003c/td>\n\u003ctd>对我来说它最主要的用处是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stay focused\u003c/td>\n\u003ctd>保持专注\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>wireless headphones\u003c/td>\n\u003ctd>无线耳机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there are no messy cables\u003c/td>\n\u003ctd>没有杂乱的线材\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get in my way\u003c/td>\n\u003ctd>碍事、造成不便\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>energetic music\u003c/td>\n\u003ctd>激昂有活力的音乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which can cheer me up\u003c/td>\n\u003ctd>可以鼓舞我、让我振作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep going\u003c/td>\n\u003ctd>坚持下去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give up halfway\u003c/td>\n\u003ctd>半途而废\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when staying with my family or friends\u003c/td>\n\u003ctd>和家人朋友相处时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>since it would be really impolite\u003c/td>\n\u003ctd>因为这样很不礼貌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when crossing roads or cycling\u003c/td>\n\u003ctd>过马路或骑自行车的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for safety reasons\u003c/td>\n\u003ctd>出于安全考虑\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it is not that comfortable for me\u003c/td>\n\u003ctd>对我来说不算舒服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve already got used to it\u003c/td>\n\u003ctd>我已经习惯了\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you use headphones?\u003c/h2>\n\u003cp>\u003cmark>Well, to be honest\u003c/mark>, I wear headphones nearly \u003cmark>all the time\u003c/mark>. and \u003cmark>I basically can’t live without them\u003c/mark>. \u003cmark>Its main function for me\u003c/mark> is to help me \u003cmark>stay focused\u003c/mark> when I’m studying or hitting the gym.\u003c/p>\n\u003cp>说实话，我几乎时时刻刻都戴着耳机，基本离不开它。对我来说，耳机最主要的作用就是在学习、跑步或者健身的时候帮我集中注意力。\u003c/p>\n\u003ch2 id=\"h2\">2. What type of headphones do you use?\u003c/h2>\n\u003cp>I&#39;ve tried all kinds of headphones. To be honest, I prefer to use \u003cmark>wireless headphones\u003c/mark>. They are really convenient because \u003cmark>there are no messy cables\u003c/mark> to \u003cmark>get in my way.\u003c/mark>\u003c/p>\n\u003cp>我使用无线耳机。它们十分方便，不会有杂乱的线材造成困扰。\u003c/p>\n\u003ch2 id=\"h3\">3. When would you use headphones?\u003c/h2>\n\u003cp>I always wear headphones while running. I listen to some \u003cmark>energetic music\u003c/mark>, \u003cmark>which can cheer me up\u003c/mark> and help me \u003cmark>keep going\u003c/mark>, especially when I feel tired and want to \u003cmark>give up halfway\u003c/mark>.\u003c/p>\n\u003cp>跑步的时候我也会戴上耳机听歌。音乐能鼓舞我，让我坚持下去，尤其是当我疲惫想要半途而废的时候。\u003c/p>\n\u003ch2 id=\"h4\">4. In what conditions would you not use headphones?\u003c/h2>\n\u003cp>I will not wear headphones \u003cmark>when staying with family or friends\u003c/mark>, \u003cmark>since it would be really impolite\u003c/mark>. Besides, I avoid wearing them when \u003cmark>crossing roads\u003c/mark> or cycling \u003cmark>for safety reasons.\u003c/mark>\u003c/p>\n\u003cp>和家人朋友相处时我不会戴耳机，那样很不礼貌。除此之外，过马路或者骑车时，出于安全考虑我也不会佩戴。\u003c/p>\n\u003ch2 id=\"h5\">5. Is wearing headphones comfortable？\u003c/h2>\n\u003cp>Honestly, \u003cmark>it is not that comfortable for me\u003c/mark>. But I almost wear them everyday that \u003cmark>I’ve already got used to it.\u003c/mark>\u003c/p>\n\u003cp>说实话佩戴起来不算舒服。不过我经常使用，早就已经习惯了。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you use headphones?"},{"level":2,"id":"h2","text":"2. What type of headphones do you use?"},{"level":2,"id":"h3","text":"3. When would you use headphones?"},{"level":2,"id":"h4","text":"4. In what conditions would you not use headphones?"},{"level":2,"id":"h5","text":"5. Is wearing headphones comfortable？"}],"text":"Do you use headphones? What type of headphones do you use? When would you use headphones? In what conditions would you not use headphones? Is wearing headphones comfortable？ 英文短语 中文释义 nearlly all the time 时时刻刻，一直 I basically can’t live without them 几乎离不开它 Its main function for me 对我来说它最主要的用处是 stay focused 保持专注 wireless headphones 无线耳机 there are no messy cables 没有杂乱的线材 get in my way 碍事、造成不便 energetic music 激昂有活力的音乐 which can cheer me up 可以鼓舞我、让我振作 keep going 坚持下去 give up halfway 半途而废 when staying with my family or friends 和家人朋友相处时 since it would be really impolite 因为这样很不礼貌 when crossing roads or cycling 过马路或骑自行车的时候 for safety reasons 出于安全考虑 it is not that comfortable for me 对我来说不算舒服 I’ve already got used to it 我已经习惯了 1. Do you use headphones? Well, to be honest, I wear headphones nearly all the time. and I basically can’t live without them. Its main function for me is to help me stay focused when I’m studying or hitting the gym. 说实话，我几乎时时刻刻都戴着耳机，基本离不开它。对我来说，耳机最主要的作用就是在学习、跑步或者健身的时候帮我集中注意力。 2. What type of headphones do you use? I've tried all kinds of headphones. To be honest, I prefer to use wireless headphones. They are really convenient because there are no messy cables to get in my way. 我使用无线耳机。它们十分方便，不会有杂乱的线材造成困扰。 3. When would you use headphones? I always wear headphones while running. I listen to some energetic music, which can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 跑步的时候我也会戴上耳机听歌。音乐能鼓舞我，让我坚持下去，尤其是当我疲惫想要半途而废的时候。 4. In what conditions would you not use headphones? I will not wear headphones when staying with family or friends, since it would be really impolite. Besides, I avoid wearing them when crossing roads or cycling for safety reasons. 和家人朋友相处时我不会戴耳机，那样很不礼貌。除此之外，过马路或者骑车时，出于安全考虑我也不会佩戴。 5. Is wearing headphones comfortable？ Honestly, it is not that comfortable for me. But I almost wear them everyday that I’ve already got used to it. 说实话佩戴起来不算舒服。不过我经常使用，早就已经习惯了。"},{"id":"a-p1-jokes","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/17-jokes & comedies.md","title":"Jokes & comedies","html":"\u003cul>\n\u003cli>Are you good at telling jokes?\u003c/li>\n\u003cli>Do your friends like to tell jokes?\u003c/li>\n\u003cli>Do you like to watch comedies?\u003c/li>\n\u003cli>Have you ever watched a live show?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>when I hang out with my best friends\u003c/td>\n\u003ctd>和最好的朋友相处时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on some important occasions\u003c/td>\n\u003ctd>在一些重要场合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me appear not that professional\u003c/td>\n\u003ctd>让我显得不够专业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tend to keep serious\u003c/td>\n\u003ctd>倾向于保持严肃\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tease each other\u003c/td>\n\u003ctd>互相打趣、开玩笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>laugh a lot\u003c/td>\n\u003ctd>开怀大笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend time together\u003c/td>\n\u003ctd>一起共处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It makes our time much more enjoyable\u003c/td>\n\u003ctd>让相处时光更加愉快\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>comedy films\u003c/td>\n\u003ctd>喜剧电影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learn a lot from them\u003c/td>\n\u003ctd>从中收获很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tragic core\u003c/td>\n\u003ctd>悲剧内核\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>beneath all the laughter\u003c/td>\n\u003ctd>在欢声笑语之下\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live stand-up comedy show\u003c/td>\n\u003ctd>现场脱口秀演出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the live atmosphere was really fantastic\u003c/td>\n\u003ctd>现场氛围十分棒\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Are you good at telling jokes?\u003c/h2>\n\u003cp>No,not really. I’m only humorous \u003cmark>when I hang out with my best friends.\u003c/mark> \u003cmark>On some important occassions\u003c/mark>, telling jokes may \u003cmark>make me appear not that professional\u003c/mark>, so I tend to \u003cmark>keep serious\u003c/mark>.\u003c/p>\n\u003cp>我只在和最好的朋友相处时比较风趣。在正式场合，讲笑话会显得我不够专业，所以我一般会保持严肃。\u003c/p>\n\u003ch2 id=\"h2\">2. Do your friends like to tell jokes?\u003c/h2>\n\u003cp>Sure, most of my friends love sharing jokes. We often \u003cmark>tease each other\u003c/mark> and \u003cmark>laugh a lot\u003c/mark> when we \u003cmark>spend time together\u003c/mark>. It \u003cmark>makes our time much more enjoyable.\u003c/mark>\u003c/p>\n\u003cp>是的，我的很多朋友都喜欢讲笑话。我们经常互相打趣，在一起时有说有笑，相处起来轻松很多。\u003c/p>\n\u003ch2 id=\"h3\">3. Do you like to watch comedies?\u003c/h2>\n\u003cp>I’ve always \u003cstrong>been fascinated by\u003c/strong>  \u003cmark>comedy films\u003c/mark>. I can l\u003cmark>earn a lot from them\u003c/mark>. Actually, I believe most great comedies have a \u003cmark>tragic core\u003c/mark> \u003cmark>beneath all the laughter.\u003c/mark>\u003c/p>\n\u003cp>我喜欢看喜剧电影，能从中收获很多。实际上我认为，大多数优秀喜剧在欢声笑语之下，内核其实是悲剧。\u003c/p>\n\u003ch2 id=\"h4\">4. Have you ever watched a live show?\u003c/h2>\n\u003cp>Yes, I have watched a \u003cmark>live stand-up comedy show\u003c/mark>. I have to say that \u003cmark>The live atmosphere was fantastic\u003c/mark>.  \u003cmark>totally different from\u003c/mark> watching on TV. It&#39;s also a good way to relax after studying.\u003c/p>\n\u003cp>我看过现场脱口秀。现场氛围特别棒，是忙碌之余放松身心的绝佳方式。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Are you good at telling jokes?"},{"level":2,"id":"h2","text":"2. Do your friends like to tell jokes?"},{"level":2,"id":"h3","text":"3. Do you like to watch comedies?"},{"level":2,"id":"h4","text":"4. Have you ever watched a live show?"}],"text":"Are you good at telling jokes? Do your friends like to tell jokes? Do you like to watch comedies? Have you ever watched a live show? 英文短语 中文释义 when I hang out with my best friends 和最好的朋友相处时 on some important occasions 在一些重要场合 make me appear not that professional 让我显得不够专业 tend to keep serious 倾向于保持严肃 tease each other 互相打趣、开玩笑 laugh a lot 开怀大笑 spend time together 一起共处 It makes our time much more enjoyable 让相处时光更加愉快 comedy films 喜剧电影 learn a lot from them 从中收获很多 tragic core 悲剧内核 beneath all the laughter 在欢声笑语之下 live stand-up comedy show 现场脱口秀演出 the live atmosphere was really fantastic 现场氛围十分棒 1. Are you good at telling jokes? No,not really. I’m only humorous when I hang out with my best friends. On some important occassions, telling jokes may make me appear not that professional, so I tend to keep serious. 我只在和最好的朋友相处时比较风趣。在正式场合，讲笑话会显得我不够专业，所以我一般会保持严肃。 2. Do your friends like to tell jokes? Sure, most of my friends love sharing jokes. We often tease each other and laugh a lot when we spend time together. It makes our time much more enjoyable. 是的，我的很多朋友都喜欢讲笑话。我们经常互相打趣，在一起时有说有笑，相处起来轻松很多。 3. Do you like to watch comedies? I’ve always been fascinated by comedy films. I can learn a lot from them. Actually, I believe
