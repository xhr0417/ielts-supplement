n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>stand at\u003c/strong>\u003c/td>\n\u003ctd>最推荐！静态描述当前 / 某年数值（过去式 stood at）\u003c/td>\n\u003ctd>The figure for manufacturing \u003cstrong>stood at\u003c/strong> 15 million in 1960.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>reach\u003c/strong>\u003c/td>\n\u003ctd>达到某个数值（经常用于终点、峰值）\u003c/td>\n\u003ctd>The number \u003cstrong>reached\u003c/strong> 16 million by 2020.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>hit\u003c/strong>\u003c/td>\n\u003ctd>达到（多用于峰值、高点）\u003c/td>\n\u003ctd>It \u003cstrong>hit\u003c/strong> a peak of 20 million in 1980.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h18\">占比\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用场景\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>account for + 百分比\u003c/td>\n\u003ctd>占据（比例）\u003c/td>\n\u003ctd>最常用，主体在前\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make up + 百分比\u003c/td>\n\u003ctd>构成、占比\u003c/td>\n\u003ctd>中性，简单易懂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constitute + 百分比\u003c/td>\n\u003ctd>构成\u003c/td>\n\u003ctd>偏正式；用不用都不影响分数，搭配对才有用\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h19\">增长\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>备注\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>rise (rose, risen)\u003c/td>\n\u003ctd>上升\u003c/td>\n\u003ctd>通用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>increase (increased)\u003c/td>\n\u003ctd>增长\u003c/td>\n\u003ctd>最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>grow (grew, grown)\u003c/td>\n\u003ctd>增长；攀升\u003c/td>\n\u003ctd>侧重持续发展\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h20\">下降\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fall (fell, fallen)\u003c/td>\n\u003ctd>下降\u003c/td>\n\u003ctd>通用高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decrease (decreased)\u003c/td>\n\u003ctd>减少\u003c/td>\n\u003ctd>最稳妥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decline (declined)\u003c/td>\n\u003ctd>下滑、递减\u003c/td>\n\u003ctd>偏正式，推荐多用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plummet (plummeted)\u003c/td>\n\u003ctd>骤降、大跌\u003c/td>\n\u003ctd>\u003cstrong>幅度词\u003c/strong>：只能用于真正的暴跌。图上只是小幅下降却写 plummet，比写 decrease 扣得更多\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h21\">持续的\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>小作文例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>continuous\u003c/td>\n\u003ctd>持续不断的（无中断）\u003c/td>\n\u003ctd>a continuous rise 持续上升\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>steady\u003c/td>\n\u003ctd>平稳持续的（波动小）\u003c/td>\n\u003ctd>a steady decline 持续平稳下降\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constant\u003c/td>\n\u003ctd>恒定不变的；持续不变（侧重几乎没变化）\u003c/td>\n\u003ctd>constant level 持续持平\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h22\">快速、激烈、急剧\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>幅度参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>significantly\u003c/td>\n\u003ctd>显著地\u003c/td>\n\u003ctd>明显增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dramatically\u003c/td>\n\u003ctd>急剧地\u003c/td>\n\u003ctd>大幅上涨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rapidly\u003c/td>\n\u003ctd>快速地\u003c/td>\n\u003ctd>增速快\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h23\">轻微、逐渐\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>幅度参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>slightly\u003c/mark>\u003c/td>\n\u003ctd>轻微地\u003c/td>\n\u003ctd>小幅上涨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gradually\u003c/td>\n\u003ctd>稳步、逐渐\u003c/td>\n\u003ctd>平缓持续增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>moderately\u003c/mark>\u003c/td>\n\u003ctd>适度地\u003c/td>\n\u003ctd>中等涨幅\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h24\">保持不变\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>备注\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>remain stable\u003c/td>\n\u003ctd>保持稳定\u003c/td>\n\u003ctd>最高频、稳妥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>remain constant\u003c/td>\n\u003ctd>维持恒定\u003c/td>\n\u003ctd>正式，推荐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stay unchanged\u003c/td>\n\u003ctd>保持不变\u003c/td>\n\u003ctd>简单好用\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h25\">易混用法（别当成同义词）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>容易混的写法\u003c/th>\n\u003cth>正确理解\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>小作文&quot;起码写到 200+&quot;\u003c/td>\n\u003ctd>官方最低要求是 \u003cstrong>150 词\u003c/strong>，建议用时约 20 分钟。200 不是门槛，为凑字数重复信息反而丢分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>slightly\u003c/code> / \u003ccode>slowly\u003c/code> / \u003ccode>steadily\u003c/code> 都算&quot;轻微&quot;\u003c/td>\n\u003ctd>三者侧重不同：\u003ccode>slightly\u003c/code> 幅度小、\u003ccode>slowly\u003c/code> 速度慢、\u003ccode>steadily\u003c/code> 变化平稳（不含幅度信息）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>approximately\u003c/code> / \u003ccode>nearly\u003c/code> / \u003ccode>almost\u003c/code> 都当&quot;大约&quot;\u003c/td>\n\u003ctd>\u003ccode>nearly\u003c/code> / \u003ccode>almost\u003c/code> 表示\u003cstrong>接近但还没到\u003c/strong>，不能随意代替 \u003ccode>approximately\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>by far\u003c/code> 当&quot;迄今&quot;\u003c/td>\n\u003ctd>\u003ccode>by far the largest\u003c/code> 是&quot;\u003cstrong>远远\u003c/strong>最大&quot;；&quot;迄今&quot;是 \u003ccode>so far\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>opposite to\u003c/code> 表示地图上的&quot;在对面&quot;\u003c/td>\n\u003ctd>优先写 \u003ccode>opposite the school\u003c/code>，\u003cstrong>不加 to\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>starting with … and end with …\u003c/code>\u003c/td>\n\u003ctd>并列要一致：\u003ccode>starting with … and **ending** with …\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>the majority of\u003c/code> 当普通&quot;占比大&quot;用\u003c/td>\n\u003ctd>通常意味着\u003cstrong>超过一半\u003c/strong>；占比最大也可能不足一半\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>short-time benefits\u003c/code>\u003c/td>\n\u003ctd>应为 \u003ccode>short-term benefits\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>optimize the current problem\u003c/code>\u003c/td>\n\u003ctd>搭配不成立，改 \u003ccode>address the problem\u003c/code> 或 \u003ccode>improve the situation\u003c/code>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h26\">四个可以整套背下来的句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>完整句型\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>比较数据\u003c/td>\n\u003ctd>\u003cstrong>A accounted for 40%, compared with 25% for B.\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概括有波动的趋势\u003c/td>\n\u003ctd>\u003cstrong>Despite some fluctuations, the figure increased overall.\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图变化与不变\u003c/td>\n\u003ctd>\u003cstrong>The factory was replaced by a shopping centre, while the park remained unchanged.\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程起点与终点\u003c/td>\n\u003ctd>\u003cstrong>Overall, the process consists of six stages, beginning with … and ending with ….\u003c/strong>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>数字、变化和阶段数量都按图替换；\u003cstrong>图上没有波动就不要写 \u003ccode>Despite some fluctuations\u003c/code>\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n","toc":[{"level":2,"id":"h1","text":"花销"},{"level":2,"id":"h2","text":"钱"},{"level":2,"id":"h3","text":"份额、比例"},{"level":2,"id":"h4","text":"在某段时间内"},{"level":2,"id":"h5","text":"比例"},{"level":2,"id":"h6","text":"排名（看全图，不看单个数字）"},{"level":2,"id":"h7","text":"区域"},{"level":2,"id":"h8","text":"因为，由于"},{"level":2,"id":"h9","text":"阻挡"},{"level":2,"id":"h10","text":"剩余的"},{"level":2,"id":"h11","text":"表示，说明"},{"level":2,"id":"h12","text":"受访者，调查对象"},{"level":2,"id":"h13","text":"工作"},{"level":2,"id":"h14","text":"大约"},{"level":2,"id":"h15","text":"略高，略低"},{"level":2,"id":"h16","text":"数量词"},{"level":2,"id":"h17","text":"是/达到"},{"level":3,"id":"h18","text":"占比"},{"level":3,"id":"h19","text":"增长"},{"level":3,"id":"h20","text":"下降"},{"level":2,"id":"h21","text":"持续的"},{"level":3,"id":"h22","text":"快速、激烈、急剧"},{"level":3,"id":"h23","text":"轻微、逐渐"},{"level":3,"id":"h24","text":"保持不变"},{"level":2,"id":"h25","text":"易混用法（别当成同义词）"},{"level":2,"id":"h26","text":"四个可以整套背下来的句型"}],"text":"花销 单词 中文 侧重点 搭配 & 例句 spending 支出、花费【最百搭，首选】 泛指各类开销（政府、家庭、个人） government spending；spending on education Spending on healthcare rose. cost 成本；花费 侧重购买、运营成本；也可指开销 the cost of transport ⚠️ 区分：cost 多指 “成本”，不一定是预算支出 expense 开销、费用（常用复数 expenses） 日常 / 业务开销，单数少用 living expenses（生活费） 钱 英镑是 pounds!!! 份额、比例 单词 侧重点 适用图表 例句 proportion 强调部分相对于整体，不一定带 % 数字 饼图、占比柱状图 the proportion of people who cycled share 侧重分配、占有份额（市场、资源、人群） 饼图、市场类图表 the share of renewable energy percentage 强调数字单位，后面常跟具体数值 带 % 刻度图表 the percentage of students working part-time 在某段时间内 over the 20-year period from 2000 to 2020 比例 比例 en 34% roughly a third 49% nearly half of 52% just over half of 单个百分比不能决定排名。 1% 只有当图上其它数据都比它大时才是 the smalles u003ctd>High costs impede the popularity of new technology.\u003cbr>\u003cbr>高昂成本阻碍新技术普及。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>restrict\u003c/strong>\u003c/td>\n\u003ctd>v.\u003c/td>\n\u003ctd>限制，阻碍发展\u003c/td>\n\u003ctd>Financial pressure restricts people’s choices.\u003cbr>\u003cbr>经济压力阻碍人们的选择。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>prevent\u003c/strong>\u003c/td>\n\u003ctd>v.\u003c/td>\n\u003ctd>阻止，阻碍（基础简单词）\u003c/td>\n\u003ctd>Such problems prevent society from developing rapidly.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">忽视\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英语表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用语境\u003c/th>\n\u003cth>例句（雅思写作风格）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>overlook\u003c/strong>\u003c/td>\n\u003ctd>忽略、未注意到\u003c/td>\n\u003ctd>指无意中漏掉或未充分重视\u003c/td>\n\u003ctd>\u003cem>The government tends to \u003cstrong>overlook\u003c/strong> the needs of rural communities.\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>neglect\u003c/strong>\u003c/td>\n\u003ctd>疏忽、疏于照顾\u003c/td>\n\u003ctd>指未尽到责任或义务（常带负面评价）\u003c/td>\n\u003ctd>\u003cem>Parents who \u003cstrong>neglect\u003c/strong> their children&#39;s emotional development may cause long-term harm.\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>disregard\u003c/strong>\u003c/td>\n\u003ctd>漠视、不理会\u003c/td>\n\u003ctd>指完全不把某事物当回事（语气很强）\u003c/td>\n\u003ctd>\u003cem>A complete \u003cstrong>disregard\u003c/strong> for environmental regulations will invite severe penalties.\u003c/em>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h4\">学习知识\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用场景例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>absorb knowledge\u003c/td>\n\u003ctd>吸收知识（侧重沉浸式）\u003c/td>\n\u003ctd>Cinema-goers \u003cstrong>absorb knowledge\u003c/strong> via immersive shows.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>broaden one’s horizons\u003c/td>\n\u003ctd>开阔眼界（文化话题万能）\u003c/td>\n\u003ctd>Live performances \u003cstrong>broaden young people’s horizons\u003c/strong>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enrich one’s understanding\u003c/td>\n\u003ctd>加深、丰富认知\u003c/td>\n\u003ctd>Films \u003cstrong>enrich viewers’ understanding\u003c/strong> of local culture.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h5\">居民，人，劳动力\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>residents\u003c/mark>\u003c/td>\n\u003ctd>居民（首选，楼房、社区、城市）\u003c/td>\n\u003ctd>Local residents have little access to sunlight.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>inhabitants\u003c/td>\n\u003ctd>居民、常住者（偏书面，城市 / 地区）\u003c/td>\n\u003ctd>The inhabitants suffer from blocked sunlight.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>individuals\u003c/mark>\u003c/td>\n\u003ctd>人们，个体（写作高频）\u003c/td>\n\u003ctd>正式，议论文万能替换 people\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>citizens\u003c/td>\n\u003ctd>市民（城市、公共政策话题）\u003c/td>\n\u003ctd>Citizens hope for better living environments.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>the public\u003c/mark>\u003c/td>\n\u003ctd>大众，公众（公共设施、安全政策）\u003c/td>\n\u003ctd>The public need effective safety measures.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>workers / employees\u003c/td>\n\u003ctd>上班族（职场话题）\u003c/td>\n\u003ctd>New employees are less capable than senior staff.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>workforce\u003c/mark>\u003c/td>\n\u003ctd>全体从业人员、劳动力【强烈推荐】\u003c/td>\n\u003ctd>The company’s workforce needs emergency training.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h6\">倡导、引领、推动\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文含义\u003c/th>\n\u003cth>例句参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>encourage\u003c/td>\n\u003ctd>鼓励，倡导（基础万能）\u003c/td>\n\u003ctd>The government encourages green lifestyles.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>promote\u003c/td>\n\u003ctd>推动；倡导（最高频首选）\u003c/td>\n\u003ctd>The government promotes public transport.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>advocate\u003c/mark>\u003c/td>\n\u003ctd>倡导（理念、政策、生活方式）\u003c/td>\n\u003ctd>Officials advocate energy-saving habits.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h7\">实施，出台，颁布，推行\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文词汇\u003c/th>\n\u003cth>中文对应\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>introduce\u003c/td>\n\u003ctd>出台（政策）\u003c/td>\n\u003ctd>The government introduced new housing policies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>launch\u003c/mark>\u003c/td>\n\u003ctd>推行、推出（计划）\u003c/td>\n\u003ctd>The city launched a plan to build more flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>implement\u003c/mark>\u003c/td>\n\u003ctd>实施（落实执行）\u003c/td>\n\u003ctd>The new rules were implemented last month.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>carry out\u003c/td>\n\u003ctd>实施、落实\u003c/td>\n\u003ctd>Local councils carry out the housing policy.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enforce\u003c/td>\n\u003ctd>强制执行\u003c/td>\n\u003ctd>Strict building laws are enforced in big cities.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h8\">处理，应对\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文含义\u003c/th>\n\u003cth>使用场景 &amp; 区别\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>cope with\u003c/mark>\u003c/td>\n\u003ctd>应对（难题、压力）\u003c/td>\n\u003ctd>侧重主动面对困难、压力、社会问题\u003c/td>\n\u003ctd>Many young people can’t cope with high living costs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>deal with\u003c/mark>\u003c/td>\n\u003ctd>处理，应对\u003c/td>\n\u003ctd>万能基础词，人 / 事 / 问题通用，口语首选\u003c/td>\n\u003ctd>Governments need to deal with housing shortages.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>handle\u003c/td>\n\u003ctd>妥善处理、应付\u003c/td>\n\u003ctd>侧重有能力处理事务、麻烦\u003c/td>\n\u003ctd>Cities need to handle the fast growth of population.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resolve\u003c/td>\n\u003ctd>解决（纠纷、矛盾、问题）\u003c/td>\n\u003ctd>侧重彻底化解问题\u003c/td>\n\u003ctd>These rules help resolve the lack of homes.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h9\">严重的，恶劣的\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>serious\u003c/td>\n\u003ctd>通用，可形容问题、情况、后果\u003c/td>\n\u003ctd>Serious housing shortages appear in big cities.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>severe\u003c/td>\n\u003ctd>程度极强，恶劣严峻（压力、短缺、天气）\u003c/td>\n\u003ctd>Young people face severe pressure from living costs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical\u003c/td>\n\u003ctd>情况危急、十分严重\u003c/td>\n\u003ctd>The lack of affordable houses has become critical.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h10\">减轻（压力，负担）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>搭配 &amp; 用法\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>reduce\u003c/td>\n\u003ctd>reduce pressure /reduce burdens 通用\u003c/td>\n\u003ctd>The policy can reduce people’s living pressure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ease\u003c/td>\n\u003ctd>ease pressure /\u003cmark>ease the burden\u003c/mark>（高频）\u003c/td>\n\u003ctd>Building cheap flats eases young people’s burden.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>relieve\u003c/td>\n\u003ctd>relieve stress / relieve financial burden\u003c/td>\n\u003ctd>More affordable housing relieves economic stress.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"随着...的发展"},{"level":2,"id":"h2","text":"阻止，阻碍"},{"level":2,"id":"h3","text":"忽视"},{"level":3,"id":"h4","text":"学习知识"},{"level":3,"id":"h5","text":"居民，人，劳动力"},{"level":3,"id":"h6","text":"倡导、引领、推动"},{"level":3,"id":"h7","text":"实施，出台，颁布，推行"},{"level":3,"id":"h8","text":"处理，应对"},{"level":3,"id":"h9","text":"严重的，恶劣的"},{"level":3,"id":"h10","text":"减轻（压力，负担）"}],"text":"随着...的发展 中文 英文表达 难度 备注 & 适用场景 随着社会的发展 / 进步 With the development of society 6.0 基础款 万能通用，最容易背诵 With the progress of society 6.5 progress 侧重 “进步”，人文类话题更佳 随着科技的发展 / 进步 With the development of technology 6.0 基础 通用写法 随着经济全球化 With economic globalisation 6.5 首选 重点！名词短语，直接套用 阻止，阻碍 英文表达 词性 中文释义 写作例句 barrier n. 障碍，阻碍（⭐首选，最高频） Language can be a barrier to international communication. 语言会成为国际交流的阻碍。 impede v. 阻碍，妨碍（高分动词） High costs impede the popularity of new technology. 高昂成本阻碍新技术普及。 restrict v. 限制，阻碍发展 Financial pressure restricts people’s choices. 经济压力阻碍人们的选择。 prevent v. 阻止，阻碍（基础简单词） Such problems prevent society from developing rapidly. 忽视 英语表达 中文释义 适用语境 例句（雅思写作风格） overlook 忽略、未注意到 指无意中漏掉或未充分重视 The government tends to overlook the needs of rural communities. neglect 疏忽、疏于照顾 指未尽到责任或义务（常带负面评价） Parents who neglect their children's emotional development may cause long-term harm. disregard 漠视、不理会 指完全不把某事物当回事（语气很强） A complete disregard for environmental regulations will invite severe penalties. 学习知识 英文短语 中文释义 适用场景例句 absorb knowledge 吸收知识（侧重沉浸式） Cinema-goers absorb knowledge via immersive shows. broaden one’s horizons 开阔眼界（文化话题万能） Live performances broaden young people’s horizons. enrich one’s understanding 加深、丰富认知 Films enrich viewers’ understanding of local culture. 居民，人，劳动力 表达 释义 例句 residents 居民（首选，楼房、社区、城市） Local residents have little access to sunlight. inhabitants 居民、常住者（偏书面，城市 / 地区） The inhabitants suffer from blocked sunlight. individuals 人们，个体（写作高频） 正式，议论文万能替换 people citizens 市民（城市、公共政策话题） Citizens hope for better living environments. the public 大众，公众（公共设施、安全政策） The public need effective safety measures. workers / employees 上班族（职场话题） New employees are less capable than senior staff. workforce 全体从业人员、劳动力【强烈推荐】 The company’s workforce needs emergency training. 倡导、引领、推动 英文表达 中文含义 例句参考 encourage 鼓励，倡导（基础万能） The government encourages green lifestyles. promote 推动；倡导（最高频首选） The government promotes public transport. advocate 倡导（理念、政策、生活方式） Officials advocate energy-saving habits. 实施，出台，颁布，推行 英文词汇 中文对应 例句 introduce 出台（政策） The government introduced new housing policies. launch 推行、推出（计划） The city launched a plan to build more flats. implement 实施（落实执行） The new rules were implemented last month. carry out 实施、落实 Local councils carry out the housing policy. enforce 强制执行 Strict building laws are enforced in big cities. 处理，应对 英文表达 中文含义 使用场景 & 区别 例句 cope with 应对（难题、压力） 侧重主动面对困难、压力、社会问题 Many young people can’t cope with high living costs. deal with 处理，应对 万能基础词，人 / 事 / 问题通用，口语首选 Governments need to deal with housing shortages. handle 妥善处理、应付 侧重有能力处理事务、麻烦 Cities need to handle the fast growth of population. resolve 解决（纠纷、矛盾、问题） 侧重彻底化解问题 These rules help resolve the lack of homes. 严重的，恶劣的 单词 侧重点 例句 serious 通用，可形容问题、情况、后果 Serious housing shortages appear in big cities. severe 程度极强，恶劣严峻（压力、短缺、天气） Young people face severe pressure from living costs. critical 情况危急、十分严重 The lack of affordable houses has become critical. 减轻（压力，负担） 英文 搭配 & 用法 例句 reduce reduce pressure /reduce burdens 通用 The policy can reduce people’s living pressure. ease ease pressure /ease the burden（高频） Building cheap flats eases young people’s burden. relieve relieve stress / relieve financial burden More affordable housing relieves economic stress."},{"id":"a-w-map","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/1-2 地图.md","title":"地图词汇","html":"\u003ch2 id=\"h1\">开头\u003c/h2>\n\u003cp>The maps illustrate the changes that took place in 【地点】 between 【年份 1】 and 【年份 2】.\u003cbr>（若是现在与未来规划对比：The maps show the current layout of 【地点】 and the proposed plan for redevelopment.）\u003c/p>\n\u003ch2 id=\"h2\">概述\u003c/h2>\n\u003cp>总结最核心的 2-3 个整体特征，不写具体数字和细节\u003cbr>必写角度：① 功能转变；② 设施增减趋势；③ 最显著的变化\u003cbr>⚠️ \u003cstrong>时态提醒\u003c/strong>：两个过去年份对比用\u003cstrong>一般过去时/过去完成时\u003c/strong>；过去与现在对比用\u003cstrong>一般过去时 + 现在完成时\u003c/strong>；含未来规划（planned / proposed / future）用 \u003ccode>is expected to be / will be + 过去分词\u003c/code>。\u003c/p>\n\u003ch3 id=\"h3\">地点/区域/场地\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>核心含义\u003c/th>\n\u003cth>使用场景（地图题区分）\u003c/th>\n\u003cth>例句参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>site\u003c/strong>\u003c/td>\n\u003ctd>场地、原址（一片规划地块）\u003c/td>\n\u003ctd>✅ \u003cstrong>题目标配词\u003c/strong>；侧重「特定建设地点、整片场地」\u003cbr>\u003cbr>常搭配：the site of …\u003c/td>\n\u003ctd>The plans show the site of Beechwood Farm.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>land\u003c/strong>\u003c/td>\n\u003ctd>土地、地块（通用，最基础）\u003c/td>\n\u003ctd>✅ 泛指土地；可指农业用地、空地\u003cbr>\u003cbr>不可数为主\u003c/td>\n\u003ctd>The land between the river and roads was split into three plots.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>area\u003c/strong>\u003c/td>\n\u003ctd>区域、片区（万能通用）\u003c/td>\n\u003ctd>✅ 最百搭；大小地块都能用\u003cbr>\u003c/td>\n\u003ctd>This area was used as a sheep pasture.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>plot\u003c/strong>\u003c/td>\n\u003ctd>小块土地、园地\u003c/td>\n\u003ctd>✅ 分割出来的小块耕地 / 园地（果园、菜地首选）\u003c/td>\n\u003ctd>three plots for fruit trees and vegetables\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>field\u003c/strong>\u003c/td>\n\u003ctd>田地、开阔场地\u003c/td>\n\u003ctd>✅ 农田、放牧区、露营场地（高频！）\u003cbr>sheep field / camping field\u003c/td>\n\u003ctd>The sheep field was transformed into a camping area.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>方位\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>be located in the northern part of\u003c/td>\n\u003ctd>位于…… 的北部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be situated at the centre of\u003c/td>\n\u003ctd>坐落于…… 中心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in the north-eastern corner\u003c/td>\n\u003ctd>在东北角\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adjacent to\u003c/td>\n\u003ctd>紧邻；毗邻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in close proximity to\u003c/td>\n\u003ctd>紧靠（书面替换 next to）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>surrounded by\u003c/td>\n\u003ctd>被…… 环绕\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>separated by\u003c/td>\n\u003ctd>被…… 隔开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the main road\u003c/td>\n\u003ctd>沿着主干道\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the coastline\u003c/td>\n\u003ctd>沿着海岸线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on the eastern peninsula\u003c/td>\n\u003ctd>在东部半岛上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at the foot of the mountain\u003c/td>\n\u003ctd>在山脚下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>beside the river\u003c/td>\n\u003ctd>在河边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>to the northwest side of\u003c/td>\n\u003ctd>在…… 西北侧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>within the boundary of\u003c/td>\n\u003ctd>在…… 边界范围内\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outside the town centre\u003c/td>\n\u003ctd>在城镇中心外围\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>变化\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分类\u003c/th>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u0 e situated at the centre of 坐落于…… 中心 in the north-eastern corner 在东北角 adjacent to 紧邻；毗邻 in close proximity to 紧靠（书面替换 next to） surrounded by 被…… 环绕 separated by 被…… 隔开 along the main road 沿着主干道 along the coastline 沿着海岸线 on the eastern peninsula 在东部半岛上 at the foot of the mountain 在山脚下 beside the river 在河边 to the northwest side of 在…… 西北侧 within the boundary of 在…… 边界范围内 outside the town centre 在城镇中心外围 变化 分类 英文短语 中文释义 🔨拆除移除 be demolished / be knocked down 被拆除 be removed / be cleared away 被移除、清理掉 🧱新增 / 建造 be constructed / be built 被建造 be added 新增（设施） A new … has been erected 建起一处新的…… 🔄功能改造 be converted into / be turned into 被改造为…… be replaced by 被…… 取代 📍位置变动 be relocated 被搬迁 A and B have swapped positions A 与 B 互换位置 📏扩建延伸 be expanded / be enlarged （面积）扩建、扩大 be extended （道路 / 建筑）延伸、加长 🟰维持原状 remain unchanged 保持不变 still exist 仍然存在 stay in the same location 位置保持不变 📉缩小消失 shrink in size 面积缩小 disappear completely 彻底消失 ✨拓展描述 witness dramatic transformations 经历巨大变化 undergo significant developments 发生显著改变 衔接 英文短语 中文释义 Overall 总体而言 To be specific 具体来说 In the western area 在西部地区 Turning to the eastern part 转向东部区域 Furthermore / In addition 此外 Finally 最后"},{"id":"a-w-process","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/1-3 流程图.md","title":"流程图词汇","html":"\u003cp>\u003cmark>不要写 will be !!!!!!!!\u003c/mark>\u003c/p>\n\u003ch2 id=\"h1\">开头\u003c/h2>\n\u003cp>The flow chart illustrates the process of manufacturing 【成品】 from 【原料】.\u003cbr>该流程图展示了由【原料】生产【成品】的工序流程。\u003c/p>\n\u003ch2 id=\"h2\">概述\u003c/h2>\n\u003cp>\u003cmark>It is noticeable that there are seven distinct stages\u003c/mark> in the manufacturing process of 【成品】, beginning with 【第一步】 and ending with 【最后一步】.\u003cbr>值得注意的是，整个制造流程分为 7 个明显的阶段，从【第一步】开始，以【最后一步】结束。\u003c/p>\n\u003cp>\u003cmark>These stages mainly include\u003c/mark> raw material \u003cmark>preparation\u003c/mark>, fibre \u003cmark>processing\u003c/mark>, and fabric \u003cmark>production.\u003c/mark>\u003cbr>这些阶段主要包括原料准备、纤维加工和成品生产。\u003c/p>\n\u003ch2 id=\"h3\">描述\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分类\u003c/th>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>顺序衔接\u003c/td>\n\u003ctd>At the first stage in the process,\u003c/td>\n\u003ctd>流程的第一阶段；首先\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>Next, / After that, / Subsequently,\u003c/td>\n\u003ctd>接下来、在此之后、随后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>At the third step shown on the diagram,\u003c/td>\n\u003ctd>如图所示的第三步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>At the next stage of the process,\u003c/td>\n\u003ctd>流程的下一阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>Following this step,\u003c/td>\n\u003ctd>在这一步之后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>Finally, / Eventually,\u003c/td>\n\u003ctd>最终、最后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>过程动作（被动）\u003c/td>\n\u003ctd>to be prepared for further processing\u003c/td>\n\u003ctd>为后续加工工序做准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>which is subsequently delivered into a 【设备/容器】\u003c/td>\n\u003ctd>随后被送入 / 输送至【设备/容器】\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>a machine called &quot;XXX&quot; is used to do sth\u003c/td>\n\u003ctd>一台名为 “XXX” 的机器被用于做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>and the final product is then packaged and delivered\u003c/td>\n\u003ctd>最终产品随后被打包并运出\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"开头"},{"level":2,"id":"h2","text":"概述"},{"level":2,"id":"h3","text":"描述"}],"text":"不要写 will be !!!!!!!! 开头 The flow chart illustrates the process of manufacturing 【成品】 from 【原料】. 该流程图展示了由【原料】生产【成品】的工序流程。 概述 It is noticeable that there are seven distinct stages in the manufacturing process of 【成品】, beginning with 【第一步】 and ending with 【最后一步】. 值得注意的是，整个制造流程分为 7 个明显的阶段，从【第一步】开始，以【最后一步】结束。 These stages mainly include raw material preparation, fibre processing, and fabric production. 这些阶段主要包括原料准备、纤维加工和成品生产。 描述 分类 英文短语 中文释义 顺序衔接 At the first stage in the process, 流程的第一阶段；首先 Next, / After that, / Subsequently, 接下来、在此之后、随后 At the third step shown on the diagram, 如图所示的第三步 At the next stage of the process, 流程的下一阶段 Following this step, 在这一步之后 Finally, / Eventually, 最终、最后 过程动作（被动） to be prepared for further processing 为后续加工工序做准备 which is subsequently delivered into a 【设备/容器】 随后被送入 / 输送至【设备/容器】 a machine called \"XXX\" is used to do sth 一台名为 “XXX” 的机器被用于做某事 and the final product is then packaged and delivered 最终产品随后被打包并运出"},{"id":"a-w-agree","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-1 Agree or disagree.md","title":"Agree or disagree 模板","html":"\u003ch2 id=\"h1\">一、先看题干特点，再决定怎么写\u003c/h2>\n\u003cp>同意与否（Agree or disagree）题干主要有三类，动笔前先判断题目属于哪一种：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题干特点\u003c/th>\n\u003cth>先判断什么\u003c/th>\n\u003cth>展开时注意什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>建议、政策类：should…\u003c/td>\n\u003ctd>你是否支持这个具体建议\u003c/td>\n\u003ctd>用相关的效果、可行性、公平性等理由支持立场\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>比较类：A 比 B 更重要\u003c/td>\n\u003ctd>比较的对象和标准是什么\u003c/td>\n\u003ctd>说明为什么 A 比 B 更重要，或为什么不能这样概括\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>绝对或最高级表述：all、nobody、the most important\u003c/td>\n\u003ctd>这个说法在什么范围内成立\u003c/td>\n\u003ctd>可以同意、反对或限定条件，理由必须回应这个强度\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>比较题不必每一段都同时写 A、B\u003c/strong>，但整篇必须真正完成比较。\u003c/li>\n\u003cli>\u003cstrong>看到绝对词不必自动反驳\u003c/strong>，关键是你能否支持自己的判断。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h2\">审题偏题反例（避免硬套“利大于弊”）\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>题目\u003c/strong>：Some people think that teachers have a greater influence on children&#39;s development than parents do. To what extent do you agree or disagree?（老师对孩子成长的影响比父母更大，多大程度上同意？）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>套错写法\u003c/strong>：第一段写老师能教科学文化知识（好处 1），第二段写老师能培养纪律性（好处 2）。——\u003cstrong>问题\u003c/strong>：只论证了“老师有用”，没有完成“比父母影响更大”的比较。\u003c/li>\n\u003cli>\u003cstrong>正确方向\u003c/strong>：要说明\u003cstrong>相较于父母\u003c/strong>，老师在哪方面（如系统化学习、同龄社交引导）为什么影响更大；或者反过来说明父母在早期性格塑造、陪伴时长上为什么比老师影响更深远。\u003c/li>\n\u003c/ul>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h3\">二、常见三类真题示例\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>建议、政策类\u003c/strong>：Some people think we should let children do housework. Do you agree or disagree?（有些人认为我们应当让孩子做家务。你是否同意？）\u003c/li>\n\u003cli>\u003cstrong>最高级类（C18-T1）\u003c/strong>：The most important aim of science should be to improve people&#39;s lives. To what extent do you agree or disagree with this statement?（科学最重要的目标应当是改善人类的生活。你在多大程度上同意或不同意？）\u003c/li>\n\u003cli>\u003cstrong>绝对表述类（C15-T2）\u003c/strong>：In the future, nobody will buy printed newspapers or books because they will be able to read everything they want online without paying. To what extent do you agree or disagree with this statement?（未来人们将不再购买纸质报刊书籍，因为可以在网上免费阅读一切内容。你在多大程度上同意或不同意？）\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2 id=\"h4\">三、建议/政策类模板（适用于“是否应该做某事”）\u003c/h2>\n\u003cblockquote>\n\u003cp>\u003cstrong>适用范围\u003c/strong>：题干讨论某项政策或做法好不好（如“让孩子做家务”“免费供水”）。若遇到比较类或绝对词题，请调整开头表态句，围绕题干的比较关系或限定范围展开。其中\u003cstrong>第三段让步段为可选\u003c/strong>，若两段核心理由已充分，也可不写让步段。\u003c/p>\n\u003c/blockquote>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is sometimes argued that\u003c/td>\n\u003ctd>有些人认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Personally, I largely agree with this view, as sth brings more benefits than downsides for sb\u003c/td>\n\u003ctd>就我个人而言，我大体赞同这一观点，因为对某人来说，其利大于弊。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First and foremost, one strong argument in favor of this view is that\u003c/td>\n\u003ctd>首先，支持该观点的一个有力论据是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since sth, it can contribute to sth\u003c/td>\n\u003ctd>由于某事 / 某物存在，这有助于某事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for people who...as…\u003c/td>\n\u003ctd>这一点对于…… 人群尤为适用，因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example\u003c/td>\n\u003ctd>例如\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In addition, another strong justification for this idea is that\u003c/td>\n\u003ctd>此外，支持该观点的另一个充分理由是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because sth, it enables people to do sth\u003c/td>\n\u003ctd>由于某事 / 某物，这使得人们能够做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of sth, sth can do sth\u003c/td>\n\u003ctd>相比于某事，某物能够做到某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance\u003c/td>\n\u003ctd>举例来说\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>（可选让步段，非所有题必写）\u003c/strong>\u003cbr>However, it is important to note the negative side of this idea\u003c/td>\n\u003ctd>然而，我们需要留意这个做法存在的弊端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Although this approach may be beneficial to sth in many ways\u003c/td>\n\u003ctd>尽管这种做法在很多方面对某事 / 人群有利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it can also be harmful to\u003c/td>\n\u003ctd>它同样会对…… 造成不利影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Specifically,\u003c/td>\n\u003ctd>具体而言，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that\u003c/td>\n\u003ctd>一个恰当的例子是\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although sth does bring sth\u003c/td>\n\u003ctd>总而言之，尽管某事\u003cstrong>确实\u003c/strong>带来了……（如实承认代价，不要写成“偶尔”“轻微”）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I still believe that sth is crucial for them to do sth, as it can do sth\u003c/td>\n\u003ctd>我依旧认为某事对他们做某事至关重要，因为它能够……（用理由回应反方，而不是贬低反方）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">四、例题（政策建议类）\u003c/h2>\n\u003cp>Access to clean water is a basic human right. Therefore every home should have a water supply that is provided free of charge. Do you agree or disagree?\u003cbr>获得洁净水源是一项基本人权。因此，每户家庭都应当享有免费供水。你是否同意这一观点？\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>It is sometimes argued that\u003c/mark> access to clean water is a fundamental human right, so all households ought to receive free tap water.\u003cbr>\u003cmark>Personally, I largely disagree with this view, as\u003c/mark> providing free water supply \u003cmark>brings more drawbacks than benefits\u003c/mark> for society.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：有些人认为，获取洁净水源是一项基本人权，因此所有家庭都应当享有免费自来水供应。就我个人而言，我大体不赞同这一观点，因为推行免费供水对社会而言弊大于利。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>First and foremost, one strong argument in favor of\u003c/mark> charging residents for water \u003cmark>is that\u003c/mark> water resources on Earth are limited.\u003cbr>\u003cmark>Since\u003c/mark> unlimited free water may encourage wasteful habits, \u003cmark>it can contribute to\u003c/mark> the overconsumption of fresh water.\u003cbr>\u003cmark>This is particularly true for people\u003c/mark> living in water-rich regions, \u003cmark>as\u003c/mark> they may ignore the importance of water conservation without proper restrictions.\u003cbr>\u003cmark>For example,\u003c/mark> many families would use large volumes of clean water for watering gardens or washing vehicles if they do not need to pay the bill.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：首先，支持向居民收取水费的一个有力论据是，地球上的水资源是有限的。由于无限制的免费供水会助长浪费习惯，这会加剧淡水资源过度消耗。这一点对于水资源丰富地区的居民尤为适用，因为缺少约束时，他们容易忽视节水的重要性。例如，如果无需缴纳水费，许多家庭会大量使用洁净水源浇灌花园、清洗车辆。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In addition, another strong justification for\u003c/mark> paid water supply is that running water systems require continuous investment.\u003cbr>\u003cmark>Because\u003c/mark> water pipelines, purification facilities and maintenance teams need financial support, charging fees enables local governments to keep the whole water supply system operating well.\u003cbr>\u003cmark>Instead of\u003c/mark> relying completely on public tax revenue, water fees can cover daily operational costs.\u003cbr>\u003cmark>For instance\u003c/mark>, cities can use collected water charges to upgrade old pipelines and reduce water leakage.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：此外，支持收费供水的另一个充分理由是，供水系统需要持续投入资金。由于输水管道、净水设施和维护团队都需要资金支撑，收取水费能够让地方政府保障整套供水系统平稳运转。相比于完全依靠税收，水费可以承担日常运营开销。举例来说，城市能够利用水费收入改造老旧管道，减少水资源渗漏。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>However, it is important to note the negative side of\u003c/mark> water pricing. \u003cmark>Although this approach may be beneficial to resource protection in many ways, it can also be harmful to\u003c/mark> low-income groups.\u003cbr>\u003cmark>Specifically,\u003c/mark> impoverished families may struggle to afford water bills when prices keep rising.\u003cbr>\u003cmark>One case in point is that\u003c/mark> some disadvantaged households in remote areas have to cut down daily water use to reduce living expenses.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：然而，我们需要留意收费供水存在的弊端。尽管这种做法在很多方面有利于资源保护，它同样会对低收入群体造成不利影响。具体而言，物价持续上涨时，贫困家庭可能难以承担水费。一个恰当的例子是，偏远地区部分困难家庭不得不削减日常用水量，以此降低生活开支。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In conclusion, although\u003c/mark> charging for tap water \u003cmark>does put real pressure on\u003c/mark> low-income families,\u003cbr>\u003cmark>I still believe that\u003c/mark> water supply should not be completely free for all families: a basic free allowance with charges for extra use would protect essential access, while the charge itself prevents serious water waste and maintains public water infrastructure in the long run.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总而言之，尽管自来水收费偶尔会带来一些小弊端，例如给贫困人群造成经济压力，我依旧认为不应当向所有家庭免费供水，因为从长远来看，该举措能够避免严重的水资源浪费，并且维持公共供水设施正常运转。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"一、先看题干特点，再决定怎么写"},{"level":3,"id":"h2","text":"审题偏题反例（避免硬套“利大于弊”）"},{"level":2,"id":"h3","text":"二、常见三类真题示例"},{"level":2,"id":"h4","text":"三、建议/政策类模板（适用于“是否应该做某事”）"},{"level":2,"id":"h5","text":"四、例题（政策建议类）"}],"text":"一、先看题干特点，再决定怎么写 同意与否（Agree or disagree）题干主要有三类，动笔前先判断题目属于哪一种： 题干特点 先判断什么 展开时注意什么 建议、政策类：should… 你是否支持这个具体建议 用相关的效果、可行性、公平性等理由支持立场 比较类：A 比 B 更重要 比较的对象和标准是什么 说明为什么 A 比 B 更重要，或为什么不能这样概括 绝对或最高级表述：all、nobody、the most important 这个说法在什么范围内成立 可以同意、反对或限定条件，理由必须回应这个强度 比较题不必每一段都同时写 A、B，但整篇必须真正完成比较。 看到绝对词不必自动反驳，关键是你能否支持自己的判断。 审题偏题反例（避免硬套“利大于弊”） 题目：Some people think that teachers have a greater influence on children's development than parents do. To what extent do you agree or disagree?（老师对孩子成长的影响比父母更大，多大程度上同意？） 套错写法：第一段写老师能教科学文化知识（好处 1），第二段写老师能培养纪律性（好处 2）。——问题：只论证了“老师有用”，没有完成“比父母影响更大”的比较。 正确方向：要说明相较于父母，老师在哪方面（如系统化学习、同龄社交引导）为什么影响更大；或者反过来说明父母在早期性格塑造、陪伴时长上为什么比老师影响更深远。 二、常见三类真题示例 建议、政策类：Some people think we should let children do housework. Do you agree or disagree?（有些人认为我们应当让孩子做家务。你是否同意？） 最高级类（C18-T1）：The most important aim of science should be to improve people's lives. To what extent do you agree or disagree with this statement?（科学最重要的目标应当是改善人类的生活。你在多大程度上同意或不同意？） 绝对表述类（C15-T2）：In the future, nobody will buy printed newspapers or books because they will be able to read everything they want online without paying. To what extent do you agree or disagree with this statement?（未来人们将不再购买纸质报刊书籍，因为可以在网上免费阅读一切内容。你在多大程度上同意或不同意？） 三、建议/政策类模板（适用于“是否应该做某事”） 适用范围：题干讨论某项政策或做法好不好（如“让孩子做家务”“免费供水”）。若遇到比较类或绝对词题，请调整开头表态句，围绕题干的比较关系或限定范围展开。其中第三段让步段为可选，若两段核心理由已充分，也可不写让步段。 英文模板 中文翻译 It is sometimes argued that 有些人认为…… Personally, I largely agree with this view, as sth brings more benefits than downsides for sb 就我个人而言，我大体赞同这一观点，因为对某人来说，其利大于弊。 First and foremost, one strong argument in favor of this view is that 首先，支持该观点的一个有力论据是…… Since sth, it can contribute to sth 由于某事 / 某物存在，这有助于某事。 This is particularly true for people who...as… 这一点对于…… 人群尤为适用，因为…… For example 例如 In addition, another strong justification for this idea is that 此外，支持该观点的另一个充分理由是 Because sth, it enables people to do sth 由于某事 / 某物，这使得人们能够做某事 Instead of sth, sth can do sth 相比于某事，某物能够做到某事 For instance 举例来说 （可选让步段，非所有题必写） However, it is important to note the negative side of this idea 然而，我们需要留意这个做法存在的弊端 Although this approach may be beneficial to sth in many ways 尽管这种做法在很多方面对某事 / 人群有利 it can also be harmful to 它同样会对…… 造成不利影响 Specifically, 具体而言， One case in point is that 一个恰当的例子是 In conclusion, although sth does bring sth 总而言之，尽管某事确实带来了……（如实承认代价，不要写成“偶尔”“轻微”） I still believe that sth is crucial for them to do sth, as it can do sth 我依旧认为某事对他们做某事至关重要，因为它能够……（用理由回应反方，而不是贬低反方） 四、例题（政策建议类） Access to clean water is a basic human right. Therefore every home should have a water supply that is provided free of charge. Do you agree or disagree? 获得洁净水源是一项基本人权。因此，每户家庭都应当享有免费供水。你是否同意这一观点？ It is sometimes argued that access to clean water is a fundamental human right, so all households ought to receive free tap water. Personally, I largely disagree with this view, as providing free water supply brings more drawbacks than benefits for society. 翻译：有些人认为，获取洁净水源是一项基本人权，因此所有家庭都应当享有免费自来水供应。就我个人而言，我大体不赞同这一观点，因为推行免费供水对社会而言弊大于利。 First and foremost, one strong argument in favor of charging residents for water is that water resources on Earth are limited. Since unlimited free water may encourage wasteful habits, it can contribute to the overconsumption of fresh water. This is particularly true for people living in water-rich regions, as they may ignore the importance of water conservation without proper restrictions. For example, many families would use large volumes of clean water for watering gardens or washing vehicles if they do not need to pay the bill. 翻译：首先，支持向居民收取水费的一个有力论据是，地球上的水资源是有限的。由于无限制的免费供水会助长浪费习惯，这会加剧淡水资源过度消耗。这一点对于水资源丰富地区的居民尤为适用，因为缺少约束时，他们容易忽视节水的重要性。例如，如果无需缴纳水费，许多家庭会大量使用洁净水源浇灌花园、清洗车辆。 In addition, another strong justification for paid water supply is that running water systems require continuous investment. Because water pipelines, purification facilities and maintenance teams need financial support, charging fees enables local governments to keep the whole water supply system operating well. Instead of relying completely on public tax revenue, water fees can cover daily operational costs. For instance, cities can use collected water charges to upgrade old pipelines and reduce water leakage. 翻译：此外，支持收费供水的另一个充分理由是，供水系统需要持续投入资金。由于输水管道、净水设施和维护团队都需要资金支撑，收取水费能够让地方政府保障整套供水系统平稳运转。相比于完全依靠税收，水费可以承担日常运营开销。举例来说，城市能够利用水费收入改造老旧管道，减少水资源渗漏。 However, it is important to note the negative side of water pricing. Although this approach may be beneficial to resource protection in many ways, it can also be harmful to low-income groups. Specifically, impoverished families may struggle to afford water bills when prices keep rising. One case in point is that some disadvantaged households in remote areas have to cut down daily water use to reduce living expenses. 翻译：然而，我们需要留意收费供水存在的弊端。尽管这种做法在很多方面有利于资源保护，它同样会对低收入群体造成不利影响。具体而言，物价持续上涨时，贫困家庭可能难以承担水费。一个恰当的例子是，偏远地区部分困难家庭不得不削减日常用水量，以此降低生活开支。 In conclusion, although charging for tap water does put real pressure on low-income families, I still believe that water supply should not be completely free for all families: a basic free allowance with charges for extra use would protect essential access, while the charge itself prevents serious water waste and maintains public water infrastructure in the long run. 翻译：总而言之，尽管自来水收费偶尔会带来一些小弊端，例如给贫困人群造成经济压力，我依旧认为不应当向所有家庭免费供水，因为从长远来看，该举措能够避免严重的水资源浪费，并且维持公共供水设施正常运转。"},{"id":"a-w-discuss","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-2 Discuss both views.md","title":"Discuss both views 模板","html":"\u003ch2 id=\"h1\">一、审题与结构要点\u003c/h2>\n\u003cp>双边讨论（Discuss both views and give your own opinion）要求\u003cstrong>同时讨论双方观点，并明确给出你自己的看法\u003c/strong>：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>核心任务\u003c/th>\n\u003cth>常见丢分点提醒\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>开头段\u003c/strong>\u003c/td>\n\u003ctd>改写双方观点 + \u003cstrong>直接亮明你的立场\u003c/strong>\u003c/td>\n\u003ctd>不要只写 \u003ccode>present my own opinion\u003c/code> 却不表态，考官希望在开头就能看到你的立场\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>主体段 1\u003c/strong>\u003c/td>\n\u003ctd>讨论你不那么倾向的一方（为什么有人这样想）\u003c/td>\n\u003ctd>要写出对方合理的逻辑，不能一上来就批驳，否则不算真正讨论了双方观点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>主体段 2\u003c/strong>\u003c/td>\n\u003ctd>讨论你支持的一方（为什么这一方更有道理）\u003c/td>\n\u003ctd>理由与例子要具体，可自然承接个人立场\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>结尾段\u003c/strong>\u003c/td>\n\u003ctd>总结双方 + 再次重申你的立场与核心原因\u003c/td>\n\u003ctd>注意语法：\u003cstrong>\u003ccode>that\u003c/code> 从句后面不要再加 \u003ccode>is more reasonable\u003c/code>\u003c/strong>，避免双谓语错误\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h2\">二、常用句型模板（已修正语法陷阱）\u003c/h2>\n\u003cp>Some people think public transport should be free to everyone, while many others think it would be a heavy financial burden. \u003cmark>Discuss both views and give your own opinion.\u003c/mark>\u003cbr>一部分人认为公共交通应当向所有人免费，然而另有许多人认为这会造成沉重负担。讨论双方观点并给出你自己的看法。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Opinions vary greatly on whether...\u003c/td>\n\u003ctd>关于是否应当……，人们观点不一。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some people believe that..., while others argue that...\u003c/td>\n\u003ctd>一部分人认为……，而另一部分人主张……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will examine both perspectives, and I personally side with the latter / former view.\u003c/td>\n\u003ctd>本文将讨论双方观点，我个人更倾向于后一种 / 前一种看法。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>On the one hand, those who support the former view hold the valid reason that...\u003c/td>\n\u003ctd>一方面，支持前者观点的人有合理的理由认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since..., it is beneficial for... to...\u003c/td>\n\u003ctd>由于……，这有利于…… 去……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This can help people improve their ability in...\u003c/td>\n\u003ctd>这能帮助人们提升…… 方面的能力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that...\u003c/td>\n\u003ctd>一个典型的例子是……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>On the other hand, opponents of this view claim that...\u003c/td>\n\u003ctd>另一方面，持不同看法的人认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As..., it may lead to negative consequences for...\u003c/td>\n\u003ctd>由于……，这可能会给…… 带来负面影响。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rather than solving the problem, this approach may cause issues such as...\u003c/td>\n\u003ctd>这种做法不仅无法解决问题，还可能引发…… 等问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance,...\u003c/td>\n\u003ctd>举例来说，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, there are valid arguments on both sides.\u003c/td>\n\u003ctd>总体来看，双方都存在合理的论点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>写法 A（接完整句子）\u003c/strong>：From my perspective, I am more convinced that + \u003cstrong>完整从句\u003c/strong>.\u003c/td>\n\u003ctd>在我看来，我更认同……（后接完整句子，\u003cstrong>句末不要再加 is more reasonable\u003c/strong>）。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>写法 B（接名词短语）\u003c/strong>：From my perspective, the latter / former view is more reasonable.\u003c/td>\n\u003ctd>在我看来，后一种 / 前一种观点更为合理。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is because it can not only..., but also... in the long term.\u003c/td>\n\u003ctd>这是因为从长远来看，它不仅可以……，还能够……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h3\">三、示范题目与参考习作\u003c/h2>\n\u003cp>Some people think online reading will replace printed books and newspapers in the future, while others believe printed media will always exist. Discuss both views and give your own opinion.\u003cbr>有人认为未来网络阅读会取代纸质书报，另一些人则认为纸质媒介不会消失。讨论双方观点并给出自己看法。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>Opinions vary greatly on whether\u003c/mark> traditional printed books and newspapers will be completely replaced by online reading in the future. \u003cmark>Some people believe that\u003c/mark> digital reading will dominate people&#39;s daily lives, \u003cmark>while others argue that\u003c/mark> printed publications still have irreplaceable value. \u003cmark>This essay will examine both perspectives, and I personally agree with the latter view.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：关于传统纸质书报未来是否会被网络阅读彻底取代，人们观点不一。一部分人认为数字化阅读将主导人们的日常生活，而另一部分人主张纸质读物仍有不可替代的价值。本文将讨论双方观点，我个人赞同后一种看法。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>On the one hand, those who support the former view hold the valid reason that\u003c/mark> online reading resources are more convenient and affordable for the public. \u003cmark>Since\u003c/mark> massive reading materials can be accessed anytime and anywhere on the Internet, \u003cmark>it is beneficial for\u003c/mark> ordinary people \u003cmark>to\u003c/mark> gain information at a very low cost. \u003cmark>This can greatly help\u003c/mark> readers \u003cmark>absorb\u003c/mark> new information efficiently. \u003cmark>A typical example is that\u003c/mark> numerous news articles and e-books are available online for free, which has significantly reduced people&#39;s reliance on physical books.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：一方面，支持前者观点的人有合理理由认为，网络阅读资源对大众而言更加便捷实惠。由于人们可以随时随地在网上获取海量阅读资料，这有利于普通人低成本获取信息，高效吸收新知。典型的例子是，大量新闻与电子书可在线免费阅览，大幅降低了人们对实体书的依赖。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>On the other hand, proponents of printed media claim that\u003c/mark> physical books and newspapers offer a unique reading experience and collection value. \u003cmark>As\u003c/mark> screen reading often causes eye strain and constant distractions, \u003cmark>it may lead to negative consequences for\u003c/mark> people&#39;s reading quality and concentration. \u003cmark>For instance,\u003c/mark> many online readers tend to skim quickly and get interrupted by pop-up notifications, whereas printed books encourage people to focus and think deeply.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：另一方面，支持纸质媒介的人认为，实体书报拥有独特的阅读体验与收藏价值。由于屏幕阅读容易造成视疲劳和频繁分心，这会对阅读质量和专注力带来负面影响。举例来说，许多网络读者习惯快速浏览，还容易被弹窗通知打断，而纸质书更能让人专注精读和深度思考。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>Overall, there are valid arguments on both sides.\u003c/mark> \u003cmark>From my perspective, I am more convinced that\u003c/mark> printed media will never be fully replaced by online reading. \u003cmark>This is because it can not only\u003c/mark> provide a more focused reading experience, \u003cmark>but also\u003c/mark> preserve cultural heritage in the long term.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总体而言，双方观点都有合理之处。在我看来，我更认同纸质媒介不会被网络阅读彻底取代。这是因为从长远来看，纸质读物不仅能提供更专注的阅读体验，还能更好地传承文化。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"一、审题与结构要点"},{"level":2,"id":"h2","text":"二、常用句型模板（已修正语法陷阱）"},{"level":2,"id":"h3","text":"三、示范题目与参考习作"}],"text":"一、审题与结构要点 双边讨论（Discuss both views and give your own opinion）要求同时讨论双方观点，并明确给出你自己的看法： 段落 核心任务 常见丢分点提醒 开头段 改写双方观点 + 直接亮明你的立场 不要只写 present my own opinion 却不表态，考官希望在开头就能看到你的立场 主体段 1 讨论你不那么倾向的一方（为什么有人这样想） 要写出对方合理的逻辑，不能一上来就批驳，否则不算真正讨论了双方观点 主体段 2 讨论你支持的一方（为什么这一方更有道理） 理由与例子要具体，可自然承接个人立场 结尾段 总结双方 + 再次重申你的立场与核心原因 注意语法：that 从句后面不要再加 is more reasonable，避免双谓语错误 二、常用句型模板（已修正语法陷阱） Some people think public transport should be free to everyone, while many others think it would be a heavy financial burden. Discuss both views and give your own opinion. 一部分人认为公共交通应当向所有人免费，然而另有许多人认为这会造成沉重负担。讨论双方观点并给出你自己的看法。 英文模板 中文翻译 Opinions vary greatly on whether... 关于是否应当……，人们观点不一。 Some people believe that..., while others argue that... 一部分人认为……，而另一部分人主张…… This essay will examine both perspectives, and I personally side with the latter / former view. 本文将讨论双方观点，我个人更倾向于后一种 / 前一种看法。 On the one hand, those who support the former view hold the valid reason that... 一方面，支持前者观点的人有合理的理由认为…… Since..., it is beneficial for... to... 由于……，这有利于…… 去…… This can help people improve their ability in... 这能帮助人们提升…… 方面的能力。 One case in point is that... 一个典型的例子是…… On the other hand, opponents of this view claim that... 另一方面，持不同看法的人认为…… As..., it may lead to negative consequences for... 由于……，这可能会给…… 带来负面影响。 Rather than solving the problem, this approach may cause issues such as... 这种做法不仅无法解决问题，还可能引发…… 等问题。 For instance,... 举例来说，…… Overall, there are valid arguments on both sides. 总体来看，双方都存在合理的论点。 写法 A（接完整句子）：From my perspective, I am more convinced that + 完整从句. 在我看来，我更认同……（后接完整句子，句末不要再加 is more reasonable）。 写法 B（接名词短语）：From my perspective, the latter / former view is more reasonable. 在我看来，后一种 / 前一种观点更为合理。 This is because it can not only..., but also... in the long term. 这是因为从长远来看，它不仅可以……，还能够…… 三、示范题目与参考习作 Some people think online reading will replace printed books and newspapers in the future, while others believe printed media will always exist. Discuss both views and give your own opinion. 有人认为未来网络阅读会取代纸质书报，另一些人则认为纸质媒介不会消失。讨论双方观点并给出自己看法。 Opinions vary greatly on whether traditional printed books and newspapers will be completely replaced by online reading in the future. Some people believe that digital reading will dominate people's daily lives, while others argue that printed publications still have irreplaceable value. This essay will examine both perspectives, and I personally agree with the latter view. 翻译：关于传统纸质书报未来是否会被网络阅读彻底取代，人们观点不一。一部分人认为数字化阅读将主导人们的日常生活，而另一部分人主张纸质读物仍有不可替代的价值。本文将讨论双方观点，我个人赞同后一种看法。 On the one hand, those who support the former view hold the valid reason that online reading resources are more convenient and affordable for the public. Since massive reading materials can be accessed anytime and anywhere on the Internet, it is beneficial for ordinary people to gain information at a very low cost. This can greatly help readers absorb new information efficiently. A typical example is that numerous news articles and e-books are available online for free, which has significantly reduced people's reliance on physical books. 翻译：一方面，支持前者观点的人有合理理由认为，网络阅读资源对大众而言更加便捷实惠。由于人们可以随时随地在网上获取海量阅读资料，这有利于普通人低成本获取信息，高效吸收新知。典型的例子是，大量新闻与电子书可在线免费阅览，大幅降低了人们对实体书的依赖。 On the other hand, proponents of printed media claim that physical books and newspapers offer a unique reading experience and collection value. As screen reading often causes eye strain and constant distractions, it may lead to negative consequences for people's reading quality and concentration. For instance, many online readers tend to skim quickly and get interrupted by pop-up notifications, whereas printed books encourage people to focus and think deeply. 翻译：另一方面，支持纸质媒介的人认为，实体书报拥有独特的阅读体验与收藏价值。由于屏幕阅读容易造成视疲劳和频繁分心，这会对阅读质量和专注力带来负面影响。举例来说，许多网络读者习惯快速浏览，还容易被弹窗通知打断，而纸质书更能让人专注精读和深度思考。 Overall, there are valid arguments on both sides. From my perspective, I am more convinced that printed media will never be fully replaced by online reading. This is because it can not only provide a more focused reading experience, but also preserve cultural heritage in the long term. 翻译：总体而言，双方观点都有合理之处。在我看来，我更认同纸质媒介不会被网络阅读彻底取代。这是因为从长远来看，纸质读物不仅能提供更专注的阅读体验，还能更好地传承文化。"},{"id":"a-w-posneg","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-4 Positive & Negative.md","title":"Positive & Negative 模板","html":"\u003ch2 id=\"h1\">一、审题与结构要点\u003c/h2>\n\u003cp>积极还是消极（Is this a positive or negative development?）考察你对\u003cstrong>某种社会趋势或现象\u003c/strong>的价值判断：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>审题检查项\u003c/th>\n\u003cth>注意事项与示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. 看清受影响的对象\u003c/strong>\u003c/td>\n\u003ctd>注意题干问的是对\u003cstrong>个人（individuals）\u003c/strong>、**家庭（families）\u003cstrong>还是\u003c/strong>社会（society）**的影响。例如真题：\u003cem>Newspapers have a huge influence on young people&#39;s lives. Is it a positive or negative effect on society?\u003c/em> 既要谈对年轻人的影响，也要扣住对社会的整体影响。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. 立场要鲜明\u003c/strong>\u003c/td>\n\u003ctd>可以写“整体积极（利大于弊）”或“整体消极（弊大于利）”，开头直接给出判断。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. 让步段为可选\u003c/strong>\u003c/td>\n\u003ctd>下方模板的“2 个正面理由 + 1 个负面让步”结构很稳妥，但第三段让步段并非强制；如果两段同向理由已经展开得很充分，写四段（开头 + 两段主体 + 结尾）完全可以。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h2\">二、常用句型模板\u003c/h2>\n\u003cp>Nowadays, many young people choose to study abroad. \u003cmark>Is this a positive or negative development?\u003c/mark>\u003cbr>现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is widely observed that...\u003c/td>\n\u003ctd>如今人们普遍注意到……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>From my perspective, this trend is a largely positive development, as it brings more advantages than disadvantages for...\u003c/td>\n\u003ctd>在我看来，这一趋势整体上是积极的发展，因为它对……而言利大于弊。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First and foremost, the most obvious benefit of this phenomenon is that...\u003c/td>\n\u003ctd>首先，这一现象最显著的好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since..., it can contribute to...\u003c/td>\n\u003ctd>由于……，这有助于……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for people who..., as...\u003c/td>\n\u003ctd>这一点对于…… 人群尤为适用，因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example,...\u003c/td>\n\u003ctd>例如，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In addition, another positive effect of this trend is that...\u003c/td>\n\u003ctd>此外，这一趋势的另一项积极影响是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because..., it enables people to...\u003c/td>\n\u003ctd>由于……，这使得人们能够……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of..., people can...\u003c/td>\n\u003ctd>相比于……，人们能够……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance,...\u003c/td>\n\u003ctd>举例来说，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>（可选让步段）\u003c/strong>\u003cbr>However, we should not ignore the potential downsides of this trend.\u003c/td>\n\u003ctd>然而，我们也不应忽视这一趋势潜在的消极面。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Although this phenomenon may be beneficial to... in many ways, it can also bring challenges to...\u003c/td>\n\u003ctd>尽管这一现象在很多方面对……有利，它也会给……带来挑战。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Specifically,...\u003c/td>\n\u003ctd>具体而言，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that...\u003c/td>\n\u003ctd>一个恰当的例子是……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although this trend does bring drawbacks such as ...,\u003c/td>\n\u003ctd>总而言之，尽管这一趋势\u003cstrong>确实\u003c/strong>带来了……（如实承认，不写“偶尔”“轻微”）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I still believe that it is an overall positive development, as it can ...\u003c/td>\n\u003ctd>我依旧认为这整体上是积极的发展趋势，因为它能够……（用理由说明为什么利更大）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h3\">三、例题与参考习作\u003c/h2>\n\u003cp>Nowadays, many young people choose to study abroad. Is this a positive or negative development?\u003cbr>现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>It is widely observed that\u003c/mark> an increasing number of young people choose to pursue further education in foreign countries. \u003cmark>From my perspective, this trend brings more advantages than disadvantages\u003c/mark> for young students.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：如今人们普遍注意到，越来越多的年轻人选择出国深造。在我看来，这一趋势对青年学生而言利大于弊。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>First and foremost, the most obvious benefit of this phenomenon is that\u003c/mark> studying abroad helps students improve their academic ability and career competitiveness. \u003cmark>Since\u003c/mark> many overseas universities have advanced teaching resources and research platforms, \u003cmark>it can contribute to\u003c/mark> students&#39; professional development in their fields. \u003cmark>This is particularly true for students\u003c/mark> who major in science and engineering, \u003cmark>as\u003c/mark> they can gain access to cutting-edge technology and experienced scholars. \u003cmark>For example,\u003c/mark> many engineering graduates return with stronger research skills after studying abroad, which makes them competitive in the job market.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：首先，这一现象最显著的好处是，出国留学有助于学生提升学术能力与就业竞争力。由于许多海外高校拥有先进的教学资源与科研平台，这能够助力学生在自身领域获得专业成长。这一点对于理工科学生尤为适用，因为他们可以接触前沿技术与资深学者。例如，许多工科留学生毕业后科研能力显著提升，在就业市场上很有竞争力。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In addition, another positive effect of this trend is that\u003c/mark> overseas study cultivates students&#39; independence and broadens their horizons. \u003cmark>Because\u003c/mark> students have to handle daily life and academic problems alone in a foreign country, \u003cmark>it enables them to\u003c/mark> develop better problem-solving and cross-cultural communication skills. \u003cmark>Instead of\u003c/mark> staying in a familiar environment and relying on their parents, young people can experience diverse cultures and lifestyles. \u003cmark>For instance,\u003c/mark> students living abroad often learn to manage their budget, arrange schedules, and deal with cultural differences independently.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：此外，这一趋势的另一项积极影响是，留学会培养学生的独立性、拓宽其视野。由于学生在异国必须独自处理生活与学业问题，这能够锻炼他们解决问题与跨文化沟通的能力。相比于待在熟悉的环境里依赖父母，年轻人可以体验多元的文化与生活方式。举例来说，在海外生活的学生通常能学会独立管理开支、规划时间、应对文化差异。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>However, we should not ignore the potential downsides of this trend.\u003c/mark> \u003cmark>Although this phenomenon may be beneficial to\u003c/mark> students&#39; long-term development \u003cmark>in many ways, it can also bring challenges to\u003c/mark> their mental well-being and family finances. \u003cmark>Specifically,\u003c/mark> many young students suffer from loneliness and \u003cstrong>culture shock\u003c/strong> when they first arrive in a foreign country. \u003cmark>One case in point is that\u003c/mark> some students struggle to adapt to the new teaching style and living environment, which leads to anxiety and poor academic performance.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：然而，我们也不应忽视这一趋势潜在的消极面。尽管该现象在很多方面有利于学生的长远发展，它也会给学生的心理健康与家庭经济带来挑战。具体而言，很多年轻学生初到异国时会感到孤独、遭遇文化冲击。一个恰当的例子是，部分学生难以适应全新的教学模式与生活环境，进而产生焦虑情绪、学业表现下滑。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In conclusion, although this trend does bring real drawbacks such as\u003c/mark> financial pressure and adaptation difficulties, \u003cmark>I still believe that it is an overall positive development, as it can\u003c/mark> broaden young people&#39;s horizons and enhance their future career prospects.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总而言之，尽管这一趋势确实带来了经济压力与适应困难等现实问题，我依旧认为这整体是积极的发展趋势，因为它能够拓宽年轻人的眼界并提升未来的职业前景。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"一、审题与结构要点"},{"level":2,"id":"h2","text":"二、常用句型模板"},{"level":2,"id":"h3","text":"三、例题与参考习作"}],"text":"一、审题与结构要点 积极还是消极（Is this a positive or negative development?）考察你对某种社会趋势或现象的价值判断： 审题检查项 注意事项与示例 1. 看清受影响的对象 注意题干问的是对个人（individuals）、**家庭（families）还是社会（society）**的影响。例如真题：Newspapers have a huge influence on young people's lives. Is it a positive or negative effect on society? 既要谈对年轻人的影响，也要扣住对社会的整体影响。 2. 立场要鲜明 可以写“整体积极（利大于弊）”或“整体消极（弊大于利）”，开头直接给出判断。 3. 让步段为可选 下方模板的“2 个正面理由 + 1 个负面让步”结构很稳妥，但第三段让步段并非强制；如果两段同向理由已经展开得很充分，写四段（开头 + 两段主体 + 结尾）完全可以。 二、常用句型模板 Nowadays, many young people choose to study abroad. Is this a positive or negative development? 现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？ 英文模板 中文翻译 It is widely observed that... 如今人们普遍注意到…… From my perspective, this trend is a largely positive development, as it brings more advantages than disadvantages for... 在我看来，这一趋势整体上是积极的发展，因为它对……而言利大于弊。 First and foremost, the most obvious benefit of this phenomenon is that... 首先，这一现象最显著的好处是…… Since..., it can contribute to... 由于……，这有助于…… This is particularly true for people who..., as... 这一点对于…… 人群尤为适用，因为…… For example,... 例如，…… In addition, another positive effect of this trend is that... 此外，这一趋势的另一项积极影响是…… Because..., it enables people to... 由于……，这使得人们能够…… Instead of..., people can... 相比于……，人们能够…… For instance,... 举例来说，…… （可选让步段） However, we should not ignore the potential downsides of this trend. 然而，我们也不应忽视这一趋势潜在的消极面。 Although this phenomenon may be beneficial to... in many ways, it can also bring challenges to... 尽管这一现象在很多方面对……有利，它也会给……带来挑战。 Specifically,... 具体而言，…… One case in point is that... 一个恰当的例子是…… In conclusion, although this trend does bring drawbacks such as ..., 总而言之，尽管这一趋势确实带来了……（如实承认，不写“偶尔”“轻微”） I still believe that it is an overall positive development, as it can ... 我依旧认为这整体上是积极的发展趋势，因为它能够……（用理由说明为什么利更大） 三、例题与参考习作 Nowadays, many young people choose to study abroad. Is this a positive or negative development? 现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？ It is widely observed that an increasing number of young people choose to pursue further education in foreign countries. From my perspective, this trend brings more advantages than disadvantages for young students. 翻译：如今人们普遍注意到，越来越多的年轻人选择出国深造。在我看来，这一趋势对青年学生而言利大于弊。 First and foremost, the most obvious benefit of this phenomenon is that studying abroad helps students improve their academic ability and career competitiveness. Since many overseas universities have advanced teaching resources and research platforms, it can contribute to students' professional development in their fields. This is particularly true for students who major in science and engineering, as they can gain access to cutting-edge technology and experienced scholars. For example, many engineering graduates return with stronger research skills after studying abroad, which makes them competitive in the job market. 翻译：首先，这一现象最显著的好处是，出国留学有助于学生提升学术能力与就业竞争力。由于许多海外高校拥有先进的教学资源与科研平台，这能够助力学生在自身领域获得专业成长。这一点对于理工科学生尤为适用，因为他们可以接触前沿技术与资深学者。例如，许多工科留学生毕业后科研能力显著提升，在就业市场上很有竞争力。 In addition, another positive effect of this trend is that overseas study cultivates students' independence and broadens their horizons. Because students have to handle daily life and academic problems alone in a foreign country, it enables them to develop better problem-solving and cross-cultural communication skills. Instead of staying in a familiar environment and relying on their parents, young people can experience diverse cultures and lifestyles. For instance, students living abroad often learn to manage their budget, arrange schedules, and deal with cultural differences independently. 翻译：此外，这一趋势的另一项积极影响是，留学会培养学生的独立性、拓宽其视野。由于学生在异国必须独自处理生活与学业问题，这能够锻炼他们解决问题与跨文化沟通的能力。相比于待在熟悉的环境里依赖父母，年轻人可以体验多元的文化与生活方式。举例来说，在海外生活的学生通常能学会独立管理开支、规划时间、应对文化差异。 However, we should not ignore the potential downsides of this trend. Although this phenomenon may be beneficial to students' long-term development in many ways, it can also bring challenges to their mental well-being and family finances. Specifically, many young students suffer from loneliness and culture shock when they first arrive in a foreign country. One case in point is that some students struggle to adapt to the new teaching style and living environment, which leads to anxiety and poor academic performance. 翻译：然而，我们也不应忽视这一趋势潜在的消极面。尽管该现象在很多方面有利于学生的长远发展，它也会给学生的心理健康与家庭经济带来挑战。具体而言，很多年轻学生初到异国时会感到孤独、遭遇文化冲击。一个恰当的例子是，部分学生难以适应全新的教学模式与生活环境，进而产生焦虑情绪、学业表现下滑。 In conclusion, although this trend does bring real drawbacks such as financial pressure and adaptation difficulties, I still believe that it is an overall positive development, as it can broaden young people's horizons and enhance their future career prospects. 翻译：总而言之，尽管这一趋势确实带来了经济压力与适应困难等现实问题，我依旧认为这整体是积极的发展趋势，因为它能够拓宽年轻人的眼界并提升未来的职业前景。"},{"id":"a-w-ai","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/ai.md","title":"AI 批改提示词","html":"\u003ch2 id=\"h1\">一、AI 批改提示词（先看内容，再改语言）\u003c/h2>\n\u003ch3 id=\"h2\">大作文（Task 2）批改指令\u003c/h3>\n\u003cblockquote>\n\u003cp>你是一名雅思作文批改老师。下面是一道雅思大作文（Task 2）的题目和我的作文，请按以下步骤批改：\u003c/p>\n\u003col>\n\u003cli>先检查是否回应题干中的全部要求，是否存在对象、比较关系或限定词理解错误，以及套用模板造成的偏题和逻辑问题。\u003c/li>\n\u003cli>如有影响任务回应（Task Response）的问题，先指出原句、说明原因，并给出必要的结构调整。\u003c/li>\n\u003cli>再逐句修改语法、搭配和表达（修改过的部分加粗），保留有效的原意与句型，避免不必要的复杂词汇。\u003c/li>\n\u003cli>最后按四项评分标准（Task Response、Coherence and Cohesion、Lexical Resource、Grammatical Range and Accuracy）分别估分、说明依据与不确定性，再列出最值得我自己重写的三处。\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003ch3 id=\"h3\">小作文（Task 1）批改指令\u003c/h3>\n\u003cblockquote>\n\u003cp>你是一名雅思作文批改老师。下面是一道雅思学术类小作文（Task 1）的题目、图表数据和我的作文，请按以下步骤批改：\u003c/p>\n\u003col>\n\u003cli>先检查是否回应题干中的全部要求（概述是否抓住主要特征、数据对比与趋势描述是否准确），是否存在对象、比较关系或单位/时态理解错误，以及套用模板造成的逻辑问题。\u003c/li>\n\u003cli>如有影响任务完成度（Task Achievement）的问题，先指出原句、说明原因，并给出必要的结构调整。\u003c/li>\n\u003cli>再逐句修改语法、搭配和表达（修改过的部分加粗），保留有效的原意与句型，避免不必要的复杂词汇。\u003c/li>\n\u003cli>最后按四项评分标准（Task Achievement、Coherence and Cohesion、Lexical Resource、Grammatical Range and Accuracy）分别估分、说明依据与不确定性，再列出最值得我自己重写的三处。\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h4\">二、小作文常用对比与趋势短语\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类别\u003c/th>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>对比\u003c/td>\n\u003ctd>\u003cmark>by contrast\u003c/mark>\u003c/td>\n\u003ctd>作为对比\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cmark>the pattern is reversed\u003c/mark>\u003c/td>\n\u003ctd>趋势完全相反\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>roughly the same across both groups\u003c/td>\n\u003ctd>两组数据大致持平\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>preference differ significantly between\u003c/td>\n\u003ctd>两个群体的偏好存在显著差异\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cbr>\u003cbr>\u003c/td>\n\u003ctd>making them the most common choice\u003c/td>\n\u003ctd>这使得它们成为最普遍的选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cmark>is twice as large as that\u003c/mark> of\u003c/td>\n\u003ctd>…… 是…… 的两倍\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上升趋势\u003c/td>\n\u003ctd>rise overall over the 10-year period\u003c/td>\n\u003ctd>在这十年间整体呈上升趋势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>the period saw a steady overall increase\u003c/td>\n\u003ctd>这段时期整体呈现稳定上升态势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>witness an upward trend\u003c/td>\n\u003ctd>呈现上升趋势\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>波动\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>Despite some small fluctuations\u003c/td>\n\u003ctd>尽管存在小幅波动\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分类\u003c/td>\n\u003ctd>broken down by category\u003c/td>\n\u003ctd>按类别细分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>all remaining categories\u003c/td>\n\u003ctd>其余所有类别\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>题型名称\u003c/th>\n\u003cth>英文名称\u003c/th>\n\u003cth>近年出题概率\u003c/th>\n\u003cth>题干典型问法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2-1\u003c/td>\n\u003ctd>同意与否类\u003c/td>\n\u003ctd>Agree or disagree（To what extent do you agree or disagree）\u003c/td>\n\u003ctd>30%～35%\u003c/td>\n\u003ctd>To what extent do you agree or disagree?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-2\u003c/td>\n\u003ctd>双边讨论类\u003c/td>\n\u003ctd>Discuss both views\u003c/td>\n\u003ctd>28%～33%\u003c/td>\n\u003ctd>Discuss both views and give your own opinion\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-4\u003c/td>\n\u003ctd>利弊类\u003c/td>\n\u003ctd>Positive &amp; Negative / Advantages &amp; Disadvantages\u003c/td>\n\u003ctd>15%～20%\u003c/td>\n\u003ctd>What are the advantages and disadvantages? / Do the advantages outweigh disadvantages?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-3\u003c/td>\n\u003ctd>原因解决类\u003c/td>\n\u003ctd>Reasons &amp; Solutions（报告类）\u003c/td>\n\u003ctd>10%～15%\u003c/td>\n\u003ctd>What are the causes? What solutions can you suggest?\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分类\u003c/th>\n\u003cth>题型\u003c/th>\n\u003cth>英文名称\u003c/th>\n\u003cth>2024–2025 出题占比\u003c/th>\n\u003cth>核心考察要点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>数据类图表（合计≈82%）\u003c/strong>\u003c/td>\n\u003ctd>柱状图\u003c/td>\n\u003ctd>Bar chart\u003c/td>\n\u003ctd>33%\u003c/td>\n\u003ctd>动态趋势 / 静态数据对比，最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>折线图\u003c/td>\n\u003ctd>Line graph\u003c/td>\n\u003ctd>23%\u003c/td>\n\u003ctd>时间变化、趋势描述（上升 / 下降 / 波动）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>表格图\u003c/td>\n\u003ctd>Table\u003c/td>\n\u003ctd>10%\u003c/td>\n\u003ctd>多组数据分类对比，容易堆砌数字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>饼状图\u003c/td>\n\u003ctd>Pie chart\u003c/td>\n\u003ctd>3%\u003c/td>\n\u003ctd>占比、份额；极少单独出题，常出现在组合图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>混合组合图\u003c/td>\n\u003ctd>Mixed charts\u003c/td>\n\u003ctd>13%\u003c/td>\n\u003ctd>两种图表搭配（柱 + 饼、线 + 表格等）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>非数据示意图（合计≈18%）\u003c/strong>\u003c/td>\n\u003ctd>地图题\u003c/td>\n\u003ctd>Map\u003c/td>\n\u003ctd>10%\u003c/td>\n\u003ctd>地点变迁、方位布局、设施增减\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>流程图\u003c/td>\n\u003ctd>Process diagram\u003c/td>\n\u003ctd>8%\u003c/td>\n\u003ctd>工序、循环流程，被动语态 + 顺序连接词\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"一、AI 批改提示词（先看内容，再改语言）"},{"level":3,"id":"h2","text":"大作文（Task 2）批改指令"},{"level":3,"id":"h3","text":"小作文（Task 1）批改指令"},{"level":2,"id":"h4","text":"二、小作文常用对比与趋势短语"}],"text":"一、AI 批改提示词（先看内容，再改语言） 大作文（Task 2）批改指令 你是一名雅思作文批改老师。下面是一道雅思大作文（Task 2）的题目和我的作文，请按以下步骤批改： 先检查是否回应题干中的全部要求，是否存在对象、比较关系或限定词理解错误，以及套用模板造成的偏题和逻辑问题。 如有影响任务回应（Task Response）的问题，先指出原句、说明原因，并给出必要的结构调整。 再逐句修改语法、搭配和表达（修改过的部分加粗），保留有效的原意与句型，避免不必要的复杂词汇。 最后按四项评分标准（Task Response、Coherence and Cohesion、Lexical Resource、Grammatical Range and Accuracy）分别估分、说明依据与不确定性，再列出最值得我自己重写的三处。 小作文（Task 1）批改指令 你是一名雅思作文批改老师。下面是一道雅思学术类小作文（Task 1）的题目、图表数据和我的作文，请按以下步骤批改： 先检查是否回应题干中的全部要求（概述是否抓住主要特征、数据对比与趋势描述是否准确），是否存在对象、比较关系或单位/时态理解错误，以及套用模板造成的逻辑问题。 如有影响任务完成度（Task Achievement）的问题，先指出原句、说明原因，并给出必要的结构调整。 再逐句修改语法、搭配和表达（修改过的部分加粗），保留有效的原意与句型，避免不必要的复杂词汇。 最后按四项评分标准（Task Achievement、Coherence and Cohesion、Lexical Resource、Grammatical Range and Accuracy）分别估分、说明依据与不确定性，再列出最值得我自己重写的三处。 二、小作文常用对比与趋势短语 类别 英文短语 中文含义 对比 by contrast 作为对比 the pattern is reversed 趋势完全相反 roughly the same across both groups 两组数据大致持平 preference differ significantly between 两个群体的偏好存在显著差异 making them the most common choice 这使得它们成为最普遍的选择 is twice as large as that of …… 是…… 的两倍 上升趋势 rise overall over the 10-year period 在这十年间整体呈上升趋势 the period saw a steady overall increase 这段时期整体呈现稳定上升态势 witness an upward trend 呈现上升趋势 波动 Despite some small fluctuations 尽管存在小幅波动 分类 broken down by category 按类别细分 all remaining categories 其余所有类别 编号 题型名称 英文名称 近年出题概率 题干典型问法 2-1 同意与否类 Agree or disagree（To what extent do you agree or disagree） 30%～35% To what extent do you agree or disagree? 2-2 双边讨论类 Discuss both views 28%～33% Discuss both views and give your own opinion 2-4 利弊类 Positive & Negative / Advantages & Disadvantages 15%～20% What are the advantages and disadvantages? / Do the advantages outweigh disadvantages? 2-3 原因解决类 Reasons & Solutions（报告类） 10%～15% What are the causes? What solutions can you suggest? 分类 题型 英文名称 2024–2025 出题占比 核心考察要点 数据类图表（合计≈82%） 柱状图 Bar chart 33% 动态趋势 / 静态数据对比，最高频 折线图 Line graph 23% 时间变化、趋势描述（上升 / 下降 / 波动） 表格图 Table 10% 多组数据分类对比，容易堆砌数字 饼状图 Pie chart 3% 占比、份额；极少单独出题，常出现在组合图 混合组合图 Mixed charts 13% 两种图表搭配（柱 + 饼、线 + 表格等） 非数据示意图（合计≈18%） 地图题 Map 10% 地点变迁、方位布局、设施增减 流程图 Process diagram 8% 工序、循环流程，被动语态 + 顺序连接词"},{"id":"s-t1-overview","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/0-小作文总览.md","title":"0 小作文总览：题型速查","html":"\u003ch2 id=\"h1\">基本要求\u003c/h2>\n\u003cul>\n\u003cli>至少 150 词，建议 20 分钟以内写完，留出 40 分钟给大作文。\u003c/li>\n\u003cli>只描述图里有的信息，不写原因，不写个人观点。\u003c/li>\n\u003cli>必须有概述段（Overview）。没有概述，Task Achievement 很难过 5 分。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">通用四段结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：图表类型 + 内容 + 地点 + 时间\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>最明显的 2 个特征，不写具体数字\u003c/td>\n\u003ctd>2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组数据：最高、最低、起点、终点、转折\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二组数据，并和第一组对比\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">七种图怎么认、怎么写\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题型\u003c/th>\n\u003cth>怎么认\u003c/th>\n\u003cth>概述写什么\u003c/th>\n\u003cth>细节怎么分段\u003c/th>\n\u003cth>时态\u003c/th>\n\u003cth>模板\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u0
