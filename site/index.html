003ctd>下降\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>波动\u003c/td>\n\u003ctd>fluctuate / go up and down\u003c/td>\n\u003ctd>fluctuations\u003c/td>\n\u003ctd>波动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保持平稳\u003c/td>\n\u003ctd>remain stable / level off / stay constant\u003c/td>\n\u003ctd>stability\u003c/td>\n\u003ctd>保持稳定、趋于平稳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>达到峰值\u003c/td>\n\u003ctd>peak (peaked) / reach a peak\u003c/td>\n\u003ctd>a peak\u003c/td>\n\u003ctd>达到顶点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跌到谷底\u003c/td>\n\u003ctd>hit a low / bottom out\u003c/td>\n\u003ctd>a low / the bottom\u003c/td>\n\u003ctd>跌至最低点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超过\u003c/td>\n\u003ctd>overtake / surpass\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>超过\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>表示幅度的副词（sharply、steadily、gradually、slightly 等）可以参考原作者的 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h6\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X rose from A in 2000 to B in 2010.\u003c/td>\n\u003ctd>X 从 2000 年的 A 上升到 2010 年的 B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X peaked at B in 2010 before falling to C by 2020.\u003c/td>\n\u003ctd>X 在 2010 年达到峰值 B，之后下降到 2020 年的 C。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The figure for X stood at A in 2000 and reached B by 2020.\u003c/td>\n\u003ctd>X 在 2000 年为 A，到 2020 年达到 B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X remained stable at around A between 2005 and 2015.\u003c/td>\n\u003ctd>2005 至 2015 年间，X 基本稳定在 A 左右。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X overtook Y in 2008 and continued to grow.\u003c/td>\n\u003ctd>X 在 2008 年超过 Y，并持续增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The gap between X and Y narrowed over the period.\u003c/td>\n\u003ctd>这段时间内，X 和 Y 的差距缩小了。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟数据）\u003c/h2>\n\u003cp>The number of visitors to the museum rose from about 2 million in 2000 to a peak of 5 million in 2010. After that, it fell back to around 4 million by 2020.\u003cbr>\u003cstrong>译\u003c/strong>：博物馆的参观人数从 2000 年的约 200 万增长到 2010 年 500 万的峰值，之后回落到 2020 年的约 400 万。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>写清楚起点、峰值、谷底和终点，不必逐年复述所有数据。\u003c/li>\n\u003cli>描述过去的数据用一般过去时。\u003c/li>\n\u003cli>数字前可以加 about、roughly、nearly、just over 等词，避免每个数字都机械地写准确值。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"趋势词汇"},{"level":2,"id":"h6","text":"句型模板"},{"level":2,"id":"h7","text":"示例（自拟数据）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 横轴通常是时间（年份、月份），纵轴是数值（人数、金额、比例）。一般有 1–4 条线。题干常见 The line graph shows… 或 The graph compares… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明图表内容和时间段 1–2 句 概述 写整体趋势（谁上升、谁下降、谁波动），不写具体数字 2–3 句 细节 1 第一条线：起点、峰值、谷底、终点 4–5 句 细节 2 第二条线（或其他线）的变化，并与第一条线对比 4–5 句 开头模板 英文 中文 The line graph illustrates how … changed between … and … 折线图展示了……在……到……之间的变化 The graph compares the trends in … over a period of … years. 该图比较了……在……年间的变化趋势。 概述模板 英文 中文 Overall, … showed an upward trend, while … declined. 总体来看，……呈上升趋势，而……下降了。 Overall, … fluctuated over the period, but ended higher than it started. 总体来看，……有波动，但最终高于起点。 The most striking feature is that … overtook … in … 最突出的特征是……在……年超过了…… 趋势词汇 趋势 动词（过去式） 名词 中文 上升 rise (rose) / increase (increased) / grow (grew) a rise / an increase / growth 上升、增长 下降 fall (fell) / decrease / decline / drop a fall / a decrease / a decline 下降 波动 fluctuate / go up and down fluctuations 波动 保持平稳 remain stable / level off / stay constant stability 保持稳定、趋于平稳 达到峰值 peak (peaked) / reach a peak a peak 达到顶点 跌到谷底 hit a low / bottom out a low / the bottom 跌至最低点 超过 overtake / surpass — 超过 表示幅度的副词（sharply、steadily、gradually、slightly 等）可以参考原作者的 小作文通识积累。 句型模板 英文 中文 X rose from A in 2000 to B in 2010. X 从 2000 年的 A 上升到 2010 年的 B。 X peaked at B in 2010 before falling to C by 2020. X 在 2010 年达到峰值 B，之后下降到 2020 年的 C。 The figure for X stood at A in 2000 and reached B by 2020. X 在 2000 年为 A，到 2020 年达到 B。 X remained stable at around A between 2005 and 2015. 2005 至 2015 年间，X 基本稳定在 A 左右。 X overtook Y in 2008 and continued to grow. X 在 2008 年超过 Y，并持续增长。 The gap between X and Y narrowed over the period. 这段时间内，X 和 Y 的差距缩小了。 示例（自拟数据） The number of visitors to the museum rose from about 2 million in 2000 to a peak of 5 million in 2010. After that, it fell back to around 4 million by 2020. 译：博物馆的参观人数从 2000 年的约 200 万增长到 2010 年 500 万的峰值，之后回落到 2020 年的约 400 万。 注意 写清楚起点、峰值、谷底和终点，不必逐年复述所有数据。 描述过去的数据用一般过去时。 数字前可以加 about、roughly、nearly、just over 等词，避免每个数字都机械地写准确值。"},{"id":"s-t1-bar","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-5 柱状图.md","title":"1-5 柱状图（Bar chart）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>用柱子的高矮或长短，比较不同类别（如不同国家、职业、年龄段）的数据，或者比较同一类别在不同年份的数据。题干常见 \u003cem>The bar chart shows…\u003c/em> 或 \u003cem>The chart compares…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明比较的对象和时间\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写最高、最低、最大差异，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组数据（或前几个类别）的关键数字\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>其余数据，并和前一组对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The bar chart compares … across …\u003c/td>\n\u003ctd>柱状图比较了……在…… 方面的情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The bar chart shows the number of … in … between … and …\u003c/td>\n\u003ctd>柱状图展示了……在……到……年间的数量\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … was the most popular … in all … years, while … was the least popular.\u003c/td>\n\u003ctd>总体来看，……在所有年份都是最受欢迎的，而……最不受欢迎。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant difference is between … and ….\u003c/td>\n\u003ctd>最显著的差异在……和……之间。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">比较句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A was the most / least popular option, accounting for …\u003c/td>\n\u003ctd>A 是最受欢迎 / 最不受欢迎的选项，占……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A was nearly / roughly twice as high as B.\u003c/td>\n\u003ctd>A 大约是 B 的两倍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A outnumbered B by …\u003c/td>\n\u003ctd>A 比 B 多……（人 / 个）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A ranked first, followed by B and C.\u003c/td>\n\u003ctd>A 排第一，其次是 B 和 C。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The gap between A and B widened / narrowed.\u003c/td>\n\u003ctd>A 和 B 的差距扩大 / 缩小了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, B … / By comparison, C …\u003c/td>\n\u003ctd>相比之下，B…… / 与之相比，C……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Both A and B …\u003c/td>\n\u003ctd>A 和 B 都……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">倍数与分数表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>twice as many / twice the number of\u003c/td>\n\u003ctd>两倍（多）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>three times as many\u003c/td>\n\u003ctd>三倍（多）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>half / a third / a quarter (of)\u003c/td>\n\u003ctd>一半 / 三分之一 / 四分之一\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the number of students who chose science was the highest in all three years, whereas arts was consistently the least popular subject.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，三年中选择理科的学生人数始终最多，而选择文科的一直最少。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>柱状图的数据通常较多，挑最高、最低、变化最大、最有对比性的写，不必全部列出。\u003c/li>\n\u003cli>多组数据时，先写整体趋势，再按组别展开。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"比较句型"},{"level":2,"id":"h6","text":"倍数与分数表达"},{"level":2,"id":"h7","text":"示例（自拟数据）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 用柱子的高矮或长短，比较不同类别（如不同国家、职业、年龄段）的数据，或者比较同一类别在不同年份的数据。题干常见 The bar chart shows… 或 The chart compares… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明比较的对象和时间 1–2 句 概述 写最高、最低、最大差异，不写具体数字 2–3 句 细节 1 第一组数据（或前几个类别）的关键数字 4–5 句 细节 2 其余数据，并和前一组对比 4–5 句 开头模板 英文 中文 The bar chart compares … across … 柱状图比较了……在…… 方面的情况 The bar chart shows the number of … in … between … and … 柱状图展示了……在……到……年间的数量 概述模板 英文 中文 Overall, … was the most popular … in all … years, while … was the least popular. 总体来看，……在所有年份都是最受欢迎的，而……最不受欢迎。 The most significant difference is between … and …. 最显著的差异在……和……之间。 比较句型 英文 中文 A was the most / least popular option, accounting for … A 是最受欢迎 / 最不受欢迎的选项，占…… A was nearly / roughly twice as high as B. A 大约是 B 的两倍。 A outnumbered B by … A 比 B 多……（人 / 个） A ranked first, followed by B and C. A 排第一，其次是 B 和 C。 The gap between A and B widened / narrowed. A 和 B 的差距扩大 / 缩小了。 In contrast, B … / By comparison, C … 相比之下，B…… / 与之相比，C…… Both A and B … A 和 B 都…… 倍数与分数表达 英文 中文 twice as many / twice the number of 两倍（多） three times as many 三倍（多） half / a third / a quarter (of) 一半 / 三分之一 / 四分之一 示例（自拟数据） Overall, the number of students who chose science was the highest in all three years, whereas arts was consistently the least popular subject. 译：总体来看，三年中选择理科的学生人数始终最多，而选择文科的一直最少。 注意 柱状图的数据通常较多，挑最高、最低、变化最大、最有对比性的写，不必全部列出。 多组数据时，先写整体趋势，再按组别展开。"},{"id":"s-t1-pie","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-6 饼图.md","title":"1-6 饼图（Pie chart）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>每个饼图代表整体的 100%，各个扇区是占比。常见的是两张饼图对比，比如两个年份、两个地区或两组人群。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明比较的内容和时间\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写占比最大、最小和最显著的变化\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一张饼图的主要占比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二张饼图的主要占比，并与第一张对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The pie charts compare the proportion of … in … and ….\u003c/td>\n\u003ctd>两张饼图比较了……在……和……中的占比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two pie charts illustrate how the share of … changed between … and ….\u003c/td>\n\u003ctd>两张饼图展示了……的占比在……到……之间的变化。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … accounted for the largest share in both years.\u003c/td>\n\u003ctd>总体来看，……在两个年份中占比都最大。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant change is the rise in … from … to ….\u003c/td>\n\u003ctd>最显著的变化是……的占比从……上升到……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">占比句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X accounted for / made up nearly half of ….\u003c/td>\n\u003ctd>X 占近一半。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X accounted for a third / a quarter of ….\u003c/td>\n\u003ctd>X 占三分之一 / 四分之一。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X was the largest category, at …%.\u003c/td>\n\u003ctd>X 是占比最大的类别，为……%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Y held the smallest share.\u003c/td>\n\u003ctd>Y 的占比最小。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The remaining … / The rest of …\u003c/td>\n\u003ctd>其余的……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The proportion of X rose from … to ….\u003c/td>\n\u003ctd>X 的占比从……上升到……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, the share of Y fell to ….\u003c/td>\n\u003ctd>相比之下，Y 的占比下降到……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the most significant change was the rise in the share of online shopping, which increased from 15% to 40%, while the share of in-store shopping fell by more than half.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，最显著的变化是网购的占比从 15% 上升到 40%，而实体店消费的占比下降了一半以上。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>饼图只有比例，没有绝对数量。除非题目给出总数，不要写 \u003cem>the number of …\u003c/em>。\u003c/li>\n\u003cli>数据都是比例，写法要统一，percent 或 % 两者选一种即可。\u003c/li>\n\u003cli>分数和比例的表达（a third、nearly half、just over 等）可以参考原作者的 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/li>\n\u003cli>两张饼图要做比较，写出变化和对比，不要各自孤立地描述。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"占比句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 每个饼图代表整体的 100%，各个扇区是占比。常见的是两张饼图对比，比如两个年份、两个地区或两组人群。 段落结构 段落 要做的事 句数建议 开头 改写题目，说明比较的内容和时间 1–2 句 概述 写占比最大、最小和最显著的变化 2–3 句 细节 1 第一张饼图的主要占比 4–5 句 细节 2 第二张饼图的主要占比，并与第一张对比 4–5 句 开头模板 英文 中文 The pie charts compare the proportion of … in … and …. 两张饼图比较了……在……和……中的占比。 The two pie charts illustrate how the share of … changed between … and …. 两张饼图展示了……的占比在……到……之间的变化。 概述模板 英文 中文 Overall, … accounted for the largest share in both years. 总体来看，……在两个年份中占比都最大。 The most significant change is the rise in … from … to …. 最显著的变化是……的占比从……上升到…… 占比句型 英文 中文 X accounted for / made up nearly half of …. X 占近一半。 X accounted for a third / a quarter of …. X 占三分之一 / 四分之一。 X was the largest category, at …%. X 是占比最大的类别，为……%。 Y held the smallest share. Y 的占比最小。 The remaining … / The rest of … 其余的…… The proportion of X rose from … to …. X 的占比从……上升到…… In contrast, the share of Y fell to …. 相比之下，Y 的占比下降到…… 示例（自拟数据） Overall, the most significant change was the rise in the share of online shopping, which increased from 15% to 40%, while the share of in-store shopping fell by more than half. 译：总体来看，最显著的变化是网购的占比从 15% 上升到 40%，而实体店消费的占比下降了一半以上。 注意 饼图只有比例，没有绝对数量。除非题目给出总数，不要写 the number of …。 数据都是比例，写法要统一，percent 或 % 两者选一种即可。 分数和比例的表达（a third、nearly half、just over 等）可以参考原作者的 小作文通识积累。 两张饼图要做比较，写出变化和对比，不要各自孤立地描述。"},{"id":"s-t1-table","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-7 表格.md","title":"1-7 表格（Table）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>由行和列组成的数据表，常见的是多个类别（国家、年份、性别、职业等）在多个指标上的数据对比。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明表格内容和范围\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写最高、最低和主要趋势，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组类别的关键数据\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二组类别的关键数据，并与第一组对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The table compares / presents / illustrates … across ….\u003c/td>\n\u003ctd>表格比较 / 呈现了……在……方面的数据。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The table provides information on … in … from … to ….\u003c/td>\n\u003ctd>表格提供了……在……到……期间的信息。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … recorded the highest figure for …, whereas … had the lowest.\u003c/td>\n\u003ctd>总体来看，……的数值最高，而……的数值最低。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable feature is that ….\u003c/td>\n\u003ctd>最明显的特征是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">数据句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The highest figure was recorded for … (at …).\u003c/td>\n\u003ctd>……的数值最高，为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>… had the lowest figure, at ….\u003c/td>\n\u003ctd>……的数值最低，为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>… was much higher / lower than ….\u003c/td>\n\u003ctd>……远高于 / 低于……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The difference between A and B was ….\u003c/td>\n\u003ctd>A 和 B 之间的差距为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In terms of …, … was ….\u003c/td>\n\u003ctd>就……而言，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>By contrast, … / Whereas, …\u003c/td>\n\u003ctd>相比之下……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A total of …\u003c/td>\n\u003ctd>总计……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the table shows that the highest number of weekly working hours was recorded in Country A, whereas Country C had the lowest figure.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，表格显示 A 国的每周工作时长最长，而 C 国最短。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>不要把所有数字都搬进文章，挑最高、最低、最大差异和最有代表性的 2–3 组。\u003c/li>\n\u003cli>注意表格里的 total（总计、合计）行，不要误当成某一个类别。\u003c/li>\n\u003cli>单位（%、million、per cent 等）要统一，并读清楚表头的单位。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"数据句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 由行和列组成的数据表，常见的是多个类别（国家、年份、性别、职业等）在多个指标上的数据对比。 段落结构 段落 要做的事 句数建议 开头 改写题目，说明表格内容和范围 1–2 句 概述 写最高、最低和主要趋势，不写具体数字 2–3 句 细节 1 第一组类别的关键数据 4–5 句 细节 2 第二组类别的关键数据，并与第一组对比 4–5 句 开头模板 英文 中文 The table compares / presents / illustrates … across …. 表格比较 / 呈现了……在……方面的数据。 The table provides information on … in … from … to …. 表格提供了……在……到……期间的信息。 概述模板 英文 中文 Overall, … recorded the highest figure for …, whereas … had the lowest. 总体来看，……的数值最高，而……的数值最低。 The most noticeable feature is that …. 最明显的特征是…… 数据句型 英文 中文 The highest figure was recorded for … (at …). ……的数值最高，为…… … had the lowest figure, at …. ……的数值最低，为…… … was much higher / lower than …. ……远高于 / 低于…… The difference between A and B was …. A 和 B 之间的差距为…… In terms of …, … was …. 就……而言，…… By contrast, … / Whereas, … 相比之下…… A total of … 总计…… 示例（自拟数据） Overall, the table shows that the highest number of weekly working hours was recorded in Country A, whereas Country C had the lowest figure. 译：总体来看，表格显示 A 国的每周工作时长最长，而 C 国最短。 注意 不要把所有数字都搬进文章，挑最高、最低、最大差异和最有代表性的 2–3 组。 注意表格里的 total（总计、合计）行，不要误当成某一个类别。 单位（%、million、per cent 等）要统一，并读清楚表头的单位。"},{"id":"s-t2-overview","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-0 大作文总览.md","title":"2-0 大作文总览：题型速查","html":"\u003ch2 id=\"h1\">基本要求\u003c/h2>\n\u003cul>\n\u003cli>至少 250 词，建议 40 分钟：5 分钟审题列提纲，30 分钟写，5 分钟检查。\u003c/li>\n\u003cli>题目问了几个问题，就要分别回答几个问题。\u003c/li>\n\u003cli>要求表态的题，立场从开头到结尾保持一致。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">先看最后一句，判断题型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题型\u003c/th>\n\u003cth>题目最后一句长什么样\u003c/th>\n\u003cth>要回答什么\u003c/th>\n\u003cth>要不要表态\u003c/th>\n\u003cth>模板\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Agree or disagree\u003c/td>\n\u003ctd>To what extent do you agree or disagree? / Do you agree or disagree?\u003c/td>\n\u003ctd>同不同意这个说法\u003c/td>\n\u003ctd>要，开头就说清\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-opinion\">2-1 Agree or disagree\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discuss both views\u003c/td>\n\u003ctd>Discuss both views and give your own opinion.\u003c/td>\n\u003ctd>两种观点各是什么理由，你站哪边\u003c/td>\n\u003ctd>要，开头或结尾说清\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-discussion\">2-2 Discuss both views\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantages &amp; Disadvantages\u003c/td>\n\u003ctd>Do the advantages outweigh the disadvantages? / What are the advantages and disadvantages?\u003c/td>\n\u003ctd>好处、坏处，哪边更大\u003c/td>\n\u003ctd>outweigh 要；只问利弊可以不表态\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-advantages\">2-6 Advantages &amp; Disadvantages\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Positive or negative\u003c/td>\n\u003ctd>Is this a positive or negative development?\u003c/td>\n\u003ctd>这个趋势好不好\u003c/td>\n\u003ctd>要\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reasons / Problems &amp; Solutions\u003c/td>\n\u003ctd>What are the causes / problems? What can be done?\u003c/td>\n\u003ctd>原因或问题 + 解决办法\u003c/td>\n\u003ctd>不用\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-problem\">2-3 Reasons &amp; Solutions\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two-part questions\u003c/td>\n\u003ctd>两个不同的问句，比如 Why …? What effects …?\u003c/td>\n\u003ctd>两个问题分别回答\u003c/td>\n\u003ctd>看第二问\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-twopart\">2-5 Two-part questions\u003c/a>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">混合题怎么拆\u003c/h2>\n\u003cp>近期真题里很多是两种题型拼在一起，按 2-5 的结构“一问一段”，每段借对应模板的句子。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题目（近期真题）\u003c/th>\n\u003cth>第一问\u003c/th>\n\u003cth>第二问\u003c/th>\n\u003cth>怎么写\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>More fathers stay at home … What could be the reasons for this? Is it a positive or negative development?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>积极还是消极\u003c/td>\n\u003ctd>主体段 1 用 2-3 的原因句；主体段 2 用 2-4 的表态句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The scenery in places around the world seems similar … What are the causes? Do the advantages outweigh the disadvantages?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>利是否大于弊\u003c/td>\n\u003ctd>主体段 1 写原因；主体段 2 用 2-6 的“利大于弊”句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ambition … How important is it for people who want to succeed? Is it a positive or negative characteristic?\u003c/td>\n\u003ctd>有多重要\u003c/td>\n\u003ctd>积极还是消极\u003c/td>\n\u003ctd>主体段 1 讲重要在哪；主体段 2 表态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People spend more time away from their families. Why? What effects does this have?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>影响\u003c/td>\n\u003ctd>主体段 1 原因；主体段 2 影响（对本人、对家人各一点）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">万能主体段公式\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>作用\u003c/th>\n\u003cth>句型\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第 1 句\u003c/td>\n\u003ctd>观点句，直接回答\u003c/td>\n\u003ctd>The main reason is that … / One major benefit is that …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 2 句\u003c/td>\n\u003ctd>解释为什么\u003c/td>\n\u003ctd>This is because … / Since …, …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 3 句\u003c/td>\n\u003ctd>举例\u003c/td>\n\u003ctd>For example, … / A good example is …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 4 句\u003c/td>\n\u003ctd>回扣观点\u003c/td>\n\u003ctd>As a result, … / Therefore, …\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">常见丢分点\u003c/h2>\n\u003cul>\n\u003cli>两问只答了一问，或者两个问题混在一段里。\u003c/li>\n\u003cli>Discuss both views 只讨论双方，忘了写自己的观点。\u003c/li>\n\u003cli>outweigh 题写成“各有利弊”，没说哪边更大。\u003c/li>\n\u003cli>前面说同意，结论又说“取决于情况”，立场不一致。\u003c/li>\n\u003cli>看错题目对象。比如 \u003cem>Newspapers have a huge influence on young people&#39;s lives. Is it a positive or negative effect on society?\u003c/em> 题干讲年轻人，问的是对社会的影响，两头都要写到。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h6\">相关\u003c/h2>\n\u003cul>\n\u003cli>用词积累：\u003ca href=\"#/page/a-w-t2-vocab\">大作文通识积累\u003c/a>\u003c/li>\n\u003cli>写完以后让 AI 批改：\u003ca href=\"#/page/a-w-ai\">AI 批改提示词\u003c/a>\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"基本要求"},{"level":2,"id":"h2","text":"先看最后一句，判断题型"},{"level":2,"id":"h3","text":"混合题怎么拆"},{"level":2,"id":"h4","text":"万能主体段公式"},{"level":2,"id":"h5","text":"常见丢分点"},{"level":2,"id":"h6","text":"相关"}],"text":"基本要求 至少 250 词，建议 40 分钟：5 分钟审题列提纲，30 分钟写，5 分钟检查。 题目问了几个问题，就要分别回答几个问题。 要求表态的题，立场从开头到结尾保持一致。 先看最后一句，判断题型 题型 题目最后一句长什么样 要回答什么 要不要表态 模板 Agree or disagree To what extent do you agree or disagree? / Do you agree or disagree? 同不同意这个说法 要，开头就说清 2-1 Agree or disagree Discuss both views Discuss both views and give your own opinion. 两种观点各是什么理由，你站哪边 要，开头或结尾说清 2-2 Discuss both views Advantages & Disadvantages Do the advantages outweigh the disadvantages? / What are the advantages and disadvantages? 好处、坏处，哪边更大 outweigh 要；只问利弊可以不表态 2-6 Advantages & Disadvantages Positive or negative Is this a positive or negative development? 这个趋势好不好 要 2-4 Positive & Negative Reasons / Problems & Solutions What are the causes / problems? What can be done? 原因或问题 + 解决办法 不用 2-3 Reasons & Solutions Two-part questions 两个不同的问句，比如 Why …? What effects …? 两个问题分别回答 看第二问 2-5 Two-part questions 混合题怎么拆 近期真题里很多是两种题型拼在一起，按 2-5 的结构“一问一段”，每段借对应模板的句子。 题目（近期真题） 第一问 第二问 怎么写 More fathers stay at home … What could be the reasons for this? Is it a positive or negative development? 原因 积极还是消极 主体段 1 用 2-3 的原因句；主体段 2 用 2-4 的表态句 The scenery in places around the world seems similar … What are the causes? Do the advantages outweigh the disadvantages? 原因 利是否大于弊 主体段 1 写原因；主体段 2 用 2-6 的“利大于弊”句 Ambition … How important is it for people who want to succeed? Is it a positive or negative characteristic? 有多重要 积极还是消极 主体段 1 讲重要在哪；主体段 2 表态 People spend more time away from their families. Why? What effects does this have? 原因 影响 主体段 1 原因；主体段 2 影响（对本人、对家人各一点） 万能主体段公式 位置 作用 句型 第 1 句 观点句，直接回答 The main reason is that … / One major benefit is that … 第 2 句 解释为什么 This is because … / Since …, … 第 3 句 举例 For example, … / A good example is … 第 4 句 回扣观点 As a result, … / Therefore, … 常见丢分点 两问只答了一问，或者两个问题混在一段里。 Discuss both views 只讨论双方，忘了写自己的观点。 outweigh 题写成“各有利弊”，没说哪边更大。 前面说同意，结论又说“取决于情况”，立场不一致。 看错题目对象。比如 Newspapers have a huge influence on young people's lives. Is it a positive or negative effect on society? 题干讲年轻人，问的是对社会的影响，两头都要写到。 相关 用词积累：大作文通识积累 写完以后让 AI 批改：AI 批改提示词"},{"id":"s-t2-reasons","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-3 Reasons & Solutions.md","title":"2-3 Reasons & Solutions（原因 + 解决方法）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目问“为什么会这样”和“可以怎么解决”。典型问法：\u003c/p>\n\u003cul>\n\u003cli>What are the causes of … ? What solutions can be taken?\u003c/li>\n\u003cli>Why does … happen, and how can it be solved?\u003c/li>\n\u003cli>What problems does … cause, and what measures can be taken?\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">结构选择\u003c/h2>\n\u003cp>两种常见写法，选一种即可：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>结构\u003c/th>\n\u003cth>主体段 1\u003c/th>\n\u003cth>主体段 2\u003c/th>\n\u003cth>适合\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A：分开写\u003c/td>\n\u003ctd>原因（2 个）\u003c/td>\n\u003ctd>解决办法（2 个）\u003c/td>\n\u003ctd>两个问题都很明确时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B：成对写\u003c/td>\n\u003ctd>原因 1 + 对应的解决办法\u003c/td>\n\u003ctd>原因 2 + 对应的解决办法\u003c/td>\n\u003ctd>原因和解决办法能一一对应时\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>There is no doubt that … has become a serious problem in recent years.\u003c/td>\n\u003ctd>毫无疑问，……近年来已成为一个严重的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will examine the main causes of … and suggest some possible solutions.\u003c/td>\n\u003ctd>本文将分析……的主要原因，并提出一些可能的解决办法。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">原因模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The main reason for this is that ….\u003c/td>\n\u003ctd>主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One major cause is ….\u003c/td>\n\u003ctd>一个主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is largely because ….\u003c/td>\n\u003ctd>这在很大程度上是因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Another factor contributing to this is ….\u003c/td>\n\u003ctd>促成这一现象的另一个因素是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As a result, ….\u003c/td>\n\u003ctd>因此，……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">解决模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The government should ….\u003c/td>\n\u003ctd>政府应该……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One effective measure is to ….\u003c/td>\n\u003ctd>一个有效的办法是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Individuals can ….\u003c/td>\n\u003ctd>个人可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is essential to ….\u003c/td>\n\u003ctd>必须……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Both … and … should work together to ….\u003c/td>\n\u003ctd>……和……应该共同努力，以……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">结论模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>In conclusion, … is mainly caused by … and can be solved by ….\u003c/td>\n\u003ctd>总之，……主要由……导致，可以通过……解决。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>To sum up, … should be addressed through ….\u003c/td>\n\u003ctd>总而言之，……应该通过……来解决。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟题目）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：Many young people spend too much time on their phones. What are the causes, and what solutions can be taken?\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：Nowadays, many young people spend a great deal of time on their phones, which has raised concern in society. This essay will examine the main causes of this habit and suggest some possible solutions.\u003cbr>\u003cstrong>译\u003c/strong>：如今，许多年轻人花大量时间玩手机，这引起了社会的关注。本文将分析这一习惯的主要原因，并提出一些可能的解决办法。\u003c/p>\n\u003cp>\u003cstrong>原因段\u003c/strong>：The main reason is that smartphones offer endless entertainment, such as short videos and games, which are designed to attract users&#39; attention. Another factor is that many young people feel lonely or stressed and turn to their phones for comfort. For example, after a long day at school, scrolling through social media may seem like the easiest way to relax.\u003cbr>\u003cstrong>译\u003c/strong>：主要原因是智能手机提供了无穷无尽的娱乐内容，比如短视频和游戏，它们本身就是为了吸引用户注意力而设计的。另一个因素是许多年轻人感到孤独或压力大，于是通过手机寻求安慰。例如，放学后刷社交媒体似乎是最轻松的放松方式。\u003c/p>\n\u003cp>\u003cstrong>解决段\u003c/strong>：To tackle this problem, schools and families should work together to set reasonable rules on screen time. In addition, young people can develop healthier habits, such as doing sports or reading books, to replace the time spent on their phones.\u003cbr>\u003cstrong>译\u003c/strong>：要解决这个问题，学校和家庭应该共同制定合理的屏幕使用时间规则。此外，年轻人可以培养更健康的习惯，比如运动或阅读，来替代玩手机的时间。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, excessive phone use among young people is mainly caused by entertainment design and emotional needs, and it can be reduced through clear rules and healthier alternatives.\u003cbr>\u003cstrong>译\u003c/strong>：总之，年轻人过度用手机主要源于娱乐设计和情感需求，可以通过明确的规则和更健康的替代活动来减少。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>每个原因和解决办法都要有解释（为什么、怎么做）和例子，只写一句话会显得单薄。\u003c/li>\n\u003cli>解决办法要具体、可执行，少用 “we should do more” 这类空话。\u003c/li>\n\u003cli>题目问原因时，段落里先给出原因，再展开说明。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"结构选择"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"原因模板"},{"level":2,"id":"h5","text":"解决模板"},{"level":2,"id":"h6","text":"结论模板"},{"level":2,"id":"h7","text":"示例（自拟题目）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 题目问“为什么会这样”和“可以怎么解决”。典型问法： What are the causes of … ? What solutions can be taken? Why does … happen, and how can it be solved? What problems does … cause, and what measures can be taken? 结构选择 两种常见写法，选一种即可： 结构 主体段 1 主体段 2 适合 A：分开写 原因（2 个） 解决办法（2 个） 两个问题都很明确时 B：成对写 原因 1 + 对应的解决办法 原因 2 + 对应的解决办法 原因和解决办法能一一对应时 开头模板 英文 中文 There is no doubt that … has become a serious problem in recent years. 毫无疑问，……近年来已成为一个严重的问题。 This essay will examine the main causes of … and suggest some possible solutions. 本文将分析……的主要原因，并提出一些可能的解决办法。 原因模板 英文 中文 The main reason for this is that …. 主要原因是…… One major cause is …. 一个主要原因是…… This is largely because …. 这在很大程度上是因为…… Another factor contributing to this is …. 促成这一现象的另一个因素是…… As a result, …. 因此，…… 解决模板 英文 中文 The government should …. 政府应该…… One effective measure is to …. 一个有效的办法是…… Individuals can …. 个人可以…… It is essential to …. 必须…… Both … and … should work together to …. ……和……应该共同努力，以…… 结论模板 英文 中文 In conclusion, … is mainly caused by … and can be solved by …. 总之，……主要由……导致，可以通过……解决。 To sum up, … should be addressed through …. 总而言之，……应该通过……来解决。 示例（自拟题目） 题目：Many young people spend too much time on their phones. What are the causes, and what solutions can be taken? 开头：Nowadays, many young people spend a great deal of time on their phones, which has raised concern in society. This essay will examine the main causes of this habit and suggest some possible solutions. 译：如今，许多年轻人花大量时间玩手机，这引起了社会的关注。本文将分析这一习惯的主要原因，并提出一些可能的解决办法。 原因段：The main reason is that smartphones offer endless entertainment, such as short videos and games, which are designed to attract users' attention. Another factor is that many young people feel lonely or stressed and turn to their phones for comfort. For example, after a long day at school, scrolling through social media may seem like the easiest way to relax. 译：主要原因是智能手机提供了无穷无尽的娱乐内容，比如短视频和游戏，它们本身就是为了吸引用户注意力而设计的。另一个因素是许多年轻人感到孤独或压力大，于是通过手机寻求安慰。例如，放学后刷社交媒体似乎是最轻松的放松方式。 解决段：To tackle this problem, schools and families should work together to set reasonable rules on screen time. In addition, young people can develop healthier habits, such as doing sports or reading books, to replace the time spent on their phones. 译：要解决这个问题，学校和家庭应该共同制定合理的屏幕使用时间规则。此外，年轻人可以培养更健康的习惯，比如运动或阅读，来替代玩手机的时间。 结论：In conclusion, excessive phone use among young people is mainly caused by entertainment design and emotional needs, and it can be reduced through clear rules and healthier alternatives. 译：总之，年轻人过度用手机主要源于娱乐设计和情感需求，可以通过明确的规则和更健康的替代活动来减少。 注意 每个原因和解决办法都要有解释（为什么、怎么做）和例子，只写一句话会显得单薄。 解决办法要具体、可执行，少用 “we should do more” 这类空话。 题目问原因时，段落里先给出原因，再展开说明。"},{"id":"s-t2-twopart","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-5 Two-part questions.md","title":"2-5 双问题（Two-part questions）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目一次问两件事。常见组合：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组合\u003c/th>\n\u003cth>例子（自拟）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原因 + 影响\u003c/td>\n\u003ctd>Why do people move to big cities, and what effects does this have?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 解决\u003c/td>\n\u003ctd>见 \u003ca href=\"#/w/t2-problem\">2-3 Reasons &amp; Solutions\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 利弊\u003c/td>\n\u003ctd>第二问见 \u003ca href=\"#/w/t2-advantages\">2-6 Advantages &amp; Disadvantages\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 积极还是消极\u003c/td>\n\u003ctd>第二问见 \u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现状 + 未来\u003c/td>\n\u003ctd>How has … changed in recent years, and how will it develop in the future?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同意与否 + 理由或建议\u003c/td>\n\u003ctd>Do you agree with …? What should be done about it?\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两个问题都要答，而且要分开答。最常见的失误是只回答其中一个问题。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写两个问题，说明你会分别回答\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 1\u003c/td>\n\u003ctd>回答第一个问题：观点 + 原因 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 2\u003c/td>\n\u003ctd>回答第二个问题：观点 + 原因或做法 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论\u003c/td>\n\u003ctd>分别总结两个问题的答案\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>This question can be divided into two parts.\u003c/td>\n\u003ctd>这个问题可以分成两部分。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will address both questions by ….\u003c/td>\n\u003ctd>本文将从……两个方面回答这两个问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regarding the first question, ….\u003c/td>\n\u003ctd>关于第一个问题，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As for the second question, ….\u003c/td>\n\u003ctd>至于第二个问题，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The first reason is that …, and the second is ….\u003c/td>\n\u003ctd>第一个原因是……，第二个是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">示例（自拟题目）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：Why do some people prefer living in the countryside, and what are the benefits of living there?\u003cbr>\u003cstrong>译\u003c/strong>：为什么有些人更喜欢住在农村？住在那里有哪些好处？\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：People have different views on where to live. This essay will explain why some people prefer rural life, and then discuss the benefits of living in the countryside.\u003cbr>\u003cstrong>译\u003c/strong>：人们对居住地有不同的看法。本文将解释为什么有些人更喜欢乡村生活，然后讨论住在农村的好处。\u003c/p>\n\u003cp>\u003cstrong>主体段 1（第一问）\u003c/strong>：The main reason is that the countryside offers a quieter and less stressful lifestyle. Life there is usually less crowded, and people have more time to relax with their families. For example, many retired people move to rural areas to enjoy peaceful surroundings and fresh air.\u003cbr>\u003cstrong>译\u003c/strong>：主要原因是农村的生活更安静、压力更小。那里通常人少，人们有更多时间和家人一起放松。例如，许多退休人员搬到乡村，享受宁静的环境和新鲜空气。\u003c/p>\n\u003cp>\u003cstrong>主体段 2（第二问）\u003c/strong>：As for the benefits, rural areas tend to be more affordable, as housing and daily expenses are much lower than in cities. In addition, living close to nature allows residents to enjoy outdoor activities such as hiking and gardening, which can improve both physical and mental health.\u003cbr>\u003cstrong>译\u003c/strong>：至于好处，农村的住房和日常开销远低于城市，因此更加经济实惠。此外，靠近大自然让居民可以徒步、园艺等户外活动，有助于身心健康。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, the countryside appeals to people who want a calmer life, and its lower living costs and natural environment make it an attractive choice.\u003cbr>\u003cstrong>译\u003c/strong>：总之，农村吸引的是想要过平静生活的人，较低的生活成本和自然环境使它成为很有吸引力的选择。\u003c/p>\n\u003ch2 id=\"h5\">注意\u003c/h2>\n\u003cul>\n\u003cli>两个问题分两段回答，每段开头可以用 As for、Regarding 等词明确指向对应的问题。\u003c/li>\n\u003cli>如果两个问题都是“为什么”，可以拆成“原因 1 / 原因 2”来写，但仍要覆盖题目里的每一个部分。\u003c/li>\n\u003cli>不要只回答一个问题，也不要在同一段里混着回答两个问题。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"句型模板"},{"level":2,"id":"h4","text":"示例（自拟题目）"},{"level":2,"id":"h5","text":"注意"}],"text":"题型识别 题目一次问两件事。常见组合： 组合 例子（自拟） 原因 + 影响 Why do people move to big cities, and what effects does this have? 原因 + 解决 见 2-3 Reasons & Solutions 原因 + 利弊 第二问见 2-6 Advantages & Disadvantages 原因 + 积极还是消极 第二问见 2-4 Positive & Negative 现状 + 未来 How has … changed in recent years, and how will it develop in the future? 同意与否 + 理由或建议 Do you agree with …? What should be done about it? 两个问题都要答，而且要分开答。最常见的失误是只回答其中一个问题。 段落结构 段落 内容 开头 改写两个问题，说明你会分别回答 主体段 1 回答第一个问题：观点 + 原因 + 例子 主体段 2 回答第二个问题：观点 + 原因或做法 + 例子 结论 分别总结两个问题的答案 句型模板 英文 中文 This question can be divided into two parts. 这个问题可以分成两部分。 This essay will address both questions by …. 本文将从……两个方面回答这两个问题。 Regarding the first question, …. 关于第一个问题，…… As for the second question, …. 至于第二个问题，…… The first reason is that …, and the second is …. 第一个原因是……，第二个是…… 示例（自拟题目） 题目：Why do some people prefer living in the countryside, and what are the benefits of living there? 译：为什么有些人更喜欢住在农村？住在那里有哪些好处？ 开头：People have different views on where to live. This essay will explain why some people prefer rural life, and then discuss the benefits of living in the countryside. 译：人们对居住地有不同的看法。本文将解释为什么有些人更喜欢乡村生活，然后讨论住在农村的好处。 主体段 1（第一问）：The main reason is that the countryside offers a quieter and less stressful lifestyle. Life there is usually less crowded, and people have more time to relax with their families. For example, many retired people move to rural areas to enjoy peaceful surroundings and fresh air. 译：主要原因是农村的生活更安静、压力更小。那里通常人少，人们有更多时间和家人一起放松。例如，许多退休人员搬到乡村，享受宁静的环境和新鲜空气。 主体段 2（第二问）：As for the benefits, rural areas tend to be more affordable, as housing and daily expenses are much lower than in cities. In addition, living close to nature allows residents to enjoy outdoor activities such as hiking and gardening, which can improve both physical and mental health. 译：至于好处，农村的住房和日常开销远低于城市，因此更加经济实惠。此外，靠近大自然让居民可以徒步、园艺等户外活动，有助于身心健康。 结论：In conclusion, the countryside appeals to people who want a calmer life, and its lower living costs and natural environment make it an attractive choice. 译：总之，农村吸引的是想要过平静生活的人，较低的生活成本和自然环境使它成为很有吸引力的选择。 注意 两个问题分两段回答，每段开头可以用 As for、Regarding 等词明确指向对应的问题。 如果两个问题都是“为什么”，可以拆成“原因 1 / 原因 2”来写，但仍要覆盖题目里的每一个部分。 不要只回答一个问题，也不要在同一段里混着回答两个问题。"},{"id":"s-t2-adv","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-6 Advantages & Disadvantages.md","title":"2-6 Advantages & Disadvantages（利弊题）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问法\u003c/th>\n\u003cth>要做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Do the advantages outweigh the disadvantages? / Do the benefits outweigh the drawbacks?\u003c/td>\n\u003ctd>必须表态：利大于弊，或弊大于利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What are the advantages and disadvantages of …?\u003c/td>\n\u003ctd>利和弊各写一段，可以不表态，结尾给一句倾向更好\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>和 2-4 Positive &amp; Negative 很像。2-4 问“这个趋势好不好”，这里问“好处是不是比坏处大”。结构可以几乎一样，区别在让步段：这里要说明坏处为什么比较小。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h2\">结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>内容（以“利大于弊”为例）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目 + 表态：利大于弊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 1\u003c/td>\n\u003ctd>第一个好处：观点 + 解释 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 2\u003c/td>\n\u003ctd>第二个好处：观点 + 解释 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 3\u003c/td>\n\u003ctd>承认坏处，再说明坏处比较小（短期的、可以解决、只影响少数人）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论\u003c/td>\n\u003ctd>重申利大于弊，概括两个好处\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>如果认为弊大于利，把主体段 1、2 换成两个坏处，主体段 3 承认好处并说明好处有限。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is increasingly common for sb to do sth.\u003c/td>\n\u003ctd>某人做某事越来越普遍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In my view, the advantages of this trend clearly outweigh its disadvantages.\u003c/td>\n\u003ctd>在我看来，这一趋势的好处明显大于坏处。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant advantage is that …\u003c/td>\n\u003ctd>最大的好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since …, it allows sb to do sth.\u003c/td>\n\u003ctd>由于……，这让某人能够做某事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for …\u003c/td>\n\u003ctd>这一点对……尤其明显。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example, …\u003c/td>\n\u003ctd>例如，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Another benefit is that …\u003c/td>\n\u003ctd>另一个好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because …, sb can …\u003c/td>\n\u003ctd>因为……，某人可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of doing sth, sb can …\u003c/td>\n\u003ctd>某人不必……，而是可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance, …\u003c/td>\n\u003ctd>举例来说，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Admittedly, there are some drawbacks.\u003c/td>\n\u003ctd>诚然，这也有一些缺点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main disadvantage is that …\u003c/td>\n\u003ctd>主要的缺点是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>However, this problem is usually temporary / can be reduced by …\u003c/td>\n\u003ctd>不过这个问题通常是暂时的 / 可以通过……来减轻。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although sth may bring some problems such as …, I believe its benefits outweigh its drawbacks, because it can …\u003c/td>\n\u003ctd>总之，尽管某事可能带来……等问题，我认为它利大于弊，因为它能……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">示例（2026 年 9 月下旬真题回忆）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks?\u003cbr>\u003cstrong>译\u003c/strong>：越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：It is increasingly common for young people to attend universities in other countries. In my view, the benefits of studying abroad clearly outweigh the drawbacks.\u003cbr>\u003cstrong>译\u003c/strong>：年轻人去国外读大学越来越普遍。在我看来，出国留学的好处明显大于坏处。\u003c/p>\n\u003cp>\u003cstrong>主体段 1\u003c/strong>：The most significant benefit is that students can receive a high-quality education. Since many overseas universities have excellent teachers and modern laboratories, they allow students to learn the latest knowledge in their field. This is particularly true for subjects such as engineering and medicine. For example, a student who studies computer science in the UK can take part in real research projects, which will make him more competitive when he looks for a job.\u003cbr>\u003cstrong>译\u003c/strong>：最大的好处是学生能接受高质量的教育。由于很多海外大学有优秀的老师和现代化的实验室，学生能学到本领域最新的知识。这一点对工程、医学这类专业尤其明显。例如，在英国读计算机的学生可以参与真实的科研项目，这会让他找工作时更有竞争力。\u003c/p>\n\u003cp>\u003cstrong>主体段 2\u003c/strong>：Another benefit is that studying abroad helps young people become more independent and open-minded. Because they live far away from their families, they have to cook, manage their money and solve problems on their own. Instead of only reading about other cultures, they can make friends from different countries and experience different ways of life. For instance, many international students learn to plan their budgets and deal with cultural differences within their first year.\u003cbr>\u003cstrong>译\u003c/strong>：另一个好处是，留学让年轻人更独立、更开放。因为远离家人，他们必须自己做饭、管钱、解决问题。他们不只是在书上了解其他文化，而是能结交不同国家的朋友，体验不同的生活方式。举例来说，很多留学生在第一年就学会了规划开支、应对文化差异。\u003c/p>\n\u003cp>\u003cstrong>主体段 3\u003c/strong>：Admittedly, there are some drawbacks. The main disadvantage is the high cost, as tuition fees and living expenses in many countries are very expensive. Some students may also feel lonely at the beginning. However, these problems are usually temporary or can be reduced. Students can apply for scholarships or work part-time, and most of them get used to the new environment after a few months.\u003cbr>\u003cstrong>译\u003c/strong>：诚然，留学也有一些缺点。主要的缺点是花费高，很多国家的学费和生活费都很贵。有些学生刚开始也会感到孤独。不过这些问题通常是暂时的，或者可以减轻。学生可以申请奖学金或做兼职，而且大多数人几个月后就能适应新环境。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, although studying abroad may bring some problems such as financial pressure and loneliness, I believe its benefits outweigh its drawbacks, because it can provide a better education and help young people grow up.\u003cbr>\u003cstrong>译\u003c/strong>：总之，尽管留学可能带来经济压力、孤独等问题，我认为它利大于弊，因为它能提供更好的教育，并帮助年轻人成长。\u003c/p>\n\u003ch2 id=\"h5\">注意\u003c/h2>\n\u003cul>\n\u003cli>outweigh 题一定要写出“哪边更大”，开头和结论各说一次。\u003c/li>\n\u003cli>让步段不能只列坏处，要接一句 However，说明坏处为什么比较小。\u003c/li>\n\u003cli>只问 \u003cem>What are the advantages and disadvantages\u003c/em> 时，利一段、弊一段即可，结构见 \u003ca href=\"#/w/t2-twopart\">2-5 Two-part questions\u003c/a>。\u003c/li>\n\u003cli>同一个留学话题的 Positive or negative 写法，见原作者的 \u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>，可以对照着看两种问法的区别。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"结构"},{"level":2,"id":"h3","text":"模板"},{"level":2,"id":"h4","text":"示例（2026 年 9 月下旬真题回忆）"},{"level":2,"id":"h5","text":"注意"}],"text":"题型识别 问法 要做什么 Do the advantages outweigh the disadvantages? / Do the benefits outweigh the drawbacks? 必须表态：利大于弊，或弊大于利 What are the advantages and disadvantages of …? 利和弊各写一段，可以不表态，结尾给一句倾向更好 和 2-4 Positive & Negative 很像。2-4 问“这个趋势好不好”，这里问“好处是不是比坏处大”。结构可以几乎一样，区别在让步段：这里要说明坏处为什么比较小。 结构 段落 内容（以“利大于弊”为例） 开头 改写题目 + 表态：利大于弊 主体段 1 第一个好处：观点 + 解释 + 例子 主体段 2 第二个好处：观点 + 解释 + 例子 主体段 3 承认坏处，再说明坏处比较小（短期的、可以解决、只影响少数人） 结论 重申利大于弊，概括两个好处 如果认为弊大于利，把主体段 1、2 换成两个坏处，主体段 3 承认好处并说明好处有限。 模板 英文模板 中文翻译 It is increasingly common for sb to do sth. 某人做某事越来越普遍。 In my view, the advantages of this trend clearly outweigh its disadvantages. 在我看来，这一趋势的好处明显大于坏处。 The most significant advantage is that … 最大的好处是…… Since …, it allows sb to do sth. 由于……，这让某人能够做某事。 This is particularly true for … 这一点对……尤其明显。 For example, … 例如，…… Another benefit is that … 另一个好处是…… Because …, sb can … 因为……，某人可以…… Instead of doing sth, sb can … 某人不必……，而是可以…… For instance, … 举例来说，…… Admittedly, there are some drawbacks. 诚然，这也有一些缺点。 The main disadvantage is that … 主要的缺点是…… However, this problem is usually temporary / can be reduced by … 不过这个问题通常是暂时的 / 可以通过……来减轻。 In conclusion, although sth may bring some problems such as …, I believe its benefits outweigh its drawbacks, because it can … 总之，尽管某事可能带来……等问题，我认为它利大于弊，因为它能…… 示例（2026 年 9 月下旬真题回忆） 题目：More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks? 译：越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？ 开头：It is increasingly common for young people to attend universities in other countries. In my view, the benefits of studying abroad clearly outweigh the drawbacks. 译：年轻人去国外读大学越来越普遍。在我看来，出国留学的好处明显大于坏处。 主体段 1：The most significant benefit is that students can receive a high-quality education. Since many overseas universities have excellent teachers and modern laboratories, they allow students to learn the latest knowledge in their field. This is particularly true for subjects such as engineering and medicine. For example, a student who studies computer science in the UK can take part in real research projects, which will make him more competitive when he looks for a job. 译：最大的好处是学生能接受高质量的教育。由于很多海外大学有优秀的老师和现代化的实验室，学生能学到本领域最新的知识。这一点对工程、医学这类专业尤其明显。例如，在英国读计算机的学生可以参与真实的科研项目，这会让他找工作时更有竞争力。 主体段 2：Another benefit is that studying abroad helps young people become more independent and open-minded. Because they live far away from their families, they have to cook, manage their money and solve problems on their own. Instead of only reading about other cultures, they can make friends from different countries and experience different ways of life. For instance, many international students learn to plan their budgets and deal with cultural differences within their first year. 译：另一个好处是，留学让年轻人更独立、更开放。因为远离家人，他们必须自己做饭、管钱、解决问题。他们不只是在书上了解其他文化，而是能结交不同国家的朋友，体验不同的生活方式。举例来说，很多留学生在第一年就学会了规划开支、应对文化差异。 主体段 3：Admittedly, there are some drawbacks. The main disadvantage is the high cost, as tuition fees and living expenses in many countries are very expensive. Some students may also feel lonely at the beginning. However, these problems are usually temporary or can be reduced. Students can apply for scholarships or work part-time, and most of them get used to the new environment after a few months. 译：诚然，留学也有一些缺点。主要的缺点是花费高，很多国家的学费和生活费都很贵。有些学生刚开始也会感到孤独。不过这些问题通常是暂时的，或者可以减轻。学生可以申请奖学金或做兼职，而且大多数人几个月后就能适应新环境。 结论：In conclusion, although studying abroad may bring some problems such as financial pressure and loneliness, I believe its benefits outweigh its drawbacks, because it can provide a better education and help young people grow up. 译：总之，尽管留学可能带来经济压力、孤独等问题，我认为它利大于弊，因为它能提供更好的教育，并帮助年轻人成长。 注意 outweigh 题一定要写出“哪边更大”，开头和结论各说一次。 让步段不能只列坏处，要接一句 However，说明坏处为什么比较小。 只问 What are the advantages and disadvantages 时，利一段、弊一段即可，结构见 2-5 Two-part questions。 同一个留学话题的 Positive or negative 写法，见原作者的 2-4 Positive & Negative，可以对照着看两种问法的区别。"}]}</script>
<script>(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const S = DATA.speaking;
  const R = DATA.recent;
  const TYPES = DATA.writingTypes;
  const pages = new Map(DATA.pages.map((p) => [p.id, p]));
  const p1ById = new Map(S.p1.map((t) => [t.id, t]));
  const p2ById = new Map(S.p2.map((c) => [c.id, c]));
  const coreById = new Map(S.core.map((c) => [c.id, c]));
  const typeById = new Map(TYPES.map((t) => [t.id, t]));
  const typeByRecent = new Map(TYPES.map((t) => [t.recent, t]));
  const hot1 = new Set(S.hot.p1);
  const hot2 = new Set(S.hot.p2);
  const p1No = new Map(S.p1.map((t, i) => [t.id, i + 1]));
  const p2No = new Map(S.p2.map((c, i) => [c.id, i + 1]));
  const totalP3 = S.p2.reduce((n, c) => n + c.p3.length, 0);
  const authorPages = DATA.pages.filter((p) => p.origin === 'author');

  const main = document.getElementById('main');
  const sidebar = document.getElementById('sidebar');
  const tocEl = document.getElementById('toc');
  const searchInput = document.getElementById('searchInput');

  // ---------- 工具 ----------

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const pad2 = (n) => String(n).padStart(2, '0');
  const localDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fmtDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return `${y} 年 ${m} 月 ${d} 日`;
  };
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const isTyping = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));

  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- 本机存储 ----------

  const PREFIX = 'ielts26:';
  let storageOk = true;
  function load(key, fallback) {
    try {
      const v = localStorage.getItem(PREFIX + key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) {
      storageOk = false;
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      storageOk = false;
      return false;
    }
  }

  const done = load('done', {});
  const isDone = (key) => Boolean(done[key]);
  function setDone(key, on) {
    if (on) done[key] = localDate();
    else delete done[key];
    if (!save('done', done)) toast('浏览器不允许保存，刷新后标记会丢失');
    document.querySelectorAll(`[data-done="${key}"]`).forEach(paintDone);
    updateCounts();
  }
  const doneBtn = (key) =>
    `<button class="done-btn" type="button" data-done="${key}" aria-pressed="${isDone(key)}">${isDone(key) ? '练过' : '标记练过'}</button>`;
  function paintDone(btn) {
    const on = isDone(btn.dataset.done);
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent = on ? '练过' : '标记练过';
  }
  const countDone = (kind, list) => list.filter((x) => isDone(`${kind}:${x.id}`)).length;
  function updateCounts() {
    document.querySelectorAll('[data-count]').forEach((el) => {
      const kind = el.dataset.count;
      const list = kind === 'p1' ? S.p1 : S.p2;
      el.textContent = `${countDone(kind, list)} / ${list.length}`;
    });
  }

  // ---------- 考试倒计时 ----------

  const DEFAULT_EXAM = '2026-10-18';
  function examInfo() {
    const d = load('exam', DEFAULT_EXAM);
    if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
    const [y, m, dd] = d.split('-').map(Number);
    const now = new Date();
    const days = Math.round((new Date(y, m - 1, dd) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const md = `${m} 月 ${dd} 日`;
    if (days > 0) return { date: d, big: days, label: `天后考试 · ${md}`, chip: `距考试 ${days} 天`, upcoming: true };
    if (days === 0) return { date: d, big: '今天', label: `考试日 · ${md}`, chip: '今天考试', upcoming: true };
    return { date: d, big: -days, label: `天前考过 · ${md}`, chip: `${md} 已考`, upcoming: false };
  }
  const examBtn = document.getElementById('examBtn');
  const examDialog = document.getElementById('examDialog');
  function paintExam() {
    const info = examInfo();
    examBtn.textContent = info ? info.chip : '设考试日期';
    examBtn.classList.toggle('on', Boolean(info && info.upcoming));
  }
  examBtn.addEventListener('click', () => {
    const input = document.getElementById('examDate');
    input.value = load('exam', DEFAULT_EXAM) || '';
    examDialog.returnValue = '';
    if (typeof examDialog.showModal === 'function') examDialog.showModal();
    else {
      const v = prompt('考试日期（例如 2026-10-18），留空表示不显示倒计时', input.value);
      if (v !== null) {
        save('exam', v.trim());
        paintExam();
        render();
      }
    }
  });
  examDialog.addEventListener('close', () => {
    const v = examDialog.returnValue;
    if (v === 'save') save('exam', document.getElementById('examDate').value);
    if (v === 'clear') save('exam', '');
    if (v === 'save' || v === 'clear') {
      paintExam();
      if (current().path === '/') render();
    }
  });

  // ---------- 主题 ----------

  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try {
      localStorage.setItem(PREFIX + 'theme', next);
    } catch (e) {}
  });

  // ---------- 链接和标签 ----------

  const typeByPrimaryPage = new Map(TYPES.map((t) => [t.pages[0], t.id]));
  const pageRoute = (id) => (typeByPrimaryPage.has(id) ? `#/w/${typeByPrimaryPage.get(id)}` : `#/page/${id}`);
  const pageLinks = (ids) =>
    (ids || [])
      .map((id) => pages.get(id))
      .filter(Boolean)
      .map((p) => `<a href="${pageRoute(p.id)}">${esc(p.title)}</a>`)
      .join('');
  const itemLinks = (ids) =>
    (ids || [])
      .map((id) => {
        if (p2ById.has(id)) return `<a href="#/p2?focus=${id}">P2 #${p2No.get(id)} ${esc(p2ById.get(id).zh)}</a>`;
        if (p1ById.has(id)) return `<a href="#/p1?focus=${id}">P1 ${esc(p1ById.get(id).en)}</a>`;
        return '';
      })
      .join('');
  const srcLine = (src, sources) => (src || []).map((s) => (sources[s] && sources[s].short) || s).join(' · ');

  function tagsFor(item, kind) {
    const t = [];
    if (item.tags && item.tags.includes('mainland')) t.push('<span class="tag tag-mainland">大陆新题</span>');
    if ((kind === 'p1' ? hot1 : hot2).has(item.id)) t.push('<span class="tag tag-hot">近期高频</span>');
    if (item.tags && item.tags.includes('later')) t.push('<span class="tag tag-later">后续新增</span>');
    return t.length ? `<span class="tags">${t.join('')}</span>` : '';
  }
  const originTag = (p) => (p.origin === 'author' ? '<span class="tag tag-author">原作者笔记</span>' : '<span class="tag">本站补充</span>');

  const FILTERS = [
    ['all', '全部'],
    ['mainland', '大陆新题'],
    ['hot', '近期高频'],
    ['later', '后续新增'],
    ['todo', '未练过']
  ];
  function matchFilter(item, f, kind) {
    if (f === 'all') return true;
    if (f === 'hot') return (kind === 'p1' ? hot1 : hot2).has(item.id);
    if (f === 'todo') return !isDone(`${kind}:${item.id}`);
    return Boolean(item.tags && item.tags.includes(f));
  }
  const segs = (name, options, value) =>
    options.map(([v, label]) => `<button class="seg" type="button" data-${name}="${v}" aria-pressed="${v === value}">${esc(label)}</button>`).join('');
  function bindSegs(root, name, onPick) {
    root.querySelectorAll(`[data-${name}]`).forEach((b) => {
      b.addEventListener('click', () => {
        root.querySelectorAll(`[data-${name}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        onPick(b.dataset[name]);
      });
    });
  }

  // ---------- 导航 ----------

  function navLink(href, label, count) {
    return `<a class="nav-link" href="${href}">${esc(label)}${count != null ? `<span class="count">${count}</span>` : ''}</a>`;
  }
  function navFold(label, count, inner, open, key) {
    return `<details class="nav-fold"${open ? ' open' : ''}${key ? ` data-fold="${key}"` : ''}><summary class="nav-sum">${esc(label)}<span class="count">${count}</span></summary><div class="nav-sub">${inner}</div></details>`;
  }
  function buildNav() {
    const t1 = TYPES.filter((t) => t.task === 1);
    const t2 = TYPES.filter((t) => t.task === 2);
    const authorGroup = (group, label) => {
      const list = authorPages.filter((p) => p.group === group);
      return navFold(label, list.length, list.map((p) => navLink(`#/page/${p.id}`, p.title)).join(''), false, group);
    };
    sidebar.innerHTML = `
      <div class="nav-group">${navLink('#/', '首页')}</div>
      <div class="nav-group">
        <p class="nav-title">口语 · ${esc(S.season)}</p>
        ${navLink('#/p1', 'Part 1 新题', S.p1.length)}
        ${navLink('#/p2', 'Part 2 题卡', S.p2.length)}
        ${navLink('#/p3', 'Part 3 追问', totalP3)}
        ${navLink('#/chuanti', '串题', S.chuanti.length)}
        ${navLink('#/practice', '计时练习')}
      </div>
      <div class="nav-group">
        <p class="nav-title">写作</p>
        ${navLink('#/writing', '题型速查')}
        ${navFold('小作文', t1.length, navLink('#/page/s-t1-overview', '总览：结构和时态') + t1.map((t) => navLink(`#/w/${t.id}`, t.name)).join(''), true)}
        ${navFold('大作文', t2.length, navLink('#/page/s-t2-overview', '总览：题型识别') + t2.map((t) => navLink(`#/w/${t.id}`, t.en)).join(''), true)}
        ${navLink('#/recent', '近期真题', R.task1.length + R.task2.length)}
        ${navLink('#/page/a-w-t1-vocab', '小作文通识积累')}
        ${navLink('#/page/a-w-t2-vocab', '大作文通识积累')}
        ${navLink('#/page/a-w-ai', 'AI 批改提示词')}
      </div>
      <div class="nav-group">
        <p class="nav-title">原作者笔记</p>
        ${navLink('#/notes', '说明和目录')}
        ${authorGroup('a-p1', '口语 Part 1')}
        ${authorGroup('a-p2', '口语 Part 2')}
        ${authorGroup('a-p3', '口语 Part 3')}
        ${authorGroup('a-w', '作文')}
      </div>
      <div class="nav-group">${navLink('#/about', '来源与说明')}</div>`;
  }
  function markNav(hashPath) {
    sidebar.querySelectorAll('.nav-link').forEach((a) => {
      if (a.getAttribute('href') === hashPath) {
        a.setAttribute('aria-current', 'page');
        const fold = a.closest('details');
        if (fold) fold.open = true;
      } else a.removeAttribute('aria-current');
    });
  }

  const menuBtn = document.getElementById('menuBtn');
  const scrim = document.getElementById('scrim');
  function openNav() {
    document.body.classList.add('nav-open');
    menuBtn.setAttribute('aria-expanded', 'true');
    scrim.hidden = false;
  }
  function closeNav() {
    document.body.classList.remove('nav-open');
    menuBtn.setAttribute('aria-expanded', 'false');
    scrim.hidden = true;
  }
  menuBtn.addEventListener('click', () => (document.body.classList.contains('nav-open') ? closeNav() : openNav()));
  scrim.addEventListener('click', closeNav);

  // ---------- 目录 ----------

  function renderToc(items) {
    tocEl.innerHTML = items.length
      ? '<p class="toc-title">本页目录</p>' + items.map((x) => `<a href="#" role="button" data-target="${x.id}" class="l${x.level}">${esc(x.text)}</a>`).join('')
      : '';
  }
  tocEl.addEventListener('click', (e) => {
    const a = e.target.closest('[data-target]');
    if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.dataset.target);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- 首页 ----------

  let practice = null;
  function stopPractice() {
    if (practice) practice.destroy();

  }

  let audioCtx = null;
  function ensureAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }
  function beep(times) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + 0.02;
    for (let k = 0; k < times; k++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const t = t0 + k * 0.28;
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.22);
    }
  }

  function createRecorder() {
    let stream = null;
    let rec = null;
    let chunks = [];
    let url = null;
    let released = false;
    return {
      async prepare() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error('这个浏览器不支持录音');
        if (stream) return;
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (released) {
          s.getTracks().forEach((t) => t.stop());
          throw new Error('released');
        }
        stream = s;
      },
      start() {
        if (!stream || (rec && rec.state !== 'inactive')) return;
        chunks = [];
        const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
        rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
        rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
        rec.start();
      },
      pause() {
        if (rec && rec.state === 'recording' && rec.pause) rec.pause();
      },
      resume() {
        if (rec && rec.state === 'paused' && rec.resume) rec.resume();
      },
      stop() {
        return new Promise((resolve) => {
          if (!rec || rec.state === 'inactive') return resolve(null);
          rec.onstop = () => {
            const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
            if (url) URL.revokeObjectURL(url);
            url = URL.createObjectURL(blob);
            resolve({ url, type: blob.type });
          };
          rec.stop();
        });
      },
      discard() {
        if (rec && rec.state !== 'inactive') {
          rec.onstop = null;
          rec.stop();
        }
        rec = null;
        chunks = [];
      },
      release() {
        released = true;
        this.discard();
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = null;
        if (url) URL.revokeObjectURL(url);
        url = null;
      },
      get active() {
        return Boolean(rec && rec.state !== 'inactive');
      },
      get ready() {
        return Boolean(stream);
      }
    };
  }

  const fmtClock = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
  };

  // phases: [{ label, secs, record, q, beepEnd }]
  function mountTimer(box, phases, opts) {
    const recorder = createRecorder();
    let i = 0;
    let left = phases[0].secs * 1000;
    let endAt = 0;
    let running = false;
    let finished = false;
    let interval = 0;
    const el = (id) => box.querySelector(`[data-t="${id}"]`);
    box.innerHTML = `
      <div class="phase" data-t="phase"></div>
      <div class="clock" data-t="clock" aria-live="off"></div>
      <div class="bar"><i data-t="bar"></i></div>
      <div class="row">
        <button class="btn btn-primary" type="button" data-t="start">开始</button>
        <button class="btn" type="button" data-t="next">下一步</button>
        <button class="btn" type="button" data-t="reset">重来</button>
      </div>
      <div class="p3-now" data-t="q" hidden></div>
      <div class="opts">
        ${opts.recordable ? '<label><input type="checkbox" data-t="rec"> 录音</label>' : ''}
        <label><input type="checkbox" data-t="beep" checked> 提示音</label>
      </div>
      <div class="rec" data-t="recbox" hidden></div>
      ${opts.footer || ''}`;

    const recBox = el('recbox');
    const showRec = (html) => {
      recBox.hidden = !html;
      recBox.innerHTML = html || '';
    };
    const wantRec = () => opts.recordable && el('rec') && el('rec').checked;
    const wantBeep = () => el('beep').checked;

    function draw() {
      const ph = phases[i];
      const total = ph.secs * 1000;
      el('phase').textContent = finished ? '结束' : ph.label;
      el('clock').textContent = finished ? '0:00' : fmtClock(left);
      el('clock').className = 'clock' + (!finished && left <= 10000 && running ? ' warn' : '');
      el('bar').style.width = `${finished ? 100 : Math.min(100, (1 - left / total) * 100)}%`;
      el('start').textContent = running ? '暂停' : finished ? '再来一次' : left < total ? '继续' : '开始';
      el('next').disabled = finished;
      const q = el('q');
      q.hidden = finished || !ph.q;
      if (ph.q) q.innerHTML = ph.q;
    }
    function enter() {
      const ph = phases[i];
      if (ph.record && wantRec() && recorder.ready && !recorder.active) {
        recorder.start();
        showRec('<span class="rec-dot"></span>录音中，结束后可以回放');
      }
      if (opts.onEnter) opts.onEnter(ph, i);
    }
    async function finish(auto) {
      finished = true;
      running = false;
      clearInterval(interval);
      if (auto && wantBeep()) beep(3);
      draw();
      if (recorder.active) {
        const r = await recorder.stop();
        if (r) {
          const ext = /mp4/.test(r.type) ? 'm4a' : /ogg/.test(r.type) ? 'ogg' : 'webm';
          showRec(`<b>录音回放</b><audio controls src="${r.url}"></audio><div class="row small" style="margin-top:6px"><a class="btn btn-sm" href="${r.url}" download="${esc(opts.fileBase || 'speaking')}-${localDate()}.${ext}">下载录音</a><span class="muted">录音只在这台设备上，刷新页面就没了。</span></div>`);
        }
      }
      if (opts.onFinish) opts.onFinish();
    }
    function advance(auto) {
      if (i >= phases.length - 1) return finish(auto);
      if (auto && wantBeep()) beep(phases[i].beepEnd || 1);
      i += 1;
      left = phases[i].secs * 1000;
      if (running) {
        endAt = performance.now() + left;
        enter();
      }
      draw();
    }
    function tick() {
      left = endAt - performance.now();
      if (left <= 0) advance(true);
      else draw();
    }
    let micPending = false;
    function requestMic() {
      if (!wantRec() || recorder.ready || micPending) return;
      micPending = true;
      showRec('<span class="muted">正在请求麦克风权限，请在浏览器弹窗里点“允许”。计时不受影响。</span>');
      recorder
        .prepare()
        .then(() => {
          micPending = false;
          if (running && !finished && phases[i].record) {
            recorder.start();
            showRec('<span class="rec-dot"></span>录音中，结束后可以回放');
          } else showRec('<span class="muted">麦克风已就绪，开始回答时自动录音。</span>');
        })
        .catch((err) => {
          micPending = false;
          if (err && err.message === 'released') return;
          if (el('rec')) el('rec').checked = false;
          showRec(`<span class="muted">没法录音：${esc(err && err.name === 'NotAllowedError' ? '没有麦克风权限' : (err && err.message) || '浏览器不支持')}。计时照常进行。</span>`);
        });
    }
    if (el('rec')) el('rec').addEventListener('change', () => el('rec').checked && requestMic());
    function start() {
      ensureAudio();
      if (finished) return reset();
      requestMic();
      running = true;
      endAt = performance.now() + left;
      clearInterval(interval);
      interval = setInterval(tick, 200);
      if (left === phases[i].secs * 1000) enter();
      else recorder.resume();
      draw();
    }
    function pause() {
      running = false;
      left = Math.max(0, endAt - performance.now());
      clearInterval(interval);
      recorder.pause();
      draw();
    }
    function reset() {
      clearInterval(interval);
      recorder.discard();
      showRec('');
      i = 0;
      left = phases[0].secs * 1000;
      running = false;
      finished = false;
      if (opts.onReset) opts.onReset();
      draw();
    }
    el('start').addEventListener('click', () => (running ? pause() : start()));
    el('next').addEventListener('click', () => advance(false));
    el('reset').addEventListener('click', reset);
    const onKey = (e) => {
      if (isTyping(e.target) || e.target.closest('button, a, summary')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        running ? pause() : start();
      }
    };
    document.addEventListener('keydown', onKey);
    draw();
    return {
      destroy() {
        clearInterval(interval);
        recorder.release();
        document.removeEventListener('keydown', onKey);
      }
    };
  }

  function practiceP2(body, cardId) {
    let card = p2ById.get(cardId) || pick(S.p2.filter((c) => !isDone('p2:' + c.id)).length ? S.p2.filter((c) => !isDone('p2:' + c.id)) : S.p2);

    let p3s = 40;
    let timer = null;
    const options = Object.entries(S.categories)
      .map(([cat, label]) => `<optgroup label="${label}">${S.p2.filter((c) => c.cat === cat).map((c) => `<option value="${c.id}">#${p2No.get(c.id)} ${esc(c.zh)}</option>`).join('')}</optgroup>`)
      .join('');
    body.innerHTML = `
      <div class="practice-grid">
        <div>
          <div class="picker">
            <select id="cardSel" aria-label="选择题卡">${options}</select>
            <button class="btn" type="button" id="randBtn">随机一张</button>
            <select id="randScope" class="narrow" aria-label="随机范围"><option value="todo">从未练过的里抽</option><option value="all">从全部里抽</option><option value="mainland">从大陆新题里抽</option><option value="hot">从近期高频里抽</option></select>

          <div class="opts" style="justify-content:flex-start">

            <label>每题 <select id="p3s"><option value="30">30 秒</option><option value="40" selected>40 秒</option><option value="60">60 秒</option></select></label>
          </div>
        </div>
        <div class="card timer-card" id="timerBox"></div>
      </div>`;
    const sel = body.querySelector('#cardSel');
    function build() {
      if (timer) timer.destroy();
      sel.value = card.id;
      body.querySelector('#cueCard').innerHTML = cueHtml(card);
      const qs = shuffle(card.p3).slice(0, p3n);
      const phases = [
        { label: 'Part 2 · 准备 1 分钟', secs: 60 },
        { label: 'Part 2 · 陈述 2 分钟', secs: 120, record: true, beepEnd: 2 },
        ...qs.map((q, k) => ({ label: `Part 3 · 第 ${k + 1} / ${qs.length} 题`, secs: p3s, record: true, q: esc(q) }))
      ];
      timer = mountTimer(body.querySelector('#timerBox'), phases, {
        recordable: true,
        fileBase: `P2-${p2No.get(card.id)}`,
        footer: `<div class="row" style="margin-top:14px">${doneBtn('p2:' + card.id)}</div>`,
        onFinish() {
          if (!isDone('p2:' + card.id)) toast('练完了，可以点“标记练过”');
        }
      });
    }
    sel.addEventListener('change', () => {
      card = p2ById.get(sel.value);
      build();
    });
    body.querySelector('#randBtn').addEventListener('click', () => {
      const scope = body.querySelector('#randScope').value;
      let pool = S.p2.filter((c) => matchFilter(c, scope, 'p2') && c.id !== card.id);
      if (!pool.length) {
        toast(scope === 'todo' ? '都练过了，从全部里抽' : '这个范围只有这一张');
        pool = S.p2.filter((c) => c.id !== card.id);
      }
      card = pick(pool);
      build();
    });
    body.querySelector('#p3n').addEventListener('change', (e) => {
      p3n = Number(e.target.value);
      build();
    });
    body.querySelector('#p3s').addEventListener('change', (e) => {
      p3s = Number(e.target.value);
      build();
    });
    build();
    return {
      destroy() {
        if (timer) timer.destroy();
      }
    };
  }

  function practiceP1(body, topicId) {

      const phases = isCore
        ? Array.from({ length: count }, (_, k) => ({ label: `第 ${k + 1} / ${count} 题`, secs }))
        : qs.map(([en, zh], k) => ({ label: `第 ${k + 1} / ${qs.length} 题`, secs, record: true, q: `<div class="p1-q">${esc(en)}</div><div class="muted small">${esc(zh)}</div>` }));
      timer = mountTimer(body.querySelector('#timerBox'), phases, {

      });

      build();

      destroy() {

      }
    };
