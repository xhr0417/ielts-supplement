003ctd>lots of practice\u003c/td>\n\u003ctd>大量练习\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>///\u003cstrong>16. Does anyone help you with your studies?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>do really help me with my studies\u003c/td>\n\u003ctd>确实在学习上帮助了我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I was working on my graduation project\u003c/td>\n\u003ctd>在我做毕业设计的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>provide me with financial support\u003c/td>\n\u003ctd>给我提供经济支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>support my study plans without saying a word\u003c/td>\n\u003ctd>毫无怨言地支持我的学习计划\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h12\">9. How much time do you spend on your studies each week?\u003c/h2>\n\u003cp> Normally, I only spend time going to classes and doing homework, about 20 to 30 hours a week. But \u003cmark>when exams are coming up\u003c/mark> or \u003cmark>there’s a project deadline\u003c/mark>, I’ll \u003cmark>keep studying all day from morning to night\u003c/mark>. The total study time can double, reaching up to 60 hours a week. I guess\u003c/p>\n\u003cp>嗯，要看情况。平时我只花时间上课、完成作业，一周大概 20 到 30 小时，其余时间都用来放松。但临近考试或者有项目截止日期的时候，我会从早到晚不停地学习，总学习时长能翻倍，一周最多达到 60 小时。\u003c/p>\n\u003ch2 id=\"h13\">12. What changes would you like to see in your school?\u003c/h2>\n\u003cp>Well, there are two main changes \u003cmark>I’d like to see\u003c/mark> in my school. First, I really hope the \u003cmark>student apartments\u003c/mark> \u003cmark>can be upgraded\u003c/mark>, as \u003cmark>many facilities there are pretty old.\u003c/mark>\u003cbr>Second, I wish \u003cmark>there were more internship programs\u003c/mark>, so students can \u003cmark>gain more practical work experience\u003c/mark> \u003cmark>before graduation.\u003c/mark>\u003c/p>\n\u003cp>我希望学校能有两个主要的改变。首先，我真心希望能翻新学生寝室，因为里面很多设施都老旧破损了。其次，我希望学校能开设更多实习项目，这样我们就能在毕业前积累更多实际工作经验。\u003c/p>\n\u003ch2 id=\"h14\">13. Do you sometimes feel that you have to study too hard?\u003c/h2>\n\u003cp>Yeah, \u003cmark>sometimes I do feel that way\u003c/mark>, especially when I have to prepare for exams. \u003cmark>I get really stressed.\u003c/mark>\u003cbr>But after those busy weeks, I usually relax by going rock climbing. \u003cmark>It lets me soak in some fresh air\u003c/mark> and \u003cmark>helps me recharge my batteries.\u003c/mark>\u003c/p>\n\u003cp>是的，偶尔我会有这种感觉，尤其是考试和项目截止日期扎堆的时候。我会觉得压力很大、身心俱疲。不过忙碌的几周过后，我通常会去攀岩或者健身来放松。这能让我呼吸新鲜空气，好好给自己充充电。\u003c/p>\n\u003ch2 id=\"h15\">14. What do you like to do just after you finish class every day?\u003c/h2>\n\u003cp>Right after class, I usually go to the library to finish my homework first. Then I’ll \u003cmark>go jogging or hit the gym\u003c/mark> \u003cmark>for about an hour\u003c/mark>. \u003cmark>It’s a good way to relax after studying.\u003c/mark>\u003c/p>\n\u003cp>每天下课之后，我通常先去图书馆完成作业，之后再慢跑或者健身一小时左右。这是学习过后放松的好方式。\u003c/p>\n\u003ch2 id=\"h16\">15. When you started your course, did you find it hard?\u003c/h2>\n\u003cp>Yeah, I found it quite hard \u003cmark>when I first got into university\u003c/mark>. There were so many new \u003cmark>professional courses\u003c/mark> and \u003cmark>hands-on experiments\u003c/mark>. At that time, I didn’t even know how to use a computer. But \u003cmark>I gradually got used to it\u003c/mark> after \u003cmark>lots of practice.\u003c/mark>\u003c/p>\n\u003cp>是的，我刚上大学的时候觉得挺难的。有好多全新的专业课和实操实验。那时候我连电脑都用不太好。但经过大量练习之后，我就慢慢适应了。\u003c/p>\n\u003ch2 id=\"h17\">16. Does anyone help you with your studies?\u003c/h2>\n\u003cp>Yeah, some people \u003cmark>do really help me with my studies\u003c/mark>. My instructor helped me a lot \u003cmark>when I was working on my graduation project\u003c/mark>. And my parents \u003cmark>provide me with financial support\u003c/mark>; they always \u003cmark>support my study plans without saying a world.\u003c/mark>\u003c/p>\n\u003cp>是的，有不少人在学习上帮助我。我的导师在我做毕业设计的时候帮了我很多。我的父母给我提供经济支持，并且一直支持我的学习计划。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What subjects are you studying?"},{"level":2,"id":"h2","text":"2. Do you like your subject?"},{"level":2,"id":"h3","text":"3. Why did you choose to study that subject?"},{"level":2,"id":"h4","text":"4. Do you think that your subject is popular in your country?"},{"level":2,"id":"h5","text":"5. Do you have any plans for your studies in the next five years?"},{"level":2,"id":"h6","text":"6. What are the benefits of being your age?"},{"level":2,"id":"h7","text":"7. Do you want to change your major?"},{"level":2,"id":"h8","text":"8. Do you prefer to study in the mornings or in the afternoons?"},{"level":2,"id":"h9","text":"9. Are you looking forward to working?"},{"level":2,"id":"h10","text":"10. What technology do you use when you study?"},{"level":2,"id":"h11","text":"11. What would you like to do in the future?"},{"level":2,"id":"h12","text":"9. How much time do you spend on your studies each week?"},{"level":2,"id":"h13","text":"12. What changes would you like to see in your school?"},{"level":2,"id":"h14","text":"13. Do you sometimes feel that you have to study too hard?"},{"level":2,"id":"h15","text":"14. What do you like to do just after you finish class every day?"},{"level":2,"id":"h16","text":"15. When you started your course, did you find it hard?"},{"level":2,"id":"h17","text":"16. Does anyone help you with your studies?"}],"text":"What subjects are you studying? Do you like your subject? Why did you choose to study that subject? Do you think that your subject is popular in your country? Do you have any plans for your studies in the next five years? What are the benefits of being your age? Do you want to change your major? Do you prefer to study in the mornings or in the afternoons? Are you looking forward to working? What technology do you use when you study? What would you like to do in the future? 英文短语 中文释义 1. What subjects are you studying? I’ve just finished my undergraduate studies 我刚结束本科阶段的学习 Measurement, Control Technology and Instrument 测控技术与仪器 electronics, mechanical engineering and computer science 电子、机械工程与计算机科学 2. Do you like your subject? hands-on experiments 实验室里的实操实验 professional courses are challenging 专业课有难度 practical engineering knowledge 实用的工程知识 which makes me feel rewarding 让我收获满满 3. Why did you choose to study that subject? I’ve always been fascinated by 我一直对…… 十分着迷 from an early age 从小 employment prospects 就业前景 made up my mind to 下定决心…… 4. Do you think that your subject is popular in your country? subjects associated with engineering 与工程有关的学科 becoming more and more popular these days 如今变得越来越热门 china' s technology is growing rapidly 中国的科技发展迅猛 a huge demand for engineers 对工程师有巨大需求 5. Do you have any plans for your studies in the next five years? finish my master’s degree 完成硕士学业 At the same time 与此同时 take some high-quality internships 参与高质量实习 improve my practical skills 提升实操能力 After graduation 毕业后 work as an engineer 当一名工程师 autonomous driving 自动驾驶 6. What are the benefits of being your age? young enough and full of energy 年轻且精力充沛 I have plenty of time to 我有充足的时间去 try new things and learn different skills 尝试新鲜事物、学习各类技能 much pressure from family 家庭负担 focus on improving myself 专注于提升自我 7. Do you want to change your major? employment prospects 就业前景 I have no reason to change it 我没有理由去改变专业 8. Do you prefer to study in the mornings or in the afternoons? it’s hard to say which I like more 很难说我更喜欢哪个 memorize some knowledge and vocabulary 记忆一些知识和单词 feel more energetic 精力更充沛 solve some difficult problems 解决一些难题 I usually feel tired at that time 那会儿我通常已经很累了 go jogging or hit the gym 慢跑或者健身 9. Are you looking forward to working? really look forward to 十分期待 what real work was like 真实的职场是什么样的 earlier this year 今年年初 did an internship 实习 autonomous driving company 自动驾驶公司 endless work to do 做不完的工作 being a student 当学生 pretty nice 挺好的 at least 至少 have time to do my own things 有时间做自己的事 10. What technology do you use when you study? I basically can’t live without it. 我几乎无法离开它 For those hands-on experiments 做那些实操实验时 I need it to process data 我需要用电脑处理数据 can really help me a lot 真的能帮我很多 when I’m developing software 在我开发软件的时候 11. What would you like to do in the future? embodied robots 具身智能机器人 autonomous driving 自动驾驶 use my professional knowledge to solve real-world problems 用我的专业知识解决现实问题 More specifically 具体来说 optimize self-driving algorithms 优化自动驾驶算法 agile but safe 灵活且安全 1. What subjects are you studying? Well, right now I’ve just finished my undergraduate studies. My major was Measurement, Control Technology and Instrument. It combines electronics, mechanical engineering and computer science. Starting this September, I’ll pursue my master’s degree in Beijing. 我刚结束本科阶段的学习，专业是测控技术与仪器。这门专业融合了电子、机械工程和计算机相关知识。今年九月，我会去北京攻读硕士学位。 2. Do you like your subject? Definitely yes. I really enjoy my studies, especially those hands-on experiments in the lab. Although some professional courses are challenging, I can learn lots of practical engineering knowledge. It always makes me feel really rewarding. 当然喜欢。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。 3. Why did you choose to study that subject? Well, I’ve always been fascinated by electronic devices from an early age. Besides, the employment prospects for this major are really promising in China. So I made up my mind to learn it when I applied for university. 我从小就对各类机械和电子设备十分着迷。除此之外，这个专业在国内就业前景十分可观，所以高考填报志愿时我就下定决心选择它。 4. Do you think that your subject is popular in your country? Yeah, I’d say it’s becoming more and more popular these days. You know, China’s technology is growing rapidly, so there’s a huge demand for engineers. 我认为现在这个专业越来越热门。国内高新产业、制造业发展迅速，市场急需工程类人才， 5. Do you have any plans for your studies in the next five years? Well, first I’ll finish my master’s degree in the next three years. At the same time, I want to take some high-quality internships to improve my practical skills. After graduation, I plan to work as an engineer in the autonomous driving or robotics. 首先，未来三年我会完成硕士学业。与此同时，我打算参与几段高质量实习，以此提升自己的实操能力。毕业后，我计划从事自动驾驶或机器人相关的工程师工作。 6. What are the benefits of being your age? I think the biggest advantage is that I’m young enough and full of energy. I have plenty of time to try new things and learn different skills. Also, I don’t have much pressure from family, so I can fully focus on improving myself. 我觉得处在现在这个年纪最大的好处就是年轻、精力充沛。我有充足时间尝试新鲜事物、学习各类技能，而且没有太多家庭负担，可以全身心提升自己。 7. Do you want to change your major? No, not at all. I’m really interested in engineering, Besides, the employment prospects for this major are really promising in China. so I have no plans to change it. 完全不想换专业。我本身对工科很感兴趣，就业前景很好，所以没有换专业的想法。 8. Do you prefer to study in the mornings or in the afternoons? Well, it’s hard to say which I like more. I usually just memorize some key knowledge and vocabulary in the morning. In the afternoon, I feel more energetic and stay focused, so I always deal with difficult preoblems. But I never study at night. I usually feel tired by then, so I always go jogging or hit the gym. 很难说我更喜欢哪个时段。早上我一般只背诵一些重点知识和单词。下午我精力更充沛、注意力更集中，处理难题的效率更高。但我晚上绝对不学习，那会儿我通常已经很累了，就会去运动。 9. Are you looking forward to working? Yeah, I used to really look forward to working. Last year, I wanted to see what real work was like, But earlier this year, I did an internship at an autonomous driving company. I was really tired. I worked from 10 a.m. to 10 p.m. with endless work to do. Since then, I’ve felt being a student is pretty nice, because at least I have time to do my own things. 是啊，我以前特别期待工作。去年我还想看看真实的职场是什么样，把自己学到的工程知识用到实际工作里。 但今年年初，我在一家自动驾驶公司实习。工作特别累，从早上 10 点忙到晚上 10 点，有做不完的事。从那之后我就觉得当学生挺好的，起码还有时间做自己的事。 10. What technology do you use when you study? Well, I use my laptop almost every day. I basically can’t live without it. For those hands-on experiments, I need it to process data. Apart from this, I also watch some videos to study on Bilibili and YouTube. And AI tools like Claude Code and Codex can really help me a lot when I’m developing software. 我几乎每天都会使用笔记本电脑。做那些实操实验时，我需要用它来处理所有的实验数据。除此之外，我还会在哔哩哔哩和 YouTube 上看视频学习。另外，像 Claude Code 和 Codex 这类人工智能工具，在我开发软件的时候能给我很大帮助。 11. What would you like to do in the future? Well, I’d like to work as an engineer in embodied AI robots and autonomous driving. I hope I can use my professional knowledge to solve real-world problems. In particular, I want to optimize self-driving algorithms to make them agile but safe. 我希望未来能投身具身智能机器人和自动驾驶领域，用自己的专业知识解决现实问题。具体来说，我想优化自动驾驶算法，让它既灵活又安全。 问题 答案第一句话 are you a student or do you work？ Well, right now I’ve just finished my undergraduate studies What subjects are you studying? My major was Measurement, Control Technology and Instrument Do you like your subject? Definitely yes. I really enjoy my studies, Why did you choose to study that subject? Well, I’ve always been fascinated by electronic devices from an early age. Do you think that your subject is popular in your country? Yeah, I’d say it’s becoming more and more popular these days. Do you have any plans for your studies in the next five years? Well, first I’ll finish my master’s degree in the next three years. What are the benefits of being your age? I think the biggest advantage is that I’m young enough and full of energy. Do you want to change your major? No, not at all. Do you prefer to study in the mornings or in the afternoons? Well, it’s hard to say which I like more. Are you looking forward to working? Yeah, I used to really look forward to working. What technology do you use when you study? Well, I use my laptop almost every day. What would you like to do in the future? Well, I’d like to work as an engineer in an autonomous driving company i should spend my most creative years in mathmatics, and if it didn't work out, then i would reevaluate my choice after five years ///9. How much time do you spend on your studies each week? when exams are coming up 考试临近时 there’s a project deadline 有项目截止日期 keep studying all day from morning to night 从早到晚不停地学习 ///12. What changes would you like to see in your school? I’d like to see 我希望看到 student apartments 学生公寓 can be upgraded 能够被升级改造 many facilities there are pretty old 那里很多设施都相当老旧 there were more internship programs 有更多的实习项目 gain more practical work experience 积累更多实际工作经验 before graduation 毕业前 ///13. Do you sometimes feel that you have to study too hard? sometimes I do feel that way 我有时候确实会有这种感觉 I get really stressed 我感到压力很大 It lets me soak in some fresh air 这能让我呼吸新鲜空气 helps me recharge my batteries 帮我恢复精力、给自己充电 ///14. What do you like to do just after you finish class every day? go jogging or hit the gym 慢跑或者健身 for about an hour 大约一小时 It’s a good way to relax after studying 这是学习后放松的好方式 ///15. When you started your course, did you find it hard? when I first got into university 我刚上大学的时候 professional courses 专业课 hands-on experiments 实操实验 I gradually got used to it 我慢慢适应了 lots of practice 大量练习 ///16. Does anyone help you with your studies? do really help me with my studies 确实在学习上帮助了我 when I was working on my graduation project 在我做毕业设计的时候 provide me with financial support 给我提供经济支持 support my study plans without saying a word 毫无怨言地支持我的学习计划 9. How much time do you spend on your studies each week? Normally, I only spend time going to classes and doing homework, about 20 to 30 hours a week. But when exams are coming up or there’s a project deadline, I’ll keep studying all day from morning to night. The total study time can double, reaching up to 60 hours a week. I guess 嗯，要看情况。平时我只花时间上课、完成作业，一周大概 20 到 30 小时，其余时间都用来放松。但临近考试或者有项目截止日期的时候，我会从早到晚不停地学习，总学习时长能翻倍，一周最多达到 60 小时。 12. What changes would you like to see in your school? Well, there are two main changes I’d like to see in my school. First, I really hope the student apartments can be upgraded, as many facilities there are pretty old. Second, I wish there were more internship programs, so students can gain more practical work experience before graduation. 我希望学校能有两个主要的改变。首先，我真心希望能翻新学生寝室，因为里面很多设施都老旧破损了。其次，我希望学校能开设更多实习项目，这样我们就能在毕业前积累更多实际工作经验。 13. Do you sometimes feel that you have to study too hard? Yeah, sometimes I do feel that way, especially when I have to prepare for exams. I get really stressed. But after those busy weeks, I usually relax by going rock climbing. It lets me soak in some fresh air and helps me recharge my batteries. 是的，偶尔我会有这种感觉，尤其是考试和项目截止日期扎堆的时候。我会觉得压力很大、身心俱疲。不过忙碌的几周过后，我通常会去攀岩或者健身来放松。这能让我呼吸新鲜空气，好好给自己充充电。 14. What do you like to do just after you finish class every day? Right after class, I usually go to the library to finish my homework first. Then I’ll go jogging or hit the gym for about an hour. It’s a good way to relax after studying. 每天下课之后，我通常先去图书馆完成作业，之后再慢跑或者健身一小时左右。这是学习过后放松的好方式。 15. When you started your course, did you find it hard? Yeah, I found it quite hard when I first got into university. There were so many new professional courses and hands-on experiments. At that time, I didn’t even know how to use a computer. But I gradually got used to it after lots of practice. 是的，我刚上大学的时候觉得挺难的。有好多全新的专业课和实操实验。那时候我连电脑都用不太好。但经过大量练习之后，我就慢慢适应了。 16. Does anyone help you with your studies? Yeah, some people do really help me with my studies. My instructor helped me a lot when I was working on my graduation project. And my parents provide me with financial support; they always support my study plans without saying a world. 是的，有不少人在学习上帮助我。我的导师在我做毕业设计的时候帮了我很多。我的父母给我提供经济支持，并且一直支持我的学习计划。"},{"id":"a-p1-hometown","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/0.2-必考（hometown）.md","title":"必考 · Hometown","html":"\u003cul>\n\u003cli>\u003c/li>\n\u003cli>\u003cstrong>Where is your hometown?\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Is that a big city or a small place?\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Do you like your hometown?\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>What do you like (most) about your hometown?\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>What&#39;s your hometown famous for?\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. Where is your hometown?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in northwest China\u003c/td>\n\u003ctd>在中国西北部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ancient capital city with thirteen dynasties\u003c/td>\n\u003ctd>十三朝古都\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m really proud of its long history\u003c/td>\n\u003ctd>我为它悠久的历史感到自豪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left my hometown for university\u003c/td>\n\u003ctd>离开家乡去上大学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. Is that a big city or a small place?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a large population\u003c/td>\n\u003ctd>庞大的人口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plenty of universities\u003c/td>\n\u003ctd>众多高校\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>modern shopping malls\u003c/td>\n\u003ctd>现代化商场\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in contrast to\u003c/td>\n\u003ctd>与…… 相比\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>super busy city\u003c/td>\n\u003ctd>十分繁忙的城市\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the pace of life there\u003c/td>\n\u003ctd>那里的生活节奏\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. Do you like your hometown?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I’m back in Xi’an\u003c/td>\n\u003ctd>当我回到西安时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>especially countless types of noodles\u003c/td>\n\u003ctd>尤其是各式各样的面食\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>are not far away\u003c/td>\n\u003ctd>距离不远\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>right to the south of the city\u003c/td>\n\u003ctd>就在西安南边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go hiking whenever I want\u003c/td>\n\u003ctd>随时可以去爬山\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4. What do you like most about your hometown?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>its cuisine\u003c/td>\n\u003ctd>当地美食\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>countless types of noodles\u003c/td>\n\u003ctd>种类繁多的面食\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>suit my taste perfectly\u003c/td>\n\u003ctd>非常合我的胃口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>are not far away\u003c/td>\n\u003ctd>距离不远\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>right to the south of the city\u003c/td>\n\u003ctd>就在城区南边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go hiking there\u003c/td>\n\u003ctd>去那里爬山\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5. What&#39;s your hometown famous for?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is most famous for\u003c/td>\n\u003ctd>因…… 最为出名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>an ancient capital city with thirteen dynasties\u003c/td>\n\u003ctd>十三朝古都\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Terracotta Army\u003c/td>\n\u003ctd>兵马俑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is known all over the world\u003c/td>\n\u003ctd>享誉全球\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>countless types of noodles\u003c/td>\n\u003ctd>各式各样的面食\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>delicious snacks\u003c/td>\n\u003ctd>美味小吃\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>1. Where is your hometown?\u003c/h4>\n\u003cp>I’m from Xi’an, Shaanxi Province \u003cmark>in northwest China\u003c/mark>. It’s an \u003cmark>ancient capital city with thirteen dynasties\u003c/mark>, and \u003cmark>I’m really proud of its long history.\u003c/mark> I lived there until I was 18 years old. At that time, I \u003cmark>left my hometown for university\u003c/mark> in Wuhan.\u003c/p>\n\u003cp>我来自中国西北部的陕西省西安市。它是一座十三朝古都，我为它悠久的历史感到自豪。我去武汉上大学之前，一直生活在那里。\u003c/p>\n\u003chr>\n\u003ch4>2. Is that a big city or a small place?\u003c/h4>\n\u003cp>It’s definitely a big city. It has \u003cmark>a large population\u003c/mark>, \u003cmark>plenty of universities\u003c/mark> and \u003cmark>modern shopping malls\u003c/mark>. But \u003cmark>in contrast to\u003c/mark> a \u003cmark>super busy city\u003c/mark> like Beijing, \u003cmark>the pace of life there\u003c/mark> is quite relaxing.\u003c/p>\n\u003cp>它绝对是一座大城市。人口很多，有大量高校和现代化商场。但和北京这种节奏极快的城市比，西安的生活节奏挺放松的。\u003c/p>\n\u003chr>\n\u003ch4>3. Do you like your hometown?\u003c/h4>\n\u003cp>Yes, I really do. I always feel really comfortable \u003cmark>when I’m back in Xi’an.\u003c/mark> Besides, I am deeply fond of its local food, \u003cmark>especially countless noodles\u003c/mark>. What’s more, the Qinling Mountains \u003cmark>are not far away\u003c/mark>, \u003cmark>right to the south of Xian, ==so I can ==go hiking whenever I want.\u003c/mark>\u003c/p>\n\u003cp>是的，我非常喜欢。每当回到西安，我都会感觉十分舒心。此外，我十分喜爱当地美食，尤其是各式各样的面食。而且秦岭距离不远，就在西安南边，我随时都可以去爬山。\u003c/p>\n\u003chr>\n\u003ch4>4. What do you like most about your hometown?\u003c/h4>\n\u003cp>What I like most about my hometown is \u003cmark>its cuisine\u003c/mark>. It is an ancient capital of thirteen dynasties with \u003cmark>countless types of noodles\u003c/mark>, and they \u003cmark>suit my taste perfectly\u003c/mark>. Apart from delicious food, the Qinling Mountains  \u003cmark>are not far away\u003c/mark>, \u003cmark>right to the south of the city.\u003c/mark> I always \u003cmark>go hiking there\u003c/mark> with my friends on weekends.\u003c/p>\n\u003cp>我最喜欢家乡的美食。这里是十三朝古都，面食种类繁多，非常合我的胃口。除了美食之外，秦岭离得很近，就在城区南边。周末我可以和好朋友去爬山\u003c/p>\n\u003chr>\n\u003ch4>5. What&#39;s your hometown famous for?\u003c/h4>\n\u003cp>Xi’an \u003cmark>is most famous for\u003c/mark> being \u003cmark>an ancient capital city with thirteen dynasties.\u003c/mark> The \u003cmark>Terracotta Army\u003c/mark> there \u003cmark>is known all over the world.\u003c/mark>  It’s also famous for \u003cmark>countless types of noodles\u003c/mark> and \u003cmark>delicious snacks\u003c/mark> like roujiamo.\u003c/p>\n\u003cp>西安最为出名的是它十三朝古都的身份。这里的兵马俑享誉全球。同时，这里各式各样的面食以及肉夹馍这类美味小吃也十分有名。\u003c/p>\n","toc":[],"text":"Where is your hometown? Is that a big city or a small place? Do you like your hometown? What do you like (most) about your hometown? What's your hometown famous for? 英文短语 中文释义 1. Where is your hometown? in northwest China 在中国西北部 ancient capital city with thirteen dynasties 十三朝古都 I’m really proud of its long history 我为它悠久的历史感到自豪 left my hometown for university 离开家乡去上大学 2. Is that a big city or a small place? a large population 庞大的人口 plenty of universities 众多高校 modern shopping malls 现代化商场 in contrast to 与…… 相比 super busy city 十分繁忙的城市 the pace of life there 那里的生活节奏 3. Do you like your hometown? when I’m back in Xi’an 当我回到西安时 especially countless types of noodles 尤其是各式各样的面食 are not far away 距离不远 right to the south of the city 就在西安南边 go hiking whenever I want 随时可以去爬山 4. What do you like most about your hometown? its cuisine 当地美食 countless types of noodles 种类繁多的面食 suit my taste perfectly 非常合我的胃口 are not far away 距离不远 right to the south of the city 就在城区南边 go hiking there 去那里爬山 5. What's your hometown famous for? is most famous for 因…… 最为出名 an ancient capital city with thirteen dynasties 十三朝古都 Terracotta Army 兵马俑 is known all over the world 享誉全球 countless types of noodles 各式各样的面食 delicious snacks 美味小吃 1. Where is your hometown? I’m from Xi’an, Shaanxi Province in northwest China. It’s an ancient capital city with thirteen dynasties, and I’m really proud of its long history. I lived there until I was 18 years old. At that time, I left my hometown for university in Wuhan. 我来自中国西北部的陕西省西安市。它是一座十三朝古都，我为它悠久的历史感到自豪。我去武汉上大学之前，一直生活在那里。 2. Is that a big city or a small place? It’s definitely a big city. It has a large population, plenty of universities and modern shopping malls. But in contrast to a super busy city like Beijing, the pace of life there is quite relaxing. 它绝对是一座大城市。人口很多，有大量高校和现代化商场。但和北京这种节奏极快的城市比，西安的生活节奏挺放松的。 3. Do you like your hometown? Yes, I really do. I always feel really comfortable when I’m back in Xi’an. Besides, I am deeply fond of its local food, especially countless noodles. What’s more, the Qinling Mountains are not far away, right to the south of Xian, ==so I can ==go hiking whenever I want. 是的，我非常喜欢。每当回到西安，我都会感觉十分舒心。此外，我十分喜爱当地美食，尤其是各式各样的面食。而且秦岭距离不远，就在西安南边，我随时都可以去爬山。 4. What do you like most about your hometown? What I like most about my hometown is its cuisine. It is an ancient capital of thirteen dynasties with countless types of noodles, and they suit my taste perfectly. Apart from delicious food, the Qinling Mountains are not far away, right to the south of the city. I always go hiking there with my friends on weekends. 我最喜欢家乡的美食。这里是十三朝古都，面食种类繁多，非常合我的胃口。除了美食之外，秦岭离得很近，就在城区南边。周末我可以和好朋友去爬山 5. What's your hometown famous for? Xi’an is most famous for being an ancient capital city with thirteen dynasties. The Terracotta Army there is known all over the world. It’s also famous for countless types of noodles and delicious snacks like roujiamo. 西安最为出名的是它十三朝古都的身份。这里的兵马俑享誉全球。同时，这里各式各样的面食以及肉夹馍这类美味小吃也十分有名。"},{"id":"a-p1-home","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/0.3-必考（Home & Accommodation）.md","title":"必考 · Home & Accommodation","html":"\u003col>\n\u003cli>Who do you live with?\u003c/li>\n\u003cli>Do you live in an apartment or a house?\u003c/li>\n\u003cli>What part of your home do you like the most?\u003c/li>\n\u003cli>Is there anything you dislike about your home?\u003c/li>\n\u003cli>What kind of house or apartment do you want to live in in the future?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. Who do you live with?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>back in Xi’an\u003c/td>\n\u003ctd>在西安\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get along really well\u003c/td>\n\u003ctd>相处十分融洽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What I appreciate most\u003c/td>\n\u003ctd>我最感恩的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give me a lot of freedom\u003c/td>\n\u003ctd>给予我很多自由\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>to do whatever I want\u003c/td>\n\u003ctd>做我想做的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>support my study plans\u003c/td>\n\u003ctd>支持我的学业规划\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. Do you live in an apartment or a house?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not huge but comfortable\u003c/td>\n\u003ctd>不算大但是很舒适\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>separate rooms for studying and resting\u003c/td>\n\u003ctd>独立的房间用来学习和休息\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>do their own things\u003c/td>\n\u003ctd>每个人都可以做自己喜欢的事情\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. What part of your home do you like the most?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>personal study room\u003c/td>\n\u003ctd>书房\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>focus on reading and doing my own things\u003c/td>\n\u003ctd>专心看书、做自己的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>without too many distractions\u003c/td>\n\u003ctd>不容易受到干扰\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4. Is there anything you dislike about your home?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there’s not much I dislike\u003c/td>\n\u003ctd>没什么我不满意的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>only tiny problem\u003c/td>\n\u003ctd>唯一小小的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>occasional noise outside\u003c/td>\n\u003ctd>外面偶尔的噪音\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>disturbs my study\u003c/td>\n\u003ctd>打扰我的学习\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5. What kind of house or apartment do you want to live in in the future?\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>does not need to be huge\u003c/td>\n\u003ctd>不需要很大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just big enough for my daily life\u003c/td>\n\u003ctd>满足日常生活所需\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I love cooking for myself\u003c/td>\n\u003ctd>喜欢自己做饭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it would be perfect\u003c/td>\n\u003ctd>那就再好不过了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>close to a park\u003c/td>\n\u003ctd>靠近公园\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be used to going jogging in the early morning\u003c/td>\n\u003ctd>习惯清晨慢跑\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Who do you live with?\u003c/h2>\n\u003cp>I live with my parents \u003cmark>back in Xi’an\u003c/mark>. We \u003cmark>get along really well\u003c/mark>. \u003cmark>What I appreciate most\u003c/mark> is that my parents \u003cmark>give me a lot of freedom\u003c/mark> \u003cmark>to do whatever I want\u003c/mark>, and they really \u003cmark>support my study plans.\u003c/mark>\u003c/p>\n\u003cp>我在西安和父母同住。我们相处十分融洽。我最感恩的是父母给予我很多自由，让我可以做自己想做的事，并且全力支持我的学业规划。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you live in an apartment or a house?\u003c/h2>\n\u003cp>I live in an apartment. It is \u003cmark>not huge but comfortable\u003c/mark>. We have \u003cmark>separate rooms for studying and resting\u003c/mark>, so everyone can do \u003cmark>their own things.\u003c/mark>\u003c/p>\n\u003cp>我住在公寓里。房子不算大但是很舒适。我们拥有独立的房间用来学习和休息，每个人都能拥有私人空间。\u003c/p>\n\u003ch2 id=\"h3\">3. What part of your home do you like the most?\u003c/h2>\n\u003cp>My \u003cmark>personal study room\u003c/mark> is my favourite place. I usually \u003cmark>read books\u003c/mark>, \u003cmark>watch movies\u003c/mark> and \u003cmark>play computer games\u003c/mark> there in my spare time. It is \u003cmark>quiet enough for me to concentrate.\u003c/mark>\u003c/p>\n\u003cp>我最喜欢家里的书房。那里很安静，我可以专心看书、完成自己的事情，不容易受到干扰。\u003c/p>\n\u003ch2 id=\"h4\">4. \u003cstrong>Is there anything you dislike about your home?\u003c/strong>\u003c/h2>\n\u003cp>Honestly, \u003cmark>there’s not much I dislike\u003c/mark>. The \u003cmark>\u003cstrong>only tiny problem\u003c/strong>\u003c/mark> is \u003cmark>\u003cstrong>occasional noise outside\u003c/strong>,\u003c/mark> which \u003cmark>\u003cstrong>disturbs my study\u003c/strong>\u003c/mark> sometimes.\u003c/p>\n\u003cp>说实话，我没什么不满意的地方。唯一小小的问题就是外面偶尔会有噪音，有时候会打扰我学习。\u003c/p>\n\u003ch2 id=\"h5\">5. What kind of house or apartment do you want to live in in the future?\u003c/h2>\n\u003cp>Well, it \u003cmark>does not need to be huge\u003c/mark>, \u003cmark>just big enough for my daily life\u003c/mark>. I hope there is a big kitchen because \u003cmark>I love cooking for myself.\u003c/mark>\u003cbr>Besides, \u003cmark>it would be perfect\u003c/mark> if it is \u003cmark>close to a park\u003c/mark>, since \u003cmark>I’m used to going jogging in the early morning.\u003c/mark>\u003c/p>\n\u003cp>不需要很大，满足日常生活所需就够了。我希望有一间宽敞的厨房，因为我喜欢自己做饭。除此之外，如果房子离公园很近就再好不过了，我习惯清晨出门跑步。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Who do you live with?"},{"level":2,"id":"h2","text":"2. Do you live in an apartment or a house?"},{"level":2,"id":"h3","text":"3. What part of your home do you like the most?"},{"level":2,"id":"h4","text":"4. Is there anything you dislike about your home?"},{"level":2,"id":"h5","text":"5. What kind of house or apartment do you want to live in in the future?"}],"text":"Who do you live with? Do you live in an apartment or a house? What part of your home do you like the most? Is there anything you dislike about your home? What kind of house or apartment do you want to live in in the future? 英文短语 中文释义 1. Who do you live with? back in Xi’an 在西安 get along really well 相处十分融洽 What I appreciate most 我最感恩的是 give me a lot of freedom 给予我很多自由 to do whatever I want 做我想做的事 support my study plans 支持我的学业规划 2. Do you live in an apartment or a house? not huge but comfortable 不算大但是很舒适 separate rooms for studying and resting 独立的房间用来学习和休息 do their own things 每个人都可以做自己喜欢的事情 3. What part of your home do you like the most? personal study room 书房 focus on reading and doing my own things 专心看书、做自己的事 without too many distractions 不容易受到干扰 4. Is there anything you dislike about your home? there’s not much I dislike 没什么我不满意的地方 only tiny problem 唯一小小的问题 occasional noise outside 外面偶尔的噪音 disturbs my study 打扰我的学习 5. What kind of house or apartment do you want to live in in the future? does not need to be huge 不需要很大 just big enough for my daily life 满足日常生活所需 I love cooking for myself 喜欢自己做饭 it would be perfect 那就再好不过了 close to a park 靠近公园 be used to going jogging in the early morning 习惯清晨慢跑 1. Who do you live with? I live with my parents back in Xi’an. We get along really well. What I appreciate most is that my parents give me a lot of freedom to do whatever I want, and they really support my study plans. 我在西安和父母同住。我们相处十分融洽。我最感恩的是父母给予我很多自由，让我可以做自己想做的事，并且全力支持我的学业规划。 2. Do you live in an apartment or a house? I live in an apartment. It is not huge but comfortable. We have separate rooms for studying and resting, so everyone can do their own things. 我住在公寓里。房子不算大但是很舒适。我们拥有独立的房间用来学习和休息，每个人都能拥有私人空间。 3. What part of your home do you like the most? My personal study room is my favourite place. I usually read books, watch movies and play computer games there in my spare time. It is quiet enough for me to concentrate. 我最喜欢家里的书房。那里很安静，我可以专心看书、完成自己的事情，不容易受到干扰。 4. Is there anything you dislike about your home? Honestly, there’s not much I dislike. The only tiny problem is occasional noise outside, which disturbs my study sometimes. 说实话，我没什么不满意的地方。唯一小小的问题就是外面偶尔会有噪音，有时候会打扰我学习。 5. What kind of house or apartment do you want to live in in the future? Well, it does not need to be huge, just big enough for my daily life. I hope there is a big kitchen because I love cooking for myself. Besides, it would be perfect if it is close to a park, since I’m used to going jogging in the early morning. 不需要很大，满足日常生活所需就够了。我希望有一间宽敞的厨房，因为我喜欢自己做饭。除此之外，如果房子离公园很近就再好不过了，我习惯清晨出门跑步。"},{"id":"a-p1-other","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/0.4-其他.md","title":"其他 · Hobbies","html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>plenty of hobbies\u003c/td>\n\u003ctd>不少爱好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a member of the school team\u003c/td>\n\u003ctd>校队成员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>trained seriously for several years\u003c/td>\n\u003ctd>认真训练了好几年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>going professional\u003c/td>\n\u003ctd>走职业道路；成为职业选手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I didn’t succeed\u003c/td>\n\u003ctd>我没能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so I gave up and turned to running.\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I could only run for 5 km\u003c/td>\n\u003ctd>我只能跑 5 公里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term training\u003c/td>\n\u003ctd>长期训练\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>completed the Xi’an Marathon\u003c/td>\n\u003ctd>跑完西安马拉松\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>back in 2024\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下十分深刻的印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>got into\u003c/td>\n\u003ctd>迷上；开始爱好\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What hobbies do you have?\u003c/h2>\n\u003cp>I have \u003cmark>plenty of hobbies\u003c/mark>. I started to play football when I was in my primary school, and I was \u003cmark>a member of the school team\u003c/mark> . I \u003cmark>trained seriously for several years\u003c/mark> and even thought of going professional. But unfortunately, \u003cmark>I didn’t succeed\u003c/mark>, so I gave up and turned to running.\u003cbr>At first \u003cmark>I could only run for 5 km\u003c/mark>. After long-term training. Finally, \u003cmark>I completed the Xi’an Marathon\u003c/mark> back in 2024, which really left a deep impression on me.\u003cbr>These days, I’ve \u003cmark>got into\u003c/mark> rock climbing.\u003c/p>\n\u003cp>我有不少爱好。我小学开始踢足球，而且是校队成员。我认真训练了好几年，甚至考虑过走职业道路。但可惜没能成功，于是我放弃足球，开始跑步。\u003cbr>起初我只能跑 5 公里。经过长期训练，我最终在 2024 年跑完西安马拉松，这段经历给我留下了十分深刻的印象。\u003cbr>最近，我迷上了攀岩。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What hobbies do you have?"}],"text":"英文短语 中文释义 plenty of hobbies 不少爱好 a member of the school team 校队成员 trained seriously for several years 认真训练了好几年 going professional 走职业道路；成为职业选手 I didn’t succeed 我没能成功 so I gave up and turned to running. I could only run for 5 km 我只能跑 5 公里 long-term training 长期训练 completed the Xi’an Marathon 跑完西安马拉松 back in 2024 left a deep impression on me 给我留下十分深刻的印象 got into 迷上；开始爱好 1. What hobbies do you have? I have plenty of hobbies. I started to play football when I was in my primary school, and I was a member of the school team . I trained seriously for several years and even thought of going professional. But unfortunately, I didn’t succeed, so I gave up and turned to running. At first I could only run for 5 km. After long-term training. Finally, I completed the Xi’an Marathon back in 2024, which really left a deep impression on me. These days, I’ve got into rock climbing. 我有不少爱好。我小学开始踢足球，而且是校队成员。我认真训练了好几年，甚至考虑过走职业道路。但可惜没能成功，于是我放弃足球，开始跑步。 起初我只能跑 5 公里。经过长期训练，我最终在 2024 年跑完西安马拉松，这段经历给我留下了十分深刻的印象。 最近，我迷上了攀岩。"},{"id":"a-p1-watch","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/1-watch.md","title":"Watch","html":"\u003cul>\n\u003cli>Do you wear a watch?\u003c/li>\n\u003cli>Have you ever got a watch as a gift?\u003c/li>\n\u003cli>Why do some people wear expensive watches?\u003c/li>\n\u003cli>Do you think it is important to wear a watch? Why?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>to be honest\u003c/td>\n\u003ctd>说实话，说真的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>all the time\u003c/td>\n\u003ctd>时时刻刻，一直\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>basically can’t live without it\u003c/td>\n\u003ctd>几乎离不开它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>its main function for me is\u003c/td>\n\u003ctd>对我来说它最主要的用处是，，，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>track physical health data\u003c/td>\n\u003ctd>监测身体健康数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hit the gym\u003c/td>\n\u003ctd>健身，去健身房锻炼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>records my heart rate\u003c/td>\n\u003ctd>记录我的心率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>super practical\u003c/td>\n\u003ctd>特别实用\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>as a birthday gift\u003c/td>\n\u003ctd>作为生日礼物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so they picked this one specially for\u003c/td>\n\u003ctd>专门用来……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it&#39;s absolutely the most practical\u003c/td>\n\u003ctd>绝对是最实用的\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>two main reasons for this\u003c/td>\n\u003ctd>主要有两点原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>quite a few people\u003c/td>\n\u003ctd>不少人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a symbol of social status\u003c/td>\n\u003ctd>社会地位的象征\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>show their wealth and taste\u003c/td>\n\u003ctd>展示他们的财富和品味\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attend business meetings\u003c/td>\n\u003ctd>出席商务会谈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>social events\u003c/td>\n\u003ctd>社交活动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>delicate craft\u003c/td>\n\u003ctd>精巧的工艺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>collect them as hobbies\u003c/td>\n\u003ctd>把收藏某物当作爱好\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I have to admit\u003c/td>\n\u003ctd>不得不说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>level up your style\u003c/td>\n\u003ctd>提升你的气质\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look more professional\u003c/td>\n\u003ctd>看起来更专业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>show off your personality without saying a word.\u003c/td>\n\u003ctd>展现你的个性,不用说一句话\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you wear a watch?\u003c/h2>\n\u003cp>\u003cmark>Well, to be honest\u003c/mark>, I wear a watch \u003cmark>all the time\u003c/mark>. and \u003cmark>I basically can’t live without it\u003c/mark>. \u003cmark>Its main function for me\u003c/mark> is tracking my physical health data. Whenever I go running, hit the gym or climb mountains on weekends, it records my heart rate, pace and other exercise data.  \u003cmark>It’s super practical\u003c/mark>\u003c/p>\n\u003cp>没错，说真的，我每时每刻都会戴手表，我几乎离不开它。对我来说它最主要的用处是监测身体健康数据。每当我跑步、健身，或是周末去爬山时，它都会记录我的心率、配速还有其他运动数据。它特别实用。\u003c/p>\n\u003ch2 id=\"h2\">2. Have you ever got a watch as a gift?\u003c/h2>\n\u003cp>Yeah, I actually received a smartwatch \u003cmark>as a birthday gift\u003c/mark> from my parents last year. They knew I love sports, so they picked this one \u003cmark>specially for\u003c/mark> tracking my exercise data. \u003cmark>It’s absolutely the most practical\u003c/mark> present I’ve ever gotten.\u003c/p>\n\u003cp>有的，去年生日我爸妈送了我一块智能手表当礼物。他们知道我喜欢运动，所以特意选了这款可以记录运动数据的手表。这绝对是我收到过最实用的礼物。\u003c/p>\n\u003ch2 id=\"h3\">3. Why do some people wear expensive watches?\u003c/h2>\n\u003cp>Well, \u003cmark>I think there are two main reasons for this\u003c/mark>. First of all，\u003cmark>quite a few people\u003c/mark> treat expensive watches \u003cmark>as a symbol of social status\u003c/mark>.They believe expensive watches can show their wealth and taste\u003cbr>Besides, some people  just love the \u003cmark>delicate craft\u003c/mark> of mechanical watches and \u003cmark>collect them as hobbies\u003c/mark>.\u003cbr>我认为主要有两点原因。首先，不少人将名贵手表视作社会地位的象征。他们觉得出席商务会谈或社交活动时，昂贵腕表能彰显自身财力与品味。\u003cbr>除此之外，还有一部分人单纯喜爱机械表精巧的工艺，并把收藏手表当作爱好。\u003c/p>\n\u003ch2 id=\"h4\">4. Do you think it is important to wear a watch? Why?\u003c/h2>\n\u003cp>Yes,abusolutely. \u003cmark>I have to admit\u003c/mark>, wearing a watch can really \u003cmark>level up\u003c/mark> your style and \u003cmark>make you look more professional\u003c/mark>. It’s also a nice way to \u003cmark>show off\u003c/mark> your personality without saying a word.\u003c/p>\n\u003cp>现在我一般都是直接看手机时间，确实更方便。不过不得不说，戴手表真的能提升你的气质，让你看起来更专业。而且，手表也是个很好的方式，能展示你的个性，不用多说一句话。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you wear a watch?"},{"level":2,"id":"h2","text":"2. Have you ever got a watch as a gift?"},{"level":2,"id":"h3","text":"3. Why do some people wear expensive watches?"},{"level":2,"id":"h4","text":"4. Do you think it is important to wear a watch? Why?"}],"text":"Do you wear a watch? Have you ever got a watch as a gift? Why do some people wear expensive watches? Do you think it is important to wear a watch? Why? 英文短语 中文释义 to be honest 说实话，说真的 all the time 时时刻刻，一直 basically can’t live without it 几乎离不开它 its main function for me is 对我来说它最主要的用处是，，， track physical health data 监测身体健康数据 hit the gym 健身，去健身房锻炼 records my heart rate 记录我的心率 super practical 特别实用 as a birthday gift 作为生日礼物 so they picked this one specially for 专门用来…… it's absolutely the most practical 绝对是最实用的 two main reasons for this 主要有两点原因 quite a few people 不少人 a symbol of social status 社会地位的象征 show their wealth and taste 展示他们的财富和品味 attend business meetings 出席商务会谈 social events 社交活动 delicate craft 精巧的工艺 collect them as hobbies 把收藏某物当作爱好 I have to admit 不得不说 level up your style 提升你的气质 look more professional 看起来更专业 show off your personality without saying a word. 展现你的个性,不用说一句话 1. Do you wear a watch? Well, to be honest, I wear a watch all the time. and I basically can’t live without it. Its main function for me is tracking my physical health data. Whenever I go running, hit the gym or climb mountains on weekends, it records my heart rate, pace and other exercise data. It’s super practical 没错，说真的，我每时每刻都会戴手表，我几乎离不开它。对我来说它最主要的用处是监测身体健康数据。每当我跑步、健身，或是周末去爬山时，它都会记录我的心率、配速还有其他运动数据。它特别实用。 2. Have you ever got a watch as a gift? Yeah, I actually received a smartwatch as a birthday gift from my parents last year. They knew I love sports, so they picked this one specially for tracking my exercise data. It’s absolutely the most practical present I’ve ever gotten. 有的，去年生日我爸妈送了我一块智能手表当礼物。他们知道我喜欢运动，所以特意选了这款可以记录运动数据的手表。这绝对是我收到过最实用的礼物。 3. Why do some people wear expensive watches? Well, I think there are two main reasons for this. First of all，quite a few people treat expensive watches as a symbol of social status.They believe expensive watches can show their wealth and taste Besides, some people just love the delicate craft of mechanical watches and collect them as hobbies. 我认为主要有两点原因。首先，不少人将名贵手表视作社会地位的象征。他们觉得出席商务会谈或社交活动时，昂贵腕表能彰显自身财力与品味。 除此之外，还有一部分人单纯喜爱机械表精巧的工艺，并把收藏手表当作爱好。 4. Do you think it is important to wear a watch? Why? Yes,abusolutely. I have to admit, wearing a watch can really level up your style and make you look more professional. It’s also a nice way to show off your personality without saying a word. 现在我一般都是直接看手机时间，确实更方便。不过不得不说，戴手表真的能提升你的气质，让你看起来更专业。而且，手表也是个很好的方式，能展示你的个性，不用多说一句话。"},{"id":"a-p1-car","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/2-car.md","title":"Car","html":"\u003cul>\n\u003cli>Do you think car colours are important?\u003c/li>\n\u003cli>Did you enjoy traveling by car when you were a kid?\u003c/li>\n\u003cli>What types of cars do you like?\u003c/li>\n\u003cli>Do you prefer to be a driver or a passenger?\u003c/li>\n\u003cli>What do you usually do when there is a traffic jam?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>picking a car colour can be a real headache\u003c/td>\n\u003ctd>挑选汽车颜色实在令人头疼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stand out from the crowd\u003c/td>\n\u003ctd>脱颖而出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>play it safe\u003c/td>\n\u003ctd>求稳，做出稳妥选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go for black, white, or grey\u003c/td>\n\u003ctd>选择黑色、白色或者灰色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reflect your personality\u003c/td>\n\u003ctd>反映你的个性\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>travelling by car\u003c/td>\n\u003ctd>乘车出游、自驾出行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>drive me to the Qinling Mountains\u003c/td>\n\u003ctd>开车带我去秦岭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>are not far away\u003c/td>\n\u003ctd>距离不远\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>right to the south of the city\u003c/td>\n\u003ctd>就在城区南边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>went hiking there\u003c/td>\n\u003ctd>去那里爬山\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cannot do that any more\u003c/td>\n\u003ctd>再也不能这样做\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s not allowed now\u003c/td>\n\u003ctd>现在被禁止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>protect water sources\u003c/td>\n\u003ctd>保护水源\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have a strong preference for electric cars\u003c/td>\n\u003ctd>格外偏爱电动汽车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>eco-friendly\u003c/td>\n\u003ctd>环保的，环境友好的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fill it up with petrol\u003c/td>\n\u003ctd>给车加油\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>charge the car\u003c/td>\n\u003ctd>给车充电\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be equipped with an autonomous driving system\u003c/td>\n\u003ctd>配备自动驾驶系统\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get my hands on a Tesla\u003c/td>\n\u003ctd>入手 / 拥有一辆特斯拉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>far too expensive for me right now\u003c/td>\n\u003ctd>目前对我来说太贵\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when it becomes cheaper in the future\u003c/td>\n\u003ctd>等到未来降价之后\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>I prefer both role of them\u003c/mark>\u003c/td>\n\u003ctd>两种我都喜欢\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>swap drivers at service stations\u003c/td>\n\u003ctd>在服务区轮换司机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when driving on mountain roads\u003c/td>\n\u003ctd>行驶在山路上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enjoy the fun of driving\u003c/td>\n\u003ctd>享受驾驶的乐趣\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>listen to podcasts about technology and AI\u003c/td>\n\u003ctd>收听科技与人工智能类播客\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>helps me stay sane\u003c/td>\n\u003ctd>让我保持心态平稳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give my parents a call\u003c/td>\n\u003ctd>给父母打电话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>chat with them\u003c/td>\n\u003ctd>和他们闲聊\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you think car colours are important?\u003c/h2>\n\u003cp>Honestly, picking a car colour \u003cmark>can be a real headache\u003c/mark>, especially when you want to \u003cmark>stand out from the crowd\u003c/mark>. Most people just \u003cmark>play it safe\u003c/mark> and \u003cmark>go for black, white, or grey,\u003c/mark> but I think the colour actually \u003cmark>reflects your personality.\u003c/mark>\u003c/p>\n\u003cp>说实话，选汽车颜色真的挺头疼的，特别是当你想要在人群中脱颖而出的时候。大多数人都喜欢求稳，选黑色、白色或者灰色，但我觉得颜色其实能反映你的个性。\u003c/p>\n\u003ch2 id=\"h2\">2. Did you enjoy traveling by car when you were a kid?\u003c/h2>\n\u003cp>I have always been fascinated by travelling by car since I was a kid. When I was in my primary school, my parents would \u003cmark>drive me to the Qinling Mountains\u003c/mark> on weekends.\u003cbr>The mountains \u003cmark>are not far away,\u003c/mark> \u003cmark>right to the south of the city.\u003c/mark> We often \u003cmark>went hiking there.\u003c/mark> Sadly, \u003cmark>we cannot do that any more\u003c/mark>, because \u003cmark>it’s not allowed now\u003c/mark> \u003cmark>to protect water sources.\u003c/mark>\u003c/p>\n\u003cp>从小我就很喜欢自驾出行。上小学的时候，父母每到周末都会开车带我去秦岭。\u003cbr>秦岭离市区不远，就在城市南边。我们经常去那儿爬山。可惜现在不能这么做了，为了保护水源，相关出行已经被禁止。\u003c/p>\n\u003ch2 id=\"h3\">3. What types of cars do you like?\u003c/h2>\n\u003cp>\u003cmark>I have a strong preference for electric cars\u003c/mark>, because they are \u003cmark>eco-friendly\u003c/mark>. You don&#39;t need to \u003cmark>fill it up with petrol\u003c/mark>, I just need to \u003cmark>charge the car.\u003c/mark> Besides, \u003cmark>they are equipped with an autonomous driving system.\u003c/mark>\u003cbr>I really hope I can \u003cmark>get my hands on a Tesla,\u003c/mark> but \u003cmark>it is far too expensive for me right now.\u003c/mark> Maybe I can buy one \u003cmark>when it becomes cheaper in the future.\u003c/mark>\u003c/p>\n\u003cp>我格外偏爱电动汽车，因为它们环保。电动汽车不需要加油，我只需要给车充电。此外，车辆配备了自动驾驶系统。\u003cbr>我特别希望能拥有一辆特斯拉，但目前对我来说太贵了。或许等它以后降价，我就能入手一台。\u003c/p>\n\u003ch2 id=\"h4\">4. Do you prefer to be a driver or a passenger?\u003c/h2>\n\u003cp>\u003cmark>I prefer both role of them\u003c/mark>, actually. When I travel with friends. We usually \u003cmark>swap drivers at service stations\u003c/mark> every two hours. Especially \u003cmark>when driving on mountain roads\u003c/mark>, I really \u003cmark>enjoy the fun of driving.\u003c/mark>\u003c/p>\n\u003cp>其实两种我都喜欢。我和朋友出行时会轮流开车，一般每隔两小时就在服务区换司机。尤其是行驶在山路上的时候，我十分享受驾驶的乐趣。\u003c/p>\n\u003ch2 id=\"h5\">5. What do you usually do when there is a traffic jam?\u003c/h2>\n\u003cp>I usually \u003cmark>listen to podcasts about technology and AI.\u003c/mark> It \u003cmark>helps me stay sane\u003c/mark>. Sometimes I also \u003cmark>give my parents a call\u003c/mark> and \u003cmark>chat with them.\u003c/mark>\u003c/p>\n\u003cp>遇上堵车的时候，我常会收听科技和人工智能相关的播客，这能让我保持心态平稳。我也会给父母打电话闲聊几句。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you think car colours are important?"},{"level":2,"id":"h2","text":"2. Did you enjoy traveling by car when you were a kid?"},{"level":2,"id":"h3","text":"3. What types of cars do you like?"},{"level":2,"id":"h4","text":"4. Do you prefer to be a driver or a passenger?"},{"level":2,"id":"h5","text":"5. What do you usually do when there is a traffic jam?"}],"text":"Do you think car colours are important? Did you enjoy traveling by car when you were a kid? What types of cars do you like? Do you prefer to be a driver or a passenger? What do you usually do when there is a traffic jam? 英文短语 中文释义 picking a car colour can be a real headache 挑选汽车颜色实在令人头疼 stand out from the crowd 脱颖而出 play it safe 求稳，做出稳妥选择 go for black, white, or grey 选择黑色、白色或者灰色 reflect your personality 反映你的个性 travelling by car 乘车出游、自驾出行 drive me to the Qinling Mountains 开车带我去秦岭 are not far away 距离不远 right to the south of the city 就在城区南边 went hiking there 去那里爬山 cannot do that any more 再也不能这样做 it’s not allowed now 现在被禁止 protect water sources 保护水源 have a strong preference for electric cars 格外偏爱电动汽车 eco-friendly 环保的，环境友好的 fill it up with petrol 给车加油 charge the car 给车充电 be equipped with an autonomous driving system 配备自动驾驶系统 get my hands on a Tesla 入手 / 拥有一辆特斯拉 far too expensive for me right now 目前对我来说太贵 when it becomes cheaper in the future 等到未来降价之后 I prefer both role of them 两种我都喜欢 swap drivers at service stations 在服务区轮换司机 when driving on mountain roads 行驶在山路上 enjoy the fun of driving 享受驾驶的乐趣 listen to podcasts about technology and AI 收听科技与人工智能类播客 helps me stay sane 让我保持心态平稳 give my parents a call 给父母打电话 chat with them 和他们闲聊 1. Do you think car colours are important? Honestly, picking a car colour can be a real headache, especially when you want to stand out from the crowd. Most people just play it safe and go for black, white, or grey, but I think the colour actually reflects your personality. 说实话，选汽车颜色真的挺头疼的，特别是当你想要在人群中脱颖而出的时候。大多数人都喜欢求稳，选黑色、白色或者灰色，但我觉得颜色其实能反映你的个性。 2. Did you enjoy traveling by car when you were a kid? I have always been fascinated by travelling by car since I was a kid. When I was in my primary school, my parents would drive me to the Qinling Mountains on weekends. The mountains are not far away, right to the south of the city. We often went hiking there. Sadly, we cannot do that any more, because it’s not allowed now to protect water sources. 从小我就很喜欢自驾出行。上小学的时候，父母每到周末都会开车带我去秦岭。 秦岭离市区不远，就在城市南边。我们经常去那儿爬山。可惜现在不能这么做了，为了保护水源，相关出行已经被禁止。 3. What types of cars do you like? I have a strong preference for electric cars, because they are eco-friendly. You don't need to fill it up with petrol, I just need to charge the car. Besides, they are equipped with an autonomous driving system. I really hope I can get my hands on a Tesla, but it is far too expensive for me right now. Maybe I can buy one when it becomes cheaper in the future. 我格外偏爱电动汽车，因为它们环保。电动汽车不需要加油，我只需要给车充电。此外，车辆配备了自动驾驶系统。 我特别希望能拥有一辆特斯拉，但目前对我来说太贵了。或许等它以后降价，我就能入手一台。 4. Do you prefer to be a driver or a passenger? I prefer both role of them, actually. When I travel with friends. We usually swap drivers at service stations every two hours. Especially when driving on mountain roads, I really enjoy the fun of driving. 其实两种我都喜欢。我和朋友出行时会轮流开车，一般每隔两小时就在服务区换司机。尤其是行驶在山路上的时候，我十分享受驾驶的乐趣。 5. What do you usually do when there is a traffic jam? I usually listen to podcasts about technology and AI. It helps me stay sane. Sometimes I also give my parents a call and chat with them. 遇上堵车的时候，我常会收听科技和人工智能相关的播客，这能让我保持心态平稳。我也会给父母打电话闲聊几句。"},{"id":"a-p1-websites","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/3-websites.md","title":"Websites","html":"\u003cul>\n\u003cli>What kinds of websites do you often visit?\u003c/li>\n\u003cli>What is your favourite website?\u003c/li>\n\u003cli>Are there any changes to the websites you often visit?\u003c/li>\n\u003cli>What kinds of websites are popular in your country?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Scrolling through social media\u003c/td>\n\u003ctd>浏览社交媒体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily routine\u003c/td>\n\u003ctd>日常作息，日常习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I live on Bilibili, YouTube and WeChat\u003c/td>\n\u003ctd>离不开 B 站、油管和微信\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go to GitHub almost every day\u003c/td>\n\u003ctd>几乎每天访问 GitHub\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>view some codes\u003c/td>\n\u003ctd>查阅代码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>share some projects\u003c/td>\n\u003ctd>分享一些技术项目\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>has to be\u003c/td>\n\u003ctd>当属，一定是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>video-sharing platform\u003c/td>\n\u003ctd>视频分享平台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enjoy documentaries and movies\u003c/td>\n\u003ctd>喜欢看纪录片和电影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I&#39;ve watched a movie about Mars\u003c/td>\n\u003ctd>我看过一部关于火星的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learn more about astronomy\u003c/td>\n\u003ctd>学习更多天文学相关知识\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Several changes have taken place\u003c/td>\n\u003ctd>发生了不少变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>visited websites for fun\u003c/td>\n\u003ctd>上网只是为了消遣娱乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend more time on\u003c/td>\n\u003ctd>花更多时间在……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gain knowledge and learn different skills\u003c/td>\n\u003ctd>积累知识、学习各类技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep improving myself\u003c/td>\n\u003ctd>持续提升自我\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A wide range of\u003c/td>\n\u003ctd>多种多样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>social media platforms\u003c/td>\n\u003ctd>社交媒体平台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>almost everyone’s daily life\u003c/td>\n\u003ctd>几乎融入每个人的日常生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shopping websites\u003c/td>\n\u003ctd>电商网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attract huge numbers of users\u003c/td>\n\u003ctd>吸引大量用户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shop online\u003c/td>\n\u003ctd>网购\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>much more convenient\u003c/td>\n\u003ctd>方便得多\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What kinds of websites do you often visit?\u003c/h2>\n\u003cp>\u003cmark>Scrolling through social media\u003c/mark> is my \u003cmark>daily routine\u003c/mark>. Sometimes I feel like \u003cmark>I live on Bilibili, YouTube and WeChat\u003c/mark>. Apart from that, \u003cmark>I go to GitHub almost every day\u003c/mark>, I can&#39;t basically leave without it, It’s useful for me to \u003cmark>look up codes\u003c/mark> and \u003cmark>share some projects.\u003c/mark>\u003c/p>\n\u003cp>刷社交媒体基本上是我的日常。有时候我感觉自己离不开哔哩哔哩、油管和微信。除此之外，我经常访问 GitHub，我可以在上面查阅代码、分享技术项目。\u003c/p>\n\u003ch2 id=\"h2\">2. What is your favourite website?\u003c/h2>\n\u003cp>My favourite website \u003cmark>has to be Bilibili.\u003c/mark> It is a \u003cmark>video-sharing platform\u003c/mark>. I always watch videos for study. I also \u003cmark>enjoy documentaries and movies\u003c/mark> on this website. Recently \u003cmark>I&#39;ve watched a movie about Mars\u003c/mark> \u003cmark>which makes me want to learn more about astronomy\u003c/mark>\u003c/p>\n\u003cp>我最喜欢的网站当属哔哩哔哩。它是一个视频分享平台。我经常看视频来学习。我也喜欢在这个网站上看纪录片和电影。最近我看了一部有关火星的影片，这让我想要学习更多天文学相关知识。\u003c/p>\n\u003ch2 id=\"h3\">3. Are there any changes to the websites you often visit?\u003c/h2>\n\u003cp>Definitely. \u003cmark>Several changes have taken place\u003c/mark>. When I was in primary school, \u003cmark>I only visited websites for fun.\u003c/mark>\u003cbr>But now, I \u003cmark>spend more time on\u003c/mark> learning platforms like Bilibili and GitHub. I use them to \u003cmark>gain knowledge and learn different skills\u003c/mark> so that I can \u003cmark>keep improving myself.\u003c/mark>\u003c/p>\n\u003cp>当然，发生了不少变化。上小学的时候，我上网只是为了消遣娱乐。\u003cbr>但现在，我会花更多时间使用 B 站和 GitHub 这类学习平台。我借助它们积累知识、学习各种技能，持续提升自我。\u003c/p>\n\u003ch2 id=\"h4\">4. What kinds of websites are popular in your country?\u003c/h2>\n\u003cp>\u003cmark>A wide range of\u003c/mark> websites are popular in China. First of all, \u003cmark>social media platforms\u003c/mark> such as WeChat and QQ are \u003cmark>becoming almost everyone’s daily life\u003c/mark>. Besides, \u003cmark>e-commerce websites\u003c/mark> like Taobao \u003cmark>attract huge numbers of users\u003c/mark>. Many people \u003cmark>shop online\u003c/mark> because \u003cmark>it is much more convenient.\u003c/mark>\u003c/p>\n\u003cp>在中国，多种多样的网站都很受欢迎。首先，微信、QQ 这类社交平台几乎融入每个人的日常生活。此外，像淘宝这样的电商网站吸引着大量用户。很多人选择网购，因为这样方便得多。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What kinds of websites do you often visit?"},{"level":2,"id":"h2","text":"2. What is your favourite website?"},{"level":2,"id":"h3","text":"3. Are there any changes to the websites you often visit?"},{"level":2,"id":"h4","text":"4. What kinds of websites are popular in your country?"}],"text":"What kinds of websites do you often visit? What is your favourite website? Are there any changes to the websites you often visit? What kinds of websites are popular in your country? 英文短语 中文释义 Scrolling through social media 浏览社交媒体 daily routine 日常作息，日常习惯 I live on Bilibili, YouTube and WeChat 离不开 B 站、油管和微信 go to GitHub almost every day 几乎每天访问 GitHub view some codes 查阅代码 share some projects 分享一些技术项目 has to be 当属，一定是 video-sharing platform 视频分享平台 enjoy documentaries and movies 喜欢看纪录片和电影 I've watched a movie about Mars 我看过一部关于火星的影片 learn more about astronomy 学习更多天文学相关知识 Several changes have taken place 发生了不少变化 visited websites for fun 上网只是为了消遣娱乐 spend more time on 花更多时间在…… gain knowledge and learn different skills 积累知识、学习各类技能 keep improving myself 持续提升自我 A wide range of 多种多样的 social media platforms 社交媒体平台 almost everyone’s daily life 几乎融入每个人的日常生活 shopping websites 电商网站 attract huge numbers of users 吸引大量用户 shop online 网购 much more convenient 方便得多 1. What kinds of websites do you often visit? Scrolling through social media is my daily routine. Sometimes I feel like I live on Bilibili, YouTube and WeChat. Apart from that, I go to GitHub almost every day, I can't basically leave without it, It’s useful for me to look up codes and share some projects. 刷社交媒体基本上是我的日常。有时候我感觉自己离不开哔哩哔哩、油管和微信。除此之外，我经常访问 GitHub，我可以在上面查阅代码、分享技术项目。 2. What is your favourite website? My favourite website has to be Bilibili. It is a video-sharing platform. I always watch videos for study. I also enjoy documentaries and movies on this website. Recently I've watched a movie about Mars which makes me want to learn more about astronomy 我最喜欢的网站当属哔哩哔哩。它是一个视频分享平台。我经常看视频来学习。我也喜欢在这个网站上看纪录片和电影。最近我看了一部有关火星的影片，这让我想要学习更多天文学相关知识。 3. Are there any changes to the websites you often visit? Definitely. Several changes have taken place. When I was in primary school, I only visited websites for fun. But now, I spend more time on learning platforms like Bilibili and GitHub. I use them to gain knowledge and learn different skills so that I can keep improving myself. 当然，发生了不少变化。上小学的时候，我上网只是为了消遣娱乐。 但现在，我会花更多时间使用 B 站和 GitHub 这类学习平台。我借助它们积累知识、学习各种技能，持续提升自我。 4. What kinds of websites are popular in your country? A wide range of websites are popular in China. First of all, social media platforms such as WeChat and QQ are becoming almost everyone’s daily life. Besides, e-commerce websites like Taobao attract huge numbers of users. Many people shop online because it is much more convenient. 在中国，多种多样的网站都很受欢迎。首先，微信、QQ 这类社交平台几乎融入每个人的日常生活。此外，像淘宝这样的电商网站吸引着大量用户。很多人选择网购，因为这样方便得多。"},{"id":"a-p1-mirrors","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/4-Mirrors.md","title":"Mirrors","html":"\u003cul>\n\u003cli>Do you like looking at yourself in the mirror? How often?\u003c/li>\n\u003cli>Have you ever bought mirrors?\u003c/li>\n\u003cli>Do you usually take a mirror with you？\u003c/li>\n\u003cli>Would you use mirrors to decorate your room?\u003c/li>\n\u003c/ul>\n\u003cp>我赌不考\u003c/p>\n","toc":[],"text":"Do you like looking at yourself in the mirror? How often? Have you ever bought mirrors? Do you usually take a mirror with you？ Would you use mirrors to decorate your room? 我赌不考"},{"id":"a-p1-park","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/5-park.md","title":"Park","html":"\u003cul>\n\u003cli>Did you like going to parks as a child?\u003c/li>\n\u003cli>Do you still like going to parks now?\u003c/li>\n\u003cli>Would you like to see more parks in your city?\u003c/li>\n\u003cli>Are there any parks you want to go to in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hitting the park\u003c/td>\n\u003ctd>去公园（口语地道表达）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a highlight of my week\u003c/td>\n\u003ctd>一周里最期待 / 最开心的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I was a kid\u003c/td>\n\u003ctd>小时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>But unfortunately\u003c/td>\n\u003ctd>可惜、遗憾的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Looking back\u003c/td>\n\u003ctd>回想起来\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after a long week\u003c/td>\n\u003ctd>熬过漫长的一周后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>walk close to the water\u003c/td>\n\u003ctd>在水边散步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>that is close to nature\u003c/td>\n\u003ctd>贴近大自然\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离都市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>恢复精力、充电\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Absolutely I would\u003c/td>\n\u003ctd>我当然希望\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spare time\u003c/td>\n\u003ctd>闲暇时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is spent on my phone\u003c/td>\n\u003ctd>耗在手机上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a great place to relax\u003c/td>\n\u003ctd>放松的好去处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after studying and working\u003c/td>\n\u003ctd>学习、工作之余\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>breathe some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>恢复精力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s definitely better than\u003c/td>\n\u003ctd>这肯定比…… 要好得多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>staying at home all day\u003c/td>\n\u003ctd>整天待在家里\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve always wanted to\u003c/td>\n\u003ctd>我一直想要……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Yosemite National Park\u003c/mark>\u003c/td>\n\u003ctd>优胜美地国家公园\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I want see \u003cmark>El Capitan\u003c/mark>\u003c/td>\n\u003ctd>我想去看酋长岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a huge granite cliff\u003c/td>\n\u003ctd>一块巨大的花岗岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a big fan of rock climbing\u003c/td>\n\u003ctd>非常热爱攀岩 / 攀岩爱好者\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1.\u003cstrong>Did you like going to parks as a child?\u003c/strong>\u003c/h2>\n\u003cp>Definitely, \u003cmark>Hitting the park\u003c/mark> was \u003cmark>a highlight of my week\u003c/mark> \u003cmark>when I was a kid.\u003c/mark> I went to parks every weekend to play football when I was in my primary school. I even thought of going professional. \u003cmark>But unfortunately\u003c/mark>, I didn’t succeed. \u003cmark>Looking back\u003c/mark>, I really enjoyed being a kid.\u003c/p>\n\u003cp>小时候去公园是我每周最期待的事。上小学时，我每个周末都去那儿踢足球，甚至梦想成为一名职业球员。可惜最后没能如愿。回想起来，我十分享受那段童年时光。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you still like going to parks now?\u003c/h2>\n\u003cp>Absolutely, park is a place where I can relax \u003cmark>after a long week\u003c/mark>. I usually like to \u003cmark>walk close to the water, close to the river, the lake, or the forest areas\u003c/mark>, \u003cmark>that is close to nature\u003c/mark>. It lets me \u003cmark>\u003cstrong>take a break from urban life\u003c/strong>\u003c/mark>, \u003cmark>\u003cstrong>soak up some fresh air\u003c/strong>\u003c/mark> and \u003cmark>fully \u003cstrong>recharge my batteries\u003c/strong>.\u003c/mark> \u003c/p>\n\u003cp>当然，公园是我熬过漫长一周后放松身心的地方。我常常喜欢在水边散步，河畔、湖边或是林间都可以，也就是贴近大自然的环境。在公园里，我能够暂时远离都市生活，呼吸新鲜空气，充分恢复精力。\u003c/p>\n\u003ch2 id=\"h3\">3.Would you like to see more parks in your city?\u003c/h2>\n\u003cp>\u003cstrong>\u003cmark>Absolutely I would\u003c/mark>\u003c/strong>. Right now most of my \u003cmark>spare time\u003c/mark> \u003cmark>is spent on my phone\u003c/mark>. More parks would \u003cstrong>give me ==a great place to\u003c/strong> relax== \u003cmark>after studying and working,\u003c/mark>  I can \u003cmark>\u003cstrong>breathe some fresh air\u003c/strong>\u003c/mark> and \u003cmark>**recharge my batteries\u003c/mark> in the park. \u003cmark>It’s definitely better than\u003c/mark> \u003cmark>staying at home all day.\u003c/mark>\u003c/p>\n\u003cp>我当然希望（建设更多公园）。目前我的大部分闲暇时间都耗在手机上。更多公园能为我提供学习、工作之余放松的好去处。我可以在公园里呼吸新鲜空气、恢复精力，这肯定比整天待在家里要好得多。\u003c/p>\n\u003ch2 id=\"h4\">4. Are there any parks you want to go to in the future?\u003c/h2>\n\u003cp>Yes, for sure, \u003cmark>I’ve always wanted to\u003c/mark> visit \u003cmark>Yosemite National Park\u003c/mark> in the United States. I want see \u003cmark>El Capitan\u003c/mark>, \u003cmark>a huge granite cliff\u003c/mark>. It’s famous because Alex Honnold completed a free solo climb there. I’m \u003cmark>a big fan of rock climbing\u003c/mark>, so I really hope to have a look.\u003c/p>\n\u003cp>当然，我一直想去美国的优胜美地国家公园。我很想去看一看酋长岩这块巨大的花岗岩岩壁。它非常出名，攀岩运动员 Alex Honnold 曾在这里完成徒手攀岩，我很喜欢攀岩，所以我非常想去看一看\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1.Did you like going to parks as a child?"},{"level":2,"id":"h2","text":"2. Do you still like going to parks now?"},{"level":2,"id":"h3","text":"3.Would you like to see more parks in your city?"},{"level":2,"id":"h4","text":"4. Are there any parks you want to go to in the future?"}],"text":"Did you like going to parks as a child? Do you still like going to parks now? Would you like to see more parks in your city? Are there any parks you want to go to in the future? 英文短语 中文释义 Hitting the park 去公园（口语地道表达） a highlight of my week 一周里最期待 / 最开心的事 when I was a kid 小时候 But unfortunately 可惜、遗憾的是 Looking back 回想起来 after a long week 熬过漫长的一周后 walk close to the water 在水边散步 that is close to nature 贴近大自然 take a break from urban life 暂时远离都市生活 soak up some fresh air 呼吸新鲜空气 recharge my batteries 恢复精力、充电 Absolutely I would 我当然希望 spare time 闲暇时间 is spent on my phone 耗在手机上 a great place to relax 放松的好去处 after studying and working 学习、工作之余 breathe some fresh air 呼吸新鲜空气 recharge my batteries 恢复精力 It’s definitely better than 这肯定比…… 要好得多 staying at home all day 整天待在家里 I’ve always wanted to 我一直想要…… Yosemite National Park 优胜美地国家公园 I want see El Capitan 我想去看酋长岩 a huge granite cliff 一块巨大的花岗岩岩壁 a big fan of rock climbing 非常热爱攀岩 / 攀岩爱好者 1.Did you like going to parks as a child? Definitely, Hitting the park was a highlight of my week when I was a kid. I went to parks every weekend to play football when I was in my primary school. I even thought of going professional. But unfortunately, I didn’t succeed. Looking back, I really enjoyed being a kid. 小时候去公园是我每周最期待的事。上小学时，我每个周末都去那儿踢足球，甚至梦想成为一名职业球员。可惜最后没能如愿。回想起来，我十分享受那段童年时光。 2. Do you still like going to parks now? Absolutely, park is a place where I can relax after a long week. I usually like to walk close to the water, close to the river, the lake, or the forest areas, that is close to nature. It lets me take a break from urban life, soak up some fresh air and fully recharge my batteries. 当然，公园是我熬过漫长一周后放松身心的地方。我常常喜欢在水边散步，河畔、湖边或是林间都可以，也就是贴近大自然的环境。在公园里，我能够暂时远离都市生活，呼吸新鲜空气，充分恢复精力。 3.Would you like to see more parks in your city? Absolutely I would. Right now most of my spare time is spent on my phone. More parks would give me ==a great place to relax== after studying and working, I can breathe some fresh air and **recharge my batteries in the park. It’s definitely better than staying at home all day. 我当然希望（建设更多公园）。目前我的大部分闲暇时间都耗在手机上。更多公园能为我提供学习、工作之余放松的好去处。我可以在公园里呼吸新鲜空气、恢复精力，这肯定比整天待在家里要好得多。 4. Are there any parks you want to go to in the future? Yes, for sure, I’ve always wanted to visit Yosemite National Park in the United States. I want see El Capitan, a huge granite cliff. It’s famous because Alex Honnold completed a free solo climb there. I’m a big fan of rock climbing, so I really hope to have a look. 当然，我一直想去美国的优胜美地国家公园。我很想去看一看酋长岩这块巨大的花岗岩岩壁。它非常出名，攀岩运动员 Alex Honnold 曾在这里完成徒手攀岩，我很喜欢攀岩，所以我非常想去看一看"},{"id":"a-p1-shopping","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/6-shopping.md","title":"Shopping","html":"\u003cul>\n\u003cli>How often do you go shopping?\u003c/li>\n\u003cli>Do you prefer online shopping or in-store shopping?\u003c/li>\n\u003cli>Have you ever returned anything you bought online?\u003c/li>\n\u003cli>Do you like shopping?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>once a month\u003c/td>\n\u003ctd>一个月一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily necessities\u003c/td>\n\u003ctd>生活必需品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Without doubt\u003c/td>\n\u003ctd>毫无疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>online shopping\u003c/td>\n\u003ctd>网购\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>more choices\u003c/td>\n\u003ctd>更多选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>throw it away\u003c/td>\n\u003ctd>直接丢掉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Not really\u003c/td>\n\u003ctd>并不\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hate anything\u003c/td>\n\u003ctd>不喜欢所有事情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>requires me to make choices\u003c/td>\n\u003ctd>需要我做出选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>totally wastes my time\u003c/td>\n\u003ctd>纯粹浪费我的时间\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. How often do you go shopping?\u003c/h3>\n\u003cp>Hardly ever. I go shopping about \u003cmark>once a month\u003c/mark>. I only buy \u003cmark>daily necessities\u003c/mark> and some clothes.\u003c/p>\n\u003cp>我几乎不购物，大概一个月一次，只买一些生活必需品和衣服。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you prefer online shopping or in-store shopping?\u003c/h3>\n\u003cp>\u003cmark>Without doubt,\u003c/mark> I prefer \u003cmark>online shopping.\u003c/mark> There are \u003cmark>more choices\u003c/mark>, and it is much more convenient.\u003c/p>\n\u003cp>毫无疑问，我更喜欢网购。商品选择更多，而且更加方便。\u003c/p>\n\u003ch3 id=\"h3\">3. Have you ever returned anything you bought online?\u003c/h3>\n\u003cp>No, I haven’t. Most of the things I bought are fine. If I am not satisfied with sth, I just \u003cmark>throw it away.\u003c/mark> \u003c/p>\n\u003cp>没有。我网购的大部分商品都不错。如果东西不好，我直接丢掉。\u003c/p>\n\u003ch3 id=\"h4\">4. Do you like shopping?\u003c/h3>\n\u003cp>\u003cmark>Not really.\u003c/mark> I \u003cmark>hate anything\u003c/mark> that \u003cmark>requires me to make choices\u003c/mark>. It \u003cmark>totally wastes my time.\u003c/mark>\u003c/p>\n\u003cp>并不喜欢。我不喜欢所有需要做出选择的事情，纯粹浪费我的时间。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. How often do you go shopping?"},{"level":3,"id":"h2","text":"2. Do you prefer online shopping or in-store shopping?"},{"level":3,"id":"h3","text":"3. Have you ever returned anything you bought online?"},{"level":3,"id":"h4","text":"4. Do you like shopping?"}],"text":"How often do you go shopping? Do you prefer online shopping or in-store shopping? Have you ever returned anything you bought online? Do you like shopping? 短语 中文翻译 once a month 一个月一次 daily necessities 生活必需品 Without doubt 毫无疑问 online shopping 网购 more choices 更多选择 throw it away 直接丢掉 Not really 并不 hate anything 不喜欢所有事情 requires me to make choices 需要我做出选择 totally wastes my time 纯粹浪费我的时间 1. How often do you go shopping? Hardly ever. I go shopping about once a month. I only buy daily necessities and some clothes. 我几乎不购物，大概一个月一次，只买一些生活必需品和衣服。 2. Do you prefer online shopping or in-store shopping? Without doubt, I prefer online shopping. There are more choices, and it is much more convenient. 毫无疑问，我更喜欢网购。商品选择更多，而且更加方便。 3. Have you ever returned anything you bought online? No, I haven’t. Most of the things I bought are fine. If I am not satisfied with sth, I just throw it away. 没有。我网购的大部分商品都不错。如果东西不好，我直接丢掉。 4. Do you like shopping? Not really. I hate anything that requires me to make choices. It totally wastes my time. 并不喜欢。我不喜欢所有需要做出选择的事情，纯粹浪费我的时间。"},{"id":"a-p1-tidiness","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/7-tidiness.md","title":"Tidiness","html":"\u003cul>\n\u003cli>Do you like to keep things tidy?\u003c/li>\n\u003cli>Did you use to keep your room tidy as a chil
