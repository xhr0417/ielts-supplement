tr>\n\u003ctd>\u003c/td>\n\u003ctd>disappear completely\u003c/td>\n\u003ctd>彻底消失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>✨拓展描述\u003c/td>\n\u003ctd>witness dramatic transformations\u003c/td>\n\u003ctd>经历巨大变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>undergo significant developments\u003c/td>\n\u003ctd>发生显著改变\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">衔接\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall\u003c/td>\n\u003ctd>总体而言\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>To be specific\u003c/td>\n\u003ctd>具体来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In the western area\u003c/td>\n\u003ctd>在西部地区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Turning to the eastern part\u003c/td>\n\u003ctd>转向东部区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Furthermore / In addition\u003c/td>\n\u003ctd>此外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Finally\u003c/td>\n\u003ctd>最后\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"开头"},{"level":2,"id":"h2","text":"概述"},{"level":3,"id":"h3","text":"地点/区域/场地"},{"level":2,"id":"h4","text":"衔接"}],"text":"开头 概述 总结最核心的 2-3 个整体特征，不写具体数字和细节 必写角度：① 功能转变；② 设施增减趋势；③ 最显著的变化 地点/区域/场地 单词 核心含义 使用场景（地图题区分） 例句参考 site 场地、原址（一片规划地块） ✅ 题目标配词；侧重「特定建设地点、整片场地」 常搭配：the site of … The plans show the site of Beechwood Farm. land 土地、地块（通用，最基础） ✅ 泛指土地；可指农业用地、空地 不可数为主 The land between the river and roads was split into three plots. area 区域、片区（万能通用） ✅ 最百搭；大小地块都能用 This area was used as a sheep pasture. plot 小块土地、园地 ✅ 分割出来的小块耕地 / 园地（果园、菜地首选） three plots for fruit trees and vegetables field 田地、开阔场地 ✅ 农田、放牧区、露营场地（高频！） sheep field / camping field The sheep field was transformed into a camping area. 方位 英文短语 中文释义 be located in the northern part of 位于…… 的北部 be situated at the centre of 坐落于…… 中心 in the north-eastern corner 在东北角 adjacent to 紧邻；毗邻 in close proximity to 紧靠（书面替换 next to） surrounded by 被…… 环绕 separated by 被…… 隔开 along the main road 沿着主干道 along the coastline 沿着海岸线 on the eastern peninsula 在东部半岛上 at the foot of the mountain 在山脚下 beside the river 在河边 to the northwest side of 在…… 西北侧 within the boundary of 在…… 边界范围内 outside the town centre 在城镇中心外围 变化 分类 英文短语 中文释义 🔨拆除移除 be demolished / be knocked down 被拆除 be removed / be cleared away 被移除、清理掉 🧱新增 / 建造 be constructed / be built 被建造 be added 新增（设施） A new … has been erected 建起一处新的…… 🔄功能改造 be converted into / be turned into 被改造为…… be replaced by 被…… 取代 📍位置变动 be relocated 被搬迁 A and B have swapped positions A 与 B 互换位置 📏扩建延伸 be expanded / be enlarged （面积）扩建、扩大 be extended （道路 / 建筑）延伸、加长 🟰维持原状 remain unchanged 保持不变 still exist 仍然存在 stay in the same location 位置保持不变 📉缩小消失 shrink in size 面积缩小 disappear completely 彻底消失 ✨拓展描述 witness dramatic transformations 经历巨大变化 undergo significant developments 发生显著改变 衔接 英文短语 中文释义 Overall 总体而言 To be specific 具体来说 In the western area 在西部地区 Turning to the eastern part 转向东部区域 Furthermore / In addition 此外 Finally 最后"},{"id":"a-w-process","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/1-3 流程图.md","title":"流程图词汇","html":"\u003cp>\u003cmark>不要写 will be !!!!!!!!\u003c/mark>\u003c/p>\n\u003ch2 id=\"h1\">开头\u003c/h2>\n\u003cp>The flow chart illustrates the process of manufacturing 【成品】 from 【原料】.\u003cbr>该流程图展示了由【原料】生产【成品】的工序流程。\u003c/p>\n\u003ch2 id=\"h2\">概述\u003c/h2>\n\u003cp>\u003cmark>It is noticeable that there are seven distinct stages\u003c/mark> in the manufacturing process for\u003cbr>值得注意的是，整个制造流程分为 7 个不同阶段。\u003c/p>\n\u003cp>\u003cmark>These mainly include\u003c/mark> doing1 and doing2, doing3 and doing4, and ....\u003cbr>这些阶段主要包括动作 1、动作 2、动作 3、动作 4 以及……\u003cbr>\u003cmark>或者说\u003c/mark>：raw material \u003cmark>preparation\u003c/mark>, fibre \u003cmark>processing\u003c/mark>, and fabric \u003cmark>production.\u003c/mark>\u003c/p>\n\u003ch2 id=\"h3\">描述\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分类\u003c/th>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>顺序衔接\u003c/td>\n\u003ctd>At the first stage in the process\u003c/td>\n\u003ctd>流程的第一阶段；首先\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>next / after that / subsequently\u003c/td>\n\u003ctd>接下来、在此之后、随后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>At the third step shown on the diagram.\u003c/td>\n\u003ctd>如图所示的第三步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>at the next stage of the process\u003c/td>\n\u003ctd>流程的下一阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>At stage 7\u003c/td>\n\u003ctd>在第 7 阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>following this step\u003c/td>\n\u003ctd>在这一步之后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>finally / eventually\u003c/td>\n\u003ctd>最终、最后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>过程动作（被动）\u003c/td>\n\u003ctd>to be prepared for further manufacturing\u003c/td>\n\u003ctd>为后续制造工序做准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>which is subsequently delivered into a\u003c/td>\n\u003ctd>随后被送入 / 输送至\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>a machine called &quot;XXX&quot; is utilised to do sth\u003c/td>\n\u003ctd>一台名为 “XXX” 的机器被用于做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>and sth is finally produced\u003c/td>\n\u003ctd>最终生产出某物\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"开头"},{"level":2,"id":"h2","text":"概述"},{"level":2,"id":"h3","text":"描述"}],"text":"不要写 will be !!!!!!!! 开头 The flow chart illustrates the process of manufacturing 【成品】 from 【原料】. 该流程图展示了由【原料】生产【成品】的工序流程。 概述 It is noticeable that there are seven distinct stages in the manufacturing process for 值得注意的是，整个制造流程分为 7 个不同阶段。 These mainly include doing1 and doing2, doing3 and doing4, and .... 这些阶段主要包括动作 1、动作 2、动作 3、动作 4 以及…… 或者说：raw material preparation, fibre processing, and fabric production. 描述 分类 英文短语 中文释义 顺序衔接 At the first stage in the process 流程的第一阶段；首先 next / after that / subsequently 接下来、在此之后、随后 At the third step shown on the diagram. 如图所示的第三步 at the next stage of the process 流程的下一阶段 At stage 7 在第 7 阶段 following this step 在这一步之后 finally / eventually 最终、最后 过程动作（被动） to be prepared for further manufacturing 为后续制造工序做准备 which is subsequently delivered into a 随后被送入 / 输送至 a machine called \"XXX\" is utilised to do sth 一台名为 “XXX” 的机器被用于做某事 and sth is finally produced 最终生产出某物"},{"id":"a-w-agree","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-1 Agree or disagree.md","title":"Agree or disagree 模板","html":"\u003cp>Some people think we should let children do housework. Do you agree or disagree?\u003cbr>有些人认为我们应当让孩子做家务。你是否同意这一观点？\u003c/p>\n\u003cp>C18-T1\u003cbr>The most important aim of science should be to improve people&#39;s lives.\u003cbr>To what extent do you agree or disagree with this statement?\u003cbr>科学最重要的目标应当是改善人类的生活。你在多大程度上同意或不同意这一观点？\u003c/p>\n\u003cp>C15-T2\u003cbr>In the future, nobody will buy printed newspapers or books because they will be able to read everything they want online without paying.\u003cbr>To what extent do you agree or disagree with this statement?\u003cbr>未来，人们将不再购买纸质报纸与书籍，因为所有人都可以在网上免费阅读任何想看的内容。你在多大程度上同意或不同意这一观点？\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is sometimes argued that\u003c/td>\n\u003ctd>有些人认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Personally, I largely agree with this view, as sth brings more benefits than downsides for sb\u003c/td>\n\u003ctd>就我个人而言，我大体赞同这一观点，因为对某人来说，其利大于弊。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First and foremost, one strong argument in favor of this view is that\u003c/td>\n\u003ctd>首先，支持该观点的一个有力论据是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since sth, it can contribute to sth\u003c/td>\n\u003ctd>由于某事 / 某物存在，这有助于某事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for people who...as…\u003c/td>\n\u003ctd>这一点对于…… 人群尤为适用，因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example\u003c/td>\n\u003ctd>例如\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In addition, another strong justification for this idea is that\u003c/td>\n\u003ctd>此外，支持该观点的另一个充分理由是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because sth, it enables people to do sth\u003c/td>\n\u003ctd>由于某事 / 某物，这使得人们能够做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of sth, sth can do sth\u003c/td>\n\u003ctd>相比于某事，某物能够做到某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance\u003c/td>\n\u003ctd>举例来说\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>However, it is important to note the negative side of this idea\u003c/td>\n\u003ctd>然而，我们需要留意这个观点存在的弊端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Although this approach may be beneficial to sth in many ways\u003c/td>\n\u003ctd>尽管这种做法在很多方面对某事 / 人群有利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it can also be harmful to\u003c/td>\n\u003ctd>它同样会对…… 造成不利影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Specifically,\u003c/td>\n\u003ctd>具体而言，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that\u003c/td>\n\u003ctd>一个恰当的例子是\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although sth may occasionally bring minor downsides such as sth\u003c/td>\n\u003ctd>总而言之，尽管某事偶尔会带来一些小弊端，例如……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I still believe that sth is crucial for them to do sth, as it can do sth\u003c/td>\n\u003ctd>我依旧认为某事对他们做某事至关重要，因为它能够……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">例题\u003c/h3>\n\u003cp>Access to clean water is a basic human right. Therefore every home should have a water supply that is provided free of charge. Do you agree or disagree?\u003cbr>获得洁净水源是一项基本人权。因此，每户家庭都应当享有免费供水。你是否同意这一观点？\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>It is sometimes argued that\u003c/mark> access to clean water is a fundamental human right, so all households ought to receive free tap water.\u003cbr>\u003cmark>Personally, I largely disagree with this view, as\u003c/mark> providing free water supply \u003cmark>brings more drawbacks than benefits\u003c/mark> for society.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：有些人认为，获取洁净水源是一项基本人权，因此所有家庭都应当享有免费自来水供应。就我个人而言，我大体不赞同这一观点，因为推行免费供水对社会而言弊大于利。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>First and foremost, one strong argument in favor of\u003c/mark> charging residents for water \u003cmark>is that\u003c/mark> water resources on Earth are limited.\u003cbr>\u003cmark>Since\u003c/mark> unlimited free water may encourage wasteful habits, \u003cmark>it can contribute to\u003c/mark> the overconsumption of fresh water.\u003cbr>\u003cmark>This is particularly true for people\u003c/mark> living in water-rich regions, \u003cmark>as\u003c/mark> they may ignore the importance of water conservation without proper restrictions.\u003cbr>\u003cmark>For example,\u003c/mark> many families would use large volumes of clean water for watering gardens or washing vehicles if they do not need to pay the bill.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：首先，支持向居民收取水费的一个有力论据是，地球上的水资源是有限的。由于无限制的免费供水会助长浪费习惯，这会加剧淡水资源过度消耗。这一点对于水资源丰富地区的居民尤为适用，因为缺少约束时，他们容易忽视节水的重要性。例如，如果无需缴纳水费，许多家庭会大量使用洁净水源浇灌花园、清洗车辆。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In addition, another strong justification for\u003c/mark> paid water supply is that running water systems require continuous investment.\u003cbr>\u003cmark>Because\u003c/mark> water pipelines, purification facilities and maintenance teams need financial support, charging fees enables local governments to keep the whole water supply system operating well.\u003cbr>\u003cmark>Instead of\u003c/mark> relying completely on public tax revenue, water fees can cover daily operational costs.\u003cbr>\u003cmark>For instance\u003c/mark>, cities can use collected water charges to upgrade old pipelines and reduce water leakage.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：此外，支持收费供水的另一个充分理由是，供水系统需要持续投入资金。由于输水管道、净水设施和维护团队都需要资金支撑，收取水费能够让地方政府保障整套供水系统平稳运转。相比于完全依靠税收，水费可以承担日常运营开销。举例来说，城市能够利用水费收入改造老旧管道，减少水资源渗漏。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>However, it is important to note the negative side of\u003c/mark> water pricing. \u003cmark>Although this approach may be beneficial to resource protection in many ways, it can also be harmful to\u003c/mark> low-income groups.\u003cbr>\u003cmark>Specifically,\u003c/mark> impoverished families may struggle to afford water bills when prices keep rising.\u003cbr>\u003cmark>One case in point is that\u003c/mark> some disadvantaged households in remote areas have to cut down daily water use to reduce living expenses.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：然而，我们需要留意收费供水存在的弊端。尽管这种做法在很多方面有利于资源保护，它同样会对低收入群体造成不利影响。具体而言，物价持续上涨时，贫困家庭可能难以承担水费。一个恰当的例子是，偏远地区部分困难家庭不得不削减日常用水量，以此降低生活开支。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In conclusion, although\u003c/mark> charging for tap water \u003cmark>may occasionally bring minor downsides such as\u003c/mark> financial pressure on poor citizens,\u003cbr>\u003cmark>I still believe that\u003c/mark> water supply should not be completely free for all families, as it can prevent serious water waste and maintain public water infrastructure in the long run.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总而言之，尽管自来水收费偶尔会带来一些小弊端，例如给贫困人群造成经济压力，我依旧认为不应当向所有家庭免费供水，因为从长远来看，该举措能够避免严重的水资源浪费，并且维持公共供水设施正常运转。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"例题"}],"text":"Some people think we should let children do housework. Do you agree or disagree? 有些人认为我们应当让孩子做家务。你是否同意这一观点？ C18-T1 The most important aim of science should be to improve people's lives. To what extent do you agree or disagree with this statement? 科学最重要的目标应当是改善人类的生活。你在多大程度上同意或不同意这一观点？ C15-T2 In the future, nobody will buy printed newspapers or books because they will be able to read everything they want online without paying. To what extent do you agree or disagree with this statement? 未来，人们将不再购买纸质报纸与书籍，因为所有人都可以在网上免费阅读任何想看的内容。你在多大程度上同意或不同意这一观点？ 英文模板 中文翻译 It is sometimes argued that 有些人认为…… Personally, I largely agree with this view, as sth brings more benefits than downsides for sb 就我个人而言，我大体赞同这一观点，因为对某人来说，其利大于弊。 First and foremost, one strong argument in favor of this view is that 首先，支持该观点的一个有力论据是…… Since sth, it can contribute to sth 由于某事 / 某物存在，这有助于某事。 This is particularly true for people who...as… 这一点对于…… 人群尤为适用，因为…… For example 例如 In addition, another strong justification for this idea is that 此外，支持该观点的另一个充分理由是 Because sth, it enables people to do sth 由于某事 / 某物，这使得人们能够做某事 Instead of sth, sth can do sth 相比于某事，某物能够做到某事 For instance 举例来说 However, it is important to note the negative side of this idea 然而，我们需要留意这个观点存在的弊端 Although this approach may be beneficial to sth in many ways 尽管这种做法在很多方面对某事 / 人群有利 it can also be harmful to 它同样会对…… 造成不利影响 Specifically, 具体而言， One case in point is that 一个恰当的例子是 In conclusion, although sth may occasionally bring minor downsides such as sth 总而言之，尽管某事偶尔会带来一些小弊端，例如…… I still believe that sth is crucial for them to do sth, as it can do sth 我依旧认为某事对他们做某事至关重要，因为它能够…… 例题 Access to clean water is a basic human right. Therefore every home should have a water supply that is provided free of charge. Do you agree or disagree? 获得洁净水源是一项基本人权。因此，每户家庭都应当享有免费供水。你是否同意这一观点？ It is sometimes argued that access to clean water is a fundamental human right, so all households ought to receive free tap water. Personally, I largely disagree with this view, as providing free water supply brings more drawbacks than benefits for society. 翻译：有些人认为，获取洁净水源是一项基本人权，因此所有家庭都应当享有免费自来水供应。就我个人而言，我大体不赞同这一观点，因为推行免费供水对社会而言弊大于利。 First and foremost, one strong argument in favor of charging residents for water is that water resources on Earth are limited. Since unlimited free water may encourage wasteful habits, it can contribute to the overconsumption of fresh water. This is particularly true for people living in water-rich regions, as they may ignore the importance of water conservation without proper restrictions. For example, many families would use large volumes of clean water for watering gardens or washing vehicles if they do not need to pay the bill. 翻译：首先，支持向居民收取水费的一个有力论据是，地球上的水资源是有限的。由于无限制的免费供水会助长浪费习惯，这会加剧淡水资源过度消耗。这一点对于水资源丰富地区的居民尤为适用，因为缺少约束时，他们容易忽视节水的重要性。例如，如果无需缴纳水费，许多家庭会大量使用洁净水源浇灌花园、清洗车辆。 In addition, another strong justification for paid water supply is that running water systems require continuous investment. Because water pipelines, purification facilities and maintenance teams need financial support, charging fees enables local governments to keep the whole water supply system operating well. Instead of relying completely on public tax revenue, water fees can cover daily operational costs. For instance, cities can use collected water charges to upgrade old pipelines and reduce water leakage. 翻译：此外，支持收费供水的另一个充分理由是，供水系统需要持续投入资金。由于输水管道、净水设施和维护团队都需要资金支撑，收取水费能够让地方政府保障整套供水系统平稳运转。相比于完全依靠税收，水费可以承担日常运营开销。举例来说，城市能够利用水费收入改造老旧管道，减少水资源渗漏。 However, it is important to note the negative side of water pricing. Although this approach may be beneficial to resource protection in many ways, it can also be harmful to low-income groups. Specifically, impoverished families may struggle to afford water bills when prices keep rising. One case in point is that some disadvantaged households in remote areas have to cut down daily water use to reduce living expenses. 翻译：然而，我们需要留意收费供水存在的弊端。尽管这种做法在很多方面有利于资源保护，它同样会对低收入群体造成不利影响。具体而言，物价持续上涨时，贫困家庭可能难以承担水费。一个恰当的例子是，偏远地区部分困难家庭不得不削减日常用水量，以此降低生活开支。 In conclusion, although charging for tap water may occasionally bring minor downsides such as financial pressure on poor citizens, I still believe that water supply should not be completely free for all families, as it can prevent serious water waste and maintain public water infrastructure in the long run. 翻译：总而言之，尽管自来水收费偶尔会带来一些小弊端，例如给贫困人群造成经济压力，我依旧认为不应当向所有家庭免费供水，因为从长远来看，该举措能够避免严重的水资源浪费，并且维持公共供水设施正常运转。"},{"id":"a-w-discuss","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-2 Discuss both views.md","title":"Discuss both views 模板","html":"\u003cp>Some people think the public transport should be free to everyone, but many others think it would be a heavy burden. \u003cmark>Discuss both sides and give your own opinions.\u003c/mark>\u003cbr>一部分人认为公共交通应当向所有人免费，然而另有许多人认为这会造成沉重负担。讨论双方观点并给出你自己的看法。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is often debated that\u003c/td>\n\u003ctd>人们经常争论……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Opinions vary greatly on this issue. Some people believe that..., while others argue that...\u003c/td>\n\u003ctd>关于这一问题人们观点不一。一部分人认为……，而另一部分人主张……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will discuss both perspectives and present my own opinion.\u003c/td>\n\u003ctd>本文将讨论双方观点并给出个人看法。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>On the one hand, those who support the former view hold the valid reason that\u003c/td>\n\u003ctd>一方面，支持前者观点的人群有合理理由认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since..., it is beneficial for... to...\u003c/td>\n\u003ctd>由于……，这有利于…… 去……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This can greatly help sb to improve their ability in...\u003c/td>\n\u003ctd>这能极大帮助人们提升…… 方面的能力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that\u003c/td>\n\u003ctd>典型的例子是……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>On the other hand, opponents of this view claim that\u003c/td>\n\u003ctd>另一方面，反对该观点的人认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As..., it may lead to negative consequences for...\u003c/td>\n\u003ctd>由于……，这可能会给…… 带来负面影响。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rather than bringing benefits, this trend may cause problems such as\u003c/td>\n\u003ctd>该趋势不仅无法带来益处，还可能引发…… 等问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance,\u003c/td>\n\u003ctd>举例来说，\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, there are valid arguments on both sides.\u003c/td>\n\u003ctd>总体来看，双方都存在合理的论点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>From my perspective, I am more convinced that... is more reasonable.\u003c/td>\n\u003ctd>在我看来，我更认同…… 这一观点更为合理。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is because it can not only..., but also... in the long term.\u003c/td>\n\u003ctd>这是因为从长远来看，它不仅可以……，还能够……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">示范题目\u003c/h3>\n\u003cp>Some people think online reading will replace printed books and newspapers in the future, while others believe printed media will always exist. Discuss both views and give your own opinion.\u003cbr>有人认为未来网络阅读会取代纸质书报，另一些人则认为纸质媒介不会消失。讨论双方观点并给出自己看法。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>It is often debated that\u003c/mark> traditional printed books and newspapers will be completely replaced by free online reading in the future.\u003c/p>\n\u003cp>\u003cmark>Opinions vary greatly on this issue. Some people believe that\u003c/mark> digital reading will dominate people’s daily life, \u003cmark>while others argue that\u003c/mark> printed publications still have irreplaceable value.\u003c/p>\n\u003cp>\u003cmark>This essay will discuss both perspectives and present my own opinion.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：人们经常争论，传统纸质书籍和报纸未来会被免费的网络阅读彻底取代。关于这一问题人们观点不一，一部分人认为数字化阅读将主导人们的日常生活，而另一部分人主张纸质读物拥有不可替代的价值。本文将讨论双方观点并给出个人看法。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>On the one hand, those who support the former view hold the valid reason that\u003c/mark> online reading resources are more convenient and cost-free for the public.\u003c/p>\n\u003cp>\u003cmark>Since\u003c/mark> massive reading materials can be accessed anytime and anywhere on the Internet, \u003cmark>it is beneficial for\u003c/mark> ordinary people \u003cmark>to\u003c/mark> gain knowledge with zero cost.\u003c/p>\n\u003cp>\u003cmark>This can greatly help\u003c/mark> citizens \u003cmark>to improve their ability in\u003c/mark> absorbing new information efficiently.\u003c/p>\n\u003cp>\u003cmark>A typical example is that\u003c/mark> numerous news articles and e-books are available online for free, which has greatly reduced people’s reliance on physical books.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：一方面，支持前者观点的人群有合理理由认为，网络阅读资源对大众而言更加便捷且免费。由于人们可以随时随地在网络上获取海量阅读资料，这有利于民众零成本获取知识。这能极大帮助人们高效吸收新信息。典型的例子是，大量新闻与电子书可在线免费阅览，大幅降低了人们对实体书籍的依赖。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>On the other hand, opponents of this view claim that\u003c/mark> printed books and newspapers possess unique reading experience and collection value.\u003c/p>\n\u003cp>\u003cmark>As\u003c/mark> screen reading may cause eye strain and distraction, \u003cmark>it may lead to negative consequences for\u003c/mark> people’s reading quality and concentration.\u003c/p>\n\u003cp>\u003cmark>Rather than bringing benefits, this trend may cause problems such as\u003c/mark> superficial reading and information fragmentation.\u003c/p>\n\u003cp>\u003cmark>For instance,\u003c/mark> most online readers tend to skim quickly instead of deep thinking, while printed books encourage people to focus and study carefully.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：另一方面，反对该观点的人认为，纸质书籍和报纸拥有独特的阅读体验与收藏价值。由于屏幕阅读容易造成视疲劳、使人分心，这会对人们的阅读质量和专注力带来负面影响。该趋势不仅无法带来益处，还会造成浅层阅读、信息碎片化等问题。举例来说，大多数网络读者习惯快速浏览、缺乏深度思考，而纸质书籍更能让人专注精读。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>Overall, both sides have their own merits.\u003c/mark>\u003c/p>\n\u003cp>\u003cmark>From my perspective, I am more convinced that\u003c/mark> printed media will never be fully replaced by online reading \u003cmark>is more reasonable.\u003c/mark>\u003c/p>\n\u003cp>\u003cmark>This is because it can not only\u003c/mark> provide a more immersive reading experience, \u003cmark>but also\u003c/mark> preserve cultural inheritance and reading authenticity \u003cmark>in the long term.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总体而言，双方观点都有合理之处。在我看来，我更认同纸质媒介不会被网络阅读彻底取代这一观点。这是因为从长远来看，纸质读物不仅能提供沉浸式阅读体验，还能更好地传承文化、保证阅读的真实性。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"示范题目"}],"text":"Some people think the public transport should be free to everyone, but many others think it would be a heavy burden. Discuss both sides and give your own opinions. 一部分人认为公共交通应当向所有人免费，然而另有许多人认为这会造成沉重负担。讨论双方观点并给出你自己的看法。 英文模板 中文翻译 It is often debated that 人们经常争论…… Opinions vary greatly on this issue. Some people believe that..., while others argue that... 关于这一问题人们观点不一。一部分人认为……，而另一部分人主张…… This essay will discuss both perspectives and present my own opinion. 本文将讨论双方观点并给出个人看法。 On the one hand, those who support the former view hold the valid reason that 一方面，支持前者观点的人群有合理理由认为…… Since..., it is beneficial for... to... 由于……，这有利于…… 去…… This can greatly help sb to improve their ability in... 这能极大帮助人们提升…… 方面的能力。 One case in point is that 典型的例子是…… On the other hand, opponents of this view claim that 另一方面，反对该观点的人认为…… As..., it may lead to negative consequences for... 由于……，这可能会给…… 带来负面影响。 Rather than bringing benefits, this trend may cause problems such as 该趋势不仅无法带来益处，还可能引发…… 等问题。 For instance, 举例来说， Overall, there are valid arguments on both sides. 总体来看，双方都存在合理的论点。 From my perspective, I am more convinced that... is more reasonable. 在我看来，我更认同…… 这一观点更为合理。 This is because it can not only..., but also... in the long term. 这是因为从长远来看，它不仅可以……，还能够…… 示范题目 Some people think online reading will replace printed books and newspapers in the future, while others believe printed media will always exist. Discuss both views and give your own opinion. 有人认为未来网络阅读会取代纸质书报，另一些人则认为纸质媒介不会消失。讨论双方观点并给出自己看法。 It is often debated that traditional printed books and newspapers will be completely replaced by free online reading in the future. Opinions vary greatly on this issue. Some people believe that digital reading will dominate people’s daily life, while others argue that printed publications still have irreplaceable value. This essay will discuss both perspectives and present my own opinion. 翻译：人们经常争论，传统纸质书籍和报纸未来会被免费的网络阅读彻底取代。关于这一问题人们观点不一，一部分人认为数字化阅读将主导人们的日常生活，而另一部分人主张纸质读物拥有不可替代的价值。本文将讨论双方观点并给出个人看法。 On the one hand, those who support the former view hold the valid reason that online reading resources are more convenient and cost-free for the public. Since massive reading materials can be accessed anytime and anywhere on the Internet, it is beneficial for ordinary people to gain knowledge with zero cost. This can greatly help citizens to improve their ability in absorbing new information efficiently. A typical example is that numerous news articles and e-books are available online for free, which has greatly reduced people’s reliance on physical books. 翻译：一方面，支持前者观点的人群有合理理由认为，网络阅读资源对大众而言更加便捷且免费。由于人们可以随时随地在网络上获取海量阅读资料，这有利于民众零成本获取知识。这能极大帮助人们高效吸收新信息。典型的例子是，大量新闻与电子书可在线免费阅览，大幅降低了人们对实体书籍的依赖。 On the other hand, opponents of this view claim that printed books and newspapers possess unique reading experience and collection value. As screen reading may cause eye strain and distraction, it may lead to negative consequences for people’s reading quality and concentration. Rather than bringing benefits, this trend may cause problems such as superficial reading and information fragmentation. For instance, most online readers tend to skim quickly instead of deep thinking, while printed books encourage people to focus and study carefully. 翻译：另一方面，反对该观点的人认为，纸质书籍和报纸拥有独特的阅读体验与收藏价值。由于屏幕阅读容易造成视疲劳、使人分心，这会对人们的阅读质量和专注力带来负面影响。该趋势不仅无法带来益处，还会造成浅层阅读、信息碎片化等问题。举例来说，大多数网络读者习惯快速浏览、缺乏深度思考，而纸质书籍更能让人专注精读。 Overall, both sides have their own merits. From my perspective, I am more convinced that printed media will never be fully replaced by online reading is more reasonable. This is because it can not only provide a more immersive reading experience, but also preserve cultural inheritance and reading authenticity in the long term. 翻译：总体而言，双方观点都有合理之处。在我看来，我更认同纸质媒介不会被网络阅读彻底取代这一观点。这是因为从长远来看，纸质读物不仅能提供沉浸式阅读体验，还能更好地传承文化、保证阅读的真实性。"},{"id":"a-w-posneg","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/2-4 Positive & Negative.md","title":"Positive & Negative 模板","html":"\u003cp>Nowadays, many young people choose to study abroad. \u003cmark>Is it positive or negative\u003c/mark>?\u003cbr>现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is widely observed that\u003c/td>\n\u003ctd>如今人们普遍注意到……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>From my perspective, this trend brings more advantages than disadvantages for sb\u003c/td>\n\u003ctd>在我看来，这一趋势对某人而言利大于弊。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First and foremost, the most obvious advantage of this phenomenon is that\u003c/td>\n\u003ctd>首先，这一现象最显著的好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since sth, it can contribute to sth\u003c/td>\n\u003ctd>由于某事 / 某物存在，这有助于某事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for people who...as…\u003c/td>\n\u003ctd>这一点对于…… 人群尤为适用，因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example\u003c/td>\n\u003ctd>例如\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In addition, another positive effect of this trend is that\u003c/td>\n\u003ctd>此外，这一趋势的另一项积极影响是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because sth, it enables people to do sth\u003c/td>\n\u003ctd>由于某事 / 某物，这使得人们能够做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of sth, sth can do sth\u003c/td>\n\u003ctd>相比于某事，某物能够做到某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance\u003c/td>\n\u003ctd>举例来说\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>However, we cannot ignore the negative side of this trend\u003c/td>\n\u003ctd>然而，我们不能忽视这一趋势的消极面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Although this phenomenon may be beneficial to sth in many ways\u003c/td>\n\u003ctd>尽管这一现象在很多方面对某事 / 人群有利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it can also bring negative effects to\u003c/td>\n\u003ctd>它也会给…… 带来负面影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Specifically,\u003c/td>\n\u003ctd>具体而言，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One case in point is that\u003c/td>\n\u003ctd>一个恰当的例子是\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although this trend may occasionally bring minor downsides such as sth\u003c/td>\n\u003ctd>总而言之，尽管这一趋势偶尔会带来一些小弊端，例如……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I still believe that it is an overall positive development, as it can do sth\u003c/td>\n\u003ctd>我依旧认为这整体是积极的发展趋势，因为它能够……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">例题\u003c/h3>\n\u003cp>Nowadays, many young people choose to study abroad. Is it positive or negative?\u003cbr>现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>It is widely observed that\u003c/mark> an increasing number of young people choose to pursue further education in foreign countries.\u003cbr>\u003cmark>From my perspective, this trend brings more advantages than disadvantages\u003c/mark> for young students.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：如今人们普遍注意到，越来越多的年轻人选择出国深造。在我看来，这一趋势对青年学生而言利大于弊。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>First and foremost, the most obvious advantage of this phenomenon is that\u003c/mark> studying abroad helps students improve their academic ability and career competitiveness.\u003c/p>\n\u003cp>\u003cmark>Since\u003c/mark> top overseas universities have advanced teaching resources and research platforms, \u003cmark>it can contribute to\u003c/mark> students’ professional development in their fields.\u003c/p>\n\u003cp>\u003cmark>This is particularly true for students\u003c/mark> who major in science and engineering, \u003cmark>as\u003c/mark> they can gain access to cutting-edge technology and world-class scholars.\u003c/p>\n\u003cp>\u003cmark>For example,\u003c/mark> many Chinese engineering students return with stronger research skills after studying abroad, which makes them popular among top companies.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：首先，这一现象最显著的好处是，出国留学有助于学生提升学术能力与就业竞争力。由于海外顶尖高校拥有先进的教学资源与科研平台，这能够助力学生在自身领域获得专业成长。这一点对于理工科学生尤为适用，因为他们可以接触前沿技术与世界级学者。例如，很多中国工科留学生毕业后科研能力显著提升，深受头部企业青睐。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In addition, another positive effect of this trend is that\u003c/mark> overseas study cultivates students’ independence and broadens their horizons.\u003c/p>\n\u003cp>\u003cmark>Because\u003c/mark> students have to handle daily life and academic problems alone in a foreign country, \u003cmark>it enables them to\u003c/mark> develop better problem-solving and cross-cultural communication skills.\u003c/p>\n\u003cp>\u003cmark>Instead of\u003c/mark> staying in a familiar environment and relying on their parents, young people can experience diverse cultures and lifestyles.\u003c/p>\n\u003cp>\u003cmark>For instance,\u003c/mark> students living abroad often learn to manage their budget, arrange schedules and deal with cultural differences independently.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：此外，这一趋势的另一项积极影响是，留学会培养学生的独立性、拓宽其视野。由于学生在异国必须独自处理生活与学业问题，这能够锻炼他们解决问题与跨文化沟通的能力。相比于待在熟悉的环境里依赖父母，年轻人可以体验多元的文化与生活方式。举例来说，在海外生活的学生通常能学会独立管理开支、规划时间、应对文化差异。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>However, we cannot ignore the negative side of this trend.\u003c/mark>\u003c/p>\n\u003cp>\u003cmark>Although this phenomenon may be beneficial to\u003c/mark> students’ long-term development \u003cmark>in many ways,\u003c/mark>\u003c/p>\n\u003cp>\u003cmark>it can also bring negative effects to\u003c/mark> their mental state and family finance.\u003c/p>\n\u003cp>\u003cmark>Specifically,\u003c/mark> many young students suffer from loneliness and cultural shock when they first arrive in a foreign country.\u003c/p>\n\u003cp>\u003cmark>One case in point is that\u003c/mark> some students cannot adapt to the new teaching mode and living environment, which leads to anxiety and poor academic performance.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：然而，我们不能忽视这一趋势的消极面。尽管该现象在很多方面有利于学生的长远发展，它也会给学生的心理状态与家庭经济带来负面影响。具体而言，很多年轻学生初到异国时会感到孤独、遭遇文化冲击。一个恰当的例子是，部分学生无法适应全新的教学模式与生活环境，进而产生焦虑情绪、学业表现下滑。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>In conclusion, although this trend may occasionally bring minor downsides such as\u003c/mark> cultural adaptation pressure and financial burden,\u003c/p>\n\u003cp>\u003cmark>I still believe that it is an overall positive development, as it can\u003c/mark> greatly promote young people’s academic progress and personal growth.\u003c/p>\n\u003cp>\u003cstrong>翻译\u003c/strong>：总而言之，尽管出国留学偶尔会带来文化适应压力、经济负担等小弊端，我依旧认为这整体是积极的发展趋势，因为它能极大推动年轻人的学业进步与个人成长。\u003c/p>\n\u003cp>It is widely observed that\u003c/p>\n\u003cp>From my perspective, this trend brings more advantages than disadvantages for sb\u003c/p>\n\u003cp>First and foremost, the most obvious advantage of this phenomenon is that\u003c/p>\n\u003cp>Since sth, it can contribute to sth\u003c/p>\n\u003cp>This is particularly true for people who...as…\u003c/p>\n\u003cp>For example\u003c/p>\n\u003cp>In addition, another positive effect of this trend is that\u003c/p>\n\u003cp>Because sth, it enables people to do sth\u003c/p>\n\u003cp>Instead of sth, sth can do sth\u003c/p>\n\u003cp>For instance\u003c/p>\n\u003cp>However, we cannot ignore the negative side of this trend\u003c/p>\n\u003cp>Although this phenomenon may be beneficial to sth in many ways\u003c/p>\n\u003cp>it can also bring negative effects to\u003c/p>\n\u003cp>Specifically,\u003c/p>\n\u003cp>One case in point is that\u003c/p>\n\u003cp>In conclusion, although this trend may occasionally bring minor downsides such as sth\u003c/p>\n\u003cp>I still believe that it is an overall positive development, as it can do sth\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"例题"}],"text":"Nowadays, many young people choose to study abroad. Is it positive or negative? 现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？ 英文模板 中文翻译 It is widely observed that 如今人们普遍注意到…… From my perspective, this trend brings more advantages than disadvantages for sb 在我看来，这一趋势对某人而言利大于弊。 First and foremost, the most obvious advantage of this phenomenon is that 首先，这一现象最显著的好处是…… Since sth, it can contribute to sth 由于某事 / 某物存在，这有助于某事。 This is particularly true for people who...as… 这一点对于…… 人群尤为适用，因为…… For example 例如 In addition, another positive effect of this trend is that 此外，这一趋势的另一项积极影响是 Because sth, it enables people to do sth 由于某事 / 某物，这使得人们能够做某事 Instead of sth, sth can do sth 相比于某事，某物能够做到某事 For instance 举例来说 However, we cannot ignore the negative side of this trend 然而，我们不能忽视这一趋势的消极面 Although this phenomenon may be beneficial to sth in many ways 尽管这一现象在很多方面对某事 / 人群有利 it can also bring negative effects to 它也会给…… 带来负面影响 Specifically, 具体而言， One case in point is that 一个恰当的例子是 In conclusion, although this trend may occasionally bring minor downsides such as sth 总而言之，尽管这一趋势偶尔会带来一些小弊端，例如…… I still believe that it is an overall positive development, as it can do sth 我依旧认为这整体是积极的发展趋势，因为它能够…… 例题 Nowadays, many young people choose to study abroad. Is it positive or negative? 现如今，许多年轻人选择出国留学。这一现象是积极的还是消极的？ It is widely observed that an increasing number of young people choose to pursue further education in foreign countries. From my perspective, this trend brings more advantages than disadvantages for young students. 翻译：如今人们普遍注意到，越来越多的年轻人选择出国深造。在我看来，这一趋势对青年学生而言利大于弊。 First and foremost, the most obvious advantage of this phenomenon is that studying abroad helps students improve their academic ability and career competitiveness. Since top overseas universities have advanced teaching resources and research platforms, it can contribute to students’ professional development in their fields. This is particularly true for students who major in science and engineering, as they can gain access to cutting-edge technology and world-class scholars. For example, many Chinese engineering students return with stronger research skills after studying abroad, which makes them popular among top companies. 翻译：首先，这一现象最显著的好处是，出国留学有助于学生提升学术能力与就业竞争力。由于海外顶尖高校拥有先进的教学资源与科研平台，这能够助力学生在自身领域获得专业成长。这一点对于理工科学生尤为适用，因为他们可以接触前沿技术与世界级学者。例如，很多中国工科留学生毕业后科研能力显著提升，深受头部企业青睐。 In addition, another positive effect of this trend is that overseas study cultivates students’ independence and broadens their horizons. Because students have to handle daily life and academic problems alone in a foreign country, it enables them to develop better problem-solving and cross-cultural communication skills. Instead of staying in a familiar environment and relying on their parents, young people can experience diverse cultures and lifestyles. For instance, students living abroad often learn to manage their budget, arrange schedules and deal with cultural differences independently. 翻译：此外，这一趋势的另一项积极影响是，留学会培养学生的独立性、拓宽其视野。由于学生在异国必须独自处理生活与学业问题，这能够锻炼他们解决问题与跨文化沟通的能力。相比于待在熟悉的环境里依赖父母，年轻人可以体验多元的文化与生活方式。举例来说，在海外生活的学生通常能学会独立管理开支、规划时间、应对文化差异。 However, we cannot ignore the negative side of this trend. Although this phenomenon may be beneficial to students’ long-term development in many ways, it can also bring negative effects to their mental state and family finance. Specifically, many young students suffer from loneliness and cultural shock when they first arrive in a foreign country. One case in point is that some students cannot adapt to the new teaching mode and living environment, which leads to anxiety and poor academic performance. 翻译：然而，我们不能忽视这一趋势的消极面。尽管该现象在很多方面有利于学生的长远发展，它也会给学生的心理状态与家庭经济带来负面影响。具体而言，很多年轻学生初到异国时会感到孤独、遭遇文化冲击。一个恰当的例子是，部分学生无法适应全新的教学模式与生活环境，进而产生焦虑情绪、学业表现下滑。 In conclusion, although this trend may occasionally bring minor downsides such as cultural adaptation pressure and financial burden, I still believe that it is an overall positive development, as it can greatly promote young people’s academic progress and personal growth. 翻译：总而言之，尽管出国留学偶尔会带来文化适应压力、经济负担等小弊端，我依旧认为这整体是积极的发展趋势，因为它能极大推动年轻人的学业进步与个人成长。 It is widely observed that From my perspective, this trend brings more advantages than disadvantages for sb First and foremost, the most obvious advantage of this phenomenon is that Since sth, it can contribute to sth This is particularly true for people who...as… For example In addition, another positive effect of this trend is that Because sth, it enables people to do sth Instead of sth, sth can do sth For instance However, we cannot ignore the negative side of this trend Although this phenomenon may be beneficial to sth in many ways it can also bring negative effects to Specifically, One case in point is that In conclusion, although this trend may occasionally bring minor downsides such as sth I still believe that it is an overall positive development, as it can do sth"},{"id":"a-w-ai","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/ai.md","title":"AI 批改提示词","html":"\u003cp>你是一名雅思作文改卷人，给我“逐句”修改至6.5水平，修改过的部分加粗\u003cbr>1.修改致命错误！！\u003cbr>2.尽量不要动我的框架和模板，能不改则不改\u003cbr>3.可以润色，或者你有好的想法可以最后再和我补充说\u003c/p>\n\u003cp>雅思    小作文\u003cbr>1.评分\u003cbr>2.指出致命错误\u003cbr>3.逐句修改，至6.0-6.5水平，保持原有意思，只修改致命问题\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类别\u003c/th>\n\u003cth>英文短语\u003c/th>\ d>其余所有类别\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>题型名称\u003c/th>\n\u003cth>英文名称\u003c/th>\n\u003cth>近年出题概率\u003c/th>\n\u003cth>题干典型问法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2-1\u003c/td>\n\u003ctd>同意与否类\u003c/td>\n\u003ctd>Agree or disagree（To what extent do you agree or disagree）\u003c/td>\n\u003ctd>30%～35%\u003c/td>\n\u003ctd>To what extent do you agree or disagree?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-2\u003c/td>\n\u003ctd>双边讨论类\u003c/td>\n\u003ctd>Discuss both views\u003c/td>\n\u003ctd>28%～33%\u003c/td>\n\u003ctd>Discuss both views and give your own opinion\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-4\u003c/td>\n\u003ctd>利弊类\u003c/td>\n\u003ctd>Positive &amp; Negative / Advantages &amp; Disadvantages\u003c/td>\n\u003ctd>15%～20%\u003c/td>\n\u003ctd>What are the advantages and disadvantages? / Do the advantages outweigh disadvantages?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2-3\u003c/td>\n\u003ctd>原因解决类\u003c/td>\n\u003ctd>Reasons &amp; Solutions（报告类）\u003c/td>\n\u003ctd>10%～15%\u003c/td>\n\u003ctd>What are the causes? What solutions can you suggest?\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分类\u003c/th>\n\u003cth>题型\u003c/th>\n\u003cth>英文名称\u003c/th>\n\u003cth>2024–2025 出题占比\u003c/th>\n\u003cth>核心考察要点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>数据类图表（合计≈82%）\u003c/strong>\u003c/td>\n\u003ctd>柱状图\u003c/td>\n\u003ctd>Bar chart\u003c/td>\n\u003ctd>33%\u003c/td>\n\u003ctd>动态趋势 / 静态数据对比，最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>折线图\u003c/td>\n\u003ctd>Line graph\u003c/td>\n\u003ctd>23%\u003c/td>\n\u003ctd>时间变化、趋势描述（上升 / 下降 / 波动）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>表格图\u003c/td>\n\u003ctd>Table\u003c/td>\n\u003ctd>10%\u003c/td>\n\u003ctd>多组数据分类对比，容易堆砌数字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>饼状图\u003c/td>\n\u003ctd>Pie chart\u003c/td>\n\u003ctd>3%\u003c/td>\n\u003ctd>占比、份额；极少单独出题，常出现在组合图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>混合组合图\u003c/td>\n\u003ctd>Mixed charts\u003c/td>\n\u003ctd>13%\u003c/td>\n\u003ctd>两种图表搭配（柱 + 饼、线 + 表格等）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>非数据示意图（合计≈18%）\u003c/strong>\u003c/td>\n\u003ctd>地图题\u003c/td>\n\u003ctd>Map\u003c/td>\n\u003ctd>10%\u003c/td>\n\u003ctd>地点变迁、方位布局、设施增减\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>流程图\u003c/td>\n\u003ctd>Process diagram\u003c/td>\n\u003ctd>8%\u003c/td>\n\u003ctd>工序、循环流程，被动语态 + 顺序连接词\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[],"text":"你是一名雅思作文改卷人，给我“逐句”修改至6.5水平，修改过的部分加粗 1.修改致命错误！！ 2.尽量不要动我的框架和模板，能不改则不改 3.可以润色，或者你有好的想法可以最后再和我补充说 雅思 小作文 1.评分 2.指出致命错误 3.逐句修改，至6.0-6.5水平，保持原有意思，只修改致命问题 类别 英文短语 中文含义 对比 by contrast 作为对比 the pattern is reversed 趋势完全相反 roughly the same across both groups 两组数据大致持平 preference differ significantly between 两个群体的偏好存在显著差异 making them the most common choice 这使得它们成为最普遍的选择 is twice as large as that of …… 是…… 的两倍 上升趋势 rise overall over the 10-year period 在这十年间整体呈上升趋势 the period saw a steady overall increase 这段时期整体呈现稳定上升态势 witness an upward trend 呈现上升趋势 波动 Despite some small fluctuations 尽管存在小幅波动 分类 broken down by category 按类别细分 all remaining categories 其余所有类别 编号 题型名称 英文名称 近年出题概率 题干典型问法 2-1 同意与否类 Agree or disagree（To what extent do you agree or disagree） 30%～35% To what extent do you agree or disagree? 2-2 双边讨论类 Discuss both views 28%～33% Discuss both views and give your own opinion 2-4 利弊类 Positive & Negative / Advantages & Disadvantages 15%～20% What are the advantages and disadvantages? / Do the advantages outweigh disadvantages? 2-3 原因解决类 Reasons & Solutions（报告类） 10%～15% What are the causes? What solutions can you suggest? 分类 题型 英文名称 2024–2025 出题占比 核心考察要点 数据类图表（合计≈82%） 柱状图 Bar chart 33% 动态趋势 / 静态数据对比，最高频 折线图 Line graph 23% 时间变化、趋势描述（上升 / 下降 / 波动） 表格图 Table 10% 多组数据分类对比，容易堆砌数字 饼状图 Pie chart 3% 占比、份额；极少单独出题，常出现在组合图 混合组合图 Mixed charts 13% 两种图表搭配（柱 + 饼、线 + 表格等） 非数据示意图（合计≈18%） 地图题 Map 10% 地点变迁、方位布局、设施增减 流程图 Process diagram 8% 工序、循环流程，被动语态 + 顺序连接词"},{"id":"s-t1-overview","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/0-小作文总览.md","title":"0 小作文总览：题型速查","html":"\u003ch2 id=\"h1\">基本要求\u003c/h2>\n\u003cul>\n\u003cli>至少 150 词，建议 20 分钟以内写完，留出 40 分钟给大作文。\u003c/li>\n\u003cli>只描述图里有的信息，不写原因，不写个人观点。\u003c/li>\n\u003cli>必须有概述段（Overview）。没有概述，Task Achievement 很难过 5 分。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">通用四段结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：图表类型 + 内容 + 地点 + 时间\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>最明显的 2 个特征，不写具体数字\u003c/td>\n\u003ctd>2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组数据：最高、最低、起点、终点、转折\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二组数据，并和第一组对比\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">七种图怎么认、怎么写\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题型\u003c/th>\n\u003cth>怎么认\u003c/th>\n\u003cth>概述写什么\u003c/th>\n\u003cth>细节怎么分段\u003c/th>\n\u003cth>时态\u003c/th>\n\u003cth>模板\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>折线图\u003c/td>\n\u003ctd>横轴是年份或月份，图里是几条线\u003c/td>\n\u003ctd>整体升降趋势；谁最高、谁超过了谁\u003c/td>\n\u003ctd>按线分组（涨的一组、跌的一组），或按时间段\u003c/td>\n\u003ctd>过去的数据用一般过去时；预测用 is expected to\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-line\">1-4 折线图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>柱状图\u003c/td>\n\u003ctd>柱子比较几个类别，可能有几个年份\u003c/td>\n\u003ctd>最高和最低的类别；最大的差距或变化\u003c/td>\n\u003ctd>按类别分组，或按年份分\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-bar\">1-5 柱状图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>饼图\u003c/td>\n\u003ctd>每张饼是 100%，常见两张或三张对比\u003c/td>\n\u003ctd>占比最大的部分；变化最大的部分\u003c/td>\n\u003ctd>一张饼一段，或按“变大的 / 变小的”分\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-pie\">1-6 饼图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表格\u003c/td>\n\u003ctd>行和列的数字\u003c/td>\n\u003ctd>最高、最低；有年份时写整体趋势\u003c/td>\n\u003ctd>按行或按列分组，挑有对比的数据\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-table\">1-7 表格\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>混合图\u003c/td>\n\u003ctd>两种图放在一起\u003c/td>\n\u003ctd>每张图各写一个最明显的特征\u003c/td>\n\u003ctd>一张图一段\u003c/td>\n\u003ctd>两张图分别看\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-mixed\">1-1 混合图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图\u003c/td>\n\u003ctd>同一个地方两个或三个时间的样子\u003c/td>\n\u003ctd>整体变化方向（更城市化、设施变多）和保持不变的部分\u003c/td>\n\u003ctd>按区域（北边 / 南边），或按时间段\u003c/td>\n\u003ctd>一般过去时被动；未来规划用 will be\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-map\">1-2 地图（结构补充）\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程图\u003c/td>\n\u003ctd>带箭头的步骤图\u003c/td>\n\u003ctd>一共几个阶段，从哪开始、到哪结束；是循环还是直线\u003c/td>\n\u003ctd>前一半步骤一段，后一半一段\u003c/td>\n\u003ctd>一般现在时，人造流程多用被动\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-process\">1-3 流程图（结构补充）\u003c/a>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>地图和流程图的词汇见原作者笔记：\u003ca href=\"#/page/a-w-map\">地图\u003c/a>、\u003ca href=\"#/page/a-w-process\">流程图\u003c/a>。数字、比例、趋势词见 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h4\">时态怎么选\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>图里的时间\u003c/th>\n\u003cth>用什么时态\u003c/th>\n\u003cth>例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>过去的年份（2000–2020）\u003c/td>\n\u003ctd>一般过去时\u003c/td>\n\u003ctd>The figure rose to 40% in 2020.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>没有时间（流程图、某些表格）\u003c/td>\n\u003ctd>一般现在时\u003c/td>\n\u003ctd>The leaves are collected and dried.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来的预测（2030、2050）\u003c/td>\n\u003ctd>will / is expected to / is predicted to\u003c/td>\n\u003ctd>The number is expected to reach 5 million by 2050.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图：从过去变到现在\u003c/td>\n\u003ctd>现在完成时\u003c/td>\n\u003ctd>A new car park has been built.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图：过去两个年份之间\u003c/td>\n\u003ctd>一般过去时，到某年为止用过去完成时\u003c/td>\n\u003ctd>By 2010, the farm had been replaced by houses.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">开头改写常用替换\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原词\u003c/th>\n\u003cth>替换\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>shows\u003c/td>\n\u003ctd>illustrates / compares / gives information about / presents\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the number of people\u003c/td>\n\u003ctd>the figure for / how many people\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the percentage of\u003c/td>\n\u003ctd>the proportion of / the share of\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from 2000 to 2020\u003c/td>\n\u003ctd>between 2000 and 2020 / over a 20-year period\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in three countries\u003c/td>\n\u003ctd>in Country A, Country B and Country C（直接写出名字）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">常见丢分点\u003c/h2>\n\u003cul>\n\u003cli>没有概述段，或者概述里堆数字。\u003c/li>\n\u003cli>每个数字都写进去，没有挑重点，也没有比较。\u003c/li>\n\u003cli>写了原因或评价，比如 because people became richer。\u003c/li>\n\u003cli>饼图没有总数时写成 the number of，应该用 the proportion of。\u003c/li>\n\u003cli>单位写错或漏写（%、million、tonnes）。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"基本要求"},{"level":2,"id":"h2","text":"通用四段结构"},{"level":2,"id":"h3","text":"七种图怎么认、怎么写"},{"level":2,"id":"h4","text":"时态怎么选"},{"level":2,"id":"h5","text":"开头改写常用替换"},{"level":2,"id":"h6","text":"常见丢分点"}],"text":"基本要求 至少 150 词，建议 20 分钟以内写完，留出 40 分钟给大作文。 只描述图里有的信息，不写原因，不写个人观点。 必须有概述段（Overview）。没有概述，Task Achievement 很难过 5 分。 通用四段结构 段落 写什么 句数 开头 改写题目：图表类型 + 内容 + 地点 + 时间 1 句 概述 最明显的 2 个特征，不写具体数字 2 句 细节 1 第一组数据：最高、最低、起点、终点、转折 3–4 句 细节 2 第二组数据，并和第一组对比 3–4 句 七种图怎么认、怎么写 题型 怎么认 概述写什么 细节怎么分段 时态 模板 折线图 横轴是年份或月份，图里是几条线 整体升降趋势；谁最高、谁超过了谁 按线分组（涨的一组、跌的一组），或按时间段 过去的数据用一般过去时；预测用 is expected to 1-4 折线图 柱状图 柱子比较几个类别，可能有几个年份 最高和最低的类别；最大的差距或变化 按类别分组，或按年份分 看图里的时间 1-5 柱状图 饼图 每张饼是 100%，常见两张或三张对比 占比最大的部分；变化最大的部分 一张饼一段，或按“变大的 / 变小的”分 看图里的时间 1-6 饼图 表格 行和列的数字 最高、最低；有年份时写整体趋势 按行或按列分组，挑有对比的数据 看图里的时间 1-7 表格 混合图 两种图放在一起 每张图各写一个最明显的特征 一张图一段 两张图分别看 1-1 混合图 地图 同一个地方两个或三个时间的样子 整体变化方向（更城市化、设施变多）和保持不变的部分 按区域（北边 / 南边），或按时间段 一般过去时被动；未来规划用 will be 1-2 地图（结构补充） 流程图 带箭头的步骤图 一共几个阶段，从哪开始、到哪结束；是循环还是直线 前一半步骤一段，后一半一段 一般现在时，人造流程多用被动 1-3 流程图（结构补充） 地图和流程图的词汇见原作者笔记：地图、流程图。数字、比例、趋势词见 小作文通识积累。 时态怎么选 图里的时间 用什么时态 例子 过去的年份（2000–2020） 一般过去时 The figure rose to 40% in 2020. 没有时间（流程图、某些表格） 一般现在时 The leaves are collected and dried. 未来的预测（2030、2050） will / is expected to / is predicted to The number is expected to reach 5 million by 2050. 地图：从过去变到现在 现在完成时 A new car park has been built. 地图：过去两个年份之间 一般过去时，到某年为止用过去完成时 By 2010, the farm had been replaced by houses. 开头改写常用替换 原词 替换 shows illustrates / compares / gives information about / presents the number of people the figure for / how many people the percentage of the proportion of / the share of from 2000 to 2020 between 2000 and 2020 / over a 20-year period in three countries in Country A, Country B and Country C（直接写出名字） 常见丢分点 没有概述段，或者概述里堆数字。 每个数字都写进去，没有挑重点，也没有比较。 写了原因或评价，比如 because people became richer。 饼图没有总数时写成 the number of，应该用 the proportion of。 单位写错或漏写（%、million、tonnes）。"},{"id":"s-t1-mixed","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-1 混合图.md","title":"1-1 混合图（Mixed charts）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目给出两个或以上的图表，常见组合有柱状图 + 饼图、折线图 + 表格、地图 + 表格等。题干一般是 \u003cem>The charts show…\u003c/em> 或 \u003cem>The bar chart and the pie chart compare…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明两张图的主题和时间范围\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>每张图各写 1 个最显著的特征，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一张图的关键数据（最高、最低、变化）\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二张图的关键数据，并与第一张图对比或呼应\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两段细节可以“按图分”（段 1 写图 1，段 2 写图 2），也可以“按主题分”（每段写一个主题，两张图都引用）。按图分更稳，不容易漏内容。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The bar chart and the pie chart illustrate … in …\u003c/td>\n\u003ctd>柱状图和饼图展示了……（在……方面）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two charts provide information about … from … to …\u003c/td>\n\u003ctd>两张图提供了……从……到……的信息\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, …\u003c/td>\n\u003ctd>总的来说……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>While the first chart shows …, the second chart reveals …\u003c/td>\n\u003ctd>第一张图显示……，而第二张图显示……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable feature is that …\u003c/td>\n\u003ctd>最明显的特征是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">连接两张图的句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>…, whereas / while …\u003c/td>\n\u003ctd>……，而……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, … / By comparison, …\u003c/td>\n\u003ctd>相比之下……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Similarly, … / A similar pattern can be seen in …\u003c/td>\n\u003ctd>同样地…… / 类似的情况也出现在……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Turning to …, …\u003c/td>\n\u003ctd>说到……，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The former …, while the latter …\u003c/td>\n\u003ctd>前者……，后者……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>用 the former / the latter 时要确认对应关系。如果前后两个对象容易混淆，直接写出名词更安全。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>\u003cstrong>概述\u003c/strong>：Overall, tourism revenue grew steadily over the period, whereas hotels remained the largest category of spending.\u003cbr>\u003cstrong>译\u003c/strong>：总体而言，旅游收入稳步增长，而酒店始终是占比最大的消费类别。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>两张图都要写到，不要只写一张。\u003c/li>\n\u003cli>概述段不写具体数字。\u003c/li>\n\u003cli>描述过去的数据用一般过去时；“The chart shows” 这类引入句用一般现在时。\u003c/li>\n\u003cli>每段尽量只讲清楚一张图，减少指代混乱。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"连接两张图的句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 题目给出两个或以上的图表，常见组合有柱状图 + 饼图、折线图 + 表格、地图 + 表格等。题干一般是 The charts show… 或 The bar chart and the pie chart compare… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明两张图的主题和时间范围 1–2 句 概述 每张图各写 1 个最显著的特征，不写具体数字 2–3 句 细节 1 第一张图的关键数据（最高、最低、变化） 4–5 句 细节 2 第二张图的关键数据，并与第一张图对比或呼应 4–5 句 两段细节可以“按图分”（段 1 写图 1，段 2 写图 2），也可以“按主题分”（每段写一个主题，两张图都引用）。按图分更稳，不容易漏内容。 开头模板 英文 中文 The bar chart and the pie chart illustrate … in … 柱状图和饼图展示了……（在……方面） The two charts provide information about … from … to … 两张图提供了……从……到……的信息 概述模板 英文 中文 Overall, … 总的来说…… While the first chart shows …, the second chart reveals … 第一张图显示……，而第二张图显示…… The most noticeable feature is that … 最明显的特征是…… 连接两张图的句型 英文 中文 …, whereas / while … ……，而…… In contrast, … / By comparison, … 相比之下…… Similarly, … / A similar pattern can be seen in … 同样地…… / 类似的情况也出现在…… Turning to …, … 说到……，…… The former …, while the latter … 前者……，后者…… 用 the former / the latter 时要确认对应关系。如果前后两个对象容易混淆，直接写出名词更安全。 示例（自拟数据） 概述：Overall, tourism revenue grew steadily over the period, whereas hotels remained the largest category of spending. 译：总体而言，旅游收入稳步增长，而酒店始终是占比最大的消费类别。 注意 两张图都要写到，不要只写一张。 概述段不写具体数字。 描述过去的数据用一般过去时；“The chart shows” 这类引入句用一般现在时。 每段尽量只讲清楚一张图，减少指代混乱。"},{"id":"s-t1-map","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-2 地图（结构补充）.md","title":"1-2 地图：结构与句型（补充）","html":"\u003cp>原作者的 \u003ca href=\"#/page/a-w-map\">地图笔记\u003c/a> 整理了地点、方位和变化的词汇。这篇补段落结构和整句模板，两篇一起用。\u003c/p>\n\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>同一个地方在两个或三个时间的样子，比如 \u003cem>The maps show a town in 1990 and today\u003c/em>，或者现在的样子和未来的规划 \u003cem>The plans show the proposed changes to the park\u003c/em>。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：什么地方、哪两个时间\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>整体变化方向 + 没变的部分\u003c/td>\n\u003ctd>2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>一个区域（或前一个时间段）的变化\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>另一个区域（或后一个时间段）的变化\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两张图按区域分段（北边一段、南边一段）；三张图按时间段分（1990–2005 一段、2005–今天一段）。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The maps illustrate the changes that took place in [地点] between [年份] and [年份].\u003c/td>\n\u003ctd>两幅地图展示了[地点]在[年份]到[年份]之间发生的变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two maps compare [地点] in [年份] with the same area today.\u003c/td>\n\u003ctd>两幅地图比较了[地点]在[年份]和今天的样子。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The plans show the proposed changes to [地点].\u003c/td>\n\u003ctd>平面图展示了[地点]的规划改动。（未来规划题）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, the area became much more developed, with more houses and better facilities.\u003c/td>\n\u003ctd>总体来看，这个地区开发程度高了很多，房屋更多，设施更好。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, the [地点] was transformed from a farming area into a residential area.\u003c/td>\n\u003ctd>总体来看，[地点]从农业区变成了住宅区。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable change is that the [A] was replaced by [B].\u003c/td>\n\u003ctd>最明显的变化是 A 被 B 取代了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>By contrast, the [C] remained unchanged.\u003c/td>\n\u003ctd>相比之下，C 保持不变。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">描述变化的句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>拆除 + 新建\u003c/td>\n\u003ctd>The factory in the north was demolished to make way for a shopping centre.\u003c/td>\n\u003ctd>北边的工厂被拆掉，腾出地方建了购物中心。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取代\u003c/td>\n\u003ctd>By 2020, the farmland had been replaced by a housing estate.\u003c/td>\n\u003ctd>到 2020 年，农田已被住宅区取代。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新建\u003c/td>\n\u003ctd>A new car park was built next to the hospital.\u003c/td>\n\u003ctd>医院旁边新建了一个停车场。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改造\u003c/td>\n\u003ctd>The old school was converted into a museum.\u003c/td>\n\u003ctd>旧学校被改造成了博物馆。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩建\u003c/td>\n\u003ctd>The main road was extended to the south.\u003c/td>\n\u003ctd>主路向南延伸了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变小\u003c/td>\n\u003ctd>The forest shrank to about half its original size.\u003c/td>\n\u003ctd>森林缩小到原来的一半左右。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不变\u003c/td>\n\u003ctd>The river and the bridge remained unchanged.\u003c/td>\n\u003ctd>河和桥保持不变。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>位置\u003c/td>\n\u003ctd>To the east of the lake, a hotel was constructed.\u003c/td>\n\u003ctd>湖的东边建了一家酒店。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">时态\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>时态\u003c/th>\n\u003cth>例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>过去两个年份\u003c/td>\n\u003ctd>一般过去时被动\u003c/td>\n\u003ctd>A school was built in 1995.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>到某个过去年份为止\u003c/td>\n\u003ctd>过去完成时\u003c/td>\n\u003ctd>By 2010, the farm had been turned into a park.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>从过去到现在\u003c/td>\n\u003ctd>现在完成时\u003c/td>\n\u003ctd>Several houses have been added.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来规划\u003c/td>\n\u003ctd>will be / is going to be\u003c/td>\n\u003ctd>The car park will be moved to the west.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：The maps show a seaside village in 1990 and today.\u003c/p>\n\u003cp>\u003cstrong>开头 + 概述\u003c/strong>：The maps illustrate how a seaside village changed between 1990 and today. Overall, the village became a tourist destination, with many new facilities built along the coast, while the fishing harbour remained unchanged.\u003cbr>\u003cstrong>译\u003c/strong>：两幅地图展示了一个海边村庄从 1990 年到今天的变化。总体来看，这个村庄变成了旅游地，沿海新建了许多设施，而渔港保持不变。\u003c/p>\n\u003cp>\u003cstrong>细节\u003c/strong>：In 1990, the area to the east of the main road was covered by farmland. Today, this land has been replaced by a hotel and a large car park. In addition, the small shops in the village centre were demolished to make way for a shopping street.\u003cbr>\u003cstrong>译\u003c/strong>：1990 年，主路东边是农田。如今，这片地已被一家酒店和一个大停车场取代。此外，村中心的小商店被拆掉，建成了一条商业街。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>地图题一般没有数字，重点写“什么变成了什么、在哪里”。\u003c/li>\n\u003cli>每句话最好带一个方位词，让读者知道变化发生在哪儿。\u003c/li>\n\u003cli>不写原因，比如不要写 because more tourists came。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"描述变化的句型"},{"level":2,"id":"h6","text":"时态"},{"level":2,"id":"h7","text":"示例（自拟）"},{"level":2,"id":"h8","text":"注意"}],"text":"原作者的 地图笔记 整理了地点、方位和变化的词汇。这篇补段落结构和整句模板，两篇一起用。 题型识别 同一个地方在两个或三个时间的样子，比如 The maps show a town in 1990 and today，或者现在的样子和未来的规划 The plans show the proposed changes to the park。 段落结构 段落 写什么 句数 开头 改写题目：什么地方、哪两个时间 1 句 概述 整体变化方向 + 没变的部分 2 句 细节 1 一个区域（或前一个时间段）的变化 3–4 句 细节 2 另一个区域（或后一个时间段）的变化 3–4 句 两张图按区域分段（北边一段、南边一段）；三张图按时间段分（1990–2005 一段、2005–今天一段）。 开头模板 英文 中文 The maps illustrate the changes that took place in [地点] between [年份] and [年份]. 两幅地图展示了[地点]在[年份]到[年份]之间发生的变化。 The two maps compare [地点] in [年份] with the same area today. 两幅地图比较了[地点]在[年份]和今天的样子。 The plans show the proposed changes to [地点]. 平面图展示了[地点]的规划改动。（未来规划题） 概述模板 英文 中文 Overall, the area became much more developed, with more houses and better facilities. 总体来看，这个地区开发程度高了很多，房屋更多，设施更好。 Overall, the [地点] was transformed from a farming area into a residential area. 总体来看，[地点]从农业区变成了住宅区。 The most noticeable change is that the [A] was replaced by [B]. 最明显的变化是 A 被 B 取代了。 By contrast, the [C] remained unchanged. 相比之下，C 保持不变。 描述变化的句型 变化 英文 中文 拆除 + 新建 The factory in the north was demolished to make way for a shopping centre. 北边的工厂被拆掉，腾出地方建了购物中心。 取代 By 2020, the farmland had been replaced by a housing estate. 到 2020 年，农田已被住宅区取代。 新建 A new car park was built next to the hospital. 医院旁边新建了一个停车场。 改造 The old school was converted into a museum. 旧学校被改造成了博物馆。 扩建 The main road was extended to the south. 主路向南延伸了。 变小 The forest shrank to about half its original size. 森林缩小到原来的一半左右。 不变 The river and the bridge remained unchanged. 河和桥保持不变。 位置 To the east of the lake, a hotel was constructed. 湖的东边建了一家酒店。 时态 情况 时态 例子 过去两个年份 一般过去时被动 A school was built in 1995. 到某个过去年份为止 过去完成时 By 2010, the farm had been turned into a park. 从过去到现在 现在完成时 Several houses have been added. 未来规划 will be / is going to be The car park will be moved to the west. 示例（自拟） 题目：The maps show a seaside village in 1990 and today. 开头 + 概述：The maps illustrate how a seaside village changed between 1990 and today. Overall, the village became a tourist destination, with many new facilities built along the coast, while the fishing harbour remained unchanged. 译：两幅地图展示了一个海边村庄从 1990 年到今天的变化。总体来看，这个村庄变成了旅游地，沿海新建了许多设施，而渔港保持不变。 细节：In 1990, the area to the east of the main road was covered by farmland. Today, this land has been replaced by a hotel and a large car park. In addition, the small shops in the village centre were demolished to make way for a shopping street. 译：1990 年，主路东边是农田。如今，这片地已被一家酒店和一个大停车场取代。此外，村中心的小商店被拆掉，建成了一条商业街。 注意 地图题一般没有数字，重点写“什么变成了什么、在哪里”。 每句话最好带一个方位词，让读者知道变化发生在哪儿。 不写原因，比如不要写 because more tourists came。"},{"id":"s-t1-process","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-3 流程图（结构补充）.md","title":"1-3 流程图：结构与句型（补充）","html":"\u003cp>原作者的 \u003ca href=\"#/page/a-w-process\">流程图笔记\u003c/a> 有开头、概述和顺序词。这篇补完整结构、两类流程的写法和整句模板。原作者特别标注过：流程图不要写 will be。\u003c/p>\n\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类型\u003c/th>\n\u003cth>例子\u003c/th>\n\u003cth>写法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>人造流程（生产、加工）\u003c/td>\n\u003ctd>茶叶、巧克力、碳酸饮料的生产\u003c/td>\n\u003ctd>多用一般现在时被动：\u003cem>is collected, is heated\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然流程（生命周期、水循环）\u003c/td>\n\u003ctd>青蛙、蝴蝶的生命周期\u003c/td>\n\u003ctd>多用一般现在时主动：\u003cem>the eggs hatch\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构 / 原理图\u003c/td>\n\u003ctd>太阳能板的结构、隧道对比\u003c/td>\n\u003ctd>先写由哪几部分组成，再写怎么工作\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：什么东西、从什么原料做成\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>一共几个阶段；从哪开始、到哪结束；是直线还是循环\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>前一半步骤\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>后一半步骤\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The diagram illustrates how [产品] is made from [原料].\u003c/td>\n\u003ctd>流程图展示了[产品]是如何由[原料]制成的。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The diagram shows the process by which [产品] is produced.\u003c/td>\n\u003ctd>流程图展示了生产[产品]的过程。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The diagram illustrates the life cycle of a [动物].\u003c/td>\n\u003ctd>图表展示了[动物]的生命周期。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, there are seven stages in the process, beginning with the collection of [原料] and ending with the delivery of [产品].\u003c/td>\n\u003ctd>总体来看，整个过程有七个阶段，从收集原料开始，到配送成品结束。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, it is a linear process which mainly involves heating, mixing and packaging.\u003c/td>\n\u003ctd>总体来看，这是一个直线流程，主要包括加热、混合和包装。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, the life cycle of the [动物] consists of four main stages and repeats itself.\u003c/td>\n\u003ctd>总体来看，这种动物的生命周期包括四个主要阶段，并循环往复。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">顺序词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>英文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第一步\u003c/td>\n\u003ctd>First, / To begin with, / At the first stage,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中间\u003c/td>\n\u003ctd>Next, / Then, / After that, / Following this, / At the next stage,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前一步完成后\u003c/td>\n\u003ctd>Once the [原料] has been washed, it is ...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同时\u003c/td>\n\u003ctd>At the same time, / Meanwhile,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最后\u003c/td>\n\u003ctd>Finally, / At the final stage, / Eventually,\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First, the fruit is collected and transported to a factory.\u003c/td>\n\u003ctd>首先，水果被采摘并运到工厂。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is then washed and cut into small pieces.\u003c/td>\n\u003ctd>然后被清洗并切成小块。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After that, the pieces are put into a machine, where they are heated to 80°C.\u003c/td>\n\u003ctd>之后，这些小块被放进机器，加热到 80 摄氏度。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Once the juice has been filtered, it is poured into bottles.\u003c/td>\n\u003ctd>果汁过滤后被灌进瓶子。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Finally, the bottles are packed and delivered to supermarkets.\u003c/td>\n\u003ctd>最后，瓶子被打包并运到超市。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>（自然流程）The eggs hatch into tadpoles, which then develop back legs.\u003c/td>\n\u003ctd>卵孵化成蝌蚪，蝌蚪随后长出后腿。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>（自然流程）It takes about 12 weeks for a tadpole to become a young frog.\u003c/td>\n\u003ctd>蝌蚪大约需要 12 周长成小青蛙。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：The diagram shows how bottled orange juice is produced.\u003c/p>\n\u003cp>\u003cstrong>开头 + 概述\u003c/strong>：The diagram illustrates how bottled orange juice is made from fresh oranges. Overall, there are six stages in the process, beginning with picking the fruit and ending with delivering the juice to shops.\u003cbr>\u003cstrong>译\u003c/strong>：流程图展示了瓶装橙汁是如何由新鲜橙子制成的。总体来看，整个过程有六个阶段，从采摘水果开始，到把果汁送到商店结束。\u003c/p>\n\u003cp>\u003cstrong>细节 1\u003c/strong>：First, ripe oranges are picked by hand and transported to a factory by truck. They are then washed in cold water and cut in half.\u003cbr>\u003cstrong>译\u003c/strong>：首先，成熟的橙子被人工采摘，用卡车运到工厂。接着用冷水清洗，并切成两半。\u003c/p>\n\u003cp>\u003cstrong>细节 2\u003c/strong>：At the next stage, the juice is squeezed out and heated to kill bacteria. Once it has cooled down, it is poured into plastic bottles. Finally, the bottles are labelled and delivered to supermarkets.\u003cbr>\u003cstrong>译\u003c/strong>：下一阶段，果汁被榨出并加热杀菌。冷却之后，果汁被灌进塑料瓶。最后，瓶子贴上标签，运往超市。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>每个步骤都要写到，不能跳；但每步一句就够。\u003c/li>\n\u003cli>人造流程主语是“东西”，所以用被动：\u003cem>is heated\u003c/em>，不写 \u003cem>workers heat\u003c/em>。\u003c/li>\n\u003cli>用一般现在时，不用 will be（这是原作者标出的高频错误）。\u003c/li>\n\u003cli>图里标出的机器名、温度、时间可以直接写进去，显得具体。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"顺序词"},{"level":2,"id":"h6","text":"句型模板"},{"level":2,"id":"h7","text":"示例（自拟）"},{"level":2,"id":"h8","text":"注意"}],"text":"原作者的 流程图笔记 有开头、概述和顺序词。这篇补完整结构、两类流程的写法和整句模板。原作者特别标注过：流程图不要写 will be。 题型识别 类型 例子 写法 人造流程（生产、加工） 茶叶、巧克力、碳酸饮料的生产 多用一般现在时被动：is collected, is heated 自然流程（生命周期、水循环） 青蛙、蝴蝶的生命周期 多用一般现在时主动：the eggs hatch 结构 / 原理图 太阳能板的结构、隧道对比 先写由哪几部分组成，再写怎么工作 段落结构 段落 写什么 句数 开头 改写题目：什么东西、从什么原料做成 1 句 概述 一共几个阶段；从哪开始、到哪结束；是直线还是循环 1–2 句 细节 1 前一半步骤 3–4 句 细节 2 后一半步骤 3–4 句 开头模板 英文 中文 The diagram illustrates how [产品] is made from [原料]. 流程图展示了[产品]是如何由[原料]制成的。 The diagram shows the process by which [产品] is produced. 流程图展示了生产[产品]的过程。 The diagram illustrates the life cycle of a [动物]. 图表展示了[动物]的生命周期。 概述模板 英文 中文 Overall, there are seven stages in the process, beginning with the collection of [原料] and ending with the delivery of [产品]. 总体来看，整个过程有七个阶段，从收集原料开始，到配送成品结束。 Overall, it is a linear process which mainly involves heating, mixing and packaging. 总体来看，这是一个直线流程，主要包括加热、混合和包装。 Overall, the life cycle of the [动物] consists of four main stages and repeats itself. 总体来看，这种动物的生命周期包括四个主要阶段，并循环往复。 顺序词 位置 英文 第一步 First, / To begin with, / At the first stage, 中间 Next, / Then, / After that, / Following this, / At the next stage, 前一步完成后 Once the [原料] has been washed, it is ... 同时 At the same time, / Meanwhile, 最后 Finally, / At the final stage, / Eventually, 句型模板 英文 中文 First, the fruit is collected and transported to a factory. 首先，水果被采摘并运到工厂。 It is then washed and cut into small pieces. 然后被清洗并切成小块。 After that, the pieces are put into a machine, where they are heated to 80°C. 之后，这些小块被放进机器，加热到 80 摄氏度。 Once the juice has been filtered, it is poured into bottles. 果汁过滤后被灌进瓶子。 Finally, the bottles are packed and delivered to supermarkets. 最后，瓶子被打包并运到超市。 （自然流程）The eggs hatch into tadpoles, which then develop back legs. 卵孵化成蝌蚪，蝌蚪随后长出后腿。 （自然流程）It takes about 12 weeks for a tadpole to become a young frog. 蝌蚪大约需要 12 周长成小青蛙。 示例（自拟） 题目：The diagram shows how bottled orange juice is produced. 开头 + 概述：The diagram illustrates how bottled orange juice is made from fresh oranges. Overall, there are six stages in the process, beginning with picking the fruit and ending with delivering the juice to shops. 译：流程图展示了瓶装橙汁是如何由新鲜橙子制成的。总体来看，整个过程有六个阶段，从采摘水果开始，到把果汁送到商店结束。 细节 1：First, ripe oranges are picked by hand and transported to a factory by truck. They are then washed in cold water and cut in half. 译：首先，成熟的橙子被人工采摘，用卡车运到工厂。接着用冷水清洗，并切成两半。 细节 2：At the next stage, the juice is squeezed out and heated to kill bacteria. Once it has cooled down, it is poured into plastic bottles. Finally, the bottles are labelled and delivered to supermarkets. 译：下一阶段，果汁被榨出并加热杀菌。冷却之后，果汁被灌进塑料瓶。最后，瓶子贴上标签，运往超市。 注意 每个步骤都要写到，不能跳；但每步一句就够。 人造流程主语是“东西”，所以用被动：is heated，不写 workers heat。 用一般现在时，不用 will be（这是原作者标出的高频错误）。 图里标出的机器名、温度、时间可以直接写进去，显得具体。"},{"id":"s-t1-line","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-4 折线图.md","title":"1-4 折线图（Line graph）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>横轴通常是时间（年份、月份），纵轴是数值（人数、金额、比例）。一般有 1–4 条线。题干常见 \u003cem>The line graph shows…\u003c/em> 或 \u003cem>The graph compares…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明图表内容和时间段\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写整体趋势（谁上升、谁下降、谁波动），不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一条线：起点、峰值、谷底、终点\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二条线（或其他线）的变化，并与第一条线对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The line graph illustrates how … changed between … and …\u003c/td>\n\u003ctd>折线图展示了……在……到……之间的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The graph compares the trends in … over a period of … years.\u003c/td>\n\u003ctd>该图比较了……在……年间的变化趋势。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … showed an upward trend, while … declined.\u003c/td>\n\u003ctd>总体来看，……呈上升趋势，而……下降了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, … fluctuated over the period, but ended higher than it started.\u003c/td>\n\u003ctd>总体来看，……有波动，但最终高于起点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most striking feature is that … overtook … in …\u003c/td>\n\u003ctd>最突出的特征是……在……年超过了……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">趋势词汇\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>趋势\u003c/th>\n\u003cth>动词（过去式）\u003c/th>\n\u003cth>名词\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>上升\u003c/td>\n\u003ctd>rise (rose) / increase (increased) / grow (grew)\u003c/td>\n\u003ctd>a rise / an increase / growth\u003c/td>\n\u003ctd>上升、增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下降\u003c/td>\n\u003ctd>fall (fell) / decrease / decline / drop\u003c/td>\n\u003ctd>a fall / a decrease / a decline\u003c/td>\n\u
