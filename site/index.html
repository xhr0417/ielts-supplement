<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思补充 · 2026 年 9–12 月</title>
<meta name="description" content="2026 年 9–12 月雅思口语新题（Part 1/2/3）、串题、计时练习，以及大小作文各题型模板和近期真题。">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('ielts26:theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --soft: #eef1f5;
  --hover: #f1f4f8;
  --text: #19202b;
  --text-2: #4b5567;
  --text-3: #7a8496;
  --line: #e0e5eb;
  --line-2: #cfd6df;
  --accent: #2459d6;
  --accent-ink: #1c47ad;
  --accent-soft: #e8eefc;
  --green: #11805b;
  --green-soft: #e2f4ec;
  --amber: #a85507;
  --amber-soft: #fcefdc;
  --purple: #6a41d4;
  --purple-soft: #efe9fd;
  --red: #c13d0c;
  --red-soft: #fdece5;
  --mark: #fff0a3;
  --shadow: 0 1px 2px rgb(16 24 40 / 5%), 0 6px 20px rgb(16 24 40 / 5%);
  --radius: 12px;
  --radius-sm: 8px;
  --topbar: 58px;
  --sidebar: 268px;
  --toc: 216px;
  --content: 840px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0f1318;
  --panel: #161b22;
  --soft: #1d242e;
  --hover: #1b222b;
  --text: #e6eaf0;
  --text-2: #a9b2c1;
  --text-3: #788396;
  --line: #262e3a;
  --line-2: #344050;
  --accent: #6d9bff;
  --accent-ink: #9dbcff;
  --accent-soft: #1b2741;
  --green: #45c995;
  --green-soft: #13291f;
  --amber: #f0b45a;
  --amber-soft: #2c2111;
  --purple: #b199ff;
  --purple-soft: #231b3a;
  --red: #ff8f66;
  --red-soft: #321a12;
  --mark: #5b4b12;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.75 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.skip-link { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--panel); padding: 8px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow); }
.skip-link:focus { top: 10px; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); flex: none; }
.brand:hover { text-decoration: none; }
.logo {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
}
[data-theme="dark"] .logo { color: #0f1318; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text b { font-size: 15px; }
.brand-text small { font-size: 12px; color: var(--text-3); }
.search {
  flex: 1; max-width: 420px; margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 10px;
  background: var(--soft); border: 1px solid transparent; border-radius: 10px;
  color: var(--text-3);
}
.search:focus-within { border-color: var(--accent); background: var(--panel); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.search kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line-2); border-radius: 5px; color: var(--text-3); }
.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--text-2); cursor: pointer;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.menu-btn { display: none; }
[data-theme="dark"] .sun, [data-theme="light"] .moon { display: none; }
.exam-chip {
  height: 34px; padding: 0 12px; flex: none;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--text-2); cursor: pointer; font-size: 14px; white-space: nowrap;
}
.exam-chip:hover { background: var(--hover); }
.exam-chip.on { background: var(--amber-soft); border-color: transparent; color: var(--amber); font-weight: 600; }

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--toc);
  min-height: calc(100vh - var(--topbar));
}
.sidebar {
  position: sticky; top: var(--topbar);
  height: calc(100vh - var(--topbar));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 18px 12px 40px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}
main { min-width: 0; padding: 28px 36px 96px; outline: none; }
.page { max-width: var(--content); margin: 0 auto; }
.toc {
  position: sticky; top: var(--topbar);
  height: calc(100vh - var(--topbar));
  overflow-y: auto; padding: 32px 16px 40px 4px;
  font-size: 13px;
}
.scrim { display: none; }

/* ---------- 侧栏导航 ---------- */
.nav-group { margin-bottom: 18px; }
.nav-title { margin: 0 10px 6px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; }
.nav-link, .nav-sum {
  display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 6px 10px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 14.5px; line-height: 1.35; cursor: pointer;
}
.nav-link:hover, .nav-sum:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav-link .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav-sub { padding-left: 10px; }
.nav-sub .nav-link { font-size: 14px; min-height: 32px; }
details.nav-fold > summary { list-style: none; }
details.nav-fold > summary::-webkit-details-marker { display: none; }
.nav-sum .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav-sum::after { content: ""; width: 7px; height: 7px; margin: 0 2px 0 8px; border: solid var(--text-3); border-width: 0 1.6px 1.6px 0; transform: rotate(-45deg); transition: transform .15s; }
details[open] > .nav-sum::after { transform: rotate(45deg); }

/* ---------- 通用组件 ---------- */
.page-head { margin-bottom: 24px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
h1 { margin: 4px 0 8px; font-size: 28px; line-height: 1.35; letter-spacing: -.01em; }
.lede { margin: 0; color: var(--text-2); font-size: 15.5px; }
h2.sec { display: flex; align-items: center; gap: 10px; margin: 36px 0 14px; font-size: 20px; line-height: 1.4; }
h2.sec::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); }
h2.sec .count { font-size: 14px; font-weight: 400; color: var(--text-3); }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; margin: 12px 0;
}
.card.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.muted { color: var(--text-3); }
.small { font-size: 13.5px; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px;
  border: 1px solid var(--line-2); border-radius: 10px;
  background: var(--panel); color: var(--text); cursor: pointer; font-size: 14.5px; white-space: nowrap;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
[data-theme="dark"] .btn-primary { color: #0f1318; }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-sm { min-height: 32px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
  background: var(--soft); color: var(--text-2);
}
.tag-mainland { background: var(--green-soft); color: var(--green); }
.tag-hot { background: var(--amber-soft); color: var(--amber); }
.tag-later { background: var(--purple-soft); color: var(--purple); }
.tag-author { background: var(--accent-soft); color: var(--accent-ink); }
.tag-repeat { background: var(--red-soft); color: var(--red); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }

.done-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px; flex: none;
  border: 1px dashed var(--line-2); border-radius: 999px;
  background: transparent; color: var(--text-3); cursor: pointer; font-size: 13px;
}
.done-btn::before { content: ""; width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 50%; }
.done-btn[aria-pressed="true"] { border-style: solid; border-color: transparent; background: var(--green-soft); color: var(--green); font-weight: 600; }
.done-btn[aria-pressed="true"]::before { background: currentColor; box-shadow: inset 0 0 0 2.5px var(--green-soft); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.filters .label { font-size: 13px; color: var(--text-3); margin-right: 4px; align-self: center; }
.seg {
  min-height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text-2);
  cursor: pointer; font-size: 14px;
}
.seg:hover { background: var(--hover); }
.seg[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--panel); font-weight: 600; }

.notice {
  display: flex; gap: 10px; padding: 12px 14px; margin: 12px 0;
  border-radius: var(--radius-sm); background: var(--soft); color: var(--text-2); font-size: 14.5px;
}
.notice.warn { background: var(--amber-soft); color: var(--amber); }
.notice b { color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 12px 0; }
.tile {
  display: flex; flex-direction: column; gap: 4px;
  padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); color: var(--text);
  transition: border-color .15s, transform .15s;
}
.tile:hover { text-decoration: none; border-color: var(--accent); }
.tile .k { font-size: 13px; color: var(--text-3); }
.tile .v { font-size: 18px; font-weight: 700; }
.tile .d { font-size: 13.5px; color: var(--text-2); }

.stat-big { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* ---------- 首页 ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center;
  padding: 24px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-soft), var(--panel) 70%);
  border: 1px solid var(--line);
}
.hero h1 { font-size: 30px; }
.countdown { text-align: center; padding: 6px 8px 6px 24px; border-left: 1px dashed var(--line-2); }
.countdown .muted { font-size: 13px; }
.hot-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hot-list { list-style: none; margin: 0; padding: 0; counter-reset: hot; }
.hot-list li { counter-increment: hot; display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.hot-list li:last-child { border-bottom: 0; }
.hot-list li::before { content: counter(hot); width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 6px; background: var(--soft); color: var(--text-3); font-size: 12px; font-weight: 700; }
.hot-list li:nth-child(-n+3)::before { background: var(--amber-soft); color: var(--amber); }
.hot-list a { color: var(--text); }
.hot-list .check { margin-left: auto; color: var(--green); font-size: 13px; }

/* ---------- 题目卡片 ---------- */
.topic-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.topic-head .no { font: 700 13px var(--mono); color: var(--text-3); padding-top: 5px; }
.topic-head h3 { margin: 0; font-size: 18px; line-height: 1.45; }
.topic-head h3 .zh { color: var(--text-2); font-weight: 500; }
.topic-head .tags { padding-top: 3px; }
.topic-head .done-btn { margin-left: auto; }
.cue-en { margin: 10px 0 4px; font-size: 17px; font-weight: 600; line-height: 1.5; }
.alias { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.say { margin: 4px 0 8px; padding-left: 22px; }
.say li { margin: 2px 0; }
.say-label { font-size: 13px; color: var(--text-3); margin-top: 6px; }
.tip { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--soft); font-size: 14.5px; color: var(--text-2); }
.tip b { color: var(--text); }
.note { margin: 8px 0 0; font-size: 13.5px; color: var(--text-3); }
.note::before { content: "注："; font-weight: 600; }
.links { margin-top: 8px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.links .lbl { color: var(--text-3); font-size: 13px; }
.src { margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.qlist { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
.qlist td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.qlist td:first-child { width: 58%; }
.qlist td:last-child { color: var(--text-2); }

details.p3 { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
details.p3 > summary { cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--accent); padding: 4px 0; }
details.p3 ol { margin: 6px 0 0; padding-left: 24px; }
details.p3 li { margin: 4px 0; }

.p3-group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin: 10px 0; }
.p3-group > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.p3-group > summary::-webkit-details-marker { display: none; }
.p3-group > summary .no { font: 700 13px var(--mono); color: var(--text-3); }
.p3-group > summary b { font-size: 16px; }
.p3-group > summary .en { color: var(--text-3); font-size: 14px; }
.p3-group[open] > summary { border-bottom: 1px solid var(--line); }
.p3-group ol { margin: 0; padding: 10px 18px 14px 40px; }
.p3-group li { margin: 5px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip-link {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 14px;
}
.chip-link:hover { border-color: var(--accent); text-decoration: none; }
.chip-link.done { background: var(--green-soft); border-color: transparent; color: var(--green); }
.chip-link .no { font: 600 12px var(--mono); color: var(--text-3); }

/* ---------- 写作 ---------- */
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.type-tile { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); display: flex; flex-direction: column; gap: 6px; }
.type-tile:hover { border-color: var(--accent); text-decoration: none; }
.type-tile b { font-size: 17px; }
.type-tile .en { color: var(--text-3); font-size: 13.5px; }
.type-tile .how { color: var(--text-2); font-size: 14px; }
.type-tile .meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--text-3); }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 34px 0 6px; }
.section-head h2 { margin: 0; font-size: 21px; }
.recent-item { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin: 10px 0; }
.recent-item .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--text-3); margin-bottom: 6px; }
.recent-item .q { margin: 0; font-size: 15.5px; line-height: 1.65; }
.recent-item .zh { margin: 6px 0 0; color: var(--text-2); font-size: 14.5px; }
.recent-item .note { margin-top: 6px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager a { display: flex; flex-direction: column; max-width: 48%; color: var(--text); }
.pager a:hover { text-decoration: none; color: var(--accent); }
.pager small { color: var(--text-3); font-size: 12.5px; }
.pager .next { margin-left: auto; text-align: right; }

/* ---------- Markdown 正文 ---------- */
.prose { font-size: 15.5px; }
.prose > :first-child { margin-top: 0; }
.prose h2 { display: flex; align-items: center; gap: 10px; margin: 32px 0 12px; font-size: 20px; line-height: 1.4; }
.prose h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); flex: none; }
.prose h3 { margin: 24px 0 8px; font-size: 17px; }
.prose h4 { margin: 18px 0 6px; font-size: 15.5px; }
.prose p { margin: 10px 0; }
.prose ul, .prose ol { padding-left: 24px; margin: 10px 0; }
.prose li { margin: 4px 0; }
.prose li > p { margin: 4px 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
.prose blockquote { margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--accent-soft); color: var(--text-2); }
.prose blockquote p { margin: 4px 0; }
.prose code { font: 0.88em var(--mono); padding: 1px 5px; border-radius: 5px; background: var(--soft); }
.prose pre { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--soft); overflow-x: auto; }
.prose mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
.prose strong { font-weight: 650; }
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.prose th, .prose td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.prose th { background: var(--soft); font-weight: 600; white-space: nowrap; }
.prose tbody tr:last-child td { border-bottom: 0; }
.prose tr.gap td { padding: 0; height: 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.origin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 30px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.origin:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.origin h2 { margin: 0; font-size: 21px; }

/* ---------- 目录 ---------- */
.toc-title { font-weight: 600; color: var(--text-3); margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; }
.toc a { display: block; padding: 4px 8px; border-left: 2px solid var(--line); color: var(--text-2); line-height: 1.45; }
.toc a.l3 { padding-left: 20px; font-size: 12.5px; }
.toc a:hover { color: var(--accent); border-left-color: var(--accent); text-decoration: none; }

/* ---------- 练习 ---------- */
.practice-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.timer-card { position: sticky; top: calc(var(--topbar) + 16px); text-align: center; }
.phase { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: .03em; }
.clock { margin: 4px 0 6px; font: 700 64px/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clock.warn { color: var(--amber); }
.clock.over { color: var(--red); }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 6px 0 14px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.timer-card .row { justify-content: center; }
.p3-now { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 16px; text-align: left; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 14px; color: var(--text-2); justify-content: center; }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.opts input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.opts select, .picker select {
  min-height: 34px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel);
}
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.picker select { flex: 1; min-width: 200px; }
.picker select.narrow { flex: none; min-width: 0; }
.rec { margin-top: 14px; text-align: left; }
.rec audio { width: 100%; margin-top: 6px; }
.rec-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.p1-q { font-size: 18px; font-weight: 600; margin: 8px 0; }

/* ---------- 搜索 ---------- */
.result { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); color: var(--text); margin: 8px 0; }
.result:hover { border-color: var(--accent); text-decoration: none; }
.result .t { font-weight: 600; }
.result .s { margin-top: 2px; font-size: 14px; color: var(--text-2); }
.result mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- 对话框和提示 ---------- */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(92vw, 380px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(0 0 0 / 35%); }
.exam-form { padding: 20px; }
.exam-form h2 { margin: 0 0 4px; font-size: 18px; }
.exam-form p { margin: 0 0 14px; font-size: 14px; color: var(--text-2); }
.exam-form input { width: 100%; min-height: 40px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); margin-bottom: 16px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 20px);
  padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--panel); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 响应式 ---------- */
@media (max-width: 1279px) {
  .layout { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  .sidebar {
    position: fixed; top: var(--topbar); left: 0; bottom: 0; z-index: 50;
    width: min(86vw, 320px); height: auto;
    transform: translateX(-102%); transition: transform .2s ease;
    box-shadow: var(--shadow);
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: var(--topbar) 0 0 0; z-index: 45; background: rgb(0 0 0 / 30%); }
  main { padding: 22px 18px 88px; }
  .practice-grid { grid-template-columns: minmax(0, 1fr); }
  .timer-card { position: static; }
}
@media (max-width: 640px) {
  body { font-size: 15.5px; }
  .topbar { gap: 8px; padding: 0 10px; }
  .brand-text small { display: none; }
  .search kbd { display: none; }
  .search { max-width: none; }
  .exam-chip { padding: 0 10px; font-size: 13px; }
  h1, .hero h1 { font-size: 24px; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .countdown { border-left: 0; border-top: 1px dashed var(--line-2); padding: 12px 0 0; text-align: left; }
  .hot-cols { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  .qlist, .qlist tbody, .qlist tr, .qlist td { display: block; width: 100% !important; }
  .qlist tr { border-top: 1px solid var(--line); padding: 6px 0; }
  .qlist td { border: 0; padding: 1px 0; }
  .clock { font-size: 56px; }
  .btn, .seg { min-height: 42px; }
  .done-btn { height: 34px; }
}
@media (max-width: 420px) {
  .brand-text { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  .topbar, .sidebar, .toc, .scrim, .done-btn, .card-actions, .filters, .toast { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  .card, .table-wrap, .recent-item { break-inside: avoid; box-shadow: none; }
  details.p3, details.p3-group { display: block; }
}
