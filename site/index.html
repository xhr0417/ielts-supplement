dvantages of …?\u003c/td>\n\u003ctd>利和弊各写一段，可以不表态，结尾给一句倾向更好\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>和 2-4 Positive &amp; Negative 很像。2-4 问“这个趋势好不好”，这里问“好处是不是比坏处大”。结构可以几乎一样，区别在让步段：这里要说明坏处为什么比较小。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h2\">结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>内容（以“利大于弊”为例）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目 + 表态：利大于弊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 1\u003c/td>\n\u003ctd>第一个好处：观点 + 解释 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 2\u003c/td>\n\u003ctd>第二个好处：观点 + 解释 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 3\u003c/td>\n\u003ctd>承认坏处，再说明坏处比较小（短期的、可以解决、只影响少数人）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论\u003c/td>\n\u003ctd>重申利大于弊，概括两个好处\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>如果认为弊大于利，把主体段 1、2 换成两个坏处，主体段 3 承认好处并说明好处有限。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文模板\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It is increasingly common for sb to do sth.\u003c/td>\n\u003ctd>某人做某事越来越普遍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In my view, the advantages of this trend clearly outweigh its disadvantages.\u003c/td>\n\u003ctd>在我看来，这一趋势的好处明显大于坏处。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant advantage is that …\u003c/td>\n\u003ctd>最大的好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since …, it allows sb to do sth.\u003c/td>\n\u003ctd>由于……，这让某人能够做某事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is particularly true for …\u003c/td>\n\u003ctd>这一点对……尤其明显。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For example, …\u003c/td>\n\u003ctd>例如，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Another benefit is that …\u003c/td>\n\u003ctd>另一个好处是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Because …, sb can …\u003c/td>\n\u003ctd>因为……，某人可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Instead of doing sth, sb can …\u003c/td>\n\u003ctd>某人不必……，而是可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>For instance, …\u003c/td>\n\u003ctd>举例来说，……\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Admittedly, there are some drawbacks.\u003c/td>\n\u003ctd>诚然，这也有一些缺点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main disadvantage is that …\u003c/td>\n\u003ctd>主要的缺点是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>However, this problem can be addressed by …\u003c/td>\n\u003ctd>不过这个问题可以通过……来缓解。（不要默认它“通常是暂时的”）\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In conclusion, although sth may bring some problems such as …, I believe its benefits outweigh its drawbacks, because it can …\u003c/td>\n\u003ctd>总之，尽管某事可能带来……等问题，我认为它利大于弊，因为它能……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">示例（2026 年 9 月下旬真题回忆）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks?\u003cbr>\u003cstrong>译\u003c/strong>：越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：It is increasingly common for young people to attend universities in other countries. In my view, the benefits of studying abroad clearly outweigh the drawbacks.\u003cbr>\u003cstrong>译\u003c/strong>：年轻人去国外读大学越来越普遍。在我看来，出国留学的好处明显大于坏处。\u003c/p>\n\u003cp>\u003cstrong>主体段 1\u003c/strong>：The most significant benefit is that students can receive a high-quality education. Since many overseas universities have excellent teachers and modern laboratories, they allow students to learn the latest knowledge in their field. This is particularly true for subjects such as engineering and medicine. For example, a student who studies computer science in the UK can take part in real research projects, which will make him more competitive when he looks for a job.\u003cbr>\u003cstrong>译\u003c/strong>：最大的好处是学生能接受高质量的教育。由于很多海外大学有优秀的老师和现代化的实验室，学生能学到本领域最新的知识。这一点对工程、医学这类专业尤其明显。例如，在英国读计算机的学生可以参与真实的科研项目，这会让他找工作时更有竞争力。\u003c/p>\n\u003cp>\u003cstrong>主体段 2\u003c/strong>：Another benefit is that studying abroad helps young people become more independent and open-minded. Because they live far away from their families, they have to cook, manage their money and solve problems on their own. Instead of only reading about other cultures, they can make friends from different countries and experience different ways of life. For instance, many international students learn to plan their budgets and deal with cultural differences within their first year.\u003cbr>\u003cstrong>译\u003c/strong>：另一个好处是，留学让年轻人更独立、更开放。因为远离家人，他们必须自己做饭、管钱、解决问题。他们不只是在书上了解其他文化，而是能结交不同国家的朋友，体验不同的生活方式。举例来说，很多留学生在第一年就学会了规划开支、应对文化差异。\u003c/p>\n\u003cp>\u003cstrong>主体段 3\u003c/strong>：Admittedly, there are some drawbacks. The main disadvantage is the high cost, as tuition fees and living expenses in many countries are very expensive. Some students may also feel lonely at the beginning. However, these problems can be addressed. Students can apply for scholarships or work part-time to ease the financial burden, and most universities run orientation and buddy programmes that help newcomers settle in.\u003cbr>\u003cstrong>译\u003c/strong>：诚然，留学也有一些缺点。主要的缺点是花费高，很多国家的学费和生活费都很贵。有些学生刚开始也会感到孤独。不过这些问题都有办法缓解：学生可以申请奖学金或做兼职来减轻经济负担，多数学校也会安排迎新和伙伴计划，帮助新生更快适应。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, although studying abroad may bring some problems such as financial pressure and loneliness, I believe its benefits outweigh its drawbacks, because it can provide a better education and help young people grow up.\u003cbr>\u003cstrong>译\u003c/strong>：总之，尽管留学可能带来经济压力、孤独等问题，我认为它利大于弊，因为它能提供更好的教育，并帮助年轻人成长。\u003c/p>\n\u003ch2 id=\"h5\">注意\u003c/h2>\n\u003cul>\n\u003cli>outweigh 题一定要写出“哪边更大”，开头和结论各说一次。\u003c/li>\n\u003cli>让步段不能只列坏处，要接一句 However，说明坏处为什么比较小。\u003c/li>\n\u003cli>只问 \u003cem>What are the advantages and disadvantages\u003c/em> 时，利一段、弊一段即可，结构见 \u003ca href=\"#/w/t2-twopart\">2-5 Two-part questions\u003c/a>。\u003c/li>\n\u003cli>同一个留学话题的 Positive or negative 写法，见原作者的 \u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>，可以对照着看两种问法的区别。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"结构"},{"level":2,"id":"h3","text":"模板"},{"level":2,"id":"h4","text":"示例（2026 年 9 月下旬真题回忆）"},{"level":2,"id":"h5","text":"注意"}],"text":"题型识别 问法 要做什么 Do the advantages outweigh the disadvantages? / Do the benefits outweigh the drawbacks? 必须表态：利大于弊，或弊大于利 What are the advantages and disadvantages of …? 利和弊各写一段，可以不表态，结尾给一句倾向更好 和 2-4 Positive & Negative 很像。2-4 问“这个趋势好不好”，这里问“好处是不是比坏处大”。结构可以几乎一样，区别在让步段：这里要说明坏处为什么比较小。 结构 段落 内容（以“利大于弊”为例） 开头 改写题目 + 表态：利大于弊 主体段 1 第一个好处：观点 + 解释 + 例子 主体段 2 第二个好处：观点 + 解释 + 例子 主体段 3 承认坏处，再说明坏处比较小（短期的、可以解决、只影响少数人） 结论 重申利大于弊，概括两个好处 如果认为弊大于利，把主体段 1、2 换成两个坏处，主体段 3 承认好处并说明好处有限。 模板 英文模板 中文翻译 It is increasingly common for sb to do sth. 某人做某事越来越普遍。 In my view, the advantages of this trend clearly outweigh its disadvantages. 在我看来，这一趋势的好处明显大于坏处。 The most significant advantage is that … 最大的好处是…… Since …, it allows sb to do sth. 由于……，这让某人能够做某事。 This is particularly true for … 这一点对……尤其明显。 For example, … 例如，…… Another benefit is that … 另一个好处是…… Because …, sb can … 因为……，某人可以…… Instead of doing sth, sb can … 某人不必……，而是可以…… For instance, … 举例来说，…… Admittedly, there are some drawbacks. 诚然，这也有一些缺点。 The main disadvantage is that … 主要的缺点是…… However, this problem can be addressed by … 不过这个问题可以通过……来缓解。（不要默认它“通常是暂时的”） In conclusion, although sth may bring some problems such as …, I believe its benefits outweigh its drawbacks, because it can … 总之，尽管某事可能带来……等问题，我认为它利大于弊，因为它能…… 示例（2026 年 9 月下旬真题回忆） 题目：More and more students are choosing to study at colleges and universities in a foreign country. Do the benefits of studying abroad outweigh the drawbacks? 译：越来越多的学生选择去国外上大学。出国留学的好处大于坏处吗？ 开头：It is increasingly common for young people to attend universities in other countries. In my view, the benefits of studying abroad clearly outweigh the drawbacks. 译：年轻人去国外读大学越来越普遍。在我看来，出国留学的好处明显大于坏处。 主体段 1：The most significant benefit is that students can receive a high-quality education. Since many overseas universities have excellent teachers and modern laboratories, they allow students to learn the latest knowledge in their field. This is particularly true for subjects such as engineering and medicine. For example, a student who studies computer science in the UK can take part in real research projects, which will make him more competitive when he looks for a job. 译：最大的好处是学生能接受高质量的教育。由于很多海外大学有优秀的老师和现代化的实验室，学生能学到本领域最新的知识。这一点对工程、医学这类专业尤其明显。例如，在英国读计算机的学生可以参与真实的科研项目，这会让他找工作时更有竞争力。 主体段 2：Another benefit is that studying abroad helps young people become more independent and open-minded. Because they live far away from their families, they have to cook, manage their money and solve problems on their own. Instead of only reading about other cultures, they can make friends from different countries and experience different ways of life. For instance, many international students learn to plan their budgets and deal with cultural differences within their first year. 译：另一个好处是，留学让年轻人更独立、更开放。因为远离家人，他们必须自己做饭、管钱、解决问题。他们不只是在书上了解其他文化，而是能结交不同国家的朋友，体验不同的生活方式。举例来说，很多留学生在第一年就学会了规划开支、应对文化差异。 主体段 3：Admittedly, there are some drawbacks. The main disadvantage is the high cost, as tuition fees and living expenses in many countries are very expensive. Some students may also feel lonely at the beginning. However, these problems can be addressed. Students can apply for scholarships or work part-time to ease the financial burden, and most universities run orientation and buddy programmes that help newcomers settle in. 译：诚然，留学也有一些缺点。主要的缺点是花费高，很多国家的学费和生活费都很贵。有些学生刚开始也会感到孤独。不过这些问题都有办法缓解：学生可以申请奖学金或做兼职来减轻经济负担，多数学校也会安排迎新和伙伴计划，帮助新生更快适应。 结论：In conclusion, although studying abroad may bring some problems such as financial pressure and loneliness, I believe its benefits outweigh its drawbacks, because it can provide a better education and help young people grow up. 译：总之，尽管留学可能带来经济压力、孤独等问题，我认为它利大于弊，因为它能提供更好的教育，并帮助年轻人成长。 注意 outweigh 题一定要写出“哪边更大”，开头和结论各说一次。 让步段不能只列坏处，要接一句 However，说明坏处为什么比较小。 只问 What are the advantages and disadvantages 时，利一段、弊一段即可，结构见 2-5 Two-part questions。 同一个留学话题的 Positive or negative 写法，见原作者的 2-4 Positive & Negative，可以对照着看两种问法的区别。"},{"id":"s-p2-know-more","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充1-一见且想继续了解的人.md","title":"P2 补充 1 · 偶遇的志愿者（一见想了解 / 快乐 / 受欢迎 / 历史）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#1 一见且想继续了解的人\u003c/code>、\u003ccode>#6 快乐的人\u003c/code>、\u003ccode>#8 受欢迎的人\u003c/code>、\u003ccode>#10 学习并喜欢历史的人\u003c/code>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>met him by chance\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>偶然遇到他\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked as a part-time volunteer\u003c/td>\n\u003ctd>做兼职志愿者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>struck up a conversation\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>聊了起来 / 搭话\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>has a great sense of humour\u003c/td>\n\u003ctd>很有幽默感\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>full of positive energy\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>充满正能量\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>knows a lot about local history\u003c/td>\n\u003ctd>对当地历史非常了解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>brought the old stories to life\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>把老故事讲得活灵活现\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>got along really well with everyone\u003c/td>\n\u003ctd>和每个人都相处得很好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>exchanged WeChat contacts\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>交换了微信\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learn more about his life experiences\u003c/td>\n\u003ctd>更多了解他的人生经历\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿：#1 一见且想继续了解的人（Describe a person you only met once recently and want to know more about）\u003c/h2>\n\u003ch3 id=\"h2\">1. 人物与偶遇场景（Who &amp; Where）\u003c/h3>\n\u003cp>I&#39;d like to talk about a guy named Lin, whom I \u003cmark>met by chance\u003c/mark> last month during a weekend trip to an old town near my city. He was a university student working as a part-time volunteer guide at a local history museum.\u003c/p>\n\u003cp>我想聊一个叫林的男生，是我上个月周末去附近古镇玩时偶然认识的。他是一名大学生，在当地历史博物馆做兼职志愿者讲解员。\u003c/p>\n\u003ch3 id=\"h3\">2. 聊了什么（What you talked about）\u003c/h3>\n\u003cp>At that time, I was looking at some old photos of the town, and he came over and \u003cmark>struck up a conversation\u003c/mark> with me. Instead of giving a boring lecture, he \u003cmark>brought the old stories to life\u003c/mark>. We talked for about half an hour about how the town changed over the past century, as well as our favourite books and travel experiences.\u003c/p>\n\u003cp>当时我正在看古镇的一些老照片，他走过来和我聊了起来。他没有照本宣科，而是把老故事讲得活灵活现。我们聊了大概半小时，从古镇近百年的变迁聊到各自喜欢的书和旅行经历。\u003c/p>\n\u003ch3 id=\"h4\">3. 为什么想进一步了解他（Why you want to know more）\u003c/h3>\n\u003cp>Before I left, we \u003cmark>exchanged WeChat contacts\u003c/mark>, and I really hope to hang out with him again. \u003cmark>The main reason is that\u003c/mark> he is so knowledgeable and \u003cmark>full of positive energy\u003c/mark>. Even though we only met once, I felt like we had a lot in common, and I&#39;d love to \u003cmark>learn more about his life experiences\u003c/mark> and how he studies history in such an interesting way.\u003c/p>\n\u003cp>离开前我们交换了微信，我非常希望以后能再约他出来。主要原因是他知识面很广，而且充满正能量。虽然只见过一次，但我觉得我们很投缘，很想进一步了解他的经历，看看他是怎么把历史学得这么有趣的。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h5\">二、同素材切换到另外 3 张题卡（怎么改重心）\u003c/h2>\n\u003ch3 id=\"h6\">切换为 #6 快乐的人（Describe a happy person you know）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about my friend Lin, who is the happiest and most optimistic person I know.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：少讲“只见过一次”，重点讲他\u003cstrong>平时如何表现快乐\u003c/strong>：\u003cblockquote>\n\u003cp>He always wears a warm smile and \u003cmark>has a great sense of humour\u003c/mark>. Whenever people around him feel stressed about exams or work, he tells funny stories to cheer them up. Even when he faces difficulties in life, he looks on the bright side instead of complaining, which is why I think he is genuinely happy.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h7\">切换为 #8 受欢迎的人（Describe a popular person）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about Lin, a volunteer guide and senior student at my university who is super popular among students.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>大家为什么喜欢他\u003c/strong>：\u003cblockquote>\n\u003cp>He \u003cmark>gets along really well with everyone\u003c/mark> because he is always patient, humble, and willing to help newcomers. Whenever he organizes campus tours or history sharing sessions, dozens of students sign up immediately. People enjoy being around him because he listens carefully and makes everyone feel valued.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h8\">切换为 #10 学习并喜欢历史的人（Describe a person who learns history and loves history）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about my friend Lin, who is a huge fan of history.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>他怎么学历史、为什么热爱历史\u003c/strong>：\u003cblockquote>\n\u003cp>Rather than just memorizing dates for exams, he learns history by reading biographies, visiting museums, and talking to local elders. He loves history because he believes understanding the past helps us make wiser choices today. Every time we chat, he \u003cmark>brings the old stories to life\u003c/mark>, which makes me admire him a lot.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"一、主稿：#1 一见且想继续了解的人（Describe a person you only met once recently and want to know more about）"},{"level":3,"id":"h2","text":"1. 人物与偶遇场景（Who & Where）"},{"level":3,"id":"h3","text":"2. 聊了什么（What you talked about）"},{"level":3,"id":"h4","text":"3. 为什么想进一步了解他（Why you want to know more）"},{"level":2,"id":"h5","text":"二、同素材切换到另外 3 张题卡（怎么改重心）"},{"level":3,"id":"h6","text":"切换为 #6 快乐的人（Describe a happy person you know）"},{"level":3,"id":"h7","text":"切换为 #8 受欢迎的人（Describe a popular person）"},{"level":3,"id":"h8","text":"切换为 #10 学习并喜欢历史的人（Describe a person who learns history and loves history）"}],"text":"覆盖题卡：#1 一见且想继续了解的人、#6 快乐的人、#8 受欢迎的人、#10 学习并喜欢历史的人 英文短语 中文释义 met him by chance 偶然遇到他 worked as a part-time volunteer 做兼职志愿者 struck up a conversation 聊了起来 / 搭话 has a great sense of humour 很有幽默感 full of positive energy 充满正能量 knows a lot about local history 对当地历史非常了解 brought the old stories to life 把老故事讲得活灵活现 got along really well with everyone 和每个人都相处得很好 exchanged WeChat contacts 交换了微信 learn more about his life experiences 更多了解他的人生经历 一、主稿：#1 一见且想继续了解的人（Describe a person you only met once recently and want to know more about） 1. 人物与偶遇场景（Who & Where） I'd like to talk about a guy named Lin, whom I met by chance last month during a weekend trip to an old town near my city. He was a university student working as a part-time volunteer guide at a local history museum. 我想聊一个叫林的男生，是我上个月周末去附近古镇玩时偶然认识的。他是一名大学生，在当地历史博物馆做兼职志愿者讲解员。 2. 聊了什么（What you talked about） At that time, I was looking at some old photos of the town, and he came over and struck up a conversation with me. Instead of giving a boring lecture, he brought the old stories to life. We talked for about half an hour about how the town changed over the past century, as well as our favourite books and travel experiences. 当时我正在看古镇的一些老照片，他走过来和我聊了起来。他没有照本宣科，而是把老故事讲得活灵活现。我们聊了大概半小时，从古镇近百年的变迁聊到各自喜欢的书和旅行经历。 3. 为什么想进一步了解他（Why you want to know more） Before I left, we exchanged WeChat contacts, and I really hope to hang out with him again. The main reason is that he is so knowledgeable and full of positive energy. Even though we only met once, I felt like we had a lot in common, and I'd love to learn more about his life experiences and how he studies history in such an interesting way. 离开前我们交换了微信，我非常希望以后能再约他出来。主要原因是他知识面很广，而且充满正能量。虽然只见过一次，但我觉得我们很投缘，很想进一步了解他的经历，看看他是怎么把历史学得这么有趣的。 二、同素材切换到另外 3 张题卡（怎么改重心） 切换为 #6 快乐的人（Describe a happy person you know） 开头改一句：I'd like to talk about my friend Lin, who is the happiest and most optimistic person I know. 重心调整：少讲“只见过一次”，重点讲他平时如何表现快乐： He always wears a warm smile and has a great sense of humour. Whenever people around him feel stressed about exams or work, he tells funny stories to cheer them up. Even when he faces difficulties in life, he looks on the bright side instead of complaining, which is why I think he is genuinely happy. 切换为 #8 受欢迎的人（Describe a popular person） 开头改一句：I'd like to talk about Lin, a volunteer guide and senior student at my university who is super popular among students. 重心调整：重点讲大家为什么喜欢他： He gets along really well with everyone because he is always patient, humble, and willing to help newcomers. Whenever he organizes campus tours or history sharing sessions, dozens of students sign up immediately. People enjoy being around him because he listens carefully and makes everyone feel valued. 切换为 #10 学习并喜欢历史的人（Describe a person who learns history and loves history） 开头改一句：I'd like to talk about my friend Lin, who is a huge fan of history. 重心调整：重点讲他怎么学历史、为什么热爱历史： Rather than just memorizing dates for exams, he learns history by reading biographies, visiting museums, and talking to local elders. He loves history because he believes understanding the past helps us make wiser choices today. Every time we chat, he brings the old stories to life, which makes me admire him a lot."},{"id":"s-p2-business","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充2-有成功事业与条理的人.md","title":"P2 补充 2 · 陶艺咖啡店主（成功事业 / 有条理 / 手工 / 本地名人）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#3 有成功事业的人\u003c/code>、\u003ccode>#7 很有条理的人\u003c/code>、\u003ccode>#11 擅长做手工的人\u003c/code>、\u003ccode>#13 本地名人\u003c/code>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>started from scratch\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>白手起家 / 从零开始\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>runs a handmade pottery and coffee studio\u003c/td>\n\u003ctd>经营一家手工陶艺与咖啡工作室\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>turned her passion into a business\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>把热爱变成了事业\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rented a small shop in an old alley\u003c/td>\n\u003ctd>在老巷子里租了一间小店\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>shared short videos on social media\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>在社交媒体上发短视频\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pays close attention to every detail\u003c/td>\n\u003ctd>对每个细节都格外用心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>keeps a well-planned schedule\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>保持规划清晰的日程\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>moulds clay by hand\u003c/td>\n\u003ctd>亲手塑形陶土\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>word of mouth\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>口碑相传\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>built a loyal customer base\u003c/td>\n\u003ctd>积累了一批忠实顾客\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿：#3 有成功事业的人（Describe a person you know who has a successful business）\u003c/h2>\n\u003ch3 id=\"h2\">1. 人物与认识途径（Who &amp; How you knew her）\u003c/h3>\n\u003cp>I&#39;d like to talk about my cousin&#39;s friend, Ms. Chen, who \u003cmark>runs a successful handmade pottery and coffee studio\u003c/mark> in my city. I got to know her two years ago when I went to her shop for a weekend pottery workshop.\u003c/p>\n\u003cp>我想聊聊我表姐的朋友陈女士，她在我们城市经营一家很成功的手工陶艺与咖啡工作室。两年前我去她店里参加周末陶艺体验课时认识了她。\u003c/p>\n\u003ch3 id=\"h3\">2. 为什么及如何创业（Why &amp; How she started the business）\u003c/h3>\n\u003cp>She used to be a graphic designer at a big company, but she got tired of sitting in front of a computer all day. Since she loved making ceramics in her spare time, she decided to \u003cmark>turn her passion into a business\u003c/mark>. Five years ago, she \u003cmark>started from scratch\u003c/mark> with her own savings, \u003cmark>rented a small shop in an old alley\u003c/mark>, and bought two kilns and a coffee machine.\u003c/p>\n\u003cp>她以前在一家大公司做平面设计师，但厌倦了整天坐在电脑前。因为业余时间热爱陶艺，她决定把热爱变成事业。五年前，她用自己的积蓄从零起步，在老巷子里租了间小店，买了两台窑炉和一台咖啡机。\u003c/p>\n\u003ch3 id=\"h4\">3. 生意内容与成功原因（What business &amp; Why it is successful）\u003c/h3>\n\u003cp>Today, her studio offers handmade mugs, plates, and weekend DIY classes, and it has expanded to three branches. I think her business is successful for two reasons. First, she \u003cmark>pays close attention to every detail\u003c/mark> and never compromises on quality. Second, she \u003cmark>shares short videos on social media\u003c/mark> showing how each cup is made, which attract lots of young people through \u003cmark>word of mouth\u003c/mark> and \u003cmark>have built a loyal customer base\u003c/mark>.\u003c/p>\n\u003cp>如今，她的工作室不仅售卖手工马克杯和餐盘，还开设周末手工课，并且已经开到了三家分店。我觉得她成功有两个原因：一是她对每个细节都极其用心，从不敷衍质量；二是她在社交媒体上发短视频展示每个杯子的制作过程，靠口碑吸引了大量年轻人，积累了稳定的客源。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h5\">二、同素材切换到另外 3 张题卡（怎么改重心）\u003c/h2>\n\u003ch3 id=\"h6\">切换为 #7 很有条理的人（Describe a person you know who is very organized）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about Ms. Chen, a studio owner I know who is the most organized person I&#39;ve ever met.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>她日常怎么规划时间和整理物品\u003c/strong>：\u003cblockquote>\n\u003cp>Since she has to manage custom orders, teach classes, and run social media at the same time, she \u003cmark>keeps a well-planned schedule\u003c/mark> every single day. In her workshop, hundreds of tools and glazes are labelled clearly and put in order. Because she is so organized, she rarely misses a deadline and handles busy weekends calmly.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h7\">切换为 #11 擅长做手工的人（Describe a person who is good at making things by hand）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about Ms. Chen, who is really good at making ceramics and pottery by hand.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>她做什么手工、用什么材料和步骤\u003c/strong>：\u003cblockquote>\n\u003cp>She \u003cmark>moulds clay by hand\u003c/mark> on a potter&#39;s wheel, carves delicate patterns of flowers or mountains on the surface, and then glazes and fires them in a kiln at high temperatures. Every mug she makes is unique and feels warm in the hand, which shows her patience and creativity.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h8\">切换为 #13 本地名人（Describe a famous person in your local area）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about Ms. Chen, a well-known local craftswoman and entrepreneur in my city.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>她为什么在当地出名、为社区做了什么\u003c/strong>：\u003cblockquote>\n\u003cp>She became famous locally after her traditional pottery videos went viral online and were reported by our city&#39;s TV station. Besides running her studio, she often holds free craft classes for community elders and children, which makes her widely respected in our city.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"一、主稿：#3 有成功事业的人（Describe a person you know who has a successful business）"},{"level":3,"id":"h2","text":"1. 人物与认识途径（Who & How you knew her）"},{"level":3,"id":"h3","text":"2. 为什么及如何创业（Why & How she started the business）"},{"level":3,"id":"h4","text":"3. 生意内容与成功原因（What business & Why it is successful）"},{"level":2,"id":"h5","text":"二、同素材切换到另外 3 张题卡（怎么改重心）"},{"level":3,"id":"h6","text":"切换为 #7 很有条理的人（Describe a person you know who is very organized）"},{"level":3,"id":"h7","text":"切换为 #11 擅长做手工的人（Describe a person who is good at making things by hand）"},{"level":3,"id":"h8","text":"切换为 #13 本地名人（Describe a famous person in your local area）"}],"text":"覆盖题卡：#3 有成功事业的人、#7 很有条理的人、#11 擅长做手工的人、#13 本地名人 英文短语 中文释义 started from scratch 白手起家 / 从零开始 runs a handmade pottery and coffee studio 经营一家手工陶艺与咖啡工作室 turned her passion into a business 把热爱变成了事业 rented a small shop in an old alley 在老巷子里租了一间小店 shared short videos on social media 在社交媒体上发短视频 pays close attention to every detail 对每个细节都格外用心 keeps a well-planned schedule 保持规划清晰的日程 moulds clay by hand 亲手塑形陶土 word of mouth 口碑相传 built a loyal customer base 积累了一批忠实顾客 一、主稿：#3 有成功事业的人（Describe a person you know who has a successful business） 1. 人物与认识途径（Who & How you knew her） I'd like to talk about my cousin's friend, Ms. Chen, who runs a successful handmade pottery and coffee studio in my city. I got to know her two years ago when I went to her shop for a weekend pottery workshop. 我想聊聊我表姐的朋友陈女士，她在我们城市经营一家很成功的手工陶艺与咖啡工作室。两年前我去她店里参加周末陶艺体验课时认识了她。 2. 为什么及如何创业（Why & How she started the business） She used to be a graphic designer at a big company, but she got tired of sitting in front of a computer all day. Since she loved making ceramics in her spare time, she decided to turn her passion into a business. Five years ago, she started from scratch with her own savings, rented a small shop in an old alley, and bought two kilns and a coffee machine. 她以前在一家大公司做平面设计师，但厌倦了整天坐在电脑前。因为业余时间热爱陶艺，她决定把热爱变成事业。五年前，她用自己的积蓄从零起步，在老巷子里租了间小店，买了两台窑炉和一台咖啡机。 3. 生意内容与成功原因（What business & Why it is successful） Today, her studio offers handmade mugs, plates, and weekend DIY classes, and it has expanded to three branches. I think her business is successful for two reasons. First, she pays close attention to every detail and never compromises on quality. Second, she shares short videos on social media showing how each cup is made, which attract lots of young people through word of mouth and have built a loyal customer base. 如今，她的工作室不仅售卖手工马克杯和餐盘，还开设周末手工课，并且已经开到了三家分店。我觉得她成功有两个原因：一是她对每个细节都极其用心，从不敷衍质量；二是她在社交媒体上发短视频展示每个杯子的制作过程，靠口碑吸引了大量年轻人，积累了稳定的客源。 二、同素材切换到另外 3 张题卡（怎么改重心） 切换为 #7 很有条理的人（Describe a person you know who is very organized） 开头改一句：I'd like to talk about Ms. Chen, a studio owner I know who is the most organized person I've ever met. 重心调整：重点讲她日常怎么规划时间和整理物品： Since she has to manage custom orders, teach classes, and run social media at the same time, she keeps a well-planned schedule every single day. In her workshop, hundreds of tools and glazes are labelled clearly and put in order. Because she is so organized, she rarely misses a deadline and handles busy weekends calmly. 切换为 #11 擅长做手工的人（Describe a person who is good at making things by hand） 开头改一句：I'd like to talk about Ms. Chen, who is really good at making ceramics and pottery by hand. 重心调整：重点讲她做什么手工、用什么材料和步骤： She moulds clay by hand on a potter's wheel, carves delicate patterns of flowers or mountains on the surface, and then glazes and fires them in a kiln at high temperatures. Every mug she makes is unique and feels warm in the hand, which shows her patience and creativity. 切换为 #13 本地名人（Describe a famous person in your local area） 开头改一句：I'd like to talk about Ms. Chen, a well-known local craftswoman and entrepreneur in my city. 重心调整：重点讲她为什么在当地出名、为社区做了什么： She became famous locally after her traditional pottery videos went viral online and were reported by our city's TV station. Besides running her studio, she often holds free craft classes for community elders and children, which makes her widely respected in our city."},{"id":"s-p2-saved-tech","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充3-省钱买科技产品与好服务.md","title":"P2 补充 3 · 攒钱买平板（省钱 / 科技产品 / 商店好服务）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#30 省钱买想要的东西\u003c/code>、\u003ccode>#22 想拥有的科技产品（不能是手机）\u003c/code>、\u003ccode>#34 在商店得到好的服务\u003c/code>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>a digital tablet with a stylus\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>带手写笔的平板电脑（iPad）\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go paperless for my studies\u003c/td>\n\u003ctd>学习实现无纸化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>put aside part of my monthly allowance\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>每月从生活费里存下一部分\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cut down on unnecessary spending\u003c/td>\n\u003ctd>削减不必要的开销\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>cooked meals at home instead of ordering takeaway\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>自己做饭而不点外卖\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>did a weekend part-time tutoring job\u003c/td>\n\u003ctd>周末做兼职家教\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>a strong sense of achievement\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>强烈的成就感\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>patient and knowledgeable staff\u003c/td>\n\u003ctd>耐心又专业的店员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>walked me through the features\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>带我逐一了解各项功能\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>helped me apply for a student discount\u003c/td>\n\u003ctd>帮我申请了学生优惠\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿：#30 省钱买想要的东西（Describe a time when you saved money to buy something special）\u003c/h2>\n\u003ch3 id=\"h2\">1. 想买什么及原因（What &amp; Why）\u003c/h3>\n\u003cp>I&#39;d like to talk about the time I saved money last year to buy \u003cmark>a digital tablet with a stylus\u003c/mark>. As a student, I had to read dozens of PDF papers and take lots of notes every week. Printing them out was heavy and wasteful, so I really wanted a tablet to \u003cmark>go paperless for my studies\u003c/mark>, without asking my parents for extra money.\u003c/p>\n\u003cp>我想讲讲去年我自己攒钱买一台带手写笔的平板电脑的经历。作为学生，我每周要读几十篇 PDF 文献、记大量笔记。全部打印出来又重又浪费，所以我很想买台平板实现无纸化学习，同时不想找父母额外要钱。\u003c/p>\n\u003ch3 id=\"h3\">2. 怎么省钱的（How you saved money）\u003c/h3>\n\u003cp>The tablet cost around 4,000 yuan, so it took me four months to save enough. First, I \u003cmark>put aside part of my monthly allowance\u003c/mark> as soon as I received it. Second, I \u003cmark>cut down on unnecessary spending\u003c/mark>—for example, I \u003cmark>cooked meals at home instead of ordering takeaway\u003c/mark> and stopped buying milk tea every day. On top of that, I \u003cmark>did a weekend part-time tutoring job\u003c/mark> to earn some extra cash.\u003c/p>\n\u003cp>那台平板大约 4000 元，我攒了四个月。首先，每个月生活费一到账我就先存起一部分；其次，我削减了不必要的开销，比如自己做饭代替点外卖、戒掉每天喝奶茶的习惯；此外，我还利用周末兼职做家教赚了一点外快。\u003c/p>\n\u003ch3 id=\"h4\">3. 买到后的感受（How you felt）\u003c/h3>\n\u003cp>When I finally walked into the store and paid for it with my own money, I felt \u003cmark>a strong sense of achievement\u003c/mark>. Because I worked hard to save for it, I cherish this tablet much more than gifts given by others, and I use it every single day for my exam preparation.\u003c/p>\n\u003cp>当我最终走进店里用自己攒的钱买下它时，我感到了强烈的成就感。正因为是辛苦攒钱买的，我比别人送的礼物更加珍惜它，现在每天备考都离不开它。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h5\">二、同素材切换到另外 2 张题卡（怎么改重心）\u003c/h2>\n\u003ch3 id=\"h6\">切换为 #22 想拥有的科技产品，不能是手机（Describe a piece of technology, not a phone, that you would like to own）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头时态改为现在/将来\u003c/strong>：I&#39;d like to talk about \u003cmark>a digital tablet with a stylus\u003c/mark>—specifically an e-ink tablet—that I really want to own in the near future.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：不讲“已经买到手”，重点讲\u003cstrong>它的功能、怎么帮到你、为什么现在还没买\u003c/strong>：\u003cblockquote>\n\u003cp>Unlike a smartphone with a small screen and constant social media notifications, an e-ink tablet is designed for reading PDFs and taking handwritten notes, and its screen doesn&#39;t hurt the eyes after long hours of reading. It would help me \u003cmark>go paperless for my studies\u003c/mark> and stay focused. I haven&#39;t bought it yet because it&#39;s a bit pricey for a student, so I&#39;m currently \u003cmark>putting aside part of my monthly allowance\u003c/mark> to buy it next month.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h7\">切换为 #34 在商店得到好的服务（Describe a time when you received good service in a shop/store）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about a time when I received fantastic service at an electronics store in my city last year when I went to buy a tablet.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>店员具体怎么帮你的\u003c/strong>：\u003cblockquote>\n\u003cp>At that time, I couldn&#39;t decide which model suited my budget. A \u003cmark>patient and knowledgeable staff\u003c/mark> member named Kevin didn&#39;t push me to buy the most expensive one. Instead, he asked about my study needs, \u003cmark>walked me through the features\u003c/mark> of two different models, and even \u003cmark>helped me apply for a student discount\u003c/mark>, which saved me 400 yuan. His honest and warm attitude made me feel really respected.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"一、主稿：#30 省钱买想要的东西（Describe a time when you saved money to buy something special）"},{"level":3,"id":"h2","text":"1. 想买什么及原因（What & Why）"},{"level":3,"id":"h3","text":"2. 怎么省钱的（How you saved money）"},{"level":3,"id":"h4","text":"3. 买到后的感受（How you felt）"},{"level":2,"id":"h5","text":"二、同素材切换到另外 2 张题卡（怎么改重心）"},{"level":3,"id":"h6","text":"切换为 #22 想拥有的科技产品，不能是手机（Describe a piece of technology, not a phone, that you would like to own）"},{"level":3,"id":"h7","text":"切换为 #34 在商店得到好的服务（Describe a time when you received good service in a shop/store）"}],"text":"覆盖题卡：#30 省钱买想要的东西、#22 想拥有的科技产品（不能是手机）、#34 在商店得到好的服务 英文短语 中文释义 a digital tablet with a stylus 带手写笔的平板电脑（iPad） go paperless for my studies 学习实现无纸化 put aside part of my monthly allowance 每月从生活费里存下一部分 cut down on unnecessary spending 削减不必要的开销 cooked meals at home instead of ordering takeaway 自己做饭而不点外卖 did a weekend part-time tutoring job 周末做兼职家教 a strong sense of achievement 强烈的成就感 patient and knowledgeable staff 耐心又专业的店员 walked me through the features 带我逐一了解各项功能 helped me apply for a student discount 帮我申请了学生优惠 一、主稿：#30 省钱买想要的东西（Describe a time when you saved money to buy something special） 1. 想买什么及原因（What & Why） I'd like to talk about the time I saved money last year to buy a digital tablet with a stylus. As a student, I had to read dozens of PDF papers and take lots of notes every week. Printing them out was heavy and wasteful, so I really wanted a tablet to go paperless for my studies, without asking my parents for extra money. 我想讲讲去年我自己攒钱买一台带手写笔的平板电脑的经历。作为学生，我每周要读几十篇 PDF 文献、记大量笔记。全部打印出来又重又浪费，所以我很想买台平板实现无纸化学习，同时不想找父母额外要钱。 2. 怎么省钱的（How you saved money） The tablet cost around 4,000 yuan, so it took me four months to save enough. First, I put aside part of my monthly allowance as soon as I received it. Second, I cut down on unnecessary spending—for example, I cooked meals at home instead of ordering takeaway and stopped buying milk tea every day. On top of that, I did a weekend part-time tutoring job to earn some extra cash. 那台平板大约 4000 元，我攒了四个月。首先，每个月生活费一到账我就先存起一部分；其次，我削减了不必要的开销，比如自己做饭代替点外卖、戒掉每天喝奶茶的习惯；此外，我还利用周末兼职做家教赚了一点外快。 3. 买到后的感受（How you felt） When I finally walked into the store and paid for it with my own money, I felt a strong sense of achievement. Because I worked hard to save for it, I cherish this tablet much more than gifts given by others, and I use it every single day for my exam preparation. 当我最终走进店里用自己攒的钱买下它时，我感到了强烈的成就感。正因为是辛苦攒钱买的，我比别人送的礼物更加珍惜它，现在每天备考都离不开它。 二、同素材切换到另外 2 张题卡（怎么改重心） 切换为 #22 想拥有的科技产品，不能是手机（Describe a piece of technology, not a phone, that you would like to own） 开头时态改为现在/将来：I'd like to talk about a digital tablet with a stylus—specifically an e-ink tablet—that I really want to own in the near future. 重心调整：不讲“已经买到手”，重点讲它的功能、怎么帮到你、为什么现在还没买： Unlike a smartphone with a small screen and constant social media notifications, an e-ink tablet is designed for reading PDFs and taking handwritten notes, and its screen doesn't hurt the eyes after long hours of reading. It would help me go paperless for my studies and stay focused. I haven't bought it yet because it's a bit pricey for a student, so I'm currently putting aside part of my monthly allowance to buy it next month. 切换为 #34 在商店得到好的服务（Describe a time when you received good service in a shop/store） 开头改一句：I'd like to talk about a time when I received fantastic service at an electronics store in my city last year when I went to buy a tablet. 重心调整：重点讲店员具体怎么帮你的： At that time, I couldn't decide which model suited my budget. A patient and knowledgeable staff member named Kevin didn't push me to buy the most expensive one. Instead, he asked about my study needs, walked me through the features of two different models, and even helped me apply for a student discount, which saved me 400 yuan. His honest and warm attitude made me feel really respected."},{"id":"s-p2-gift-book","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充4-想送朋友的礼物与喜欢的书.md","title":"P2 补充 4 · 运动传记与礼物（读起来开心的书 / 送朋友的礼物）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#26 想送朋友的礼物\u003c/code>、\u003ccode>#27 读起来开心的书\u003c/code>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>a hardcover biography of Eliud Kipchoge\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>基普乔格的精装传记（或一本运动/科普好书）\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a page-turner / couldn&#39;t put it down\u003c/td>\n\u003ctd>引人入胜的书 / 爱不释手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>written in a vivid and inspiring way\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>写得生动又励志\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>goes for a morning run every day\u003c/td>\n\u003ctd>每天坚持晨跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>prepare for his first half-marathon\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>备战他的第一个半程马拉松\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical and meaningful\u003c/td>\n\u003ctd>既实用又有意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>write a handwritten note on the flyleaf\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>在扉页上写一段手写寄语\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>taught me the power of self-discipline\u003c/td>\n\u003ctd>教会了我自律的力量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>relieve my stress during exam prep\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>缓解我备考期间的压力\u003c/mark>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿 A：#27 读起来开心的书（Describe an exciting book that you enjoyed reading）\u003c/h2>\n\u003ch3 id=\"h2\">1. 书名与何时读的（What &amp; When）\u003c/h3>\n\u003cp>I&#39;d like to talk about an exciting book I read three months ago. It&#39;s \u003cmark>a biography of Eliud Kipchoge\u003c/mark>, the legendary marathon runner who broke the two-hour marathon barrier. A close friend recommended it to me when I was feeling stressed about my exams.\u003c/p>\n\u003cp>我想聊一本三个月前读过、让我非常开心的书——马拉松传奇运动员基普乔格的传记（他曾突破人类马拉松两小时大关）。那是我在备考压力很大时，一位好朋友推荐给我的。\u003c/p>\n\u003ch3 id=\"h3\">2. 书的内容（What it is about）\u003c/h3>\n\u003cp>Instead of listing dry facts, the book is \u003cmark>written in a vivid and inspiring way\u003c/mark>. It tells the story of how Kipchoge grew up in a small village in Kenya, how he trained in simple conditions for decades, and how he stayed calm under huge pressure during the Vienna race. It was such \u003cmark>a page-turner\u003c/mark> that I \u003cmark>couldn&#39;t put it down\u003c/mark> and finished it over a single weekend.\u003c/p>\n\u003cp>这本书没有堆砌枯燥的资料，而是写得生动又励志。它讲述了基普乔格如何在肯尼亚小村庄长大、几十年如一日在简陋条件下训练，以及在维也纳破二挑战赛中如何顶住巨大压力保持冷静。整本书引人入胜，我读得爱不释手，一个周末就看完了。\u003c/p>\n\u003ch3 id=\"h4\">3. 为什么喜欢读（Why you enjoyed it）\u003c/h3>\n\u003cp>I really enjoyed reading this book because it \u003cmark>taught me the power of self-discipline\u003c/mark> and patience. Whenever I feel tired or anxious during my IELTS preparation, I think of his famous quote, &quot;No human is limited,&quot; which helps me \u003cmark>relieve my stress\u003c/mark> and keep going.\u003c/p>\n\u003cp>我非常喜欢这本书，因为它教会了我自律和耐心的力量。每当我在雅思备考中感到疲惫或焦虑时，想起他那句“人类没有极限”，就能缓解压力、继续坚持下去。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h5\">二、主稿 B：#26 想送朋友的礼物（Describe a gift you would like to buy for your friend）\u003c/h2>\n\u003ch3 id=\"h6\">1. 送给谁、送什么（Who &amp; What gift）\u003c/h3>\n\u003cp>I&#39;d like to buy \u003cmark>a special gift\u003c/mark> for my best friend Hao next month for his birthday: \u003cmark>a hardcover edition of this sports biography\u003c/mark> paired with a lightweight running cap.\u003c/p>\n\u003cp>下个月我好朋友浩过生日，我想买一份特别的礼物送给他：这本精装版运动传记，再配一顶轻便的跑步帽。\u003c/p>\n\u003ch3 id=\"h7\">2. 为什么选这份礼物（Why you chose it）\u003c/h3>\n\u003cp>The reason I picked this gift is that Hao is a big fan of long-distance running. He \u003cmark>goes for a morning run every day\u003c/mark> and is currently training to \u003cmark>prepare for his first half-marathon\u003c/mark> this winter. Rather than buying something flashy that he might never use, I want to give him something both \u003cmark>practical and meaningful\u003c/mark>. The cap will keep the sweat out of his eyes during training, and the book will encourage him when he feels tired.\u003c/p>\n\u003cp>我选这份礼物是因为浩非常热爱长跑，每天坚持晨跑，最近正在备战今年冬天的人生首场半程马拉松。与其买华而不实的摆件，我更想送他既实用又有意义的东西：跑步帽能在训练时遮阳吸汗，而那本书能在他跑累的时候给他打气。\u003c/p>\n\u003ch3 id=\"h8\">3. 打算怎么送及感受（How you feel）\u003c/h3>\n\u003cp>I plan to \u003cmark>write a handwritten note on the flyleaf\u003c/mark> of the book to wish him luck in his race. I&#39;m sure he will be thrilled when he opens it, because it shows how well I know his hobbies.\u003c/p>\n\u003cp>我打算在书的扉页上亲手写一段寄语，祝他比赛顺利。我相信他拆开礼物时一定会非常开心，因为这份礼物代表我真的很懂他的爱好。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"一、主稿 A：#27 读起来开心的书（Describe an exciting book that you enjoyed reading）"},{"level":3,"id":"h2","text":"1. 书名与何时读的（What & When）"},{"level":3,"id":"h3","text":"2. 书的内容（What it is about）"},{"level":3,"id":"h4","text":"3. 为什么喜欢读（Why you enjoyed it）"},{"level":2,"id":"h5","text":"二、主稿 B：#26 想送朋友的礼物（Describe a gift you would like to buy for your friend）"},{"level":3,"id":"h6","text":"1. 送给谁、送什么（Who & What gift）"},{"level":3,"id":"h7","text":"2. 为什么选这份礼物（Why you chose it）"},{"level":3,"id":"h8","text":"3. 打算怎么送及感受（How you feel）"}],"text":"覆盖题卡：#26 想送朋友的礼物、#27 读起来开心的书 英文短语 中文释义 a hardcover biography of Eliud Kipchoge 基普乔格的精装传记（或一本运动/科普好书） a page-turner / couldn't put it down 引人入胜的书 / 爱不释手 written in a vivid and inspiring way 写得生动又励志 goes for a morning run every day 每天坚持晨跑 prepare for his first half-marathon 备战他的第一个半程马拉松 practical and meaningful 既实用又有意义 write a handwritten note on the flyleaf 在扉页上写一段手写寄语 taught me the power of self-discipline 教会了我自律的力量 relieve my stress during exam prep 缓解我备考期间的压力 一、主稿 A：#27 读起来开心的书（Describe an exciting book that you enjoyed reading） 1. 书名与何时读的（What & When） I'd like to talk about an exciting book I read three months ago. It's a biography of Eliud Kipchoge, the legendary marathon runner who broke the two-hour marathon barrier. A close friend recommended it to me when I was feeling stressed about my exams. 我想聊一本三个月前读过、让我非常开心的书——马拉松传奇运动员基普乔格的传记（他曾突破人类马拉松两小时大关）。那是我在备考压力很大时，一位好朋友推荐给我的。 2. 书的内容（What it is about） Instead of listing dry facts, the book is written in a vivid and inspiring way. It tells the story of how Kipchoge grew up in a small village in Kenya, how he trained in simple conditions for decades, and how he stayed calm under huge pressure during the Vienna race. It was such a page-turner that I couldn't put it down and finished it over a single weekend. 这本书没有堆砌枯燥的资料，而是写得生动又励志。它讲述了基普乔格如何在肯尼亚小村庄长大、几十年如一日在简陋条件下训练，以及在维也纳破二挑战赛中如何顶住巨大压力保持冷静。整本书引人入胜，我读得爱不释手，一个周末就看完了。 3. 为什么喜欢读（Why you enjoyed it） I really enjoyed reading this book because it taught me the power of self-discipline and patience. Whenever I feel tired or anxious during my IELTS preparation, I think of his famous quote, \"No human is limited,\" which helps me relieve my stress and keep going. 我非常喜欢这本书，因为它教会了我自律和耐心的力量。每当我在雅思备考中感到疲惫或焦虑时，想起他那句“人类没有极限”，就能缓解压力、继续坚持下去。 二、主稿 B：#26 想送朋友的礼物（Describe a gift you would like to buy for your friend） 1. 送给谁、送什么（Who & What gift） I'd like to buy a special gift for my best friend Hao next month for his birthday: a hardcover edition of this sports biography paired with a lightweight running cap. 下个月我好朋友浩过生日，我想买一份特别的礼物送给他：这本精装版运动传记，再配一顶轻便的跑步帽。 2. 为什么选这份礼物（Why you chose it） The reason I picked this gift is that Hao is a big fan of long-distance running. He goes for a morning run every day and is currently training to prepare for his first half-marathon this winter. Rather than buying something flashy that he might never use, I want to give him something both practical and meaningful. The cap will keep the sweat out of his eyes during training, and the book will encourage him when he feels tired. 我选这份礼物是因为浩非常热爱长跑，每天坚持晨跑，最近正在备战今年冬天的人生首场半程马拉松。与其买华而不实的摆件，我更想送他既实用又有意义的东西：跑步帽能在训练时遮阳吸汗，而那本书能在他跑累的时候给他打气。 3. 打算怎么送及感受（How you feel） I plan to write a handwritten note on the flyleaf of the book to wish him luck in his race. I'm sure he will be thrilled when he opens it, because it shows how well I know his hobbies. 我打算在书的扉页上亲手写一段寄语，祝他比赛顺利。我相信他拆开礼物时一定会非常开心，因为这份礼物代表我真的很懂他的爱好。"},{"id":"s-p2-food-party","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充5-特别场合吃的食物与聚会.md","title":"P2 补充 5 · 除夕包饺子与庙会（特别场合食物 / 聚会 / 拥挤地方）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#24 特别场合吃的食物\u003c/code>、\u003ccode>#37 印象深刻的聚会\u003c/code>、\u003ccode>#17 拥挤的地方\u003c/code>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>homemade dumplings (Jiaozi)\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>家里包的手工饺子\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chinese New Year&#39;s Eve\u003c/td>\n\u003ctd>除夕夜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>gather around the dining table\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>围坐在餐桌旁\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make the dough and chop the fillings\u003c/td>\n\u003ctd>和面、剁馅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>hide a clean coin inside one dumpling\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>在一个饺子里包进一枚洗净的硬币\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a symbol of family reunion and good luck\u003c/td>\n\u003ctd>家庭团圆与好运的象征\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>lively and warm atmosphere\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>热闹温馨的氛围\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>packed with people shoulder to shoulder\u003c/td>\n\u003ctd>人山人海、摩肩接踵\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>strengthen family bonds\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>增进家人之间的感情\u003c/mark>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿：#24 特别场合吃的食物（Describe a food that people eat on special occasions/events）\u003c/h2>\n\u003ch3 id=\"h2\">1. 什么食物与什么场合吃（What food &amp; What occasion）\u003c/h3>\n\u003cp>I&#39;d like to talk about \u003cmark>homemade dumplings, or Jiaozi\u003c/mark>, which people in northern China always eat on special occasions, especially on \u003cmark>Chinese New Year&#39;s Eve\u003c/mark> and family reunions.\u003c/p>\n\u003cp>我想聊一聊手工水饺，这是中国北方人在特殊场合——尤其是除夕夜和家庭团聚时必吃的食物。\u003c/p>\n\u003ch3 id=\"h3\">2. 怎么做、怎么吃的（How it is made and eaten）\u003c/h3>\n\u003cp>Making dumplings on New Year&#39;s Eve is a family activity, unlike buying frozen dumplings from the supermarket. All family members \u003cmark>gather around the dining table\u003c/mark>: my grandpa \u003cmark>makes the dough\u003c/mark>, my dad \u003cmark>chops the fillings\u003c/mark>—usually pork, shrimp, and Chinese cabbage—and the rest of us roll the wrappers and fold the dumplings together. My grandma also likes to \u003cmark>hide a clean coin inside one dumpling\u003c/mark>. Whoever bites into that special dumpling is believed to have the best luck in the coming year.\u003c/p>\n\u003cp>和超市买的速冻饺子不同，除夕夜包饺子是一项全家参与的活动。全家人围坐在餐桌旁：爷爷和面，爸爸调猪肉白菜虾仁馅，其他人一起擀皮、包饺子。奶奶还会特意在一个饺子里包进一枚洗干净的硬币，谁吃到那个饺子，就寓意新的一年运气最好。\u003c/p>\n\u003ch3 id=\"h4\">3. 为什么重要（Why people eat it on special occasions）\u003c/h3>\n\u003cp>People eat dumplings on this special occasion not just because they taste delicious and juicy, but because they are \u003cmark>a symbol of family reunion and good luck\u003c/mark>. Their shape looks like ancient Chinese gold ingots, representing wealth, and making them together really helps \u003cmark>strengthen family bonds\u003c/mark>.\u003c/p>\n\u003cp>人们在特殊场合吃饺子，不仅因为它鲜美多汁，更因为它是团圆和好运的象征。饺子的形状像中国古代的金元宝，寓意招财进宝，而一家人一起包饺子更能增进感情。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h5\">二、同素材切换到另外 2 张题卡（怎么改重心）\u003c/h2>\n\u003ch3 id=\"h6\">切换为 #37 印象深刻的聚会（Describe a party for a special event that impressed you a lot）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about a family reunion party held at my grandparents&#39; home last Chinese New Year&#39;s Eve, which impressed me a lot.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>聚会的人数、活动环节、为什么印象深刻\u003c/strong>：\u003cblockquote>\n\u003cp>Nearly twenty relatives came back from different cities. Instead of just eating at a restaurant, we decorated the living room with red lanterns, made \u003cmark>homemade dumplings\u003c/mark> together, and played card games after dinner. When my little cousin bit into the dumpling with the lucky coin, everyone cheered and laughed. The \u003cmark>lively and warm atmosphere\u003c/mark> made it the most memorable party for me.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h7\">切换为 #17 拥挤的地方（Describe a crowded place you went to）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>开头改一句\u003c/strong>：I&#39;d like to talk about a traditional temple fair and night market I went to with my family during the Spring Festival holiday last year.\u003c/li>\n\u003cli>\u003cstrong>重心调整\u003c/strong>：重点讲\u003cstrong>现场为什么那么挤、你在里面做了什么、有什么感受\u003c/strong>：\u003cblockquote>\n\u003cp>Because the weather was nice and everyone was on holiday, the street was \u003cmark>packed with people shoulder to shoulder\u003c/mark>. We had to move slowly in the crowd and wait in line for twenty minutes just to buy local snacks and dumplings. Although it was a bit noisy and tiring, the festive lanterns and cheerful crowd made me feel the lively spirit of the holiday.\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"一、主稿：#24 特别场合吃的食物（Describe a food that people eat on special occasions/events）"},{"level":3,"id":"h2","text":"1. 什么食物与什么场合吃（What food & What occasion）"},{"level":3,"id":"h3","text":"2. 怎么做、怎么吃的（How it is made and eaten）"},{"level":3,"id":"h4","text":"3. 为什么重要（Why people eat it on special occasions）"},{"level":2,"id":"h5","text":"二、同素材切换到另外 2 张题卡（怎么改重心）"},{"level":3,"id":"h6","text":"切换为 #37 印象深刻的聚会（Describe a party for a special event that impressed you a lot）"},{"level":3,"id":"h7","text":"切换为 #17 拥挤的地方（Describe a crowded place you went to）"}],"text":"覆盖题卡：#24 特别场合吃的食物、#37 印象深刻的聚会、#17 拥挤的地方 英文短语 中文释义 homemade dumplings (Jiaozi) 家里包的手工饺子 Chinese New Year's Eve 除夕夜 gather around the dining table 围坐在餐桌旁 make the dough and chop the fillings 和面、剁馅 hide a clean coin inside one dumpling 在一个饺子里包进一枚洗净的硬币 a symbol of family reunion and good luck 家庭团圆与好运的象征 lively and warm atmosphere 热闹温馨的氛围 packed with people shoulder to shoulder 人山人海、摩肩接踵 strengthen family bonds 增进家人之间的感情 一、主稿：#24 特别场合吃的食物（Describe a food that people eat on special occasions/events） 1. 什么食物与什么场合吃（What food & What occasion） I'd like to talk about homemade dumplings, or Jiaozi, which people in northern China always eat on special occasions, especially on Chinese New Year's Eve and family reunions. 我想聊一聊手工水饺，这是中国北方人在特殊场合——尤其是除夕夜和家庭团聚时必吃的食物。 2. 怎么做、怎么吃的（How it is made and eaten） Making dumplings on New Year's Eve is a family activity, unlike buying frozen dumplings from the supermarket. All family members gather around the dining table: my grandpa makes the dough, my dad chops the fillings—usually pork, shrimp, and Chinese cabbage—and the rest of us roll the wrappers and fold the dumplings together. My grandma also likes to hide a clean coin inside one dumpling. Whoever bites into that special dumpling is believed to have the best luck in the coming year. 和超市买的速冻饺子不同，除夕夜包饺子是一项全家参与的活动。全家人围坐在餐桌旁：爷爷和面，爸爸调猪肉白菜虾仁馅，其他人一起擀皮、包饺子。奶奶还会特意在一个饺子里包进一枚洗干净的硬币，谁吃到那个饺子，就寓意新的一年运气最好。 3. 为什么重要（Why people eat it on special occasions） People eat dumplings on this special occasion not just because they taste delicious and juicy, but because they are a symbol of family reunion and good luck. Their shape looks like ancient Chinese gold ingots, representing wealth, and making them together really helps strengthen family bonds. 人们在特殊场合吃饺子，不仅因为它鲜美多汁，更因为它是团圆和好运的象征。饺子的形状像中国古代的金元宝，寓意招财进宝，而一家人一起包饺子更能增进感情。 二、同素材切换到另外 2 张题卡（怎么改重心） 切换为 #37 印象深刻的聚会（Describe a party for a special event that impressed you a lot） 开头改一句：I'd like to talk about a family reunion party held at my grandparents' home last Chinese New Year's Eve, which impressed me a lot. 重心调整：重点讲聚会的人数、活动环节、为什么印象深刻： Nearly twenty relatives came back from different cities. Instead of just eating at a restaurant, we decorated the living room with red lanterns, made homemade dumplings together, and played card games after dinner. When my little cousin bit into the dumpling with the lucky coin, everyone cheered and laughed. The lively and warm atmosphere made it the most memorable party for me. 切换为 #17 拥挤的地方（Describe a crowded place you went to） 开头改一句：I'd like to talk about a traditional temple fair and night market I went to with my family during the Spring Festival holiday last year. 重心调整：重点讲现场为什么那么挤、你在里面做了什么、有什么感受： Because the weather was nice and everyone was on holiday, the street was packed with people shoulder to shoulder. We had to move slowly in the crowd and wait in line for twenty minutes just to buy local snacks and dumplings. Although it was a bit noisy and tiring, the festive lanterns and cheerful crowd made me feel the lively spirit of the holiday."},{"id":"s-p2-lost-public","origin":"supplement","group":"supplement","file":"笔记/口语/P2/补充6-在公共场所丢东西.md","title":"P2 补充 6 · 地铁丢无线耳机（公共场所丢东西）","html":"\u003cp>\u003cstrong>覆盖题卡\u003c/strong>：\u003ccode>#41 在公共场所丢东西\u003c/code>（可与 \u003ccode>#42 帮别人解决问题\u003c/code> 互换角色）\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>my wireless earbuds and charging case\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>我的无线耳机和充电盒\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>slipped out of my coat pocket\u003c/td>\n\u003ctd>从大衣口袋里滑了出来\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>in a rush to catch the subway\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>急着赶地铁\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>my mind went blank\u003c/td>\n\u003ctd>我脑子一片空白\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>retraced my steps immediately\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>立刻原路返回寻找\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>asked the station staff at the service desk\u003c/td>\n\u003ctd>去服务台询问地铁工作人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>used the &quot;Find My&quot; app on my phone\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>用手机上的“查找”软件定位\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>turned it in to the lost-and-found office\u003c/td>\n\u003ctd>把它交到了失物招领处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>breathed a huge sigh of relief\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>长舒了一口气\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>zip up my pockets before getting on the train\u003c/td>\n\u003ctd>上车前把口袋拉链拉好\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">一、主稿：#41 在公共场所丢东西（Describe an occasion when you lost something in public）\u003c/h2>\n\u003ch3 id=\"h2\">1. 丢了什么、在哪丢的（What &amp; Where）\u003c/h3>\n\u003cp>I&#39;d like to talk about an occasion last winter when I lost \u003cmark>my wireless earbuds and charging case\u003c/mark> on the subway. It was a Friday evening during rush hour, and I was \u003cmark>in a rush to catch the subway\u003c/mark> home from university.\u003c/p>\n\u003cp>我想讲讲去年冬天我在地铁上弄丢无线耳机和充电盒的经历。那是一个周五晚高峰，我正急着从学校赶地铁回家。\u003c/p>\n\u003ch3 id=\"h3\">2. 怎么丢的、发现后做了什么（How you lost it &amp; What you did）\u003c/h3>\n\u003cp>When I squeezed onto the crowded train, my earbuds \u003cmark>slipped out of my coat pocket\u003c/mark> without me noticing. I didn&#39;t realize they were gone until I got off the train and wanted to listen to music. At that moment, \u003cmark>my mind went blank\u003c/mark> because I had saved up for months to buy them. I \u003cmark>retraced my steps immediately\u003c/mark> to the platform and \u003cmark>used the &quot;Find My&quot; app on my phone\u003c/mark> to check their location. Then I hurried to the service desk and \u003cmark>asked the station staff\u003c/mark> for help.\u003c/p>\n\u003cp>当我挤上拥挤的地铁车厢时，耳机不知不觉从我大衣口袋里滑了出来。直到下车想听歌时，我才发现耳机不见了。那一刻我脑子一片空白，因为那是我攒了好几个月钱才买的。我立刻返回站台寻找，并用手机上的“查找”软件查看定位，接着赶紧去服务台向工作人员求助。\u003c/p>\n\u003ch3 id=\"h4\">3. 结果与感受（Result &amp; How you felt）\u003c/h3>\n\u003cp>Luckily, the staff checked their system and told me that a kind passenger had picked up the case on the train and \u003cmark>turned it in to the lost-and-found office\u003c/mark> at the next station. When I got my earbuds back half an hour later, I \u003cmark>breathed a huge sigh of relief\u003c/mark> and felt really grateful to that stranger. Since then, I&#39;ve developed the habit of \u003cmark>zipping up my pockets\u003c/mark> whenever I&#39;m in a crowded place.\u003c/p>\n\u003cp>幸运的是，工作人员查了系统后告诉我，有一位好心乘客在车厢里捡到了耳机盒，并交到了下一站的失物招领处。半小时后拿回耳机时，我长舒了一口气，非常感激那位陌生人。从那以后，我养成了在人多的地方随手拉好口袋拉链的习惯。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"一、主稿：#41 在公共场所丢东西（Describe an occasion when you lost something in public）"},{"level":3,"id":"h2","text":"1. 丢了什么、在哪丢的（What & Where）"},{"level":3,"id":"h3","text":"2. 怎么丢的、发现后做了什么（How you lost it & What you did）"},{"level":3,"id":"h4","text":"3. 结果与感受（Result & How you felt）"}],"text":"覆盖题卡：#41 在公共场所丢东西（可与 #42 帮别人解决问题 互换角色） 英文短语 中文释义 my wireless earbuds and charging case 我的无线耳机和充电盒 slipped out of my coat pocket 从大衣口袋里滑了出来 in a rush to catch the subway 急着赶地铁 my mind went blank 我脑子一片空白 retraced my steps immediately 立刻原路返回寻找 asked the station staff at the service desk 去服务台询问地铁工作人员 used the \"Find My\" app on my phone 用手机上的“查找”软件定位 turned it in to the lost-and-found office 把它交到了失物招领处 breathed a huge sigh of relief 长舒了一口气 zip up my pockets before getting on the train 上车前把口袋拉链拉好 一、主稿：#41 在公共场所丢东西（Describe an occasion when you lost something in public） 1. 丢了什么、在哪丢的（What & Where） I'd like to talk about an occasion last winter when I lost my wireless earbuds and charging case on the subway. It was a Friday evening during rush hour, and I was in a rush to catch the subway home from university. 我想讲讲去年冬天我在地铁上弄丢无线耳机和充电盒的经历。那是一个周五晚高峰，我正急着从学校赶地铁回家。 2. 怎么丢的、发现后做了什么（How you lost it & What you did） When I squeezed onto the crowded train, my earbuds slipped out of my coat pocket without me noticing. I didn't realize they were gone until I got off the train and wanted to listen to music. At that moment, my mind went blank because I had saved up for months to buy them. I retraced my steps immediately to the platform and used the \"Find My\" app on my phone to check their location. Then I hurried to the service desk and asked the station staff for help. 当我挤上拥挤的地铁车厢时，耳机不知不觉从我大衣口袋里滑了出来。直到下车想听歌时，我才发现耳机不见了。那一刻我脑子一片空白，因为那是我攒了好几个月钱才买的。我立刻返回站台寻找，并用手机上的“查找”软件查看定位，接着赶紧去服务台向工作人员求助。 3. 结果与感受（Result & How you felt） Luckily, the staff checked their system and told me that a kind passenger had picked up the case on the train and turned it in to the lost-and-found office at the next station. When I got my earbuds back half an hour later, I breathed a huge sigh of relief and felt really grateful to that stranger. Since then, I've developed the habit of zipping up my pockets whenever I'm in a crowded place. 幸运的是，工作人员查了系统后告诉我，有一位好心乘客在车厢里捡到了耳机盒，并交到了下一站的失物招领处。半小时后拿回耳机时，我长舒了一口气，非常感激那位陌生人。从那以后，我养成了在人多的地方随手拉好口袋拉链的习惯。"}]}</script>
<script>(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const S = DATA.speaking;
  const R = DATA.recent;
  const TYPES = DATA.writingTypes;
  const pages = new Map(DATA.pages.map((p) => [p.id, p]));
  const p1ById = new Map(S.p1.map((t) => [t.id, t]));
  const p2ById = new Map(S.p2.map((c) => [c.id, c]));
  const coreById = new Map(S.core.map((c) => [c.id, c]));
  const typeById = new Map(TYPES.map((t) => [t.id, t]));
  const typeByRecent = new Map(TYPES.map((t) => [t.recent, t]));
  const hot1 = new Set(S.hot.p1);
  const hot2 = new Set(S.hot.p2);
  const p1No = new Map(S.p1.map((t, i) => [t.id, i + 1]));
  const p2No = new Map(S.p2.map((c, i) => [c.id, i + 1]));
  const totalP3 = S.p2.reduce((n, c) => n + c.p3.length, 0);
  const authorPages = DATA.pages.filter((p) => p.origin === 'author');

  const main = document.getElementById('main');
  const sidebar = document.getElementById('sidebar');
  const tocEl = document.getElementById('toc');
  const searchInput = document.getElementById('searchInput');

  // ---------- 工具 ----------

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const pad2 = (n) => String(n).padStart(2, '0');
  const localDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fmtDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return `${y} 年 ${m} 月 ${d} 日`;
  };
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const isTyping = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));

  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- 本机存储 ----------

  const PREFIX = 'ielts26:';
  let storageOk = true;
  function load(key, fallback) {
    try {
      const v = localStorage.getItem(PREFIX + key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) {
      storageOk = false;
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      storageOk = false;
      return false;
    }
  }

  const done = load('done', {});
  const isDone = (key) => Boolean(done[key]);
  function setDone(key, on) {
    if (on) done[key] = localDate();
    else delete done[key];
    if (!save('done', done)) toast('浏览器不允许保存，刷新后标记会丢失');
    document.querySelectorAll(`[data-done="${key}"]`).forEach(paintDone);
    updateCounts();
  }
  const doneBtn = (key) =>
    `<button class="done-btn" type="button" data-done="${key}" aria-pressed="${isDone(key)}">${isDone(key) ? '练过' : '标记练过'}</button>`;
  function paintDone(btn) {
    const on = isDone(btn.dataset.done);
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent = on ? '练过' : '标记练过';
  }
  const countDone = (kind, list) => list.filter((x) => isDone(`${kind}:${x.id}`)).length;
  function updateCounts() {
    document.querySelectorAll('[data-count]').forEach((el) => {
      const kind = el.dataset.count;
      const list = kind === 'p1' ? S.p1 : S.p2;
      el.textContent = `${countDone(kind, list)} / ${list.length}`;
    });
  }

  // ---------- 考试倒计时 ----------

  const DEFAULT_EXAM = '2026-10-25';
  if (load('exam', null) === '2026-10-18') save('exam', DEFAULT_EXAM);
  function examInfo() {
    const d = load('exam', DEFAULT_EXAM);
    if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
    const [y, m, dd] = d.split('-').map(Number);
    const now = new Date();
    const days = Math.round((new Date(y, m - 1, dd) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const md = `${m} 月 ${dd} 日`;
    if (days > 0) return { date: d, big: days, label: `天后考试 · ${md}`, chip: `距考试 ${days} 天`, upcoming: true };
    if (days === 0) return { date: d, big: '今天', label: `考试日 · ${md}`, chip: '今天考试', upcoming: true };
    return { date: d, big: -days, label: `天前考过 · ${md}`, chip: `${md} 已考`, upcoming: false };
  }
  const examBtn = document.getElementById('examBtn');
  const examDialog = document.getElementById('examDialog');
  function paintExam() {
    const info = examInfo();
    examBtn.textContent = info ? info.chip : '设考试日期';
    examBtn.classList.toggle('on', Boolean(info && info.upcoming));
  }
  examBtn.addEventListener('click', () => {
    const input = document.getElementById('examDate');
    input.value = load('exam', DEFAULT_EXAM) || '';
    examDialog.returnValue = '';
    if (typeof examDialog.showModal === 'function') examDialog.showModal();
    else {
      const v = prompt('考试日期（例如 2026-10-25），留空表示不显示倒计时', input.value);
      if (v !== null) {
        save('exam', v.trim());
        paintExam();
        render();
      }
    }
  });
  examDialog.addEventListener('close', () => {
    const v = examDialog.returnValue;
    if (v === 'save') save('exam', document.getElementById('examDate').value);
    if (v === 'clear') save('exam', '');
    if (v === 'save' || v === 'clear') {
      paintExam();
      if (current().path === '/') render();
    }
  });

  // ---------- 主题 ----------

  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try {
      localStorage.setItem(PREFIX + 'theme', next);
    } catch (e) {}
  });

  // ---------- 链接和标签 ----------

  const typeByPrimaryPage = new Map(TYPES.map((t) => [t.pages[0], t.id]));
  const pageRoute = (id) => (typeByPrimaryPage.has(id) ? `#/w/${typeByPrimaryPage.get(id)}` : `#/page/${id}`);
  const pageLinks = (ids) =>
    (ids || [])
      .map((id) => pages.get(id))
      .filter(Boolean)
      .map((p) => `<a href="${pageRoute(p.id)}">${esc(p.title)}</a>`)
      .join('');
  const seeLabel = (ids) => {
    const list = (ids || []).map((id) => pages.get(id)).filter(Boolean);
    if (list.length && list.every((p) => p.origin === 'author')) return '可借用素材';
    if (list.length && list.every((p) => p.origin !== 'author')) return '本站补充口语稿';
    return '参考口语稿';
  };
  const itemLinks = (ids) =>
    (ids || [])
      .map((id) => {

  const planDone = load('planDone', {});
  const isPlanDone = (id) => Boolean(planDone[id]);
  function setPlanDone(id, on) {
    if (on) planDone[id] = localDate();
    else delete planDone[id];
    if (!save('planDone', planDone)) toast('浏览器不允许保存，刷新后打卡会丢失');
    document.querySelectorAll(`[data-plan-task="${id}"]`).forEach((cb) => {
      cb.checked = isPlanDone(id);
      const row = cb.closest('.plan-task');
      if (row) row.classList.toggle('done', isPlanDone(id));
    });
    updatePlanProgress();
  }
  function updatePlanProgress() {
    const allTasks = PLAN_DAYS.flatMap((d) => d.tasks);
    const doneN = allTasks.filter((t) => isPlanDone(t.id)).length;
    document.querySelectorAll('[data-plan-prog]').forEach((el) => {
      el.textContent = `已完成 ${doneN} / ${allTasks.length} 项`;
    });
  }
  document.addEventListener('change', (e) => {
    if (!e.target.matches || !e.target.matches('[data-plan-task]')) return;
    setPlanDone(e.target.dataset.planTask, e.target.checked);
  });

  function renderPlanTask(t) {
    const checked = isPlanDone(t.id);
    return `<div class="plan-task${checked ? ' done' : ''}">
      <label class="plan-cb"><input type="checkbox" data-plan-task="${t.id}"${checked ? ' checked' : ''}><span><b>${esc(t.title)}</b><span class="tag">${esc(t.time)}</span></span></label>
      <p class="plan-desc">${esc(t.desc)}</p>
      <div class="links"><span class="lbl">直达入口</span>${t.links.map(([label, href]) => `<a href="${href}">${esc(label)}</a>`).join('')}</div>
    </div>`;
  }

  function currentPlanDay() {
    const today = localDate();
    return PLAN_DAYS.find((d) => d.date === today) || (today < PLAN_DAYS[0].date ? PLAN_DAYS[0] : PLAN_DAYS[PLAN_DAYS.length - 1]);
  }

  function todayPlanBlock() {
    const d = currentPlanDay();
    const isToday = d.date === localDate();
    return `<section class="card plan-today">
      <div class="topic-head">
        <span class="tag tag-mainland">${isToday ? '今日任务' : '当前阶段'}</span>
        <h3>${esc(d.day)} · ${esc(d.theme)}</h3>
        <a class="btn btn-sm" style="margin-left:auto" href="#/plan">看完整 11 天计划 →</a>

      <p class="muted small" style="margin:4px 0 10px">建议时长：${esc(d.total)}　·　勾选后自动保存在当前浏览器</p>
      <div class="plan-tasks">${d.tasks.map(renderPlanTask).join('')}</div>
    </section>`;
  }

  let practice = null;
