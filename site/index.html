 say: How long you have had this goal/ambition What it is How you will achieve it And explain why you set it 英文短语 中文翻译 become an engineer 成为一名工程师 undergraduate studies 本科学习 Measurement, Control Technology and Instrument 测控技术与仪器 hands-on experiments 实验室里的实操实验 professional courses are challenging 专业课有难度 practical engineering knowledge 实用的工程知识 makes me feel really rewarded 让我收获满满 finish my master’s degree 完成硕士学位 At the same time 与此同时 take some high-quality internships 参加一些高质量实习 improve my practical skills 提升实操能力 work as an engineer 当一名工程师 set this goal 设立这个目标 electronic devices 电子设备 employment prospects 就业前景 made up my mind to learn it 下定决心学它 use my professional knowledge 用我的专业知识 solve real-world problems 解决现实问题 More specifically 具体来说 optimize self-driving algorithms 优化自动驾驶算法 agile but safe 灵活且安全 It’s challenging for me 这对我来说有挑战 Today I’d like to talk about a long-term goal I have. My goal is to become an engineer in the field of autonomous driving. 今天我想聊一个我的长期目标。我的目标是成为一名自动驾驶领域的工程师。 I’ve had this goal for about five years, ever since I started my undergraduate studies in Measurement, Control Technology and Instrument. I really enjoy my studies, especially those hands-on experiments. Although some professional courses are challenging, I can learn lots of practical engineering knowledge. It always makes me feel really rewarded. 有这个目标多久了 – 这个目标我已经有了大约五年，从我本科读测控技术与仪器专业开始。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。 Well, first, I’ll finish my master’s degree in the next three years. At the same time, I plan to take some high-quality internships to improve my practical skills. After graduation, I’ll work as an engineer in an autonomous driving company. 如何实现 – 首先，未来三年我会完成硕士学位。同时，我打算参加一些高质量的实习来提升实操能力。毕业后，我会在一家自动驾驶公司当工程师。我知道路还很长，但我准备好了。 I set this goal for two reasons. First, I’ve always been fascinated by electronic devices since I was a kid. Besides, the employment prospects were promising, so I made up my mind to learn it. Apart from this, I hope I can **use my professional knowledge to solve real-world problems**. More specifically, I want to optimize self-driving algorithms to make them agile but safe. 为什么设立这个目标 – 我设立这个目标有两个原因。第一，我从小就对电子设备着迷，所以工程学是我的热情所在。第二，我希望用专业知识解决现实问题。具体来说，我想优化自动驾驶算法，让它既灵活又安全。 So, that’s my long-term goal. It’s challenging for me, but I believe I can make it. 所以，这就是我的长期目标。很有挑战，但我相信我能做到。"},{"id":"a-p2-07","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/7-无聊的地方&交通拥堵.md","title":"P2-7 无聊的地方 & 交通拥堵","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>Where it is\u003c/li>\n\u003cli>Who you went there with\u003c/li>\n\u003cli>What you did there\u003c/li>\n\u003cli>And explain why you think it is a boring place\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a time when you were stuck in a traffic jam for a very long time\u003c/h1>\n\u003cp>You should say: \u003c/p>\n\u003cul>\n\u003cli>When it happened \u003c/li>\n\u003cli>Where you were stuck \u003c/li>\n\u003cli>What you did while waiting \u003c/li>\n\u003cli>And explain how you felt in the traffic jam\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>a trip to the Qinling Mountains\u003c/code>\u003c/td>\n\u003ctd>一次去秦岭的旅行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>not far away,\u003c/code>\u003c/td>\n\u003ctd>不远，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>right to the south of the city\u003c/code>\u003c/td>\n\u003ctd>就在这座城市的南边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>go hiking there\u003c/code>\u003c/td>\n\u003ctd>去那里徒步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>early in the morning\u003c/code>\u003c/td>\n\u003ctd>一大早\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ran into a huge traffic jam\u003c/code>\u003c/td>\n\u003ctd>遇上了大堵车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>There was nothing to see but endless cars.\u003c/code>\u003c/td>\n\u003ctd>放眼望去只有望不到头的汽车。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>listen to some podcasts\u003c/code>\u003c/td>\n\u003ctd>收听一些播客\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stay sane\u003c/code>\u003c/td>\n\u003ctd>保持心态平稳（保持理智）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>chatted with my parents\u003c/code>\u003c/td>\n\u003ctd>和父母聊了聊天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>called my grandparents.\u003c/code>\u003c/td>\n\u003ctd>给祖父母打了电话。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>the foot of the mountain\u003c/code>\u003c/td>\n\u003ctd>山脚下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>take a break from urban life,\u003c/code>\u003c/td>\n\u003ctd>远离城市的喧嚣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>soak up some fresh air\u003c/code>\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>recharge my batteries.\u003c/code>\u003c/td>\n\u003ctd>休整放松（给自己充电）。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>there was rubbish everywhere\u003c/code>\u003c/td>\n\u003ctd>随处都是垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>along the road\u003c/code>\u003c/td>\n\u003ctd>沿着路\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>up to the mountain.\u003c/code>\u003c/td>\n\u003ctd>上山的（沿途）。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Even now\u003c/code>\u003c/td>\n\u003ctd>直到现在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>the most boring one\u003c/code>\u003c/td>\n\u003ctd>最无聊的一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>I have ever had\u003c/code>\u003c/td>\n\u003ctd>我曾经历过的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>recommend it to others.\u003c/code>\u003c/td>\n\u003ctd>把它推荐给任何人。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today, I&#39;ll talk about \u003cmark>a trip to the Qinling Mountains\u003c/mark> with my parents last year. The mountains are \u003cmark>not far away,\u003c/mark> \u003cmark>right to the south of the city\u003c/mark>. We planned to \u003cmark>go hiking there\u003c/mark> \u003cmark>early in the morning\u003c/mark>, but unfortunately, we \u003cmark>were stuck in a huge traffic jam\u003c/mark> for nearly two hours. \u003c/p>\n\u003cp>今天我想讲讲去年夏天我和父母去秦岭的一次旅行。秦岭就在城市南边不远处。我们原本计划一大早去那里徒步，但不巧的是，我们遇上大堵车，被困了将近两个小时。\u003c/p>\n\u003cp>I felt really bored at that time. \u003cmark>There was nothing to see but endless cars.\u003c/mark> I tried to \u003cmark>listen to some podcasts\u003c/mark> about technology and AI. I hoped they could help me \u003cmark>stay sane\u003c/mark>, but they didn&#39;t work. I also \u003cmark>chatted with my parents\u003c/mark> and \u003cmark>called my grandparents.\u003c/mark>\u003c/p>\n\u003cp>那段时间我感到十分无聊。放眼望去只有望不到头的汽车。我试着收听一些关于科技和人工智能的播客。我希望这些播客能让我保持心态平稳，但收效甚微。我也和父母聊了聊天，还给祖父母打了电话。\u003c/p>\n\u003cp>When we arrived at \u003cmark>the foot of the mountain\u003c/mark>, I had hoped to \u003cmark>take a break from urban life,\u003c/mark> \u003cmark>soak up some fresh air\u003c/mark> and \u003cmark>recharge my batteries.\u003c/mark> But \u003cmark>there was rubbish everywhere\u003c/mark> \u003cmark>along the road\u003c/mark> \u003cmark>up to the mountain.\u003c/mark> I was really disappointed, so we decided to \u003cmark>go back before reaching the top.\u003c/mark>\u003c/p>\n\u003cp>当我们抵达山脚下时，我原本期盼远离城市的喧嚣、呼吸新鲜空气、休整放松。可是上山的沿途随处都是垃圾。于是我们决定还没登顶就折返下山。\u003c/p>\n\u003cp>\u003cmark>Even now\u003c/mark>, I still think this trip was \u003cmark>the most boring one\u003c/mark> \u003cmark>I have ever had\u003c/mark>, and I would never \u003cmark>recommend it to others.\u003c/mark>\u003c/p>\n\u003cp>直到现在，我都认为这是我经历过最无聊的一次旅行，我绝不会把它推荐给任何人。\u003c/p>\n","toc":[],"text":"You should say: Where it is Who you went there with What you did there And explain why you think it is a boring place Describe a time when you were stuck in a traffic jam for a very long time You should say: When it happened Where you were stuck What you did while waiting And explain how you felt in the traffic jam 英文原短语 中文翻译 a trip to the Qinling Mountains 一次去秦岭的旅行 not far away, 不远， right to the south of the city 就在这座城市的南边 go hiking there 去那里徒步 early in the morning 一大早 ran into a huge traffic jam 遇上了大堵车 There was nothing to see but endless cars. 放眼望去只有望不到头的汽车。 listen to some podcasts 收听一些播客 stay sane 保持心态平稳（保持理智） chatted with my parents 和父母聊了聊天 called my grandparents. 给祖父母打了电话。 the foot of the mountain 山脚下 take a break from urban life, 远离城市的喧嚣 soak up some fresh air 呼吸新鲜空气 recharge my batteries. 休整放松（给自己充电）。 there was rubbish everywhere 随处都是垃圾 along the road 沿着路 up to the mountain. 上山的（沿途）。 Even now 直到现在 the most boring one 最无聊的一次 I have ever had 我曾经历过的 recommend it to others. 把它推荐给任何人。 Today, I'll talk about a trip to the Qinling Mountains with my parents last year. The mountains are not far away, right to the south of the city. We planned to go hiking there early in the morning, but unfortunately, we were stuck in a huge traffic jam for nearly two hours. 今天我想讲讲去年夏天我和父母去秦岭的一次旅行。秦岭就在城市南边不远处。我们原本计划一大早去那里徒步，但不巧的是，我们遇上大堵车，被困了将近两个小时。 I felt really bored at that time. There was nothing to see but endless cars. I tried to listen to some podcasts about technology and AI. I hoped they could help me stay sane, but they didn't work. I also chatted with my parents and called my grandparents. 那段时间我感到十分无聊。放眼望去只有望不到头的汽车。我试着收听一些关于科技和人工智能的播客。我希望这些播客能让我保持心态平稳，但收效甚微。我也和父母聊了聊天，还给祖父母打了电话。 When we arrived at the foot of the mountain, I had hoped to take a break from urban life, soak up some fresh air and recharge my batteries. But there was rubbish everywhere along the road up to the mountain. I was really disappointed, so we decided to go back before reaching the top. 当我们抵达山脚下时，我原本期盼远离城市的喧嚣、呼吸新鲜空气、休整放松。可是上山的沿途随处都是垃圾。于是我们决定还没登顶就折返下山。 Even now, I still think this trip was the most boring one I have ever had, and I would never recommend it to others. 直到现在，我都认为这是我经历过最无聊的一次旅行，我绝不会把它推荐给任何人。"},{"id":"a-p2-08","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/8-近期改变计划&想法.md","title":"P2-8 改变计划 & 想法","html":"\u003cp>描述一个你近期不得不更改的计划\u003c/p>\n\u003ch1>Describe a time when you changed an important opinion of yours\u003c/h1>\n\u003cp>描述一次你改变自己某个重要观点的经历\u003c/p>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When this happened\u003c/li>\n\u003cli>What made you change the plan\u003c/li>\n\u003cli>What the new plan was\u003c/li>\n\u003cli>And how you felt about the change\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a time when you changed an important opinion of yours\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When you changed your opinion\u003c/li>\n\u003cli>What the original opinion was\u003c/li>\n\u003cli>Why you changed it\u003c/li>\n\u003cli>And explain how you felt about the experience\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"left\">\u003cstrong>Highlighted Phrase\u003c/strong>\u003c/th>\n\u003cth align=\"left\">\u003cstrong>English Meaning (if needed)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"left\">\u003cmark>When I first started university,\u003c/mark>\u003c/td>\n\u003ctd align=\"left\">\u003cmark>刚上大学时\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">become an engineer\u003c/td>\n\u003ctd align=\"left\">成为工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">in the field of\u003c/td>\n\u003ctd align=\"left\">在……领域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">use my professional knowledge\u003c/td>\n\u003ctd align=\"left\">运用我的专业知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">solve real-world problems\u003c/td>\n\u003ctd align=\"left\">解决现实世界的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">More specifically,\u003c/td>\n\u003ctd align=\"left\">更具体地说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">optimize self-driving algorithms\u003c/td>\n\u003ctd align=\"left\">优化自动驾驶算法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">agile but safe\u003c/td>\n\u003ctd align=\"left\">敏捷且安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">really look forward to\u003c/td>\n\u003ctd align=\"left\">非常期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">what real work was like\u003c/td>\n\u003ctd align=\"left\">真实工作是什么样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">earlier this year\u003c/td>\n\u003ctd align=\"left\">今年早些时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">did an internship\u003c/td>\n\u003ctd align=\"left\">实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">autonomous driving company\u003c/td>\n\u003ctd align=\"left\">自动驾驶公司\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">endless work to do\u003c/td>\n\u003ctd align=\"left\">做不完的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">being a student\u003c/td>\n\u003ctd align=\"left\">当学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">pretty nice\u003c/td>\n\u003ctd align=\"left\">相当不错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">at least\u003c/td>\n\u003ctd align=\"left\">至少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">have time to do my own things\u003c/td>\n\u003ctd align=\"left\">有时间做自己的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">pursue my master&#39;s degree\u003c/td>\n\u003ctd align=\"left\">攻读硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">finish my master’s degree\u003c/td>\n\u003ctd align=\"left\">完成硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">At the same time,\u003c/td>\n\u003ctd align=\"left\">与此同时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">take some high-quality internships\u003c/td>\n\u003ctd align=\"left\">参加一些高质量的实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">improve my practical skills\u003c/td>\n\u003ctd align=\"left\">提高我的实践技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">After graduation,\u003c/td>\n\u003ctd align=\"left\">毕业后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">not in self-driving anymore\u003c/td>\n\u003ctd align=\"left\">不再做自动驾驶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">energetic and realistic\u003c/td>\n\u003ctd align=\"left\">有干劲且更现实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">my most creative years\u003c/td>\n\u003ctd align=\"left\">我最有创造力的几年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">if it didn&#39;t work out\u003c/td>\n\u003ctd align=\"left\">如果行不通\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">reevaluate my choice\u003c/td>\n\u003ctd align=\"left\">重新评估我的选择\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>\u003cstrong>When I first started university,\u003c/strong>\u003c/mark> My goal was to \u003cmark>become an engineer\u003c/mark> \u003cmark>in the field of\u003c/mark> autonomous driving. I hope I can \u003cmark>**use my professional knowledge\u003c/mark> to \u003cmark>solve real-world problems**\u003c/mark>. \u003cmark>More specifically,\u003c/mark> I want to \u003cmark>\u003cstrong>optimize self-driving algorithms\u003c/strong>\u003c/mark> to make them \u003cmark>\u003cstrong>agile but safe\u003c/strong>.\u003c/mark>\u003c/p>\n\u003cp>刚上大学的时候，我的目标是成为自动驾驶领域的工程师。我希望能够运用专业知识解决现实中的实际问题。具体来说，我想要优化自动驾驶算法，让算法兼顾灵敏性与安全性。\u003c/p>\n\u003cp>In the past, I used to \u003cmark>really look forward to\u003c/mark> working. Last year, I wanted to see \u003cmark>what real work was like\u003c/mark>. So,\u003cmark>earlier this year\u003c/mark>, I \u003cmark>did an internship\u003c/mark> at an \u003cmark>autonomous driving company\u003c/mark>. I was really tired. I worked from 10 a.m. to 10 p.m. with \u003cmark>endless work to do\u003c/mark>. After that, I came to feel that \u003cmark>being a student\u003c/mark> is \u003cmark>pretty nice\u003c/mark>, because \u003cmark>at least\u003c/mark> I \u003cmark>have time to do my own things.\u003c/mark>\u003c/p>\n\u003cp>我曾经十分期待步入职场。去年，我很想体验真实的工作是什么样子。今年年初，我在一家自动驾驶企业实习。那段工作十分辛苦，每天早上十点工作到晚上十点，总有做不完的任务。从那以后，我觉得学生身份其实挺不错的，至少我拥有可以支配、做自己事情的时间。\u003c/p>\n\u003cp>After that, I changed my opinion/plan\u003cbr>I plan to \u003cmark>pursue my master&#39;s degree\u003c/mark> starting this September. First, I’ll \u003cmark>finish my master’s degree\u003c/mark> in the next three years. \u003cmark>At the same time\u003c/mark>, I want to \u003cmark>take some high-quality internships\u003c/mark> to \u003cmark>improve my practical skills\u003c/mark>. \u003cmark>After graduation\u003c/mark>, I plan to work as a robotics engineer, \u003cmark>not in self-driving anymore\u003c/mark>\u003c/p>\n\u003cp>这次实习之后，我的想法和规划发生了改变。\u003cbr>我计划今年 9 月开始攻读硕士学位。首先，我会在未来三年内完成硕士阶段的学习。与此同时，我打算参加几段高质量实习，提升自己的实操能力。毕业之后，我想从事机器人工程师相关工作，不再深耕自动驾驶方向。\u003c/p>\n\u003cp>I feel this change is positive. It made me more \u003cmark>energetic and realistic.\u003c/mark> After that internship,\u003cbr>I still want to become an engineer, but I decided that I should spend \u003cmark>my most creative years\u003c/mark> in robotics, and \u003cmark>if it didn&#39;t work out\u003c/mark>, then I would \u003cmark>reevaluate my choice\u003c/mark> after 5 years\u003c/p>\n\u003cp>我认为这次转变是一件好事，它让我变得更有动力，想法也更加务实。经历这次实习之后，我依旧想成为一名工程师，但我决定把创造力最旺盛的年华投入机器人领域。如果后续发展不尽人意，我会在五年之后重新考量自己的职业选择。\u003c/p>\n","toc":[],"text":"描述一个你近期不得不更改的计划 Describe a time when you changed an important opinion of yours 描述一次你改变自己某个重要观点的经历 You should say: When this happened What made you change the plan What the new plan was And how you felt about the change Describe a time when you changed an important opinion of yours You should say: When you changed your opinion What the original opinion was Why you changed it And explain how you felt about the experience Highlighted Phrase English Meaning (if needed) When I first started university, 刚上大学时 become an engineer 成为工程师 in the field of 在……领域 use my professional knowledge 运用我的专业知识 solve real-world problems 解决现实世界的问题 More specifically, 更具体地说 optimize self-driving algorithms 优化自动驾驶算法 agile but safe 敏捷且安全 really look forward to 非常期待 what real work was like 真实工作是什么样的 earlier this year 今年早些时候 did an internship 实习 autonomous driving company 自动驾驶公司 endless work to do 做不完的工作 being a student 当学生 pretty nice 相当不错 at least 至少 have time to do my own things 有时间做自己的事 pursue my master's degree 攻读硕士学位 finish my master’s degree 完成硕士学位 At the same time, 与此同时 take some high-quality internships 参加一些高质量的实习 improve my practical skills 提高我的实践技能 After graduation, 毕业后 not in self-driving anymore 不再做自动驾驶 energetic and realistic 有干劲且更现实 my most creative years 我最有创造力的几年 if it didn't work out 如果行不通 reevaluate my choice 重新评估我的选择 When I first started university, My goal was to become an engineer in the field of autonomous driving. I hope I can **use my professional knowledge to solve real-world problems**. More specifically, I want to optimize self-driving algorithms to make them agile but safe. 刚上大学的时候，我的目标是成为自动驾驶领域的工程师。我希望能够运用专业知识解决现实中的实际问题。具体来说，我想要优化自动驾驶算法，让算法兼顾灵敏性与安全性。 In the past, I used to really look forward to working. Last year, I wanted to see what real work was like. So,earlier this year, I did an internship at an autonomous driving company. I was really tired. I worked from 10 a.m. to 10 p.m. with endless work to do. After that, I came to feel that being a student is pretty nice, because at least I have time to do my own things. 我曾经十分期待步入职场。去年，我很想体验真实的工作是什么样子。今年年初，我在一家自动驾驶企业实习。那段工作十分辛苦，每天早上十点工作到晚上十点，总有做不完的任务。从那以后，我觉得学生身份其实挺不错的，至少我拥有可以支配、做自己事情的时间。 After that, I changed my opinion/plan I plan to pursue my master's degree starting this September. First, I’ll finish my master’s degree in the next three years. At the same time, I want to take some high-quality internships to improve my practical skills. After graduation, I plan to work as a robotics engineer, not in self-driving anymore 这次实习之后，我的想法和规划发生了改变。 我计划今年 9 月开始攻读硕士学位。首先，我会在未来三年内完成硕士阶段的学习。与此同时，我打算参加几段高质量实习，提升自己的实操能力。毕业之后，我想从事机器人工程师相关工作，不再深耕自动驾驶方向。 I feel this change is positive. It made me more energetic and realistic. After that internship, I still want to become an engineer, but I decided that I should spend my most creative years in robotics, and if it didn't work out, then I would reevaluate my choice after 5 years 我认为这次转变是一件好事，它让我变得更有动力，想法也更加务实。经历这次实习之后，我依旧想成为一名工程师，但我决定把创造力最旺盛的年华投入机器人领域。如果后续发展不尽人意，我会在五年之后重新考量自己的职业选择。"},{"id":"a-p2-09","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/9-新法律&环保法律.md","title":"P2-9 新法律 & 环保法律","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What law it is\u003c/li>\n\u003cli>What changes this law brings\u003c/li>\n\u003cli>Whether this new law will be popular\u003c/li>\n\u003cli>How you came up with the new law\u003c/li>\n\u003cli>And explain how you feel about this new law\u003c/li>\n\u003c/ul>\n\u003ch1>Describe an environmental law you would like your country to introduce\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What law it should be\u003c/li>\n\u003cli>Why people should follow the law\u003c/li>\n\u003cli>Whether the law will be popular\u003c/li>\n\u003cli>And explain how you feel about this law\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a law on environmental protection\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>How you first learned about it\u003c/li>\n\u003cli>Who benefits from it\u003c/li>\n\u003cli>And explain how you feel about this law\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>environmental law\u003c/td>\n\u003ctd>环境法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>should be introduced in china\u003c/td>\n\u003ctd>应该在我国推行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stopping rubbish pollution\u003c/td>\n\u003ctd>制止垃圾污染\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outdoor space\u003c/td>\n\u003ctd>户外空间/自然景区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take their own garbage away\u003c/td>\n\u003ctd>带走自己产生的垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after climbing mountains.\u003c/td>\n\u003ctd>登山后。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave rubbish behind\u003c/td>\n\u003ctd>留下/丢弃垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get a small fine.\u003c/td>\n\u003ctd>被处以小额罚款。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>wild animals\u003c/td>\n\u003ctd>野生动物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a tiny fraction of people\u003c/td>\n\u003ctd>一小部分人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it is troublesome.\u003c/td>\n\u003ctd>这很麻烦。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>came up with this idea\u003c/td>\n\u003ctd>产生这个想法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a trip to the Qinling Mountains\u003c/td>\n\u003ctd>一次去秦岭的旅行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go hiking\u003c/td>\n\u003ctd>去徒步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the foot of the mountain,\u003c/td>\n\u003ctd>山脚下，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rubbish everywhere\u003c/td>\n\u003ctd>到处都是垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the road up to the mountain\u003c/td>\n\u003ctd>上山的沿途\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go back before reaching the top\u003c/td>\n\u003ctd>还没登顶就折返\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>were introduced in my country,\u003c/td>\n\u003ctd>在我国推行，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>would become cleaner.\u003c/td>\n\u003ctd>将会变得更加干净。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today, I&#39;ll talk about a new \u003cmark>environmental law\u003c/mark> that \u003cmark>should be introduced in China\u003c/mark>. It is about \u003cmark>stopping rubbish pollution\u003c/mark> in \u003cmark>outdoor space\u003c/mark>. This law will ask everyone to \u003cmark>take their own garbage away\u003c/mark> \u003cmark>after climbing mountains.\u003c/mark> People who \u003cmark>leave rubbish behind\u003c/mark> will \u003cmark>get a small fine.\u003c/mark>\u003c/p>\n\u003cp>今天我想讲讲我国应该推行的一项新环境法。它是关于制止户外风景区垃圾污染的。这项法规要求所有游客登山后带走自己产生的垃圾。随意丢弃垃圾的人将会处以小额罚款。\u003c/p>\n\u003cp>This law will make our \u003cmark>outdoor space\u003c/mark> much cleaner. It can also protect \u003cmark>wild animals\u003c/mark>. I think most people will support this law; only \u003cmark>a tiny fraction of people\u003c/mark> think \u003cmark>it is troublesome.\u003c/mark>\u003c/p>\n\u003cp>这条规定能让自然景区干净很多，同时也能保护野生动物，我认为大多数人都会支持这项法规，只有少数人会觉得麻烦。\u003c/p>\n\u003cp>I \u003cmark>came up with this idea\u003c/mark> during \u003cmark>a trip to the Qinling Mountains\u003c/mark> with my parents last summer. We planned to \u003cmark>go hiking\u003c/mark> there, but when we arrived at \u003cmark>the foot of the mountain,\u003c/mark> there was \u003cmark>rubbish everywhere\u003c/mark> \u003cmark>along the road up to the mountain\u003c/mark>. I was really disappointed, so we decided to \u003cmark>go back before reaching the top\u003c/mark>. \u003c/p>\n\u003cp>我产生这个想法源于去年夏天和父母去秦岭的一次旅行。我们原本打算去徒步，可当我们到达山脚下时，上山沿途到处都是垃圾。我们甚至没有登顶就决定折返，当时我特别失望。\u003c/p>\n\u003cp>Personally, I support this law. because I believe if this law \u003cmark>\u003cstrong>were introduced\u003c/strong> in my country,\u003c/mark> those beautiful mountains \u003cmark>\u003cstrong>would become cleaner\u003c/strong>.\u003c/mark> I would never recommend that place to others, but I would definitely recommend this law to everyone.\u003c/p>\n\u003cp>就我个人而言，我支持这项法规。我认为如果我国推行这条法规，那些美丽的景区将会变得更加干净。我绝不会向别人推荐那个地方，但我一定会向所有人推荐这条法规。\u003c/p>\n\u003chr>\n","toc":[],"text":"You should say: What law it is What changes this law brings Whether this new law will be popular How you came up with the new law And explain how you feel about this new law Describe an environmental law you would like your country to introduce You should say: What law it should be Why people should follow the law Whether the law will be popular And explain how you feel about this law Describe a law on environmental protection You should say: What it is How you first learned about it Who benefits from it And explain how you feel about this law 英文原短语 中文翻译 environmental law 环境法 should be introduced in china 应该在我国推行 stopping rubbish pollution 制止垃圾污染 outdoor space 户外空间/自然景区 take their own garbage away 带走自己产生的垃圾 after climbing mountains. 登山后。 leave rubbish behind 留下/丢弃垃圾 get a small fine. 被处以小额罚款。 wild animals 野生动物 a tiny fraction of people 一小部分人 it is troublesome. 这很麻烦。 came up with this idea 产生这个想法 a trip to the Qinling Mountains 一次去秦岭的旅行 go hiking 去徒步 the foot of the mountain, 山脚下， rubbish everywhere 到处都是垃圾 along the road up to the mountain 上山的沿途 go back before reaching the top 还没登顶就折返 were introduced in my country, 在我国推行， would become cleaner. 将会变得更加干净。 Today, I'll talk about a new environmental law that should be introduced in China. It is about stopping rubbish pollution in outdoor space. This law will ask everyone to take their own garbage away after climbing mountains. People who leave rubbish behind will get a small fine. 今天我想讲讲我国应该推行的一项新环境法。它是关于制止户外风景区垃圾污染的。这项法规要求所有游客登山后带走自己产生的垃圾。随意丢弃垃圾的人将会处以小额罚款。 This law will make our outdoor space much cleaner. It can also protect wild animals. I think most people will support this law; only a tiny fraction of people think it is troublesome. 这条规定能让自然景区干净很多，同时也能保护野生动物，我认为大多数人都会支持这项法规，只有少数人会觉得麻烦。 I came up with this idea during a trip to the Qinling Mountains with my parents last summer. We planned to go hiking there, but when we arrived at the foot of the mountain, there was rubbish everywhere along the road up to the mountain. I was really disappointed, so we decided to go back before reaching the top. 我产生这个想法源于去年夏天和父母去秦岭的一次旅行。我们原本打算去徒步，可当我们到达山脚下时，上山沿途到处都是垃圾。我们甚至没有登顶就决定折返，当时我特别失望。 Personally, I support this law. because I believe if this law were introduced in my country, those beautiful mountains would become cleaner. I would never recommend that place to others, but I would definitely recommend this law to everyone. 就我个人而言，我支持这项法规。我认为如果我国推行这条法规，那些美丽的景区将会变得更加干净。我绝不会向别人推荐那个地方，但我一定会向所有人推荐这条法规。"},{"id":"a-p2-10","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/10-近期看过且享受的电影.md","title":"P2-10 近期看过且享受的电影","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When and where you watched it\u003c/li>\n\u003cli>Who you watched it with\u003c/li>\n\u003cli>What it was about\u003c/li>\n\u003cli>And explain why you watched this movie\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a professional rock climber\u003c/td>\n\u003ctd>职业攀岩者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>entire process\u003c/td>\n\u003ctd>全过程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>free solo climbing El Capitan\u003c/td>\n\u003ctd>徒手攀登酋长岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>granite cliff\u003c/td>\n\u003ctd>3000英尺高的花岗岩峭壁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yosemite National Park\u003c/td>\n\u003ctd>优胜美地国家公园\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>without any ropes or safety equipment\u003c/td>\n\u003ctd>不携带绳索、没有任何安全保护装备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>even a tiny mistake can cost you your life.\u003c/td>\n\u003ctd>哪怕一个微小失误，都可能失去生命。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After climbing for two months\u003c/td>\n\u003ctd>练习攀岩两个月后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo is the birthplace of outdoor rock climbing\u003c/td>\n\u003ctd>阳朔是中国野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The deal was great\u003c/td>\n\u003ctd>这个安排很不错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whether you are into rock climbing or not.\u003c/td>\n\u003ctd>无论你是否喜欢攀岩。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today, I&#39;ll talk about a movie called Free Solo, and I watched it at home with my dad last year. It really left a deep impression on me.\u003c/p>\n\u003cp>今天我想聊一部名为《徒手攀岩》的电影。去年我和爸爸在家观看了这部影片。它给我留下了十分深刻的印象\u003c/p>\n\u003chr>\n\u003cp>The movie is about \u003cmark>a professional rock climber\u003c/mark> named Alex Honnold. It records his \u003cmark>entire process\u003c/mark> of \u003cmark>free solo climbing El Capitan\u003c/mark>, which is a \u003cmark>granite cliff\u003c/mark> in \u003cmark>Yosemite National Park\u003c/mark> in the United States. Free solo means climbing \u003cmark>without any ropes or safety equipment\u003c/mark>, \u003cmark>even a tiny mistake can cost you your life.\u003c/mark>\u003c/p>\n\u003cp>这部电影讲述了职业攀岩者亚历克斯・霍诺尔德的故事。影片记录了他徒手攀登酋长岩的全过程，酋长岩是美国优胜美地国家公园内一座高达 3000 英尺的花岗岩峭壁。徒手攀岩就是不携带绳索、没有任何安全保护装备进行攀登，哪怕一个微小失误，都可能失去生命。\u003c/p>\n\u003chr>\n\u003cp>After that, I got into rock climbing. \u003cmark>After climbing for two months\u003c/mark>, I wanted to \u003cmark>try outdoor climbing\u003c/mark>. I found out that \u003cmark>Yangshuo is the birthplace of outdoor rock climbing\u003c/mark> in China. So I went there last September. Since I was still a student and didn’t have much money, I worked as a volunteer in a local inn for roughly two months. \u003cmark>The deal was great\u003c/mark> — I worked one day and went rock climbing the next.\u003c/p>\n\u003cp>看完电影之后，我开始迷上攀岩。练习攀岩两个月后，我想要尝试野外攀岩。我了解到阳朔是中国野外攀岩的发源地，于是去年九月我去到了那里。当时我还是学生，手头并不宽裕，就在当地一家客栈做了大约两个月的义工。这个安排很不错：工作一天，第二天就可以去攀岩。\u003c/p>\n\u003chr>\n\u003cp>I strongly recommend Free Solo to everyone, \u003cmark>whether you are into rock climbing or not.\u003c/mark>\u003c/p>\n\u003cp>向所有人强烈推荐《徒手攀岩》这部影片，无论你是否喜欢攀岩。\u003c/p>\n","toc":[],"text":"You should say: When and where you watched it Who you watched it with What it was about And explain why you watched this movie 英文原短语 中文翻译 a professional rock climber 职业攀岩者 entire process 全过程 free solo climbing El Capitan 徒手攀登酋长岩 granite cliff 3000英尺高的花岗岩峭壁 Yosemite National Park 优胜美地国家公园 without any ropes or safety equipment 不携带绳索、没有任何安全保护装备 even a tiny mistake can cost you your life. 哪怕一个微小失误，都可能失去生命。 After climbing for two months 练习攀岩两个月后 try outdoor climbing 尝试野外攀岩 Yangshuo is the birthplace of outdoor rock climbing 阳朔是中国野外攀岩的发源地 The deal was great 这个安排很不错 whether you are into rock climbing or not. 无论你是否喜欢攀岩。 Today, I'll talk about a movie called Free Solo, and I watched it at home with my dad last year. It really left a deep impression on me. 今天我想聊一部名为《徒手攀岩》的电影。去年我和爸爸在家观看了这部影片。它给我留下了十分深刻的印象 The movie is about a professional rock climber named Alex Honnold. It records his entire process of free solo climbing El Capitan, which is a granite cliff in Yosemite National Park in the United States. Free solo means climbing without any ropes or safety equipment, even a tiny mistake can cost you your life. 这部电影讲述了职业攀岩者亚历克斯・霍诺尔德的故事。影片记录了他徒手攀登酋长岩的全过程，酋长岩是美国优胜美地国家公园内一座高达 3000 英尺的花岗岩峭壁。徒手攀岩就是不携带绳索、没有任何安全保护装备进行攀登，哪怕一个微小失误，都可能失去生命。 After that, I got into rock climbing. After climbing for two months, I wanted to try outdoor climbing. I found out that Yangshuo is the birthplace of outdoor rock climbing in China. So I went there last September. Since I was still a student and didn’t have much money, I worked as a volunteer in a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. 看完电影之后，我开始迷上攀岩。练习攀岩两个月后，我想要尝试野外攀岩。我了解到阳朔是中国野外攀岩的发源地，于是去年九月我去到了那里。当时我还是学生，手头并不宽裕，就在当地一家客栈做了大约两个月的义工。这个安排很不错：工作一天，第二天就可以去攀岩。 I strongly recommend Free Solo to everyone, whether you are into rock climbing or not. 向所有人强烈推荐《徒手攀岩》这部影片，无论你是否喜欢攀岩。"},{"id":"a-p2-11","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/11-为家人感到骄傲.md","title":"P2-11 为家人感到骄傲","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When it happened\u003c/li>\n\u003cli>Who the person is\u003c/li>\n\u003cli>What the person did\u003c/li>\n\u003cli>And explain why you felt proud of him/her\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>we grew up together.\u003c/mark>\u003c/td>\n\u003ctd>我们一起长大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine doctor\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s interesting to note that\u003c/td>\n\u003ctd>有意思的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look like a doctor\u003c/td>\n\u003ctd>看起来像医生\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a doctor\u003c/td>\n\u003ctd>成为医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like me\u003c/td>\n\u003ctd>就像我一样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronics, mechanical engineering or computer science\u003c/td>\n\u003ctd>电子、机械工程或者计算机科学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>everything changed\u003c/td>\n\u003ctd>一切都改变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in his father&#39;s clinic\u003c/td>\n\u003ctd>在他父亲的诊所里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help many patients\u003c/td>\n\u003ctd>帮助很多病人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recover from illnesses\u003c/td>\n\u003ctd>摆脱病痛、康复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>offered free treatment\u003c/mark>\u003c/td>\n\u003ctd>提供免费诊疗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up his mind\u003c/td>\n\u003ctd>下定决心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses\u003c/td>\n\u003ctd>专业课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical medical knowledge\u003c/td>\n\u003ctd>实用的医学知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gives him a real sense of achievement\u003c/td>\n\u003ctd>让他很有成就感\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main reason for him to choose this job\u003c/td>\n\u003ctd>他选择这份工作最主要的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>admires his father’s spirit\u003c/td>\n\u003ctd>欣赏她父亲的精神\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so proud of\u003c/td>\n\u003ctd>为…… 感到十分骄傲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>studying medicine\u003c/td>\n\u003ctd>学医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is never an easy journey\u003c/td>\n\u003ctd>从来都不是一件容易的事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today I&#39;ll talk about a time when I felt proud of a family member. The person is my cousin Kaiyao, and \u003cmark>we grew up together.\u003c/mark> His father is a traditional Chinese medicine doctor. It’s interesting to note that he doesn’t look like a doctor at all — he is really tall and strong.\u003c/p>\n\u003cp>今天我想聊聊我为一位家人感到自豪的时刻。这个人是我的表哥，我们一同长大。他父亲是一名中医。有意思的是，他看上去完全不像一名医生 —— 他身材高大健壮。\u003c/p>\n\u003cp>At first, he didn&#39;t want to \u003cmark>be a doctor\u003c/mark> at all. He also wanted to become an engineer, \u003cmark>just like me\u003c/mark>. We planned to study \u003cmark>electronics, mechanical engineering or computer science.\u003c/mark>\u003cbr>However, \u003cmark>everything changed\u003c/mark> after he spent one summer working \u003cmark>in his father&#39;s clinic\u003c/mark>. He watched his father \u003cmark>help many patients\u003c/mark> \u003cmark>recover from illnesses\u003c/mark>. What’s more, his father \u003cmark>offered free treatment\u003c/mark> for poor people.\u003c/p>\n\u003cp>最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。\u003cbr>但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。\u003c/p>\n\u003cp>After that, he \u003cmark>made up his mind\u003c/mark> to learn \u003cmark>traditional Chinese medicine\u003c/mark> at university. Although some \u003cmark>professional courses\u003c/mark> are challenging, he can gain a lot of \u003cmark>practical medical knowledge\u003c/mark>, which \u003cmark>gives him a real sense of achievement.\u003c/mark>\u003c/p>\n\u003cp>在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。\u003c/p>\n\u003cp>\u003cmark>The main reason for him to choose this job\u003c/mark> is that he really \u003cmark>admires his father’s spirit\u003c/mark>. He wants to become a doctor like his father one day. I am \u003cmark>so proud of\u003c/mark> Kaiyao, because \u003cmark>studying medicine\u003c/mark> \u003cmark>is never an easy journey.\u003c/mark>\u003c/p>\n\u003cp>他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。\u003c/p>\n","toc":[],"text":"You should say: When it happened Who the person is What the person did And explain why you felt proud of him/her 英文短语 中文释义 we grew up together. 我们一起长大 traditional Chinese medicine doctor 中医 It’s interesting to note that 有意思的是 look like a doctor 看起来像医生 being a doctor 成为医生 just like me 就像我一样 electronics, mechanical engineering or computer science 电子、机械工程或者计算机科学 everything changed 一切都改变了 in his father's clinic 在他父亲的诊所里 help many patients 帮助很多病人 recover from illnesses 摆脱病痛、康复 offered free treatment 提供免费诊疗 made up his mind 下定决心 traditional Chinese medicine 中医 professional courses 专业课 practical medical knowledge 实用的医学知识 gives him a real sense of achievement 让他很有成就感 The main reason for him to choose this job 他选择这份工作最主要的原因 admires his father’s spirit 欣赏她父亲的精神 so proud of 为…… 感到十分骄傲 studying medicine 学医 is never an easy journey 从来都不是一件容易的事 Today I'll talk about a time when I felt proud of a family member. The person is my cousin Kaiyao, and we grew up together. His father is a traditional Chinese medicine doctor. It’s interesting to note that he doesn’t look like a doctor at all — he is really tall and strong. 今天我想聊聊我为一位家人感到自豪的时刻。这个人是我的表哥，我们一同长大。他父亲是一名中医。有意思的是，他看上去完全不像一名医生 —— 他身材高大健壮。 At first, he didn't want to be a doctor at all. He also wanted to become an engineer, just like me. We planned to study electronics, mechanical engineering or computer science. However, everything changed after he spent one summer working in his father's clinic. He watched his father help many patients recover from illnesses. What’s more, his father offered free treatment for poor people. 最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。 但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。 After that, he made up his mind to learn traditional Chinese medicine at university. Although some professional courses are challenging, he can gain a lot of practical medical knowledge, which gives him a real sense of achievement. 在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。 The main reason for him to choose this job is that he really admires his father’s spirit. He wants to become a doctor like his father one day. I am so proud of Kaiyao, because studying medicine is never an easy journey. 他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。"},{"id":"a-p2-12","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/12-高的建筑.md","title":"P2-12 高的建筑","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is used for\u003c/li>\n\u003cli>Where it is\u003c/li>\n\u003cli>What it looks like\u003c/li>\n\u003cli>And explain why you like/dislike it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>an office skyscraper\u003c/mark>\u003c/td>\n\u003ctd>一栋写字楼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>where I worked for about 4 months\u003c/td>\n\u003ctd>我在那里工作过几个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a busy street\u003c/td>\n\u003ctd>繁华的商业街\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>serves as a workspace.\u003c/td>\n\u003ctd>很多不同公司都在这里办公\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>From the outside\u003c/td>\n\u003ctd>从外观来看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>it looks quite modern.\u003c/mark>\u003c/td>\n\u003ctd>它看起来相当时尚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can’t stand the atmosphere inside.\u003c/td>\n\u003ctd>很不喜欢楼内的氛围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The ceilings were low,\u003c/td>\n\u003ctd>天花板很低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me feel stressed and anxious\u003c/td>\n\u003ctd>让我感到压抑、焦虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Earlier this year\u003c/td>\n\u003ctd>今年早些时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>did an internship\u003c/td>\n\u003ctd>实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autonomous driving company there\u003c/td>\n\u003ctd>自动驾驶公司（在楼里）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endless work to do\u003c/td>\n\u003ctd>做不完的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a student\u003c/td>\n\u003ctd>做学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pretty nice\u003c/td>\n\u003ctd>挺好的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at least\u003c/td>\n\u003ctd>至少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have time to do my own things.\u003c/td>\n\u003ctd>有时间去做自己想做的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recommend it to others.\u003c/td>\n\u003ctd>向其他人推荐\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today, I&#39;ll talk about a tall building that I dislike. It is \u003cmark>an office skyscraper\u003c/mark> in Guangzhou \u003cmark>where I worked for about 4 months\u003c/mark>. It is located on \u003cmark>a busy street\u003c/mark>, and \u003cmark>serves as a workspace for many different companies.\u003c/mark>\u003cbr>今天，我想聊聊一栋我不喜欢的高楼。这是广州一栋写字楼，我在那里工作过几个月。大楼坐落于繁华的商业街里，很多不同公司都在这里办公。\u003c/p>\n\u003cp> \u003cmark>From the outside\u003c/mark>, \u003cmark>it looks quite modern.\u003c/mark> But I \u003cmark>can’t stand the atmosphere inside.\u003c/mark> \u003cmark>The ceilings were low,\u003c/mark> which \u003cmark>made me feel stressed and anxious\u003c/mark>. \u003cmark>Earlier this year\u003c/mark>, I \u003cmark>did an internship\u003c/mark> at an \u003cmark>autonomous driving company there\u003c/mark>. I was really tired. I worked from 10 a.m. to 10 p.m. with \u003cmark>endless work to do\u003c/mark>. After that, I came to feel that \u003cmark>being a student\u003c/mark> is \u003cmark>pretty nice\u003c/mark>, because \u003cmark>at least\u003c/mark> I \u003cmark>have time to do my own things.\u003c/mark>\u003c/p>\n\u003cp>从外观来看，它看起来相当时尚。但我很不喜欢楼内的氛围。天花板很低，让我感到压抑、焦虑。今年早些时候，我在楼里一家自动驾驶公司实习。我特别疲惫，每天早十到晚十，总有做不完的工作。经过这段经历之后，我发现做学生其实挺好的，至少我还有时间去做自己想做的事。\u003c/p>\n\u003cp>Because of that experience, I strongly dislike this tall building. And I would never \u003cmark>recommend it to others.\u003c/mark>\u003c/p>\n\u003cp>正是这段经历，让我非常不喜欢这栋大楼，我也不会像其他人推荐\u003c/p>\n","toc":[],"text":"You should say: What it is used for Where it is What it looks like And explain why you like/dislike it 英文短语 中文翻译 an office skyscraper 一栋写字楼 where I worked for about 4 months 我在那里工作过几个月 a busy street 繁华的商业街 serves as a workspace. 很多不同公司都在这里办公 From the outside 从外观来看 it looks quite modern. 它看起来相当时尚 can’t stand the atmosphere inside. 很不喜欢楼内的氛围 The ceilings were low, 天花板很低 made me feel stressed and anxious 让我感到压抑、焦虑 Earlier this year 今年早些时候 did an internship 实习 autonomous driving company there 自动驾驶公司（在楼里） endless work to do 做不完的工作 being a student 做学生 pretty nice 挺好的 at least 至少 have time to do my own things. 有时间去做自己想做的事 recommend it to others. 向其他人推荐 Today, I'll talk about a tall building that I dislike. It is an office skyscraper in Guangzhou where I worked for about 4 months. It is located on a busy street, and serves as a workspace for many different companies. 今天，我想聊聊一栋我不喜欢的高楼。这是广州一栋写字楼，我在那里工作过几个月。大楼坐落于繁华的商业街里，很多不同公司都在这里办公。 From the outside, it looks quite modern. But I can’t stand the atmosphere inside. The ceilings were low, which made me feel stressed and anxious. Earlier this year, I did an internship at an autonomous driving company there. I was really tired. I worked from 10 a.m. to 10 p.m. with endless work to do. After that, I came to feel that being a student is pretty nice, because at least I have time to do my own things. 从外观来看，它看起来相当时尚。但我很不喜欢楼内的氛围。天花板很低，让我感到压抑、焦虑。今年早些时候，我在楼里一家自动驾驶公司实习。我特别疲惫，每天早十到晚十，总有做不完的工作。经过这段经历之后，我发现做学生其实挺好的，至少我还有时间去做自己想做的事。 Because of that experience, I strongly dislike this tall building. And I would never recommend it to others. 正是这段经历，让我非常不喜欢这栋大楼，我也不会像其他人推荐"},{"id":"a-p3-base","origin":"author","group":"a-p3","file":"原作者笔记/口语/P3/0-必备.md","title":"P3 万能框架与语料","html":"\u003ch2 id=\"h1\">一、答题原则与五类问题\u003c/h2>\n\u003cblockquote>\n\u003cp>先直接回答问题，再选择相关的理由展开。科技、生活压力、健康等可以提供思路；与问题无关时，不必使用。可以用“回答＋理由＋例子”练习，不要求每次机械凑齐。\u003c/p>\n\u003c/blockquote>\n\u003cp>P3 常见五类问法、开头句型与简短示范：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题类型\u003c/th>\n\u003cth>常见问法\u003c/th>\n\u003cth>常用开头\u003c/th>\n\u003cth>简短完整回答示范\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>原因类\u003c/strong>\u003c/td>\n\u003ctd>Why...? / What causes...?\u003c/td>\n\u003ctd>The main reason is that... / This is mainly because...\u003c/td>\n\u003ctd>\u003cstrong>Q: Why do many young people like shopping online?\u003c/strong>\u003cbr>I think the main reason is convenience. People can compare prices and order things on their phones in a few minutes instead of going to a crowded mall. Besides, online stores often offer discounts, which is attractive to students and young workers.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>影响类\u003c/strong>\u003c/td>\n\u003ctd>What are the effects of...?\u003c/td>\n\u003ctd>This can lead to... / One major impact is that...\u003c/td>\n\u003ctd>\u003cstrong>Q: What effects does working long hours have on people?\u003c/strong>\u003cbr>Working long hours can cause both physical and mental health problems. When people sit in the office all day, they lack exercise and sleep, and they hardly have time to relax with their families. Over time, this heavy pressure makes them feel exhausted.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>对比类\u003c/strong>\u003c/td>\n\u003ctd>How is A different from B?\u003c/td>\n\u003ctd>The main difference is that A..., while B... / Unlike A, B...\u003c/td>\n\u003ctd>\u003cstrong>Q: What is the difference between watching movies at home and in a cinema?\u003c/strong>\u003cbr>The main difference is the atmosphere and cost. Watching a movie in a cinema gives you a big screen and great sound effects, which is exciting for action films. By contrast, watching at home is much cheaper and more comfortable because you can pause whenever you want.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>解决类\u003c/strong>\u003c/td>\n\u003ctd>How can we solve...? / What should be done?\u003c/td>\n\u003ctd>Both individuals and the government can... / A practical way is to...\u003c/td>\n\u003ctd>\u003cstrong>Q: How can we encourage people to produce less household waste?\u003c/strong>\u003cbr>Both the government and individuals need to take action. Local governments can set up clear waste-sorting rules and charge for plastic bags. At the same time, individuals can bring their own reusable bags when shopping and avoid buying things they do not really need.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>预测类\u003c/strong>\u003c/td>\n\u003ctd>Will this trend continue in the future?\u003c/td>\n\u003ctd>I think it will probably..., because... / It depends, but...\u003c/td>\n\u003ctd>\u003cstrong>Q: Will paper books disappear in the future?\u003c/strong>\u003cbr>I don&#39;t think they will disappear completely. Although e-books are convenient and cheap, many people still prefer the feeling of holding a real book and taking notes on paper. Also, reading paper books is much easier on the eyes after staring at screens all day.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h2\">二、常用衔接与表态开头\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>谈到原因\u003c/td>\n\u003ctd>Well, I guess the main reason is that...\u003c/td>\n\u003ctd>我想主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谈到影响\u003c/td>\n\u003ctd>In my view, this could lead to...\u003c/td>\n\u003ctd>在我看来，这可能会导致……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表示同意\u003c/td>\n\u003ctd>I agree with that, mainly because...\u003c/td>\n\u003ctd>我同意这一点，主要是因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分情况回答\u003c/td>\n\u003ctd>It depends on the situation. For example, if...\u003c/td>\n\u003ctd>这看情况。比如，如果……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>给出建议\u003c/td>\n\u003ctd>I believe both governments and individuals should...\u003c/td>\n\u003ctd>我认为政府和个人都应该……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>举例说明\u003c/td>\n\u003ctd>Take... for example. / For instance,...\u003c/td>\n\u003ctd>以……为例。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>补充另一面\u003c/td>\n\u003ctd>On the other hand, we should not ignore...\u003c/td>\n\u003ctd>另一方面，我们也不应忽视……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h3\">三、八组高频话题语料（按相关性选用，已校订）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文句子\u003c/th>\n\u003cth>中文对照\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1. 生活成本高 high living costs\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nowadays, \u003cmark>living costs are getting higher and higher.\u003c/mark>\u003c/td>\n\u003ctd>如今生活成本越来越高。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Young people face heavy pressure from daily spending.\u003c/td>\n\u003ctd>年轻人面临日常开销带来的巨大压力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Housing and food take up most of people&#39;s salary.\u003c/td>\n\u003ctd>房租和食物花掉人们大部分工资。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2. 生活节奏快 fast pace of life\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Modern city people \u003cmark>live at a really fast pace.\u003c/mark>\u003c/td>\n\u003ctd>现代城市居民生活节奏很快。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People are \u003cmark>always busy\u003c/mark> and \u003cmark>have little free time.\u003c/mark>\u003c/td>\n\u003ctd>人们总是很忙碌，几乎没有空闲时间。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>They \u003cmark>go to work in a hurry every day\u003c/mark> and \u003cmark>almost never relax.\u003c/mark>\u003c/td>\n\u003ctd>他们每天匆忙上班，很少放松自己。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3. 健康问题 health problems\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Living at a fast pace\u003c/mark> brings many \u003cmark>physical health problems.\u003c/mark>\u003c/td>\n\u003ctd>快节奏生活带来很多身体健康问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people \u003cmark>lack exercise and sleep\u003c/mark> every day.\u003c/td>\n\u003ctd>很多人每天缺乏运动和睡眠。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Scrolling through social media for a long time\u003c/mark> can also cause \u003cmark>mental stress.\u003c/mark>\u003c/td>\n\u003ctd>长时间刷社交媒体也会造成精神压力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sitting for long hours without exercise leads to physical problems.\u003c/td>\n\u003ctd>长时间久坐不运动会带来身体问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4. 社交与沟通 social communication\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People \u003cmark>spend too much time online\u003c/mark> and \u003cmark>ignore face-to-face talks.\u003c/mark>\u003c/td>\n\u003ctd>人们花太多时间上网，忽略面对面交流。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some people become less confident in \u003cmark>real-life communication.\u003c/mark>\u003c/td>\n\u003ctd>有些人在现实社交中变得不够自信。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5. 科技与便利 technology &amp; convenience\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Most people choose new technology \u003cmark>just for convenience.\u003c/mark>\u003c/td>\n\u003ctd>大多数人选择新技术主要是为了方便。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People prefer \u003cmark>easy and fast ways\u003c/mark> to finish daily tasks.\u003c/td>\n\u003ctd>人们更喜欢用简单快捷的方式处理日常事务。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The internet has changed the way we live and work.\u003c/td>\n\u003ctd>互联网改变了我们生活和工作的方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>6. AI 与工作 AI &amp; jobs\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI can handle many \u003cmark>repeated and boring tasks\u003c/mark> for humans.\u003c/td>\n\u003ctd>AI 可以帮人类处理许多重复枯燥的工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some workers worry AI will \u003cmark>take their jobs\u003c/mark> in the future.\u003c/td>\n\u003ctd>一些劳动者担心未来 AI 会取代他们的工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>7. 信息过载 online information\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We \u003cmark>are flooded with\u003c/mark> all kinds of information online every day.\u003c/td>\n\u003ctd>我们每天接触大量网络信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is sometimes hard for people to \u003cmark>sort out reliable information online.\u003c/mark>\u003c/td>\n\u003ctd>人们有时很难分辨网上的可靠信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>8. 消费与广告 consumerism &amp; ads\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Consumerism\u003c/mark> pushes people to buy things they don&#39;t really need in daily life.\u003c/td>\n\u003ctd>消费主义促使人们购买日常并不真正需要的东西。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people shop \u003cmark>just for fun\u003c/mark> \u003cmark>instead of real demand.\u003c/mark>\u003c/td>\n\u003ctd>很多人购物只是为了消遣，而非实际需求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Businesses \u003cmark>use advertisements\u003c/mark> to encourage people to \u003cmark>spend more money.\u003c/mark>\u003c/td>\n\u003ctd>商家利用广告鼓励人们多消费。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>9. 教育与成长 education &amp; skills\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is important for children to learn both academic knowledge and practical life skills.\u003c/td>\n\u003ctd>对孩子来说，学习书本知识和生活技能都很重要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>10. 环境与公共意识 environment &amp; public awareness\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Raising public awareness is the first step to solving environmental problems.\u003c/td>\n\u003ctd>提高公众意识是解决环境问题的第一步。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"h4\">四、考前速练建议\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>先练直接破题\u003c/strong>：遮住上面示范的英文，看五类问题，第一句话必须在 3 秒内直接回答问题（不要绕弯子）。\u003c/li>\n\u003cli>\u003cstrong>选 1–2 个贴题理由\u003c/strong>：只有当题目真的涉及工作、消费、科技、健康时，才调用第三部分的对应句子。\u003c/li>\n\u003cli>\u003cstrong>录音自查（30–45 秒/题）\u003c/strong>：重点听第一句有没有直接答到点子上，以及第三人称单数、过去时是否准确。\u003c/li>\n\u003c/ol>\n","toc":[{"level":2,"id":"h1","text":"一、答题原则与五类问题"},{"level":2,"id":"h2","text":"二、常用衔接与表态开头"},{"level":2,"id":"h3","text":"三、八组高频话题语料（按相关性选用，已校订）"},{"level":2,"id":"h4","text":"四、考前速练建议"}],"text":"一、答题原则与五类问题 先直接回答问题，再选择相关的理由展开。科技、生活压力、健康等可以提供思路；与问题无关时，不必使用。可以用“回答＋理由＋例子”练习，不要求每次机械凑齐。 P3 常见五类问法、开头句型与简短示范： 问题类型 常见问法 常用开头 简短完整回答示范 原因类 Why...? / What causes...? The main reason is that... / This is mainly because... Q: Why do many young people like shopping online? I think the main reason is convenience. People can compare prices and order things on their phones in a few minutes instead of going to a crowded mall. Besides, online stores often offer discounts, which is attractive to students and young workers. 影响类 What are the effects of...? This can lead to... / One major impact is that... Q: What effects does working long hours have on people? Working long hours can cause both physical and mental health problems. When people sit in the office all day, they lack exercise and sleep, and they hardly have time to relax with their families. Over time, this heavy pressure makes them feel exhausted. 对比类 How is A different from B? The main difference is that A..., while B... / Unlike A, B... Q: What is the difference between watching movies at home and in a cinema? The main difference is the atmosphere and cost. Watching a movie in a cinema gives you a big screen and great sound effects, which is exciting for action films. By contrast, watching at home is much cheaper and more comfortable because you can pause whenever you want. 解决类 How can we solve...? / What should be done? Both individuals and the government can... / A practical way is to... Q: How can we encourage people to produce less household waste? Both the government and individuals need to take action. Local governments can set up clear waste-sorting rules and charge for plastic bags. At the same time, individuals can bring their own reusable bags when shopping and avoid buying things they do not really need. 预测类 Will this trend continue in the future? I think it will probably..., because... / It depends, but... Q: Will paper books disappear in the future? I don't think they will disappear completely. Although e-books are convenient and cheap, many people still prefer the feeling of holding a real book and taking notes on paper. Also, reading paper books is much easier on the eyes after staring at screens all day. 二、常用衔接与表态开头 场景 英文表达 中文 谈到原因 Well, I guess the main reason is that... 我想主要原因是…… 谈到影响 In my view, this could lead to... 在我看来，这可能会导致…… 表示同意 I agree with that, mainly because... 我同意这一点，主要是因为…… 分情况回答 It depends on the situation. For example, if... 这看情况。比如，如果…… 给出建议 I believe both governments and individuals should... 我认为政府和个人都应该…… 举例说明 Take... for example. / For instance,... 以……为例。 补充另一面 On the other hand, we should not ignore... 另一方面，我们也不应忽视…… 三、八组高频话题语料（按相关性选用，已校订） 英文句子 中文对照 1. 生活成本高 high living costs Nowadays, living costs are getting higher and higher. 如今生活成本越来越高。 Young people face heavy pressure from daily spending. 年轻人面临日常开销带来的巨大压力。 Housing and food take up most of people's salary. 房租和食物花掉人们大部分工资。 2. 生活节奏快 fast pace of life Modern city people live at a really fast pace. 现代城市居民生活节奏很快。 People are always busy and have little free time. 人们总是很忙碌，几乎没有空闲时间。 They go to work in a hurry every day and almost never relax. 他们每天匆忙上班，很少放松自己。 3. 健康问题 health problems Living at a fast pace brings many physical health problems. 快节奏生活带来很多身体健康问题。 Many people lack exercise and sleep every day. 很多人每天缺乏运动和睡眠。 Scrolling through social media for a long time can also cause mental stress. 长时间刷社交媒体也会造成精神压力。 Sitting for long hours without exercise leads to physical problems. 长时间久坐不运动会带来身体问题。 4. 社交与沟通 social communication People spend too much time online and ignore face-to-face talks. 人们花太多时间上网，忽略面对面交流。 Some people become less confident in real-life communication. 有些人在现实社交中变得不够自信。 5. 科技与便利 technology & convenience Most people choose new technology just for convenience. 大多数人选择新技术主要是为了方便。 People prefer easy and fast ways to finish daily tasks. 人们更喜欢用简单快捷的方式处理日常事务。 The internet has changed the way we live and work. 互联网改变了我们生活和工作的方式。 6. AI 与工作 AI & jobs AI can handle many repeated and boring tasks for humans. AI 可以帮人类处理许多重复枯燥的工作。 Some workers worry AI will take their jobs in the future. 一些劳动者担心未来 AI 会取代他们的工作。 7. 信息过载 online information We are flooded with all kinds of information online every day. 我们每天接触大量网络信息。 It is sometimes hard for people to sort out reliable information online. 人们有时很难分辨网上的可靠信息。 8. 消费与广告 consumerism & ads Consumerism pushes people to buy things they don't really need in daily life. 消费主义促使人们购买日常并不真正需要的东西。 Many people shop just for fun instead of real demand. 很多人购物只是为了消遣，而非实际需求。 Businesses use advertisements to encourage people to spend more money. 商家利用广告鼓励人们多消费。 9. 教育与成长 education & skills It is important for children to learn both academic knowledge and practical life skills. 对孩子来说，学习书本知识和生活技能都很重要。 10. 环境与公共意识 environment & public awareness Raising public awareness is the first step to solving environmental problems. 提高公众意识是解决环境问题的第一步。 四、考前速练建议 先练直接破题：遮住上面示范的英文，看五类问题，第一句话必须在 3 秒内直接回答问题（不要绕弯子）。 选 1–2 个贴题理由：只有当题目真的涉及工作、消费、科技、健康时，才调用第三部分的对应句子。 录音自查（30–45 秒/题）：重点听第一句有没有直接答到点子上，以及第三人称单数、过去时是否准确。"},{"id":"a-p3-tech","origin":"author","group":"a-p3","file":"原作者笔记/口语/P3/14-遇到的科技问题.md","title":"P3 科技问题（AI）","html":"\u003cul>\n\u003cli>What are the advantages and disadvantages of AI?\u003c/li>\n\u003cli>Do you think people today should learn about AI technology?\u003c/li>\n\u003cli>Should children learn to use AI?\u003c/li>\n\u003cli>How can AI help in our lives?\u003c/li>\n\u003cli>Do you think students are overly reliant on AI?\u003c/li>\n\u003cli>What can teachers do to stop students from relying too much on AI?\u003c/li>\n\u003cli>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h1\">1. What are the advantages and disadvantages of AI?\u003c/h2>\n\u003cp>Advantages first. AI saves us lots of time. It can handle difficult tasks quickly, like processing data.\u003cbr>But it also has downsides. Some people depend on it too much. They lose their own thinking skills. Also, some jobs may disappear because of AI.\u003c/p>\n\u003cp>首先说优点。人工智能能帮我们节省大量时间。它可以快速完成复杂工作，比如计算数据。\u003cbr>但它也有弊端。有些人过度依赖人工智能，丧失独立思考能力。而且部分工作岗位会因为人工智能消失。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you think people today should learn about AI technology?\u003c/h2>\n\u003cp>Yes, I believe everyone needs to know basic AI.\u003c/p>\n\u003cp>我认为所有人都应该了解基础人工智能知识。\u003c/p>\n\u003cp>Now AI is everywhere in daily life. If you understand it, you can use it better.\u003c/p>\n\u003cp>如今人工智能遍布日常生活。懂它，你才能更好地使用。\u003c/p>\n\u003cp>If you ignore it, you will fall behind others in study and work.\u003c/p>\n\u003cp>如果完全不了解，学习和工作上都会落后于人。\u003c/p>\n\u003ch2 id=\"h3\">3. Should children learn to use AI?\u003c/h2>\n\u003cp>Yes, but they need strict rules.\u003c/p>\n\u003cp>可以，但必须有严格使用规范。\u003c/p>\n\u003cp>AI helps kids search for study materials quickly. It makes learning fun.\u003c/p>\n\u003cp>人工智能能帮孩子快速查找学习资料，让学习变得有趣。\u003c/p>\n\u003cp>However, kids cannot use it all the time. They may copy answers and stop thinking by themselves.\u003c/p>\n\u003cp>但孩子不能一直使用，他们会直接抄答案，不再独立思考。\u003c/p>\n\u003ch2 id=\"h4\">4. How can AI help in our lives?\u003c/h2>\n\u003cp>AI helps us in many daily areas.\u003c/p>\n\u003cp>人工智能在生活很多方面都能帮到我们。\u003c/p>\n\u003cp>First, it helps students finish homework and look up information.\u003c/p>\n\u003cp>第一，帮助学生写作业、查阅知识。\u003c/p>\n\u003cp>Second, smart AI tools make housework easier, like robot cleaners.\u003c/p>\n\u003cp>第二，智能 AI 工具简化家务，比如扫地机器人。\u003c/p>\n\u003cp>Third, self-driving AI makes travelling safer and more convenient.\u003c/p>\n\u003cp>第三，自动驾驶 AI 让出行更安全、便捷。\u003c/p>\n\u003ch2 id=\"h5\">5. Do you think students are overly reliant on AI?\u003c/h2>\n\u003cp>Yes, lots of students rely on AI too much these days.\u003c/p>\n\u003cp>没错，现在很多学生过度依赖人工智能。\u003c/p>\n\u003cp>When they meet difficult problems, they open AI tools at once.\u003c/p>\n\u003cp>一遇到难题，他们立刻打开 AI 工具。\u003c/p>\n\u003cp>They do not try to think or calculate on their own. Slowly, their study skills become worse.\u003c/p>\n\u003cp>他们不会自己动脑思考、计算，久而久之，学习能力会变差。\u003c/p>\n\u003ch2 id=\"h6\">6. What can teachers do to stop students from relying too much on AI?\u003c/h2>\n\u003cp>Teachers can take three simple steps.\u003c/p>\n\u003cp>老师可以采取三个简单办法。\u003c/p>\n\u003cp>First, ask students to write down their own ideas before using AI.\u003c/p>\n\u003cp>第一，要求学生先用自己的思路解题，再使用 AI。\u003c/p>\n\u003cp>Second, give more in-class exams where phones and AI tools are banned.\u003c/p>\n\u003cp>第二，多安排课堂测验，禁止携带手机和 AI 工具。\u003c/p>\n\u003cp>Third, teach students the right way to use AI, only as a helper, not a replacement.\u003c/p>\n\u003cp>第三，教会学生正确使用 AI，把它当作辅助工具，而不是替代品。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What are the advantages and disadvantages of AI?"},{"level":2,"id":"h2","text":"2. Do you think people today should learn about AI technology?"},{"level":2,"id":"h3","text":"3. Should children learn to use AI?"},{"level":2,"id":"h4","text":"4. How can AI help in our lives?"},{"level":2,"id":"h5","text":"5. Do you think students are overly reliant on AI?"},{"level":2,"id":"h6","text":"6. What can teachers do to stop students from relying too much on AI?"}],"text":"What are the advantages and disadvantages of AI? Do you think people today should learn about AI technology? Should children learn to use AI? How can AI help in our lives? Do you think students are overly reliant on AI? What can teachers do to stop students from relying too much on AI? 1. What are the advantages and disadvantages of AI? Advantages first. AI saves us lots of time. It can handle difficult tasks quickly, like processing data. But it also has downsides. Some people depend on it too much. They lose their own thinking skills. Also, some jobs may disappear because of AI. 首先说优点。人工智能能帮我们节省大量时间。它可以快速完成复杂工作，比如计算数据。 但它也有弊端。有些人过度依赖人工智能，丧失独立思考能力。而且部分工作岗位会因为人工智能消失。 2. Do you think people today should learn about AI technology? Yes, I believe everyone needs to know basic AI. 我认为所有人都应该了解基础人工智能知识。 Now AI is everywhere in daily life. If you understand it, you can use it better. 如今人工智能遍布日常生活。懂它，你才能更好地使用。 If you ignore it, you will fall behind others in study and work. 如果完全不了解，学习和工作上都会落后于人。 3. Should children learn to use AI? Yes, but they need strict rules. 可以，但必须有严格使用规范。 AI helps kids search for study materials quickly. It makes learning fun. 人工智能能帮孩子快速查找学习资料，让学习变得有趣。 However, kids cannot use it all the time. They may copy answers and stop thinking by themselves. 但孩子不能一直使用，他们会直接抄答案，不再独立思考。 4. How can AI help in our lives? AI helps us in many daily areas. 人工智能在生活很多方面都能帮到我们。 First, it helps students finish homework and look up information. 第一，帮助学生写作业、查阅知识。 Second, smart AI tools make housework easier, like robot cleaners. 第二，智能 AI 工具简化家务，比如扫地机器人。 Third, self-driving AI makes travelling safer and more convenient. 第三，自动驾驶 AI 让出行更安全、便捷。 5. Do you think students are overly reliant on AI? Yes, lots of students rely on AI too much these days. 没错，现在很多学生过度依赖人工智能。 When they meet difficult problems, they open AI tools at once. 一遇到难题，他们立刻打开 AI 工具。 They do not try to think or calculate on their own. Slowly, their study skills become worse. 他们不会自己动脑思考、计算，久而久之，学习能力会变差。 6. What can teachers do to stop students from relying too much on AI? Teachers can take three simple steps. 老师可以采取三个简单办法。 First, ask students to write down their own ideas before using AI. 第一，要求学生先用自己的思路解题，再使用 AI。 Second, give more in-class exams where phones and AI tools are banned. 第二，多安排课堂测验，禁止携带手机和 AI 工具。 Third, teach students the right way to use AI, only as a helper, not a replacement. 第三，教会学生正确使用 AI，把它当作辅助工具，而不是替代品。"},{"id":"a-w-t1-vocab","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/0.1-小作文通识积累.md","title":"小作文通识积累","html":"\u003ch2 id=\"h1\">花销\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>搭配 &amp; 例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>spending\u003c/strong>\u003c/td>\n\u003ctd>支出、花费【最百搭，首选】\u003c/td>\n\u003ctd>泛指各类开销（政府、家庭、个人）\u003c/td>\n\u003ctd>government spending；spending on education\u003cbr>\u003cbr>Spending on healthcare rose.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cost\u003c/strong>\u003c/td>\n\u003ctd>成本；花费\u003c/td>\n\u003ctd>侧重购买、运营成本；也可指开销\u003c/td>\n\u003ctd>the cost of transport\u003cbr>\u003cbr>⚠️ 区分：cost 多指 “成本”，不一定是预算支出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>expense\u003c/strong>\u003c/td>\n\u003ctd>开销、费用（常用复数 expenses）\u003c/td>\n\u003ctd>日常 / 业务开销，单数少用\u003c/td>\n\u003ctd>living expenses（生活费）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h2\">钱\u003c/h2>\n\u003cp>英镑是 \u003cmark>pounds!!!\u003c/mark>\u003c/p>\n\u003ch2 id=\"h3\">份额、比例\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>适用图表\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>proportion\u003c/strong>\u003c/td>\n\u003ctd>强调\u003cstrong>部分相对于整体\u003c/strong>，不一定带 % 数字\u003c/td>\n\u003ctd>饼图、占比柱状图\u003c/td>\n\u003ctd>the proportion of people who cycled\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>share\u003c/strong>\u003c/td>\n\u003ctd>侧重\u003cstrong>分配、占有份额\u003c/strong>（市场、资源、人群）\u003c/td>\n\u003ctd>饼图、市场类图表\u003c/td>\n\u003ctd>the share of renewable energy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>percentage\u003c/strong>\u003c/td>\n\u003ctd>强调\u003cstrong>数字单位\u003c/strong>，后面常跟具体数值\u003c/td>\n\u003ctd>带 % 刻度图表\u003c/td>\n\u003ctd>the percentage of students working part-time\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">在某段时间内\u003c/h2>\n\u003cp>over the 20-year period from 2000 to 2020\u003c/p>\n\u003ch2 id=\"h5\">比例\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比例\u003c/th>\n\u003cth>en\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>34%\u003c/td>\n\u003ctd>roughly a third\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49%\u003c/td>\n\u003ctd>nearly half of\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52%\u003c/td>\n\u003ctd>just over half of\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>\u003cstrong>单个百分比不能决定排名。\u003c/strong> 1% 只有当图上其它数据都比它大时才是 \u003ccode>the smallest share\u003c/code>，90% 同理——排名必须看完整张图再写，不能拿数字直接套词。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h6\">排名（看全图，不看单个数字）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>用法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>held the smallest share\u003c/td>\n\u003ctd>占比最小\u003c/td>\n\u003ctd>确认它是全图最低再用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rank the highest\u003c/td>\n\u003ctd>排最高\u003c/td>\n\u003ctd>要能和其它数据比出高低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the second highest amount of\u003c/td>\n\u003ctd>第二高\u003c/td>\n\u003ctd>用之前先确认确实排第二\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>was ranked fifth with …\u003c/td>\n\u003ctd>排第五，数值是……\u003c/td>\n\u003ctd>图上能数出位次再用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the five highest ranking countries\u003c/td>\n\u003ctd>排名最高的五个国家\u003c/td>\n\u003ctd>只用于确实能排序的图\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>one half\u003c/td>\n\u003ctd>1/2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one third / a third\u003c/td>\n\u003ctd>1/3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>two thirds\u003c/td>\n\u003ctd>2/3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one quarter / a quarter\u003c/td>\n\u003ctd>1/4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>three quarters\u003c/td>\n\u003ctd>3/4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one fifth / a fifth\u003c/td>\n\u003ctd>1/5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one sixth\u003c/td>\n\u003ctd>1/6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one tenth / a tenth\u003c/td>\n\u003ctd>1/10\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">区域\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>核心释义\u003c/th>\n\u003cth>适用场景 &amp; 注意事项\u003c/th>\n\u003cth>雅思地图题例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Area\u003c/td>\n\u003ctd>区域\u003c/td>\n\u003ctd>万能首选，室内、户外功能区通用，容错率最高\u003c/td>\n\u003ctd>A seating area will be built in the western part.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Space\u003c/td>\n\u003ctd>空间\u003c/td>\n\u003ctd>侧重人为划分出的空地，更适合描述建筑内部布局\u003c/td>\n\u003ctd>The new kitchen occupies a small space on the left.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Section\u003c/td>\n\u003ctd>片区；区块\u003c/td>\n\u003ctd>适合整块场地分割成多个大块区域\u003c/td>\n\u003ctd>The eastern section will be turned into a garden.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h8\">因为，由于\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>难度\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>due to\u003c/td>\n\u003ctd>基础\u003c/td>\n\u003ctd>通用，写作最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>because of\u003c/td>\n\u003ctd>基础\u003c/td>\n\u003ctd>口语 + 写作，不建议主体段高频堆砌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on account of\u003c/td>\n\u003ctd>中档\u003c/td>\n\u003ctd>正式，替换 due to 避免重复\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h9\">阻挡\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>搭配示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>obstruction\u003c/td>\n\u003ctd>实体遮挡：建筑、光线、视野\u003c/td>\n\u003ctd>due to the obstruction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>barrier\u003c/td>\n\u003ctd>屏障、隔离障碍（公路、围墙）\u003c/td>\n\u003ctd>as a result of the barrier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be obstructed by\u003c/td>\n\u003ctd>被…… 堵住 / 阻挡\u003c/td>\n\u003ctd>Sunlight is obstructed by buildings.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h10\">剩余的\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>the rest of\u003c/td>\n\u003ctd>通用\u003c/td>\n\u003ctd>The rest of respondents prefer small houses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>the remaining\u003c/mark> + 名词\u003c/td>\n\u003ctd>图表描述最优\u003c/td>\n\u003ctd>The remaining participants choose public transport.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h11\">表示，说明\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>state\u003c/mark>\u003c/td>\n\u003ctd>正式书面，图表首选，意为\u003cstrong>陈述、表示\u003c/strong>\u003c/td>\n\u003ctd>Most respondents state that they face heavy financial pressure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>claim\u003c/td>\n\u003ctd>声称（中性，注意：不适合确信事实）\u003c/td>\n\u003ctd>Some respondents claim they cannot afford city flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mention\u003c/td>\n\u003ctd>提及、谈到（适合次要观点）\u003c/td>\n\u003ctd>A few respondents mention the fast pace of urban life.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h12\">受访者，调查对象\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>适用场景\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>respondents\u003c/td>\n\u003ctd>问卷、柱状图、饼图自带调查数据\u003c/td>\n\u003ctd>40% of respondents prefer high-rise flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>participants\u003c/td>\n\u003ctd>访谈、线下调研、活动问卷\u003c/td>\n\u003ctd>Most participants agreed to build more apartments.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interviewees\u003c/td>\n\u003ctd>面对面采访类图表数据\u003c/td>\n\u003ctd>The interviewees complained about high living costs.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h13\">工作\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>适用提示\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>job\u003c/td>\n\u003ctd>工作（可数）\u003c/td>\n\u003ctd>基础词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>occupation\u003c/mark>\u003c/td>\n\u003ctd>职业（书面正式，写作优先）\u003c/td>\n\u003ctd>occupation = 个人从事的职业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>career\u003c/td>\n\u003ctd>职业生涯；事业\u003c/td>\n\u003ctd>侧重长期发展\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h14\">大约\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>roughly\u003c/td>\n\u003ctd>大约；大致\u003c/td>\n\u003ctd>侧重粗略估算，非常适合小作文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>approximately\u003c/td>\n\u003ctd>大约\u003c/td>\n\u003ctd>偏正式，学术感更强\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nearly\u003c/td>\n\u003ctd>将近，接近（还没到该数值）\u003c/td>\n\u003ctd>nearly 13 million\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>almost\u003c/td>\n\u003ctd>几乎，将近 ≈ nearly\u003c/td>\n\u003ctd>almost 20 million\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h15\">略高，略低\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>just over\u003c/td>\n\u003ctd>略高于，稍稍超过\u003c/td>\n\u003ctd>just over 6 million\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just under\u003c/td>\n\u003ctd>略低于，不足\u003c/td>\n\u003ctd>just under 2 million\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h16\">数量词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>the number of + 复数名词\u003c/td>\n\u003ctd>…… 的数量（基础款）\u003c/td>\n\u003ctd>the number of jobs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the figure for + 对象\u003c/td>\n\u003ctd>对应…… 的数据（首选替换，强烈推荐）\u003c/td>\n\u003ctd>the figure for manufacturing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>levels of …\u003c/td>\n\u003ctd>…… 规模 / 数量（偏书面）\u003c/td>\n\u003ctd>levels of employment in retail\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h17\">是/达到\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句参考（套用你的题目）\u003c/th>\
