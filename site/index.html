03ctr>\n\u003ctd>折线图\u003c/td>\n\u003ctd>横轴是年份或月份，图里是几条线\u003c/td>\n\u003ctd>整体升降趋势；谁最高、谁超过了谁\u003c/td>\n\u003ctd>按线分组（涨的一组、跌的一组），或按时间段\u003c/td>\n\u003ctd>过去的数据用一般过去时；预测用 is expected to\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-line\">1-4 折线图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>柱状图\u003c/td>\n\u003ctd>柱子比较几个类别，可能有几个年份\u003c/td>\n\u003ctd>最高和最低的类别；最大的差距或变化\u003c/td>\n\u003ctd>按类别分组，或按年份分\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-bar\">1-5 柱状图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>饼图\u003c/td>\n\u003ctd>每张饼是 100%，常见两张或三张对比\u003c/td>\n\u003ctd>占比最大的部分；变化最大的部分\u003c/td>\n\u003ctd>一张饼一段，或按“变大的 / 变小的”分\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-pie\">1-6 饼图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表格\u003c/td>\n\u003ctd>行和列的数字\u003c/td>\n\u003ctd>最高、最低；有年份时写整体趋势\u003c/td>\n\u003ctd>按行或按列分组，挑有对比的数据\u003c/td>\n\u003ctd>看图里的时间\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-table\">1-7 表格\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>混合图\u003c/td>\n\u003ctd>两种图放在一起\u003c/td>\n\u003ctd>每张图各写一个最明显的特征\u003c/td>\n\u003ctd>一张图一段\u003c/td>\n\u003ctd>两张图分别看\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-mixed\">1-1 混合图\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图\u003c/td>\n\u003ctd>同一个地方两个或三个时间的样子\u003c/td>\n\u003ctd>整体变化方向（更城市化、设施变多）和保持不变的部分\u003c/td>\n\u003ctd>按区域（北边 / 南边），或按时间段\u003c/td>\n\u003ctd>一般过去时被动；未来规划用 will be\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-map\">1-2 地图（结构补充）\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程图\u003c/td>\n\u003ctd>带箭头的步骤图\u003c/td>\n\u003ctd>一共几个阶段，从哪开始、到哪结束；是循环还是直线\u003c/td>\n\u003ctd>前一半步骤一段，后一半一段\u003c/td>\n\u003ctd>一般现在时，人造流程多用被动\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t1-process\">1-3 流程图（结构补充）\u003c/a>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>地图和流程图的词汇见原作者笔记：\u003ca href=\"#/page/a-w-map\">地图\u003c/a>、\u003ca href=\"#/page/a-w-process\">流程图\u003c/a>。数字、比例、趋势词见 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h4\">时态怎么选\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>图里的时间\u003c/th>\n\u003cth>用什么时态\u003c/th>\n\u003cth>例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>过去的年份（2000–2020）\u003c/td>\n\u003ctd>一般过去时\u003c/td>\n\u003ctd>The figure rose to 40% in 2020.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>没有时间（流程图、某些表格）\u003c/td>\n\u003ctd>一般现在时\u003c/td>\n\u003ctd>The leaves are collected and dried.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来的预测（2030、2050）\u003c/td>\n\u003ctd>will / is expected to / is predicted to\u003c/td>\n\u003ctd>The number is expected to reach 5 million by 2050.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图：从过去变到现在\u003c/td>\n\u003ctd>现在完成时\u003c/td>\n\u003ctd>A new car park has been built.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地图：过去两个年份之间\u003c/td>\n\u003ctd>一般过去时，到某年为止用过去完成时\u003c/td>\n\u003ctd>By 2010, the farm had been replaced by houses.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">开头改写常用替换\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原词\u003c/th>\n\u003cth>替换\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>shows\u003c/td>\n\u003ctd>illustrates / compares / gives information about / presents\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the number of people\u003c/td>\n\u003ctd>the figure for / how many people\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the percentage of\u003c/td>\n\u003ctd>the proportion of / the share of\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from 2000 to 2020\u003c/td>\n\u003ctd>between 2000 and 2020 / over a 20-year period\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in three countries\u003c/td>\n\u003ctd>in Country A, Country B and Country C（直接写出名字）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">常见丢分点\u003c/h2>\n\u003cul>\n\u003cli>没有概述段，或者概述里堆数字。\u003c/li>\n\u003cli>每个数字都写进去，没有挑重点，也没有比较。\u003c/li>\n\u003cli>写了原因或评价，比如 because people became richer。\u003c/li>\n\u003cli>饼图没有总数时写成 the number of，应该用 the proportion of。\u003c/li>\n\u003cli>单位写错或漏写（%、million、tonnes）。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"基本要求"},{"level":2,"id":"h2","text":"通用四段结构"},{"level":2,"id":"h3","text":"七种图怎么认、怎么写"},{"level":2,"id":"h4","text":"时态怎么选"},{"level":2,"id":"h5","text":"开头改写常用替换"},{"level":2,"id":"h6","text":"常见丢分点"}],"text":"基本要求 至少 150 词，建议 20 分钟以内写完，留出 40 分钟给大作文。 只描述图里有的信息，不写原因，不写个人观点。 必须有概述段（Overview）。没有概述，Task Achievement 很难过 5 分。 通用四段结构 段落 写什么 句数 开头 改写题目：图表类型 + 内容 + 地点 + 时间 1 句 概述 最明显的 2 个特征，不写具体数字 2 句 细节 1 第一组数据：最高、最低、起点、终点、转折 3–4 句 细节 2 第二组数据，并和第一组对比 3–4 句 七种图怎么认、怎么写 题型 怎么认 概述写什么 细节怎么分段 时态 模板 折线图 横轴是年份或月份，图里是几条线 整体升降趋势；谁最高、谁超过了谁 按线分组（涨的一组、跌的一组），或按时间段 过去的数据用一般过去时；预测用 is expected to 1-4 折线图 柱状图 柱子比较几个类别，可能有几个年份 最高和最低的类别；最大的差距或变化 按类别分组，或按年份分 看图里的时间 1-5 柱状图 饼图 每张饼是 100%，常见两张或三张对比 占比最大的部分；变化最大的部分 一张饼一段，或按“变大的 / 变小的”分 看图里的时间 1-6 饼图 表格 行和列的数字 最高、最低；有年份时写整体趋势 按行或按列分组，挑有对比的数据 看图里的时间 1-7 表格 混合图 两种图放在一起 每张图各写一个最明显的特征 一张图一段 两张图分别看 1-1 混合图 地图 同一个地方两个或三个时间的样子 整体变化方向（更城市化、设施变多）和保持不变的部分 按区域（北边 / 南边），或按时间段 一般过去时被动；未来规划用 will be 1-2 地图（结构补充） 流程图 带箭头的步骤图 一共几个阶段，从哪开始、到哪结束；是循环还是直线 前一半步骤一段，后一半一段 一般现在时，人造流程多用被动 1-3 流程图（结构补充） 地图和流程图的词汇见原作者笔记：地图、流程图。数字、比例、趋势词见 小作文通识积累。 时态怎么选 图里的时间 用什么时态 例子 过去的年份（2000–2020） 一般过去时 The figure rose to 40% in 2020. 没有时间（流程图、某些表格） 一般现在时 The leaves are collected and dried. 未来的预测（2030、2050） will / is expected to / is predicted to The number is expected to reach 5 million by 2050. 地图：从过去变到现在 现在完成时 A new car park has been built. 地图：过去两个年份之间 一般过去时，到某年为止用过去完成时 By 2010, the farm had been replaced by houses. 开头改写常用替换 原词 替换 shows illustrates / compares / gives information about / presents the number of people the figure for / how many people the percentage of the proportion of / the share of from 2000 to 2020 between 2000 and 2020 / over a 20-year period in three countries in Country A, Country B and Country C（直接写出名字） 常见丢分点 没有概述段，或者概述里堆数字。 每个数字都写进去，没有挑重点，也没有比较。 写了原因或评价，比如 because people became richer。 饼图没有总数时写成 the number of，应该用 the proportion of。 单位写错或漏写（%、million、tonnes）。"},{"id":"s-t1-mixed","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-1 混合图.md","title":"1-1 混合图（Mixed charts）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目给出两个或以上的图表，常见组合有柱状图 + 饼图、折线图 + 表格、地图 + 表格等。题干一般是 \u003cem>The charts show…\u003c/em> 或 \u003cem>The bar chart and the pie chart compare…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明两张图的主题和时间范围\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>每张图各写 1 个最显著的特征，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一张图的关键数据（最高、最低、变化）\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二张图的关键数据，并与第一张图对比或呼应\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两段细节可以“按图分”（段 1 写图 1，段 2 写图 2），也可以“按主题分”（每段写一个主题，两张图都引用）。按图分更稳，不容易漏内容。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The bar chart and the pie chart illustrate … in …\u003c/td>\n\u003ctd>柱状图和饼图展示了……（在……方面）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two charts provide information about … from … to …\u003c/td>\n\u003ctd>两张图提供了……从……到……的信息\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, …\u003c/td>\n\u003ctd>总的来说……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>While the first chart shows …, the second chart reveals …\u003c/td>\n\u003ctd>第一张图显示……，而第二张图显示……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable feature is that …\u003c/td>\n\u003ctd>最明显的特征是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">连接两张图的句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>…, whereas / while …\u003c/td>\n\u003ctd>……，而……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, … / By comparison, …\u003c/td>\n\u003ctd>相比之下……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Similarly, … / A similar pattern can be seen in …\u003c/td>\n\u003ctd>同样地…… / 类似的情况也出现在……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Turning to …, …\u003c/td>\n\u003ctd>说到……，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The former …, while the latter …\u003c/td>\n\u003ctd>前者……，后者……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>用 the former / the latter 时要确认对应关系。如果前后两个对象容易混淆，直接写出名词更安全。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>\u003cstrong>概述\u003c/strong>：Overall, tourism revenue grew steadily over the period, whereas hotels remained the largest category of spending.\u003cbr>\u003cstrong>译\u003c/strong>：总体而言，旅游收入稳步增长，而酒店始终是占比最大的消费类别。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>两张图都要写到，不要只写一张。\u003c/li>\n\u003cli>概述段不写具体数字。\u003c/li>\n\u003cli>描述过去的数据用一般过去时；“The chart shows” 这类引入句用一般现在时。\u003c/li>\n\u003cli>每段尽量只讲清楚一张图，减少指代混乱。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"连接两张图的句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 题目给出两个或以上的图表，常见组合有柱状图 + 饼图、折线图 + 表格、地图 + 表格等。题干一般是 The charts show… 或 The bar chart and the pie chart compare… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明两张图的主题和时间范围 1–2 句 概述 每张图各写 1 个最显著的特征，不写具体数字 2–3 句 细节 1 第一张图的关键数据（最高、最低、变化） 4–5 句 细节 2 第二张图的关键数据，并与第一张图对比或呼应 4–5 句 两段细节可以“按图分”（段 1 写图 1，段 2 写图 2），也可以“按主题分”（每段写一个主题，两张图都引用）。按图分更稳，不容易漏内容。 开头模板 英文 中文 The bar chart and the pie chart illustrate … in … 柱状图和饼图展示了……（在……方面） The two charts provide information about … from … to … 两张图提供了……从……到……的信息 概述模板 英文 中文 Overall, … 总的来说…… While the first chart shows …, the second chart reveals … 第一张图显示……，而第二张图显示…… The most noticeable feature is that … 最明显的特征是…… 连接两张图的句型 英文 中文 …, whereas / while … ……，而…… In contrast, … / By comparison, … 相比之下…… Similarly, … / A similar pattern can be seen in … 同样地…… / 类似的情况也出现在…… Turning to …, … 说到……，…… The former …, while the latter … 前者……，后者…… 用 the former / the latter 时要确认对应关系。如果前后两个对象容易混淆，直接写出名词更安全。 示例（自拟数据） 概述：Overall, tourism revenue grew steadily over the period, whereas hotels remained the largest category of spending. 译：总体而言，旅游收入稳步增长，而酒店始终是占比最大的消费类别。 注意 两张图都要写到，不要只写一张。 概述段不写具体数字。 描述过去的数据用一般过去时；“The chart shows” 这类引入句用一般现在时。 每段尽量只讲清楚一张图，减少指代混乱。"},{"id":"s-t1-map","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-2 地图（结构补充）.md","title":"1-2 地图：结构与句型（补充）","html":"\u003cp>原作者的 \u003ca href=\"#/page/a-w-map\">地图笔记\u003c/a> 整理了地点、方位和变化的词汇。这篇补段落结构和整句模板，两篇一起用。\u003c/p>\n\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>同一个地方在两个或三个时间的样子，比如 \u003cem>The maps show a town in 1990 and today\u003c/em>，或者现在的样子和未来的规划 \u003cem>The plans show the proposed changes to the park\u003c/em>。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：什么地方、哪两个时间\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>整体变化方向 + 没变的部分\u003c/td>\n\u003ctd>2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>一个区域（或前一个时间段）的变化\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>另一个区域（或后一个时间段）的变化\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两张图按区域分段（北边一段、南边一段）；三张图按时间段分（1990–2005 一段、2005–今天一段）。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The maps illustrate the changes that took place in [地点] between [年份] and [年份].\u003c/td>\n\u003ctd>两幅地图展示了[地点]在[年份]到[年份]之间发生的变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two maps compare [地点] in [年份] with the same area today.\u003c/td>\n\u003ctd>两幅地图比较了[地点]在[年份]和今天的样子。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The plans show the proposed changes to [地点].\u003c/td>\n\u003ctd>平面图展示了[地点]的规划改动。（未来规划题）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, the area became much more developed, with more houses and better facilities.\u003c/td>\n\u003ctd>总体来看，这个地区开发程度高了很多，房屋更多，设施更好。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, the [地点] was transformed from a farming area into a residential area.\u003c/td>\n\u003ctd>总体来看，[地点]从农业区变成了住宅区。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable change is that the [A] was replaced by [B].\u003c/td>\n\u003ctd>最明显的变化是 A 被 B 取代了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>By contrast, the [C] remained unchanged.\u003c/td>\n\u003ctd>相比之下，C 保持不变。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">描述变化的句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>拆除 + 新建\u003c/td>\n\u003ctd>The factory in the north was demolished to make way for a shopping centre.\u003c/td>\n\u003ctd>北边的工厂被拆掉，腾出地方建了购物中心。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取代\u003c/td>\n\u003ctd>By 2020, the farmland had been replaced by a housing estate.\u003c/td>\n\u003ctd>到 2020 年，农田已被住宅区取代。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新建\u003c/td>\n\u003ctd>A new car park was built next to the hospital.\u003c/td>\n\u003ctd>医院旁边新建了一个停车场。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改造\u003c/td>\n\u003ctd>The old school was converted into a museum.\u003c/td>\n\u003ctd>旧学校被改造成了博物馆。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩建\u003c/td>\n\u003ctd>The main road was extended to the south.\u003c/td>\n\u003ctd>主路向南延伸了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变小\u003c/td>\n\u003ctd>The forest shrank to about half its original size.\u003c/td>\n\u003ctd>森林缩小到原来的一半左右。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不变\u003c/td>\n\u003ctd>The river and the bridge remained unchanged.\u003c/td>\n\u003ctd>河和桥保持不变。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>位置\u003c/td>\n\u003ctd>To the east of the lake, a hotel was constructed.\u003c/td>\n\u003ctd>湖的东边建了一家酒店。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">时态\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>时态\u003c/th>\n\u003cth>例子\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>过去两个年份\u003c/td>\n\u003ctd>一般过去时被动\u003c/td>\n\u003ctd>A school was built in 1995.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>到某个过去年份为止\u003c/td>\n\u003ctd>过去完成时\u003c/td>\n\u003ctd>By 2010, the farm had been turned into a park.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>从过去到现在\u003c/td>\n\u003ctd>现在完成时\u003c/td>\n\u003ctd>Several houses have been added.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来规划\u003c/td>\n\u003ctd>will be / is going to be\u003c/td>\n\u003ctd>The car park will be moved to the west.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：The maps show a seaside village in 1990 and today.\u003c/p>\n\u003cp>\u003cstrong>开头 + 概述\u003c/strong>：The maps illustrate how a seaside village changed between 1990 and today. Overall, the village became a tourist destination, with many new facilities built along the coast, while the fishing harbour remained unchanged.\u003cbr>\u003cstrong>译\u003c/strong>：两幅地图展示了一个海边村庄从 1990 年到今天的变化。总体来看，这个村庄变成了旅游地，沿海新建了许多设施，而渔港保持不变。\u003c/p>\n\u003cp>\u003cstrong>细节\u003c/strong>：In 1990, the area to the east of the main road was covered by farmland. Today, this land has been replaced by a hotel and a large car park. In addition, the small shops in the village centre were demolished to make way for a shopping street.\u003cbr>\u003cstrong>译\u003c/strong>：1990 年，主路东边是农田。如今，这片地已被一家酒店和一个大停车场取代。此外，村中心的小商店被拆掉，建成了一条商业街。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>地图题一般没有数字，重点写“什么变成了什么、在哪里”。\u003c/li>\n\u003cli>每句话最好带一个方位词，让读者知道变化发生在哪儿。\u003c/li>\n\u003cli>不写原因，比如不要写 because more tourists came。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"描述变化的句型"},{"level":2,"id":"h6","text":"时态"},{"level":2,"id":"h7","text":"示例（自拟）"},{"level":2,"id":"h8","text":"注意"}],"text":"原作者的 地图笔记 整理了地点、方位和变化的词汇。这篇补段落结构和整句模板，两篇一起用。 题型识别 同一个地方在两个或三个时间的样子，比如 The maps show a town in 1990 and today，或者现在的样子和未来的规划 The plans show the proposed changes to the park。 段落结构 段落 写什么 句数 开头 改写题目：什么地方、哪两个时间 1 句 概述 整体变化方向 + 没变的部分 2 句 细节 1 一个区域（或前一个时间段）的变化 3–4 句 细节 2 另一个区域（或后一个时间段）的变化 3–4 句 两张图按区域分段（北边一段、南边一段）；三张图按时间段分（1990–2005 一段、2005–今天一段）。 开头模板 英文 中文 The maps illustrate the changes that took place in [地点] between [年份] and [年份]. 两幅地图展示了[地点]在[年份]到[年份]之间发生的变化。 The two maps compare [地点] in [年份] with the same area today. 两幅地图比较了[地点]在[年份]和今天的样子。 The plans show the proposed changes to [地点]. 平面图展示了[地点]的规划改动。（未来规划题） 概述模板 英文 中文 Overall, the area became much more developed, with more houses and better facilities. 总体来看，这个地区开发程度高了很多，房屋更多，设施更好。 Overall, the [地点] was transformed from a farming area into a residential area. 总体来看，[地点]从农业区变成了住宅区。 The most noticeable change is that the [A] was replaced by [B]. 最明显的变化是 A 被 B 取代了。 By contrast, the [C] remained unchanged. 相比之下，C 保持不变。 描述变化的句型 变化 英文 中文 拆除 + 新建 The factory in the north was demolished to make way for a shopping centre. 北边的工厂被拆掉，腾出地方建了购物中心。 取代 By 2020, the farmland had been replaced by a housing estate. 到 2020 年，农田已被住宅区取代。 新建 A new car park was built next to the hospital. 医院旁边新建了一个停车场。 改造 The old school was converted into a museum. 旧学校被改造成了博物馆。 扩建 The main road was extended to the south. 主路向南延伸了。 变小 The forest shrank to about half its original size. 森林缩小到原来的一半左右。 不变 The river and the bridge remained unchanged. 河和桥保持不变。 位置 To the east of the lake, a hotel was constructed. 湖的东边建了一家酒店。 时态 情况 时态 例子 过去两个年份 一般过去时被动 A school was built in 1995. 到某个过去年份为止 过去完成时 By 2010, the farm had been turned into a park. 从过去到现在 现在完成时 Several houses have been added. 未来规划 will be / is going to be The car park will be moved to the west. 示例（自拟） 题目：The maps show a seaside village in 1990 and today. 开头 + 概述：The maps illustrate how a seaside village changed between 1990 and today. Overall, the village became a tourist destination, with many new facilities built along the coast, while the fishing harbour remained unchanged. 译：两幅地图展示了一个海边村庄从 1990 年到今天的变化。总体来看，这个村庄变成了旅游地，沿海新建了许多设施，而渔港保持不变。 细节：In 1990, the area to the east of the main road was covered by farmland. Today, this land has been replaced by a hotel and a large car park. In addition, the small shops in the village centre were demolished to make way for a shopping street. 译：1990 年，主路东边是农田。如今，这片地已被一家酒店和一个大停车场取代。此外，村中心的小商店被拆掉，建成了一条商业街。 注意 地图题一般没有数字，重点写“什么变成了什么、在哪里”。 每句话最好带一个方位词，让读者知道变化发生在哪儿。 不写原因，比如不要写 because more tourists came。"},{"id":"s-t1-process","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-3 流程图（结构补充）.md","title":"1-3 流程图：结构与句型（补充）","html":"\u003cp>原作者的 \u003ca href=\"#/page/a-w-process\">流程图笔记\u003c/a> 有开头、概述和顺序词。这篇补完整结构、两类流程的写法和整句模板。原作者特别标注过：流程图不要写 will be。\u003c/p>\n\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类型\u003c/th>\n\u003cth>例子\u003c/th>\n\u003cth>写法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>人造流程（生产、加工）\u003c/td>\n\u003ctd>茶叶、巧克力、碳酸饮料的生产\u003c/td>\n\u003ctd>多用一般现在时被动：\u003cem>is collected, is heated\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然流程（生命周期、水循环）\u003c/td>\n\u003ctd>青蛙、蝴蝶的生命周期\u003c/td>\n\u003ctd>多用一般现在时主动：\u003cem>the eggs hatch\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构 / 原理图\u003c/td>\n\u003ctd>太阳能板的结构、隧道对比\u003c/td>\n\u003ctd>先写由哪几部分组成，再写怎么工作\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>写什么\u003c/th>\n\u003cth>句数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目：什么东西、从什么原料做成\u003c/td>\n\u003ctd>1 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>一共几个阶段；从哪开始、到哪结束；是直线还是循环\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>前一半步骤\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>后一半步骤\u003c/td>\n\u003ctd>3–4 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The diagram illustrates how [产品] is made from [原料].\u003c/td>\n\u003ctd>流程图展示了[产品]是如何由[原料]制成的。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The diagram shows the process by which [产品] is produced.\u003c/td>\n\u003ctd>流程图展示了生产[产品]的过程。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The diagram illustrates the life cycle of a [动物].\u003c/td>\n\u003ctd>图表展示了[动物]的生命周期。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, there are seven stages in the process, beginning with the collection of [原料] and ending with the delivery of [产品].\u003c/td>\n\u003ctd>总体来看，整个过程有七个阶段，从收集原料开始，到配送成品结束。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, it is a linear process which mainly involves heating, mixing and packaging.\u003c/td>\n\u003ctd>总体来看，这是一个直线流程，主要包括加热、混合和包装。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, the life cycle of the [动物] consists of four main stages and repeats itself.\u003c/td>\n\u003ctd>总体来看，这种动物的生命周期包括四个主要阶段，并循环往复。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">顺序词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>英文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第一步\u003c/td>\n\u003ctd>First, / To begin with, / At the first stage,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中间\u003c/td>\n\u003ctd>Next, / Then, / After that, / Following this, / At the next stage,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前一步完成后\u003c/td>\n\u003ctd>Once the [原料] has been washed, it is ...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同时\u003c/td>\n\u003ctd>At the same time, / Meanwhile,\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最后\u003c/td>\n\u003ctd>Finally, / At the final stage, / Eventually,\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First, the fruit is collected and transported to a factory.\u003c/td>\n\u003ctd>首先，水果被采摘并运到工厂。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is then washed and cut into small pieces.\u003c/td>\n\u003ctd>然后被清洗并切成小块。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After that, the pieces are put into a machine, where they are heated to 80°C.\u003c/td>\n\u003ctd>之后，这些小块被放进机器，加热到 80 摄氏度。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Once the juice has been filtered, it is poured into bottles.\u003c/td>\n\u003ctd>果汁过滤后被灌进瓶子。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Finally, the bottles are packed and delivered to supermarkets.\u003c/td>\n\u003ctd>最后，瓶子被打包并运到超市。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>（自然流程）The eggs hatch into tadpoles, which then develop back legs.\u003c/td>\n\u003ctd>卵孵化成蝌蚪，蝌蚪随后长出后腿。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>（自然流程）It takes about 12 weeks for a tadpole to become a young frog.\u003c/td>\n\u003ctd>蝌蚪大约需要 12 周长成小青蛙。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：The diagram shows how bottled orange juice is produced.\u003c/p>\n\u003cp>\u003cstrong>开头 + 概述\u003c/strong>：The diagram illustrates how bottled orange juice is made from fresh oranges. Overall, there are six stages in the process, beginning with picking the fruit and ending with delivering the juice to shops.\u003cbr>\u003cstrong>译\u003c/strong>：流程图展示了瓶装橙汁是如何由新鲜橙子制成的。总体来看，整个过程有六个阶段，从采摘水果开始，到把果汁送到商店结束。\u003c/p>\n\u003cp>\u003cstrong>细节 1\u003c/strong>：First, ripe oranges are picked by hand and transported to a factory by truck. They are then washed in cold water and cut in half.\u003cbr>\u003cstrong>译\u003c/strong>：首先，成熟的橙子被人工采摘，用卡车运到工厂。接着用冷水清洗，并切成两半。\u003c/p>\n\u003cp>\u003cstrong>细节 2\u003c/strong>：At the next stage, the juice is squeezed out and heated to kill bacteria. Once it has cooled down, it is poured into plastic bottles. Finally, the bottles are labelled and delivered to supermarkets.\u003cbr>\u003cstrong>译\u003c/strong>：下一阶段，果汁被榨出并加热杀菌。冷却之后，果汁被灌进塑料瓶。最后，瓶子贴上标签，运往超市。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>每个步骤都要写到，不能跳；但每步一句就够。\u003c/li>\n\u003cli>人造流程主语是“东西”，所以用被动：\u003cem>is heated\u003c/em>，不写 \u003cem>workers heat\u003c/em>。\u003c/li>\n\u003cli>用一般现在时，不用 will be（这是原作者标出的高频错误）。\u003c/li>\n\u003cli>图里标出的机器名、温度、时间可以直接写进去，显得具体。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"顺序词"},{"level":2,"id":"h6","text":"句型模板"},{"level":2,"id":"h7","text":"示例（自拟）"},{"level":2,"id":"h8","text":"注意"}],"text":"原作者的 流程图笔记 有开头、概述和顺序词。这篇补完整结构、两类流程的写法和整句模板。原作者特别标注过：流程图不要写 will be。 题型识别 类型 例子 写法 人造流程（生产、加工） 茶叶、巧克力、碳酸饮料的生产 多用一般现在时被动：is collected, is heated 自然流程（生命周期、水循环） 青蛙、蝴蝶的生命周期 多用一般现在时主动：the eggs hatch 结构 / 原理图 太阳能板的结构、隧道对比 先写由哪几部分组成，再写怎么工作 段落结构 段落 写什么 句数 开头 改写题目：什么东西、从什么原料做成 1 句 概述 一共几个阶段；从哪开始、到哪结束；是直线还是循环 1–2 句 细节 1 前一半步骤 3–4 句 细节 2 后一半步骤 3–4 句 开头模板 英文 中文 The diagram illustrates how [产品] is made from [原料]. 流程图展示了[产品]是如何由[原料]制成的。 The diagram shows the process by which [产品] is produced. 流程图展示了生产[产品]的过程。 The diagram illustrates the life cycle of a [动物]. 图表展示了[动物]的生命周期。 概述模板 英文 中文 Overall, there are seven stages in the process, beginning with the collection of [原料] and ending with the delivery of [产品]. 总体来看，整个过程有七个阶段，从收集原料开始，到配送成品结束。 Overall, it is a linear process which mainly involves heating, mixing and packaging. 总体来看，这是一个直线流程，主要包括加热、混合和包装。 Overall, the life cycle of the [动物] consists of four main stages and repeats itself. 总体来看，这种动物的生命周期包括四个主要阶段，并循环往复。 顺序词 位置 英文 第一步 First, / To begin with, / At the first stage, 中间 Next, / Then, / After that, / Following this, / At the next stage, 前一步完成后 Once the [原料] has been washed, it is ... 同时 At the same time, / Meanwhile, 最后 Finally, / At the final stage, / Eventually, 句型模板 英文 中文 First, the fruit is collected and transported to a factory. 首先，水果被采摘并运到工厂。 It is then washed and cut into small pieces. 然后被清洗并切成小块。 After that, the pieces are put into a machine, where they are heated to 80°C. 之后，这些小块被放进机器，加热到 80 摄氏度。 Once the juice has been filtered, it is poured into bottles. 果汁过滤后被灌进瓶子。 Finally, the bottles are packed and delivered to supermarkets. 最后，瓶子被打包并运到超市。 （自然流程）The eggs hatch into tadpoles, which then develop back legs. 卵孵化成蝌蚪，蝌蚪随后长出后腿。 （自然流程）It takes about 12 weeks for a tadpole to become a young frog. 蝌蚪大约需要 12 周长成小青蛙。 示例（自拟） 题目：The diagram shows how bottled orange juice is produced. 开头 + 概述：The diagram illustrates how bottled orange juice is made from fresh oranges. Overall, there are six stages in the process, beginning with picking the fruit and ending with delivering the juice to shops. 译：流程图展示了瓶装橙汁是如何由新鲜橙子制成的。总体来看，整个过程有六个阶段，从采摘水果开始，到把果汁送到商店结束。 细节 1：First, ripe oranges are picked by hand and transported to a factory by truck. They are then washed in cold water and cut in half. 译：首先，成熟的橙子被人工采摘，用卡车运到工厂。接着用冷水清洗，并切成两半。 细节 2：At the next stage, the juice is squeezed out and heated to kill bacteria. Once it has cooled down, it is poured into plastic bottles. Finally, the bottles are labelled and delivered to supermarkets. 译：下一阶段，果汁被榨出并加热杀菌。冷却之后，果汁被灌进塑料瓶。最后，瓶子贴上标签，运往超市。 注意 每个步骤都要写到，不能跳；但每步一句就够。 人造流程主语是“东西”，所以用被动：is heated，不写 workers heat。 用一般现在时，不用 will be（这是原作者标出的高频错误）。 图里标出的机器名、温度、时间可以直接写进去，显得具体。"},{"id":"s-t1-line","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-4 折线图.md","title":"1-4 折线图（Line graph）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>横轴通常是时间（年份、月份），纵轴是数值（人数、金额、比例）。一般有 1–4 条线。题干常见 \u003cem>The line graph shows…\u003c/em> 或 \u003cem>The graph compares…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明图表内容和时间段\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写整体趋势（谁上升、谁下降、谁波动），不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一条线：起点、峰值、谷底、终点\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二条线（或其他线）的变化，并与第一条线对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The line graph illustrates how … changed between … and …\u003c/td>\n\u003ctd>折线图展示了……在……到……之间的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The graph compares the trends in … over a period of … years.\u003c/td>\n\u003ctd>该图比较了……在……年间的变化趋势。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … showed an upward trend, while … declined.\u003c/td>\n\u003ctd>总体来看，……呈上升趋势，而……下降了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overall, … fluctuated over the period, but ended higher than it started.\u003c/td>\n\u003ctd>总体来看，……有波动，但最终高于起点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most striking feature is that … overtook … in …\u003c/td>\n\u003ctd>最突出的特征是……在……年超过了……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">趋势词汇\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>趋势\u003c/th>\n\u003cth>动词（过去式）\u003c/th>\n\u003cth>名词\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>上升\u003c/td>\n\u003ctd>rise (rose) / increase (increased) / grow (grew)\u003c/td>\n\u003ctd>a rise / an increase / growth\u003c/td>\n\u003ctd>上升、增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下降\u003c/td>\n\u003ctd>fall (fell) / decrease / decline / drop\u003c/td>\n\u003ctd>a fall / a decrease / a decline\u003c/td>\n\u003ctd>下降\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>波动\u003c/td>\n\u003ctd>fluctuate / go up and down\u003c/td>\n\u003ctd>fluctuations\u003c/td>\n\u003ctd>波动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保持平稳\u003c/td>\n\u003ctd>remain stable / level off / stay constant\u003c/td>\n\u003ctd>stability\u003c/td>\n\u003ctd>保持稳定、趋于平稳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>达到峰值\u003c/td>\n\u003ctd>peak (peaked) / reach a peak\u003c/td>\n\u003ctd>a peak\u003c/td>\n\u003ctd>达到顶点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跌到谷底\u003c/td>\n\u003ctd>hit a low / bottom out\u003c/td>\n\u003ctd>a low / the bottom\u003c/td>\n\u003ctd>跌至最低点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超过\u003c/td>\n\u003ctd>overtake / surpass\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>超过\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>表示幅度的副词（sharply、steadily、gradually、slightly 等）可以参考原作者的 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h6\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X rose from A in 2000 to B in 2010.\u003c/td>\n\u003ctd>X 从 2000 年的 A 上升到 2010 年的 B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X peaked at B in 2010 before falling to C by 2020.\u003c/td>\n\u003ctd>X 在 2010 年达到峰值 B，之后下降到 2020 年的 C。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The figure for X stood at A in 2000 and reached B by 2020.\u003c/td>\n\u003ctd>X 在 2000 年为 A，到 2020 年达到 B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X remained stable at around A between 2005 and 2015.\u003c/td>\n\u003ctd>2005 至 2015 年间，X 基本稳定在 A 左右。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X overtook Y in 2008 and continued to grow.\u003c/td>\n\u003ctd>X 在 2008 年超过 Y，并持续增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The gap between X and Y narrowed over the period.\u003c/td>\n\u003ctd>这段时间内，X 和 Y 的差距缩小了。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟数据）\u003c/h2>\n\u003cp>The number of visitors to the museum rose from about 2 million in 2000 to a peak of 5 million in 2010. After that, it fell back to around 4 million by 2020.\u003cbr>\u003cstrong>译\u003c/strong>：博物馆的参观人数从 2000 年的约 200 万增长到 2010 年 500 万的峰值，之后回落到 2020 年的约 400 万。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>写清楚起点、峰值、谷底和终点，不必逐年复述所有数据。\u003c/li>\n\u003cli>描述过去的数据用一般过去时。\u003c/li>\n\u003cli>数字前可以加 about、roughly、nearly、just over 等词，避免每个数字都机械地写准确值。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"趋势词汇"},{"level":2,"id":"h6","text":"句型模板"},{"level":2,"id":"h7","text":"示例（自拟数据）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 横轴通常是时间（年份、月份），纵轴是数值（人数、金额、比例）。一般有 1–4 条线。题干常见 The line graph shows… 或 The graph compares… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明图表内容和时间段 1–2 句 概述 写整体趋势（谁上升、谁下降、谁波动），不写具体数字 2–3 句 细节 1 第一条线：起点、峰值、谷底、终点 4–5 句 细节 2 第二条线（或其他线）的变化，并与第一条线对比 4–5 句 开头模板 英文 中文 The line graph illustrates how … changed between … and … 折线图展示了……在……到……之间的变化 The graph compares the trends in … over a period of … years. 该图比较了……在……年间的变化趋势。 概述模板 英文 中文 Overall, … showed an upward trend, while … declined. 总体来看，……呈上升趋势，而……下降了。 Overall, … fluctuated over the period, but ended higher than it started. 总体来看，……有波动，但最终高于起点。 The most striking feature is that … overtook … in … 最突出的特征是……在……年超过了…… 趋势词汇 趋势 动词（过去式） 名词 中文 上升 rise (rose) / increase (increased) / grow (grew) a rise / an increase / growth 上升、增长 下降 fall (fell) / decrease / decline / drop a fall / a decrease / a decline 下降 波动 fluctuate / go up and down fluctuations 波动 保持平稳 remain stable / level off / stay constant stability 保持稳定、趋于平稳 达到峰值 peak (peaked) / reach a peak a peak 达到顶点 跌到谷底 hit a low / bottom out a low / the bottom 跌至最低点 超过 overtake / surpass — 超过 表示幅度的副词（sharply、steadily、gradually、slightly 等）可以参考原作者的 小作文通识积累。 句型模板 英文 中文 X rose from A in 2000 to B in 2010. X 从 2000 年的 A 上升到 2010 年的 B。 X peaked at B in 2010 before falling to C by 2020. X 在 2010 年达到峰值 B，之后下降到 2020 年的 C。 The figure for X stood at A in 2000 and reached B by 2020. X 在 2000 年为 A，到 2020 年达到 B。 X remained stable at around A between 2005 and 2015. 2005 至 2015 年间，X 基本稳定在 A 左右。 X overtook Y in 2008 and continued to grow. X 在 2008 年超过 Y，并持续增长。 The gap between X and Y narrowed over the period. 这段时间内，X 和 Y 的差距缩小了。 示例（自拟数据） The number of visitors to the museum rose from about 2 million in 2000 to a peak of 5 million in 2010. After that, it fell back to around 4 million by 2020. 译：博物馆的参观人数从 2000 年的约 200 万增长到 2010 年 500 万的峰值，之后回落到 2020 年的约 400 万。 注意 写清楚起点、峰值、谷底和终点，不必逐年复述所有数据。 描述过去的数据用一般过去时。 数字前可以加 about、roughly、nearly、just over 等词，避免每个数字都机械地写准确值。"},{"id":"s-t1-bar","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-5 柱状图.md","title":"1-5 柱状图（Bar chart）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>用柱子的高矮或长短，比较不同类别（如不同国家、职业、年龄段）的数据，或者比较同一类别在不同年份的数据。题干常见 \u003cem>The bar chart shows…\u003c/em> 或 \u003cem>The chart compares…\u003c/em>\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明比较的对象和时间\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写最高、最低、最大差异，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组数据（或前几个类别）的关键数字\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>其余数据，并和前一组对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The bar chart compares … across …\u003c/td>\n\u003ctd>柱状图比较了……在…… 方面的情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The bar chart shows the number of … in … between … and …\u003c/td>\n\u003ctd>柱状图展示了……在……到……年间的数量\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … was the most popular … in all … years, while … was the least popular.\u003c/td>\n\u003ctd>总体来看，……在所有年份都是最受欢迎的，而……最不受欢迎。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant difference is between … and ….\u003c/td>\n\u003ctd>最显著的差异在……和……之间。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">比较句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A was the most / least popular option, accounting for …\u003c/td>\n\u003ctd>A 是最受欢迎 / 最不受欢迎的选项，占……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A was nearly / roughly twice as high as B.\u003c/td>\n\u003ctd>A 大约是 B 的两倍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A outnumbered B by …\u003c/td>\n\u003ctd>A 比 B 多……（人 / 个）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A ranked first, followed by B and C.\u003c/td>\n\u003ctd>A 排第一，其次是 B 和 C。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The gap between A and B widened / narrowed.\u003c/td>\n\u003ctd>A 和 B 的差距扩大 / 缩小了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, B … / By comparison, C …\u003c/td>\n\u003ctd>相比之下，B…… / 与之相比，C……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Both A and B …\u003c/td>\n\u003ctd>A 和 B 都……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">倍数与分数表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>twice as many / twice the number of\u003c/td>\n\u003ctd>两倍（多）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>three times as many\u003c/td>\n\u003ctd>三倍（多）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>half / a third / a quarter (of)\u003c/td>\n\u003ctd>一半 / 三分之一 / 四分之一\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the number of students who chose science was the highest in all three years, whereas arts was consistently the least popular subject.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，三年中选择理科的学生人数始终最多，而选择文科的一直最少。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>柱状图的数据通常较多，挑最高、最低、变化最大、最有对比性的写，不必全部列出。\u003c/li>\n\u003cli>多组数据时，先写整体趋势，再按组别展开。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"比较句型"},{"level":2,"id":"h6","text":"倍数与分数表达"},{"level":2,"id":"h7","text":"示例（自拟数据）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 用柱子的高矮或长短，比较不同类别（如不同国家、职业、年龄段）的数据，或者比较同一类别在不同年份的数据。题干常见 The bar chart shows… 或 The chart compares… 段落结构 段落 要做的事 句数建议 开头 改写题目，说明比较的对象和时间 1–2 句 概述 写最高、最低、最大差异，不写具体数字 2–3 句 细节 1 第一组数据（或前几个类别）的关键数字 4–5 句 细节 2 其余数据，并和前一组对比 4–5 句 开头模板 英文 中文 The bar chart compares … across … 柱状图比较了……在…… 方面的情况 The bar chart shows the number of … in … between … and … 柱状图展示了……在……到……年间的数量 概述模板 英文 中文 Overall, … was the most popular … in all … years, while … was the least popular. 总体来看，……在所有年份都是最受欢迎的，而……最不受欢迎。 The most significant difference is between … and …. 最显著的差异在……和……之间。 比较句型 英文 中文 A was the most / least popular option, accounting for … A 是最受欢迎 / 最不受欢迎的选项，占…… A was nearly / roughly twice as high as B. A 大约是 B 的两倍。 A outnumbered B by … A 比 B 多……（人 / 个） A ranked first, followed by B and C. A 排第一，其次是 B 和 C。 The gap between A and B widened / narrowed. A 和 B 的差距扩大 / 缩小了。 In contrast, B … / By comparison, C … 相比之下，B…… / 与之相比，C…… Both A and B … A 和 B 都…… 倍数与分数表达 英文 中文 twice as many / twice the number of 两倍（多） three times as many 三倍（多） half / a third / a quarter (of) 一半 / 三分之一 / 四分之一 示例（自拟数据） Overall, the number of students who chose science was the highest in all three years, whereas arts was consistently the least popular subject. 译：总体来看，三年中选择理科的学生人数始终最多，而选择文科的一直最少。 注意 柱状图的数据通常较多，挑最高、最低、变化最大、最有对比性的写，不必全部列出。 多组数据时，先写整体趋势，再按组别展开。"},{"id":"s-t1-pie","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-6 饼图.md","title":"1-6 饼图（Pie chart）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>每个饼图代表整体的 100%，各个扇区是占比。常见的是两张饼图对比，比如两个年份、两个地区或两组人群。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明比较的内容和时间\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写占比最大、最小和最显著的变化\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一张饼图的主要占比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二张饼图的主要占比，并与第一张对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The pie charts compare the proportion of … in … and ….\u003c/td>\n\u003ctd>两张饼图比较了……在……和……中的占比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The two pie charts illustrate how the share of … changed between … and ….\u003c/td>\n\u003ctd>两张饼图展示了……的占比在……到……之间的变化。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … accounted for the largest share in both years.\u003c/td>\n\u003ctd>总体来看，……在两个年份中占比都最大。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most significant change is the rise in … from … to ….\u003c/td>\n\u003ctd>最显著的变化是……的占比从……上升到……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">占比句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X accounted for / made up nearly half of ….\u003c/td>\n\u003ctd>X 占近一半。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X accounted for a third / a quarter of ….\u003c/td>\n\u003ctd>X 占三分之一 / 四分之一。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X was the largest category, at …%.\u003c/td>\n\u003ctd>X 是占比最大的类别，为……%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Y held the smallest share.\u003c/td>\n\u003ctd>Y 的占比最小。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The remaining … / The rest of …\u003c/td>\n\u003ctd>其余的……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The proportion of X rose from … to ….\u003c/td>\n\u003ctd>X 的占比从……上升到……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In contrast, the share of Y fell to ….\u003c/td>\n\u003ctd>相比之下，Y 的占比下降到……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the most significant change was the rise in the share of online shopping, which increased from 15% to 40%, while the share of in-store shopping fell by more than half.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，最显著的变化是网购的占比从 15% 上升到 40%，而实体店消费的占比下降了一半以上。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>饼图只有比例，没有绝对数量。除非题目给出总数，不要写 \u003cem>the number of …\u003c/em>。\u003c/li>\n\u003cli>数据都是比例，写法要统一，percent 或 % 两者选一种即可。\u003c/li>\n\u003cli>分数和比例的表达（a third、nearly half、just over 等）可以参考原作者的 \u003ca href=\"#/page/a-w-t1-vocab\">小作文通识积累\u003c/a>。\u003c/li>\n\u003cli>两张饼图要做比较，写出变化和对比，不要各自孤立地描述。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"占比句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 每个饼图代表整体的 100%，各个扇区是占比。常见的是两张饼图对比，比如两个年份、两个地区或两组人群。 段落结构 段落 要做的事 句数建议 开头 改写题目，说明比较的内容和时间 1–2 句 概述 写占比最大、最小和最显著的变化 2–3 句 细节 1 第一张饼图的主要占比 4–5 句 细节 2 第二张饼图的主要占比，并与第一张对比 4–5 句 开头模板 英文 中文 The pie charts compare the proportion of … in … and …. 两张饼图比较了……在……和……中的占比。 The two pie charts illustrate how the share of … changed between … and …. 两张饼图展示了……的占比在……到……之间的变化。 概述模板 英文 中文 Overall, … accounted for the largest share in both years. 总体来看，……在两个年份中占比都最大。 The most significant change is the rise in … from … to …. 最显著的变化是……的占比从……上升到…… 占比句型 英文 中文 X accounted for / made up nearly half of …. X 占近一半。 X accounted for a third / a quarter of …. X 占三分之一 / 四分之一。 X was the largest category, at …%. X 是占比最大的类别，为……%。 Y held the smallest share. Y 的占比最小。 The remaining … / The rest of … 其余的…… The proportion of X rose from … to …. X 的占比从……上升到…… In contrast, the share of Y fell to …. 相比之下，Y 的占比下降到…… 示例（自拟数据） Overall, the most significant change was the rise in the share of online shopping, which increased from 15% to 40%, while the share of in-store shopping fell by more than half. 译：总体来看，最显著的变化是网购的占比从 15% 上升到 40%，而实体店消费的占比下降了一半以上。 注意 饼图只有比例，没有绝对数量。除非题目给出总数，不要写 the number of …。 数据都是比例，写法要统一，percent 或 % 两者选一种即可。 分数和比例的表达（a third、nearly half、just over 等）可以参考原作者的 小作文通识积累。 两张饼图要做比较，写出变化和对比，不要各自孤立地描述。"},{"id":"s-t1-table","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/1-7 表格.md","title":"1-7 表格（Table）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>由行和列组成的数据表，常见的是多个类别（国家、年份、性别、职业等）在多个指标上的数据对比。\u003c/p>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>要做的事\u003c/th>\n\u003cth>句数建议\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写题目，说明表格内容和范围\u003c/td>\n\u003ctd>1–2 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>概述\u003c/td>\n\u003ctd>写最高、最低和主要趋势，不写具体数字\u003c/td>\n\u003ctd>2–3 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 1\u003c/td>\n\u003ctd>第一组类别的关键数据\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>细节 2\u003c/td>\n\u003ctd>第二组类别的关键数据，并与第一组对比\u003c/td>\n\u003ctd>4–5 句\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The table compares / presents / illustrates … across ….\u003c/td>\n\u003ctd>表格比较 / 呈现了……在……方面的数据。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The table provides information on … in … from … to ….\u003c/td>\n\u003ctd>表格提供了……在……到……期间的信息。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">概述模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Overall, … recorded the highest figure for …, whereas … had the lowest.\u003c/td>\n\u003ctd>总体来看，……的数值最高，而……的数值最低。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most noticeable feature is that ….\u003c/td>\n\u003ctd>最明显的特征是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">数据句型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The highest figure was recorded for … (at …).\u003c/td>\n\u003ctd>……的数值最高，为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>… had the lowest figure, at ….\u003c/td>\n\u003ctd>……的数值最低，为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>… was much higher / lower than ….\u003c/td>\n\u003ctd>……远高于 / 低于……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The difference between A and B was ….\u003c/td>\n\u003ctd>A 和 B 之间的差距为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In terms of …, … was ….\u003c/td>\n\u003ctd>就……而言，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>By contrast, … / Whereas, …\u003c/td>\n\u003ctd>相比之下……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A total of …\u003c/td>\n\u003ctd>总计……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">示例（自拟数据）\u003c/h2>\n\u003cp>Overall, the table shows that the highest number of weekly working hours was recorded in Country A, whereas Country C had the lowest figure.\u003cbr>\u003cstrong>译\u003c/strong>：总体来看，表格显示 A 国的每周工作时长最长，而 C 国最短。\u003c/p>\n\u003ch2 id=\"h7\">注意\u003c/h2>\n\u003cul>\n\u003cli>不要把所有数字都搬进文章，挑最高、最低、最大差异和最有代表性的 2–3 组。\u003c/li>\n\u003cli>注意表格里的 total（总计、合计）行，不要误当成某一个类别。\u003c/li>\n\u003cli>单位（%、million、per cent 等）要统一，并读清楚表头的单位。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"概述模板"},{"level":2,"id":"h5","text":"数据句型"},{"level":2,"id":"h6","text":"示例（自拟数据）"},{"level":2,"id":"h7","text":"注意"}],"text":"题型识别 由行和列组成的数据表，常见的是多个类别（国家、年份、性别、职业等）在多个指标上的数据对比。 段落结构 段落 要做的事 句数建议 开头 改写题目，说明表格内容和范围 1–2 句 概述 写最高、最低和主要趋势，不写具体数字 2–3 句 细节 1 第一组类别的关键数据 4–5 句 细节 2 第二组类别的关键数据，并与第一组对比 4–5 句 开头模板 英文 中文 The table compares / presents / illustrates … across …. 表格比较 / 呈现了……在……方面的数据。 The table provides information on … in … from … to …. 表格提供了……在……到……期间的信息。 概述模板 英文 中文 Overall, … recorded the highest figure for …, whereas … had the lowest. 总体来看，……的数值最高，而……的数值最低。 The most noticeable feature is that …. 最明显的特征是…… 数据句型 英文 中文 The highest figure was recorded for … (at …). ……的数值最高，为…… … had the lowest figure, at …. ……的数值最低，为…… … was much higher / lower than …. ……远高于 / 低于…… The difference between A and B was …. A 和 B 之间的差距为…… In terms of …, … was …. 就……而言，…… By contrast, … / Whereas, … 相比之下…… A total of … 总计…… 示例（自拟数据） Overall, the table shows that the highest number of weekly working hours was recorded in Country A, whereas Country C had the lowest figure. 译：总体来看，表格显示 A 国的每周工作时长最长，而 C 国最短。 注意 不要把所有数字都搬进文章，挑最高、最低、最大差异和最有代表性的 2–3 组。 注意表格里的 total（总计、合计）行，不要误当成某一个类别。 单位（%、million、per cent 等）要统一，并读清楚表头的单位。"},{"id":"s-t2-overview","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-0 大作文总览.md","title":"2-0 大作文总览：题型速查","html":"\u003ch2 id=\"h1\">基本要求\u003c/h2>\n\u003cul>\n\u003cli>至少 250 词，建议 40 分钟：5 分钟审题列提纲，30 分钟写，5 分钟检查。\u003c/li>\n\u003cli>题目问了几个问题，就要分别回答几个问题。\u003c/li>\n\u003cli>要求表态的题，立场从开头到结尾保持一致。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">先看最后一句，判断题型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题型\u003c/th>\n\u003cth>题目最后一句长什么样\u003c/th>\n\u003cth>要回答什么\u003c/th>\n\u003cth>要不要表态\u003c/th>\n\u003cth>模板\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Agree or disagree\u003c/td>\n\u003ctd>To what extent do you agree or disagree? / Do you agree or disagree?\u003c/td>\n\u003ctd>同不同意这个说法\u003c/td>\n\u003ctd>要，开头就说清\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-opinion\">2-1 Agree or disagree\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discuss both views\u003c/td>\n\u003ctd>Discuss both views and give your own opinion.\u003c/td>\n\u003ctd>两种观点各是什么理由，你站哪边\u003c/td>\n\u003ctd>要，开头或结尾说清\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-discussion\">2-2 Discuss both views\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantages &amp; Disadvantages\u003c/td>\n\u003ctd>Do the advantages outweigh the disadvantages? / What are the advantages and disadvantages?\u003c/td>\n\u003ctd>好处、坏处，哪边更大\u003c/td>\n\u003ctd>outweigh 要；只问利弊可以不表态\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-advantages\">2-6 Advantages &amp; Disadvantages\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Positive or negative\u003c/td>\n\u003ctd>Is this a positive or negative development?\u003c/td>\n\u003ctd>这个趋势好不好\u003c/td>\n\u003ctd>要\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reasons / Problems &amp; Solutions\u003c/td>\n\u003ctd>What are the causes / problems? What can be done?\u003c/td>\n\u003ctd>原因或问题 + 解决办法\u003c/td>\n\u003ctd>不用\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-problem\">2-3 Reasons &amp; Solutions\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two-part questions\u003c/td>\n\u003ctd>两个不同的问句，比如 Why …? What effects …?\u003c/td>\n\u003ctd>两个问题分别回答\u003c/td>\n\u003ctd>看第二问\u003c/td>\n\u003ctd>\u003ca href=\"#/w/t2-twopart\">2-5 Two-part questions\u003c/a>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">混合题怎么拆\u003c/h2>\n\u003cp>近期真题里很多是两种题型拼在一起，按 2-5 的结构“一问一段”，每段借对应模板的句子。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>题目（近期真题）\u003c/th>\n\u003cth>第一问\u003c/th>\n\u003cth>第二问\u003c/th>\n\u003cth>怎么写\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>More fathers stay at home … What could be the reasons for this? Is it a positive or negative development?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>积极还是消极\u003c/td>\n\u003ctd>主体段 1 用 2-3 的原因句；主体段 2 用 2-4 的表态句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The scenery in places around the world seems similar … What are the causes? Do the advantages outweigh the disadvantages?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>利是否大于弊\u003c/td>\n\u003ctd>主体段 1 写原因；主体段 2 用 2-6 的“利大于弊”句\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ambition … How important is it for people who want to succeed? Is it a positive or negative characteristic?\u003c/td>\n\u003ctd>有多重要\u003c/td>\n\u003ctd>积极还是消极\u003c/td>\n\u003ctd>主体段 1 讲重要在哪；主体段 2 表态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People spend more time away from their families. Why? What effects does this have?\u003c/td>\n\u003ctd>原因\u003c/td>\n\u003ctd>影响\u003c/td>\n\u003ctd>主体段 1 原因；主体段 2 影响（对本人、对家人各一点）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">万能主体段公式\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>作用\u003c/th>\n\u003cth>句型\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第 1 句\u003c/td>\n\u003ctd>观点句，直接回答\u003c/td>\n\u003ctd>The main reason is that … / One major benefit is that …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 2 句\u003c/td>\n\u003ctd>解释为什么\u003c/td>\n\u003ctd>This is because … / Since …, …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 3 句\u003c/td>\n\u003ctd>举例\u003c/td>\n\u003ctd>For example, … / A good example is …\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 4 句\u003c/td>\n\u003ctd>回扣观点\u003c/td>\n\u003ctd>As a result, … / Therefore, …\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">四种具体展开方式（比空泛套话有用）\u003c/h2>\n\u003cp>主体段只有&quot;观点—解释—例子—结果&quot;这个骨架还不够，真正拉开差距的是\u003cstrong>你把哪一层解释清楚了\u003c/strong>。下面四种各选一种用，一段用一个就够。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>思考方式\u003c/th>\n\u003cth>可以用的句型\u003c/th>\n\u003cth>必须补清楚什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原因怎么产生结果\u003c/td>\n\u003ctd>This allows [人群] to [具体行动], which can [具体结果].\u003c/td>\n\u003ctd>\u003cstrong>谁\u003c/strong>因此能做什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有效性取决于条件\u003c/td>\n\u003ctd>However, its effectiveness depends on [具体条件].\u003c/td>\n\u003ctd>为什么缺少这个条件就难以有效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源投入存在取舍\u003c/td>\n\u003ctd>This may divert funding from [A] to [B].\u003c/td>\n\u003ctd>哪笔资金、为什么会影响 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>比较利弊的分量\u003c/td>\n\u003ctd>Although [具体代价], I believe [具体收益] is more significant because [比较理由].\u003c/td>\n\u003ctd>为什么收益比代价重要\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>示例\u003c/strong>（以&quot;免费供水&quot;为例）：把空泛的&quot;政府面临资源压力&quot;写成——\u003c/p>\n\u003cblockquote>\n\u003cp>Providing unlimited water free of charge could put pressure on public budgets. Water treatment and pipe maintenance require regular funding, so removing water charges would mean that these costs had to be covered through taxation or cuts elsewhere. For example, a council with a fixed budget might have less money available to repair ageing pipes. A more targeted approach would be to provide a basic allowance free of charge and charge for additional use, protecting essential access while retaining some revenue for maintenance.\u003c/p>\n\u003c/blockquote>\n\u003cp>它依次交代了：\u003cstrong>什么措施 → 为什么需要钱 → 钱从哪里来 → 可能影响什么 → 政策怎么调整\u003c/strong>。对应地，整篇立场也应写成&quot;支持有限保障、反对无限免费&quot;，而不是机械地写&quot;完全反对&quot;。\u003c/p>\n\u003ch3 id=\"h6\">别用预设结论的套话\u003c/h3>\n\u003cp>下面这些都可以是\u003cstrong>论点\u003c/strong>，但必须由题目和解释支撑，不能当默认填空：\u003c/p>\n\u003cul>\n\u003cli>坏处只是个别情况、可以解决\u003c/li>\n\u003cli>好处只是短暂的\u003c/li>\n\u003cli>对方只能处理表面问题\u003c/li>\n\u003cli>我的方案能解决根本原因\u003c/li>\n\u003c/ul>\n\u003cp>比如写留学，经济负担可能持续多年，不能一律叫 \u003ccode>temporary\u003c/code>；写技术，也不能默认它一定造成资源错配。\u003c/p>\n\u003ch2 id=\"h7\">常见丢分点\u003c/h2>\n\u003cul>\n\u003cli>两问只答了一问，或者两个问题混在一段里。\u003c/li>\n\u003cli>Discuss both views 只讨论双方，忘了写自己的观点。\u003c/li>\n\u003cli>outweigh 题写成“各有利弊”，没说哪边更大。\u003c/li>\n\u003cli>前面说同意，结论又说“取决于情况”，立场不一致。\u003c/li>\n\u003cli>看错题目对象。比如 \u003cem>Newspapers have a huge influence on young people&#39;s lives. Is it a positive or negative effect on society?\u003c/em> 题干讲年轻人，问的是对社会的影响，两头都要写到。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h8\">相关\u003c/h2>\n\u003cul>\n\u003cli>用词积累：\u003ca href=\"#/page/a-w-t2-vocab\">大作文通识积累\u003c/a>\u003c/li>\n\u003cli>写完以后让 AI 批改：\u003ca href=\"#/page/a-w-ai\">AI 批改提示词\u003c/a>\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"基本要求"},{"level":2,"id":"h2","text":"先看最后一句，判断题型"},{"level":2,"id":"h3","text":"混合题怎么拆"},{"level":2,"id":"h4","text":"万能主体段公式"},{"level":2,"id":"h5","text":"四种具体展开方式（比空泛套话有用）"},{"level":3,"id":"h6","text":"别用预设结论的套话"},{"level":2,"id":"h7","text":"常见丢分点"},{"level":2,"id":"h8","text":"相关"}],"text":"基本要求 至少 250 词，建议 40 分钟：5 分钟审题列提纲，30 分钟写，5 分钟检查。 题目问了几个问题，就要分别回答几个问题。 要求表态的题，立场从开头到结尾保持一致。 先看最后一句，判断题型 题型 题目最后一句长什么样 要回答什么 要不要表态 模板 Agree or disagree To what extent do you agree or disagree? / Do you agree or disagree? 同不同意这个说法 要，开头就说清 2-1 Agree or disagree Discuss both views Discuss both views and give your own opinion. 两种观点各是什么理由，你站哪边 要，开头或结尾说清 2-2 Discuss both views Advantages & Disadvantages Do the advantages outweigh the disadvantages? / What are the advantages and disadvantages? 好处、坏处，哪边更大 outweigh 要；只问利弊可以不表态 2-6 Advantages & Disadvantages Positive or negative Is this a positive or negative development? 这个趋势好不好 要 2-4 Positive & Negative Reasons / Problems & Solutions What are the causes / problems? What can be done? 原因或问题 + 解决办法 不用 2-3 Reasons & Solutions Two-part questions 两个不同的问句，比如 Why …? What effects …? 两个问题分别回答 看第二问 2-5 Two-part questions 混合题怎么拆 近期真题里很多是两种题型拼在一起，按 2-5 的结构“一问一段”，每段借对应模板的句子。 题目（近期真题） 第一问 第二问 怎么写 More fathers stay at home … What could be the reasons for this? Is it a positive or negative development? 原因 积极还是消极 主体段 1 用 2-3 的原因句；主体段 2 用 2-4 的表态句 The scenery in places around the world seems similar … What are the causes? Do the advantages outweigh the disadvantages? 原因 利是否大于弊 主体段 1 写原因；主体段 2 用 2-6 的“利大于弊”句 Ambition … How important is it for people who want to succeed? Is it a positive or negative characteristic? 有多重要 积极还是消极 主体段 1 讲重要在哪；主体段 2 表态 People spend more time away from their families. Why? What effects does this have? 原因 影响 主体段 1 原因；主体段 2 影响（对本人、对家人各一点） 万能主体段公式 位置 作用 句型 第 1 句 观点句，直接回答 The main reason is that … / One major benefit is that … 第 2 句 解释为什么 This is because … / Since …, … 第 3 句 举例 For example, … / A good example is … 第 4 句 回扣观点 As a result, … / Therefore, … 四种具体展开方式（比空泛套话有用） 主体段只有\"观点—解释—例子—结果\"这个骨架还不够，真正拉开差距的是你把哪一层解释清楚了。下面四种各选一种用，一段用一个就够。 思考方式 可以用的句型 必须补清楚什么 原因怎么产生结果 This allows [人群] to [具体行动], which can [具体结果]. 谁因此能做什么 有效性取决于条件 However, its effectiveness depends on [具体条件]. 为什么缺少这个条件就难以有效 资源投入存在取舍 This may divert funding from [A] to [B]. 哪笔资金、为什么会影响 A 比较利弊的分量 Although [具体代价], I believe [具体收益] is more significant because [比较理由]. 为什么收益比代价重要 示例（以\"免费供水\"为例）：把空泛的\"政府面临资源压力\"写成—— Providing unlimited water free of charge could put pressure on public budgets. Water treatment and pipe maintenance require regular funding, so removing water charges would mean that these costs had to be covered through taxation or cuts elsewhere. For example, a council with a fixed budget might have less money available to repair ageing pipes. A more targeted approach would be to provide a basic allowance free of charge and charge for additional use, protecting essential access while retaining some revenue for maintenance. 它依次交代了：什么措施 → 为什么需要钱 → 钱从哪里来 → 可能影响什么 → 政策怎么调整。对应地，整篇立场也应写成\"支持有限保障、反对无限免费\"，而不是机械地写\"完全反对\"。 别用预设结论的套话 下面这些都可以是论点，但必须由题目和解释支撑，不能当默认填空： 坏处只是个别情况、可以解决 好处只是短暂的 对方只能处理表面问题 我的方案能解决根本原因 比如写留学，经济负担可能持续多年，不能一律叫 temporary；写技术，也不能默认它一定造成资源错配。 常见丢分点 两问只答了一问，或者两个问题混在一段里。 Discuss both views 只讨论双方，忘了写自己的观点。 outweigh 题写成“各有利弊”，没说哪边更大。 前面说同意，结论又说“取决于情况”，立场不一致。 看错题目对象。比如 Newspapers have a huge influence on young people's lives. Is it a positive or negative effect on society? 题干讲年轻人，问的是对社会的影响，两头都要写到。 相关 用词积累：大作文通识积累 写完以后让 AI 批改：AI 批改提示词"},{"id":"s-t2-reasons","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-3 Reasons & Solutions.md","title":"2-3 Reasons & Solutions（原因 + 解决方法）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目问“为什么会这样”和“可以怎么解决”。典型问法：\u003c/p>\n\u003cul>\n\u003cli>What are the causes of … ? What solutions can be taken?\u003c/li>\n\u003cli>Why does … happen, and how can it be solved?\u003c/li>\n\u003cli>What problems does … cause, and what measures can be taken?\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h2\">结构选择\u003c/h2>\n\u003cp>两种常见写法，选一种即可：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>结构\u003c/th>\n\u003cth>主体段 1\u003c/th>\n\u003cth>主体段 2\u003c/th>\n\u003cth>适合\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A：分开写\u003c/td>\n\u003ctd>原因（2 个）\u003c/td>\n\u003ctd>解决办法（2 个）\u003c/td>\n\u003ctd>两个问题都很明确时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B：成对写\u003c/td>\n\u003ctd>原因 1 + 对应的解决办法\u003c/td>\n\u003ctd>原因 2 + 对应的解决办法\u003c/td>\n\u003ctd>原因和解决办法能一一对应时\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">开头模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>There is no doubt that … has become a serious problem in recent years.\u003c/td>\n\u003ctd>毫无疑问，……近年来已成为一个严重的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will examine the main causes of … and suggest some possible solutions.\u003c/td>\n\u003ctd>本文将分析……的主要原因，并提出一些可能的解决办法。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">原因模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The main reason for this is that ….\u003c/td>\n\u003ctd>主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One major cause is ….\u003c/td>\n\u003ctd>一个主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This is largely because ….\u003c/td>\n\u003ctd>这在很大程度上是因为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Another factor contributing to this is ….\u003c/td>\n\u003ctd>促成这一现象的另一个因素是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As a result, ….\u003c/td>\n\u003ctd>因此，……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h5\">解决模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The government should ….\u003c/td>\n\u003ctd>政府应该……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One effective measure is to ….\u003c/td>\n\u003ctd>一个有效的办法是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Individuals can ….\u003c/td>\n\u003ctd>个人可以……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is essential to ….\u003c/td>\n\u003ctd>必须……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Both … and … should work together to ….\u003c/td>\n\u003ctd>……和……应该共同努力，以……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">结论模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>In conclusion, … is mainly caused by … and can be solved by ….\u003c/td>\n\u003ctd>总之，……主要由……导致，可以通过……解决。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>To sum up, … should be addressed through ….\u003c/td>\n\u003ctd>总而言之，……应该通过……来解决。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">示例（自拟题目）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：Many young people spend too much time on their phones. What are the causes, and what solutions can be taken?\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：Nowadays, many young people spend a great deal of time on their phones, which has raised concern in society. This essay will examine the main causes of this habit and suggest some possible solutions.\u003cbr>\u003cstrong>译\u003c/strong>：如今，许多年轻人花大量时间玩手机，这引起了社会的关注。本文将分析这一习惯的主要原因，并提出一些可能的解决办法。\u003c/p>\n\u003cp>\u003cstrong>原因段\u003c/strong>：The main reason is that smartphones offer endless entertainment, such as short videos and games, which are designed to attract users&#39; attention. Another factor is that many young people feel lonely or stressed and turn to their phones for comfort. For example, after a long day at school, scrolling through social media may seem like the easiest way to relax.\u003cbr>\u003cstrong>译\u003c/strong>：主要原因是智能手机提供了无穷无尽的娱乐内容，比如短视频和游戏，它们本身就是为了吸引用户注意力而设计的。另一个因素是许多年轻人感到孤独或压力大，于是通过手机寻求安慰。例如，放学后刷社交媒体似乎是最轻松的放松方式。\u003c/p>\n\u003cp>\u003cstrong>解决段\u003c/strong>：To tackle this problem, schools and families should work together to set reasonable rules on screen time. In addition, young people can develop healthier habits, such as doing sports or reading books, to replace the time spent on their phones.\u003cbr>\u003cstrong>译\u003c/strong>：要解决这个问题，学校和家庭应该共同制定合理的屏幕使用时间规则。此外，年轻人可以培养更健康的习惯，比如运动或阅读，来替代玩手机的时间。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, excessive phone use among young people is mainly caused by entertainment design and emotional needs, and it can be reduced through clear rules and healthier alternatives.\u003cbr>\u003cstrong>译\u003c/strong>：总之，年轻人过度用手机主要源于娱乐设计和情感需求，可以通过明确的规则和更健康的替代活动来减少。\u003c/p>\n\u003ch2 id=\"h8\">注意\u003c/h2>\n\u003cul>\n\u003cli>每个原因和解决办法都要有解释（为什么、怎么做）和例子，只写一句话会显得单薄。\u003c/li>\n\u003cli>解决办法要具体、可执行，少用 “we should do more” 这类空话。\u003c/li>\n\u003cli>题目问原因时，段落里先给出原因，再展开说明。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"结构选择"},{"level":2,"id":"h3","text":"开头模板"},{"level":2,"id":"h4","text":"原因模板"},{"level":2,"id":"h5","text":"解决模板"},{"level":2,"id":"h6","text":"结论模板"},{"level":2,"id":"h7","text":"示例（自拟题目）"},{"level":2,"id":"h8","text":"注意"}],"text":"题型识别 题目问“为什么会这样”和“可以怎么解决”。典型问法： What are the causes of … ? What solutions can be taken? Why does … happen, and how can it be solved? What problems does … cause, and what measures can be taken? 结构选择 两种常见写法，选一种即可： 结构 主体段 1 主体段 2 适合 A：分开写 原因（2 个） 解决办法（2 个） 两个问题都很明确时 B：成对写 原因 1 + 对应的解决办法 原因 2 + 对应的解决办法 原因和解决办法能一一对应时 开头模板 英文 中文 There is no doubt that … has become a serious problem in recent years. 毫无疑问，……近年来已成为一个严重的问题。 This essay will examine the main causes of … and suggest some possible solutions. 本文将分析……的主要原因，并提出一些可能的解决办法。 原因模板 英文 中文 The main reason for this is that …. 主要原因是…… One major cause is …. 一个主要原因是…… This is largely because …. 这在很大程度上是因为…… Another factor contributing to this is …. 促成这一现象的另一个因素是…… As a result, …. 因此，…… 解决模板 英文 中文 The government should …. 政府应该…… One effective measure is to …. 一个有效的办法是…… Individuals can …. 个人可以…… It is essential to …. 必须…… Both … and … should work together to …. ……和……应该共同努力，以…… 结论模板 英文 中文 In conclusion, … is mainly caused by … and can be solved by …. 总之，……主要由……导致，可以通过……解决。 To sum up, … should be addressed through …. 总而言之，……应该通过……来解决。 示例（自拟题目） 题目：Many young people spend too much time on their phones. What are the causes, and what solutions can be taken? 开头：Nowadays, many young people spend a great deal of time on their phones, which has raised concern in society. This essay will examine the main causes of this habit and suggest some possible solutions. 译：如今，许多年轻人花大量时间玩手机，这引起了社会的关注。本文将分析这一习惯的主要原因，并提出一些可能的解决办法。 原因段：The main reason is that smartphones offer endless entertainment, such as short videos and games, which are designed to attract users' attention. Another factor is that many young people feel lonely or stressed and turn to their phones for comfort. For example, after a long day at school, scrolling through social media may seem like the easiest way to relax. 译：主要原因是智能手机提供了无穷无尽的娱乐内容，比如短视频和游戏，它们本身就是为了吸引用户注意力而设计的。另一个因素是许多年轻人感到孤独或压力大，于是通过手机寻求安慰。例如，放学后刷社交媒体似乎是最轻松的放松方式。 解决段：To tackle this problem, schools and families should work together to set reasonable rules on screen time. In addition, young people can develop healthier habits, such as doing sports or reading books, to replace the time spent on their phones. 译：要解决这个问题，学校和家庭应该共同制定合理的屏幕使用时间规则。此外，年轻人可以培养更健康的习惯，比如运动或阅读，来替代玩手机的时间。 结论：In conclusion, excessive phone use among young people is mainly caused by entertainment design and emotional needs, and it can be reduced through clear rules and healthier alternatives. 译：总之，年轻人过度用手机主要源于娱乐设计和情感需求，可以通过明确的规则和更健康的替代活动来减少。 注意 每个原因和解决办法都要有解释（为什么、怎么做）和例子，只写一句话会显得单薄。 解决办法要具体、可执行，少用 “we should do more” 这类空话。 题目问原因时，段落里先给出原因，再展开说明。"},{"id":"s-t2-twopart","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-5 Two-part questions.md","title":"2-5 双问题（Two-part questions）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cp>题目一次问两件事。常见组合：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组合\u003c/th>\n\u003cth>例子（自拟）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原因 + 影响\u003c/td>\n\u003ctd>Why do people move to big cities, and what effects does this have?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 解决\u003c/td>\n\u003ctd>见 \u003ca href=\"#/w/t2-problem\">2-3 Reasons &amp; Solutions\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 利弊\u003c/td>\n\u003ctd>第二问见 \u003ca href=\"#/w/t2-advantages\">2-6 Advantages &amp; Disadvantages\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因 + 积极还是消极\u003c/td>\n\u003ctd>第二问见 \u003ca href=\"#/w/t2-posneg\">2-4 Positive &amp; Negative\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现状 + 未来\u003c/td>\n\u003ctd>How has … changed in recent years, and how will it develop in the future?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同意与否 + 理由或建议\u003c/td>\n\u003ctd>Do you agree with …? What should be done about it?\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>两个问题都要答，而且要分开答。最常见的失误是只回答其中一个问题。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h2\">段落结构\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开头\u003c/td>\n\u003ctd>改写两个问题，说明你会分别回答\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 1\u003c/td>\n\u003ctd>回答第一个问题：观点 + 原因 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主体段 2\u003c/td>\n\u003ctd>回答第二个问题：观点 + 原因或做法 + 例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论\u003c/td>\n\u003ctd>分别总结两个问题的答案\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">句型模板\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>This question can be divided into two parts.\u003c/td>\n\u003ctd>这个问题可以分成两部分。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This essay will address both questions by ….\u003c/td>\n\u003ctd>本文将从……两个方面回答这两个问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regarding the first question, ….\u003c/td>\n\u003ctd>关于第一个问题，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>As for the second question, ….\u003c/td>\n\u003ctd>至于第二个问题，……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The first reason is that …, and the second is ….\u003c/td>\n\u003ctd>第一个原因是……，第二个是……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">示例（自拟题目）\u003c/h2>\n\u003cp>\u003cstrong>题目\u003c/strong>：Why do some people prefer living in the countryside, and what are the benefits of living there?\u003cbr>\u003cstrong>译\u003c/strong>：为什么有些人更喜欢住在农村？住在那里有哪些好处？\u003c/p>\n\u003cp>\u003cstrong>开头\u003c/strong>：People have different views on where to live. This essay will explain why some people prefer rural life, and then discuss the benefits of living in the countryside.\u003cbr>\u003cstrong>译\u003c/strong>：人们对居住地有不同的看法。本文将解释为什么有些人更喜欢乡村生活，然后讨论住在农村的好处。\u003c/p>\n\u003cp>\u003cstrong>主体段 1（第一问）\u003c/strong>：The main reason is that the countryside offers a quieter and less stressful lifestyle. Life there is usually less crowded, and people have more time to relax with their families. For example, many retired people move to rural areas to enjoy peaceful surroundings and fresh air.\u003cbr>\u003cstrong>译\u003c/strong>：主要原因是农村的生活更安静、压力更小。那里通常人少，人们有更多时间和家人一起放松。例如，许多退休人员搬到乡村，享受宁静的环境和新鲜空气。\u003c/p>\n\u003cp>\u003cstrong>主体段 2（第二问）\u003c/strong>：As for the benefits, rural areas tend to be more affordable, as housing and daily expenses are much lower than in cities. In addition, living close to nature allows residents to enjoy outdoor activities such as hiking and gardening, which can improve both physical and mental health.\u003cbr>\u003cstrong>译\u003c/strong>：至于好处，农村的住房和日常开销远低于城市，因此更加经济实惠。此外，靠近大自然让居民可以徒步、园艺等户外活动，有助于身心健康。\u003c/p>\n\u003cp>\u003cstrong>结论\u003c/strong>：In conclusion, the countryside appeals to people who want a calmer life, and its lower living costs and natural environment make it an attractive choice.\u003cbr>\u003cstrong>译\u003c/strong>：总之，农村吸引的是想要过平静生活的人，较低的生活成本和自然环境使它成为很有吸引力的选择。\u003c/p>\n\u003ch2 id=\"h5\">注意\u003c/h2>\n\u003cul>\n\u003cli>两个问题分两段回答，每段开头可以用 As for、Regarding 等词明确指向对应的问题。\u003c/li>\n\u003cli>如果两个问题都是“为什么”，可以拆成“原因 1 / 原因 2”来写，但仍要覆盖题目里的每一个部分。\u003c/li>\n\u003cli>不要只回答一个问题，也不要在同一段里混着回答两个问题。\u003c/li>\n\u003c/ul>\n","toc":[{"level":2,"id":"h1","text":"题型识别"},{"level":2,"id":"h2","text":"段落结构"},{"level":2,"id":"h3","text":"句型模板"},{"level":2,"id":"h4","text":"示例（自拟题目）"},{"level":2,"id":"h5","text":"注意"}],"text":"题型识别 题目一次问两件事。常见组合： 组合 例子（自拟） 原因 + 影响 Why do people move to big cities, and what effects does this have? 原因 + 解决 见 2-3 Reasons & Solutions 原因 + 利弊 第二问见 2-6 Advantages & Disadvantages 原因 + 积极还是消极 第二问见 2-4 Positive & Negative 现状 + 未来 How has … changed in recent years, and how will it develop in the future? 同意与否 + 理由或建议 Do you agree with …? What should be done about it? 两个问题都要答，而且要分开答。最常见的失误是只回答其中一个问题。 段落结构 段落 内容 开头 改写两个问题，说明你会分别回答 主体段 1 回答第一个问题：观点 + 原因 + 例子 主体段 2 回答第二个问题：观点 + 原因或做法 + 例子 结论 分别总结两个问题的答案 句型模板 英文 中文 This question can be divided into two parts. 这个问题可以分成两部分。 This essay will address both questions by …. 本文将从……两个方面回答这两个问题。 Regarding the first question, …. 关于第一个问题，…… As for the second question, …. 至于第二个问题，…… The first reason is that …, and the second is …. 第一个原因是……，第二个是…… 示例（自拟题目） 题目：Why do some people prefer living in the countryside, and what are the benefits of living there? 译：为什么有些人更喜欢住在农村？住在那里有哪些好处？ 开头：People have different views on where to live. This essay will explain why some people prefer rural life, and then discuss the benefits of living in the countryside. 译：人们对居住地有不同的看法。本文将解释为什么有些人更喜欢乡村生活，然后讨论住在农村的好处。 主体段 1（第一问）：The main reason is that the countryside offers a quieter and less stressful lifestyle. Life there is usually less crowded, and people have more time to relax with their families. For example, many retired people move to rural areas to enjoy peaceful surroundings and fresh air. 译：主要原因是农村的生活更安静、压力更小。那里通常人少，人们有更多时间和家人一起放松。例如，许多退休人员搬到乡村，享受宁静的环境和新鲜空气。 主体段 2（第二问）：As for the benefits, rural areas tend to be more affordable, as housing and daily expenses are much lower than in cities. In addition, living close to nature allows residents to enjoy outdoor activities such as hiking and gardening, which can improve both physical and mental health. 译：至于好处，农村的住房和日常开销远低于城市，因此更加经济实惠。此外，靠近大自然让居民可以徒步、园艺等户外活动，有助于身心健康。 结论：In conclusion, the countryside appeals to people who want a calmer life, and its lower living costs and natural environment make it an attractive choice. 译：总之，农村吸引的是想要过平静生活的人，较低的生活成本和自然环境使它成为很有吸引力的选择。 注意 两个问题分两段回答，每段开头可以用 As for、Regarding 等词明确指向对应的问题。 如果两个问题都是“为什么”，可以拆成“原因 1 / 原因 2”来写，但仍要覆盖题目里的每一个部分。 不要只回答一个问题，也不要在同一段里混着回答两个问题。"},{"id":"s-t2-adv","origin":"supplement","group":"supplement","file":"笔记/作文/做题技巧/2-6 Advantages & Disadvantages.md","title":"2-6 Advantages & Disadvantages（利弊题）","html":"\u003ch2 id=\"h1\">题型识别\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问法\u003c/th>\n\u003cth>要做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Do the advantages outweigh the disadvantages? / Do the benefits outweigh the drawbacks?\u003c/td>\n\u003ctd>必须表态：利大于弊，或弊大于利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What are the advantages and disa
