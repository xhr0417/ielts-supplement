to the Qinling Mountains\u003c/mark> on weekends.\u003cbr>The mountains \u003cmark>are not far away,\u003c/mark> \u003cmark>right to the south of the city.\u003c/mark> We often \u003cmark>went hiking there.\u003c/mark> Sadly, \u003cmark>we cannot do that any more\u003c/mark>, because \u003cmark>it’s no longer allowed\u003c/mark>, \u003cmark>in order to protect water sources.\u003c/mark>\u003c/p>\n\u003cp>从小我就很喜欢自驾出行。上小学的时候，父母每到周末都会开车带我去秦岭。\u003cbr>秦岭离市区不远，就在城市南边。我们经常去那儿爬山。可惜现在不能这么做了，为了保护水源，相关出行已经被禁止。\u003c/p>\n\u003ch2 id=\"h3\">3. What types of cars do you like?\u003c/h2>\n\u003cp>\u003cmark>I have a strong preference for electric cars\u003c/mark>, because they are \u003cmark>eco-friendly\u003c/mark>. They don&#39;t need to \u003cmark>fill up with petrol\u003c/mark> — you just need to \u003cmark>charge them.\u003c/mark> Besides, \u003cmark>they are equipped with an autonomous driving system.\u003c/mark>\u003cbr>I really hope I can \u003cmark>get my hands on a Tesla,\u003c/mark> but \u003cmark>it is far too expensive for me right now.\u003c/mark> Maybe I can buy one \u003cmark>when it becomes cheaper in the future.\u003c/mark>\u003c/p>\n\u003cp>我格外偏爱电动汽车，因为它们环保。电动汽车不需要加油，我只需要给车充电。此外，车辆配备了自动驾驶系统。\u003cbr>我特别希望能拥有一辆特斯拉，但目前对我来说太贵了。或许等它以后降价，我就能入手一台。\u003c/p>\n\u003ch2 id=\"h4\">4. Do you prefer to be a driver or a passenger?\u003c/h2>\n\u003cp>\u003cmark>I like both of them\u003c/mark>, actually. When I travel with friends, we usually \u003cmark>swap drivers at service stations\u003c/mark> every two hours. Especially \u003cmark>when driving on mountain roads\u003c/mark>, I really \u003cmark>enjoy the fun of driving.\u003c/mark>\u003c/p>\n\u003cp>其实两种我都喜欢。我和朋友出行时会轮流开车，一般每隔两小时就在服务区换司机。尤其是行驶在山路上的时候，我十分享受驾驶的乐趣。\u003c/p>\n\u003ch2 id=\"h5\">5. What do you usually do when there is a traffic jam?\u003c/h2>\n\u003cp>I usually \u003cmark>listen to podcasts about technology and AI.\u003c/mark> It \u003cmark>helps me stay sane\u003c/mark>. Sometimes I also \u003cmark>give my parents a call\u003c/mark> and \u003cmark>chat with them.\u003c/mark>\u003c/p>\n\u003cp>遇上堵车的时候，我常会收听科技和人工智能相关的播客，这能让我保持心态平稳。我也会给父母打电话闲聊几句。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you think car colours are important?"},{"level":2,"id":"h2","text":"2. Did you enjoy traveling by car when you were a kid?"},{"level":2,"id":"h3","text":"3. What types of cars do you like?"},{"level":2,"id":"h4","text":"4. Do you prefer to be a driver or a passenger?"},{"level":2,"id":"h5","text":"5. What do you usually do when there is a traffic jam?"}],"text":"Do you think car colours are important? Did you enjoy traveling by car when you were a kid? What types of cars do you like? Do you prefer to be a driver or a passenger? What do you usually do when there is a traffic jam? 英文短语 中文释义 picking a car colour can be a real headache 挑选汽车颜色实在令人头疼 stand out from the crowd 脱颖而出 play it safe 求稳，做出稳妥选择 go for black, white, or grey 选择黑色、白色或者灰色 reflect your personality 反映你的个性 travelling by car 乘车出游、自驾出行 drive me to the Qinling Mountains 开车带我去秦岭 are not far away 距离不远 right to the south of the city 就在城区南边 went hiking there 去那里爬山 cannot do that any more 再也不能这样做 it’s not allowed now 现在被禁止 protect water sources 保护水源 have a strong preference for electric cars 格外偏爱电动汽车 eco-friendly 环保的，环境友好的 fill it up with petrol 给车加油 charge the car 给车充电 be equipped with an autonomous driving system 配备自动驾驶系统 get my hands on a Tesla 入手 / 拥有一辆特斯拉 far too expensive for me right now 目前对我来说太贵 when it becomes cheaper in the future 等到未来降价之后 I like both of them 两种我都喜欢 swap drivers at service stations 在服务区轮换司机 when driving on mountain roads 行驶在山路上 enjoy the fun of driving 享受驾驶的乐趣 listen to podcasts about technology and AI 收听科技与人工智能类播客 helps me stay sane 让我保持心态平稳 give my parents a call 给父母打电话 chat with them 和他们闲聊 1. Do you think car colours are important? Honestly, picking a car colour can be a real headache, especially when you want to stand out from the crowd. Most people just play it safe and go for black, white, or grey, but I think the colour actually reflects your personality. 说实话，选汽车颜色真的挺头疼的，特别是当你想要在人群中脱颖而出的时候。大多数人都喜欢求稳，选黑色、白色或者灰色，但我觉得颜色其实能反映你的个性。 2. Did you enjoy traveling by car when you were a kid? I have always been fascinated by travelling by car since I was a kid. When I was in primary school, my parents would drive me to the Qinling Mountains on weekends. The mountains are not far away, right to the south of the city. We often went hiking there. Sadly, we cannot do that any more, because it’s no longer allowed, in order to protect water sources. 从小我就很喜欢自驾出行。上小学的时候，父母每到周末都会开车带我去秦岭。 秦岭离市区不远，就在城市南边。我们经常去那儿爬山。可惜现在不能这么做了，为了保护水源，相关出行已经被禁止。 3. What types of cars do you like? I have a strong preference for electric cars, because they are eco-friendly. They don't need to fill up with petrol — you just need to charge them. Besides, they are equipped with an autonomous driving system. I really hope I can get my hands on a Tesla, but it is far too expensive for me right now. Maybe I can buy one when it becomes cheaper in the future. 我格外偏爱电动汽车，因为它们环保。电动汽车不需要加油，我只需要给车充电。此外，车辆配备了自动驾驶系统。 我特别希望能拥有一辆特斯拉，但目前对我来说太贵了。或许等它以后降价，我就能入手一台。 4. Do you prefer to be a driver or a passenger? I like both of them, actually. When I travel with friends, we usually swap drivers at service stations every two hours. Especially when driving on mountain roads, I really enjoy the fun of driving. 其实两种我都喜欢。我和朋友出行时会轮流开车，一般每隔两小时就在服务区换司机。尤其是行驶在山路上的时候，我十分享受驾驶的乐趣。 5. What do you usually do when there is a traffic jam? I usually listen to podcasts about technology and AI. It helps me stay sane. Sometimes I also give my parents a call and chat with them. 遇上堵车的时候，我常会收听科技和人工智能相关的播客，这能让我保持心态平稳。我也会给父母打电话闲聊几句。"},{"id":"a-p1-websites","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/3-websites.md","title":"Websites","html":"\u003cul>\n\u003cli>What kinds of websites do you often visit?\u003c/li>\n\u003cli>What is your favourite website?\u003c/li>\n\u003cli>Are there any changes to the websites you often visit?\u003c/li>\n\u003cli>What kinds of websites are popular in your country?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Scrolling through social media\u003c/td>\n\u003ctd>浏览社交媒体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily routine\u003c/td>\n\u003ctd>日常作息，日常习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I live on Bilibili, YouTube and WeChat\u003c/td>\n\u003ctd>离不开 B 站、油管和微信\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go to GitHub almost every day\u003c/td>\n\u003ctd>几乎每天访问 GitHub\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>view some codes\u003c/td>\n\u003ctd>查阅代码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>share some projects\u003c/td>\n\u003ctd>分享一些技术项目\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>has to be\u003c/td>\n\u003ctd>当属，一定是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>video-sharing platform\u003c/td>\n\u003ctd>视频分享平台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enjoy documentaries and movies\u003c/td>\n\u003ctd>喜欢看纪录片和电影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I&#39;ve watched a movie about Mars\u003c/td>\n\u003ctd>我看过一部关于火星的影片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learn more about astronomy\u003c/td>\n\u003ctd>学习更多天文学相关知识\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Several changes have taken place\u003c/td>\n\u003ctd>发生了不少变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>visited websites for fun\u003c/td>\n\u003ctd>上网只是为了消遣娱乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend more time on\u003c/td>\n\u003ctd>花更多时间在……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gain knowledge and learn different skills\u003c/td>\n\u003ctd>积累知识、学习各类技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep improving myself\u003c/td>\n\u003ctd>持续提升自我\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A wide range of\u003c/td>\n\u003ctd>多种多样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>social media platforms\u003c/td>\n\u003ctd>社交媒体平台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>almost everyone’s daily life\u003c/td>\n\u003ctd>几乎融入每个人的日常生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shopping websites\u003c/td>\n\u003ctd>电商网站\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attract huge numbers of users\u003c/td>\n\u003ctd>吸引大量用户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shop online\u003c/td>\n\u003ctd>网购\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>much more convenient\u003c/td>\n\u003ctd>方便得多\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What kinds of websites do you often visit?\u003c/h2>\n\u003cp>\u003cmark>Scrolling through social media\u003c/mark> is my \u003cmark>daily routine\u003c/mark>. Sometimes I feel like \u003cmark>I live on Bilibili, YouTube and WeChat\u003c/mark>. Apart from that, \u003cmark>I go to GitHub almost every day\u003c/mark>, and I \u003cmark>basically can&#39;t live without it.\u003c/mark> It’s useful for me to \u003cmark>look up codes\u003c/mark> and \u003cmark>share some projects.\u003c/mark>\u003c/p>\n\u003cp>刷社交媒体基本上是我的日常。有时候我感觉自己离不开哔哩哔哩、油管和微信。除此之外，我经常访问 GitHub，我可以在上面查阅代码、分享技术项目。\u003c/p>\n\u003ch2 id=\"h2\">2. What is your favourite website?\u003c/h2>\n\u003cp>My favourite website \u003cmark>has to be Bilibili.\u003c/mark> It is a \u003cmark>video-sharing platform\u003c/mark>. I always watch videos for study. I also \u003cmark>enjoy documentaries and movies\u003c/mark> on this website. Recently \u003cmark>I&#39;ve watched a movie about Mars\u003c/mark> \u003cmark>which makes me want to learn more about astronomy\u003c/mark>\u003c/p>\n\u003cp>我最喜欢的网站当属哔哩哔哩。它是一个视频分享平台。我经常看视频来学习。我也喜欢在这个网站上看纪录片和电影。最近我看了一部有关火星的影片，这让我想要学习更多天文学相关知识。\u003c/p>\n\u003ch2 id=\"h3\">3. Are there any changes to the websites you often visit?\u003c/h2>\n\u003cp>Definitely. \u003cmark>Several changes have taken place\u003c/mark>. When I was in primary school, \u003cmark>I only visited websites for fun.\u003c/mark>\u003cbr>But now, I \u003cmark>spend more time on\u003c/mark> learning platforms like Bilibili and GitHub. I use them to \u003cmark>gain knowledge and learn different skills\u003c/mark> so that I can \u003cmark>keep improving myself.\u003c/mark>\u003c/p>\n\u003cp>当然，发生了不少变化。上小学的时候，我上网只是为了消遣娱乐。\u003cbr>但现在，我会花更多时间使用 B 站和 GitHub 这类学习平台。我借助它们积累知识、学习各种技能，持续提升自我。\u003c/p>\n\u003ch2 id=\"h4\">4. What kinds of websites are popular in your country?\u003c/h2>\n\u003cp>\u003cmark>A wide range of\u003c/mark> websites are popular in China. First of all, \u003cmark>social media platforms\u003c/mark> such as WeChat and QQ \u003cmark>have become part of almost everyone’s daily life\u003c/mark>. Besides, \u003cmark>e-commerce websites\u003c/mark> like Taobao \u003cmark>attract huge numbers of users\u003c/mark>. Many people \u003cmark>shop online\u003c/mark> because \u003cmark>it is much more convenient.\u003c/mark>\u003c/p>\n\u003cp>在中国，多种多样的网站都很受欢迎。首先，微信、QQ 这类社交平台几乎融入每个人的日常生活。此外，像淘宝这样的电商网站吸引着大量用户。很多人选择网购，因为这样方便得多。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What kinds of websites do you often visit?"},{"level":2,"id":"h2","text":"2. What is your favourite website?"},{"level":2,"id":"h3","text":"3. Are there any changes to the websites you often visit?"},{"level":2,"id":"h4","text":"4. What kinds of websites are popular in your country?"}],"text":"What kinds of websites do you often visit? What is your favourite website? Are there any changes to the websites you often visit? What kinds of websites are popular in your country? 英文短语 中文释义 Scrolling through social media 浏览社交媒体 daily routine 日常作息，日常习惯 I live on Bilibili, YouTube and WeChat 离不开 B 站、油管和微信 go to GitHub almost every day 几乎每天访问 GitHub view some codes 查阅代码 share some projects 分享一些技术项目 has to be 当属，一定是 video-sharing platform 视频分享平台 enjoy documentaries and movies 喜欢看纪录片和电影 I've watched a movie about Mars 我看过一部关于火星的影片 learn more about astronomy 学习更多天文学相关知识 Several changes have taken place 发生了不少变化 visited websites for fun 上网只是为了消遣娱乐 spend more time on 花更多时间在…… gain knowledge and learn different skills 积累知识、学习各类技能 keep improving myself 持续提升自我 A wide range of 多种多样的 social media platforms 社交媒体平台 almost everyone’s daily life 几乎融入每个人的日常生活 shopping websites 电商网站 attract huge numbers of users 吸引大量用户 shop online 网购 much more convenient 方便得多 1. What kinds of websites do you often visit? Scrolling through social media is my daily routine. Sometimes I feel like I live on Bilibili, YouTube and WeChat. Apart from that, I go to GitHub almost every day, and I basically can't live without it. It’s useful for me to look up codes and share some projects. 刷社交媒体基本上是我的日常。有时候我感觉自己离不开哔哩哔哩、油管和微信。除此之外，我经常访问 GitHub，我可以在上面查阅代码、分享技术项目。 2. What is your favourite website? My favourite website has to be Bilibili. It is a video-sharing platform. I always watch videos for study. I also enjoy documentaries and movies on this website. Recently I've watched a movie about Mars which makes me want to learn more about astronomy 我最喜欢的网站当属哔哩哔哩。它是一个视频分享平台。我经常看视频来学习。我也喜欢在这个网站上看纪录片和电影。最近我看了一部有关火星的影片，这让我想要学习更多天文学相关知识。 3. Are there any changes to the websites you often visit? Definitely. Several changes have taken place. When I was in primary school, I only visited websites for fun. But now, I spend more time on learning platforms like Bilibili and GitHub. I use them to gain knowledge and learn different skills so that I can keep improving myself. 当然，发生了不少变化。上小学的时候，我上网只是为了消遣娱乐。 但现在，我会花更多时间使用 B 站和 GitHub 这类学习平台。我借助它们积累知识、学习各种技能，持续提升自我。 4. What kinds of websites are popular in your country? A wide range of websites are popular in China. First of all, social media platforms such as WeChat and QQ have become part of almost everyone’s daily life. Besides, e-commerce websites like Taobao attract huge numbers of users. Many people shop online because it is much more convenient. 在中国，多种多样的网站都很受欢迎。首先，微信、QQ 这类社交平台几乎融入每个人的日常生活。此外，像淘宝这样的电商网站吸引着大量用户。很多人选择网购，因为这样方便得多。"},{"id":"a-p1-mirrors","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/4-Mirrors.md","title":"Mirrors","html":"\u003cul>\n\u003cli>Do you like looking at yourself in the mirror? How often?\u003c/li>\n\u003cli>Have you ever bought mirrors?\u003c/li>\n\u003cli>Do you usually take a mirror with you?\u003c/li>\n\u003cli>Would you use mirrors to decorate your room?\u003c/li>\n\u003c/ul>\n\u003cp>我赌不考\u003c/p>\n","toc":[],"text":"Do you like looking at yourself in the mirror? How often? Have you ever bought mirrors? Do you usually take a mirror with you? Would you use mirrors to decorate your room? 我赌不考"},{"id":"a-p1-park","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/5-park.md","title":"Park","html":"\u003cul>\n\u003cli>Did you like going to parks as a child?\u003c/li>\n\u003cli>Do you still like going to parks now?\u003c/li>\n\u003cli>Would you like to see more parks in your city?\u003c/li>\n\u003cli>Are there any parks you want to go to in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hitting the park\u003c/td>\n\u003ctd>去公园（口语地道表达）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a highlight of my week\u003c/td>\n\u003ctd>一周里最期待 / 最开心的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I was a kid\u003c/td>\n\u003ctd>小时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>But unfortunately\u003c/td>\n\u003ctd>可惜、遗憾的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Looking back\u003c/td>\n\u003ctd>回想起来\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after a long week\u003c/td>\n\u003ctd>熬过漫长的一周后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>walk close to the water\u003c/td>\n\u003ctd>在水边散步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which are close to nature\u003c/td>\n\u003ctd>贴近大自然\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离都市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>恢复精力、充电\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Absolutely I would\u003c/td>\n\u003ctd>我当然希望\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spare time\u003c/td>\n\u003ctd>闲暇时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is spent on my phone\u003c/td>\n\u003ctd>耗在手机上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a great place to relax\u003c/td>\n\u003ctd>放松的好去处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after studying and working\u003c/td>\n\u003ctd>学习、工作之余\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>breathe some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>恢复精力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s definitely better than\u003c/td>\n\u003ctd>这肯定比…… 要好得多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>staying at home all day\u003c/td>\n\u003ctd>整天待在家里\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve always wanted to\u003c/td>\n\u003ctd>我一直想要……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Yosemite National Park\u003c/mark>\u003c/td>\n\u003ctd>优胜美地国家公园\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I want to see \u003cmark>El Capitan\u003c/mark>\u003c/td>\n\u003ctd>我想去看酋长岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a huge granite cliff\u003c/td>\n\u003ctd>一块巨大的花岗岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a big fan of rock climbing\u003c/td>\n\u003ctd>非常热爱攀岩 / 攀岩爱好者\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1.\u003cstrong>Did you like going to parks as a child?\u003c/strong>\u003c/h2>\n\u003cp>Definitely, \u003cmark>Hitting the park\u003c/mark> was \u003cmark>a highlight of my week\u003c/mark> \u003cmark>when I was a kid.\u003c/mark> I went to parks every weekend to play football when I was in primary school. I even thought of going professional. \u003cmark>But unfortunately\u003c/mark>, I didn’t succeed. \u003cmark>Looking back\u003c/mark>, I really enjoyed being a kid.\u003c/p>\n\u003cp>小时候去公园是我每周最期待的事。上小学时，我每个周末都去那儿踢足球，甚至梦想成为一名职业球员。可惜最后没能如愿。回想起来，我十分享受那段童年时光。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you still like going to parks now?\u003c/h2>\n\u003cp>Absolutely, the park is a place where I can relax \u003cmark>after a long week\u003c/mark>. I usually like to \u003cmark>walk close to the water, close to the river, the lake, or the forest areas\u003c/mark>, \u003cmark>which are close to nature\u003c/mark>. It lets me \u003cmark>\u003cstrong>take a break from urban life\u003c/strong>\u003c/mark>, \u003cmark>\u003cstrong>soak up some fresh air\u003c/strong>\u003c/mark> and \u003cmark>fully \u003cstrong>recharge my batteries\u003c/strong>.\u003c/mark> \u003c/p>\n\u003cp>当然，公园是我熬过漫长一周后放松身心的地方。我常常喜欢在水边散步，河畔、湖边或是林间都可以，也就是贴近大自然的环境。在公园里，我能够暂时远离都市生活，呼吸新鲜空气，充分恢复精力。\u003c/p>\n\u003ch2 id=\"h3\">3.Would you like to see more parks in your city?\u003c/h2>\n\u003cp>\u003cstrong>\u003cmark>Absolutely I would\u003c/mark>\u003c/strong>. Right now most of my \u003cmark>spare time\u003c/mark> \u003cmark>is spent on my phone\u003c/mark>. More parks would \u003cstrong>give me a great place to relax\u003c/strong> \u003cmark>after studying and working\u003c/mark>, so I can \u003cmark>\u003cstrong>breathe some fresh air\u003c/strong>\u003c/mark> and \u003cmark>\u003cstrong>recharge my batteries\u003c/strong>\u003c/mark> in the park. \u003cmark>It’s definitely better than\u003c/mark> \u003cmark>staying at home all day.\u003c/mark>\u003c/p>\n\u003cp>我当然希望（建设更多公园）。目前我的大部分闲暇时间都耗在手机上。更多公园能为我提供学习、工作之余放松的好去处。我可以在公园里呼吸新鲜空气、恢复精力，这肯定比整天待在家里要好得多。\u003c/p>\n\u003ch2 id=\"h4\">4. Are there any parks you want to go to in the future?\u003c/h2>\n\u003cp>Yes, for sure, \u003cmark>I’ve always wanted to\u003c/mark> visit \u003cmark>Yosemite National Park\u003c/mark> in the United States. I want to see \u003cmark>El Capitan\u003c/mark>, \u003cmark>a huge granite cliff\u003c/mark>. It’s famous because Alex Honnold completed a free solo climb there. I’m \u003cmark>a big fan of rock climbing\u003c/mark>, so I really hope to have a look.\u003c/p>\n\u003cp>当然，我一直想去美国的优胜美地国家公园。我很想去看一看酋长岩这块巨大的花岗岩岩壁。它非常出名，攀岩运动员 Alex Honnold 曾在这里完成徒手攀岩，我很喜欢攀岩，所以我非常想去看一看\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1.Did you like going to parks as a child?"},{"level":2,"id":"h2","text":"2. Do you still like going to parks now?"},{"level":2,"id":"h3","text":"3.Would you like to see more parks in your city?"},{"level":2,"id":"h4","text":"4. Are there any parks you want to go to in the future?"}],"text":"Did you like going to parks as a child? Do you still like going to parks now? Would you like to see more parks in your city? Are there any parks you want to go to in the future? 英文短语 中文释义 Hitting the park 去公园（口语地道表达） a highlight of my week 一周里最期待 / 最开心的事 when I was a kid 小时候 But unfortunately 可惜、遗憾的是 Looking back 回想起来 after a long week 熬过漫长的一周后 walk close to the water 在水边散步 which are close to nature 贴近大自然 take a break from urban life 暂时远离都市生活 soak up some fresh air 呼吸新鲜空气 recharge my batteries 恢复精力、充电 Absolutely I would 我当然希望 spare time 闲暇时间 is spent on my phone 耗在手机上 a great place to relax 放松的好去处 after studying and working 学习、工作之余 breathe some fresh air 呼吸新鲜空气 recharge my batteries 恢复精力 It’s definitely better than 这肯定比…… 要好得多 staying at home all day 整天待在家里 I’ve always wanted to 我一直想要…… Yosemite National Park 优胜美地国家公园 I want to see El Capitan 我想去看酋长岩 a huge granite cliff 一块巨大的花岗岩岩壁 a big fan of rock climbing 非常热爱攀岩 / 攀岩爱好者 1.Did you like going to parks as a child? Definitely, Hitting the park was a highlight of my week when I was a kid. I went to parks every weekend to play football when I was in primary school. I even thought of going professional. But unfortunately, I didn’t succeed. Looking back, I really enjoyed being a kid. 小时候去公园是我每周最期待的事。上小学时，我每个周末都去那儿踢足球，甚至梦想成为一名职业球员。可惜最后没能如愿。回想起来，我十分享受那段童年时光。 2. Do you still like going to parks now? Absolutely, the park is a place where I can relax after a long week. I usually like to walk close to the water, close to the river, the lake, or the forest areas, which are close to nature. It lets me take a break from urban life, soak up some fresh air and fully recharge my batteries. 当然，公园是我熬过漫长一周后放松身心的地方。我常常喜欢在水边散步，河畔、湖边或是林间都可以，也就是贴近大自然的环境。在公园里，我能够暂时远离都市生活，呼吸新鲜空气，充分恢复精力。 3.Would you like to see more parks in your city? Absolutely I would. Right now most of my spare time is spent on my phone. More parks would give me a great place to relax after studying and working, so I can breathe some fresh air and recharge my batteries in the park. It’s definitely better than staying at home all day. 我当然希望（建设更多公园）。目前我的大部分闲暇时间都耗在手机上。更多公园能为我提供学习、工作之余放松的好去处。我可以在公园里呼吸新鲜空气、恢复精力，这肯定比整天待在家里要好得多。 4. Are there any parks you want to go to in the future? Yes, for sure, I’ve always wanted to visit Yosemite National Park in the United States. I want to see El Capitan, a huge granite cliff. It’s famous because Alex Honnold completed a free solo climb there. I’m a big fan of rock climbing, so I really hope to have a look. 当然，我一直想去美国的优胜美地国家公园。我很想去看一看酋长岩这块巨大的花岗岩岩壁。它非常出名，攀岩运动员 Alex Honnold 曾在这里完成徒手攀岩，我很喜欢攀岩，所以我非常想去看一看"},{"id":"a-p1-shopping","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/6-shopping.md","title":"Shopping","html":"\u003cul>\n\u003cli>How often do you go shopping?\u003c/li>\n\u003cli>Do you prefer online shopping or in-store shopping?\u003c/li>\n\u003cli>Have you ever returned anything you bought online?\u003c/li>\n\u003cli>Do you like shopping?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>once a month\u003c/td>\n\u003ctd>一个月一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily necessities\u003c/td>\n\u003ctd>生活必需品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Without doubt\u003c/td>\n\u003ctd>毫无疑问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>online shopping\u003c/td>\n\u003ctd>网购\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>more choices\u003c/td>\n\u003ctd>更多选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>throw it away\u003c/td>\n\u003ctd>直接丢掉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Not really\u003c/td>\n\u003ctd>并不\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hate anything\u003c/td>\n\u003ctd>不喜欢所有事情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>requires me to make choices\u003c/td>\n\u003ctd>需要我做出选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>totally wastes my time\u003c/td>\n\u003ctd>纯粹浪费我的时间\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. How often do you go shopping?\u003c/h3>\n\u003cp>Hardly ever. I go shopping about \u003cmark>once a month\u003c/mark>. I only buy \u003cmark>daily necessities\u003c/mark> and some clothes.\u003c/p>\n\u003cp>我几乎不购物，大概一个月一次，只买一些生活必需品和衣服。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you prefer online shopping or in-store shopping?\u003c/h3>\n\u003cp>\u003cmark>Without doubt,\u003c/mark> I prefer \u003cmark>online shopping.\u003c/mark> There are \u003cmark>more choices\u003c/mark>, and it is much more convenient.\u003c/p>\n\u003cp>毫无疑问，我更喜欢网购。商品选择更多，而且更加方便。\u003c/p>\n\u003ch3 id=\"h3\">3. Have you ever returned anything you bought online?\u003c/h3>\n\u003cp>No, I haven’t. Most of the things I bought are fine. If I&#39;m not satisfied with something, I just \u003cmark>throw it away.\u003c/mark> \u003c/p>\n\u003cp>没有。我网购的大部分商品都不错。如果东西不好，我直接丢掉。\u003c/p>\n\u003ch3 id=\"h4\">4. Do you like shopping?\u003c/h3>\n\u003cp>\u003cmark>Not really.\u003c/mark> I \u003cmark>hate anything\u003c/mark> that \u003cmark>requires me to make choices\u003c/mark>. It \u003cmark>totally wastes my time.\u003c/mark>\u003c/p>\n\u003cp>并不喜欢。我不喜欢所有需要做出选择的事情，纯粹浪费我的时间。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. How often do you go shopping?"},{"level":3,"id":"h2","text":"2. Do you prefer online shopping or in-store shopping?"},{"level":3,"id":"h3","text":"3. Have you ever returned anything you bought online?"},{"level":3,"id":"h4","text":"4. Do you like shopping?"}],"text":"How often do you go shopping? Do you prefer online shopping or in-store shopping? Have you ever returned anything you bought online? Do you like shopping? 短语 中文翻译 once a month 一个月一次 daily necessities 生活必需品 Without doubt 毫无疑问 online shopping 网购 more choices 更多选择 throw it away 直接丢掉 Not really 并不 hate anything 不喜欢所有事情 requires me to make choices 需要我做出选择 totally wastes my time 纯粹浪费我的时间 1. How often do you go shopping? Hardly ever. I go shopping about once a month. I only buy daily necessities and some clothes. 我几乎不购物，大概一个月一次，只买一些生活必需品和衣服。 2. Do you prefer online shopping or in-store shopping? Without doubt, I prefer online shopping. There are more choices, and it is much more convenient. 毫无疑问，我更喜欢网购。商品选择更多，而且更加方便。 3. Have you ever returned anything you bought online? No, I haven’t. Most of the things I bought are fine. If I'm not satisfied with something, I just throw it away. 没有。我网购的大部分商品都不错。如果东西不好，我直接丢掉。 4. Do you like shopping? Not really. I hate anything that requires me to make choices. It totally wastes my time. 并不喜欢。我不喜欢所有需要做出选择的事情，纯粹浪费我的时间。"},{"id":"a-p1-tidiness","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/7-tidiness.md","title":"Tidiness","html":"\u003cul>\n\u003cli>Do you like to keep things tidy?\u003c/li>\n\u003cli>Did you use to keep your room tidy as a child?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>concentrate on study\u003c/td>\n\u003ctd>集中注意力学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tidying up my entire desk\u003c/td>\n\u003ctd>清理完我整张桌面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>messy stuff around\u003c/td>\n\u003ctd>周围的杂乱的物品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>distract me\u003c/td>\n\u003ctd>使我分心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>form a daily habit of…\u003c/td>\n\u003ctd>养成…… 的日常习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>before bed\u003c/td>\n\u003ctd>睡前\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>both at home and at school\u003c/td>\n\u003ctd>不管在家还是在校\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me feel calm and organised\u003c/td>\n\u003ctd>让我内心平静、做事有条理\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not at all\u003c/td>\n\u003ctd>完全不是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>it was totally the opposite\u003c/mark>\u003c/td>\n\u003ctd>完全相反\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>When I was a kid\u003c/td>\n\u003ctd>我小时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make a huge mess\u003c/td>\n\u003ctd>弄得一团糟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>around the house\u003c/td>\n\u003ctd>在家里各处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>told me off\u003c/td>\n\u003ctd>骂我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tidy my desk and bed by myself\u003c/td>\n\u003ctd>独自收拾桌子和床\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>step by step\u003c/td>\n\u003ctd>渐渐地，一步步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>build up a good habit of…\u003c/td>\n\u003ctd>养成…… 的好习惯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep my space neat\u003c/td>\n\u003ctd>保持自己的空间整洁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>really thankful to\u003c/td>\n\u003ctd>十分感激某人\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>1.  Do you like to keep things tidy?\u003c/strong>\u003cbr>Definitely yes. I can only concentrate on study after tidying up my entire desk. Messy stuff lying around will easily distract me.\u003cbr>Besides, I’ve formed a daily habit of tidying my room twice a day, once in the morning and once before bed, both at home and at school. It makes me feel calm and organised.\u003c/p>\n\u003cp>当然喜欢。我学习的时候必须先把整张书桌收拾干净，才能集中注意力。杂乱的东西很容易让我分心。\u003cbr>除此之外，不管在家还是在校，我都养成了每天打扫两次房间的习惯，早上一次、睡前一次。整洁的环境能让我内心平静、做事有条理。\u003c/p>\n\u003col start=\"2\">\n\u003cli>\u003cp>\u003cstrong>Did you use to keep your room tidy as a child?\u003c/strong>\u003c/p>\n\u003cp> Not at all — it was totally the opposite. When I was a kid, I always made a huge mess around the house, so my mum often told me off. Later, she asked me to tidy my desk and bed by myself. Step by step, I built up a good habit of keeping my space neat, and I’m really thankful to her.\u003c/p>\n\u003cp> 完全不是，情况恰恰相反。我小时候总把家里弄得乱糟糟，所以妈妈经常批评我。后来，她让我自己收拾书桌和床铺。久而久之，我养成了保持居住环境整洁的好习惯，我十分感激她。\u003c/p>\n\u003c/li>\n\u003c/ol>\n","toc":[],"text":"Do you like to keep things tidy? Did you use to keep your room tidy as a child? 英文短语 中文释义 concentrate on study 集中注意力学习 tidying up my entire desk 清理完我整张桌面 messy stuff around 周围的杂乱的物品 distract me 使我分心 form a daily habit of… 养成…… 的日常习惯 before bed 睡前 both at home and at school 不管在家还是在校 make me feel calm and organised 让我内心平静、做事有条理 not at all 完全不是 it was totally the opposite 完全相反 When I was a kid 我小时候 make a huge mess 弄得一团糟 around the house 在家里各处 told me off 骂我 tidy my desk and bed by myself 独自收拾桌子和床 step by step 渐渐地，一步步 build up a good habit of… 养成…… 的好习惯 keep my space neat 保持自己的空间整洁 really thankful to 十分感激某人 1. Do you like to keep things tidy? Definitely yes. I can only concentrate on study after tidying up my entire desk. Messy stuff lying around will easily distract me. Besides, I’ve formed a daily habit of tidying my room twice a day, once in the morning and once before bed, both at home and at school. It makes me feel calm and organised. 当然喜欢。我学习的时候必须先把整张书桌收拾干净，才能集中注意力。杂乱的东西很容易让我分心。 除此之外，不管在家还是在校，我都养成了每天打扫两次房间的习惯，早上一次、睡前一次。整洁的环境能让我内心平静、做事有条理。 Did you use to keep your room tidy as a child? Not at all — it was totally the opposite. When I was a kid, I always made a huge mess around the house, so my mum often told me off. Later, she asked me to tidy my desk and bed by myself. Step by step, I built up a good habit of keeping my space neat, and I’m really thankful to her. 完全不是，情况恰恰相反。我小时候总把家里弄得乱糟糟，所以妈妈经常批评我。后来，她让我自己收拾书桌和床铺。久而久之，我养成了保持居住环境整洁的好习惯，我十分感激她。"},{"id":"a-p1-music","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/8-music.md","title":"Music","html":"\u003cul>\n\u003cli>Do you prefer sad or happy music?\u003c/li>\n\u003cli>Does happy music make you feel more excited?\u003c/li>\n\u003cli>Have you taken any music classes?\u003c/li>\n\u003cli>Do you listen to music while doing other things?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>To be honest\u003c/td>\n\u003ctd>说实话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hardly ever\u003c/td>\n\u003ctd>几乎从不，很少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in my daily life\u003c/td>\n\u003ctd>在日常生活中，平日里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go running\u003c/td>\n\u003ctd>去跑步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>energetic and powerful songs\u003c/td>\n\u003ctd>激昂、充满力量的歌曲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer me up\u003c/td>\n\u003ctd>使我振作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep going\u003c/td>\n\u003ctd>坚持下去，不放弃\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>feel tired\u003c/td>\n\u003ctd>感到疲惫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give up halfway\u003c/td>\n\u003ctd>半途而废\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take any music lessons\u003c/td>\n\u003ctd>上音乐课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not ... at all\u003c/td>\n\u003ctd>完全不、一点都没有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>know nothing about sth\u003c/td>\n\u003ctd>对…… 一窍不通\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whenever I sing\u003c/td>\n\u003ctd>每当我唱歌的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sound really bad\u003c/td>\n\u003ctd>听起来很难听\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>Do you prefer sad or happy music?\u003c/strong>\u003c/p>\n\u003cp> To be honest, I hardly ever listen to music in my daily life. But when I go running, I really enjoy energetic and powerful songs. This kind of music can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. \u003c/p>\n\u003cp> 说实话，我平日里几乎不怎么听音乐。但跑步的时候，我格外喜欢激昂、充满力量感的歌曲。这种音乐能鼓舞我、让我坚持下去，特别是当我感到疲惫、想要半途而废的时候。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Does happy music make you feel more excited?\u003c/strong>\u003c/p>\n\u003cp> Yes, it does. Upbeat songs always put me in a better mood, and I feel much more energetic afterwards. That’s probably why I prefer happy music to sad music — I’d rather feel motivated than sentimental.\u003c/p>\n\u003cp> 会。节奏欢快的歌总能让我心情变好，听完之后整个人都更有精神。可能也是因为这个，比起伤感的音乐，我更喜欢欢快的——我更想要动力，而不是多愁善感。\u003c/p>\n\u003c/li>\n\u003cli>\u003cul>\n\u003cli>Have you taken any music classes?\u003c/li>\n\u003c/ul>\n\u003cp> No, I haven’t taken any music lessons at all. Actually, I know nothing about music. Whenever I sing, I sound really bad.\u003c/p>\n\u003cp> 没有，我一节音乐课都没上过。事实上，我对音乐一窍不通，每次唱歌，我的嗓音都很难听。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Do you listen to music while doing other things?\u003c/strong>\u003c/p>\n\u003cp> Rarely, to be honest. I find it hard to concentrate when there’s music playing, so I usually keep it off while I’m studying. The only time I listen to music is when I go running, because it helps me keep going.\u003c/p>\n\u003cp> 说实话，很少。有音乐的时候我很难集中注意力，所以学习时一般不开音乐。我唯一会听音乐的时候就是跑步，因为音乐能让我坚持跑下去。\u003c/p>\n\u003c/li>\n\u003c/ol>\n","toc":[],"text":"Do you prefer sad or happy music? Does happy music make you feel more excited? Have you taken any music classes? Do you listen to music while doing other things? 英文短语 中文释义 To be honest 说实话 hardly ever 几乎从不，很少 in my daily life 在日常生活中，平日里 go running 去跑步 energetic and powerful songs 激昂、充满力量的歌曲 cheer me up 使我振作 keep going 坚持下去，不放弃 feel tired 感到疲惫 give up halfway 半途而废 take any music lessons 上音乐课 not ... at all 完全不、一点都没有 know nothing about sth 对…… 一窍不通 whenever I sing 每当我唱歌的时候 sound really bad 听起来很难听 Do you prefer sad or happy music? To be honest, I hardly ever listen to music in my daily life. But when I go running, I really enjoy energetic and powerful songs. This kind of music can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 说实话，我平日里几乎不怎么听音乐。但跑步的时候，我格外喜欢激昂、充满力量感的歌曲。这种音乐能鼓舞我、让我坚持下去，特别是当我感到疲惫、想要半途而废的时候。 Does happy music make you feel more excited? Yes, it does. Upbeat songs always put me in a better mood, and I feel much more energetic afterwards. That’s probably why I prefer happy music to sad music — I’d rather feel motivated than sentimental. 会。节奏欢快的歌总能让我心情变好，听完之后整个人都更有精神。可能也是因为这个，比起伤感的音乐，我更喜欢欢快的——我更想要动力，而不是多愁善感。 Have you taken any music classes? No, I haven’t taken any music lessons at all. Actually, I know nothing about music. Whenever I sing, I sound really bad. 没有，我一节音乐课都没上过。事实上，我对音乐一窍不通，每次唱歌，我的嗓音都很难听。 Do you listen to music while doing other things? Rarely, to be honest. I find it hard to concentrate when there’s music playing, so I usually keep it off while I’m studying. The only time I listen to music is when I go running, because it helps me keep going. 说实话，很少。有音乐的时候我很难集中注意力，所以学习时一般不开音乐。我唯一会听音乐的时候就是跑步，因为音乐能让我坚持跑下去。"},{"id":"a-p1-teacher","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/9-teacher.md","title":"Teacher","html":"\u003cul>\n\u003cli>Do you have a favorite teacher?\u003c/li>\n\u003cli>In what way has your favourite teacher helped you?\u003c/li>\n\u003cli>Are you still in touch with your primary school teachers?\u003c/li>\n\u003cli>Do you have a teacher from your past that you still remember?\u003c/li>\n\u003cli>Do you want to be a teacher in the future?\u003c/li>\n\u003cli>Do you like your primary school teachers more than your high school teachers?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>humorous and witty\u003c/td>\n\u003ctd>幽默风趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used smart ways to do\u003c/td>\n\u003ctd>用巧妙的方式做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>explain difficult knowledge clearly\u003c/td>\n\u003ctd>把难懂的知识讲清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look forward to his lessons\u003c/td>\n\u003ctd>期待他的课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave a deep impression on me\u003c/td>\n\u003ctd>给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>become interested in physics\u003c/td>\n\u003ctd>对物理产生兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve my grades a lot\u003c/td>\n\u003ctd>大幅提升我的成绩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>failed exams or felt stressed\u003c/td>\n\u003ctd>考试失利或者感到压力很大\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lose touch with sb\u003c/td>\n\u003ctd>和某人失去联系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We don’t have each other’s contact information\u003c/td>\n\u003ctd>我们没有对方的联系方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>as they were really kind to me\u003c/td>\n\u003ctd>因为他们对我十分友善\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the one I remember the most.\u003c/td>\n\u003ctd>我记忆最深刻的那个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>humorous and witty\u003c/td>\n\u003ctd>幽默风趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make boring lessons fun\u003c/td>\n\u003ctd>把枯燥的课堂变得有意思\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave a deep impression on sb\u003c/td>\n\u003ctd>给某人留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recall some details of his classes now\u003c/td>\n\u003ctd>我现在仍然能回忆起他课堂的一些的细节\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a challenging job\u003c/td>\n\u003ctd>一份有挑战的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>require a lot of patience and energy\u003c/td>\n\u003ctd>需要大量的耐心和精力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>engineering work\u003c/td>\n\u003ctd>工程工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which is closer to my major and career plan\u003c/td>\n\u003ctd>与我的专业、职业规划更贴合\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s hard to say which I like more\u003c/td>\n\u003ctd>很难说我更喜欢哪个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>took good care of us in daily life\u003c/td>\n\u003ctd>把我们照顾得很好在日常生活中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>useful learning skills\u003c/td>\n\u003ctd>有用的学习方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>prepare for university\u003c/td>\n\u003ctd>为大学做准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I respect both of them\u003c/td>\n\u003ctd>我都很尊敬他们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for different reasons.\u003c/td>\n\u003ctd>处于不同的原因\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1.Do you have a favorite teacher?\u003c/h3>\n\u003cp>Absolutely. My favourite teacher was my high school physics teacher. He was really humorous and witty. He always used smart ways to explain the most difficult knowledge clearly. So I actually looked forward to his lessons, and he really left a deep impression on me.\u003c/p>\n\u003cp>当然。我最喜欢的老师是我高中物理老师。他十分风趣幽默，总能用巧妙的方式把最难的知识点讲明白。所以我那时候特别期待上他的课，他给我留下了非常深刻的印象。\u003c/p>\n\u003ch3 id=\"h2\">2. In what way has your favourite teacher helped you?\u003c/h3>\n\u003cp>Well, he helped me in many ways. Most importantly, he used smart ways to explain difficult knowledge clearly, which made me become interested in physics and improved my grades a lot. Besides, he always encouraged me when I failed exams or felt stressed. I&#39;m really thankful to him.\u003c/p>\n\u003cp>嗯，他在很多方面都帮到了我。最重要的是，他能用巧妙的方式把难懂的知识讲明白，这让我对物理产生了兴趣，成绩也提升了很多。除此之外，当我考试失利或者感到压力大的时候，他总会鼓励我，我很感谢他\u003c/p>\n\u003ch3 id=\"h3\">3. Are you still in touch with your primary school teachers?\u003c/h3>\n\u003cp>Actually, not really. I’ve lost touch with most of my primary school teachers since I graduated. because We don’t have each other’s contact information\u003cbr>. But I still remember some of them clearly, as they were really kind to me.\u003c/p>\n\u003cp>其实没有了。小学毕业之后，我就和大部分小学老师失去了联系。我们现在没有彼此的联系方式，\u003cbr>但我依然清楚地记得其中一些老师，他们当时对我特别好。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h4\">4. Do you have a teacher from your past that you still remember?\u003c/h3>\n\u003cp>Yes, definitely. My high school physics teacher is the one I remember the most. He was humorous and witty, and he always made boring lessons fun. He left such a deep impression on me that I can still recall some details of his classes now.\u003c/p>\n\u003cp>当然有。我印象最深的就是我的高中物理老师。他幽默风趣，总能把枯燥的课堂变得有意思。他给我留下了特别深刻的印象，到现在我都还能想起他课堂上的一些细节。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h5\">5. Do you want to be a teacher in the future?\u003c/h3>\n\u003cp>To be honest, I don’t really want to be a teacher. I think teaching is a challenging job that requires a lot of patience and energy. I’m more interested in engineering work, which is also closer to my university major and my career plan.\u003c/p>\n\u003cp>说实话，我不太想当老师。我觉得教师是一份很有挑战的工作，需要投入大量的耐心和精力。我对工程类工作更感兴趣，这也和我的大学专业以及职业规划更贴合。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h6\">6. Do you like your primary school teachers more than your high school teachers?\u003c/h3>\n\u003cp>Hmm, it’s hard to say which I like more. My primary school teachers were very warm and took good care of us in daily life. But my high school teachers taught me more useful learning skills and helped me prepare for university. I respect both of them for different reasons.\u003c/p>\n\u003cp>嗯，很难说我更喜欢哪一类。小学老师很亲切，在生活上把我们照顾得很好。但高中老师教给了我更多实用的学习方法，也帮我为大学做好了准备。出于不同的原因，这两类老师我都很尊敬。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1.Do you have a favorite teacher?"},{"level":3,"id":"h2","text":"2. In what way has your favourite teacher helped you?"},{"level":3,"id":"h3","text":"3. Are you still in touch with your primary school teachers?"},{"level":3,"id":"h4","text":"4. Do you have a teacher from your past that you still remember?"},{"level":3,"id":"h5","text":"5. Do you want to be a teacher in the future?"},{"level":3,"id":"h6","text":"6. Do you like your primary school teachers more than your high school teachers?"}],"text":"Do you have a favorite teacher? In what way has your favourite teacher helped you? Are you still in touch with your primary school teachers? Do you have a teacher from your past that you still remember? Do you want to be a teacher in the future? Do you like your primary school teachers more than your high school teachers? 英文短语 中文释义 humorous and witty 幽默风趣 used smart ways to do 用巧妙的方式做某事 explain difficult knowledge clearly 把难懂的知识讲清楚 look forward to his lessons 期待他的课 leave a deep impression on me 给我留下深刻印象 become interested in physics 对物理产生兴趣 improve my grades a lot 大幅提升我的成绩 failed exams or felt stressed 考试失利或者感到压力很大 lose touch with sb 和某人失去联系 We don’t have each other’s contact information 我们没有对方的联系方式 as they were really kind to me 因为他们对我十分友善 the one I remember the most. 我记忆最深刻的那个 humorous and witty 幽默风趣 make boring lessons fun 把枯燥的课堂变得有意思 leave a deep impression on sb 给某人留下深刻印象 recall some details of his classes now 我现在仍然能回忆起他课堂的一些的细节 a challenging job 一份有挑战的工作 require a lot of patience and energy 需要大量的耐心和精力 engineering work 工程工作 which is closer to my major and career plan 与我的专业、职业规划更贴合 it’s hard to say which I like more 很难说我更喜欢哪个 took good care of us in daily life 把我们照顾得很好在日常生活中 useful learning skills 有用的学习方法 prepare for university 为大学做准备 I respect both of them 我都很尊敬他们 for different reasons. 处于不同的原因 1.Do you have a favorite teacher? Absolutely. My favourite teacher was my high school physics teacher. He was really humorous and witty. He always used smart ways to explain the most difficult knowledge clearly. So I actually looked forward to his lessons, and he really left a deep impression on me. 当然。我最喜欢的老师是我高中物理老师。他十分风趣幽默，总能用巧妙的方式把最难的知识点讲明白。所以我那时候特别期待上他的课，他给我留下了非常深刻的印象。 2. In what way has your favourite teacher helped you? Well, he helped me in many ways. Most importantly, he used smart ways to explain difficult knowledge clearly, which made me become interested in physics and improved my grades a lot. Besides, he always encouraged me when I failed exams or felt stressed. I'm really thankful to him. 嗯，他在很多方面都帮到了我。最重要的是，他能用巧妙的方式把难懂的知识讲明白，这让我对物理产生了兴趣，成绩也提升了很多。除此之外，当我考试失利或者感到压力大的时候，他总会鼓励我，我很感谢他 3. Are you still in touch with your primary school teachers? Actually, not really. I’ve lost touch with most of my primary school teachers since I graduated. because We don’t have each other’s contact information . But I still remember some of them clearly, as they were really kind to me. 其实没有了。小学毕业之后，我就和大部分小学老师失去了联系。我们现在没有彼此的联系方式， 但我依然清楚地记得其中一些老师，他们当时对我特别好。 4. Do you have a teacher from your past that you still remember? Yes, definitely. My high school physics teacher is the one I remember the most. He was humorous and witty, and he always made boring lessons fun. He left such a deep impression on me that I can still recall some details of his classes now. 当然有。我印象最深的就是我的高中物理老师。他幽默风趣，总能把枯燥的课堂变得有意思。他给我留下了特别深刻的印象，到现在我都还能想起他课堂上的一些细节。 5. Do you want to be a teacher in the future? To be honest, I don’t really want to be a teacher. I think teaching is a challenging job that requires a lot of patience and energy. I’m more interested in engineering work, which is also closer to my university major and my career plan. 说实话，我不太想当老师。我觉得教师是一份很有挑战的工作，需要投入大量的耐心和精力。我对工程类工作更感兴趣，这也和我的大学专业以及职业规划更贴合。 6. Do you like your primary school teachers more than your high school teachers? Hmm, it’s hard to say which I like more. My primary school teachers were very warm and took good care of us in daily life. But my high school teachers taught me more useful learning skills and helped me prepare for university. I respect both of them for different reasons. 嗯，很难说我更喜欢哪一类。小学老师很亲切，在生活上把我们照顾得很好。但高中老师教给了我更多实用的学习方法，也帮我为大学做好了准备。出于不同的原因，这两类老师我都很尊敬。"},{"id":"a-p1-social","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/10-Social Media.md","title":"Social Media","html":"\u003cul>\n\u003cli>When did you start using social media?\u003c/li>\n\u003cli>Do you think you spend too much time on social media?\u003c/li>\n\u003cli>Do your friends use social media?\u003c/li>\n\u003cli>What do people often do on social media?\u003c/li>\n\u003cli>Have you ever posted anything on social media?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>pretty early\u003c/td>\n\u003ctd>很早\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I was super curious\u003c/td>\n\u003ctd>我很好奇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep up with them\u003c/td>\n\u003ctd>跟上他们的节奏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>signed up\u003c/td>\n\u003ctd>注册\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the moment I got my first smartphone\u003c/td>\n\u003ctd>在我拿到第一部智能手机的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>become a staple in my daily routine\u003c/td>\n\u003ctd>成了我日常生活里必不可少的一部分\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scroll through short videos\u003c/td>\n\u003ctd>刷短视频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>distract me from study\u003c/td>\n\u003ctd>分散我的学习注意力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can’t help doing sth\u003c/td>\n\u003ctd>忍不住做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>set time limits\u003c/td>\n\u003ctd>设置时长限制\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep in touch\u003c/td>\n\u003ctd>保持联系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>group chats\u003c/td>\n\u003ctd>群聊\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily life\u003c/td>\n\u003ctd>日常生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>like and comment on posts\u003c/td>\n\u003ctd>给动态点赞评论\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>chat with friends and family\u003c/td>\n\u003ctd>和亲友聊天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for fun\u003c/td>\n\u003ctd>当作消遣、为了好玩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>daily moments\u003c/td>\n\u003ctd>日常动态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>online learning\u003c/td>\n\u003ctd>线上学习\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>not very frequently\u003c/td>\n\u003ctd>不太频繁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>generally speaking\u003c/td>\n\u003ctd>总的来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>prefer to do sth rather than do sth\u003c/td>\n\u003ctd>比起做某事更愿意做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>browse other people’s posts\u003c/td>\n\u003ctd>浏览别人的动态\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. When did you start using social media?\u003c/h3>\n\u003cp>Honestly, I started using social media pretty early, around primary school, when my friends were talking about WeChat and QQ. I was super curious and wanted to keep up with them, so I signed up the moment I got my first smartphone. Since then, social media has become a staple in my daily routine.\u003c/p>\n\u003cp>说实话，我接触社交媒体挺早的，大概在上小学那会儿，当时身边所有人都在聊微信和 QQ。我特别好奇，也想跟上朋友们的节奏，所以我拿到第一部智能手机就注册了账号。从那以后，社交媒体就成了我日常生活里必不可少的一部分。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you think you spend too much time on social media?\u003c/h3>\n\u003cp>Well, sort of. I usually spend about one to two hours a day scrolling through short videos and checking messages. Sometimes it distracts me from my studies when I can’t help picking up my phone. But I’m trying to set time limits to control it these days.\u003c/p>\n\u003cp>嗯，有点吧。我每天大概花一到两个小时刷短视频、查看消息。有时候忍不住拿起手机，就会耽误学习。不过最近我在试着设置时长限制来管控一下。\u003c/p>\n\u003ch3 id=\"h3\">3. Do your friends use social media?\u003c/h3>\n\u003cp>Yes, almost all of my friends use social media every day. We mainly use WeChat to keep in touch and share funny things in group chats. They also post photos of their daily life or trips on Moments, and we often like and comment on each other’s posts.\u003c/p>\n\u003cp>是的，几乎我所有朋友每天都用社交媒体。我们主要用微信保持联系，在群聊里分享有意思的事。他们也会在朋友圈发日常生活或者旅行的照片，我们经常互相点赞评论。\u003c/p>\n\u003ch3 id=\"h4\">4. What do people often do on social media?\u003c/h3>\n\u003cp>Well, people do different things. Most use it to chat with friends and family. Many also scroll through short videos or read news for fun. Besides, some people share their daily moments, and others even use it for work or online learning.\u003c/p>\n\u003cp>嗯，人们做的事各不相同。大多数人用它和亲友聊天，很多人也会刷短视频或者看新闻消遣。除此之外，有些人会分享日常动态，还有人甚至用它办公或者线上学习。\u003c/p>\n\u003ch3 id=\"h5\">5. Have you ever posted anything on social media?\u003c/h3>\n\u003cp>Yes, I have, but not very frequently. I sometimes share photos of my trips, delicious food or small daily moments on WeChat Moments. Generally speaking, I prefer to browse other people’s posts rather than post a lot myself.\u003c/p>\n\u003cp>发过，但不是很频繁。我偶尔会在朋友圈分享旅行、美食的照片，或是生活里的小日常。总的来说，比起发很多动态，我更喜欢浏览别人的内容。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. When did you start using social media?"},{"level":3,"id":"h2","text":"2. Do you think you spend too much time on social media?"},{"level":3,"id":"h3","text":"3. Do your friends use social media?"},{"level":3,"id":"h4","text":"4. What do people often do on social media?"},{"level":3,"id":"h5","text":"5. Have you ever posted anything on social media?"}],"text":"When did you start using social media? Do you think you spend too much time on social media? Do your friends use social media? What do people often do on social media? Have you ever posted anything on social media? 英文短语 中文释义 pretty early 很早 I was super curious 我很好奇 keep up with them 跟上他们的节奏 signed up 注册 the moment I got my first smartphone 在我拿到第一部智能手机的时候 become a staple in my daily routine 成了我日常生活里必不可少的一部分 scroll through short videos 刷短视频 distract me from study 分散我的学习注意力 can’t help doing sth 忍不住做某事 set time limits 设置时长限制 keep in touch 保持联系 group chats 群聊 daily life 日常生活 like and comment on posts 给动态点赞评论 chat with friends and family 和亲友聊天 for fun 当作消遣、为了好玩 daily moments 日常动态 online learning 线上学习 not very frequently 不太频繁 generally speaking 总的来说 prefer to do sth rather than do sth 比起做某事更愿意做某事 browse other people’s posts 浏览别人的动态 1. When did you start using social media? Honestly, I started using social media pretty early, around primary school, when my friends were talking about WeChat and QQ. I was super curious and wanted to keep up with them, so I signed up the moment I got my first smartphone. Since then, social media has become a staple in my daily routine. 说实话，我接触社交媒体挺早的，大概在上小学那会儿，当时身边所有人都在聊微信和 QQ。我特别好奇，也想跟上朋友们的节奏，所以我拿到第一部智能手机就注册了账号。从那以后，社交媒体就成了我日常生活里必不可少的一部分。 2. Do you think you spend too much time on social media? Well, sort of. I usually spend about one to two hours a day scrolling through short videos and checking messages. Sometimes it distracts me from my studies when I can’t help picking up my phone. But I’m trying to set time limits to control it these days. 嗯，有点吧。我每天大概花一到两个小时刷短视频、查看消息。有时候忍不住拿起手机，就会耽误学习。不过最近我在试着设置时长限制来管控一下。 3. Do your friends use social media? Yes, almost all of my friends use social media every day. We mainly use WeChat to keep in touch and share funny things in group chats. They also post photos of their daily life or trips on Moments, and we often like and comment on each other’s posts. 是的，几乎我所有朋友每天都用社交媒体。我们主要用微信保持联系，在群聊里分享有意思的事。他们也会在朋友圈发日常生活或者旅行的照片，我们经常互相点赞评论。 4. What do people often do on social media? Well, people do different things. Most use it to chat with friends and family. Many also scroll through short videos or read news for fun. Besides, some people share their daily moments, and others even use it for work or online learning. 嗯，人们做的事各不相同。大多数人用它和亲友聊天，很多人也会刷短视频或者看新闻消遣。除此之外，有些人会分享日常动态，还有人甚至用它办公或者线上学习。 5. Have you ever posted anything on social media? Yes, I have, but not very frequently. I sometimes share photos of my trips, delicious food or small daily moments on WeChat Moments. Generally speaking, I prefer to browse other people’s posts rather than post a lot myself. 发过，但不是很频繁。我偶尔会在朋友圈分享旅行、美食的照片，或是生活里的小日常。总的来说，比起发很多动态，我更喜欢浏览别人的内容。"},{"id":"a-p1-clothing","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/11-Clothing.md","title":"Clothing","html":"\u003cul>\n\u003cli>\u003cp>What kind of clothes do you like to wear?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you prefer to wear comfortable and casual clothes or smart clothes?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you like wearing T-shirts?\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Do you spend a lot of time choosing clothes?\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>keep it simple and stay comfortable\u003c/td>\n\u003ctd>保持简约舒适风格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>throw on\u003c/td>\n\u003ctd>随手穿上、随便套上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>loose T-shirt\u003c/td>\n\u003ctd>宽松 T 恤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>overthink my outfit\u003c/td>\n\u003ctd>纠结我的穿搭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>But if there’s a special occasion\u003c/td>\n\u003ctd>但如果在特殊场合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ll try to step up my game\u003c/td>\n\u003ctd>我将会精心打扮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look more professional\u003c/td>\n\u003ctd>看起来更专业\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>comfortable and casual clothes\u003c/td>\n\u003ctd>舒适休闲的衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend most of my time at school\u003c/td>\n\u003ctd>我大部分时间都在学校\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outdoor activities\u003c/td>\n\u003ctd>户外活动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me feel relaxed and free to move around\u003c/td>\n\u003ctd>让我更轻松、活动更自在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>smart clothes\u003c/td>\n\u003ctd>正式服装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for important occasions like interviews\u003c/td>\n\u003ctd>为了重要场合，例如面试\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>super practical\u003c/td>\n\u003ctd>非常实用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>easy to match with other clothes\u003c/td>\n\u003ctd>容易搭配其他衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plain T-shirts\u003c/td>\n\u003ctd>基础款 T 恤、素色 T 恤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pair them with jeans and sports shorts\u003c/td>\n\u003ctd>把他们和牛仔裤、运动短裤搭配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>They are also perfect for\u003c/td>\n\u003ctd>他们在.....下也很棒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hot summer day\u003c/td>\n\u003ctd>夏天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I wear them almost every day\u003c/td>\n\u003ctd>我几乎每天都穿它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when the weather is warm\u003c/td>\n\u003ctd>天气热的时候\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I almost never spend much time doing sth\u003c/td>\n\u003ctd>我几乎不会花太多时间做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>simple basic items\u003c/td>\n\u003ctd>简单的基础款单品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go well with each other\u003c/td>\n\u003ctd>互相适配、百搭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>grab whatever is nearby\u003c/td>\n\u003ctd>顺手拿身边的衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It usually takes me less than five minutes to do\u003c/td>\n\u003ctd>做某事通常花不了我五分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get dressed\u003c/td>\n\u003ctd>穿好衣服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>don‘t care too much about\u003c/td>\n\u003ctd>不会在意太多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look fancy\u003c/td>\n\u003ctd>看起来精致讲究\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. What kind of clothes do you like to wear?\u003c/h2>\n\u003cp>Honestly, I prefer keeping it simple and staying comfortable. Most days, I just throw on a pair of jeans and a loose T-shirt, because I don’t want to overthink my outfit in the morning. But if there’s an important occasion, I’ll try to step up my game to look more professional\u003c/p>\n\u003cp>说实话，我偏爱简约舒适的穿搭。平日里我随便套一条牛仔裤和宽松短袖就出门，我不想早上花太多心思纠结穿搭。但如果遇上特殊场合，我会精心打扮一下，让我看起来更专业。\u003c/p>\n\u003ch3 id=\"h2\">2. Do you prefer to wear comfortable and casual clothes or smart clothes?\u003c/h3>\n\u003cp>Well, I definitely prefer comfortable and casual clothes in daily life. I spend most of my time at school or doing outdoor activities, so casual clothes make me feel relaxed and free to move around. I only wear smart clothes for important occasions like interviews.\u003c/p>\n\u003cp>嗯，日常生活里我肯定更喜欢舒适休闲的衣服。我大部分时间都在学校或者做户外活动，休闲装让我觉得放松，活动起来也自在。我只有在面试这类重要场合，才会穿正式的衣服。\u003c/p>\n\u003ch3 id=\"h3\">3. Do you like wearing T-shirts?\u003c/h3>\n\u003cp>Yes, I really like them. \u003cmark>T-shirts are super practical and easy to match with other clothes\u003c/mark>. I have quite a few plain T-shirts in different colours, and I can pair them with jeans and sports shorts. \u003cmark>They are also perfect for hot summer days, so I wear them almost every day when the weather is warm.\u003c/mark>\u003c/p>\n\u003cp>是的，我特别喜欢穿 T 恤。T 恤特别实用，和其他衣服也很好搭。我有不少不同颜色的基础款 T 恤，配牛仔裤、运动短裤都可以。夏天热的时候穿 T 恤也很舒服，所以天气暖和的时候我几乎天天都穿。\u003c/p>\n\u003ch3 id=\"h4\">4. Do you spend a lot of time choosing clothes?\u003c/h3>\n\u003cp>No, not really. I almost never spend much time picking out outfits in the morning. Most of my clothes are simple basic items that go well with each other, so I can just grab whatever is nearby\u003cmark>. It usually takes me less than five minutes to get dressed, because I don’t care too much about looking fancy.\u003c/mark>\u003c/p>\n\u003cp>不，完全不会。我早上几乎从不花时间挑衣服。我大部分衣服都是简单的基础款，互相都能搭配，所以我随手拿上身边的衣服就行。通常穿衣服花不了我五分钟，因为我不太在意穿得多精致。\u003c/p>\n\u003chr>\n","toc":[{"level":2,"id":"h1","text":"1. What kind of clothes do you like to wear?"},{"level":3,"id":"h2","text":"2. Do you prefer to wear comfortable and casual clothes or smart clothes?"},{"level":3,"id":"h3","text":"3. Do you like wearing T-shirts?"},{"level":3,"id":"h4","text":"4. Do you spend a lot of time choosing clothes?"}],"text":"What kind of clothes do you like to wear? Do you prefer to wear comfortable and casual clothes or smart clothes? Do you like wearing T-shirts? Do you spend a lot of time choosing clothes? 英文短语 中文释义 keep it simple and stay comfortable 保持简约舒适风格 throw on 随手穿上、随便套上 loose T-shirt 宽松 T 恤 overthink my outfit 纠结我的穿搭 But if there’s a special occasion 但如果在特殊场合 I’ll try to step up my game 我将会精心打扮 look more professional 看起来更专业 comfortable and casual clothes 舒适休闲的衣服 spend most of my time at school 我大部分时间都在学校 outdoor activities 户外活动 make me feel relaxed and free to move around 让我更轻松、活动更自在 smart clothes 正式服装 for important occasions like interviews 为了重要场合，例如面试 super practical 非常实用 easy to match with other clothes 容易搭配其他衣服 plain T-shirts 基础款 T 恤、素色 T 恤 pair them with jeans and sports shorts 把他们和牛仔裤、运动短裤搭配 They are also perfect for 他们在.....下也很棒 hot summer day 夏天 I wear them almost every day 我几乎每天都穿它 when the weather is warm 天气热的时候 I almost never spend much time doing sth 我几乎不会花太多时间做某事 simple basic items 简单的基础款单品 go well with each other 互相适配、百搭 grab whatever is nearby 顺手拿身边的衣服 It usually takes me less than five minutes to do 做某事通常花不了我五分钟 get dressed 穿好衣服 don‘t care too much about 不会在意太多 look fancy 看起来精致讲究 1. What kind of clothes do you like to wear? Honestly, I prefer keeping it simple and staying comfortable. Most days, I just throw on a pair of jeans and a loose T-shirt, because I don’t want to overthink my outfit in the morning. But if there’s an important occasion, I’ll try to step up my game to look more professional 说实话，我偏爱简约舒适的穿搭。平日里我随便套一条牛仔裤和宽松短袖就出门，我不想早上花太多心思纠结穿搭。但如果遇上特殊场合，我会精心打扮一下，让我看起来更专业。 2. Do you prefer to wear comfortable and casual clothes or smart clothes? Well, I definitely prefer comfortable and casual clothes in daily life. I spend most of my time at school or doing outdoor activities, so casual clothes make me feel relaxed and free to move around. I only wear smart clothes for important occasions like interviews. 嗯，日常生活里我肯定更喜欢舒适休闲的衣服。我大部分时间都在学校或者做户外活动，休闲装让我觉得放松，活动起来也自在。我只有在面试这类重要场合，才会穿正式的衣服。 3. Do you like wearing T-shirts? Yes, I really like them. T-shirts are super practical and easy to match with other clothes. I have quite a few plain T-shirts in different colours, and I can pair them with jeans and sports shorts. They are also perfect for hot summer days, so I wear them almost every day when the weather is warm. 是的，我特别喜欢穿 T 恤。T 恤特别实用，和其他衣服也很好搭。我有不少不同颜色的基础款 T 恤，配牛仔裤、运动短裤都可以。夏天热的时候穿 T 恤也很舒服，所以天气暖和的时候我几乎天天都穿。 4. Do you spend a lot of time choosing clothes? No, not really. I almost never spend much time picking out outfits in the morning. Most of my clothes are simple basic items that go well with each other, so I can just grab whatever is nearby. It usually takes me less than five minutes to get dressed, because I don’t care too much about looking fancy. 不，完全不会。我早上几乎从不花时间挑衣服。我大部分衣服都是简单的基础款，互相都能搭配，所以我随手拿上身边的衣服就行。通常穿衣服花不了我五分钟，因为我不太在意穿得多精致。"},{"id":"a-p1-space","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/12-Outer space and stars.md","title":"Outer space and stars","html":"\u003cul>\n\u003cli>Have you ever learnt about outer space and stars?\u003c/li>\n\u003cli>Do you like science fiction movies? Why?\u003c/li>\n\u003cli>Do you want to know more about outer space?\u003c/li>\n\u003cli>Do you want to go into outer space in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>when I was in primary school\u003c/td>\n\u003ctd>当我在小学时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>they were not going to be on the examination\u003c/td>\n\u003ctd>他们将不会在考试中出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>only study for the exam\u003c/td>\n\u003ctd>只是为了考试而学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I don&#39;t need to take exams anymore\u003c/td>\n\u003ctd>我不用再考试了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have a strong interest in\u003c/td>\n\u003ctd>对… 产生兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>time travel\u003c/td>\n\u003ctd>时间旅行\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>they show amazing things that do not exist in real life\u003c/td>\n\u003ctd>影片展示现实生活中不存在的奇妙事物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>time travel\u003c/td>\n\u003ctd>时空穿梭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>alien planets\u003c/td>\n\u003ctd>外星行星\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me more curious about space travel\u003c/td>\n\u003ctd>勾起了我对太空旅行的好奇心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it’s also a good way to relax after studying\u003c/td>\n\u003ctd>也是很好的放松方式在学习之后\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>full of mysteries\u003c/td>\n\u003ctd>充满神秘感\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>satisfy my curiosity.\u003c/td>\n\u003ctd>满足我的好奇心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>find out more about\u003c/td>\n\u003ctd>更多地探索\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It has always been my life goal\u003c/td>\n\u003ctd>一直是我的人生目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>seeing the earth from space\u003c/td>\n\u003ctd>从太空看地球\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>would be really fantastic\u003c/mark>\u003c/td>\n\u003ctd>一定是无比震撼的体验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like people do in science movies.\u003c/td>\n\u003ctd>就像人在电影里做的那样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Maybe I will give it a try\u003c/td>\n\u003ctd>或许我将会去试一试。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when it becomes cheaper in the future.\u003c/td>\n\u003ctd>或许等到未来价格降低\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Have you ever learnt about outer space and stars?\u003c/h2>\n\u003cp>Yeah, I did. I learned some of it \u003cmark>when I was in primary school.\u003c/mark> But unfortunately, I have forgotten most of them, because \u003cmark>they were not going to be on the examination\u003c/mark> you know, most Chinese students \u003cmark>only study for the exam.\u003c/mark> But now, I don&#39;t need to take exams anymore, and I&#39;ve started to \u003cmark>have a strong interest in\u003c/mark> planets and outer space because recently I&#39;ve watched a movie about time travel which makes me want to learn more about astronomy \u003c/p>\n\u003cp>是的，我学过。我小学的时候接触过一些相关知识。但可惜的是，大部分内容我都记不清了。因为这些知识点不会出现在考试里，你也清楚，大多数中国学生学习只是为了应付考试。不过现在我不用再参加考试了，我对行星和外太空产生了浓厚的兴趣。前段时间我看了一部有关时空穿越的电影，这让我想要深入了解更多天文学知识。\u003c/p>\n\u003ch1>2. Do you like science fiction movies? Why?\u003c/h1>\n\u003cp>Yes, I&#39;m really interested in science fiction movies, because \u003cmark>they show amazing things that do not exist in real life\u003c/mark>, like time travel and alien planets. And they \u003cmark>make me more curious about\u003c/mark> space travel.  Also, it’s a good way to relax after studying.\u003c/p>\n\u003cp>我非常喜欢科幻电影。看科幻片特别有意思，影片里会出现现实生活中不存在的奇妙事物，比如时空穿梭、外星行星。它们还勾起了我对太空旅行的好奇心。除此之外，看完书之后看科幻电影也是很好的放松方式，\u003c/p>\n\u003ch1>3. Do you want to know more about outer space?\u003c/h1>\n\u003cp>Definitely. I think outer space is \u003cmark>full of mysteries\u003c/mark>, and learning about it is really interesting.  I always watch some videos about planets online to \u003cmark>satisfy my curiosity.\u003c/mark> I’d love to \u003cmark>find out more about\u003c/mark> the universe later on.\u003c/p>\n\u003cp>当然想。我觉得外太空充满未解之谜，了解相关知识十分有趣。最近我偶尔会在网上看行星相关短视频，满足自己的好奇心。我以后也想更多地探索宇宙的奥秘。\u003c/p>\n\u003ch1>4. Do you want to go into outer space in the future?\u003c/h1>\n\u003cp>It has always been my life goal. Seeing the Earth from space \u003cmark>would be really fantastic\u003c/mark>. I even want to visit Mars \u003cmark>just like people do in science movies.\u003c/mark>\u003cbr>But space travel is far too expensive for ordinary people right now. Maybe I will give it a try when it becomes cheaper in the future.\u003c/p>\n\u003cp>这一直是我的人生目标。从太空俯瞰地球一定是无比震撼的体验，我甚至想像电影里那样去火星看看。但目前太空旅行对普通人来说实在太贵了。或许等到未来价格降低，我会去试一试。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Have you ever learnt about outer space and stars?"}],"text":"Have you ever learnt about outer space and stars? Do you like science fiction movies? Why? Do you want to know more about outer space? Do you want to go into outer space in the future? 英文短语 中文释义 when I was in primary school 当我在小学时候 they were not going to be on the examination 他们将不会在考试中出现 only study for the exam 只是为了考试而学习 I don't need to take exams anymore 我不用再考试了 have a strong interest in 对… 产生兴趣 time travel 时间旅行 they show amazing things that do not exist in real life 影片展示现实生活中不存在的奇妙事物 time travel 时空穿梭 alien planets 外星行星 make me more curious about space travel 勾起了我对太空旅行的好奇心 it’s also a good way to relax after studying 也是很好的放松方式在学习之后 full of mysteries 充满神秘感 satisfy my curiosity. 满足我的好奇心 find out more about 更多地探索 It has always been my life goal 一直是我的人生目标 seeing the earth from space 从太空看地球 would be really fantastic 一定是无比震撼的体验 just like people do in science movies. 就像人在电影里做的那样 Maybe I will give it a try 或许我将会去试一试。 when it becomes cheaper in the future. 或许等到未来价格降低 1. Have you ever learnt about outer space and stars? Yeah, I did. I learned some of it when I was in primary school. But unfortunately, I have forgotten most of them, because they were not going to be on the examination you know, most Chinese students only study for the exam. But now, I don't need to take exams anymore, and I've started to have a strong interest in planets and outer space because recently I've watched a movie about time travel which makes me want to learn more about astronomy 是的，我学过。我小学的时候接触过一些相关知识。但可惜的是，大部分内容我都记不清了。因为这些知识点不会出现在考试里，你也清楚，大多数中国学生学习只是为了应付考试。不过现在我不用再参加考试了，我对行星和外太空产生了浓厚的兴趣。前段时间我看了一部有关时空穿越的电影，这让我想要深入了解更多天文学知识。 2. Do you like science fiction movies? Why? Yes, I'm really interested in science fiction movies, because they show amazing things that do not exist in real life, like time travel and alien planets. And they make me more curious about space travel. Also, it’s a good way to relax after studying. 我非常喜欢科幻电影。看科幻片特别有意思，影片里会出现现实生活中不存在的奇妙事物，比如时空穿梭、外星行星。它们还勾起了我对太空旅行的好奇心。除此之外，看完书之后看科幻电影也是很好的放松方式， 3. Do you want to know more about outer space? Definitely. I think outer space is full of mysteries, and learning about it is really interesting. I always watch some videos about planets online to satisfy my curiosity. I’d love to find out more about the universe later on. 当然想。我觉得外太空充满未解之谜，了解相关知识十分有趣。最近我偶尔会在网上看行星相关短视频，满足自己的好奇心。我以后也想更多地探索宇宙的奥秘。 4. Do you want to go into outer space in the future? It has always been my life goal. Seeing the Earth from space would be really fantastic. I even want to visit Mars just like people do in science movies. But space travel is far too expensive for ordinary people right now. Maybe I will give it a try when it becomes cheaper in the future. 这一直是我的人生目标。从太空俯瞰地球一定是无比震撼的体验，我甚至想像电影里那样去火星看看。但目前太空旅行对普通人来说实在太贵了。或许等到未来价格降低，我会去试一试。"},{"id":"a-p1-singing","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/13-singing.md","title":"Singing","html":"\u003cul>\n\u003cli>Do you like singing? Why?\u003c/li>\n\u003cli>Have you ever learnt how to sing?\u003c/li>\n\u003cli>Who do you want to sing for?\u003c/li>\n\u003cli>Do you think singing can bring happiness to people?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>I’m really bad at it\u003c/td>\n\u003ctd>我唱得特别差\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go out of tune\u003c/td>\n\u003ctd>跑调\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nobody taught me at home\u003c/td>\n\u003ctd>家里也没人教过我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve never tried to get better at it.\u003c/td>\n\u003ctd>也从来没想过做的更好\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve never really thought about it.\u003c/td>\n\u003ctd>我没有仔细想过这个问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just for fun at parties\u003c/td>\n\u003ctd>只是为了在聚会上图个乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’d feel too nervous and embarrassed\u003c/td>\n\u003ctd>我会特别紧张、难为情。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is an easy way for people to feel happy\u003c/td>\n\u003ctd>是一个获得快乐的简单方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>let out stress\u003c/td>\n\u003ctd>释放压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>forget about daily worries\u003c/td>\n\u003ctd>忘掉日常的烦心事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get along better.\u003c/td>\n\u003ctd>增进彼此感情\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>1. Do you like singing? Why?\u003c/h4>\n\u003cp>Not really. To be honest, I don’t like singing very much. I’m really bad at it and I often go out of tune. Actually, I know nothing about music. Whenever I sing, I sound really bad.\u003c/p>\n\u003cp>算不上喜欢。说实话，我并不怎么爱唱歌。我唱得特别差，还总跑调。其实我对音乐一窍不通，每次开口唱都难听极了。\u003c/p>\n\u003chr>\n\u003ch4>2. Have you ever learnt how to sing?\u003c/h4>\n\u003cp>No, I’ve never learned to sing properly. I never took any singing lessons, and nobody taught me at home. I just sing casually with friends, and I’ve never tried to get better at it.\u003c/p>\n\u003cp>没有，我从来没正经学过唱歌。我没上过任何歌唱课，家里也没人教过我。我只在和朋友相处时随便唱唱，也从来没想过要提升唱功。\u003c/p>\n\u003chr>\n\u003ch4>3. Who do you want to sing for?\u003c/h4>\n\u003cp>Hmm, \u003cmark>I’ve never really thought about it\u003c/mark>. I guess I’d sing for my close friends and family, \u003cmark>just for fun at parties.\u003c/mark> I would never sing in front of a lot of people, because \u003cmark>I’d feel too nervous and embarrassed.\u003c/mark>\u003c/p>\n\u003cp>嗯，我还真没仔细想过这个问题。我觉得我会唱给好朋友和家人听，就是在聚会上图个乐。我绝不会在很多人面前唱歌，因为我会特别紧张、难为情。\u003c/p>\n\u003chr>\n\u003ch4>4. Do you think singing can bring happiness to people?\u003c/h4>\n\u003cp>Yes, I definitely think so. Singing \u003cmark>is an easy way for people to feel happy\u003c/mark>. It can help them \u003cmark>let out stress\u003c/mark> and \u003cmark>forget about daily worries\u003c/mark>. What’s more, singing with friends is a great way to \u003cmark>have fun\u003c/mark> and \u003cmark>get along better.\u003c/mark>\u003c/p>\n\u003cp>当然了，我完全这么觉得。唱歌是人们获得快乐的简单方式。它能帮人们释放压力，忘掉日常的烦心事。而且和朋友一起唱歌既能玩得开心，还能增进彼此的感情。\u003c/p>\n","toc":[],"text":"Do you like singing? Why? Have you ever learnt how to sing? Who do you want to sing for? Do you think singing can bring happiness to people? 英文短语 中文释义 I’m really bad at it 我唱得特别差 go out of tune 跑调 nobody taught me at home 家里也没人教过我 I’ve never tried to get better at it. 也从来没想过做的更好 I’ve never really thought about it. 我没有仔细想过这个问题 just for fun at parties 只是为了在聚会上图个乐 I’d feel too nervous and embarrassed 我会特别紧张、难为情。 is an easy way for people to feel happy 是一个获得快乐的简单方式 let out stress 释放压力 forget about daily worries 忘掉日常的烦心事 get along better. 增进彼此感情 1. Do you like singing? Why? Not really. To be honest, I don’t like singing very much. I’m really bad at it and I often go out of tune. Actually, I know nothing about music. Whenever I sing, I sound really bad. 算不上喜欢。说实话，我并不怎么爱唱歌。我唱得特别差，还总跑调。其实我对音乐一窍不通，每次开口唱都难听极了。 2. Have you ever learnt how to sing? No, I’ve never learned to sing properly. I never took any singing lessons, and nobody taught me at home. I just sing casually with friends, and I’ve never tried to get better at it. 没有，我从来没正经学过唱歌。我没上过任何歌唱课，家里也没人教过我。我只在和朋友相处时随便唱唱，也从来没想过要提升唱功。 3. Who do you want to sing for? Hmm, I’ve never really thought about it. I guess I’d sing for my close friends and family, just for fun at parties. I would never sing in front of a lot of people, because I’d feel too nervous and embarrassed. 嗯，我还真没仔细想过这个问题。我觉得我会唱给好朋友和家人听，就是在聚会上图个乐。我绝不会在很多人面前唱歌，因为我会特别紧张、难为情。 4. Do you think singing can bring happiness to people? Yes, I definitely think so. Singing is an easy way for people to feel happy. It can help them let out stress and forget about daily worries. What’s more, singing with friends is a great way to have fun and get along better. 当然了，我完全这么觉得。唱歌是人们获得快乐的简单方式。它能帮人们释放压力，忘掉日常的烦心事。而且和朋友一起唱歌既能玩得开心，还能增进彼此的感情。"},{"id":"a-p1-sports","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/14-Sports programs.md","title":"Sports programs","html":"\u003cul>\n\u003cli>Do you prefer to watch sports games alone or with a group of friends?\u003c/li>\n\u003cli>Have you ever watched a sports game in a stadium?\u003c/li>\n\u003cli>Do you like watching sports programs on TV?\u003c/li>\n\u003cli>Do you like to watch live sports games?\u003c/li>\n\u003cli>Who do you like to watch sports games with?\u003c/li>\n\u003cli>What kinds of games do you expect to watch in the future?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>It’s much more fun to\u003c/td>\n\u003ctd>有意思多了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer for teams together\u003c/td>\n\u003ctd>大家一起为球队加油\u003c/td>\n\u003c/tr>\n\u00
