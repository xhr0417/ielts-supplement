most great comedies have a tragic core beneath all the laughter. 我喜欢看喜剧电影，能从中收获很多。实际上我认为，大多数优秀喜剧在欢声笑语之下，内核其实是悲剧。 4. Have you ever watched a live show? Yes, I have watched a live stand-up comedy show. I have to say that The live atmosphere was fantastic. totally different from watching on TV. It's also a good way to relax after studying. 我看过现场脱口秀。现场氛围特别棒，是忙碌之余放松身心的绝佳方式。"},{"id":"a-p1-mock","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/技巧.md","title":"口语模考提示词","html":"\u003cp>你现在是持有IELTS官方认证的资深口语考官，请严格按照雅思口语Part 1、Part 2、Part 3的流程对我进行全真模考\u003c/p>\n\u003cp>你现在是持有IELTS官方认证的资深口语考官，清对我进行part1部分的考试，只能出我给你题库里的题，全真模考\u003c/p>\n\u003cp>要求每个问题回答约30s\u003cbr>要求，相关内容参考我给你的markdown文件\u003cbr>1.gibberish(填充，连接，重复）\u003cbr>2.hink out of the box\u003cbr>(简单一点就是communication 少做归纳，对做演绎(时间地点人物感受) 简单的东西说利索\u003cbr>3.collocation(固定搭配，讲到固定搭配的时候不能停\u003c/p>\n\u003cp>例如\u003cbr>你学过跟星星和外太空有关的知识吗？\u003cbr>\u003cstrong>Have you learnt any knowledge about outer space and planets?\u003c/strong>\u003cbr>yeah,I did,I learned some when I was in my primary school.But unfortunately,I have forgotten most of them.  because they were not going to be on the examination you know most of Chinese students only study for the exam. But now, I don&#39;t need to take exams anymore , I start to have a strong interest in planets and outer space because recently I&#39;ve watched a movie about time traveling which makes me want to learn more about astronomy .I even dream that one day I could go to another planet if it&#39;s not that expensive.\u003c/p>\n\u003cp>md文档是我现有  p1p2积累的素材，基于此，\u003cbr>给我6.0水平的p3口语文案，要求尽可能简单，好记忆\u003cbr>内容要求连贯，我说了上句能一下子想起来下一句话\u003c/p>\n","toc":[],"text":"你现在是持有IELTS官方认证的资深口语考官，请严格按照雅思口语Part 1、Part 2、Part 3的流程对我进行全真模考 你现在是持有IELTS官方认证的资深口语考官，清对我进行part1部分的考试，只能出我给你题库里的题，全真模考 要求每个问题回答约30s 要求，相关内容参考我给你的markdown文件 1.gibberish(填充，连接，重复） 2.hink out of the box (简单一点就是communication 少做归纳，对做演绎(时间地点人物感受) 简单的东西说利索 3.collocation(固定搭配，讲到固定搭配的时候不能停 例如 你学过跟星星和外太空有关的知识吗？ Have you learnt any knowledge about outer space and planets? yeah,I did,I learned some when I was in my primary school.But unfortunately,I have forgotten most of them. because they were not going to be on the examination you know most of Chinese students only study for the exam. But now, I don't need to take exams anymore , I start to have a strong interest in planets and outer space because recently I've watched a movie about time traveling which makes me want to learn more about astronomy .I even dream that one day I could go to another planet if it's not that expensive. md文档是我现有 p1p2积累的素材，基于此， 给我6.0水平的p3口语文案，要求尽可能简单，好记忆 内容要求连贯，我说了上句能一下子想起来下一句话"},{"id":"a-p2-01","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/1-推荐旅行地方.md","title":"P2-1 推荐旅行地方","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>Where it is\u003c/li>\n\u003cli>What you saw and did there\u003c/li>\n\u003cli>And explain why you would like to recommend it to others\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>There is a famous saying\u003c/td>\n\u003ctd>有一句著名的俗语\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>ranks first under heaven\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>桂林山水甲天下\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo’s scenery tops Guilin\u003c/td>\n\u003ctd>阳朔山水甲桂林\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from an early age, approximately when I was in primary school\u003c/td>\n\u003ctd>小时候，大概在上小学的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my parents\u003c/td>\n\u003ctd>和父母一同前往\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it did not leave a deep impression on me\u003c/td>\n\u003ctd>没有给我留下很深的印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the weather was hot and humid\u003c/td>\n\u003ctd>气候湿热\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>countless mountains\u003c/td>\n\u003ctd>数不胜数的山峰\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>got into rock climbing\u003c/td>\n\u003ctd>迷上了攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>climbing for two months\u003c/td>\n\u003ctd>练习两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor rock climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>found out\u003c/td>\n\u003ctd>了解到；得知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the birthplace of outdoor rock climbing\u003c/td>\n\u003ctd>野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stays around 20 degrees\u003c/td>\n\u003ctd>气温维持在 20 摄氏度左右\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>all year round\u003c/td>\n\u003ctd>全年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>The most fantastic feature\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>最绝妙的特色\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>unique karst landscape\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>独特的喀斯特地貌\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>more than 70 climbing crags\u003c/td>\n\u003ctd>超过 70 处攀岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since I am still a student\u003c/td>\n\u003ctd>因为我还是学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked as a volunteer\u003c/td>\n\u003ctd>做志愿者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>local inn\u003c/td>\n\u003ctd>当地民宿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked one day and went rock climbing the next\u003c/td>\n\u003ctd>工作一天，隔天去攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rode an electric bike\u003c/td>\n\u003ctd>骑电动车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a bowl of rice noodles\u003c/td>\n\u003ctd>一碗米粉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which only cost six yuan\u003c/td>\n\u003ctd>只需要 6 元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下极其深刻的印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whether you are into rock climbing or not\u003c/td>\n\u003ctd>无论你是否喜欢攀岩\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. 开题\u003c/h3>\n\u003cp>I’d like to recommend Yangshuo to others. It’s located in Guilin, Guangxi Province \u003cmark>in southern China\u003c/mark>. \u003cmark>There is a famous saying:\u003c/mark> \u003cmark>Guilin’s scenery ranks first under heaven,\u003c/mark> and \u003cmark>Yangshuo’s scenery tops Guilin.\u003c/mark>\u003c/p>\n\u003cp>我想向大家推荐阳朔。它位于中国南部广西桂林。有一句著名的俗语：桂林山水甲天下，阳朔山水甲桂林。\u003c/p>\n\u003ch3 id=\"h2\">2. 历史\u003c/h3>\n\u003cp>I first visited Yangshuo \u003cmark>from an early age, approximately when I was in primary school,\u003c/mark> \u003cmark>together with my parents.\u003c/mark> To be honest, \u003cmark>it did not leave a deep impression on me\u003c/mark> back then. I only remembered that \u003cmark>the weather was hot and humid\u003c/mark>, and there were \u003cmark>countless mountains.\u003c/mark>\u003c/p>\n\u003cp>我小时候第一次来到阳朔，大概在上小学的时候，和父母一同前往。说实话，当时这里并没有给我留下很深的印象，我只记得气候湿热，随处都是山峰。\u003c/p>\n\u003ch3 id=\"h3\">3. 过程\u003c/h3>\n\u003ch4>起因\u003c/h4>\n\u003cp>Last year, I \u003cmark>got into rock climbing.\u003c/mark> After \u003cmark>climbing for two months\u003c/mark>, I wanted to \u003cmark>try outdoor climbing\u003c/mark>. Then I \u003cmark>found out\u003c/mark> that Yangshuo is \u003cmark>the birthplace of outdoor rock climbing\u003c/mark> in China. The temperature there \u003cmark>stays around 20 degrees\u003c/mark> \u003cmark>all year round\u003c/mark>. and the \u003cmark>unique karst landscape\u003c/mark> is fantastic . and there are \u003cmark>more than 70 climbing crags.\u003c/mark>\u003c/p>\n\u003cp>去年，我迷上了攀岩。在室内攀岩馆练习两个月后，我想要尝试野外攀岩。随后我了解到，阳朔是中国野外攀岩的发源地。当地全年气温维持在 20 摄氏度左右。最让人难忘的特色就是独特的喀斯特地貌，这里拥有超过 70 处攀岩岩壁。\u003c/p>\n\u003ch4>事件\u003c/h4>\n\u003cp>So I went there last September. \u003cmark>Since I am still a student\u003c/mark> and didn’t have much money, so I \u003cmark>worked as a volunteer\u003c/mark> in a \u003cmark>local inn\u003c/mark> for roughly two months. \u003cmark>The deal was great\u003c/mark> — I \u003cmark>worked one day\u003c/mark> and \u003cmark>went rock climbing the next.\u003c/mark> In the morning, I usually \u003cmark>rode an electric bike\u003c/mark> to the crags. It was really convenient. In the afternoon, I often \u003cmark>had a bowl of rice noodles\u003c/mark>, \u003cmark>which only cost six yuan\u003c/mark>. This period of time \u003cmark>left a deep impression on me.\u003c/mark>\u003c/p>\n\u003cp>于是去年九月我去到阳朔。因为我还是学生，没有太多积蓄。我在当地一家民宿做志愿者，持续大约两个月。我工作一天，隔天就去攀岩。我经常骑电动车前往攀岩点，出行十分方便。中午我常会吃一碗米粉，只需要 6 元。这段时光给我留下了极其深刻的印象。\u003c/p>\n\u003ch3 id=\"h4\">4. 结果\u003c/h3>\n\u003cp>Therefore, I strongly recommend Yangshuo to everyone, \u003cmark>whether you are into rock climbing or not.\u003c/mark>\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. 开题"},{"level":3,"id":"h2","text":"2. 历史"},{"level":3,"id":"h3","text":"3. 过程"},{"level":3,"id":"h4","text":"4. 结果"}],"text":"You should say: What it is Where it is What you saw and did there And explain why you would like to recommend it to others 英文短语 中文释义 in southern China 在中国南部 There is a famous saying 有一句著名的俗语 ranks first under heaven 桂林山水甲天下 Yangshuo’s scenery tops Guilin 阳朔山水甲桂林 from an early age, approximately when I was in primary school 小时候，大概在上小学的时候 together with my parents 和父母一同前往 it did not leave a deep impression on me 没有给我留下很深的印象 the weather was hot and humid 气候湿热 countless mountains 数不胜数的山峰 got into rock climbing 迷上了攀岩 climbing for two months 练习两个月 try outdoor rock climbing 尝试野外攀岩 found out 了解到；得知 the birthplace of outdoor rock climbing 野外攀岩的发源地 stays around 20 degrees 气温维持在 20 摄氏度左右 all year round 全年 The most fantastic feature 最绝妙的特色 unique karst landscape 独特的喀斯特地貌 more than 70 climbing crags 超过 70 处攀岩岩壁 Since I am still a student 因为我还是学生 worked as a volunteer 做志愿者 local inn 当地民宿 worked one day and went rock climbing the next 工作一天，隔天去攀岩 rode an electric bike 骑电动车 a bowl of rice noodles 一碗米粉 which only cost six yuan 只需要 6 元 left a deep impression on me 给我留下极其深刻的印象 whether you are into rock climbing or not 无论你是否喜欢攀岩 1. 开题 I’d like to recommend Yangshuo to others. It’s located in Guilin, Guangxi Province in southern China. There is a famous saying: Guilin’s scenery ranks first under heaven, and Yangshuo’s scenery tops Guilin. 我想向大家推荐阳朔。它位于中国南部广西桂林。有一句著名的俗语：桂林山水甲天下，阳朔山水甲桂林。 2. 历史 I first visited Yangshuo from an early age, approximately when I was in primary school, together with my parents. To be honest, it did not leave a deep impression on me back then. I only remembered that the weather was hot and humid, and there were countless mountains. 我小时候第一次来到阳朔，大概在上小学的时候，和父母一同前往。说实话，当时这里并没有给我留下很深的印象，我只记得气候湿热，随处都是山峰。 3. 过程 起因 Last year, I got into rock climbing. After climbing for two months, I wanted to try outdoor climbing. Then I found out that Yangshuo is the birthplace of outdoor rock climbing in China. The temperature there stays around 20 degrees all year round. and the unique karst landscape is fantastic . and there are more than 70 climbing crags. 去年，我迷上了攀岩。在室内攀岩馆练习两个月后，我想要尝试野外攀岩。随后我了解到，阳朔是中国野外攀岩的发源地。当地全年气温维持在 20 摄氏度左右。最让人难忘的特色就是独特的喀斯特地貌，这里拥有超过 70 处攀岩岩壁。 事件 So I went there last September. Since I am still a student and didn’t have much money, so I worked as a volunteer in a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. In the morning, I usually rode an electric bike to the crags. It was really convenient. In the afternoon, I often had a bowl of rice noodles, which only cost six yuan. This period of time left a deep impression on me. 于是去年九月我去到阳朔。因为我还是学生，没有太多积蓄。我在当地一家民宿做志愿者，持续大约两个月。我工作一天，隔天就去攀岩。我经常骑电动车前往攀岩点，出行十分方便。中午我常会吃一碗米粉，只需要 6 元。这段时光给我留下了极其深刻的印象。 4. 结果 Therefore, I strongly recommend Yangshuo to everyone, whether you are into rock climbing or not."},{"id":"a-p2-02","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/2-早起经历.md","title":"P2-2 早起经历","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When it was\u003c/li>\n\u003cli>What you did\u003c/li>\n\u003cli>Why you got up early\u003c/li>\n\u003cli>And how you felt about it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a morning person\u003c/td>\n\u003ctd>习惯早起的人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I feel more energetic and focused\u003c/td>\n\u003ctd>精力更充沛、注意力更集中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deal with difficult problems\u003c/td>\n\u003ctd>处理难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>things totally changed\u003c/td>\n\u003ctd>情况彻底改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I got into rock climbing\u003c/td>\n\u003ctd>迷上攀岩之后\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It was last September\u003c/td>\n\u003ctd>那是去年九月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked as a volunteer\u003c/td>\n\u003ctd>做义工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at a local inn\u003c/td>\n\u003ctd>在当地一家客栈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for roughly two months\u003c/td>\n\u003ctd>大约两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The deal was great\u003c/td>\n\u003ctd>安排十分划算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>went rock climbing the next\u003c/td>\n\u003ctd>第二天去攀岩\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>my climbing partner\u003c/td>\n\u003ctd>我的攀岩搭档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We got up at half past five\u003c/td>\n\u003ctd>我们五点半起床\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TV Tower Mountain\u003c/td>\n\u003ctd>电视塔山\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reach the top\u003c/td>\n\u003ctd>抵达山顶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just in time for the sunrise\u003c/td>\n\u003ctd>刚好赶上日出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>we couldn’t see it every day\u003c/td>\n\u003ctd>不是每天都能看见日出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it depended on our luck\u003c/td>\n\u003ctd>这取决于我们的运气\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Getting up early\u003c/td>\n\u003ctd>早起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离城市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fully recharge my batteries\u003c/td>\n\u003ctd>充分恢复精力、调整状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I brought two sausages for them\u003c/td>\n\u003ctd>我带两根香肠喂它们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>walk all the way down with me\u003c/td>\n\u003ctd>一路陪我下山\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下很深的印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m still not a morning person\u003c/td>\n\u003ctd>我依旧不适合早起、不爱早起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me realise\u003c/td>\n\u003ctd>让我意识到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can be really nice\u003c/td>\n\u003ctd>其实十分美好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memorable experience\u003c/td>\n\u003ctd>难忘的经历\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>To be honest, I’m not really a morning person. Normally, \u003cmark>I feel more energetic and focused\u003c/mark> in the afternoon, so I usually \u003cmark>deal with difficult preoblems\u003c/mark> at that time. But \u003cmark>things totally changed\u003c/mark> last year \u003cmark>when I got into rock climbing.\u003c/mark>\u003c/p>\n\u003cp>说实话，我算不上习惯早起的人。通常我下午精力更充沛、注意力更集中，所以一般把难的任务放在下午处理。但去年我迷上攀岩之后，情况就完全变了。\u003c/p>\n\u003cp>\u003cmark>It was last September\u003c/mark>. I went to Yangshuo, Guangxi Province \u003cmark>in southern China\u003c/mark>. Since I was still a student and didn’t have much money, I \u003cmark>worked as a volunteer\u003c/mark> \u003cmark>at a local inn\u003c/mark> \u003cmark>for roughly two months.\u003c/mark> \u003cmark>The deal was great\u003c/mark> — I worked one day and \u003cmark>went rock climbing the next.\u003c/mark>\u003c/p>\n\u003cp>那是去年九月，我去了中国南方广西的阳朔。因为当时还是学生，没什么钱，我就在当地一家客栈做了大约两个月义工。安排特别划算 —— 做一天工，第二天就去攀岩。\u003c/p>\n\u003cp>There I met \u003cmark>my climbing partner\u003c/mark> Xiaoya, who was also a volunteer. \u003cmark>We got up at half past five\u003c/mark> every morning and \u003cmark>climbed TV Tower Mountain\u003c/mark>. It took us about 30 minutes \u003cmark>to reach the top\u003c/mark>, \u003cmark>just in time for the sunrise\u003c/mark>. Of course, \u003cmark>we couldn’t see it every day\u003c/mark>. it depended on our luck\u003c/p>\n\u003cp>在那儿我认识了攀岩搭档小娅，她也是义工。我们每天五点半起床，去爬电视塔山，大概 30 分钟到山顶，刚好赶上日出。当然也不是天天都能看到，得碰上好天气才行。\u003c/p>\n\u003cp>\u003cmark>Getting up early\u003c/mark> let me \u003cmark>take a break from city life\u003c/mark>, \u003cmark>soak up fresh air\u003c/mark> and \u003cmark>fully recharge my batteries\u003c/mark>. What’s more, there were two lovely dogs on the mountain. \u003cmark>I brought two sausages for them\u003c/mark> every morning, and they would \u003cmark>walk all the way down with me\u003c/mark>. That experience really \u003cmark>left a deep impression on me.\u003c/mark>\u003c/p>\n\u003cp>早起让我从城市生活里抽离出来，呼吸新鲜空气，好好调整状态。而且山上有两只很可爱的小狗，我每天早上带两根香肠喂它们，它们就会一路陪我下山。那段经历真的给我留下了很深的印象。\u003c/p>\n\u003cp>Overall, even though \u003cmark>I’m still not a morning person\u003c/mark>, that trip \u003cmark>made me realise\u003c/mark> early mornings \u003cmark>can be really nice\u003c/mark>. It was a very \u003cmark>memorable experience.\u003c/mark>\u003c/p>\n\u003cp>总的来说，虽然我现在还是不爱早起，但那次旅行让我发现清晨其实特别美好，是一段很难忘的经历。\u003c/p>\n","toc":[],"text":"You should say: When it was What you did Why you got up early And how you felt about it 英文短语 中文释义 a morning person 习惯早起的人 I feel more energetic and focused 精力更充沛、注意力更集中 deal with difficult problems 处理难题 things totally changed 情况彻底改变 when I got into rock climbing 迷上攀岩之后 It was last September 那是去年九月 in southern China 在中国南方 worked as a volunteer 做义工 at a local inn 在当地一家客栈 for roughly two months 大约两个月 The deal was great 安排十分划算 went rock climbing the next 第二天去攀岩 my climbing partner 我的攀岩搭档 We got up at half past five 我们五点半起床 TV Tower Mountain 电视塔山 reach the top 抵达山顶 just in time for the sunrise 刚好赶上日出 we couldn’t see it every day 不是每天都能看见日出 it depended on our luck 这取决于我们的运气 Getting up early 早起 take a break from urban life 暂时远离城市生活 soak up fresh air 呼吸新鲜空气 fully recharge my batteries 充分恢复精力、调整状态 I brought two sausages for them 我带两根香肠喂它们 walk all the way down with me 一路陪我下山 left a deep impression on me 给我留下很深的印象 I’m still not a morning person 我依旧不适合早起、不爱早起 made me realise 让我意识到 can be really nice 其实十分美好 memorable experience 难忘的经历 To be honest, I’m not really a morning person. Normally, I feel more energetic and focused in the afternoon, so I usually deal with difficult preoblems at that time. But things totally changed last year when I got into rock climbing. 说实话，我算不上习惯早起的人。通常我下午精力更充沛、注意力更集中，所以一般把难的任务放在下午处理。但去年我迷上攀岩之后，情况就完全变了。 It was last September. I went to Yangshuo, Guangxi Province in southern China. Since I was still a student and didn’t have much money, I worked as a volunteer at a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. 那是去年九月，我去了中国南方广西的阳朔。因为当时还是学生，没什么钱，我就在当地一家客栈做了大约两个月义工。安排特别划算 —— 做一天工，第二天就去攀岩。 There I met my climbing partner Xiaoya, who was also a volunteer. We got up at half past five every morning and climbed TV Tower Mountain. It took us about 30 minutes to reach the top, just in time for the sunrise. Of course, we couldn’t see it every day. it depended on our luck 在那儿我认识了攀岩搭档小娅，她也是义工。我们每天五点半起床，去爬电视塔山，大概 30 分钟到山顶，刚好赶上日出。当然也不是天天都能看到，得碰上好天气才行。 Getting up early let me take a break from city life, soak up fresh air and fully recharge my batteries. What’s more, there were two lovely dogs on the mountain. I brought two sausages for them every morning, and they would walk all the way down with me. That experience really left a deep impression on me. 早起让我从城市生活里抽离出来，呼吸新鲜空气，好好调整状态。而且山上有两只很可爱的小狗，我每天早上带两根香肠喂它们，它们就会一路陪我下山。那段经历真的给我留下了很深的印象。 Overall, even though I’m still not a morning person, that trip made me realise early mornings can be really nice. It was a very memorable experience. 总的来说，虽然我现在还是不爱早起，但那次旅行让我发现清晨其实特别美好，是一段很难忘的经历。"},{"id":"a-p2-03","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/3-想有空时去旅游的地方.md","title":"P2-3 想有空时去旅游的地方","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>Where it is\u003c/li>\n\u003cli>What you will do there\u003c/li>\n\u003cli>How long you will stay there\u003c/li>\n\u003cli>And explain why you would like to visit it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>One place I’d like to visit in my free time\u003c/td>\n\u003ctd>闲暇时我想去游览的一个地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>There is a famous saying\u003c/td>\n\u003ctd>有一句广为流传的说法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Guilin’s scenery ranks first under heaven\u003c/td>\n\u003ctd>桂林山水甲天下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo’s scenery tops Guilin\u003c/td>\n\u003ctd>阳朔山水甲桂林\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from an early age, approximately when I was in primary school\u003c/td>\n\u003ctd>小时候，大概在上小学的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my parents\u003c/td>\n\u003ctd>和父母一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it did not leave a deep impression on me\u003c/td>\n\u003ctd>没有给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the weather was hot and humid\u003c/td>\n\u003ctd>天气闷热潮湿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there were countless mountains\u003c/td>\n\u003ctd>群山连绵、有数不尽的山峰\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In recent years\u003c/td>\n\u003ctd>近几年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I have got into rock climbing\u003c/td>\n\u003ctd>我迷上了攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practising for two months\u003c/td>\n\u003ctd>练习两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>climbing vlogs\u003c/td>\n\u003ctd>攀岩短视频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>found out\u003c/td>\n\u003ctd>了解到，发现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the birthplace of outdoor rock climbing in China\u003c/td>\n\u003ctd>中国野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stays around 20 degrees all year round\u003c/td>\n\u003ctd>全年气温维持在 20 摄氏度左右\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most impressive feature\u003c/td>\n\u003ctd>最令人惊艳、最吸引人的特点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>its unique karst landscape\u003c/td>\n\u003ctd>独特的喀斯特地貌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there are more than 70 climbing crags\u003c/td>\n\u003ctd>拥有 70 余处攀岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>If I get the opportunity\u003c/td>\n\u003ctd>如果我有机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>travel there and climb for several months\u003c/td>\n\u003ctd>去那里旅行攀岩数月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离城市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>休整、恢复精力（地道口语短语）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>That’s exactly why I hope to travel there\u003c/td>\n\u003ctd>这正是我想去那里旅行的原因（结尾万能句）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>One place I’d like to visit in my free time\u003c/mark> is Yangshuo. It’s located in Guilin, Guangxi Province \u003cmark>in southern China.\u003c/mark> \u003cmark>There is a famous saying:\u003c/mark> \u003cmark>Guilin’s scenery ranks first under heaven,\u003c/mark> and \u003cmark>Yangshuo’s scenery tops Guilin.\u003c/mark>\u003c/p>\n\u003cp>闲暇时我想去游览的一个地方是阳朔。它位于中国南部广西桂林市。有一句广为流传的说法：桂林山水甲天下，阳朔山水甲桂林。\u003c/p>\n\u003cp>I first visited Yangshuo \u003cmark>from an early age, approximately when I was in primary school,\u003c/mark> \u003cmark>together with my parents.\u003c/mark> To be honest, \u003cmark>it did not leave a deep impression on me\u003c/mark> back then. I only remembered that \u003cmark>the weather was hot and humid,\u003c/mark> and \u003cmark>there were countless mountains.\u003c/mark>\u003cbr>我小时候第一次去阳朔，大概是上小学的时候，和父母一同前往。说实话，那时阳朔并没有给我留下深刻印象。我只记得当地天气闷热潮湿，群山连绵不绝。\u003c/p>\n\u003cp>\u003cmark>In recent years,\u003c/mark> \u003cmark>I have got into rock climbing\u003c/mark>. After \u003cmark>practising for two months,\u003c/mark> I really want to \u003cmark>try outdoor climbing\u003c/mark>. After watching lots of \u003cmark>climbing vlogs\u003c/mark> on YouTube and Bilibili,I \u003cmark>found out\u003c/mark> that Yangshuo is \u003cmark>the birthplace of outdoor rock climbing in China\u003c/mark>. The temperature there \u003cmark>stays around 20 degrees all year round\u003c/mark>. \u003cmark>The most impressive feature\u003c/mark> is \u003cmark>its unique karst landscape\u003c/mark>, and \u003cmark>there are more than 70 climbing crags.\u003c/mark>\u003c/p>\n\u003cp>近几年，我爱上了攀岩。经过两个月练习后，我十分想要尝试野外攀岩。我在油管和 B 站观看了许多攀岩短视频后了解到，阳朔是中国野外攀岩的发源地。当地全年气温大约维持在 20 摄氏度。最吸引人的就是独特的喀斯特地貌，而且这里拥有 70 余处攀岩岩壁。\u003c/p>\n\u003cp>\u003cmark>If I get the opportunity,\u003c/mark> I plan to \u003cmark>travel there and climb for several months.\u003c/mark> I hope to \u003cmark>take a break from urban life,\u003c/mark> \u003cmark>soak up some fresh air\u003c/mark> and \u003cmark>recharge my batteries.\u003c/mark> \u003cmark>That’s exactly why I hope to travel there.\u003c/mark>\u003c/p>\n\u003cp>如果有机会，我打算前往阳朔，在那里攀岩数月。我希望暂时远离城市生活，呼吸新鲜空气，好好休整恢复状态。这正是我想去那里旅行的原因。\u003c/p>\n\u003chr>\n","toc":[],"text":"You should say: Where it is What you will do there How long you will stay there And explain why you would like to visit it 英文短语 中文释义 One place I’d like to visit in my free time 闲暇时我想去游览的一个地方 in southern China 在中国南部 There is a famous saying 有一句广为流传的说法 Guilin’s scenery ranks first under heaven 桂林山水甲天下 Yangshuo’s scenery tops Guilin 阳朔山水甲桂林 from an early age, approximately when I was in primary school 小时候，大概在上小学的时候 together with my parents 和父母一起 it did not leave a deep impression on me 没有给我留下深刻印象 the weather was hot and humid 天气闷热潮湿 there were countless mountains 群山连绵、有数不尽的山峰 In recent years 近几年 I have got into rock climbing 我迷上了攀岩 practising for two months 练习两个月 try outdoor climbing 尝试野外攀岩 climbing vlogs 攀岩短视频 found out 了解到，发现 the birthplace of outdoor rock climbing in China 中国野外攀岩的发源地 stays around 20 degrees all year round 全年气温维持在 20 摄氏度左右 The most impressive feature 最令人惊艳、最吸引人的特点 its unique karst landscape 独特的喀斯特地貌 there are more than 70 climbing crags 拥有 70 余处攀岩岩壁 If I get the opportunity 如果我有机会 travel there and climb for several months 去那里旅行攀岩数月 take a break from urban life 暂时远离城市生活 soak up some fresh air 呼吸新鲜空气 recharge my batteries 休整、恢复精力（地道口语短语） That’s exactly why I hope to travel there 这正是我想去那里旅行的原因（结尾万能句） One place I’d like to visit in my free time is Yangshuo. It’s located in Guilin, Guangxi Province in southern China. There is a famous saying: Guilin’s scenery ranks first under heaven, and Yangshuo’s scenery tops Guilin. 闲暇时我想去游览的一个地方是阳朔。它位于中国南部广西桂林市。有一句广为流传的说法：桂林山水甲天下，阳朔山水甲桂林。 I first visited Yangshuo from an early age, approximately when I was in primary school, together with my parents. To be honest, it did not leave a deep impression on me back then. I only remembered that the weather was hot and humid, and there were countless mountains. 我小时候第一次去阳朔，大概是上小学的时候，和父母一同前往。说实话，那时阳朔并没有给我留下深刻印象。我只记得当地天气闷热潮湿，群山连绵不绝。 In recent years, I have got into rock climbing. After practising for two months, I really want to try outdoor climbing. After watching lots of climbing vlogs on YouTube and Bilibili,I found out that Yangshuo is the birthplace of outdoor rock climbing in China. The temperature there stays around 20 degrees all year round. The most impressive feature is its unique karst landscape, and there are more than 70 climbing crags. 近几年，我爱上了攀岩。经过两个月练习后，我十分想要尝试野外攀岩。我在油管和 B 站观看了许多攀岩短视频后了解到，阳朔是中国野外攀岩的发源地。当地全年气温大约维持在 20 摄氏度。最吸引人的就是独特的喀斯特地貌，而且这里拥有 70 余处攀岩岩壁。 If I get the opportunity, I plan to travel there and climb for several months. I hope to take a break from urban life, soak up some fresh air and recharge my batteries. That’s exactly why I hope to travel there. 如果有机会，我打算前往阳朔，在那里攀岩数月。我希望暂时远离城市生活，呼吸新鲜空气，好好休整恢复状态。这正是我想去那里旅行的原因。"},{"id":"a-p2-04","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/4-医疗行业人.md","title":"P2-4 医疗行业的人","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When you knew him/her\u003c/li>\n\u003cli>When he/she started to think about that\u003c/li>\n\u003cli>What he/she would like to do\u003c/li>\n\u003cli>And explain why he/she would like to choose this career\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>got to know each other\u003c/td>\n\u003ctd>互相认识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine doctor\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s interesting to note that\u003c/td>\n\u003ctd>有意思的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look like a doctor\u003c/td>\n\u003ctd>看起来像医生\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a doctor\u003c/td>\n\u003ctd>成为医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like me\u003c/td>\n\u003ctd>就像我一样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronics, mechanical engineering or computer science\u003c/td>\n\u003ctd>电子、机械工程或者计算机科学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>everything changed\u003c/td>\n\u003ctd>一切都改变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in his father&#39;s clinic\u003c/td>\n\u003ctd>在他父亲的诊所里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help many patients\u003c/td>\n\u003ctd>帮助很多病人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recover from illnesses\u003c/td>\n\u003ctd>摆脱病痛、康复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>offered free treatment\u003c/td>\n\u003ctd>提供免费诊疗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up his mind\u003c/td>\n\u003ctd>下定决心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses\u003c/td>\n\u003ctd>专业课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plenty of practical skills\u003c/td>\n\u003ctd>大量实用技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>makes him feel really rewarding\u003c/td>\n\u003ctd>让他很有成就感\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main reason for him to choose this job\u003c/td>\n\u003ctd>他选择这份工作最主要的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>admires his father’s spirit\u003c/td>\n\u003ctd>欣赏她父亲的精神\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so proud of\u003c/td>\n\u003ctd>为…… 感到十分骄傲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>studying medicine\u003c/td>\n\u003ctd>学医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is never an easy journey\u003c/td>\n\u003ctd>从来都不是一件容易的事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">- 1. When you knew him/her\u003c/h3>\n\u003cp>I’d like to talk about my best friend Kaiyao. We \u003cmark>got to know each other\u003c/mark> from an early age, approximately when I was in my primary school. His father is a \u003cmark>traditional chinese medicine doctor.\u003c/mark> \u003cmark>It’s interesting to note that\u003c/mark> \u003cmark>he doesn‘t look like a doctor at all\u003c/mark> — he is really tall and strong.\u003c/p>\n\u003cp>我想介绍我的好朋友凯耀。我们很小的时候就认识了，大概是在上小学的时候。他的父亲是一名中医。有趣的是，他看上去一点儿都不像医生 —— 他个子很高，体格健壮。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h2\">2. When he/she started to think about that\u003c/h3>\n\u003cp>At first, he didn&#39;t want to \u003cmark>being a doctor\u003c/mark> at all. He also wanted to become an engineer, \u003cmark>just like me\u003c/mark>. We planned to study \u003cmark>electronics, mechanical engineering or computer science.\u003c/mark>\u003cbr>However, \u003cmark>everything changed\u003c/mark> after he spent one summer working \u003cmark>in his father&#39;s clinic\u003c/mark>. He watched his father \u003cmark>help many patients\u003c/mark> \u003cmark>recover from illnesses\u003c/mark>. What’s more, his father \u003cmark>offered free treatment\u003c/mark> for poor people.\u003c/p>\n\u003cp>最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。\u003cbr>但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h3\">3.What he/she would like to do\u003c/h3>\n\u003cp>After that, he \u003cmark>made up his mind\u003c/mark> to learn \u003cmark>traditional Chinese medicine\u003c/mark> at university. Although some \u003cmark>professional courses\u003c/mark> are challenging, he can study \u003cmark>plenty of practical skills\u003c/mark> which \u003cmark>makes him feel rewarding.\u003c/mark>\u003c/p>\n\u003cp>在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。\u003c/p>\n\u003ch3 id=\"h4\">4. And explain why he/she would like to choose this career\u003c/h3>\n\u003chr>\n\u003cp>\u003cmark>The main reason for him to choose this job\u003c/mark> is that he really \u003cmark>admires his father’s spirit\u003c/mark>. He wants to become a doctor like his father one day. I am \u003cmark>so proud of\u003c/mark> Kaiyao, because \u003cmark>studying medicine\u003c/mark> \u003cmark>is never an easy journey.\u003c/mark>\u003c/p>\n\u003cp>他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"- 1. When you knew him/her"},{"level":3,"id":"h2","text":"2. When he/she started to think about that"},{"level":3,"id":"h3","text":"3.What he/she would like to do"},{"level":3,"id":"h4","text":"4. And explain why he/she would like to choose this career"}],"text":"You should say: When you knew him/her When he/she started to think about that What he/she would like to do And explain why he/she would like to choose this career 英文短语 中文释义 got to know each other 互相认识 traditional Chinese medicine doctor 中医 It’s interesting to note that 有意思的是 look like a doctor 看起来像医生 being a doctor 成为医生 just like me 就像我一样 electronics, mechanical engineering or computer science 电子、机械工程或者计算机科学 everything changed 一切都改变了 in his father's clinic 在他父亲的诊所里 help many patients 帮助很多病人 recover from illnesses 摆脱病痛、康复 offered free treatment 提供免费诊疗 made up his mind 下定决心 traditional Chinese medicine 中医 professional courses 专业课 plenty of practical skills 大量实用技能 makes him feel really rewarding 让他很有成就感 The main reason for him to choose this job 他选择这份工作最主要的原因 admires his father’s spirit 欣赏她父亲的精神 so proud of 为…… 感到十分骄傲 studying medicine 学医 is never an easy journey 从来都不是一件容易的事 - 1. When you knew him/her I’d like to talk about my best friend Kaiyao. We got to know each other from an early age, approximately when I was in my primary school. His father is a traditional chinese medicine doctor. It’s interesting to note that he doesn‘t look like a doctor at all — he is really tall and strong. 我想介绍我的好朋友凯耀。我们很小的时候就认识了，大概是在上小学的时候。他的父亲是一名中医。有趣的是，他看上去一点儿都不像医生 —— 他个子很高，体格健壮。 2. When he/she started to think about that At first, he didn't want to being a doctor at all. He also wanted to become an engineer, just like me. We planned to study electronics, mechanical engineering or computer science. However, everything changed after he spent one summer working in his father's clinic. He watched his father help many patients recover from illnesses. What’s more, his father offered free treatment for poor people. 最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。 但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。 3.What he/she would like to do After that, he made up his mind to learn traditional Chinese medicine at university. Although some professional courses are challenging, he can study plenty of practical skills which makes him feel rewarding. 在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。 4. And explain why he/she would like to choose this career The main reason for him to choose this job is that he really admires his father’s spirit. He wants to become a doctor like his father one day. I am so proud of Kaiyao, because studying medicine is never an easy journey. 他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。"},{"id":"a-p2-05","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/5-体育赛事 & 电视节目.md","title":"P2-5 体育赛事 & 电视节目","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it was\u003c/li>\n\u003cli>When and where you watched it\u003c/li>\n\u003cli>Who you watched it with\u003c/li>\n\u003cli>And explain why you liked it\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a TV show/online program you have watched recently   最近看过的电视/网络节目\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>What it is about\u003c/li>\n\u003cli>How often you watch it\u003c/li>\n\u003cli>And explain how you feel about it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>marathon competition\u003c/td>\n\u003ctd>马拉松比赛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>breaking two Challenge\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>破二挑战赛\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>took place in Vienna\u003c/td>\n\u003ctd>在维也纳举办\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The athlete was\u003c/td>\n\u003ctd>参赛运动员是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the first person to\u003c/td>\n\u003ctd>第一位……的人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>complete a marathon\u003c/td>\n\u003ctd>完成全程马拉松\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in two hours\u003c/td>\n\u003ctd>在两小时之内\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>live broadcast\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>现场直播\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my father\u003c/td>\n\u003ctd>和我的父亲一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>officially recognised\u003c/td>\n\u003ctd>官方认可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Even so\u003c/td>\n\u003ctd>即便如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>no human is limited\u003c/td>\n\u003ctd>人类没有极限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I was not interested in it at all\u003c/td>\n\u003ctd>我完全不感兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>felt really nervous\u003c/td>\n\u003ctd>感到非常紧张\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It almost felt like\u003c/td>\n\u003ctd>几乎感觉就像\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>crossed the finishing line\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>冲过终点线\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>less than two hours\u003c/td>\n\u003ctd>不到两小时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheered loudly with excitement\u003c/td>\n\u003ctd>激动地大声欢呼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>touched me deeply\u003c/td>\n\u003ctd>深深打动了我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer me up\u003c/td>\n\u003ctd>让我振作起来\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help me keep going\u003c/td>\n\u003ctd>帮助我坚持下去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>especially when I feel tired\u003c/td>\n\u003ctd>尤其当我感到疲惫时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>want to give up halfway\u003c/td>\n\u003ctd>想要半途而废\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>I’d like to talk about a famous \u003cmark>marathon competition\u003c/mark> called the \u003cmark>breaking 2 Challenge\u003c/mark>. It \u003cmark>took place in Vienna.\u003c/mark> \u003cmark>The athlete was\u003c/mark> Eliud Kipchoge from Kenya. He became \u003cmark>the first person to\u003c/mark> \u003cmark>complete a marathon\u003c/mark> \u003cmark>in two hours.\u003c/mark>\u003c/p>\n\u003cp>我想聊一场著名的马拉松挑战，名为 Ineos 1:59 挑战。赛事在奥地利维也纳举办。参赛选手是肯尼亚运动员埃利乌德・基普乔戈。他是人类历史上第一位全程马拉松跑进 2 小时的人。\u003c/p>\n\u003cp>I watched the \u003cmark>live broadcast\u003c/mark> at home when I was in my high school, \u003cmark>together with my father.\u003c/mark> This competition was not \u003cmark>officially recognised\u003c/mark> by World Athletics. \u003cmark>Even so\u003c/mark>, it proved that \u003cmark>no human is limited\u003c/mark>\u003c/p>\n\u003cp>初中的时候，我和父亲在家观看了这场直播。这场挑战没有得到国际田联官方认可。即便如此，它证明人类没有极限\u003c/p>\n\u003cp>At that time, my father loved running, but \u003cmark>I was not interested in it at all\u003c/mark>. I thought running was boring and tired. However, Kipchoge’s story really \u003cmark>left a deep impression on me\u003c/mark>. After that, I got into runing, even thought of going professionl, but unfortunately, i didn&#39;t succeed.\u003c/p>\n\u003cp>那时候，我的父亲热爱跑步，但我一点兴趣都没有，我觉得跑步很累。但是基普乔戈的故事深深吸引了我。\u003c/p>\n\u003cp>We \u003cmark>felt really nervous\u003c/mark> during the whole competition. \u003cmark>I almost felt like\u003c/mark> I was running with him. When Kipchoge \u003cmark>crossed the finishing line\u003c/mark> and the time was \u003cmark>less than two hours\u003c/mark>, my dad and I \u003cmark>cheered loudly with excitement.\u003c/mark>\u003c/p>\n\u003cp>整场挑战过程中我们都十分紧张，仿佛自己正在奔跑。当基普乔戈冲过终点线，计时器显示用时不足两小时，我和父亲激动地大声欢呼。\u003c/p>\n\u003cp>I love this sports event  because Kipchoge’s spirit \u003cmark>touched me deeply\u003c/mark>. It can really \u003cmark>cheer me up\u003c/mark> and \u003cmark>help me keep going\u003c/mark>, \u003cmark>especially when I feel tired\u003c/mark> and \u003cmark>want to give up halfway.\u003c/mark> \u003c/p>\n\u003cp>我喜欢这场赛事，主要是因为基普乔格的精神深深打动了我。这种精神能够鼓舞我、支撑我继续前行，尤其是在我身心疲惫、想要半途而废的时候。\u003c/p>\n\u003chr>\n\u003cp>I wanted to learn more about him, \u003cmark>both on training and competitions\u003c/mark>. I found he was \u003cmark>extremely strict with himself.\u003c/mark> \u003c/p>\n\u003cp>我开始关注他的比赛与训练。我发现他高度自律，对自己要求严苛。\u003c/p>\n","toc":[],"text":"You should say: What it was When and where you watched it Who you watched it with And explain why you liked it Describe a TV show/online program you have watched recently 最近看过的电视/网络节目 You should say: What it is What it is about How often you watch it And explain how you feel about it 英文短语 中文翻译 marathon competition 马拉松比赛 breaking two Challenge 破二挑战赛 took place in Vienna 在维也纳举办 The athlete was 参赛运动员是 the first person to 第一位……的人 complete a marathon 完成全程马拉松 in two hours 在两小时之内 live broadcast 现场直播 together with my father 和我的父亲一起 officially recognised 官方认可 Even so 即便如此 no human is limited 人类没有极限 I was not interested in it at all 我完全不感兴趣 left a deep impression on me 给我留下深刻印象 felt really nervous 感到非常紧张 It almost felt like 几乎感觉就像 crossed the finishing line 冲过终点线 less than two hours 不到两小时 cheered loudly with excitement 激动地大声欢呼 touched me deeply 深深打动了我 cheer me up 让我振作起来 help me keep going 帮助我坚持下去 especially when I feel tired 尤其当我感到疲惫时 want to give up halfway 想要半途而废 I’d like to talk about a famous marathon competition called the breaking 2 Challenge. It took place in Vienna. The athlete was Eliud Kipchoge from Kenya. He became the first person to complete a marathon in two hours. 我想聊一场著名的马拉松挑战，名为 Ineos 1:59 挑战。赛事在奥地利维也纳举办。参赛选手是肯尼亚运动员埃利乌德・基普乔戈。他是人类历史上第一位全程马拉松跑进 2 小时的人。 I watched the live broadcast at home when I was in my high school, together with my father. This competition was not officially recognised by World Athletics. Even so, it proved that no human is limited 初中的时候，我和父亲在家观看了这场直播。这场挑战没有得到国际田联官方认可。即便如此，它证明人类没有极限 At that time, my father loved running, but I was not interested in it at all. I thought running was boring and tired. However, Kipchoge’s story really left a deep impression on me. After that, I got into runing, even thought of going professionl, but unfortunately, i didn't succeed. 那时候，我的父亲热爱跑步，但我一点兴趣都没有，我觉得跑步很累。但是基普乔戈的故事深深吸引了我。 We felt really nervous during the whole competition. I almost felt like I was running with him. When Kipchoge crossed the finishing line and the time was less than two hours, my dad and I cheered loudly with excitement. 整场挑战过程中我们都十分紧张，仿佛自己正在奔跑。当基普乔戈冲过终点线，计时器显示用时不足两小时，我和父亲激动地大声欢呼。 I love this sports event because Kipchoge’s spirit touched me deeply. It can really cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 我喜欢这场赛事，主要是因为基普乔格的精神深深打动了我。这种精神能够鼓舞我、支撑我继续前行，尤其是在我身心疲惫、想要半途而废的时候。 I wanted to learn more about him, both on training and competitions. I found he was extremely strict with himself. 我开始关注他的比赛与训练。我发现他高度自律，对自己要求严苛。"},{"id":"a-p2-06","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/6-长久抱负、目标.md","title":"P2-6 长久抱负、目标","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>How long you have had this goal/ambition\u003c/li>\n\u003cli>What it is\u003c/li>\n\u003cli>How you will achieve it\u003c/li>\n\u003cli>And explain why you set it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>become an engineer\u003c/td>\n\u003ctd>成为一名工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>undergraduate studies\u003c/td>\n\u003ctd>本科学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Measurement, Control Technology and Instrument\u003c/td>\n\u003ctd>测控技术与仪器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hands-on experiments\u003c/td>\n\u003ctd>实验室里的实操实验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses are challenging\u003c/td>\n\u003ctd>专业课有难度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical skills\u003c/td>\n\u003ctd>实用的工程知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>makes me feel really rewarding\u003c/td>\n\u003ctd>让我收获满满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>finish my master’s degree\u003c/td>\n\u003ctd>完成硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At the same time\u003c/td>\n\u003ctd>与此同时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take some high-quality internships\u003c/td>\n\u003ctd>参加一些高质量实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve my practical skills\u003c/td>\n\u003ctd>提升实操能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>work as an engineer\u003c/td>\n\u003ctd>当一名工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>set this goal\u003c/td>\n\u003ctd>设立这个目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronic devices\u003c/td>\n\u003ctd>电子设备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>employment prospects\u003c/td>\n\u003ctd>就业前景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up my mind to learn it\u003c/td>\n\u003ctd>下定决心学它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>use my professional knowledge\u003c/td>\n\u003ctd>用我的专业知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>solve real-world problems\u003c/td>\n\u003ctd>解决现实问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>More specifically\u003c/td>\n\u003ctd>具体来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>optimize self-driving algorithms\u003c/td>\n\u003ctd>优化自动驾驶算法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agile but safe\u003c/td>\n\u003ctd>灵活且安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s challenging for me\u003c/td>\n\u003ctd>这对我来说有挑战\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today I’d like to talk about a long-term goal I have. My goal is to \u003cmark>become an engineer\u003c/mark> in the field of autonomous driving. \u003c/p>\n\u003cp>今天我想聊一个我的长期目标。我的目标是成为一名自动驾驶领域的工程师。\u003c/p>\n\u003chr>\n\u003cp> I’ve had this goal for about \u003cstrong>five years\u003c/strong>, ever since I started my \u003cmark>undergraduate studies\u003c/mark> in \u003cmark>Measurement, Control Technology and Instrument.\u003c/mark>  I really enjoy my studies, especially those \u003cmark>hands-on experiments\u003c/mark>. Although some \u003cmark>professional courses are challenging\u003c/mark>, I can learn lots of \u003cmark>practical skills\u003c/mark>. It always \u003cmark>makes me feel really rewarding.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>有这个目标多久了\u003c/strong> – 这个目标我已经有了\u003cstrong>大约四年\u003c/strong>，从我本科读测控技术与仪器专业开始。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。\u003c/p>\n\u003chr>\n\u003cp> Well, first, I’ll \u003cmark>\u003cstrong>finish my master’s degree\u003c/strong>\u003c/mark> in the next three years. \u003cmark>At the same time\u003c/mark>, I plan to \u003cmark>\u003cstrong>take some high-quality internships\u003c/strong>\u003c/mark> to \u003cmark>\u003cstrong>improve my practical skills\u003c/strong>.\u003c/mark> After graduation, I’ll \u003cmark>\u003cstrong>work as an engineer\u003c/strong>\u003c/mark> in an autonomous driving company. \u003c/p>\n\u003cp>\u003cstrong>如何实现\u003c/strong> – 首先，未来三年我会\u003cstrong>完成硕士学位\u003c/strong>。同时，我打算\u003cstrong>参加一些高质量的实习\u003c/strong>来\u003cstrong>提升实操能力\u003c/strong>。毕业后，我会在一家自动驾驶公司\u003cstrong>当工程师\u003c/strong>。我知道路还很长，但我准备好了。\u003c/p>\n\u003chr>\n\u003cp>I \u003cmark>set this goal\u003c/mark> for two reasons.\u003cbr>First, I’ve always been fascinated by \u003cmark>electronic devices\u003c/mark> when I was a kid. Besides,  The \u003cmark>employment prospects\u003c/mark> were promising, so I \u003cmark>made up my mind to learn it.\u003c/mark>\u003cbr>Apart from this, I hope I can \u003cmark>**use my professional knowledge\u003c/mark> to \u003cmark>solve real-world problems**\u003c/mark>. \u003cmark>More specifically,\u003c/mark> I want to \u003cmark>\u003cstrong>optimize self-driving algorithms\u003c/strong>\u003c/mark> to make them \u003cmark>\u003cstrong>agile but safe\u003c/strong>.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>为什么设立这个目标\u003c/strong> – 我设立这个目标有两个原因。第一，我从小就对电子设备着迷，所以工程学是我的热情所在。第二，我希望\u003cstrong>用专业知识解决现实问题\u003c/strong>。具体来说，我想优化自动驾驶算法，让它既灵活又安全。\u003c/p>\n\u003chr>\n\u003cp>So, that’s my long-term goal. \u003cmark>It’s challenging for me\u003c/mark>, but I believe I can make it.\u003cbr>所以，这就是我的长期目标。很有挑战，但我相信我能做到。\u003c/p>\n","toc":[],"text":"You should say: How long you have had this goal/ambition What it is How you will achieve it And explain why you set it 英文短语 中文翻译 become an engineer 成为一名工程师 undergraduate studies 本科学习 Measurement, Control Technology and Instrument 测控技术与仪器 hands-on experiments 实验室里的实操实验 professional courses are challenging 专业课有难度 practical skills 实用的工程知识 makes me feel really rewarding 让我收获满满 finish my master’s degree 完成硕士学位 At the same time 与此同时 take some high-quality internships 参加一些高质量实习 improve my practical skills 提升实操能力 work as an engineer 当一名工程师 set this goal 设立这个目标 electronic devices 电子设备 employment prospects 就业前景 made up my mind to learn it 下定决心学它 use my professional knowledge 用我的专业知识 solve real-world problems 解决现实问题 More specifically 具体来说 optimize self-driving algorithms 优化自动驾驶算法 agile but safe 灵活且安全 It’s challenging for me 这对我来说有挑战 Today I’d like to talk about a long-term goal I have. My goal is to become an engineer in the field of autonomous driving. 今天我想聊一个我的长期目标。我的目标是成为一名自动驾驶领域的工程师。 I’ve had this goal for about five years, ever since I started my undergraduate studies in Measurement, Control Technology and Instrument. I really enjoy my studies, especially those hands-on experiments. Although some professional courses are challenging, I can learn lots of practical skills. It always makes me feel really rewarding. 有这个目标多久了 – 这个目标我已经有了大约四年，从我本科读测控技术与仪器专业开始。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。 Well, first, I’ll finish my master’s degree in the next three years. At the same time, I plan to take some high-quality internships to improve my practical skills. After graduation, I’ll work as an engineer in an autonomous driving company. 如何实现 – 首先，未来三年我会完成硕士学位。同时，我打算参加一些高质量的实习来提升实操能力。毕业后，我会在一家自动驾驶公司当工程师。我知道路还很长，但我准备好了。 I set this goal for two reasons. First, I’ve always been fascinated by electronic devices when I was a kid. Besides, The employment prospects were promising, so I made up my mind to learn it. Apart from this, I hope I can **use my professional knowledge to solve real-world problems**. More specifically, I want to optimize self-driving algorithms to make them agile but safe. 为什么设立这个目标 – 我设立这个目标有两个原因。第一，我从小就对电子设备着迷，所以工程学是我的热情所在。第二，我希望用专业知识解决现实问题。具体来说，我想优化自动驾驶算法，让它既灵活又安全。 So, that’s my long-term goal. It’s challenging for me, but I believe I can make it. 所以，这就是我的长期目标。很有挑战，但我相信我能做到。"},{"id":"a-p2-07","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/7-无聊的地方&交通拥堵.md","title":"P2-7 无聊的地方 & 交通拥堵","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>Where it is\u003c/li>\n\u003cli>Who you went there with\u003c/li>\n\u003cli>What you did there\u003c/li>\n\u003cli>And explain why you think it is a boring place\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a time when you were stuck in a traffic jam for a very long time\u003c/h1>\n\u003cp>You should say: \u003c/p>\n\u003cul>\n\u003cli>When it happened \u003c/li>\n\u003cli>Where you were stuck \u003c/li>\n\u003cli>What you did while waiting \u003c/li>\n\u003cli>And explain how you felt in the traffic jam\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>a trip to the Qinling Mountains\u003c/code>\u003c/td>\n\u003ctd>一次去秦岭的旅行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>not far away,\u003c/code>\u003c/td>\n\u003ctd>不远，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>right to the south of the city\u003c/code>\u003c/td>\n\u003ctd>就在这座城市的南边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>go hiking there\u003c/code>\u003c/td>\n\u003ctd>去那里徒步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>early in the morning\u003c/code>\u003c/td>\n\u003ctd>一大早\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ran into a huge traffic jam\u003c/code>\u003c/td>\n\u003ctd>遇上了大堵车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>There was nothing to see but endless cars.\u003c/code>\u003c/td>\n\u003ctd>放眼望去只有望不到头的汽车。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>listen to some podcasts\u003c/code>\u003c/td>\n\u003ctd>收听一些播客\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stay sane\u003c/code>\u003c/td>\n\u003ctd>保持心态平稳（保持理智）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>chatted with my parents\u003c/code>\u003c/td>\n\u003ctd>和父母聊了聊天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>called my grandparents.\u003c/code>\u003c/td>\n\u003ctd>给祖父母打了电话。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>the foot of the mountain\u003c/code>\u003c/td>\n\u003ctd>山脚下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>take a break from urban life,\u003c/code>\u003c/td>\n\u003ctd>远离城市的喧嚣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>soak up some fresh air\u003c/code>\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>recharge my batteries.\u003c/code>\u003c/td>\n\u003ctd>休整放松（给自己充电）。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>there was rubbish everywhere\u003c/code>\u003c/td>\n\u003ctd>随处都是垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>along the road\u003c/code>\u003c/td>\n\u003ctd>沿着路\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>up to the mountain.\u003c/code>\u003c/td>\n\u003ctd>上山的（沿途）。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Even now\u003c/code>\u003c/td>\n\u003ctd>直到现在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>the most boring one\u003c/code>\u003c/td>\n\u003ctd>最无聊的一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>I have ever had\u003c/code>\u003c/td>\n\u003ctd>我曾经历过的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>recommend it to others.\u003c/code>\u003c/td>\n\u003ctd>把它推荐给任何人。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today, I&#39;ll talk about \u003cmark>a trip to the Qinling Mountains\u003c/mark> with my parents last year. The mountains are \u003cmark>not far away,\u003c/mark> \u003cmark>right to the south of the city\u003c/mark>. We planned to \u003cmark>go hiking there\u003c/mark> \u003cmark>early in the morning\u003c/mark>, but unfortunately, we \u003cmark>ran into a huge traffic jam\u003c/mark> for nearly two hours. \u003c/p>\n\u003cp>今天我想讲讲去年夏天我和父母去秦岭的一次旅行。秦岭就在城市南边不远处。我们原本计划一大早去那里徒步，但不巧的是，我们遇上大堵车，被困了将近两个小时。\u003c/p>\n\u003cp>I felt really bored at that time. \u003cmark>There was nothing to see but endless cars.\u003c/mark> I tried to \u003cmark>listen to some podcasts\u003c/mark> about technology and AI. I hoped they could help me \u003cmark>stay sane\u003c/mark>, but it didn&#39;t work. I also \u003cmark>chatted with my parents\u003c/mark> and \u003cmark>called my grandparents.\u003c/mark>\u003c/p>\n\u003cp>那段时间我感到十分无聊。放眼望去只有望不到头的汽车。我试着收听一些关于科技和人工智能的播客。我希望这些播客能让我保持心态平稳，但收效甚微。我也和父母聊了聊天，还给祖父母打了电话。\u003c/p>\n\u003cp>When we arrived at \u003cmark>the foot of the mountain\u003c/mark>, I had hoped to \u003cmark>take a break from urban life,\u003c/mark> \u003cmark>soak up some fresh air\u003c/mark> and \u003cmark>recharge my batteries.\u003c/mark> But \u003cmark>there was rubbish everywhere\u003c/mark> \u003cmark>along the road\u003c/mark> \u003cmark>up to the mountain.\u003c/mark> I was really disappointed, so we decided to \u003cmark>go back before reaching the top.\u003c/mark>\u003c/p>\n\u003cp>当我们抵达山脚下时，我原本期盼远离城市的喧嚣、呼吸新鲜空气、休整放松。可是上山的沿途随处都是垃圾。于是我们决定还没登顶就折返下山。\u003c/p>\n\u003cp>\u003cmark>Even now\u003c/mark>, I still think this trip was \u003cmark>the most boring one\u003c/mark> \u003cmark>I have ever had\u003c/mark>, and I would never \u003cmark>recommend it to others.\u003c/mark>\u003c/p>\n\u003cp>直到现在，我都认为这是我经历过最无聊的一次旅行，我绝不会把它推荐给任何人。\u003c/p>\n","toc":[],"text":"You should say: Where it is Who you went there with What you did there And explain why you think it is a boring place Describe a time when you were stuck in a traffic jam for a very long time You should say: When it happened Where you were stuck What you did while waiting And explain how you felt in the traffic jam 英文原短语 中文翻译 a trip to the Qinling Mountains 一次去秦岭的旅行 not far away, 不远， right to the south of the city 就在这座城市的南边 go hiking there 去那里徒步 early in the morning 一大早 ran into a huge traffic jam 遇上了大堵车 There was nothing to see but endless cars. 放眼望去只有望不到头的汽车。 listen to some podcasts 收听一些播客 stay sane 保持心态平稳（保持理智） chatted with my parents 和父母聊了聊天 called my grandparents. 给祖父母打了电话。 the foot of the mountain 山脚下 take a break from urban life, 远离城市的喧嚣 soak up some fresh air 呼吸新鲜空气 recharge my batteries. 休整放松（给自己充电）。 there was rubbish everywhere 随处都是垃圾 along the road 沿着路 up to the mountain. 上山的（沿途）。 Even now 直到现在 the most boring one 最无聊的一次 I have ever had 我曾经历过的 recommend it to others. 把它推荐给任何人。 Today, I'll talk about a trip to the Qinling Mountains with my parents last year. The mountains are not far away, right to the south of the city. We planned to go hiking there early in the morning, but unfortunately, we ran into a huge traffic jam for nearly two hours. 今天我想讲讲去年夏天我和父母去秦岭的一次旅行。秦岭就在城市南边不远处。我们原本计划一大早去那里徒步，但不巧的是，我们遇上大堵车，被困了将近两个小时。 I felt really bored at that time. There was nothing to see but endless cars. I tried to listen to some podcasts about technology and AI. I hoped they could help me stay sane, but it didn't work. I also chatted with my parents and called my grandparents. 那段时间我感到十分无聊。放眼望去只有望不到头的汽车。我试着收听一些关于科技和人工智能的播客。我希望这些播客能让我保持心态平稳，但收效甚微。我也和父母聊了聊天，还给祖父母打了电话。 When we arrived at the foot of the mountain, I had hoped to take a break from urban life, soak up some fresh air and recharge my batteries. But there was rubbish everywhere along the road up to the mountain. I was really disappointed, so we decided to go back before reaching the top. 当我们抵达山脚下时，我原本期盼远离城市的喧嚣、呼吸新鲜空气、休整放松。可是上山的沿途随处都是垃圾。于是我们决定还没登顶就折返下山。 Even now, I still think this trip was the most boring one I have ever had, and I would never recommend it to others. 直到现在，我都认为这是我经历过最无聊的一次旅行，我绝不会把它推荐给任何人。"},{"id":"a-p2-08","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/8-近期改变计划&想法.md","title":"P2-8 改变计划 & 想法","html":"\u003cp>描述一个你近期不得不更改的计划\u003c/p>\n\u003ch1>Describe a time when you changed an important opinion of yours\u003c/h1>\n\u003cp>描述一次你改变自己某个重要观点的经历\u003c/p>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When this happened\u003c/li>\n\u003cli>What made you change the plan\u003c/li>\n\u003cli>What the new plan was\u003c/li>\n\u003cli>And how you felt about the change\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a time when you changed an important opinion of yours\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When you changed your opinion\u003c/li>\n\u003cli>What the original opinion was\u003c/li>\n\u003cli>Why you changed it\u003c/li>\n\u003cli>And explain how you felt about the experience\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"left\">\u003cstrong>Highlighted Phrase\u003c/strong>\u003c/th>\n\u003cth align=\"left\">\u003cstrong>English Meaning (if needed)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"left\">\u003cmark>When I first started university,\u003c/mark>\u003c/td>\n\u003ctd align=\"left\">\u003cmark>刚上大学时\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">become an engineer\u003c/td>\n\u003ctd align=\"left\">成为工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">in the field of\u003c/td>\n\u003ctd align=\"left\">在……领域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">use my professional knowledge\u003c/td>\n\u003ctd align=\"left\">运用我的专业知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">solve real-world problems\u003c/td>\n\u003ctd align=\"left\">解决现实世界的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">More specifically,\u003c/td>\n\u003ctd align=\"left\">更具体地说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">optimize self-driving algorithms\u003c/td>\n\u003ctd align=\"left\">优化自动驾驶算法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">agile but safe\u003c/td>\n\u003ctd align=\"left\">敏捷且安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">really look forward to\u003c/td>\n\u003ctd align=\"left\">非常期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">what real work was like\u003c/td>\n\u003ctd align=\"left\">真实工作是什么样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">earlier this year\u003c/td>\n\u003ctd align=\"left\">今年早些时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">did an internship\u003c/td>\n\u003ctd align=\"left\">实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">autonomous driving company\u003c/td>\n\u003ctd align=\"left\">自动驾驶公司\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">endless work to do\u003c/td>\n\u003ctd align=\"left\">做不完的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">being a student\u003c/td>\n\u003ctd align=\"left\">当学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">pretty nice\u003c/td>\n\u003ctd align=\"left\">相当不错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">at least\u003c/td>\n\u003ctd align=\"left\">至少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">have time to do my own things\u003c/td>\n\u003ctd align=\"left\">有时间做自己的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">prusue my master&#39;s degree\u003c/td>\n\u003ctd align=\"left\">攻读硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">finish my master’s degree\u003c/td>\n\u003ctd align=\"left\">完成硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">At the same time,\u003c/td>\n\u003ctd align=\"left\">与此同时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">take some high-quality internships\u003c/td>\n\u003ctd align=\"left\">参加一些高质量的实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">improve my practical skills\u003c/td>\n\u003ctd align=\"left\">提高我的实践技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">After graduation,\u003c/td>\n\u003ctd align=\"left\">毕业后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">not in self-driving anymore\u003c/td>\n\u003ctd align=\"left\">不再做自动驾驶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">energetic and realistic\u003c/td>\n\u003ctd align=\"left\">有干劲且更现实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">my most creative years\u003c/td>\n\u003ctd align=\"left\">我最有创造力的几年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">if it didn&#39;t work out\u003c/td>\n\u003ctd align=\"left\">如果行不通\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">reevaluate my choice\u003c/td>\n\u003ctd align=\"left\">重新评估我的选择\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>\u003cstrong>When I first started university,\u003c/strong>\u003c/mark> My goal is to \u003cmark>become an engineer\u003c/mark> \u003cmark>in the field of\u003c/mark> autonomous driving. I hope I can \u003cmark>**use my professional knowledge\u003c/mark> to \u003cmark>solve real-world problems**\u003c/mark>. \u003cmark>More specifically,\u003c/mark> I want to \u003cmark>\u003cstrong>optimize self-driving algorithms\u003c/strong>\u003c/mark> to make them \u003cmark>\u003cstrong>agile but safe\u003c/strong>.\u003c/mark>\u003c/p>\n\u003cp>刚上大学的时候，我的目标是成为自动驾驶领域的工程师。我希望能够运用专业知识解决现实中的实际问题。具体来说，我想要优化自动驾驶算法，让算法兼顾灵敏性与安全性。\u003c/p>\n\u003cp>In the past, I used to \u003cmark>really look forward to\u003c/mark> working. Last year, I wanted to see \u003cmark>what real work was like\u003c/mark>. So,\u003cmark>earlier this year\u003c/mark>, I \u003cmark>did an internship\u003c/mark> at an \u003cmark>autonomous driving company\u003c/mark>. I was really tired. I worked from 10 a.m. to 10 p.m. with \u003cmark>endless work to do\u003c/mark>. After that, I’ve felt \u003cmark>being a student\u003c/mark> is \u003cmark>pretty nice\u003c/mark>, because \u003cmark>at least\u003c/mark> I \u003cmark>have time to do my own things.\u003c/mark>\u003c/p>\n\u003cp>我曾经十分期待步入职场。去年，我很想体验真实的工作是什么样子。今年年初，我在一家自动驾驶企业实习。那段工作十分辛苦，每天早上十点工作到晚上十点，总有做不完的任务。从那以后，我觉得学生身份其实挺不错的，至少我拥有可以支配、做自己事情的时间。\u003c/p>\n\u003cp>After that, I changed my opinion/plan\u003cbr>I plan to \u003cmark>prusue my master&#39;s degree\u003c/mark> starting this september,  first I’ll \u003cmark>finish my master’s degree\u003c/mark> in the next three years. \u003cmark>At the same time\u003c/mark>, I want to \u003cmark>take some high-quality internships\u003c/mark> to \u003cmark>improve my practical skills\u003c/mark>. \u003cmark>After graduation\u003c/mark>, I plan to work as an robotics engineer, \u003cmark>not in self-driving anymore\u003c/mark>\u003c/p>\n\u003cp>这次实习之后，我的想法和规划发生了改变。\u003cbr>我计划今年 9 月开始攻读硕士学位。首先，我会在未来三年内完成硕士阶段的学习。与此同时，我打算参加几段高质量实习，提升自己的实操能力。毕业之后，我想从事机器人工程师相关工作，不再深耕自动驾驶方向。\u003c/p>\n\u003cp>I feel this change is positive. It made me more \u003cmark>energetic and realistic.\u003c/mark> after that intership,\u003cbr>I still want to become an engineer, I decided that I should spend \u003cmark>my most creative years\u003c/mark> in robotics, and \u003cmark>if it didn&#39;t work out\u003c/mark>, then I would \u003cmark>reevaluate my choice\u003c/mark> after 5 years\u003c/p>\n\u003cp>我认为这次转变是一件好事，它让我变得更有动力，想法也更加务实。经历这次实习之后，我依旧想成为一名工程师，但我决定把创造力最旺盛的年华投入机器人领域。如果后续发展不尽人意，我会在五年之后重新考量自己的职业选择。\u003c/p>\n","toc":[],"text":"描述一个你近期不得不更改的计划 Describe a time when you changed an important opinion of yours 描述一次你改变自己某个重要观点的经历 You should say: When this happened What made you change the plan What the new plan was And how you felt about the change Describe a time when you changed an important opinion of yours You should say: When you changed your opinion What the original opinion was Why you changed it And explain how you felt about the experience Highlighted Phrase English Meaning (if needed) When I first started university, 刚上大学时 become an engineer 成为工程师 in the field of 在……领域 use my professional knowledge 运用我的专业知识 solve real-world problems 解决现实世界的问题 More specifically, 更具体地说 optimize self-driving algorithms 优化自动驾驶算法 agile but safe 敏捷且安全 really look forward to 非常期待 what real work was like 真实工作是什么样的 earlier this year 今年早些时候 did an internship 实习 autonomous driving company 自动驾驶公司 endless work to do 做不完的工作 being a student 当学生 pretty nice 相当不错 at least 至少 have time to do my own things 有时间做自己的事 prusue my master's degree 攻读硕士学位 finish my master’s degree 完成硕士学位 At the same time, 与此同时 take some high-quality internships 参加一些高质量的实习 improve my practical skills 提高我的实践技能 After graduation, 毕业后 not in self-driving anymore 不再做自动驾驶 energetic and realistic 有干劲且更现实 my most creative years 我最有创造力的几年 if it didn't work out 如果行不通 reevaluate my choice 重新评估我的选择 When I first started university, My goal is to become an engineer in the field of autonomous driving. I hope I can **use my professional knowledge to solve real-world problems**. More specifically, I want to optimize self-driving algorithms to make them agile but safe. 刚上大学的时候，我的目标是成为自动驾驶领域的工程师。我希望能够运用专业知识解决现实中的实际问题。具体来说，我想要优化自动驾驶算法，让算法兼顾灵敏性与安全性。 In the past, I used to really look forward to working. Last year, I wanted to see what real work was like. So,earlier this year, I did an internship at an autonomous driving company. I was really tired. I worked from 10 a.m. to 10 p.m. with endless work to do. After that, I’ve felt being a student is pretty nice, because at least I have time to do my own things. 我曾经十分期待步入职场。去年，我很想体验真实的工作是什么样子。今年年初，我在一家自动驾驶企业实习。那段工作十分辛苦，每天早上十点工作到晚上十点，总有做不完的任务。从那以后，我觉得学生身份其实挺不错的，至少我拥有可以支配、做自己事情的时间。 After that, I changed my opinion/plan I plan to prusue my master's degree starting this september, first I’ll finish my master’s degree in the next three years. At the same time, I want to take some high-quality internships to improve my practical skills. After graduation, I plan to work as an robotics engineer, not in self-driving anymore 这次实习之后，我的想法和规划发生了改变。 我计划今年 9 月开始攻读硕士学位。首先，我会在未来三年内完成硕士阶段的学习。与此同时，我打算参加几段高质量实习，提升自己的实操能力。毕业之后，我想从事机器人工程师相关工作，不再深耕自动驾驶方向。 I feel this change is positive. It made me more energetic and realistic. after that intership, I still want to become an engineer, I decided that I should spend my most creative years in robotics, and if it didn't work out, then I would reevaluate my choice after 5 years 我认为这次转变是一件好事，它让我变得更有动力，想法也更加务实。经历这次实习之后，我依旧想成为一名工程师，但我决定把创造力最旺盛的年华投入机器人领域。如果后续发展不尽人意，我会在五年之后重新考量自己的职业选择。"},{"id":"a-p2-09","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/9-新法律&环保法律.md","title":"P2-9 新法律 & 环保法律","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What law it is\u003c/li>\n\u003cli>What changes this law brings\u003c/li>\n\u003cli>Whether this new law will be popular\u003c/li>\n\u003cli>How you came up with the new law\u003c/li>\n\u003cli>And explain how you feel about this new law\u003c/li>\n\u003c/ul>\n\u003ch1>Describe an environmental law you would like your country to introduce\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What law it should be\u003c/li>\n\u003cli>Why people should follow the law\u003c/li>\n\u003cli>Whether the law will be popular\u003c/li>\n\u003cli>And explain how you feel about this law\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a law on environmental protection\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>How you first learned about it\u003c/li>\n\u003cli>Who benefits from it\u003c/li>\n\u003cli>And explain how you feel about this law\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>environmental law\u003c/td>\n\u003ctd>环境法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>should be introduced in china\u003c/td>\n\u003ctd>应该在我国推行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stopping rubbish pollution\u003c/td>\n\u003ctd>制止垃圾污染\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outdoor space\u003c/td>\n\u003ctd>户外空间/自然景区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take their own garbage away\u003c/td>\n\u003ctd>带走自己产生的垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>after climbing mountains.\u003c/td>\n\u003ctd>登山后。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leave rubbish behind\u003c/td>\n\u003ctd>留下/丢弃垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get a small fine.\u003c/td>\n\u003ctd>被处以小额罚款。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>wild animals\u003c/td>\n\u003ctd>野生动物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a tiny fraction of people\u003c/td>\n\u003ctd>一小部分人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it is troublesome.\u003c/td>\n\u003ctd>这很麻烦。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>came up with this idea\u003c/td>\n\u003ctd>产生这个想法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a trip to the Qinling Mountains\u003c/td>\n\u003ctd>一次去秦岭的旅行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go hiking\u003c/td>\n\u003ctd>去徒步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the foot of the mountain,\u003c/td>\n\u003ctd>山脚下，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rubbish everywhere\u003c/td>\n\u003ctd>到处都是垃圾\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the road up to the mountain\u003c/td>\n\u003ctd>上山的沿途\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go back before reaching the top\u003c/td>\n\u003ctd>还没登顶就折返\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>were introduced in my country,\u003c/td>\n\u003ctd>在我国推行，\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>would become cleaner.\u003c/td>\n\u003ctd>将会变得更加干净。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today, I&#39;ll talk about a new \u003cmark>environmental law\u003c/mark> that \u003cmark>should be introduced in CHINA. It is about ==stopping rubbish pollution\u003c/mark> in \u003cmark>outdoor space\u003c/mark>. This law will ask everyone to \u003cmark>take their own garbage away\u003c/mark> \u003cmark>after climbing mountains.\u003c/mark> People who \u003cmark>leave rubbish behind\u003c/mark> will \u003cmark>get a small fine.\u003c/mark>\u003c/p>\n\u003cp>今天我想讲讲我国应该推行的一项新环境法。它是关于制止户外风景区垃圾污染的。这项法规要求所有游客登山后带走自己产生的垃圾。随意丢弃垃圾的人将会处以小额罚款。\u003c/p>\n\u003cp>This law will make our \u003cmark>outdoor space\u003c/mark> much cleaner. It can also protect \u003cmark>wild animals\u003c/mark>. I think most people will support this law; only \u003cmark>a tiny fraction of people\u003c/mark> think \u003cmark>it is troublesome.\u003c/mark>\u003c/p>\n\u003cp>这条规定能让自然景区干净很多，同时也能保护野生动物，我认为大多数人都会支持这项法规，只有少数人会觉得麻烦。\u003c/p>\n\u003cp>I \u003cmark>came up with this idea\u003c/mark> from \u003cmark>a trip to the Qinling Mountains\u003c/mark> with my parents last summer. We planned to \u003cmark>go hiking\u003c/mark> there, but when we arrived at \u003cmark>the foot of the mountain,\u003c/mark> there was \u003cmark>rubbish everywhere\u003c/mark> \u003cmark>along the road up to the mountain\u003c/mark>. I was really disappointed., so We decided to \u003cmark>go back before reaching the top\u003c/mark>. \u003c/p>\n\u003cp>我产生这个想法源于去年夏天和父母去秦岭的一次旅行。我们原本打算去徒步，可当我们到达山脚下时，上山沿途到处都是垃圾。我们甚至没有登顶就决定折返，当时我特别失望。\u003c/p>\n\u003cp>Personally, I support this law. because I believe if this law \u003cmark>\u003cstrong>were introduced\u003c/strong> in my country,\u003c/mark> those beautiful mountains \u003cmark>\u003cstrong>would become cleaner\u003c/strong>.\u003c/mark> I would never recommend that place to others, but I would definitely recommend this law to everyone.\u003c/p>\n\u003cp>就我个人而言，我支持这项法规。我认为如果我国推行这条法规，那些美丽的景区将会变得更加干净。我绝不会向别人推荐那个地方，但我一定会向所有人推荐这条法规。\u003c/p>\n\u003chr>\n","toc":[],"text":"You should say: What law it is What changes this law brings Whether this new law will be popular How you came up with the new law And explain how you feel about this new law Describe an environmental law you would like your country to introduce You should say: What law it should be Why people should follow the law Whether the law will be popular And explain how you feel about this law Describe a law on environmental protection You should say: What it is How you first learned about it Who benefits from it And explain how you feel about this law 英文原短语 中文翻译 environmental law 环境法 should be introduced in china 应该在我国推行 stopping rubbish pollution 制止垃圾污染 outdoor space 户外空间/自然景区 take their own garbage away 带走自己产生的垃圾 after climbing mountains. 登山后。 leave rubbish behind 留下/丢弃垃圾 get a small fine. 被处以小额罚款。 wild animals 野生动物 a tiny fraction of people 一小部分人 it is troublesome. 这很麻烦。 came up with this idea 产生这个想法 a trip to the Qinling Mountains 一次去秦岭的旅行 go hiking 去徒步 the foot of the mountain, 山脚下， rubbish everywhere 到处都是垃圾 along the road up to the mountain 上山的沿途 go back before reaching the top 还没登顶就折返 were introduced in my country, 在我国推行， would become cleaner. 将会变得更加干净。 Today, I'll talk about a new environmental law that should be introduced in CHINA. It is about ==stopping rubbish pollution in outdoor space. This law will ask everyone to take their own garbage away after climbing mountains. People who leave rubbish behind will get a small fine. 今天我想讲讲我国应该推行的一项新环境法。它是关于制止户外风景区垃圾污染的。这项法规要求所有游客登山后带走自己产生的垃圾。随意丢弃垃圾的人将会处以小额罚款。 This law will make our outdoor space much cleaner. It can also protect wild animals. I think most people will support this law; only a tiny fraction of people think it is troublesome. 这条规定能让自然景区干净很多，同时也能保护野生动物，我认为大多数人都会支持这项法规，只有少数人会觉得麻烦。 I came up with this idea from a trip to the Qinling Mountains with my parents last summer. We planned to go hiking there, but when we arrived at the foot of the mountain, there was rubbish everywhere along the road up to the mountain. I was really disappointed., so We decided to go back before reaching the top. 我产生这个想法源于去年夏天和父母去秦岭的一次旅行。我们原本打算去徒步，可当我们到达山脚下时，上山沿途到处都是垃圾。我们甚至没有登顶就决定折返，当时我特别失望。 Personally, I support this law. because I believe if this law were introduced in my country, those beautiful mountains would become cleaner. I would never recommend that place to others, but I would definitely recommend this law to everyone. 就我个人而言，我支持这项法规。我认为如果我国推行这条法规，那些美丽的景区将会变得更加干净。我绝不会向别人推荐那个地方，但我一定会向所有人推荐这条法规。"},{"id":"a-p2-10","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/10-近期看过且享受的电影.md","title":"P2-10 近期看过且享受的电影","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When and where you watched it\u003c/li>\n\u003cli>Who you watched it with\u003c/li>\n\u003cli>What it was about\u003c/li>\n\u003cli>And explain why you watched this movie\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a professional rock climber\u003c/td>\n\u003ctd>职业攀岩者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>entire process\u003c/td>\n\u003ctd>全过程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>free solo climbing El Capitan\u003c/td>\n\u003ctd>徒手攀登酋长岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>granite cliff\u003c/td>\n\u003ctd>3000英尺高的花岗岩峭壁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yosemite National Park\u003c/td>\n\u003ctd>优胜美地国家公园\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003
