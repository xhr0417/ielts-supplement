3ctr>\n\u003ctd>is way better than\u003c/td>\n\u003ctd>比 .... 好太多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>watching alone at home.\u003c/td>\n\u003ctd>一个人在家看\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chinese Super League match\u003c/td>\n\u003ctd>中超联赛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>during my high school summer vacation\u003c/td>\n\u003ctd>高中暑假\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live atmosphere\u003c/td>\n\u003ctd>现场气氛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>totally different from\u003c/td>\n\u003ctd>与 ... 完全不同\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Formula 1 racing\u003c/td>\n\u003ctd>F1赛车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>These events really appeal to me\u003c/mark>\u003c/td>\n\u003ctd>这些比赛真的很吸引我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it&#39;s also a good way to relax after studying.\u003c/td>\n\u003ctd>也是学习后放松的好方式\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>full of suspense\u003c/td>\n\u003ctd>充满悬念\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>since you never know the result in advance\u003c/td>\n\u003ctd>因为你提前不知道结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>It’s way more thrilling\u003c/mark>\u003c/td>\n\u003ctd>比 ... 刺激多了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>watching replays later.\u003c/td>\n\u003ctd>之后看重播\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a big football fan\u003c/td>\n\u003ctd>铁杆足球迷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>talk about matches and players\u003c/td>\n\u003ctd>聊比赛和球员\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve got into rock climbing recently\u003c/td>\n\u003ctd>我最近开始喜欢上攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pick up new skills\u003c/td>\n\u003ctd>学到新技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional competitions\u003c/td>\n\u003ctd>专业赛事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>1. Do you prefer to watch sports games alone or with a group of friends?\u003c/h4>\n\u003cp>I definitely prefer watching with my friends. It’s \u003cmark>much more fun to\u003c/mark> \u003cmark>cheer for teams together\u003c/mark>. The atmosphere \u003cmark>is way better than\u003c/mark> watching alone at home.\u003c/p>\n\u003cp>我肯定更喜欢和朋友一起看。大家一起为球队加油有意思多了，氛围比一个人在家看好太多。\u003c/p>\n\u003chr>\n\u003ch4>2. Have you ever watched a sports game in a stadium?\u003c/h4>\n\u003cp>Yes, I went to a \u003cmark>Chinese Super League match\u003c/mark> in Shanghai with my dad during my \u003cmark>high school summer vacation\u003c/mark>. The \u003cmark>live atmosphere\u003c/mark> was fantastic, \u003cmark>totally different from\u003c/mark> watching on TV.\u003c/p>\n\u003cp>看过。高中暑假我和爸爸去上海看了一场中超比赛。现场氛围特别激动人心，和看电视的感觉完全不一样。\u003c/p>\n\u003chr>\n\u003ch4>3. Do you like watching sports programs on TV?\u003c/h4>\n\u003cp>Yes, I really enjoy them. I often watch \u003cmark>Formula 1 racing\u003c/mark>, the \u003cmark>Tour de France\u003c/mark> and the \u003cmark>FIFA World Cup\u003c/mark> in my free time. \u003cmark>These events really appeal to me\u003c/mark> and they&#39;re also a good way to relax after studying.\u003c/p>\n\u003cp>是的，我很喜欢。我空闲时经常看 F1、环法自行车赛和世界杯。这些比赛真的很吸引我，也是学习后放松的好方式。\u003c/p>\n\u003chr>\n\u003ch4>4. Do you like to watch live sports games?\u003c/h4>\n\u003cp>Yes, I love live games, especially the FIFA World Cup. Live matches are \u003cmark>full of suspense\u003c/mark> since \u003cmark>you never know the result in advance\u003c/mark>. \u003cmark>It’s way more thrilling\u003c/mark> than \u003cmark>watching replays later.\u003c/mark>\u003c/p>\n\u003cp>喜欢，我特别爱看直播，尤其是世界杯。直播充满悬念，因为你提前不知道结果，比之后看重播刺激多了。\u003c/p>\n\u003chr>\n\u003ch4>5. Who do you like to watch sports games with?\u003c/h4>\n\u003cp>I like watching with my dad most, because he’s also \u003cmark>a big football fan\u003c/mark>. He supports AC Milan, a famous Italian football club. and I like Real Madrid from Spain. We always \u003cmark>talk about matches and players\u003c/mark> together.\u003c/p>\n\u003cp>我最喜欢和爸爸一起看，因为他也是铁杆球迷。他支持 AC 米兰，我喜欢皇家马德里。我们总在一起聊比赛和球员。\u003c/p>\n\u003chr>\n\u003ch4>6. What kinds of games do you expect to watch in the future?\u003c/h4>\n\u003cp>I really want to watch \u003cmark>professional rock climbing competitions\u003c/mark>. I’ve \u003cmark>got into\u003c/mark> climbing recently, and I think watching \u003cmark>professional competitions\u003c/mark> can help me \u003cmark>pick up\u003c/mark> new skills.\u003c/p>\n\u003cp>我很想以后看专业的攀岩比赛。我最近迷上了攀岩，我觉得看专业选手比赛能帮我学到新技巧。\u003c/p>\n","toc":[],"text":"Do you prefer to watch sports games alone or with a group of friends? Have you ever watched a sports game in a stadium? Do you like watching sports programs on TV? Do you like to watch live sports games? Who do you like to watch sports games with? What kinds of games do you expect to watch in the future? 英文短语 中文释义 It’s much more fun to 有意思多了 cheer for teams together 大家一起为球队加油 is way better than 比 .... 好太多 watching alone at home. 一个人在家看 Chinese Super League match 中超联赛 during my high school summer vacation 高中暑假 live atmosphere 现场气氛 totally different from 与 ... 完全不同 Formula 1 racing F1赛车 These events really appeal to me 这些比赛真的很吸引我 it's also a good way to relax after studying. 也是学习后放松的好方式 full of suspense 充满悬念 since you never know the result in advance 因为你提前不知道结果 It’s way more thrilling 比 ... 刺激多了。 watching replays later. 之后看重播 a big football fan 铁杆足球迷 talk about matches and players 聊比赛和球员 I’ve got into rock climbing recently 我最近开始喜欢上攀岩 pick up new skills 学到新技能 professional competitions 专业赛事 1. Do you prefer to watch sports games alone or with a group of friends? I definitely prefer watching with my friends. It’s much more fun to cheer for teams together. The atmosphere is way better than watching alone at home. 我肯定更喜欢和朋友一起看。大家一起为球队加油有意思多了，氛围比一个人在家看好太多。 2. Have you ever watched a sports game in a stadium? Yes, I went to a Chinese Super League match in Shanghai with my dad during my high school summer vacation. The live atmosphere was fantastic, totally different from watching on TV. 看过。高中暑假我和爸爸去上海看了一场中超比赛。现场氛围特别激动人心，和看电视的感觉完全不一样。 3. Do you like watching sports programs on TV? Yes, I really enjoy them. I often watch Formula 1 racing, the Tour de France and the FIFA World Cup in my free time. These events really appeal to me and they're also a good way to relax after studying. 是的，我很喜欢。我空闲时经常看 F1、环法自行车赛和世界杯。这些比赛真的很吸引我，也是学习后放松的好方式。 4. Do you like to watch live sports games? Yes, I love live games, especially the FIFA World Cup. Live matches are full of suspense since you never know the result in advance. It’s way more thrilling than watching replays later. 喜欢，我特别爱看直播，尤其是世界杯。直播充满悬念，因为你提前不知道结果，比之后看重播刺激多了。 5. Who do you like to watch sports games with? I like watching with my dad most, because he’s also a big football fan. He supports AC Milan, a famous Italian football club. and I like Real Madrid from Spain. We always talk about matches and players together. 我最喜欢和爸爸一起看，因为他也是铁杆球迷。他支持 AC 米兰，我喜欢皇家马德里。我们总在一起聊比赛和球员。 6. What kinds of games do you expect to watch in the future? I really want to watch professional rock climbing competitions. I’ve got into climbing recently, and I think watching professional competitions can help me pick up new skills. 我很想以后看专业的攀岩比赛。我最近迷上了攀岩，我觉得看专业选手比赛能帮我学到新技巧。"},{"id":"a-p1-science","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/15-Science.md","title":"Science","html":"\u003cul>\n\u003cli>Do you like science?\u003c/li>\n\u003cli>When did you start to learn about science?\u003c/li>\n\u003cli>Which science subject is interesting to you?\u003c/li>\n\u003cli>What kinds of interesting things have you done with science?\u003c/li>\n\u003cli>Do you like watching science TV programs?\u003c/li>\n\u003cli>Do Chinese people often visit science museums?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>I’ve always been fascinated by\u003c/mark>\u003c/td>\n\u003ctd>我一直对…… 深深着迷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>from an early age\u003c/td>\n\u003ctd>从小\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>a quote from\u003c/mark>\u003c/td>\n\u003ctd>名言\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scientists study the world as it is\u003c/td>\n\u003ctd>科学家研究现存的世界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>engineers create the world that has never been\u003c/td>\n\u003ctd>工程师创造从未有过的世界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>This idea really inspires me.\u003c/mark>\u003cbr>\u003c/td>\n\u003ctd>这个观点一直激励着我\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>natural phenomena\u003c/td>\n\u003ctd>自然现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me more curious about\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>how the world works.\u003c/td>\n\u003ctd>世界运行规律\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>appeals to me the most\u003c/td>\n\u003ctd>最吸引我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fundamental rules behind motion\u003c/td>\n\u003ctd>运动背后的基础原理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which connects closely with engineering.\u003c/td>\n\u003ctd>和工程领域紧密相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>()\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mechanical structures\u003c/td>\n\u003ctd>机械结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>how different devices operate\u003c/td>\n\u003ctd>各类设备的运作方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the physical principles supporting their functions.\u003c/td>\n\u003ctd>支撑它们运转的物理原理。\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m really interested in science documentaries\u003c/td>\n\u003ctd>我很喜欢科学纪录片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used smart ways to do\u003c/td>\n\u003ctd>用巧妙的方式做某事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>explain difficult knowledge clearly\u003c/td>\n\u003ctd>把难懂的知识讲清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constantly satisfy my curiosity about\u003c/td>\n\u003ctd>不断满足我对于 ...... 的好奇\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>families with kids\u003c/td>\n\u003ctd>带小孩的家庭\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>school trips\u003c/td>\n\u003ctd>学校研学、校外参观\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>used to love visiting them\u003c/td>\n\u003ctd>过去很喜欢参观他们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m not really interested anymore.\u003c/td>\n\u003ctd>现在已经没什么兴趣了。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you like science?\u003c/h2>\n\u003cp>Yes, \u003cmark>I’ve always been fascinated by\u003c/mark> science and engineering \u003cmark>from an early age\u003c/mark>. I still remember \u003cmark>a quote from\u003c/mark> Doctor von Kármán: \u003cmark>Scientists study the world as it is\u003c/mark>; \u003cmark>engineers create the world that has never been\u003c/mark>. \u003cmark>This idea really inspires me.\u003c/mark>\u003c/p>\n\u003cp>喜欢，我从小就对科学与工程很感兴趣。我记得冯・卡门有一句话：科学家研究现存的世界，工程师创造从未有过的世界。这个观点一直激励着我。\u003c/p>\n\u003ch2 id=\"h2\">2. When did you start to learn about science?\u003c/h2>\n\u003cp>I first \u003cmark>got to know\u003c/mark> basic scientific knowledge in primary school science classes. Those \u003cmark>hands-on experiments\u003c/mark> and \u003cmark>natural phenomena\u003c/mark> made me more curious about how the world works.\u003c/p>\n\u003cp>我小学科学课第一次接触基础科学知识。那些简单实验与自然现象，激发了我对世界运行规律的好奇心。\u003c/p>\n\u003ch2 id=\"h3\">3. Which science subject is interesting to you?\u003c/h2>\n\u003cp>There is no doubt that physics \u003cmark>appeals to me the most\u003c/mark>, especially mechanics. It explains the \u003cmark>fundamental rules\u003c/mark> behind motion, which \u003cmark>connects closely\u003c/mark> with engineering.\u003c/p>\n\u003cp>物理最吸引我，尤其是力学。它阐释运动背后的基础原理，和工程领域紧密相关。\u003c/p>\n\u003ch2 id=\"h4\">4. What kinds of interesting things have you done with science?\u003c/h2>\n\u003cp>I often watch science videos about \u003cmark>mechanical structures\u003c/mark>. Besides, I enjoy analysing \u003cmark>how different devices operate\u003c/mark> and try to understand \u003cmark>the physical principles supporting their functions.\u003c/mark>\u003c/p>\n\u003cp>我经常观看机械结构相关科普视频。除此之外，我喜欢分析各类设备的运作方式，弄懂支撑它们运转的物理原理。\u003c/p>\n\u003ch2 id=\"h5\">5. Do you like watching science TV programs?\u003c/h2>\n\u003cp>Sure, I’m \u003cmark>keen on\u003c/mark> science documentaries. They \u003cmark>use smart ways to explain difficult knowledge clearly\u003c/mark> and \u003cmark>constantly satisfy my curiosity about\u003c/mark> technology and nature.\u003c/p>\n\u003cp>当然，我很喜欢科学纪录片。它把复杂理论通俗地展现出来，不断满足我对于科技和自然的好奇心。\u003c/p>\n\u003ch2 id=\"h6\">6. Do Chinese people often visit science museums?\u003c/h2>\n\u003cp>Science museums are very popular, especially for \u003cmark>families with kids\u003c/mark> and \u003cmark>student school trips\u003c/mark>. I \u003cmark>used to love visiting them\u003c/mark> when I was a kid, but these days \u003cmark>I’m not really interested anymore.\u003c/mark>\u003c/p>\n\u003cp>科技馆人气相当高，很多带小孩的家庭和学生研学团都会去。我小时候特别喜欢去，但现在已经没什么兴趣了。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you like science?"},{"level":2,"id":"h2","text":"2. When did you start to learn about science?"},{"level":2,"id":"h3","text":"3. Which science subject is interesting to you?"},{"level":2,"id":"h4","text":"4. What kinds of interesting things have you done with science?"},{"level":2,"id":"h5","text":"5. Do you like watching science TV programs?"},{"level":2,"id":"h6","text":"6. Do Chinese people often visit science museums?"}],"text":"Do you like science? When did you start to learn about science? Which science subject is interesting to you? What kinds of interesting things have you done with science? Do you like watching science TV programs? Do Chinese people often visit science museums? 英文短语 中文释义 I’ve always been fascinated by 我一直对…… 深深着迷 from an early age 从小 a quote from 名言 Scientists study the world as it is 科学家研究现存的世界 engineers create the world that has never been 工程师创造从未有过的世界 This idea really inspires me. 这个观点一直激励着我 natural phenomena 自然现象 made me more curious about how the world works. 世界运行规律 appeals to me the most 最吸引我 fundamental rules behind motion 运动背后的基础原理 which connects closely with engineering. 和工程领域紧密相关。 () mechanical structures 机械结构 how different devices operate 各类设备的运作方式 the physical principles supporting their functions. 支撑它们运转的物理原理。 I’m really interested in science documentaries 我很喜欢科学纪录片 used smart ways to do 用巧妙的方式做某事 explain difficult knowledge clearly 把难懂的知识讲清楚 constantly satisfy my curiosity about 不断满足我对于 ...... 的好奇 families with kids 带小孩的家庭 school trips 学校研学、校外参观 used to love visiting them 过去很喜欢参观他们 I’m not really interested anymore. 现在已经没什么兴趣了。 1. Do you like science? Yes, I’ve always been fascinated by science and engineering from an early age. I still remember a quote from Doctor von Kármán: Scientists study the world as it is; engineers create the world that has never been. This idea really inspires me. 喜欢，我从小就对科学与工程很感兴趣。我记得冯・卡门有一句话：科学家研究现存的世界，工程师创造从未有过的世界。这个观点一直激励着我。 2. When did you start to learn about science? I first got to know basic scientific knowledge in primary school science classes. Those hands-on experiments and natural phenomena made me more curious about how the world works. 我小学科学课第一次接触基础科学知识。那些简单实验与自然现象，激发了我对世界运行规律的好奇心。 3. Which science subject is interesting to you? There is no doubt that physics appeals to me the most, especially mechanics. It explains the fundamental rules behind motion, which connects closely with engineering. 物理最吸引我，尤其是力学。它阐释运动背后的基础原理，和工程领域紧密相关。 4. What kinds of interesting things have you done with science? I often watch science videos about mechanical structures. Besides, I enjoy analysing how different devices operate and try to understand the physical principles supporting their functions. 我经常观看机械结构相关科普视频。除此之外，我喜欢分析各类设备的运作方式，弄懂支撑它们运转的物理原理。 5. Do you like watching science TV programs? Sure, I’m keen on science documentaries. They use smart ways to explain difficult knowledge clearly and constantly satisfy my curiosity about technology and nature. 当然，我很喜欢科学纪录片。它把复杂理论通俗地展现出来，不断满足我对于科技和自然的好奇心。 6. Do Chinese people often visit science museums? Science museums are very popular, especially for families with kids and student school trips. I used to love visiting them when I was a kid, but these days I’m not really interested anymore. 科技馆人气相当高，很多带小孩的家庭和学生研学团都会去。我小时候特别喜欢去，但现在已经没什么兴趣了。"},{"id":"a-p1-headphones","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/16-headphones.md","title":"Headphones","html":"\u003cul>\n\u003cli>Do you use headphones?\u003c/li>\n\u003cli>What type of headphones do you use?\u003c/li>\n\u003cli>When would you use headphones?\u003c/li>\n\u003cli>In what conditions would you not use headphones?\u003c/li>\n\u003cli>Is wearing headphones comfortable?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>nearly all the time\u003c/td>\n\u003ctd>时时刻刻，一直\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I basically can’t live without them\u003c/td>\n\u003ctd>几乎离不开它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Their main function for me\u003c/td>\n\u003ctd>对我来说它最主要的用处是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stay focused\u003c/td>\n\u003ctd>保持专注\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>wireless headphones\u003c/td>\n\u003ctd>无线耳机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there are no messy cables\u003c/td>\n\u003ctd>没有杂乱的线材\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>get in my way\u003c/td>\n\u003ctd>碍事、造成不便\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>energetic music\u003c/td>\n\u003ctd>激昂有活力的音乐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which can cheer me up\u003c/td>\n\u003ctd>可以鼓舞我、让我振作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keep going\u003c/td>\n\u003ctd>坚持下去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>give up halfway\u003c/td>\n\u003ctd>半途而废\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when staying with my family or friends\u003c/td>\n\u003ctd>和家人朋友相处时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>since it would be really impolite\u003c/td>\n\u003ctd>因为这样很不礼貌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when crossing roads or cycling\u003c/td>\n\u003ctd>过马路或骑自行车的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for safety reasons\u003c/td>\n\u003ctd>出于安全考虑\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it is not that comfortable for me\u003c/td>\n\u003ctd>对我来说不算舒服\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’ve already got used to it\u003c/td>\n\u003ctd>我已经习惯了\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Do you use headphones?\u003c/h2>\n\u003cp>\u003cmark>Well, to be honest\u003c/mark>, I wear headphones nearly \u003cmark>all the time\u003c/mark>, and \u003cmark>I basically can’t live without them\u003c/mark>. \u003cmark>Their main function for me\u003c/mark> is to help me \u003cmark>stay focused\u003c/mark> when I’m studying or hitting the gym.\u003c/p>\n\u003cp>说实话，我几乎时时刻刻都戴着耳机，基本离不开它。对我来说，耳机最主要的作用就是在学习、跑步或者健身的时候帮我集中注意力。\u003c/p>\n\u003ch2 id=\"h2\">2. What type of headphones do you use?\u003c/h2>\n\u003cp>I&#39;ve tried all kinds of headphones. To be honest, I prefer to use \u003cmark>wireless headphones\u003c/mark>. They are really convenient because \u003cmark>there are no messy cables\u003c/mark> to \u003cmark>get in my way.\u003c/mark>\u003c/p>\n\u003cp>我使用无线耳机。它们十分方便，不会有杂乱的线材造成困扰。\u003c/p>\n\u003ch2 id=\"h3\">3. When would you use headphones?\u003c/h2>\n\u003cp>I always wear headphones while running. I listen to some \u003cmark>energetic music\u003c/mark>, \u003cmark>which can cheer me up\u003c/mark> and help me \u003cmark>keep going\u003c/mark>, especially when I feel tired and want to \u003cmark>give up halfway\u003c/mark>.\u003c/p>\n\u003cp>跑步的时候我也会戴上耳机听歌。音乐能鼓舞我，让我坚持下去，尤其是当我疲惫想要半途而废的时候。\u003c/p>\n\u003ch2 id=\"h4\">4. In what conditions would you not use headphones?\u003c/h2>\n\u003cp>I will not wear headphones \u003cmark>when staying with family or friends\u003c/mark>, \u003cmark>since it would be really impolite\u003c/mark>. Besides, I avoid wearing them when \u003cmark>crossing roads\u003c/mark> or cycling \u003cmark>for safety reasons.\u003c/mark>\u003c/p>\n\u003cp>和家人朋友相处时我不会戴耳机，那样很不礼貌。除此之外，过马路或者骑车时，出于安全考虑我也不会佩戴。\u003c/p>\n\u003ch2 id=\"h5\">5. Is wearing headphones comfortable?\u003c/h2>\n\u003cp>Honestly, \u003cmark>it is not that comfortable for me\u003c/mark>. But I wear them almost every day, so \u003cmark>I’ve got used to wearing them.\u003c/mark>\u003c/p>\n\u003cp>说实话佩戴起来不算舒服。不过我经常使用，早就已经习惯了。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Do you use headphones?"},{"level":2,"id":"h2","text":"2. What type of headphones do you use?"},{"level":2,"id":"h3","text":"3. When would you use headphones?"},{"level":2,"id":"h4","text":"4. In what conditions would you not use headphones?"},{"level":2,"id":"h5","text":"5. Is wearing headphones comfortable?"}],"text":"Do you use headphones? What type of headphones do you use? When would you use headphones? In what conditions would you not use headphones? Is wearing headphones comfortable? 英文短语 中文释义 nearly all the time 时时刻刻，一直 I basically can’t live without them 几乎离不开它 Their main function for me 对我来说它最主要的用处是 stay focused 保持专注 wireless headphones 无线耳机 there are no messy cables 没有杂乱的线材 get in my way 碍事、造成不便 energetic music 激昂有活力的音乐 which can cheer me up 可以鼓舞我、让我振作 keep going 坚持下去 give up halfway 半途而废 when staying with my family or friends 和家人朋友相处时 since it would be really impolite 因为这样很不礼貌 when crossing roads or cycling 过马路或骑自行车的时候 for safety reasons 出于安全考虑 it is not that comfortable for me 对我来说不算舒服 I’ve already got used to it 我已经习惯了 1. Do you use headphones? Well, to be honest, I wear headphones nearly all the time, and I basically can’t live without them. Their main function for me is to help me stay focused when I’m studying or hitting the gym. 说实话，我几乎时时刻刻都戴着耳机，基本离不开它。对我来说，耳机最主要的作用就是在学习、跑步或者健身的时候帮我集中注意力。 2. What type of headphones do you use? I've tried all kinds of headphones. To be honest, I prefer to use wireless headphones. They are really convenient because there are no messy cables to get in my way. 我使用无线耳机。它们十分方便，不会有杂乱的线材造成困扰。 3. When would you use headphones? I always wear headphones while running. I listen to some energetic music, which can cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 跑步的时候我也会戴上耳机听歌。音乐能鼓舞我，让我坚持下去，尤其是当我疲惫想要半途而废的时候。 4. In what conditions would you not use headphones? I will not wear headphones when staying with family or friends, since it would be really impolite. Besides, I avoid wearing them when crossing roads or cycling for safety reasons. 和家人朋友相处时我不会戴耳机，那样很不礼貌。除此之外，过马路或者骑车时，出于安全考虑我也不会佩戴。 5. Is wearing headphones comfortable? Honestly, it is not that comfortable for me. But I wear them almost every day, so I’ve got used to wearing them. 说实话佩戴起来不算舒服。不过我经常使用，早就已经习惯了。"},{"id":"a-p1-jokes","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/17-jokes & comedies.md","title":"Jokes & comedies","html":"\u003cul>\n\u003cli>Are you good at telling jokes?\u003c/li>\n\u003cli>Do your friends like to tell jokes?\u003c/li>\n\u003cli>Do you like to watch comedies?\u003c/li>\n\u003cli>Have you ever watched a live show?\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>when I hang out with my best friends\u003c/td>\n\u003ctd>和最好的朋友相处时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on some important occasions\u003c/td>\n\u003ctd>在一些重要场合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make me appear not that professional\u003c/td>\n\u003ctd>让我显得不够专业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tend to keep serious\u003c/td>\n\u003ctd>倾向于保持严肃\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tease each other\u003c/td>\n\u003ctd>互相打趣、开玩笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>laugh a lot\u003c/td>\n\u003ctd>开怀大笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend time together\u003c/td>\n\u003ctd>一起共处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It makes our time much more enjoyable\u003c/td>\n\u003ctd>让相处时光更加愉快\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>comedy films\u003c/td>\n\u003ctd>喜剧电影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learn a lot from them\u003c/td>\n\u003ctd>从中收获很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tragic core\u003c/td>\n\u003ctd>悲剧内核\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>beneath all the laughter\u003c/td>\n\u003ctd>在欢声笑语之下\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>live stand-up comedy show\u003c/td>\n\u003ctd>现场脱口秀演出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the live atmosphere was really fantastic\u003c/td>\n\u003ctd>现场氛围十分棒\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h1\">1. Are you good at telling jokes?\u003c/h2>\n\u003cp>No, not really. I’m only humorous \u003cmark>when I hang out with my best friends.\u003c/mark> \u003cmark>On some important occasions\u003c/mark>, telling jokes may \u003cmark>make me appear not that professional\u003c/mark>, so I tend to \u003cmark>stay serious\u003c/mark>.\u003c/p>\n\u003cp>我只在和最好的朋友相处时比较风趣。在正式场合，讲笑话会显得我不够专业，所以我一般会保持严肃。\u003c/p>\n\u003ch2 id=\"h2\">2. Do your friends like to tell jokes?\u003c/h2>\n\u003cp>Sure, most of my friends love sharing jokes. We often \u003cmark>tease each other\u003c/mark> and \u003cmark>laugh a lot\u003c/mark> when we \u003cmark>spend time together\u003c/mark>. It \u003cmark>makes our time much more enjoyable.\u003c/mark>\u003c/p>\n\u003cp>是的，我的很多朋友都喜欢讲笑话。我们经常互相打趣，在一起时有说有笑，相处起来轻松很多。\u003c/p>\n\u003ch2 id=\"h3\">3. Do you like to watch comedies?\u003c/h2>\n\u003cp>I’ve always \u003cstrong>been fascinated by\u003c/strong>  \u003cmark>comedy films\u003c/mark>. I can \u003cmark>learn a lot from them\u003c/mark>. Actually, I believe most great comedies have a \u003cmark>tragic core\u003c/mark> \u003cmark>beneath all the laughter.\u003c/mark>\u003c/p>\n\u003cp>我喜欢看喜剧电影，能从中收获很多。实际上我认为，大多数优秀喜剧在欢声笑语之下，内核其实是悲剧。\u003c/p>\n\u003ch2 id=\"h4\">4. Have you ever watched a live show?\u003c/h2>\n\u003cp>Yes, I have watched a \u003cmark>live stand-up comedy show\u003c/mark>. I have to say that \u003cmark>the live atmosphere was fantastic\u003c/mark> — \u003cmark>totally different from\u003c/mark> watching it on TV. It&#39;s also a good way to relax after studying.\u003c/p>\n\u003cp>我看过现场脱口秀。现场氛围特别棒，是忙碌之余放松身心的绝佳方式。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. Are you good at telling jokes?"},{"level":2,"id":"h2","text":"2. Do your friends like to tell jokes?"},{"level":2,"id":"h3","text":"3. Do you like to watch comedies?"},{"level":2,"id":"h4","text":"4. Have you ever watched a live show?"}],"text":"Are you good at telling jokes? Do your friends like to tell jokes? Do you like to watch comedies? Have you ever watched a live show? 英文短语 中文释义 when I hang out with my best friends 和最好的朋友相处时 on some important occasions 在一些重要场合 make me appear not that professional 让我显得不够专业 tend to keep serious 倾向于保持严肃 tease each other 互相打趣、开玩笑 laugh a lot 开怀大笑 spend time together 一起共处 It makes our time much more enjoyable 让相处时光更加愉快 comedy films 喜剧电影 learn a lot from them 从中收获很多 tragic core 悲剧内核 beneath all the laughter 在欢声笑语之下 live stand-up comedy show 现场脱口秀演出 the live atmosphere was really fantastic 现场氛围十分棒 1. Are you good at telling jokes? No, not really. I’m only humorous when I hang out with my best friends. On some important occasions, telling jokes may make me appear not that professional, so I tend to stay serious. 我只在和最好的朋友相处时比较风趣。在正式场合，讲笑话会显得我不够专业，所以我一般会保持严肃。 2. Do your friends like to tell jokes? Sure, most of my friends love sharing jokes. We often tease each other and laugh a lot when we spend time together. It makes our time much more enjoyable. 是的，我的很多朋友都喜欢讲笑话。我们经常互相打趣，在一起时有说有笑，相处起来轻松很多。 3. Do you like to watch comedies? I’ve always been fascinated by comedy films. I can learn a lot from them. Actually, I believe most great comedies have a tragic core beneath all the laughter. 我喜欢看喜剧电影，能从中收获很多。实际上我认为，大多数优秀喜剧在欢声笑语之下，内核其实是悲剧。 4. Have you ever watched a live show? Yes, I have watched a live stand-up comedy show. I have to say that the live atmosphere was fantastic — totally different from watching it on TV. It's also a good way to relax after studying. 我看过现场脱口秀。现场氛围特别棒，是忙碌之余放松身心的绝佳方式。"},{"id":"a-p1-mock","origin":"author","group":"a-p1","file":"原作者笔记/口语/P1/技巧.md","title":"口语模考提示词","html":"\u003cp>你现在是持有IELTS官方认证的资深口语考官，请严格按照雅思口语Part 1、Part 2、Part 3的流程对我进行全真模考\u003c/p>\n\u003cp>你现在是持有IELTS官方认证的资深口语考官，清对我进行part1部分的考试，只能出我给你题库里的题，全真模考\u003c/p>\n\u003cp>要求每个问题回答约30s\u003cbr>要求，相关内容参考我给你的markdown文件\u003cbr>1.gibberish(填充，连接，重复）\u003cbr>2.think out of the box\u003cbr>(简单一点就是communication 少做归纳，对做演绎(时间地点人物感受) 简单的东西说利索\u003cbr>3.collocation(固定搭配，讲到固定搭配的时候不能停\u003c/p>\n\u003cp>例如\u003cbr>你学过跟星星和外太空有关的知识吗？\u003cbr>\u003cstrong>Have you learnt any knowledge about outer space and planets?\u003c/strong>\u003cbr>Yeah, I did. I learned some of it when I was in primary school. But unfortunately, I have forgotten most of them, because they were not going to be on the examination — you know, most Chinese students only study for the exam. But now, I don&#39;t need to take exams anymore, and I&#39;ve started to have a strong interest in planets and outer space, because recently I&#39;ve watched a movie about time travel, which makes me want to learn more about astronomy. I even dream that one day I could go to another planet if it&#39;s not that expensive.\u003c/p>\n\u003cp>md文档是我现有  p1p2积累的素材，基于此，\u003cbr>给我6.0水平的p3口语文案，要求尽可能简单，好记忆\u003cbr>内容要求连贯，我说了上句能一下子想起来下一句话\u003c/p>\n","toc":[],"text":"你现在是持有IELTS官方认证的资深口语考官，请严格按照雅思口语Part 1、Part 2、Part 3的流程对我进行全真模考 你现在是持有IELTS官方认证的资深口语考官，清对我进行part1部分的考试，只能出我给你题库里的题，全真模考 要求每个问题回答约30s 要求，相关内容参考我给你的markdown文件 1.gibberish(填充，连接，重复） 2.think out of the box (简单一点就是communication 少做归纳，对做演绎(时间地点人物感受) 简单的东西说利索 3.collocation(固定搭配，讲到固定搭配的时候不能停 例如 你学过跟星星和外太空有关的知识吗？ Have you learnt any knowledge about outer space and planets? Yeah, I did. I learned some of it when I was in primary school. But unfortunately, I have forgotten most of them, because they were not going to be on the examination — you know, most Chinese students only study for the exam. But now, I don't need to take exams anymore, and I've started to have a strong interest in planets and outer space, because recently I've watched a movie about time travel, which makes me want to learn more about astronomy. I even dream that one day I could go to another planet if it's not that expensive. md文档是我现有 p1p2积累的素材，基于此， 给我6.0水平的p3口语文案，要求尽可能简单，好记忆 内容要求连贯，我说了上句能一下子想起来下一句话"},{"id":"a-p2-01","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/1-推荐旅行地方.md","title":"P2-1 推荐旅行地方","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>Where it is\u003c/li>\n\u003cli>What you saw and did there\u003c/li>\n\u003cli>And explain why you would like to recommend it to others\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>There is a famous saying\u003c/td>\n\u003ctd>有一句著名的俗语\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>ranks first under heaven\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>桂林山水甲天下\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo’s scenery tops Guilin\u003c/td>\n\u003ctd>阳朔山水甲桂林\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I was in primary school\u003c/td>\n\u003ctd>小时候，大概在上小学的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my parents\u003c/td>\n\u003ctd>和父母一同前往\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it did not leave a deep impression on me\u003c/td>\n\u003ctd>没有给我留下很深的印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the weather was hot and humid\u003c/td>\n\u003ctd>气候湿热\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>countless mountains\u003c/td>\n\u003ctd>数不胜数的山峰\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>got into rock climbing\u003c/td>\n\u003ctd>迷上了攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>climbing for two months\u003c/td>\n\u003ctd>练习两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor rock climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>found out\u003c/td>\n\u003ctd>了解到；得知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the birthplace of outdoor rock climbing\u003c/td>\n\u003ctd>野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stays around 20 degrees\u003c/td>\n\u003ctd>气温维持在 20 摄氏度左右\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>all year round\u003c/td>\n\u003ctd>全年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>The most fantastic feature\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>最绝妙的特色\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>unique karst landscape\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>独特的喀斯特地貌\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>more than 70 climbing crags\u003c/td>\n\u003ctd>超过 70 处攀岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Since I am still a student\u003c/td>\n\u003ctd>因为我还是学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked as a volunteer\u003c/td>\n\u003ctd>做志愿者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>local inn\u003c/td>\n\u003ctd>当地民宿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked one day and went rock climbing the next\u003c/td>\n\u003ctd>工作一天，隔天去攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rode an electric bike\u003c/td>\n\u003ctd>骑电动车\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a bowl of rice noodles\u003c/td>\n\u003ctd>一碗米粉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>which only cost six yuan\u003c/td>\n\u003ctd>只需要 6 元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下极其深刻的印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whether you are into rock climbing or not\u003c/td>\n\u003ctd>无论你是否喜欢攀岩\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">1. 开题\u003c/h3>\n\u003cp>I’d like to recommend Yangshuo to others. It’s located in Guilin, Guangxi Province \u003cmark>in southern China\u003c/mark>. \u003cmark>There is a famous saying:\u003c/mark> \u003cmark>Guilin’s scenery ranks first under heaven,\u003c/mark> and \u003cmark>Yangshuo’s scenery tops Guilin.\u003c/mark>\u003c/p>\n\u003cp>我想向大家推荐阳朔。它位于中国南部广西桂林。有一句著名的俗语：桂林山水甲天下，阳朔山水甲桂林。\u003c/p>\n\u003ch3 id=\"h2\">2. 历史\u003c/h3>\n\u003cp>I first visited Yangshuo \u003cmark>when I was in primary school,\u003c/mark> \u003cmark>together with my parents.\u003c/mark> To be honest, \u003cmark>it did not leave a deep impression on me\u003c/mark> back then. I only remembered that \u003cmark>the weather was hot and humid\u003c/mark>, and there were \u003cmark>countless mountains.\u003c/mark>\u003c/p>\n\u003cp>我小时候第一次来到阳朔，大概在上小学的时候，和父母一同前往。说实话，当时这里并没有给我留下很深的印象，我只记得气候湿热，随处都是山峰。\u003c/p>\n\u003ch3 id=\"h3\">3. 过程\u003c/h3>\n\u003ch4>起因\u003c/h4>\n\u003cp>Last year, I \u003cmark>got into rock climbing.\u003c/mark> After \u003cmark>climbing for two months\u003c/mark>, I wanted to \u003cmark>try outdoor climbing\u003c/mark>. Then I \u003cmark>found out\u003c/mark> that Yangshuo is \u003cmark>the birthplace of outdoor rock climbing\u003c/mark> in China. The temperature there \u003cmark>stays around 20 degrees\u003c/mark> \u003cmark>all year round\u003c/mark>. The \u003cmark>unique karst landscape\u003c/mark> is fantastic, and there are \u003cmark>more than 70 climbing crags.\u003c/mark>\u003c/p>\n\u003cp>去年，我迷上了攀岩。在室内攀岩馆练习两个月后，我想要尝试野外攀岩。随后我了解到，阳朔是中国野外攀岩的发源地。当地全年气温维持在 20 摄氏度左右。最让人难忘的特色就是独特的喀斯特地貌，这里拥有超过 70 处攀岩岩壁。\u003c/p>\n\u003ch4>事件\u003c/h4>\n\u003cp>So I went there last September. \u003cmark>Since I was still a student\u003c/mark> and didn’t have much money, I \u003cmark>worked as a volunteer\u003c/mark> in a \u003cmark>local inn\u003c/mark> for roughly two months. \u003cmark>The deal was great\u003c/mark> — I \u003cmark>worked one day\u003c/mark> and \u003cmark>went rock climbing the next.\u003c/mark> In the morning, I usually \u003cmark>rode an electric bike\u003c/mark> to the crags. It was really convenient. In the afternoon, I often \u003cmark>had a bowl of rice noodles\u003c/mark>, \u003cmark>which only cost six yuan\u003c/mark>. This period of time \u003cmark>left a deep impression on me.\u003c/mark>\u003c/p>\n\u003cp>于是去年九月我去到阳朔。因为我还是学生，没有太多积蓄。我在当地一家民宿做志愿者，持续大约两个月。我工作一天，隔天就去攀岩。我经常骑电动车前往攀岩点，出行十分方便。中午我常会吃一碗米粉，只需要 6 元。这段时光给我留下了极其深刻的印象。\u003c/p>\n\u003ch3 id=\"h4\">4. 结果\u003c/h3>\n\u003cp>Therefore, I strongly recommend Yangshuo to everyone, \u003cmark>whether you are into rock climbing or not.\u003c/mark>\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"1. 开题"},{"level":3,"id":"h2","text":"2. 历史"},{"level":3,"id":"h3","text":"3. 过程"},{"level":3,"id":"h4","text":"4. 结果"}],"text":"You should say: What it is Where it is What you saw and did there And explain why you would like to recommend it to others 英文短语 中文释义 in southern China 在中国南部 There is a famous saying 有一句著名的俗语 ranks first under heaven 桂林山水甲天下 Yangshuo’s scenery tops Guilin 阳朔山水甲桂林 when I was in primary school 小时候，大概在上小学的时候 together with my parents 和父母一同前往 it did not leave a deep impression on me 没有给我留下很深的印象 the weather was hot and humid 气候湿热 countless mountains 数不胜数的山峰 got into rock climbing 迷上了攀岩 climbing for two months 练习两个月 try outdoor rock climbing 尝试野外攀岩 found out 了解到；得知 the birthplace of outdoor rock climbing 野外攀岩的发源地 stays around 20 degrees 气温维持在 20 摄氏度左右 all year round 全年 The most fantastic feature 最绝妙的特色 unique karst landscape 独特的喀斯特地貌 more than 70 climbing crags 超过 70 处攀岩岩壁 Since I am still a student 因为我还是学生 worked as a volunteer 做志愿者 local inn 当地民宿 worked one day and went rock climbing the next 工作一天，隔天去攀岩 rode an electric bike 骑电动车 a bowl of rice noodles 一碗米粉 which only cost six yuan 只需要 6 元 left a deep impression on me 给我留下极其深刻的印象 whether you are into rock climbing or not 无论你是否喜欢攀岩 1. 开题 I’d like to recommend Yangshuo to others. It’s located in Guilin, Guangxi Province in southern China. There is a famous saying: Guilin’s scenery ranks first under heaven, and Yangshuo’s scenery tops Guilin. 我想向大家推荐阳朔。它位于中国南部广西桂林。有一句著名的俗语：桂林山水甲天下，阳朔山水甲桂林。 2. 历史 I first visited Yangshuo when I was in primary school, together with my parents. To be honest, it did not leave a deep impression on me back then. I only remembered that the weather was hot and humid, and there were countless mountains. 我小时候第一次来到阳朔，大概在上小学的时候，和父母一同前往。说实话，当时这里并没有给我留下很深的印象，我只记得气候湿热，随处都是山峰。 3. 过程 起因 Last year, I got into rock climbing. After climbing for two months, I wanted to try outdoor climbing. Then I found out that Yangshuo is the birthplace of outdoor rock climbing in China. The temperature there stays around 20 degrees all year round. The unique karst landscape is fantastic, and there are more than 70 climbing crags. 去年，我迷上了攀岩。在室内攀岩馆练习两个月后，我想要尝试野外攀岩。随后我了解到，阳朔是中国野外攀岩的发源地。当地全年气温维持在 20 摄氏度左右。最让人难忘的特色就是独特的喀斯特地貌，这里拥有超过 70 处攀岩岩壁。 事件 So I went there last September. Since I was still a student and didn’t have much money, I worked as a volunteer in a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. In the morning, I usually rode an electric bike to the crags. It was really convenient. In the afternoon, I often had a bowl of rice noodles, which only cost six yuan. This period of time left a deep impression on me. 于是去年九月我去到阳朔。因为我还是学生，没有太多积蓄。我在当地一家民宿做志愿者，持续大约两个月。我工作一天，隔天就去攀岩。我经常骑电动车前往攀岩点，出行十分方便。中午我常会吃一碗米粉，只需要 6 元。这段时光给我留下了极其深刻的印象。 4. 结果 Therefore, I strongly recommend Yangshuo to everyone, whether you are into rock climbing or not."},{"id":"a-p2-02","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/2-早起经历.md","title":"P2-2 早起经历","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When it was\u003c/li>\n\u003cli>What you did\u003c/li>\n\u003cli>Why you got up early\u003c/li>\n\u003cli>And how you felt about it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a morning person\u003c/td>\n\u003ctd>习惯早起的人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I feel more energetic and focused\u003c/td>\n\u003ctd>精力更充沛、注意力更集中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>deal with difficult problems\u003c/td>\n\u003ctd>处理难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>things totally changed\u003c/td>\n\u003ctd>情况彻底改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I got into rock climbing\u003c/td>\n\u003ctd>迷上攀岩之后\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It was last September\u003c/td>\n\u003ctd>那是去年九月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worked as a volunteer\u003c/td>\n\u003ctd>做义工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at a local inn\u003c/td>\n\u003ctd>在当地一家客栈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>for roughly two months\u003c/td>\n\u003ctd>大约两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The deal was great\u003c/td>\n\u003ctd>安排十分划算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>went rock climbing the next\u003c/td>\n\u003ctd>第二天去攀岩\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>my climbing partner\u003c/td>\n\u003ctd>我的攀岩搭档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We got up at half past five\u003c/td>\n\u003ctd>我们五点半起床\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TV Tower Mountain\u003c/td>\n\u003ctd>电视塔山\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reach the top\u003c/td>\n\u003ctd>抵达山顶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just in time for the sunrise\u003c/td>\n\u003ctd>刚好赶上日出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>we couldn’t see it every day\u003c/td>\n\u003ctd>不是每天都能看见日出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it depended on our luck\u003c/td>\n\u003ctd>这取决于我们的运气\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Getting up early\u003c/td>\n\u003ctd>早起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离城市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fully recharge my batteries\u003c/td>\n\u003ctd>充分恢复精力、调整状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I brought two sausages for them\u003c/td>\n\u003ctd>我带两根香肠喂它们\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>walk all the way down with me\u003c/td>\n\u003ctd>一路陪我下山\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下很深的印象\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I’m still not a morning person\u003c/td>\n\u003ctd>我依旧不适合早起、不爱早起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me realise\u003c/td>\n\u003ctd>让我意识到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can be really nice\u003c/td>\n\u003ctd>其实十分美好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memorable experience\u003c/td>\n\u003ctd>难忘的经历\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>To be honest, I’m not really a morning person. Normally, \u003cmark>I feel more energetic and focused\u003c/mark> in the afternoon, so I usually \u003cmark>deal with difficult problems\u003c/mark> at that time. But \u003cmark>things totally changed\u003c/mark> last year \u003cmark>when I got into rock climbing.\u003c/mark>\u003c/p>\n\u003cp>说实话，我算不上习惯早起的人。通常我下午精力更充沛、注意力更集中，所以一般把难的任务放在下午处理。但去年我迷上攀岩之后，情况就完全变了。\u003c/p>\n\u003cp>\u003cmark>It was last September\u003c/mark>. I went to Yangshuo, Guangxi Province \u003cmark>in southern China\u003c/mark>. Since I was still a student and didn’t have much money, I \u003cmark>worked as a volunteer\u003c/mark> \u003cmark>at a local inn\u003c/mark> \u003cmark>for roughly two months.\u003c/mark> \u003cmark>The deal was great\u003c/mark> — I worked one day and \u003cmark>went rock climbing the next.\u003c/mark>\u003c/p>\n\u003cp>那是去年九月，我去了中国南方广西的阳朔。因为当时还是学生，没什么钱，我就在当地一家客栈做了大约两个月义工。安排特别划算 —— 做一天工，第二天就去攀岩。\u003c/p>\n\u003cp>There I met \u003cmark>my climbing partner\u003c/mark> Xiaoya, who was also a volunteer. \u003cmark>We got up at half past five\u003c/mark> every morning and \u003cmark>climbed TV Tower Mountain\u003c/mark>. It took us about 30 minutes \u003cmark>to reach the top\u003c/mark>, \u003cmark>just in time for the sunrise\u003c/mark>. Of course, \u003cmark>we couldn’t see it every day\u003c/mark>. It depended on our luck.\u003c/p>\n\u003cp>在那儿我认识了攀岩搭档小娅，她也是义工。我们每天五点半起床，去爬电视塔山，大概 30 分钟到山顶，刚好赶上日出。当然也不是天天都能看到，得碰上好天气才行。\u003c/p>\n\u003cp>\u003cmark>Getting up early\u003c/mark> let me \u003cmark>take a break from city life\u003c/mark>, \u003cmark>soak up fresh air\u003c/mark> and \u003cmark>fully recharge my batteries\u003c/mark>. What’s more, there were two lovely dogs on the mountain. \u003cmark>I brought two sausages for them\u003c/mark> every morning, and they would \u003cmark>walk all the way down with me\u003c/mark>. That experience really \u003cmark>left a deep impression on me.\u003c/mark>\u003c/p>\n\u003cp>早起让我从城市生活里抽离出来，呼吸新鲜空气，好好调整状态。而且山上有两只很可爱的小狗，我每天早上带两根香肠喂它们，它们就会一路陪我下山。那段经历真的给我留下了很深的印象。\u003c/p>\n\u003cp>Overall, even though \u003cmark>I’m still not a morning person\u003c/mark>, that trip \u003cmark>made me realise\u003c/mark> early mornings \u003cmark>can be really nice\u003c/mark>. It was a very \u003cmark>memorable experience.\u003c/mark>\u003c/p>\n\u003cp>总的来说，虽然我现在还是不爱早起，但那次旅行让我发现清晨其实特别美好，是一段很难忘的经历。\u003c/p>\n","toc":[],"text":"You should say: When it was What you did Why you got up early And how you felt about it 英文短语 中文释义 a morning person 习惯早起的人 I feel more energetic and focused 精力更充沛、注意力更集中 deal with difficult problems 处理难题 things totally changed 情况彻底改变 when I got into rock climbing 迷上攀岩之后 It was last September 那是去年九月 in southern China 在中国南方 worked as a volunteer 做义工 at a local inn 在当地一家客栈 for roughly two months 大约两个月 The deal was great 安排十分划算 went rock climbing the next 第二天去攀岩 my climbing partner 我的攀岩搭档 We got up at half past five 我们五点半起床 TV Tower Mountain 电视塔山 reach the top 抵达山顶 just in time for the sunrise 刚好赶上日出 we couldn’t see it every day 不是每天都能看见日出 it depended on our luck 这取决于我们的运气 Getting up early 早起 take a break from urban life 暂时远离城市生活 soak up fresh air 呼吸新鲜空气 fully recharge my batteries 充分恢复精力、调整状态 I brought two sausages for them 我带两根香肠喂它们 walk all the way down with me 一路陪我下山 left a deep impression on me 给我留下很深的印象 I’m still not a morning person 我依旧不适合早起、不爱早起 made me realise 让我意识到 can be really nice 其实十分美好 memorable experience 难忘的经历 To be honest, I’m not really a morning person. Normally, I feel more energetic and focused in the afternoon, so I usually deal with difficult problems at that time. But things totally changed last year when I got into rock climbing. 说实话，我算不上习惯早起的人。通常我下午精力更充沛、注意力更集中，所以一般把难的任务放在下午处理。但去年我迷上攀岩之后，情况就完全变了。 It was last September. I went to Yangshuo, Guangxi Province in southern China. Since I was still a student and didn’t have much money, I worked as a volunteer at a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. 那是去年九月，我去了中国南方广西的阳朔。因为当时还是学生，没什么钱，我就在当地一家客栈做了大约两个月义工。安排特别划算 —— 做一天工，第二天就去攀岩。 There I met my climbing partner Xiaoya, who was also a volunteer. We got up at half past five every morning and climbed TV Tower Mountain. It took us about 30 minutes to reach the top, just in time for the sunrise. Of course, we couldn’t see it every day. It depended on our luck. 在那儿我认识了攀岩搭档小娅，她也是义工。我们每天五点半起床，去爬电视塔山，大概 30 分钟到山顶，刚好赶上日出。当然也不是天天都能看到，得碰上好天气才行。 Getting up early let me take a break from city life, soak up fresh air and fully recharge my batteries. What’s more, there were two lovely dogs on the mountain. I brought two sausages for them every morning, and they would walk all the way down with me. That experience really left a deep impression on me. 早起让我从城市生活里抽离出来，呼吸新鲜空气，好好调整状态。而且山上有两只很可爱的小狗，我每天早上带两根香肠喂它们，它们就会一路陪我下山。那段经历真的给我留下了很深的印象。 Overall, even though I’m still not a morning person, that trip made me realise early mornings can be really nice. It was a very memorable experience. 总的来说，虽然我现在还是不爱早起，但那次旅行让我发现清晨其实特别美好，是一段很难忘的经历。"},{"id":"a-p2-03","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/3-想有空时去旅游的地方.md","title":"P2-3 想有空时去旅游的地方","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>Where it is\u003c/li>\n\u003cli>What you will do there\u003c/li>\n\u003cli>How long you will stay there\u003c/li>\n\u003cli>And explain why you would like to visit it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>One place I’d like to visit in my free time\u003c/td>\n\u003ctd>闲暇时我想去游览的一个地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in southern China\u003c/td>\n\u003ctd>在中国南部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>There is a famous saying\u003c/td>\n\u003ctd>有一句广为流传的说法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Guilin’s scenery ranks first under heaven\u003c/td>\n\u003ctd>桂林山水甲天下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo’s scenery tops Guilin\u003c/td>\n\u003ctd>阳朔山水甲桂林\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>when I was in primary school\u003c/td>\n\u003ctd>小时候，大概在上小学的时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my parents\u003c/td>\n\u003ctd>和父母一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>it did not leave a deep impression on me\u003c/td>\n\u003ctd>没有给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the weather was hot and humid\u003c/td>\n\u003ctd>天气闷热潮湿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there were countless mountains\u003c/td>\n\u003ctd>群山连绵、有数不尽的山峰\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>In recent years\u003c/td>\n\u003ctd>近几年\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I have got into rock climbing\u003c/td>\n\u003ctd>我迷上了攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practising for two months\u003c/td>\n\u003ctd>练习两个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>climbing vlogs\u003c/td>\n\u003ctd>攀岩短视频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>found out\u003c/td>\n\u003ctd>了解到，发现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the birthplace of outdoor rock climbing in China\u003c/td>\n\u003ctd>中国野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stays around 20 degrees all year round\u003c/td>\n\u003ctd>全年气温维持在 20 摄氏度左右\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The most impressive feature\u003c/td>\n\u003ctd>最令人惊艳、最吸引人的特点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>its unique karst landscape\u003c/td>\n\u003ctd>独特的喀斯特地貌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>there are more than 70 climbing crags\u003c/td>\n\u003ctd>拥有 70 余处攀岩岩壁\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>If I get the opportunity\u003c/td>\n\u003ctd>如果我有机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>travel there and climb for several months\u003c/td>\n\u003ctd>去那里旅行攀岩数月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take a break from urban life\u003c/td>\n\u003ctd>暂时远离城市生活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>soak up some fresh air\u003c/td>\n\u003ctd>呼吸新鲜空气\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recharge my batteries\u003c/td>\n\u003ctd>休整、恢复精力（地道口语短语）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>That’s exactly why I hope to travel there\u003c/td>\n\u003ctd>这正是我想去那里旅行的原因（结尾万能句）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cmark>One place I’d like to visit in my free time\u003c/mark> is Yangshuo. It’s located in Guilin, Guangxi Province \u003cmark>in southern China.\u003c/mark> \u003cmark>There is a famous saying:\u003c/mark> \u003cmark>Guilin’s scenery ranks first under heaven,\u003c/mark> and \u003cmark>Yangshuo’s scenery tops Guilin.\u003c/mark>\u003c/p>\n\u003cp>闲暇时我想去游览的一个地方是阳朔。它位于中国南部广西桂林市。有一句广为流传的说法：桂林山水甲天下，阳朔山水甲桂林。\u003c/p>\n\u003cp>I first visited Yangshuo \u003cmark>when I was in primary school,\u003c/mark> \u003cmark>together with my parents.\u003c/mark> To be honest, \u003cmark>it did not leave a deep impression on me\u003c/mark> back then. I only remembered that \u003cmark>the weather was hot and humid,\u003c/mark> and \u003cmark>there were countless mountains.\u003c/mark>\u003cbr>我小时候第一次去阳朔，大概是上小学的时候，和父母一同前往。说实话，那时阳朔并没有给我留下深刻印象。我只记得当地天气闷热潮湿，群山连绵不绝。\u003c/p>\n\u003cp>\u003cmark>In recent years,\u003c/mark> \u003cmark>I have got into rock climbing\u003c/mark>. After \u003cmark>practising for two months,\u003c/mark> I really want to \u003cmark>try outdoor climbing\u003c/mark>. After watching lots of \u003cmark>climbing vlogs\u003c/mark> on YouTube and Bilibili, I \u003cmark>found out\u003c/mark> that Yangshuo is \u003cmark>the birthplace of outdoor rock climbing in China\u003c/mark>. The temperature there \u003cmark>stays around 20 degrees all year round\u003c/mark>. \u003cmark>The most impressive feature\u003c/mark> is \u003cmark>its unique karst landscape\u003c/mark>, and \u003cmark>there are more than 70 climbing crags.\u003c/mark>\u003c/p>\n\u003cp>近几年，我爱上了攀岩。经过两个月练习后，我十分想要尝试野外攀岩。我在油管和 B 站观看了许多攀岩短视频后了解到，阳朔是中国野外攀岩的发源地。当地全年气温大约维持在 20 摄氏度。最吸引人的就是独特的喀斯特地貌，而且这里拥有 70 余处攀岩岩壁。\u003c/p>\n\u003cp>\u003cmark>If I get the opportunity,\u003c/mark> I plan to \u003cmark>travel there and climb for several months.\u003c/mark> I hope to \u003cmark>take a break from urban life,\u003c/mark> \u003cmark>soak up some fresh air\u003c/mark> and \u003cmark>recharge my batteries.\u003c/mark> \u003cmark>That’s exactly why I hope to travel there.\u003c/mark>\u003c/p>\n\u003cp>如果有机会，我打算前往阳朔，在那里攀岩数月。我希望暂时远离城市生活，呼吸新鲜空气，好好休整恢复状态。这正是我想去那里旅行的原因。\u003c/p>\n\u003chr>\n","toc":[],"text":"You should say: Where it is What you will do there How long you will stay there And explain why you would like to visit it 英文短语 中文释义 One place I’d like to visit in my free time 闲暇时我想去游览的一个地方 in southern China 在中国南部 There is a famous saying 有一句广为流传的说法 Guilin’s scenery ranks first under heaven 桂林山水甲天下 Yangshuo’s scenery tops Guilin 阳朔山水甲桂林 when I was in primary school 小时候，大概在上小学的时候 together with my parents 和父母一起 it did not leave a deep impression on me 没有给我留下深刻印象 the weather was hot and humid 天气闷热潮湿 there were countless mountains 群山连绵、有数不尽的山峰 In recent years 近几年 I have got into rock climbing 我迷上了攀岩 practising for two months 练习两个月 try outdoor climbing 尝试野外攀岩 climbing vlogs 攀岩短视频 found out 了解到，发现 the birthplace of outdoor rock climbing in China 中国野外攀岩的发源地 stays around 20 degrees all year round 全年气温维持在 20 摄氏度左右 The most impressive feature 最令人惊艳、最吸引人的特点 its unique karst landscape 独特的喀斯特地貌 there are more than 70 climbing crags 拥有 70 余处攀岩岩壁 If I get the opportunity 如果我有机会 travel there and climb for several months 去那里旅行攀岩数月 take a break from urban life 暂时远离城市生活 soak up some fresh air 呼吸新鲜空气 recharge my batteries 休整、恢复精力（地道口语短语） That’s exactly why I hope to travel there 这正是我想去那里旅行的原因（结尾万能句） One place I’d like to visit in my free time is Yangshuo. It’s located in Guilin, Guangxi Province in southern China. There is a famous saying: Guilin’s scenery ranks first under heaven, and Yangshuo’s scenery tops Guilin. 闲暇时我想去游览的一个地方是阳朔。它位于中国南部广西桂林市。有一句广为流传的说法：桂林山水甲天下，阳朔山水甲桂林。 I first visited Yangshuo when I was in primary school, together with my parents. To be honest, it did not leave a deep impression on me back then. I only remembered that the weather was hot and humid, and there were countless mountains. 我小时候第一次去阳朔，大概是上小学的时候，和父母一同前往。说实话，那时阳朔并没有给我留下深刻印象。我只记得当地天气闷热潮湿，群山连绵不绝。 In recent years, I have got into rock climbing. After practising for two months, I really want to try outdoor climbing. After watching lots of climbing vlogs on YouTube and Bilibili, I found out that Yangshuo is the birthplace of outdoor rock climbing in China. The temperature there stays around 20 degrees all year round. The most impressive feature is its unique karst landscape, and there are more than 70 climbing crags. 近几年，我爱上了攀岩。经过两个月练习后，我十分想要尝试野外攀岩。我在油管和 B 站观看了许多攀岩短视频后了解到，阳朔是中国野外攀岩的发源地。当地全年气温大约维持在 20 摄氏度。最吸引人的就是独特的喀斯特地貌，而且这里拥有 70 余处攀岩岩壁。 If I get the opportunity, I plan to travel there and climb for several months. I hope to take a break from urban life, soak up some fresh air and recharge my batteries. That’s exactly why I hope to travel there. 如果有机会，我打算前往阳朔，在那里攀岩数月。我希望暂时远离城市生活，呼吸新鲜空气，好好休整恢复状态。这正是我想去那里旅行的原因。"},{"id":"a-p2-04","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/4-医疗行业人.md","title":"P2-4 医疗行业的人","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When you knew him/her\u003c/li>\n\u003cli>When he/she started to think about that\u003c/li>\n\u003cli>What he/she would like to do\u003c/li>\n\u003cli>And explain why he/she would like to choose this career\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>got to know each other\u003c/td>\n\u003ctd>互相认识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine doctor\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s interesting to note that\u003c/td>\n\u003ctd>有意思的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look like a doctor\u003c/td>\n\u003ctd>看起来像医生\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a doctor\u003c/td>\n\u003ctd>成为医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like me\u003c/td>\n\u003ctd>就像我一样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronics, mechanical engineering or computer science\u003c/td>\n\u003ctd>电子、机械工程或者计算机科学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>everything changed\u003c/td>\n\u003ctd>一切都改变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in his father&#39;s clinic\u003c/td>\n\u003ctd>在他父亲的诊所里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help many patients\u003c/td>\n\u003ctd>帮助很多病人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recover from illnesses\u003c/td>\n\u003ctd>摆脱病痛、康复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>offered free treatment\u003c/td>\n\u003ctd>提供免费诊疗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up his mind\u003c/td>\n\u003ctd>下定决心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses\u003c/td>\n\u003ctd>专业课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical medical knowledge\u003c/td>\n\u003ctd>实用的医学知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gives him a real sense of achievement\u003c/td>\n\u003ctd>让他很有成就感\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main reason for him to choose this job\u003c/td>\n\u003ctd>他选择这份工作最主要的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>admires his father’s spirit\u003c/td>\n\u003ctd>欣赏她父亲的精神\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so proud of\u003c/td>\n\u003ctd>为…… 感到十分骄傲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>studying medicine\u003c/td>\n\u003ctd>学医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is never an easy journey\u003c/td>\n\u003ctd>从来都不是一件容易的事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h1\">- 1. When you knew him/her\u003c/h3>\n\u003cp>I’d like to talk about my best friend Kaiyao. We \u003cmark>got to know each other\u003c/mark> when I was in primary school. His father is a \u003cmark>traditional Chinese medicine doctor.\u003c/mark> \u003cmark>It’s interesting to note that\u003c/mark> \u003cmark>he doesn’t look like a doctor at all\u003c/mark> — he is really tall and strong.\u003c/p>\n\u003cp>我想介绍我的好朋友凯耀。我们很小的时候就认识了，大概是在上小学的时候。他的父亲是一名中医。有趣的是，他看上去一点儿都不像医生 —— 他个子很高，体格健壮。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h2\">2. When he/she started to think about that\u003c/h3>\n\u003cp>At first, he didn&#39;t want to \u003cmark>be a doctor\u003c/mark> at all. He also wanted to become an engineer, \u003cmark>just like me\u003c/mark>. We planned to study \u003cmark>electronics, mechanical engineering or computer science.\u003c/mark>\u003cbr>However, \u003cmark>everything changed\u003c/mark> after he spent one summer working \u003cmark>in his father&#39;s clinic\u003c/mark>. He watched his father \u003cmark>help many patients\u003c/mark> \u003cmark>recover from illnesses\u003c/mark>. What’s more, his father \u003cmark>offered free treatment\u003c/mark> for poor people.\u003c/p>\n\u003cp>最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。\u003cbr>但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。\u003c/p>\n\u003chr>\n\u003ch3 id=\"h3\">3.What he/she would like to do\u003c/h3>\n\u003cp>After that, he \u003cmark>made up his mind\u003c/mark> to learn \u003cmark>traditional Chinese medicine\u003c/mark> at university. Although some \u003cmark>professional courses\u003c/mark> are challenging, he can gain a lot of \u003cmark>practical medical knowledge\u003c/mark>, which \u003cmark>gives him a real sense of achievement.\u003c/mark>\u003c/p>\n\u003cp>在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。\u003c/p>\n\u003ch3 id=\"h4\">4. And explain why he/she would like to choose this career\u003c/h3>\n\u003chr>\n\u003cp>\u003cmark>The main reason for him to choose this job\u003c/mark> is that he really \u003cmark>admires his father’s spirit\u003c/mark>. He wants to become a doctor like his father one day. I am \u003cmark>so proud of\u003c/mark> Kaiyao, because \u003cmark>studying medicine\u003c/mark> \u003cmark>is never an easy journey.\u003c/mark>\u003c/p>\n\u003cp>他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。\u003c/p>\n","toc":[{"level":3,"id":"h1","text":"- 1. When you knew him/her"},{"level":3,"id":"h2","text":"2. When he/she started to think about that"},{"level":3,"id":"h3","text":"3.What he/she would like to do"},{"level":3,"id":"h4","text":"4. And explain why he/she would like to choose this career"}],"text":"You should say: When you knew him/her When he/she started to think about that What he/she would like to do And explain why he/she would like to choose this career 英文短语 中文释义 got to know each other 互相认识 traditional Chinese medicine doctor 中医 It’s interesting to note that 有意思的是 look like a doctor 看起来像医生 being a doctor 成为医生 just like me 就像我一样 electronics, mechanical engineering or computer science 电子、机械工程或者计算机科学 everything changed 一切都改变了 in his father's clinic 在他父亲的诊所里 help many patients 帮助很多病人 recover from illnesses 摆脱病痛、康复 offered free treatment 提供免费诊疗 made up his mind 下定决心 traditional Chinese medicine 中医 professional courses 专业课 practical medical knowledge 实用的医学知识 gives him a real sense of achievement 让他很有成就感 The main reason for him to choose this job 他选择这份工作最主要的原因 admires his father’s spirit 欣赏她父亲的精神 so proud of 为…… 感到十分骄傲 studying medicine 学医 is never an easy journey 从来都不是一件容易的事 - 1. When you knew him/her I’d like to talk about my best friend Kaiyao. We got to know each other when I was in primary school. His father is a traditional Chinese medicine doctor. It’s interesting to note that he doesn’t look like a doctor at all — he is really tall and strong. 我想介绍我的好朋友凯耀。我们很小的时候就认识了，大概是在上小学的时候。他的父亲是一名中医。有趣的是，他看上去一点儿都不像医生 —— 他个子很高，体格健壮。 2. When he/she started to think about that At first, he didn't want to be a doctor at all. He also wanted to become an engineer, just like me. We planned to study electronics, mechanical engineering or computer science. However, everything changed after he spent one summer working in his father's clinic. He watched his father help many patients recover from illnesses. What’s more, his father offered free treatment for poor people. 最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。 但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。 3.What he/she would like to do After that, he made up his mind to learn traditional Chinese medicine at university. Although some professional courses are challenging, he can gain a lot of practical medical knowledge, which gives him a real sense of achievement. 在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。 4. And explain why he/she would like to choose this career The main reason for him to choose this job is that he really admires his father’s spirit. He wants to become a doctor like his father one day. I am so proud of Kaiyao, because studying medicine is never an easy journey. 他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。"},{"id":"a-p2-05","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/5-体育赛事 & 电视节目.md","title":"P2-5 体育赛事 & 电视节目","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it was\u003c/li>\n\u003cli>When and where you watched it\u003c/li>\n\u003cli>Who you watched it with\u003c/li>\n\u003cli>And explain why you liked it\u003c/li>\n\u003c/ul>\n\u003ch1>Describe a TV show/online program you have watched recently   最近看过的电视/网络节目\u003c/h1>\n\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is\u003c/li>\n\u003cli>What it is about\u003c/li>\n\u003cli>How often you watch it\u003c/li>\n\u003cli>And explain how you feel about it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>marathon competition\u003c/td>\n\u003ctd>马拉松比赛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>the INEOS 1:59 Challenge\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>INEOS 1:59 破二挑战\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>took place in Vienna\u003c/td>\n\u003ctd>在维也纳举办\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The athlete was\u003c/td>\n\u003ctd>参赛运动员是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the first person to\u003c/td>\n\u003ctd>第一位……的人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>complete a marathon\u003c/td>\n\u003ctd>完成全程马拉松\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in two hours\u003c/td>\n\u003ctd>在两小时之内\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>live broadcast\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>现场直播\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>together with my father\u003c/td>\n\u003ctd>和我的父亲一起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>officially recognised\u003c/td>\n\u003ctd>官方认可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Even so\u003c/td>\n\u003ctd>即便如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>no human is limited\u003c/td>\n\u003ctd>人类没有极限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I was not interested in it at all\u003c/td>\n\u003ctd>我完全不感兴趣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>left a deep impression on me\u003c/td>\n\u003ctd>给我留下深刻印象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>felt really nervous\u003c/td>\n\u003ctd>感到非常紧张\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It almost felt like\u003c/td>\n\u003ctd>几乎感觉就像\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>crossed the finishing line\u003c/mark>\u003c/td>\n\u003ctd>\u003cmark>冲过终点线\u003c/mark>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>less than two hours\u003c/td>\n\u003ctd>不到两小时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheered loudly with excitement\u003c/td>\n\u003ctd>激动地大声欢呼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>touched me deeply\u003c/td>\n\u003ctd>深深打动了我\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cheer me up\u003c/td>\n\u003ctd>让我振作起来\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help me keep going\u003c/td>\n\u003ctd>帮助我坚持下去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>especially when I feel tired\u003c/td>\n\u003ctd>尤其当我感到疲惫时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>want to give up halfway\u003c/td>\n\u003ctd>想要半途而废\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>I’d like to talk about a famous \u003cmark>marathon competition\u003c/mark> called the \u003cmark>INEOS 1:59 Challenge\u003c/mark>. It \u003cmark>took place in Vienna.\u003c/mark> \u003cmark>The athlete was\u003c/mark> Eliud Kipchoge from Kenya. He became \u003cmark>the first person to\u003c/mark> \u003cmark>complete a marathon\u003c/mark> \u003cmark>in two hours.\u003c/mark>\u003c/p>\n\u003cp>我想聊一场著名的马拉松挑战，名为 Ineos 1:59 挑战。赛事在奥地利维也纳举办。参赛选手是肯尼亚运动员埃利乌德・基普乔戈。他是人类历史上第一位全程马拉松跑进 2 小时的人。\u003c/p>\n\u003cp>I watched the \u003cmark>live broadcast\u003c/mark> at home when I was in high school, \u003cmark>together with my father.\u003c/mark> This competition was not \u003cmark>officially recognised\u003c/mark> by World Athletics. \u003cmark>Even so\u003c/mark>, it proved that \u003cmark>no human is limited\u003c/mark>\u003c/p>\n\u003cp>高中的时候，我和父亲在家观看了这场直播。这场挑战没有得到国际田联官方认可。即便如此，它证明人类没有极限\u003c/p>\n\u003cp>At that time, my father loved running, but \u003cmark>I was not interested in it at all\u003c/mark>. I thought running was boring and tiring. However, Kipchoge’s story really \u003cmark>left a deep impression on me\u003c/mark>. After that, I got into running, even thought of going professional, but unfortunately, I didn&#39;t succeed.\u003c/p>\n\u003cp>那时候，我的父亲热爱跑步，但我一点兴趣都没有，我觉得跑步很累。但是基普乔戈的故事深深吸引了我。\u003c/p>\n\u003cp>We \u003cmark>felt really nervous\u003c/mark> during the whole competition. \u003cmark>I almost felt like\u003c/mark> I was running with him. When Kipchoge \u003cmark>crossed the finishing line\u003c/mark> and the time was \u003cmark>less than two hours\u003c/mark>, my dad and I \u003cmark>cheered loudly with excitement.\u003c/mark>\u003c/p>\n\u003cp>整场挑战过程中我们都十分紧张，仿佛自己正在奔跑。当基普乔戈冲过终点线，计时器显示用时不足两小时，我和父亲激动地大声欢呼。\u003c/p>\n\u003cp>I love this sports event because Kipchoge’s spirit \u003cmark>touched me deeply\u003c/mark>. It can really \u003cmark>cheer me up\u003c/mark> and \u003cmark>help me keep going\u003c/mark>, \u003cmark>especially when I feel tired\u003c/mark> and \u003cmark>want to give up halfway.\u003c/mark> \u003c/p>\n\u003cp>我喜欢这场赛事，主要是因为基普乔格的精神深深打动了我。这种精神能够鼓舞我、支撑我继续前行，尤其是在我身心疲惫、想要半途而废的时候。\u003c/p>\n\u003chr>\n\u003cp>I wanted to learn more about him, \u003cmark>both on training and competitions\u003c/mark>. I found he was \u003cmark>extremely strict with himself.\u003c/mark> \u003c/p>\n\u003cp>我开始关注他的比赛与训练。我发现他高度自律，对自己要求严苛。\u003c/p>\n","toc":[],"text":"You should say: What it was When and where you watched it Who you watched it with And explain why you liked it Describe a TV show/online program you have watched recently 最近看过的电视/网络节目 You should say: What it is What it is about How often you watch it And explain how you feel about it 英文短语 中文翻译 marathon competition 马拉松比赛 the INEOS 1:59 Challenge INEOS 1:59 破二挑战 took place in Vienna 在维也纳举办 The athlete was 参赛运动员是 the first person to 第一位……的人 complete a marathon 完成全程马拉松 in two hours 在两小时之内 live broadcast 现场直播 together with my father 和我的父亲一起 officially recognised 官方认可 Even so 即便如此 no human is limited 人类没有极限 I was not interested in it at all 我完全不感兴趣 left a deep impression on me 给我留下深刻印象 felt really nervous 感到非常紧张 It almost felt like 几乎感觉就像 crossed the finishing line 冲过终点线 less than two hours 不到两小时 cheered loudly with excitement 激动地大声欢呼 touched me deeply 深深打动了我 cheer me up 让我振作起来 help me keep going 帮助我坚持下去 especially when I feel tired 尤其当我感到疲惫时 want to give up halfway 想要半途而废 I’d like to talk about a famous marathon competition called the INEOS 1:59 Challenge. It took place in Vienna. The athlete was Eliud Kipchoge from Kenya. He became the first person to complete a marathon in two hours. 我想聊一场著名的马拉松挑战，名为 Ineos 1:59 挑战。赛事在奥地利维也纳举办。参赛选手是肯尼亚运动员埃利乌德・基普乔戈。他是人类历史上第一位全程马拉松跑进 2 小时的人。 I watched the live broadcast at home when I was in high school, together with my father. This competition was not officially recognised by World Athletics. Even so, it proved that no human is limited 高中的时候，我和父亲在家观看了这场直播。这场挑战没有得到国际田联官方认可。即便如此，它证明人类没有极限 At that time, my father loved running, but I was not interested in it at all. I thought running was boring and tiring. However, Kipchoge’s story really left a deep impression on me. After that, I got into running, even thought of going professional, but unfortunately, I didn't succeed. 那时候，我的父亲热爱跑步，但我一点兴趣都没有，我觉得跑步很累。但是基普乔戈的故事深深吸引了我。 We felt really nervous during the whole competition. I almost felt like I was running with him. When Kipchoge crossed the finishing line and the time was less than two hours, my dad and I cheered loudly with excitement. 整场挑战过程中我们都十分紧张，仿佛自己正在奔跑。当基普乔戈冲过终点线，计时器显示用时不足两小时，我和父亲激动地大声欢呼。 I love this sports event because Kipchoge’s spirit touched me deeply. It can really cheer me up and help me keep going, especially when I feel tired and want to give up halfway. 我喜欢这场赛事，主要是因为基普乔格的精神深深打动了我。这种精神能够鼓舞我、支撑我继续前行，尤其是在我身心疲惫、想要半途而废的时候。 I wanted to learn more about him, both on training and competitions. I found he was extremely strict with himself. 我开始关注他的比赛与训练。我发现他高度自律，对自己要求严苛。"},{"id":"a-p2-06","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/6-长久抱负、目标.md","title":"P2-6 长久抱负、目标","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>How long you have had this goal/ambition\u003c/li>\n\u003cli>What it is\u003c/li>\n\u003cli>How you will achieve it\u003c/li>\n\u003cli>And explain why you set it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>become an engineer\u003c/td>\n\u003ctd>成为一名工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>undergraduate studies\u003c/td>\n\u003ctd>本科学习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Measurement, Control Technology and Instrument\u003c/td>\n\u003ctd>测控技术与仪器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hands-on experiments\u003c/td>\n\u003ctd>实验室里的实操实验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses are challenging\u003c/td>\n\u003ctd>专业课有难度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>practical engineering knowledge\u003c/td>\n\u003ctd>实用的工程知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>makes me feel really rewarded\u003c/td>\n\u003ctd>让我收获满满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>finish my master’s degree\u003c/td>\n\u003ctd>完成硕士学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At the same time\u003c/td>\n\u003ctd>与此同时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take some high-quality internships\u003c/td>\n\u003ctd>参加一些高质量实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve my practical skills\u003c/td>\n\u003ctd>提升实操能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>work as an engineer\u003c/td>\n\u003ctd>当一名工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>set this goal\u003c/td>\n\u003ctd>设立这个目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronic devices\u003c/td>\n\u003ctd>电子设备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>employment prospects\u003c/td>\n\u003ctd>就业前景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up my mind to learn it\u003c/td>\n\u003ctd>下定决心学它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>use my professional knowledge\u003c/td>\n\u003ctd>用我的专业知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>solve real-world problems\u003c/td>\n\u003ctd>解决现实问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>More specifically\u003c/td>\n\u003ctd>具体来说\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>optimize self-driving algorithms\u003c/td>\n\u003ctd>优化自动驾驶算法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>agile but safe\u003c/td>\n\u003ctd>灵活且安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s challenging for me\u003c/td>\n\u003ctd>这对我来说有挑战\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003cp>Today I’d like to talk about a long-term goal I have. My goal is to \u003cmark>become an engineer\u003c/mark> in the field of autonomous driving. \u003c/p>\n\u003cp>今天我想聊一个我的长期目标。我的目标是成为一名自动驾驶领域的工程师。\u003c/p>\n\u003chr>\n\u003cp> I’ve had this goal for about \u003cstrong>five years\u003c/strong>, ever since I started my \u003cmark>undergraduate studies\u003c/mark> in \u003cmark>Measurement, Control Technology and Instrument.\u003c/mark>  I really enjoy my studies, especially those \u003cmark>hands-on experiments\u003c/mark>. Although some \u003cmark>professional courses are challenging\u003c/mark>, I can learn lots of \u003cmark>practical engineering knowledge\u003c/mark>. It always \u003cmark>makes me feel really rewarded.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>有这个目标多久了\u003c/strong> – 这个目标我已经有了\u003cstrong>大约五年\u003c/strong>，从我本科读测控技术与仪器专业开始。我十分享受学习，尤其喜欢实验室里的实操实验。虽然部分专业课难度不小，但我能学到大量实用的工程知识，这总会让我收获满满。\u003c/p>\n\u003chr>\n\u003cp> Well, first, I’ll \u003cmark>\u003cstrong>finish my master’s degree\u003c/strong>\u003c/mark> in the next three years. \u003cmark>At the same time\u003c/mark>, I plan to \u003cmark>\u003cstrong>take some high-quality internships\u003c/strong>\u003c/mark> to \u003cmark>\u003cstrong>improve my practical skills\u003c/strong>.\u003c/mark> After graduation, I’ll \u003cmark>\u003cstrong>work as an engineer\u003c/strong>\u003c/mark> in an autonomous driving company. \u003c/p>\n\u003cp>\u003cstrong>如何实现\u003c/strong> – 首先，未来三年我会\u003cstrong>完成硕士学位\u003c/strong>。同时，我打算\u003cstrong>参加一些高质量的实习\u003c/strong>来\u003cstrong>提升实操能力\u003c/strong>。毕业后，我会在一家自动驾驶公司\u003cstrong>当工程师\u003c/strong>。我知道路还很长，但我准备好了。\u003c/p>\n\u003chr>\n\u003cp>I \u003cmark>set this goal\u003c/mark> for two reasons.\u003cbr>First, I’ve always been fascinated by \u003cmark>electronic devices\u003c/mark> since I was a kid. Besides, the \u003cmark>employment prospects\u003c/mark> were promising, so I \u003cmark>made up my mind to learn it.\u003c/mark>\u003cbr>Apart from this, I hope I can \u003cmark>**use my professional knowledge\u003c/mark> to \u003cmark>solve real-world problems**\u003c/mark>. \u003cmark>More specifically,\u003c/mark> I want to \u003cmark>\u003cstrong>optimize self-driving algorithms\u003c/strong>\u003c/mark> to make them \u003cmark>\u003cstrong>agile but safe\u003c/strong>.\u003c/mark>\u003c/p>\n\u003cp>\u003cstrong>为什么设立这个目标\u003c/strong> – 我设立这个目标有两个原因。第一，我从小就对电子设备着迷，所以工程学是我的热情所在。第二，我希望\u003cstrong>用专业知识解决现实问题\u003c/strong>。具体来说，我想优化自动驾驶算法，让它既灵活又安全。\u003c/p>\n\u003chr>\n\u003cp>So, that’s my long-term goal. \u003cmark>It’s challenging for me\u003c/mark>, but I believe I can make it.\u003cbr>所以，这就是我的长期目标。很有挑战，但我相信我能做到。\u003c/p>\n","toc":[],"text":"You should
