ctd>without any ropes or safety equipment\u003c/td>\n\u003ctd>不携带绳索、没有任何安全保护装备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>even a tiny mistake can cost you your life.\u003c/td>\n\u003ctd>哪怕一个微小失误，都可能失去生命。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After climbing for two months\u003c/td>\n\u003ctd>练习攀岩两个月后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>try outdoor climbing\u003c/td>\n\u003ctd>尝试野外攀岩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yangshuo is the birthplace of outdoor rock climbing\u003c/td>\n\u003ctd>阳朔是中国野外攀岩的发源地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The deal was great\u003c/td>\n\u003ctd>这个安排很不错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>whether you are into rock climbing or not.\u003c/td>\n\u003ctd>无论你是否喜欢攀岩。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today, I&#39;ll talk about a movie called Free Solo, and I watched it at home with my dad last year. It really left a deep impression on me.\u003c/p>\n\u003cp>今天我想聊一部名为《徒手攀岩》的电影。去年我和爸爸在家观看了这部影片。它给我留下了十分深刻的印象\u003c/p>\n\u003chr>\n\u003cp>The movie is about \u003cmark>a professional rock climber\u003c/mark> named Alex Honnold. It records his \u003cmark>entire process\u003c/mark> of \u003cmark>free solo climbing El Capitan\u003c/mark>, which is a \u003cmark>granite cliff\u003c/mark> in \u003cmark>Yosemite National Park\u003c/mark> in the United States. Free solo means climbing \u003cmark>without any ropes or safety equipment\u003c/mark>, \u003cmark>even a tiny mistake can cost you your life.\u003c/mark>\u003c/p>\n\u003cp>这部电影讲述了职业攀岩者亚历克斯・霍诺尔德的故事。影片记录了他徒手攀登酋长岩的全过程，酋长岩是美国优胜美地国家公园内一座高达 3000 英尺的花岗岩峭壁。徒手攀岩就是不携带绳索、没有任何安全保护装备进行攀登，哪怕一个微小失误，都可能失去生命。\u003c/p>\n\u003chr>\n\u003cp>After that, I got into rock climbing. \u003cmark>After climbing for two months\u003c/mark>, I wanted to \u003cmark>try outdoor climbing\u003c/mark>. I found out that \u003cmark>Yangshuo is the birthplace of outdoor rock climbing\u003c/mark> in China. So I went there last September. Since I was still a student and didn’t have much money, I worked as a volunteer in a local inn for roughly two months. \u003cmark>The deal was great\u003c/mark> — I worked one day and went rock climbing the next.\u003c/p>\n\u003cp>看完电影之后，我开始迷上攀岩。练习攀岩两个月后，我想要尝试野外攀岩。我了解到阳朔是中国野外攀岩的发源地，于是去年九月我去到了那里。当时我还是学生，手头并不宽裕，就在当地一家客栈做了大约两个月的义工。这个安排很不错：工作一天，第二天就可以去攀岩。\u003c/p>\n\u003chr>\n\u003cp>I strongly recommend Free Solo to everyone, \u003cmark>whether you are into rock climbing or not.\u003c/mark>\u003c/p>\n\u003cp>向所有人强烈推荐《徒手攀岩》这部影片，无论你是否喜欢攀岩。\u003c/p>\n","toc":[],"text":"You should say: When and where you watched it Who you watched it with What it was about And explain why you watched this movie 英文原短语 中文翻译 a professional rock climber 职业攀岩者 entire process 全过程 free solo climbing El Capitan 徒手攀登酋长岩 granite cliff 3000英尺高的花岗岩峭壁 Yosemite National Park 优胜美地国家公园 without any ropes or safety equipment 不携带绳索、没有任何安全保护装备 even a tiny mistake can cost you your life. 哪怕一个微小失误，都可能失去生命。 After climbing for two months 练习攀岩两个月后 try outdoor climbing 尝试野外攀岩 Yangshuo is the birthplace of outdoor rock climbing 阳朔是中国野外攀岩的发源地 The deal was great 这个安排很不错 whether you are into rock climbing or not. 无论你是否喜欢攀岩。 Today, I'll talk about a movie called Free Solo, and I watched it at home with my dad last year. It really left a deep impression on me. 今天我想聊一部名为《徒手攀岩》的电影。去年我和爸爸在家观看了这部影片。它给我留下了十分深刻的印象 The movie is about a professional rock climber named Alex Honnold. It records his entire process of free solo climbing El Capitan, which is a granite cliff in Yosemite National Park in the United States. Free solo means climbing without any ropes or safety equipment, even a tiny mistake can cost you your life. 这部电影讲述了职业攀岩者亚历克斯・霍诺尔德的故事。影片记录了他徒手攀登酋长岩的全过程，酋长岩是美国优胜美地国家公园内一座高达 3000 英尺的花岗岩峭壁。徒手攀岩就是不携带绳索、没有任何安全保护装备进行攀登，哪怕一个微小失误，都可能失去生命。 After that, I got into rock climbing. After climbing for two months, I wanted to try outdoor climbing. I found out that Yangshuo is the birthplace of outdoor rock climbing in China. So I went there last September. Since I was still a student and didn’t have much money, I worked as a volunteer in a local inn for roughly two months. The deal was great — I worked one day and went rock climbing the next. 看完电影之后，我开始迷上攀岩。练习攀岩两个月后，我想要尝试野外攀岩。我了解到阳朔是中国野外攀岩的发源地，于是去年九月我去到了那里。当时我还是学生，手头并不宽裕，就在当地一家客栈做了大约两个月的义工。这个安排很不错：工作一天，第二天就可以去攀岩。 I strongly recommend Free Solo to everyone, whether you are into rock climbing or not. 向所有人强烈推荐《徒手攀岩》这部影片，无论你是否喜欢攀岩。"},{"id":"a-p2-11","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/11-为家人感到骄傲.md","title":"P2-11 为家人感到骄傲","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>When it happened\u003c/li>\n\u003cli>Who the person is\u003c/li>\n\u003cli>What the person did\u003c/li>\n\u003cli>And explain why you felt proud of him/her\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>we grew up together.\u003c/mark>\u003c/td>\n\u003ctd>我们一起长大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine doctor\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s interesting to note that\u003c/td>\n\u003ctd>有意思的是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>look like a doctor\u003c/td>\n\u003ctd>看起来像医生\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a doctor\u003c/td>\n\u003ctd>成为医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just like me\u003c/td>\n\u003ctd>就像我一样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>electronics, mechanical engineering or computer science\u003c/td>\n\u003ctd>电子、机械工程或者计算机科学\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>everything changed\u003c/td>\n\u003ctd>一切都改变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in his father&#39;s clinic\u003c/td>\n\u003ctd>在他父亲的诊所里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>help many patients\u003c/td>\n\u003ctd>帮助很多病人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recover from illnesses\u003c/td>\n\u003ctd>摆脱病痛、康复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>offered free treatment\u003c/mark>\u003c/td>\n\u003ctd>提供免费诊疗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made up his mind\u003c/td>\n\u003ctd>下定决心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>traditional Chinese medicine\u003c/td>\n\u003ctd>中医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional courses\u003c/td>\n\u003ctd>专业课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plenty of practical skills\u003c/td>\n\u003ctd>大量实用技能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>makes him feel really rewarding\u003c/td>\n\u003ctd>让他很有成就感\u003c/td>\n\u003c/tr>\n\u003ctr class=\"gap\">\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The main reason for him to choose this job\u003c/td>\n\u003ctd>他选择这份工作最主要的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>admires his father’s spirit\u003c/td>\n\u003ctd>欣赏她父亲的精神\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>so proud of\u003c/td>\n\u003ctd>为…… 感到十分骄傲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>studying medicine\u003c/td>\n\u003ctd>学医\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>is never an easy journey\u003c/td>\n\u003ctd>从来都不是一件容易的事\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today I&#39;ll  talk about a time when I felt proud of a family member. The person is my cousin kaiyao, and \u003cmark>we grew up together.\u003c/mark> His father is a traditional chinese medicine doctors. It’s interesting to note that he doesn‘t look like a doctor at all — he is really tall and strong.\u003c/p>\n\u003cp>今天我想聊聊我为一位家人感到自豪的时刻。这个人是我的表哥，我们一同长大。他父亲是一名中医。有意思的是，他看上去完全不像一名医生 —— 他身材高大健壮。\u003c/p>\n\u003cp>At first, he didn&#39;t want to \u003cmark>being a doctor\u003c/mark> at all. He also wanted to become an engineer, \u003cmark>just like me\u003c/mark>. We planned to study \u003cmark>electronics, mechanical engineering or computer science.\u003c/mark>\u003cbr>However, \u003cmark>everything changed\u003c/mark> after he spent one summer working \u003cmark>in his father&#39;s clinic\u003c/mark>. He watched his father \u003cmark>help many patients\u003c/mark> \u003cmark>recover from illnesses\u003c/mark>. What’s more, his father \u003cmark>offered free treatment\u003c/mark> for poor people.\u003c/p>\n\u003cp>最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。\u003cbr>但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。\u003c/p>\n\u003cp>After that, he \u003cmark>made up his mind\u003c/mark> to learn \u003cmark>traditional Chinese medicine\u003c/mark> at university. Although some \u003cmark>professional courses\u003c/mark> are challenging, he can study \u003cmark>plenty of practical skills\u003c/mark> which \u003cmark>makes him feel rewarding.\u003c/mark>\u003c/p>\n\u003cp>在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。\u003c/p>\n\u003cp>\u003cmark>The main reason for him to choose this job\u003c/mark> is that he really \u003cmark>admires his father’s spirit\u003c/mark>. He wants to become a doctor like his father one day. I am \u003cmark>so proud of\u003c/mark> Kaiyao, because \u003cmark>studying medicine\u003c/mark> \u003cmark>is never an easy journey.\u003c/mark>\u003c/p>\n\u003cp>他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。\u003c/p>\n","toc":[],"text":"You should say: When it happened Who the person is What the person did And explain why you felt proud of him/her 英文短语 中文释义 we grew up together. 我们一起长大 traditional Chinese medicine doctor 中医 It’s interesting to note that 有意思的是 look like a doctor 看起来像医生 being a doctor 成为医生 just like me 就像我一样 electronics, mechanical engineering or computer science 电子、机械工程或者计算机科学 everything changed 一切都改变了 in his father's clinic 在他父亲的诊所里 help many patients 帮助很多病人 recover from illnesses 摆脱病痛、康复 offered free treatment 提供免费诊疗 made up his mind 下定决心 traditional Chinese medicine 中医 professional courses 专业课 plenty of practical skills 大量实用技能 makes him feel really rewarding 让他很有成就感 The main reason for him to choose this job 他选择这份工作最主要的原因 admires his father’s spirit 欣赏她父亲的精神 so proud of 为…… 感到十分骄傲 studying medicine 学医 is never an easy journey 从来都不是一件容易的事 Today I'll talk about a time when I felt proud of a family member. The person is my cousin kaiyao, and we grew up together. His father is a traditional chinese medicine doctors. It’s interesting to note that he doesn‘t look like a doctor at all — he is really tall and strong. 今天我想聊聊我为一位家人感到自豪的时刻。这个人是我的表哥，我们一同长大。他父亲是一名中医。有意思的是，他看上去完全不像一名医生 —— 他身材高大健壮。 At first, he didn't want to being a doctor at all. He also wanted to become an engineer, just like me. We planned to study electronics, mechanical engineering or computer science. However, everything changed after he spent one summer working in his father's clinic. He watched his father help many patients recover from illnesses. What’s more, his father offered free treatment for poor people. 最开始，他完全不想学医。他原本打算和我一起学习工科，比如电子、机械工程或者计算机科学。 但是，在他父亲的药房实习了一个暑假之后，一切都变了。他亲眼看见父亲帮助很多病人摆脱病痛。除此之外，他父亲还为穷人免费看病。 After that, he made up his mind to learn traditional Chinese medicine at university. Although some professional courses are challenging, he can study plenty of practical skills which makes him feel rewarding. 在那之后，他下定决心大学学习中医。虽然部分专业课难度很大，但他能够学到大量实用的医学知识，这总能让他充满成就感。 The main reason for him to choose this job is that he really admires his father’s spirit. He wants to become a doctor like his father one day. I am so proud of Kaiyao, because studying medicine is never an easy journey. 他选择这份职业最主要的原因是，他十分敬佩父亲的同情心与耐心。他希望有朝一日能成为像父亲一样的人。我为凯耀感到十分骄傲，因为学医从来都不是一件容易的事。"},{"id":"a-p2-12","origin":"author","group":"a-p2","file":"原作者笔记/口语/P2/12-高的建筑.md","title":"P2-12 高的建筑","html":"\u003cp>You should say:\u003c/p>\n\u003cul>\n\u003cli>What it is used for\u003c/li>\n\u003cli>Where it is\u003c/li>\n\u003cli>What it looks like\u003c/li>\n\u003cli>And explain why you like/dislike it\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>an office skyscraper\u003c/mark>\u003c/td>\n\u003ctd>一栋写字楼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>where I worked for about 4 monthes\u003c/td>\n\u003ctd>我在那里工作过几个月\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a busy street\u003c/td>\n\u003ctd>繁华的商业街\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>serves as a workspace .\u003c/td>\n\u003ctd>很多不同公司都在这里办公\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>From the outside\u003c/td>\n\u003ctd>从外观来看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>it looks quite modern.\u003c/mark>\u003c/td>\n\u003ctd>它看起来相当时尚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>can’t stand the atmosphere inside.\u003c/td>\n\u003ctd>很不喜欢楼内的氛围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The ceilings were low,\u003c/td>\n\u003ctd>天花板很低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>made me feel stressed and anxious\u003c/td>\n\u003ctd>让我感到压抑、焦虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Earlier this year\u003c/td>\n\u003ctd>今年早些时候\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>did an internship\u003c/td>\n\u003ctd>实习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autonomous driving company there\u003c/td>\n\u003ctd>自动驾驶公司（在楼里）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>endless work to do\u003c/td>\n\u003ctd>做不完的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>being a student\u003c/td>\n\u003ctd>做学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pretty nice\u003c/td>\n\u003ctd>挺好的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at least\u003c/td>\n\u003ctd>至少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have time to do my own things.\u003c/td>\n\u003ctd>有时间去做自己想做的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>recommend it to others.\u003c/td>\n\u003ctd>向其他人推荐\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Today, I&#39; ll talk about a tall building that I dislike. It is \u003cmark>an office skyscraper\u003c/mark> in Guangzhou \u003cmark>where I worked for about 4 monthes\u003c/mark>. It is located in \u003cmark>a busy street\u003c/mark>, and \u003cmark>serves as a workspace for many different companys.\u003c/mark>\u003cbr>今天，我想聊聊一栋我不喜欢的高楼。这是广州一栋写字楼，我在那里工作过几个月。大楼坐落于繁华的商业街里，很多不同公司都在这里办公。\u003c/p>\n\u003cp> \u003cmark>From the outside\u003c/mark>, \u003cmark>it looks quite modern.\u003c/mark> But, I \u003cmark>can’t stand the atmosphere inside.\u003c/mark> \u003cmark>The ceilings were low,\u003c/mark> which \u003cmark>made me feel stressed and anxious\u003c/mark>. \u003cmark>Earlier this year\u003c/mark>, I \u003cmark>did an internship\u003c/mark> at an \u003cmark>autonomous driving company there\u003c/mark>. I was really tired. I worked from 10 a.m. to 10 p.m. with \u003cmark>endless work to do\u003c/mark>. After that, I’ve felt \u003cmark>being a student\u003c/mark> is \u003cmark>pretty nice\u003c/mark>, because \u003cmark>at least\u003c/mark> I \u003cmark>have time to do my own things.\u003c/mark>\u003c/p>\n\u003cp>从外观来看，它看起来相当时尚。但我很不喜欢楼内的氛围。天花板很低，让我感到压抑、焦虑。今年早些时候，我在楼里一家自动驾驶公司实习。我特别疲惫，每天早十到晚十，总有做不完的工作。经过这段经历之后，我发现做学生其实挺好的，至少我还有时间去做自己想做的事。\u003c/p>\n\u003cp>Because of that experience, I strongly dislike tall building. And I would never \u003cmark>recommend it to others.\u003c/mark>\u003c/p>\n\u003cp>正是这段经历，让我非常不喜欢这栋大楼，我也不会像其他人推荐\u003c/p>\n","toc":[],"text":"You should say: What it is used for Where it is What it looks like And explain why you like/dislike it 英文短语 中文翻译 an office skyscraper 一栋写字楼 where I worked for about 4 monthes 我在那里工作过几个月 a busy street 繁华的商业街 serves as a workspace . 很多不同公司都在这里办公 From the outside 从外观来看 it looks quite modern. 它看起来相当时尚 can’t stand the atmosphere inside. 很不喜欢楼内的氛围 The ceilings were low, 天花板很低 made me feel stressed and anxious 让我感到压抑、焦虑 Earlier this year 今年早些时候 did an internship 实习 autonomous driving company there 自动驾驶公司（在楼里） endless work to do 做不完的工作 being a student 做学生 pretty nice 挺好的 at least 至少 have time to do my own things. 有时间去做自己想做的事 recommend it to others. 向其他人推荐 Today, I' ll talk about a tall building that I dislike. It is an office skyscraper in Guangzhou where I worked for about 4 monthes. It is located in a busy street, and serves as a workspace for many different companys. 今天，我想聊聊一栋我不喜欢的高楼。这是广州一栋写字楼，我在那里工作过几个月。大楼坐落于繁华的商业街里，很多不同公司都在这里办公。 From the outside, it looks quite modern. But, I can’t stand the atmosphere inside. The ceilings were low, which made me feel stressed and anxious. Earlier this year, I did an internship at an autonomous driving company there. I was really tired. I worked from 10 a.m. to 10 p.m. with endless work to do. After that, I’ve felt being a student is pretty nice, because at least I have time to do my own things. 从外观来看，它看起来相当时尚。但我很不喜欢楼内的氛围。天花板很低，让我感到压抑、焦虑。今年早些时候，我在楼里一家自动驾驶公司实习。我特别疲惫，每天早十到晚十，总有做不完的工作。经过这段经历之后，我发现做学生其实挺好的，至少我还有时间去做自己想做的事。 Because of that experience, I strongly dislike tall building. And I would never recommend it to others. 正是这段经历，让我非常不喜欢这栋大楼，我也不会像其他人推荐"},{"id":"a-p3-base","origin":"author","group":"a-p3","file":"原作者笔记/口语/P3/0-必备.md","title":"P3 万能框架与语料","html":"\u003cp>bricks are to buildings\u003cbr>blood is to humans.\u003cbr>sunlight is to plants.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文原短语\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>living costs are getting higher and higher.\u003c/td>\n\u003ctd>生活成本越来越高。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>go to work every day\u003c/td>\n\u003ctd>每天去上班\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>have no time to relax\u003c/td>\n\u003ctd>没有时间放松\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>physical health problems.\u003c/td>\n\u003ctd>身体健康问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scrolling through social media for a long time\u003c/td>\n\u003ctd>长时间刷社交媒体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>physical health problems.\u003c/td>\n\u003ctd>身体健康问题。（重复）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>take their jobs\u003c/td>\n\u003ctd>取代他们的工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just for fun\u003c/td>\n\u003ctd>只是为了好玩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>instead of real demand.\u003c/td>\n\u003ctd>而不是真正的需求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>use advertisements\u003c/td>\n\u003ctd>使用广告\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>spend more money.\u003c/td>\n\u003ctd>花更多钱。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文句子\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>一、生活成本高 high living costs\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nowadays,\u003c/td>\n\u003ctd>如今生活成本越来越高。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Young people face heavy pressure from daily spending.\u003c/td>\n\u003ctd>年轻人面临日常开销带来的巨大压力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Housing and food take up most of people’s salary.\u003c/td>\n\u003ctd>房租和食物花掉人们大部分工资。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>二、生活节奏快 fast pace of life\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Modern city people \u003cmark>live at a really fast pace.\u003c/mark>\u003c/td>\n\u003ctd>现代城市居民生活节奏很快。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People are \u003cmark>always busy\u003c/mark> and \u003cmark>have little free time.\u003c/mark>\u003c/td>\n\u003ctd>人们总是很忙碌，几乎没有空闲时间。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>go to work every da\u003c/mark>y and \u003cmark>almost never relax.\u003c/mark>\u003c/td>\n\u003ctd>他们每天匆忙上班，很少放松自己。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>三、健康问题 health problems\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Lliving at a fast pace\u003c/mark> bring many \u003cmark>physical health problems.\u003c/mark>\u003c/td>\n\u003ctd>快节奏生活带来很多身体健康问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people \u003cmark>lack exercise and sleep\u003c/mark> every day.\u003c/td>\n\u003ctd>很多人每天缺乏运动和睡眠。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>scrolling through social media for a long time\u003c/mark> can also cause \u003cmark>mental stress.\u003c/mark>\u003c/td>\n\u003ctd>长时间看电子屏幕也会造成精神压力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>四、社交问题 social problems\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People \u003cmark>spend too much time online\u003c/mark> and \u003cmark>ignore face-to-face talks.\u003c/mark>\u003c/td>\n\u003ctd>人们花太多时间上网，忽略线下交流。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some people become bad at \u003cmark>real-life communication.\u003c/mark>\u003c/td>\n\u003ctd>有些人变得不擅长现实中的社交。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>五、追求便利 pursue convenience\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Most people choose new technology \u003cmark>just for convenience.\u003c/mark>\u003c/td>\n\u003ctd>大多数人选择新技术只是为了方便。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People prefer \u003cmark>easy and fast ways\u003c/mark> to finish daily things.\u003c/td>\n\u003ctd>人们更喜欢简单快捷的方式处理日常琐事。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Convenience \u003cmark>becomes the first choice\u003c/mark> for \u003cmark>modern people.\u003c/mark>\u003c/td>\n\u003ctd>便利成为现代人的首要选择。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>六、AI 取代 AI replaces human workers\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI can finish many simple jobs instead of humans.\u003c/td>\n\u003ctd>人工智能可以代替人类完成很多简单工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some workers worry AI will \u003cmark>take their jobs\u003c/mark> in the future.\u003c/td>\n\u003ctd>一些劳动者担心未来 AI 会抢走他们的工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI \u003cmark>replaces people\u003c/mark> \u003cmark>in repeated and boring work.\u003c/mark>\u003c/td>\n\u003ctd>AI 会取代人类从事重复枯燥的工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>七、互联网信息淹没 flooded with online information\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We \u003cmark>are flooded with\u003c/mark> all kinds of information online every day.\u003c/td>\n\u003ctd>我们每天被网络上各种各样的信息淹没。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Much online news is useless or untrue.\u003c/td>\n\u003ctd>很多网络信息无用甚至虚假。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It’s hard for people to \u003cmark>sort out reliable information online\u003c/mark>\u003c/td>\n\u003ctd>人们很难分辨信息真假。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>八、消费主义 consumerism\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>Consumerism\u003c/mark> pushes people to buy things they don’t really need in daily life\u003c/td>\n\u003ctd>消费主义促使人们购买不需要的东西。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people shop \u003cmark>just for fun\u003c/mark> \u003cmark>instead of real demand.\u003c/mark>\u003c/td>\n\u003ctd>很多人购物只是为了消遣，而非实际需求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Businesses \u003cmark>use advertisements\u003c/mark> to encourage people to \u003cmark>spend more money.\u003c/mark>\u003c/td>\n\u003ctd>商家利用广告鼓励人们多消费。\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>In my opinion, we cannot simply answer yes or no to this question. It covers many areas and we need to think about lots of factors. We should look at this from two different sides. There is no doubt it brings many advantages in the short term, especially in today’s world. But as society develops, will it cause more negative influences in the future? I think we need to consider this carefully.\u003c/p>\n\u003cp>在我看来，这个问题不能简单用是或者否来回答。它涉及很多领域，需要考虑的因素有很多。我觉得我们需要一分为二地去看待。毫无疑问，短期来看它有很多好处，尤其是在当今社会背景下。但随着社会发展，未来它会不会带来更多消极影响？我认为这需要我们慎重考虑。\u003c/p>\n\u003chr>\n\u003cp>\u003cmark>There are many ways to reach this goal\u003c/mark> \u003cmark>in theory\u003c/mark>. But not all of them can \u003cmark>work in real life\u003c/mark>. I think the most important thing is to \u003cmark>make sure the way works well\u003c/mark>. That means we can \u003cmark>use media\u003c/mark> to \u003cmark>ask more people to join in\u003c/mark>. Then this thing can \u003cmark>become part of people’s daily life.\u003c/mark>\u003c/p>\n\u003cp>理论上有很多方法可以实现这个目标。但并不是所有方法都可行。我认为最关键的一点是保证方法行之有效。也就是说，我们可以通过媒体宣传号召大家参与进来。让这件事成为日常生活的一部分。\u003c/p>\n\u003chr>\n\u003ch4>一、万能逻辑模板（所有P3问题通用）\u003c/h4>\n\u003cp>P3问题通常就是五类，记住这个表就够了：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题类型\u003c/th>\n\u003cth>常见问法\u003c/th>\n\u003cth>万能回答结构\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>原因类\u003c/strong>\u003c/td>\n\u003ctd>Why...? / What causes...?\u003c/td>\n\u003ctd>I think it&#39;s mainly because... / This is due to... / The main reason is...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>影响类\u003c/strong>\u003c/td>\n\u003ctd>What are the effects of...?\u003c/td>\n\u003ctd>It can lead to... / This causes... / One major impact is...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>对比类\u003c/strong>\u003c/td>\n\u003ctd>How is A different from B?\u003c/td>\n\u003ctd>Well, A is..., while B is... / The main difference is... / Unlike A, B...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>解决类\u003c/strong>\u003c/td>\n\u003ctd>How to solve...? / What should be done?\u003c/td>\n\u003ctd>The government should... / Individuals can... / Both sides need to...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>预测类\u003c/strong>\u003c/td>\n\u003ctd>Will this trend continue?\u003c/td>\n\u003ctd>I think it will... because... / It&#39;s hard to say, but probably...\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>二、万能核心语料（10组背完够用）\u003c/h4>\n\u003cp>\u003cstrong>📌 科技与互联网\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>With the rapid development of technology...\u003c/td>\n\u003ctd>随着科技的快速发展……\u003c/td>\n\u003ctd>几乎所有科技类问题开头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People are becoming increasingly dependent on smartphones.\u003c/td>\n\u003ctd>人们越来越依赖智能手机。\u003c/td>\n\u003ctd>社交媒体、沟通方式改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The internet has revolutionized the way we live and work.\u003c/td>\n\u003ctd>互联网彻底改变了我们生活和工作方式。\u003c/td>\n\u003ctd>工作方式、生活方式变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artificial intelligence is replacing human workers in many industries.\u003c/td>\n\u003ctd>人工智能正在许多行业取代人类工人。\u003c/td>\n\u003ctd>就业、自动化、未来趋势\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>📌 教育与学习\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Education plays a crucial role in shaping one&#39;s future.\u003c/td>\n\u003ctd>教育在塑造一个人的未来中起关键作用。\u003c/td>\n\u003ctd>教育重要性、学校作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is important for children to learn both knowledge and life skills.\u003c/td>\n\u003ctd>对孩子来说，学习知识和生活技能都很重要。\u003c/td>\n\u003ctd>学校教育、课程设置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Studying abroad broadens horizons and builds independence.\u003c/td>\n\u003ctd>出国留学拓宽视野，培养独立能力。\u003c/td>\n\u003ctd>留学、文化差异\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>📌 城市生活与压力\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Living costs are getting higher and higher.\u003c/td>\n\u003ctd>生活成本越来越高。\u003c/td>\n\u003ctd>城市生活、年轻人压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>People go to work every day and have no time to relax.\u003c/td>\n\u003ctd>人们每天上班，没时间放松。\u003c/td>\n\u003ctd>工作压力、生活节奏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fast-paced urban life leads to stress and health problems.\u003c/td>\n\u003ctd>快节奏的城市生活导致压力和健康问题。\u003c/td>\n\u003ctd>健康、城市vs乡村\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people suffer from mental health issues due to heavy pressure.\u003c/td>\n\u003ctd>许多人因压力过大而出现心理健康问题。\u003c/td>\n\u003ctd>健康、社会问题\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>📌 消费与广告\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Businesses use advertisements to encourage people to spend more money.\u003c/td>\n\u003ctd>商家用广告鼓励人们花更多钱。\u003c/td>\n\u003ctd>广告影响、消费主义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Many people shop just for fun instead of real demand.\u003c/td>\n\u003ctd>很多人购物只是为了好玩，而不是真正需要。\u003c/td>\n\u003ctd>消费习惯、过度消费\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Some people buy things to follow trends rather than out of necessity.\u003c/td>\n\u003ctd>有些人买东西是为了赶潮流，而不是出于必需。\u003c/td>\n\u003ctd>时尚、消费行为\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>📌 环境与健康\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Environmental pollution has become a serious global issue.\u003c/td>\n\u003ctd>环境污染已成为严重的全球问题。\u003c/td>\n\u003ctd>环境、政府政策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scrolling through social media for a long time can cause health problems.\u003c/td>\n\u003ctd>长时间刷社交媒体会导致健康问题。\u003c/td>\n\u003ctd>社交媒体、健康\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sitting for long hours without exercise leads to physical problems.\u003c/td>\n\u003ctd>长时间坐着不运动会带来身体问题。\u003c/td>\n\u003ctd>工作方式、健康\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>It is necessary to strike a balance between work and life.\u003c/td>\n\u003ctd>有必要在工作与生活之间找到平衡。\u003c/td>\n\u003ctd>工作生活平衡、压力\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>📌 政府与社会\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>可套用话题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The government should take more responsibility for...\u003c/td>\n\u003ctd>政府应该对……承担更多责任。\u003c/td>\n\u003ctd>几乎所有“解决类”问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Raising public awareness is the first step to solving this issue.\u003c/td>\n\u003ctd>提高公众意识是解决问题的第一步。\u003c/td>\n\u003ctd>环保、健康、安全问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Both individuals and society should work together to...\u003c/td>\n\u003ctd>个人和社会应该共同努力……\u003c/td>\n\u003ctd>合作、解决方案\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>三、万能“好句”开头模板\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>万能句\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>谈到原因\u003c/td>\n\u003ctd>Well, I guess the main reason is that...\u003c/td>\n\u003ctd>我想主要原因是……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谈到影响\u003c/td>\n\u003ctd>In my view, this could lead to...\u003c/td>\n\u003ctd>在我看来，这可能会导致……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表示同意\u003c/td>\n\u003ctd>I couldn&#39;t agree more. Actually, I think...\u003c/td>\n\u003ctd>我非常同意。实际上我认为……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表示不确定\u003c/td>\n\u003ctd>It&#39;s hard to say for sure, but I suppose...\u003c/td>\n\u003ctd>很难说，但我想……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>给出建议\u003c/td>\n\u003ctd>I believe both governments and individuals should...\u003c/td>\n\u003ctd>我认为政府和个人都应该……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总结观点\u003c/td>\n\u003ctd>All in all, it seems that...\u003c/td>\n\u003ctd>总的来说，似乎……\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>举例说明\u003c/td>\n\u003ctd>Take... for example.\u003c/td>\n\u003ctd>以……为例。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>引入另一个观点\u003c/td>\n\u003ctd>Furthermore, we should not ignore...\u003c/td>\n\u003ctd>此外，我们不应该忽视……\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>四、最后一天的急救复习策略\u003c/h4>\n\u003cp>只剩一天，不要背太多新词。\u003cstrong>按这个顺序做\u003c/strong>：\u003c/p>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>早晨（30分钟）\u003c/strong>：把上面10组核心语料背下来，大声朗读3遍。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>上午（1小时）\u003c/strong>：拿3道P3真题，每个问题用“万能逻辑模板”+“核心语料”说2分钟，录下来自己听。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>下午（1小时）\u003c/strong>：重点背“万能开头模板”和“好句”，确保到考场上不会冷场。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>晚上（30分钟）\u003c/strong>：把上面的短语全部过一遍，只看中文说英文，卡住的标记出来再背一遍。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>考场上记住这句话：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cem>考官问什么不重要，你永远可以往“科技/压力/政府责任/健康”这四个方向引。\u003c/em>\u003c/p>\n\u003c/blockquote>\n\u003cp>比如考官问“为什么年轻人喜欢网购？”你可以说：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cem>Well, I think the main reason is that... businesses use advertisements to encourage people to spend more money, and many young people shop just for fun instead of real demand. Besides, scrolling through social media for a long time exposes them to endless ads, so they can&#39;t help buying things.\u003c/em>\u003c/p>\n\u003c/blockquote>\n\u003cp>一句话里用上3个核心语料，考官就觉得你很有内容。\u003c/p>\n","toc":[],"text":"bricks are to buildings blood is to humans. sunlight is to plants. 英文原短语 中文翻译 living costs are getting higher and higher. 生活成本越来越高。 go to work every day 每天去上班 have no time to relax 没有时间放松 physical health problems. 身体健康问题。 scrolling through social media for a long time 长时间刷社交媒体 physical health problems. 身体健康问题。（重复） take their jobs 取代他们的工作 just for fun 只是为了好玩 instead of real demand. 而不是真正的需求。 use advertisements 使用广告 spend more money. 花更多钱。 英文句子 中文翻译 一、生活成本高 high living costs Nowadays, 如今生活成本越来越高。 Young people face heavy pressure from daily spending. 年轻人面临日常开销带来的巨大压力。 Housing and food take up most of people’s salary. 房租和食物花掉人们大部分工资。 二、生活节奏快 fast pace of life Modern city people live at a really fast pace. 现代城市居民生活节奏很快。 People are always busy and have little free time. 人们总是很忙碌，几乎没有空闲时间。 go to work every day and almost never relax. 他们每天匆忙上班，很少放松自己。 三、健康问题 health problems Lliving at a fast pace bring many physical health problems. 快节奏生活带来很多身体健康问题。 Many people lack exercise and sleep every day. 很多人每天缺乏运动和睡眠。 scrolling through social media for a long time can also cause mental stress. 长时间看电子屏幕也会造成精神压力。 四、社交问题 social problems People spend too much time online and ignore face-to-face talks. 人们花太多时间上网，忽略线下交流。 Some people become bad at real-life communication. 有些人变得不擅长现实中的社交。 五、追求便利 pursue convenience Most people choose new technology just for convenience. 大多数人选择新技术只是为了方便。 People prefer easy and fast ways to finish daily things. 人们更喜欢简单快捷的方式处理日常琐事。 Convenience becomes the first choice for modern people. 便利成为现代人的首要选择。 六、AI 取代 AI replaces human workers AI can finish many simple jobs instead of humans. 人工智能可以代替人类完成很多简单工作。 Some workers worry AI will take their jobs in the future. 一些劳动者担心未来 AI 会抢走他们的工作。 AI replaces people in repeated and boring work. AI 会取代人类从事重复枯燥的工作。 七、互联网信息淹没 flooded with online information We are flooded with all kinds of information online every day. 我们每天被网络上各种各样的信息淹没。 Much online news is useless or untrue. 很多网络信息无用甚至虚假。 It’s hard for people to sort out reliable information online 人们很难分辨信息真假。 八、消费主义 consumerism Consumerism pushes people to buy things they don’t really need in daily life 消费主义促使人们购买不需要的东西。 Many people shop just for fun instead of real demand. 很多人购物只是为了消遣，而非实际需求。 Businesses use advertisements to encourage people to spend more money. 商家利用广告鼓励人们多消费。 In my opinion, we cannot simply answer yes or no to this question. It covers many areas and we need to think about lots of factors. We should look at this from two different sides. There is no doubt it brings many advantages in the short term, especially in today’s world. But as society develops, will it cause more negative influences in the future? I think we need to consider this carefully. 在我看来，这个问题不能简单用是或者否来回答。它涉及很多领域，需要考虑的因素有很多。我觉得我们需要一分为二地去看待。毫无疑问，短期来看它有很多好处，尤其是在当今社会背景下。但随着社会发展，未来它会不会带来更多消极影响？我认为这需要我们慎重考虑。 There are many ways to reach this goal in theory. But not all of them can work in real life. I think the most important thing is to make sure the way works well. That means we can use media to ask more people to join in. Then this thing can become part of people’s daily life. 理论上有很多方法可以实现这个目标。但并不是所有方法都可行。我认为最关键的一点是保证方法行之有效。也就是说，我们可以通过媒体宣传号召大家参与进来。让这件事成为日常生活的一部分。 一、万能逻辑模板（所有P3问题通用） P3问题通常就是五类，记住这个表就够了： 问题类型 常见问法 万能回答结构 原因类 Why...? / What causes...? I think it's mainly because... / This is due to... / The main reason is... 影响类 What are the effects of...? It can lead to... / This causes... / One major impact is... 对比类 How is A different from B? Well, A is..., while B is... / The main difference is... / Unlike A, B... 解决类 How to solve...? / What should be done? The government should... / Individuals can... / Both sides need to... 预测类 Will this trend continue? I think it will... because... / It's hard to say, but probably... 二、万能核心语料（10组背完够用） 📌 科技与互联网 英文 中文 可套用话题 With the rapid development of technology... 随着科技的快速发展…… 几乎所有科技类问题开头 People are becoming increasingly dependent on smartphones. 人们越来越依赖智能手机。 社交媒体、沟通方式改变 The internet has revolutionized the way we live and work. 互联网彻底改变了我们生活和工作方式。 工作方式、生活方式变化 Artificial intelligence is replacing human workers in many industries. 人工智能正在许多行业取代人类工人。 就业、自动化、未来趋势 📌 教育与学习 英文 中文 可套用话题 Education plays a crucial role in shaping one's future. 教育在塑造一个人的未来中起关键作用。 教育重要性、学校作用 It is important for children to learn both knowledge and life skills. 对孩子来说，学习知识和生活技能都很重要。 学校教育、课程设置 Studying abroad broadens horizons and builds independence. 出国留学拓宽视野，培养独立能力。 留学、文化差异 📌 城市生活与压力 英文 中文 可套用话题 Living costs are getting higher and higher. 生活成本越来越高。 城市生活、年轻人压力 People go to work every day and have no time to relax. 人们每天上班，没时间放松。 工作压力、生活节奏 Fast-paced urban life leads to stress and health problems. 快节奏的城市生活导致压力和健康问题。 健康、城市vs乡村 Many people suffer from mental health issues due to heavy pressure. 许多人因压力过大而出现心理健康问题。 健康、社会问题 📌 消费与广告 英文 中文 可套用话题 Businesses use advertisements to encourage people to spend more money. 商家用广告鼓励人们花更多钱。 广告影响、消费主义 Many people shop just for fun instead of real demand. 很多人购物只是为了好玩，而不是真正需要。 消费习惯、过度消费 Some people buy things to follow trends rather than out of necessity. 有些人买东西是为了赶潮流，而不是出于必需。 时尚、消费行为 📌 环境与健康 英文 中文 可套用话题 Environmental pollution has become a serious global issue. 环境污染已成为严重的全球问题。 环境、政府政策 Scrolling through social media for a long time can cause health problems. 长时间刷社交媒体会导致健康问题。 社交媒体、健康 Sitting for long hours without exercise leads to physical problems. 长时间坐着不运动会带来身体问题。 工作方式、健康 It is necessary to strike a balance between work and life. 有必要在工作与生活之间找到平衡。 工作生活平衡、压力 📌 政府与社会 英文 中文 可套用话题 The government should take more responsibility for... 政府应该对……承担更多责任。 几乎所有“解决类”问题 Raising public awareness is the first step to solving this issue. 提高公众意识是解决问题的第一步。 环保、健康、安全问题 Both individuals and society should work together to... 个人和社会应该共同努力…… 合作、解决方案 三、万能“好句”开头模板 场景 万能句 中文 谈到原因 Well, I guess the main reason is that... 我想主要原因是…… 谈到影响 In my view, this could lead to... 在我看来，这可能会导致…… 表示同意 I couldn't agree more. Actually, I think... 我非常同意。实际上我认为…… 表示不确定 It's hard to say for sure, but I suppose... 很难说，但我想…… 给出建议 I believe both governments and individuals should... 我认为政府和个人都应该…… 总结观点 All in all, it seems that... 总的来说，似乎…… 举例说明 Take... for example. 以……为例。 引入另一个观点 Furthermore, we should not ignore... 此外，我们不应该忽视…… 四、最后一天的急救复习策略 只剩一天，不要背太多新词。按这个顺序做： 早晨（30分钟）：把上面10组核心语料背下来，大声朗读3遍。 上午（1小时）：拿3道P3真题，每个问题用“万能逻辑模板”+“核心语料”说2分钟，录下来自己听。 下午（1小时）：重点背“万能开头模板”和“好句”，确保到考场上不会冷场。 晚上（30分钟）：把上面的短语全部过一遍，只看中文说英文，卡住的标记出来再背一遍。 考场上记住这句话： 考官问什么不重要，你永远可以往“科技/压力/政府责任/健康”这四个方向引。 比如考官问“为什么年轻人喜欢网购？”你可以说： Well, I think the main reason is that... businesses use advertisements to encourage people to spend more money, and many young people shop just for fun instead of real demand. Besides, scrolling through social media for a long time exposes them to endless ads, so they can't help buying things. 一句话里用上3个核心语料，考官就觉得你很有内容。"},{"id":"a-p3-tech","origin":"author","group":"a-p3","file":"原作者笔记/口语/P3/14-遇到的科技问题.md","title":"P3 科技问题（AI）","html":"\u003cul>\n\u003cli>What are the advantages and disadvantages of AI?\u003c/li>\n\u003cli>Do you think people today should learn about AI technology?\u003c/li>\n\u003cli>Should children learn to use AI?\u003c/li>\n\u003cli>How can AI help in our lives?\u003c/li>\n\u003cli>Do you think students are overly reliant on AI?\u003c/li>\n\u003cli>What can teachers do to stop students from relying too much on AI?\u003c/li>\n\u003cli>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h1\">1. What are the advantages and disadvantages of AI?\u003c/h2>\n\u003cp>Advantages first. AI saves us lots of time. It can finish hard work quickly, like calculating data.\u003cbr>But it also has downsides. Some people depend on it too much. They lose their own thinking skills. Also, some jobs may disappear because of AI.\u003c/p>\n\u003cp>首先说优点。人工智能能帮我们节省大量时间。它可以快速完成复杂工作，比如计算数据。\u003cbr>但它也有弊端。有些人过度依赖人工智能，丧失独立思考能力。而且部分工作岗位会因为人工智能消失。\u003c/p>\n\u003ch2 id=\"h2\">2. Do you think people today should learn about AI technology?\u003c/h2>\n\u003cp>Yes, I believe everyone needs to know basic AI.\u003c/p>\n\u003cp>我认为所有人都应该了解基础人工智能知识。\u003c/p>\n\u003cp>Now AI is everywhere in daily life. If you understand it, you can use it better.\u003c/p>\n\u003cp>如今人工智能遍布日常生活。懂它，你才能更好地使用。\u003c/p>\n\u003cp>If you ignore it, you will fall behind others in study and work.\u003c/p>\n\u003cp>如果完全不了解，学习和工作上都会落后于人。\u003c/p>\n\u003ch2 id=\"h3\">3. Should children learn to use AI?\u003c/h2>\n\u003cp>Yes, but they need strict rules.\u003c/p>\n\u003cp>可以，但必须有严格使用规范。\u003c/p>\n\u003cp>AI helps kids search study information fast. It makes learning fun.\u003c/p>\n\u003cp>人工智能能帮孩子快速查找学习资料，让学习变得有趣。\u003c/p>\n\u003cp>However, kids cannot use it all the time. They may copy answers and stop thinking by themselves.\u003c/p>\n\u003cp>但孩子不能一直使用，他们会直接抄答案，不再独立思考。\u003c/p>\n\u003ch2 id=\"h4\">4. How can AI help in our lives?\u003c/h2>\n\u003cp>AI helps us in many daily areas.\u003c/p>\n\u003cp>人工智能在生活很多方面都能帮到我们。\u003c/p>\n\u003cp>First, it helps students finish homework and look up knowledge.\u003c/p>\n\u003cp>第一，帮助学生写作业、查阅知识。\u003c/p>\n\u003cp>Second, smart AI tools make housework easier, like robot cleaners.\u003c/p>\n\u003cp>第二，智能 AI 工具简化家务，比如扫地机器人。\u003c/p>\n\u003cp>Third, self-driving AI makes travelling safer and more convenient.\u003c/p>\n\u003cp>第三，自动驾驶 AI 让出行更安全、便捷。\u003c/p>\n\u003ch2 id=\"h5\">5. Do you think students are overly reliant on AI?\u003c/h2>\n\u003cp>Yes, lots of students rely on AI too much these days.\u003c/p>\n\u003cp>没错，现在很多学生过度依赖人工智能。\u003c/p>\n\u003cp>When they meet difficult problems, they open AI tools at once.\u003c/p>\n\u003cp>一遇到难题，他们立刻打开 AI 工具。\u003c/p>\n\u003cp>They do not try to think or calculate on their own. Slowly, their study skills become worse.\u003c/p>\n\u003cp>他们不会自己动脑思考、计算，久而久之，学习能力会变差。\u003c/p>\n\u003ch2 id=\"h6\">6. What can teachers do to stop students from relying too much on AI?\u003c/h2>\n\u003cp>Teachers can take three simple steps.\u003c/p>\n\u003cp>老师可以采取三个简单办法。\u003c/p>\n\u003cp>First, ask students to write down their own ideas before using AI.\u003c/p>\n\u003cp>第一，要求学生先用自己的思路解题，再使用 AI。\u003c/p>\n\u003cp>Second, give more in-class exams where phones and AI tools are banned.\u003c/p>\n\u003cp>第二，多安排课堂测验，禁止携带手机和 AI 工具。\u003c/p>\n\u003cp>Third, teach students the right way to use AI, only as a helper, not a replacement.\u003c/p>\n\u003cp>第三，教会学生正确使用 AI，把它当作辅助工具，而不是替代品。\u003c/p>\n","toc":[{"level":2,"id":"h1","text":"1. What are the advantages and disadvantages of AI?"},{"level":2,"id":"h2","text":"2. Do you think people today should learn about AI technology?"},{"level":2,"id":"h3","text":"3. Should children learn to use AI?"},{"level":2,"id":"h4","text":"4. How can AI help in our lives?"},{"level":2,"id":"h5","text":"5. Do you think students are overly reliant on AI?"},{"level":2,"id":"h6","text":"6. What can teachers do to stop students from relying too much on AI?"}],"text":"What are the advantages and disadvantages of AI? Do you think people today should learn about AI technology? Should children learn to use AI? How can AI help in our lives? Do you think students are overly reliant on AI? What can teachers do to stop students from relying too much on AI? 1. What are the advantages and disadvantages of AI? Advantages first. AI saves us lots of time. It can finish hard work quickly, like calculating data. But it also has downsides. Some people depend on it too much. They lose their own thinking skills. Also, some jobs may disappear because of AI. 首先说优点。人工智能能帮我们节省大量时间。它可以快速完成复杂工作，比如计算数据。 但它也有弊端。有些人过度依赖人工智能，丧失独立思考能力。而且部分工作岗位会因为人工智能消失。 2. Do you think people today should learn about AI technology? Yes, I believe everyone needs to know basic AI. 我认为所有人都应该了解基础人工智能知识。 Now AI is everywhere in daily life. If you understand it, you can use it better. 如今人工智能遍布日常生活。懂它，你才能更好地使用。 If you ignore it, you will fall behind others in study and work. 如果完全不了解，学习和工作上都会落后于人。 3. Should children learn to use AI? Yes, but they need strict rules. 可以，但必须有严格使用规范。 AI helps kids search study information fast. It makes learning fun. 人工智能能帮孩子快速查找学习资料，让学习变得有趣。 However, kids cannot use it all the time. They may copy answers and stop thinking by themselves. 但孩子不能一直使用，他们会直接抄答案，不再独立思考。 4. How can AI help in our lives? AI helps us in many daily areas. 人工智能在生活很多方面都能帮到我们。 First, it helps students finish homework and look up knowledge. 第一，帮助学生写作业、查阅知识。 Second, smart AI tools make housework easier, like robot cleaners. 第二，智能 AI 工具简化家务，比如扫地机器人。 Third, self-driving AI makes travelling safer and more convenient. 第三，自动驾驶 AI 让出行更安全、便捷。 5. Do you think students are overly reliant on AI? Yes, lots of students rely on AI too much these days. 没错，现在很多学生过度依赖人工智能。 When they meet difficult problems, they open AI tools at once. 一遇到难题，他们立刻打开 AI 工具。 They do not try to think or calculate on their own. Slowly, their study skills become worse. 他们不会自己动脑思考、计算，久而久之，学习能力会变差。 6. What can teachers do to stop students from relying too much on AI? Teachers can take three simple steps. 老师可以采取三个简单办法。 First, ask students to write down their own ideas before using AI. 第一，要求学生先用自己的思路解题，再使用 AI。 Second, give more in-class exams where phones and AI tools are banned. 第二，多安排课堂测验，禁止携带手机和 AI 工具。 Third, teach students the right way to use AI, only as a helper, not a replacement. 第三，教会学生正确使用 AI，把它当作辅助工具，而不是替代品。"},{"id":"a-w-t1-vocab","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/0.1-小作文通识积累.md","title":"小作文通识积累","html":"\u003ch2 id=\"h1\">花销\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>搭配 &amp; 例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>spending\u003c/strong>\u003c/td>\n\u003ctd>支出、花费【最百搭，首选】\u003c/td>\n\u003ctd>泛指各类开销（政府、家庭、个人）\u003c/td>\n\u003ctd>government spending；spending on education\u003cbr>\u003cbr>Spending on healthcare rose.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cost\u003c/strong>\u003c/td>\n\u003ctd>成本；花费\u003c/td>\n\u003ctd>侧重购买、运营成本；也可指开销\u003c/td>\n\u003ctd>the cost of transport\u003cbr>\u003cbr>⚠️ 区分：cost 多指 “成本”，不一定是预算支出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>expense\u003c/strong>\u003c/td>\n\u003ctd>开销、费用（常用复数 expenses）\u003c/td>\n\u003ctd>日常 / 业务开销，单数少用\u003c/td>\n\u003ctd>living expenses（生活费）\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h2\">钱\u003c/h2>\n\u003cp>英镑是 \u003cmark>pounds!!!\u003c/mark>\u003c/p>\n\u003ch2 id=\"h3\">份额、比例\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>适用图表\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>proportion\u003c/strong>\u003c/td>\n\u003ctd>强调\u003cstrong>部分相对于整体\u003c/strong>，不一定带 % 数字\u003c/td>\n\u003ctd>饼图、占比柱状图\u003c/td>\n\u003ctd>the proportion of people who cycled\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>share\u003c/strong>\u003c/td>\n\u003ctd>侧重\u003cstrong>分配、占有份额\u003c/strong>（市场、资源、人群）\u003c/td>\n\u003ctd>饼图、市场类图表\u003c/td>\n\u003ctd>the share of renewable energy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>percentage\u003c/strong>\u003c/td>\n\u003ctd>强调\u003cstrong>数字单位\u003c/strong>，后面常跟具体数值\u003c/td>\n\u003ctd>带 % 刻度图表\u003c/td>\n\u003ctd>the percentage of students working part-time\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h4\">在某段时间内\u003c/h2>\n\u003cp>over the 20-year period from 2000 to 2020\u003c/p>\n\u003ch2 id=\"h5\">比例\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比例\u003c/th>\n\u003cth>en\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1%\u003c/td>\n\u003ctd>the smallest share\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>34%\u003c/td>\n\u003ctd>roughly a third\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49%\u003c/td>\n\u003ctd>nearly half of\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52%\u003c/td>\n\u003ctd>just over half of\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90%\u003c/td>\n\u003ctd>rank the highest\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>one half\u003c/td>\n\u003ctd>1/2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one third / a third\u003c/td>\n\u003ctd>1/3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>two thirds\u003c/td>\n\u003ctd>2/3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one quarter / a quarter\u003c/td>\n\u003ctd>1/4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>three quarters\u003c/td>\n\u003ctd>3/4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one fifth / a fifth\u003c/td>\n\u003ctd>1/5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one sixth\u003c/td>\n\u003ctd>1/6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>one tenth / a tenth\u003c/td>\n\u003ctd>1/10\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h6\">区域\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>核心释义\u003c/th>\n\u003cth>适用场景 &amp; 注意事项\u003c/th>\n\u003cth>雅思地图题例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Area\u003c/td>\n\u003ctd>区域\u003c/td>\n\u003ctd>万能首选，室内、户外功能区通用，容错率最高\u003c/td>\n\u003ctd>A seating area will be built in the western part.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Space\u003c/td>\n\u003ctd>空间\u003c/td>\n\u003ctd>侧重人为划分出的空地，更适合描述建筑内部布局\u003c/td>\n\u003ctd>The new kitchen occupies a small space on the left.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Section\u003c/td>\n\u003ctd>片区；区块\u003c/td>\n\u003ctd>适合整块场地分割成多个大块区域\u003c/td>\n\u003ctd>The eastern section will be turned into a garden.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h7\">因为，由于\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>难度\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>due to\u003c/td>\n\u003ctd>基础\u003c/td>\n\u003ctd>通用，写作最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>because of\u003c/td>\n\u003ctd>基础\u003c/td>\n\u003ctd>口语 + 写作，不建议主体段高频堆砌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on account of\u003c/td>\n\u003ctd>中档\u003c/td>\n\u003ctd>正式，替换 due to 避免重复\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h8\">阻挡\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>搭配示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>obstruction\u003c/td>\n\u003ctd>实体遮挡：建筑、光线、视野\u003c/td>\n\u003ctd>due to the obstruction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>barrier\u003c/td>\n\u003ctd>屏障、隔离障碍（公路、围墙）\u003c/td>\n\u003ctd>as a result of the barrier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be obstructed by\u003c/td>\n\u003ctd>被…… 堵住 / 阻挡\u003c/td>\n\u003ctd>Sunlight is obstructed by buildings.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h9\">剩余的\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>the rest of\u003c/td>\n\u003ctd>通用\u003c/td>\n\u003ctd>The rest of respondents prefer small houses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>the remaining\u003c/mark> + 名词\u003c/td>\n\u003ctd>图表描述最优\u003c/td>\n\u003ctd>The remaining participants choose public transport.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h10\">表示，说明\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>state\u003c/mark>\u003c/td>\n\u003ctd>正式书面，图表首选，意为\u003cstrong>陈述、表示\u003c/strong>\u003c/td>\n\u003ctd>Most respondents state that they face heavy financial pressure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>claim\u003c/td>\n\u003ctd>声称（中性，注意：不适合确信事实）\u003c/td>\n\u003ctd>Some respondents claim they cannot afford city flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mention\u003c/td>\n\u003ctd>提及、谈到（适合次要观点）\u003c/td>\n\u003ctd>A few respondents mention the fast pace of urban life.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h11\">受访者，调查对象\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>适用场景\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>respondents\u003c/td>\n\u003ctd>问卷、柱状图、饼图自带调查数据\u003c/td>\n\u003ctd>40% of respondents prefer high-rise flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>participants\u003c/td>\n\u003ctd>访谈、线下调研、活动问卷\u003c/td>\n\u003ctd>Most participants agreed to build more apartments.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interviewees\u003c/td>\n\u003ctd>面对面采访类图表数据\u003c/td>\n\u003ctd>The interviewees complained about high living costs.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h12\">工作\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>适用提示\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>job\u003c/td>\n\u003ctd>工作（可数）\u003c/td>\n\u003ctd>基础词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>occupation\u003c/mark>\u003c/td>\n\u003ctd>职业（书面正式，写作优先）\u003c/td>\n\u003ctd>occupation = 个人从事的职业\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>career\u003c/td>\n\u003ctd>职业生涯；事业\u003c/td>\n\u003ctd>侧重长期发展\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h13\">大约\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>roughly\u003c/td>\n\u003ctd>大约；大致\u003c/td>\n\u003ctd>侧重粗略估算，非常适合小作文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>approximately\u003c/td>\n\u003ctd>大约\u003c/td>\n\u003ctd>偏正式，学术感更强\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nearly\u003c/td>\n\u003ctd>将近，接近（还没到该数值）\u003c/td>\n\u003ctd>nearly 13 million\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>almost\u003c/td>\n\u003ctd>几乎，将近 ≈ nearly\u003c/td>\n\u003ctd>almost 20 million\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h14\">略高，略低\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词汇\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>just over\u003c/td>\n\u003ctd>略高于，稍稍超过\u003c/td>\n\u003ctd>just over 6 million\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>just under\u003c/td>\n\u003ctd>略低于，不足\u003c/td>\n\u003ctd>just under 2 million\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h15\">数量词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>the number of + 复数名词\u003c/td>\n\u003ctd>…… 的数量（基础款）\u003c/td>\n\u003ctd>the number of jobs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the figure for + 对象\u003c/td>\n\u003ctd>对应…… 的数据（首选替换，强烈推荐）\u003c/td>\n\u003ctd>the figure for manufacturing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>levels of …\u003c/td>\n\u003ctd>…… 规模 / 数量（偏书面）\u003c/td>\n\u003ctd>levels of employment in retail\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h16\">是/达到\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>用法说明\u003c/th>\n\u003cth>例句参考（套用你的题目）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>stand at\u003c/strong>\u003c/td>\n\u003ctd>最推荐！静态描述当前 / 某年数值（过去式 stood at）\u003c/td>\n\u003ctd>The figure for manufacturing \u003cstrong>stood at\u003c/strong> 15 million in 1960.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>reach\u003c/strong>\u003c/td>\n\u003ctd>达到某个数值（经常用于终点、峰值）\u003c/td>\n\u003ctd>The number \u003cstrong>reached\u003c/strong> 16 million by 2020.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>hit\u003c/strong>\u003c/td>\n\u003ctd>达到（多用于峰值、高点）\u003c/td>\n\u003ctd>It \u003cstrong>hit\u003c/strong> a peak of 20 million in 1980.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h17\">占比\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用场景\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>account for + 百分比\u003c/td>\n\u003ctd>占据（比例）\u003c/td>\n\u003ctd>最常用，主体在前\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>make up + 百分比\u003c/td>\n\u003ctd>构成、占比\u003c/td>\n\u003ctd>中性，简单易懂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constitute + 百分比\u003c/td>\n\u003ctd>构成\u003c/td>\n\u003ctd>偏正式，提升分数\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h18\">增长\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>备注\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>rise (rose, risen)\u003c/td>\n\u003ctd>上升\u003c/td>\n\u003ctd>通用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>increase (increased)\u003c/td>\n\u003ctd>增长\u003c/td>\n\u003ctd>最高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>grow (grew, grown)\u003c/td>\n\u003ctd>增长；攀升\u003c/td>\n\u003ctd>侧重持续发展\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h19\">下降\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>使用说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fall (fell, fallen)\u003c/td>\n\u003ctd>下降\u003c/td>\n\u003ctd>通用高频\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decrease (decreased)\u003c/td>\n\u003ctd>减少\u003c/td>\n\u003ctd>最稳妥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decline (declined)\u003c/td>\n\u003ctd>下滑、递减\u003c/td>\n\u003ctd>偏正式，推荐多用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plummet (plummeted)\u003c/td>\n\u003ctd>骤降、大跌\u003c/td>\n\u003ctd>强幅度，高分词\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h20\">持续的\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>中文\u003c/th>\n\u003cth>小作文例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>continuous\u003c/td>\n\u003ctd>持续不断的（无中断）\u003c/td>\n\u003ctd>a continuous rise 持续上升\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>steady\u003c/td>\n\u003ctd>平稳持续的（波动小）\u003c/td>\n\u003ctd>a steady decline 持续平稳下降\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constant\u003c/td>\n\u003ctd>恒定不变的；持续不变（侧重几乎没变化）\u003c/td>\n\u003ctd>constant level 持续持平\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h21\">快速、激烈、急剧\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>幅度参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>significantly\u003c/td>\n\u003ctd>显著地\u003c/td>\n\u003ctd>明显增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dramatically\u003c/td>\n\u003ctd>急剧地\u003c/td>\n\u003ctd>大幅上涨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rapidly\u003c/td>\n\u003ctd>快速地\u003c/td>\n\u003ctd>增速快\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h22\">轻微、逐渐\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>短语\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>幅度参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>slightly\u003c/mark>\u003c/td>\n\u003ctd>轻微地\u003c/td>\n\u003ctd>小幅上涨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>gradually\u003c/td>\n\u003ctd>稳步、逐渐\u003c/td>\n\u003ctd>平缓持续增长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>moderately\u003c/mark>\u003c/td>\n\u003ctd>适度地\u003c/td>\n\u003ctd>中等涨幅\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h23\">保持不变\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达  figure for manufacturing stood at 15 million in 1960. reach 达到某个数值（经常用于终点、峰值） The number reached 16 million by 2020. hit 达到（多用于峰值、高点） It hit a peak of 20 million in 1980. 占比 英文表达 中文释义 适用场景 account for + 百分比 占据（比例） 最常用，主体在前 make up + 百分比 构成、占比 中性，简单易懂 constitute + 百分比 构成 偏正式，提升分数 增长 英文表达 中文 备注 rise (rose, risen) 上升 通用 increase (increased) 增长 最高频 grow (grew, grown) 增长；攀升 侧重持续发展 下降 英文表达 中文释义 使用说明 fall (fell, fallen) 下降 通用高频 decrease (decreased) 减少 最稳妥 decline (declined) 下滑、递减 偏正式，推荐多用 plummet (plummeted) 骤降、大跌 强幅度，高分词 持续的 英文 中文 小作文例句 continuous 持续不断的（无中断） a continuous rise 持续上升 steady 平稳持续的（波动小） a steady decline 持续平稳下降 constant 恒定不变的；持续不变（侧重几乎没变化） constant level 持续持平 快速、激烈、急剧 短语 含义 幅度参考 significantly 显著地 明显增长 dramatically 急剧地 大幅上涨 rapidly 快速地 增速快 轻微、逐渐 短语 含义 幅度参考 slightly 轻微地 小幅上涨 gradually 稳步、逐渐 平缓持续增长 moderately 适度地 中等涨幅 保持不变 英文表达 中文 备注 remain stable 保持稳定 最高频、稳妥 remain constant 维持恒定 正式，推荐 stay unchanged 保持不变 简单好用"},{"id":"a-w-t2-vocab","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/0.2-大作文通识积累.md","title":"大作文通识积累","html":"\u003ch2 id=\"h1\">随着...的发展\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>中文\u003c/th>\n\u003cth>英文表达\u003c/th>\n\u003cth>难度\u003c/th>\n\u003cth>备注 &amp; 适用场景\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>随着社会的发展 / 进步\u003c/td>\n\u003ctd>With the development of society\u003c/td>\n\u003ctd>6.0 基础款\u003c/td>\n\u003ctd>万能通用，最容易背诵\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>With the \u003cmark>progress of society\u003c/mark>\u003c/td>\n\u003ctd>6.5\u003c/td>\n\u003ctd>progress 侧重 “进步”，人文类话题更佳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>随着科技的发展 / 进步\u003c/td>\n\u003ctd>With the development of technology\u003c/td>\n\u003ctd>6.0 基础\u003c/td>\n\u003ctd>通用写法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>随着经济全球化\u003c/td>\n\u003ctd>With \u003cmark>economic globalisation\u003c/mark>\u003c/td>\n\u003ctd>6.5 首选\u003c/td>\n\u003ctd>\u003cstrong>重点！名词短语，直接套用\u003c/strong>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h2\">阻止，阻碍\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>词性\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>写作例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>barrier\u003c/strong>\u003c/td>\n\u003ctd>n.\u003c/td>\n\u003ctd>障碍，阻碍（⭐首选，最高频）\u003c/td>\n\u003ctd>Language can be a barrier to international communication.\u003cbr>\u003cbr>语言会成为国际交流的阻碍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>impede\u003c/strong>\u003c/td>\n\u003ctd>v.\u003c/td>\n\u003ctd>阻碍，妨碍（高分动词）\u003c/td>\n\u003ctd>High costs impede the popularity of new technology.\u003cbr>\u003cbr>高昂成本阻碍新技术普及。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>restrict\u003c/strong>\u003c/td>\n\u003ctd>v.\u003c/td>\n\u003ctd>限制，阻碍发展\u003c/td>\n\u003ctd>Financial pressure restricts people’s choices.\u003cbr>\u003cbr>经济压力阻碍人们的选择。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>prevent\u003c/strong>\u003c/td>\n\u003ctd>v.\u003c/td>\n\u003ctd>阻止，阻碍（基础简单词）\u003c/td>\n\u003ctd>Such problems prevent society from developing rapidly.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"h3\">忽视\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英语表达\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用语境\u003c/th>\n\u003cth>例句（雅思写作风格）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>overlook\u003c/strong>\u003c/td>\n\u003ctd>忽略、未注意到\u003c/td>\n\u003ctd>指无意中漏掉或未充分重视\u003c/td>\n\u003ctd>\u003cem>The government tends to \u003cstrong>overlook\u003c/strong> the needs of rural communities.\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>neglect\u003c/strong>\u003c/td>\n\u003ctd>疏忽、疏于照顾\u003c/td>\n\u003ctd>指未尽到责任或义务（常带负面评价）\u003c/td>\n\u003ctd>\u003cem>Parents who \u003cstrong>neglect\u003c/strong> their children&#39;s emotional development may cause long-term harm.\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>disregard\u003c/strong>\u003c/td>\n\u003ctd>漠视、不理会\u003c/td>\n\u003ctd>指完全不把某事物当回事（语气很强）\u003c/td>\n\u003ctd>\u003cem>A complete \u003cstrong>disregard\u003c/strong> for environmental regulations will invite severe penalties.\u003c/em>\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h4\">学习知识\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003cth>适用场景例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>absorb knowledge\u003c/td>\n\u003ctd>吸收知识（侧重沉浸式）\u003c/td>\n\u003ctd>Cinema-goers \u003cstrong>absorb knowledge\u003c/strong> via immersive shows.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>broaden one’s horizons\u003c/td>\n\u003ctd>开阔眼界（文化话题万能）\u003c/td>\n\u003ctd>Live performances \u003cstrong>broaden young people’s horizons\u003c/strong>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enrich one’s understanding\u003c/td>\n\u003ctd>加深、丰富认知\u003c/td>\n\u003ctd>Films \u003cstrong>enrich viewers’ understanding\u003c/strong> of local culture.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h5\">居民，人，劳动力\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>释义\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>residents\u003c/mark>\u003c/td>\n\u003ctd>居民（首选，楼房、社区、城市）\u003c/td>\n\u003ctd>Local residents have little access to sunlight.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>inhabitants\u003c/td>\n\u003ctd>居民、常住者（偏书面，城市 / 地区）\u003c/td>\n\u003ctd>The inhabitants suffer from blocked sunlight.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>individuals\u003c/mark>\u003c/td>\n\u003ctd>人们，个体（写作高频）\u003c/td>\n\u003ctd>正式，议论文万能替换 people\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>citizens\u003c/td>\n\u003ctd>市民（城市、公共政策话题）\u003c/td>\n\u003ctd>Citizens hope for better living environments.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>the public\u003c/mark>\u003c/td>\n\u003ctd>大众，公众（公共设施、安全政策）\u003c/td>\n\u003ctd>The public need effective safety measures.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>workers / employees\u003c/td>\n\u003ctd>上班族（职场话题）\u003c/td>\n\u003ctd>New employees are less capable than senior staff.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>workforce\u003c/mark>\u003c/td>\n\u003ctd>全体从业人员、劳动力【强烈推荐】\u003c/td>\n\u003ctd>The company’s workforce needs emergency training.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h6\">倡导、引领、推动\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文含义\u003c/th>\n\u003cth>例句参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>encourage\u003c/td>\n\u003ctd>鼓励，倡导（基础万能）\u003c/td>\n\u003ctd>The government encourages green lifestyles.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>promote\u003c/td>\n\u003ctd>推动；倡导（最高频首选）\u003c/td>\n\u003ctd>The government promotes public transport.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>advocate\u003c/mark>\u003c/td>\n\u003ctd>倡导（理念、政策、生活方式）\u003c/td>\n\u003ctd>Officials advocate energy-saving habits.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h7\">实施，出台，颁布，推行\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文词汇\u003c/th>\n\u003cth>中文对应\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>introduce\u003c/td>\n\u003ctd>出台（政策）\u003c/td>\n\u003ctd>The government introduced new housing policies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>launch\u003c/mark>\u003c/td>\n\u003ctd>推行、推出（计划）\u003c/td>\n\u003ctd>The city launched a plan to build more flats.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>implement\u003c/mark>\u003c/td>\n\u003ctd>实施（落实执行）\u003c/td>\n\u003ctd>The new rules were implemented last month.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>carry out\u003c/td>\n\u003ctd>实施、落实\u003c/td>\n\u003ctd>Local councils carry out the housing policy.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>enforce\u003c/td>\n\u003ctd>强制执行\u003c/td>\n\u003ctd>Strict building laws are enforced in big cities.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h8\">处理，应对\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文表达\u003c/th>\n\u003cth>中文含义\u003c/th>\n\u003cth>使用场景 &amp; 区别\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cmark>cope with\u003c/mark>\u003c/td>\n\u003ctd>应对（难题、压力）\u003c/td>\n\u003ctd>侧重主动面对困难、压力、社会问题\u003c/td>\n\u003ctd>Many young people can’t cope with high living costs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cmark>deal with\u003c/mark>\u003c/td>\n\u003ctd>处理，应对\u003c/td>\n\u003ctd>万能基础词，人 / 事 / 问题通用，口语首选\u003c/td>\n\u003ctd>Governments need to deal with housing shortages.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>handle\u003c/td>\n\u003ctd>妥善处理、应付\u003c/td>\n\u003ctd>侧重有能力处理事务、麻烦\u003c/td>\n\u003ctd>Cities need to handle the fast growth of population.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resolve\u003c/td>\n\u003ctd>解决（纠纷、矛盾、问题）\u003c/td>\n\u003ctd>侧重彻底化解问题\u003c/td>\n\u003ctd>These rules help resolve the lack of homes.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h9\">严重的，恶劣的\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>侧重点\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>serious\u003c/td>\n\u003ctd>通用，可形容问题、情况、后果\u003c/td>\n\u003ctd>Serious housing shortages appear in big cities.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>severe\u003c/td>\n\u003ctd>程度极强，恶劣严峻（压力、短缺、天气）\u003c/td>\n\u003ctd>Young people face severe pressure from living costs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical\u003c/td>\n\u003ctd>情况危急、十分严重\u003c/td>\n\u003ctd>The lack of affordable houses has become critical.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h10\">减轻（压力，负担）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文\u003c/th>\n\u003cth>搭配 &amp; 用法\u003c/th>\n\u003cth>例句\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>reduce\u003c/td>\n\u003ctd>reduce pressure /reduce burdens 通用\u003c/td>\n\u003ctd>The policy can reduce people’s living pressure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ease\u003c/td>\n\u003ctd>ease pressure /\u003cmark>ease the burden\u003c/mark>（高频）\u003c/td>\n\u003ctd>Building cheap flats eases young people’s burden.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>relieve\u003c/td>\n\u003ctd>relieve stress / relieve financial burden\u003c/td>\n\u003ctd>More affordable housing relieves economic stress.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n","toc":[{"level":2,"id":"h1","text":"随着...的发展"},{"level":2,"id":"h2","text":"阻止，阻碍"},{"level":2,"id":"h3","text":"忽视"},{"level":3,"id":"h4","text":"学习知识"},{"level":3,"id":"h5","text":"居民，人，劳动力"},{"level":3,"id":"h6","text":"倡导、引领、推动"},{"level":3,"id":"h7","text":"实施，出台，颁布，推行"},{"level":3,"id":"h8","text":"处理，应对"},{"level":3,"id":"h9","text":"严重的，恶劣的"},{"level":3,"id":"h10","text":"减轻（压力，负担）"}],"text":"随着...的发展 中文 英文表达 难度 备注 & 适用场景 随着社会的发展 / 进步 With the development of society 6.0 基础款 万能通用，最容易背诵 With the progress of society 6.5 progress 侧重 “进步”，人文类话题更佳 随着科技的发展 / 进步 With the development of technology 6.0 基础 通用写法 随着经济全球化 With economic globalisation 6.5 首选 重点！名词短语，直接套用 阻止，阻碍 英文表达 词性 中文释义 写作例句 barrier n. 障碍，阻碍（⭐首选，最高频） Language can be a barrier to international communication. 语言会成为国际交流的阻碍。 impede v. 阻碍，妨碍（高分动词） High costs impede the popularity of new technology. 高昂成本阻碍新技术普及。 restrict v. 限制，阻碍发展 Financial pressure restricts people’s choices. 经济压力阻碍人们的选择。 prevent v. 阻止，阻碍（基础简单词） Such problems prevent society from developing rapidly. 忽视 英语表达 中文释义 适用语境 例句（雅思写作风格） overlook 忽略、未注意到 指无意中漏掉或未充分重视 The government tends to overlook the needs of rural communities. neglect 疏忽、疏于照顾 指未尽到责任或义务（常带负面评价） Parents who neglect their children's emotional development may cause long-term harm. disregard 漠视、不理会 指完全不把某事物当回事（语气很强） A complete disregard for environmental regulations will invite severe penalties. 学习知识 英文短语 中文释义 适用场景例句 absorb knowledge 吸收知识（侧重沉浸式） Cinema-goers absorb knowledge via immersive shows. broaden one’s horizons 开阔眼界（文化话题万能） Live performances broaden young people’s horizons. enrich one’s understanding 加深、丰富认知 Films enrich viewers’ understanding of local culture. 居民，人，劳动力 表达 释义 例句 residents 居民（首选，楼房、社区、城市） Local residents have little access to sunlight. inhabitants 居民、常住者（偏书面，城市 / 地区） The inhabitants suffer from blocked sunlight. individuals 人们，个体（写作高频） 正式，议论文万能替换 people citizens 市民（城市、公共政策话题） Citizens hope for better living environments. the public 大众，公众（公共设施、安全政策） The public need effective safety measures. workers / employees 上班族（职场话题） New employees are less capable than senior staff. workforce 全体从业人员、劳动力【强烈推荐】 The company’s workforce needs emergency training. 倡导、引领、推动 英文表达 中文含义 例句参考 encourage 鼓励，倡导（基础万能） The government encourages green lifestyles. promote 推动；倡导（最高频首选） The government promotes public transport. advocate 倡导（理念、政策、生活方式） Officials advocate energy-saving habits. 实施，出台，颁布，推行 英文词汇 中文对应 例句 introduce 出台（政策） The government introduced new housing policies. launch 推行、推出（计划） The city launched a plan to build more flats. implement 实施（落实执行） The new rules were implemented last month. carry out 实施、落实 Local councils carry out the housing policy. enforce 强制执行 Strict building laws are enforced in big cities. 处理，应对 英文表达 中文含义 使用场景 & 区别 例句 cope with 应对（难题、压力） 侧重主动面对困难、压力、社会问题 Many young people can’t cope with high living costs. deal with 处理，应对 万能基础词，人 / 事 / 问题通用，口语首选 Governments need to deal with housing shortages. handle 妥善处理、应付 侧重有能力处理事务、麻烦 Cities need to handle the fast growth of population. resolve 解决（纠纷、矛盾、问题） 侧重彻底化解问题 These rules help resolve the lack of homes. 严重的，恶劣的 单词 侧重点 例句 serious 通用，可形容问题、情况、后果 Serious housing shortages appear in big cities. severe 程度极强，恶劣严峻（压力、短缺、天气） Young people face severe pressure from living costs. critical 情况危急、十分严重 The lack of affordable houses has become critical. 减轻（压力，负担） 英文 搭配 & 用法 例句 reduce reduce pressure /reduce burdens 通用 The policy can reduce people’s living pressure. ease ease pressure /ease the burden（高频） Building cheap flats eases young people’s burden. relieve relieve stress / relieve financial burden More affordable housing relieves economic stress."},{"id":"a-w-map","origin":"author","group":"a-w","file":"原作者笔记/作文/做题技巧/1-2 地图.md","title":"地图词汇","html":"\u003ch2 id=\"h1\">开头\u003c/h2>\n\u003ch2 id=\"h2\">概述\u003c/h2>\n\u003cp>总结最核心的 2-3 个整体特征，不写具体数字和细节\u003cbr>必写角度：① 功能转变；② 设施增减趋势；③ 最显著的变化\u003c/p>\n\u003ch3 id=\"h3\">地点/区域/场地\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>单词\u003c/th>\n\u003cth>核心含义\u003c/th>\n\u003cth>使用场景（地图题区分）\u003c/th>\n\u003cth>例句参考\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>site\u003c/strong>\u003c/td>\n\u003ctd>场地、原址（一片规划地块）\u003c/td>\n\u003ctd>✅ \u003cstrong>题目标配词\u003c/strong>；侧重「特定建设地点、整片场地」\u003cbr>\u003cbr>常搭配：the site of …\u003c/td>\n\u003ctd>The plans show the site of Beechwood Farm.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>land\u003c/strong>\u003c/td>\n\u003ctd>土地、地块（通用，最基础）\u003c/td>\n\u003ctd>✅ 泛指土地；可指农业用地、空地\u003cbr>\u003cbr>不可数为主\u003c/td>\n\u003ctd>The land between the river and roads was split into three plots.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>area\u003c/strong>\u003c/td>\n\u003ctd>区域、片区（万能通用）\u003c/td>\n\u003ctd>✅ 最百搭；大小地块都能用\u003cbr>\u003c/td>\n\u003ctd>This area was used as a sheep pasture.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>plot\u003c/strong>\u003c/td>\n\u003ctd>小块土地、园地\u003c/td>\n\u003ctd>✅ 分割出来的小块耕地 / 园地（果园、菜地首选）\u003c/td>\n\u003ctd>three plots for fruit trees and vegetables\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>field\u003c/strong>\u003c/td>\n\u003ctd>田地、开阔场地\u003c/td>\n\u003ctd>✅ 农田、放牧区、露营场地（高频！）\u003cbr>sheep field / camping field\u003c/td>\n\u003ctd>The sheep field was transformed into a camping area.\u003c/td>\n\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>方位\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>英文短语\u003c/th>\n\u003cth>中文释义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>be located in the northern part of\u003c/td>\n\u003ctd>位于…… 的北部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>be situated at the centre of\u003c/td>\n\u003ctd>坐落于…… 中心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in the north-eastern corner\u003c/td>\n\u003ctd>在东北角\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adjacent to\u003c/td>\n\u003ctd>紧邻；毗邻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>in close proximity to\u003c/td>\n\u003ctd>紧靠（书面替换 next to）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>surrounded by\u003c/td>\n\u003ctd>被…… 环绕\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>separated by\u003c/td>\n\u003ctd>被…… 隔开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the main road\u003c/td>\n\u003ctd>沿着主干道\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>along the coastline\u003c/td>\n\u003ctd>沿着海岸线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>on the eastern peninsula\u003c/td>\n\u003ctd>在东部半岛上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>at the foot of the mountain\u003c/td>\n\u003ctd>在山脚下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>beside the river\u003c/td>\n\u003ctd>在河边\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>to the northwest side of\u003c/td>\n\u003ctd>在…… 西北侧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>within the boundary of\u003c/td>\n\u003ctd>在…… 边界范围内\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>outside the town centre\u003c/td>\n\u003ctd>在城镇中心外围\
